<!DOCTYPE html>
<html lang="en"><head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

/* "Save to Documentation" buttons stay hidden until the hub switches them on (window.fthDocs.attach) */
[data-fth-doc][hidden]{display:none!important}

:root{--fth-cat:#ff7152;--fth-accent:#ff7152;--fth-accent-ink:#ff7152;--fth-accent-soft:rgba(255,113,82,0.14);--fth-accent-line:rgba(255,113,82,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#944230;--fth-accent-ink:#944230;--fth-accent-soft:rgba(255,113,82,0.16);--fth-accent-line:rgba(255,113,82,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>

<meta charset="utf-8"><title>Camera Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--fth-display);color:var(--fth-text);background:var(--fth-bg);display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(400px,44%) 1fr}
.app>*{min-width:0}
.ed{padding:6px 22px 48px;border-right:1px solid var(--fth-line);overflow:auto}
.pvw{padding:0 24px 40px;overflow:auto}
.intro{color:var(--fth-muted);margin:16px 0 4px;font-size:13.5px;max-width:62ch}
.sub{color:var(--fth-muted);margin:0 0 10px;font-size:12.5px}
.status{font:500 11px var(--fth-mono);letter-spacing:.04em;color:var(--fth-faint);white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.g .w{grid-column:1/-1}.g3{grid-template-columns:1fr 1fr 1fr}
.ed label{display:flex;align-items:center;margin-bottom:5px;font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.ed label.ck{font:400 13.5px/1.4 var(--fth-display);letter-spacing:0;text-transform:none;color:var(--fth-text);gap:8px;margin:0;cursor:pointer}
.inline{display:flex;gap:8px;align-items:center;color:var(--fth-muted);font-size:13px}
.inline .fth-input{width:80px}
.tip{display:none;margin:2px 0 8px}.tip.on{display:block}
.fth-sec .fth-info{margin-left:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.tw{overflow-x:auto;border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-bg2)}
table.t{border-collapse:collapse;min-width:100%}
.t th{font:500 10px/1.2 var(--fth-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fth-muted);text-align:left;white-space:nowrap;padding:9px 6px 7px;border-bottom:1px solid var(--fth-line);background:var(--fth-surface)}
.t td{padding:3px;border-bottom:1px solid var(--fth-line)}
.t tr:last-child td{border-bottom:0}
.t td:first-child{padding-left:6px}
.t .fth-input{min-width:60px;padding:5px 7px;font-size:13px;border-radius:6px;background:var(--fth-surface);border-color:var(--fth-line)}
.t .fth-input.n{min-width:0;width:58px}.t .fth-input.wide{min-width:200px}
.t select.fth-input{min-width:0;width:66px}
.x{color:var(--fth-faint)}.x:hover{color:var(--fth-bad)}
.empty{padding:14px;color:var(--fth-muted);font-size:13px}
.fs{margin:14px 0 0;padding:14px 16px;border:1px solid var(--fth-accent-line);border-radius:var(--fth-radius-sm);background:var(--fth-accent-soft)}
.fs-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-bottom:6px}
.fs .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.fs select{flex:1;min-width:220px}
.fs .lbl{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);width:100%;margin-top:6px}
.fs .note{margin:10px 0 0;font-size:12.5px;color:var(--fth-muted)}.fs .note.stale{color:var(--fth-warn);font-weight:600}
.opts{display:grid;gap:10px}
.optc{border:1px solid var(--fth-line);border-radius:11px;padding:10px 12px;background:var(--fth-bg2)}
.optc .inline{margin:8px 0 0 26px;flex-wrap:wrap}
.optc p{margin:4px 0 0 26px;color:var(--fth-muted);font-size:12.5px}
/* preview */
.pvbar{position:sticky;top:0;z-index:4;max-width:794px;margin:0 auto;padding:14px 0 12px;display:flex;gap:10px;align-items:center;background:var(--fth-paper-backdrop)}
.pvbar .sp{flex:1}
.mswitch{display:none}
.fth-toast{white-space:pre-line}

/* ═════ the printed pages (stay white in both themes) ═════ */
#pv{max-width:794px;margin:0 auto;font:10.5px/1.35 Arial,Helvetica,sans-serif;color:#111}
#pv *{box-sizing:border-box}
#pv .sheet{background:#fff;width:100%;min-height:1123px;padding:34px 38px 30px;margin:0 0 22px;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55);display:flex;flex-direction:column}
#pv .hd{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;padding-bottom:10px;border-bottom:2.5px solid #111;margin-bottom:10px}
#pv .kick{font:700 9px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#944230;margin-bottom:7px;display:flex;align-items:center;gap:7px}
#pv .kick::before{content:"";width:8px;height:8px;background:#ff7152;border-radius:50%}
#pv .ln1{font:800 26px/1.02 Archivo,"Arial Narrow",Arial,sans-serif;font-variation-settings:"wdth" 68;text-transform:uppercase;min-height:28px;word-break:break-word}
#pv .ln2{margin-top:5px;font-size:11.5px;color:#333}
#pv .wr{display:inline-block;width:150px;height:22px;border-bottom:2px solid #111;vertical-align:-2px}
#pv .hm{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-content:start;font-size:10px}
#pv .hm span{font:600 8px/1.9 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#666;white-space:nowrap}
#pv .hm b{font-weight:600;border-bottom:1px solid #bbb;min-height:16px}
#pv .ph{display:flex;align-items:center;gap:8px;font:800 12px/1 Archivo,"Arial Narrow",Arial,sans-serif;font-variation-settings:"wdth" 78;text-transform:uppercase;letter-spacing:.04em;padding:0 0 4px;border-bottom:1.2px solid #111;margin:14px 0 6px}
#pv .ph small{margin-left:auto;font:500 8px "JetBrains Mono",monospace;letter-spacing:.06em;color:#777}
#pv table{width:100%;border-collapse:collapse}
#pv th{font:600 7.6px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#333;text-align:left;border:1px solid #111;background:#eef0f0;padding:4px 5px}
#pv td{border:1px solid #444;padding:3px 5px;height:24px;vertical-align:top}
#pv td.c,#pv th.c{text-align:center}
#pv .pre{font-weight:700}
#pv .dim{color:#777}
#pv .bx{display:inline-block;width:11px;height:11px;border:1.1px solid #222;border-radius:2px;vertical-align:-2px}
#pv tr.shot td{background:#fbefec;border-top:1.6px solid #111;font-weight:700}
#pv tr.shot td.d{font-weight:400;font-style:italic}
#pv tr.tk td{height:25px}
#pv .tkn{color:#999;font-size:9px}
#pv .wl{height:21px;border-bottom:1px solid #9a9a9a}
#pv .two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
#pv .frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
#pv .frames div{aspect-ratio:16/9;border:1.2px solid #111;position:relative}
#pv .frames div::after{content:attr(data-l);position:absolute;left:4px;bottom:3px;font:600 7px "JetBrains Mono",monospace;letter-spacing:.06em;color:#888;text-transform:uppercase}
#pv .key{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:9px;color:#444;margin-top:8px}
#pv .key b{color:#111}
#pv .sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px}
#pv .sign div{border-top:1px solid #111;padding-top:3px;font:600 7.6px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#555}
#pv .sp{flex:1}
#pv .ft{display:flex;justify-content:space-between;margin-top:14px;padding-top:6px;border-top:1px solid #ccc;font:500 8px "JetBrains Mono",monospace;letter-spacing:.06em;color:#777;text-transform:uppercase}

@media screen and (max-width:900px){
  html,body{height:auto}body{display:block}
  .app{display:block}.ed{border-right:0;overflow:visible;padding:0 14px 60px}.pvw{overflow:visible;padding:0 10px 40px}
  .mswitch{display:flex;position:sticky;top:0;z-index:31;padding:8px 14px;background:var(--fth-bg);border-bottom:1px solid var(--fth-line)}
  .mswitch button{flex:1;height:34px;border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-muted);font:600 13px var(--fth-display);cursor:pointer}
  .mswitch button:first-child{border-radius:9px 0 0 9px}.mswitch button:last-child{border-radius:0 9px 9px 0;border-left:0}
  .mswitch button.on{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
  body:not(.vpv) .pvw{display:none}body.vpv .ed{display:none}
  #pv .sheet{min-height:0;padding:18px 16px}
}
@media screen and (max-width:560px){.g,.g3{grid-template-columns:1fr}#pv .hd{grid-template-columns:1fr}}
@media print{
  @page{size:A4 portrait;margin:9mm}
  html,body{height:auto;background:#fff}body{display:block}
  .fth-head,.ed,.pvbar,.mswitch,.fth-toast{display:none!important}
  .app{display:block}.pvw{display:block!important;padding:0;overflow:visible;background:#fff}
  #pv{max-width:none}
  #pv .sheet{box-shadow:none;margin:0;padding:0;min-height:277mm;break-after:page}
  #pv .sheet:last-child{break-after:auto}
  #pv tr{break-inside:avoid}
}
/* camera report */
#pv .set{display:grid;grid-template-columns:repeat(5,1fr);border:1.2px solid #111;margin:0 0 8px}
#pv .set div{border-right:1px solid #999;border-bottom:1px solid #999;padding:3px 6px;min-height:34px}
#pv .set div:nth-child(5n){border-right:0}
#pv .set div:nth-last-child(-n+5){border-bottom:0}
#pv .set span{display:block;font:600 7.2px/1.4 "JetBrains Mono",monospace;letter-spacing:.07em;text-transform:uppercase;color:#666}
#pv .set b{font-size:10.5px}
#pv .cardline{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:10px}
#pv .cardline div{border-top:1px solid #111;padding-top:3px;font:600 7.6px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#555}
#pv table.cards td{height:28px}
#pv .warnbox{border:1.4px solid #111;border-radius:4px;padding:6px 9px;font-size:10px;margin:0 0 8px;background:#fbefec}
</style></head><body>
<header class="fth-head">
  <div class="fth-id"><span class="fth-eyebrow" data-fth-cat>03 · Shoot</span><h1 class="fth-title">Camera Report</h1></div>
  <div class="fth-actions">
    <span class="status" id="saveState"></span>
    <button class="fth-btn ghost" id="newBtn">New day</button>
    <span class="fth-vsep"></span>
    <button class="fth-btn" id="docBtn" data-fth-doc hidden></button>
    <button class="fth-btn primary" id="printBtn">Save as PDF</button>
  </div>
</header>
<div class="mswitch"><button data-view="ed" class="on">Fill in</button><button data-view="pv">Preview &amp; print</button></div>
<div class="app">
  <div class="ed" id="ed"></div>
  <div class="pvw fth-paper-wrap" id="pvw">
    <div class="pvbar"><span class="fth-label">Preview · A4</span><span class="sp"></span><span class="fth-label" id="pvCount"></span></div>
    <div id="pv"></div>
  </div>
</div>
<div class="fth-toast" id="toast"></div>
<script>
'use strict';
/* ───────── state ───────── */
const KEY="fth-camera-report-v1";
const blank=()=>({title:"",company:"",director:"",dp:"",ac1:"",ac2:"",dit:"",
  date:"",day:"",days:"",unit:"Main unit",
  cams:"A",body:"",format:"",fps:"25",shutter:"",iso:"",wb:"",lut:"",aspect:"",tc:"Record run",media:"",
  shots:[],
  opt:{report:true,takeLines:3,takePages:1,cards:true,cardRows:16},fs:null,sl:null});
let S=blank(),savedAt=0;
try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o&&o.S){S=Object.assign(blank(),o.S);S.opt=Object.assign(blank().opt,o.S.opt||{});savedAt=o.at||0}}catch(e){}
if(!Array.isArray(S.shots))S.shots=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let saveT;function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify({S,at:savedAt}));showSaved()}catch(e){$("#saveState").textContent="Couldn’t save in this browser"}},400)}
function showSaved(){$("#saveState").textContent=savedAt?"Saved in this browser · "+new Date(savedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),3200)}

/* ───────── help ───────── */
const INFO={
fs:"Pick a shoot day from the Production Schedule Builder to fill in the date, day number and production details. Then pick a day from the Shot List to pre-print its shots, with their camera, lens, frame rate and filters. Anything you've typed in the production details is kept.",
prod:"These print at the top of every sheet. The 2nd AC / loader's name goes on the camera report; the DIT or data wrangler signs the card log.",
day:"The date and shoot day print on every sheet.",
cam:"The day's standard settings. They print in a box at the top of each camera report, so only changes need writing next to a take. Leave any blank to fill in by hand. List more than one camera (A, B) to get a separate report for each.",
shots:"Shots planned for the day, in shooting order. Each prints as a shaded row on the camera report, with blank take lines under it. Shots marked for one camera only go on that camera's report; blank or A + B go on both. Leave this empty for a fully blank report.",
print:"Choose which sheets go in the pack. Everything prints on A4 portrait, ready for a clipboard or the camera cart."};
const info=k=>INFO[k]?`<b class="fth-info" title="What is this?" data-tip="1">i</b>`:"",tip=k=>`<div class="tip fth-tip">${INFO[k]||""}</div>`;
const F=(l,k,t="text",w,ph)=>`<div class="${w?"w":""}"><label>${l}</label><input class="fth-input" type="${t}" data-k="${k}" value="${esc(S[k])}"${ph?` placeholder="${esc(ph)}"`:""}></div>`;
function tbl(n,cols){const rows=S[n];if(!rows.length)return `<div class="tw"><div class="empty">No shots yet: the camera report will print blank.</div></div><div class="bar"><button class="fth-btn sm" data-add="${n}">＋ Add row</button></div>`;
return `<div class="tw"><table class="t"><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th></th></tr>`+rows.map((r,i)=>`<tr>${cols.map(c=>{const v=r[c[0]]??"",a=`data-a="${n}" data-i="${i}" data-k="${c[0]}"`;
return `<td><input class="fth-input ${c[2]||""}" ${a} value="${esc(v)}"></td>`}).join("")}<td><button class="fth-btn ghost icon x" data-del="${n}" data-i="${i}" title="Remove row">✕</button></td></tr>`).join("")+`</table></div><div class="bar"><button class="fth-btn sm" data-add="${n}">＋ Add row</button>${rows.length?`<button class="fth-btn sm ghost" data-clear="shots">Clear all shots</button>`:""}</div>`}

/* ───────── editor ───────── */
function form(){const act=document.activeElement,o=S.opt;$("#ed").innerHTML=`
<p class="intro">Print the camera department's paperwork for one shoot day: a camera report for each camera, with the day's shots ready to log, and a card and data log for handing media to the DIT. Fill in the basics here (or bring them in from the schedule and shot list), print, and write the rest on set.</p>
<div id="fs"></div>
<h2 class="fth-sec"><span class="fth-num">01</span>Production ${info("prod")}</h2>${tip("prod")}
<div class="g">${F("Title","title","text",1)}${F("Studio / company","company")}${F("Director","director")}${F("Director of photography","dp")}${F("1st AC / focus puller","ac1")}${F("2nd AC / loader","ac2")}${F("DIT / data wrangler","dit")}</div>
<h2 class="fth-sec"><span class="fth-num">02</span>Shoot day ${info("day")}</h2>${tip("day")}
<div class="g">${F("Date","date","date")}<div><label>Shoot day</label><div class="inline"><input class="fth-input" type="number" min="1" data-k="day" value="${esc(S.day)}"> of <input class="fth-input" type="number" min="1" data-k="days" value="${esc(S.days)}"></div></div>
${F("Unit","unit")}</div>
<h2 class="fth-sec"><span class="fth-num">03</span>Camera and settings ${info("cam")}</h2>${tip("cam")}
<div class="g">${F("Camera(s)","cams","text",0,"e.g. A, B")}${F("Camera body","body","text",0,"e.g. Sony FX6")}${F("Media","media","text",0,"e.g. CFexpress A, 160GB")}${F("Format / codec","format","text",0,"e.g. 4K XAVC-I")}
${F("Frame rate","fps")}${F("Shutter","shutter","text",0,"e.g. 180° or 1/50")}${F("ISO / EI","iso")}${F("White balance","wb","text",0,"e.g. 5600K")}${F("LUT / look","lut")}${F("Aspect ratio","aspect","text",0,"e.g. 2.39:1")}${F("Timecode","tc","text",0,"e.g. Record run, synced to sound")}</div>
<h2 class="fth-sec"><span class="fth-num">04</span>Shots ${info("shots")}</h2>${tip("shots")}
${tbl("shots",[["sc","Sc","n"],["shot","Slate / shot","n"],["cam","Cam","n"],["lens","Lens","n"],["fps","FPS","n"],["filt","Filter","n"],["desc","Description","wide"],["takes","Est. takes","n"]])}
<h2 class="fth-sec"><span class="fth-num">05</span>What to print ${info("print")}</h2>${tip("print")}
<div class="opts">
<div class="optc"><label class="ck"><input type="checkbox" data-o="report" ${o.report?"checked":""}> Camera report, one per camera</label>
<div class="inline">Take lines per shot <input class="fth-input" type="number" min="1" max="15" data-o="takeLines" value="${o.takeLines}"> · extra blank pages <input class="fth-input" type="number" min="0" max="10" data-o="takePages" value="${o.takePages}"></div></div>
<div class="optc"><label class="ck"><input type="checkbox" data-o="cards" ${o.cards?"checked":""}> Card and data log</label><p>Each card from camera to DIT: offloaded, checked, backed up twice, then cleared to format.</p>
<div class="inline">Rows <input class="fth-input" type="number" min="5" max="20" data-o="cardRows" value="${o.cardRows}"></div></div>
</div>`;
fsRender();
if(act&&act.dataset&&(act.dataset.k||act.dataset.o)){const q=act.dataset.o?`[data-o="${act.dataset.o}"]`:`[data-k="${act.dataset.k}"]`+(act.dataset.a?`[data-a="${act.dataset.a}"][data-i="${act.dataset.i}"]`:":not([data-a])");const n=$(q);n&&n.focus()}}

/* ───────── reading the schedule and shot list (read only) ───────── */
const SCHED_KEY="fth-schedule-v1",SHOT_KEY="shot-list-builder-v1";
const rj=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
function schedLoad(){const o=rj(SCHED_KEY);if(!o||!o.S||!Array.isArray(o.S.days))return null;const Q=o.S;return Q.days.some(d=>(d.items||[]).some(r=>r.t=="s"))?Q:null}
function shotLoad(){const o=rj(SHOT_KEY);if(!o||!Array.isArray(o.days))return null;return o.days.some(d=>(d.rows||[]).some(r=>r.type==="shot"&&(r.scene||r.shot||r.description)))?o:null}
const qIso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function qDates(Q){const out=[];Q.days.forEach((d,i)=>{if(d.date){out.push(d.date);return}const base=i?out[i-1]:Q.start;if(!base){out.push("");return}
const x=new Date(base+"T12:00");if(i)x.setDate(x.getDate()+1);if(Q.skipWk)while(x.getDay()==0||x.getDay()==6)x.setDate(x.getDate()+1);out.push(qIso(x))});return out}
const sig=t=>{t=JSON.stringify(t);let h=5381;for(let k=0;k<t.length;k++)h=(h*33^t.charCodeAt(k))>>>0;return h.toString(36)};
const qSig=(Q,i)=>sig([Q.days[i],qDates(Q)[i],Q.title,Q.company,Q.director]);
const short=ds=>ds?new Date(ds+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"";
const slShots=d=>(d.rows||[]).filter(r=>r.type==="shot");
function fsRender(){const el=$("#fs");if(!el)return;const Q=schedLoad(),L=shotLoad();
const head=`<div class="fs-h">Fill from Schedule and Shot List ${info("fs")}</div>${tip("fs")}`;
if(!Q&&!L){el.innerHTML=`<div class="fs">${head}<p class="note" style="margin-top:4px">Nothing to bring in yet. Build your shoot days in the Production Schedule Builder (and your shots in the Shot List Builder) for this project and they'll appear here.</p></div>`;return}
let h=`<div class="fs">${head}`;
if(Q){const ds=qDates(Q),f=S.fs&&Q.days[S.fs.day]?S.fs:null;let sel=f?f.day:ds.indexOf(S.date);if(sel<0)sel=0;const stale=f&&f.sig!==qSig(Q,f.day);
  h+=`<div class="lbl">Schedule</div><div class="row"><select class="fth-input" id="fsDay" aria-label="Shoot day">${Q.days.map((d,i)=>{const n=(d.items||[]).filter(r=>r.t=="s").length;return `<option value="${i}" ${i==sel?"selected":""}>${esc(`Day ${i+1}`+(ds[i]?" · "+short(ds[i]):"")+` · ${n} scene${n==1?"":"s"}`)}</option>`}).join("")}</select><button class="fth-btn primary sm" data-fsgo="1">${f?"Fill again":"Fill day"}</button></div>`;
  if(f)h+=`<p class="note${stale?" stale":""}">${stale?`⚠ Day ${f.day+1} has changed in the schedule since this was filled. Press Fill again to bring it up to date.`:`Filled from Day ${f.day+1} of the schedule.`}</p>`}
if(L){const days=L.days.map((d,i)=>({d,i})).filter(x=>slShots(x.d).length);let sel=S.sl&&L.days[S.sl.day]?S.sl.day:(days.find(x=>S.date&&x.d.date===S.date)||days[0]).i;
  h+=`<div class="lbl">Shot List</div><div class="row"><select class="fth-input" id="slDay" aria-label="Shot list day">${days.map(({d,i})=>{const n=slShots(d).length;return `<option value="${i}" ${i==sel?"selected":""}>${esc((d.name||"Day "+(i+1))+(d.date?" · "+short(d.date):"")+` · ${n} shot${n==1?"":"s"}`)}</option>`}).join("")}</select><button class="fth-btn primary sm" data-slgo="1">${S.sl?"Bring in again":"Bring in shots"}</button></div>`;
  if(S.sl&&L.days[S.sl.day]){const stale=S.sl.sig!==sig(slShots(L.days[S.sl.day]));h+=`<p class="note${stale?" stale":""}">${stale?"⚠ Those shots have changed in the Shot List. Press Bring in again to update the report.":`Shots from ${esc(L.days[S.sl.day].name||"the Shot List")}.`}</p>`}}
el.innerHTML=h+`</div>`}
function fsFill(i){const Q=schedLoad();if(!Q||!Q.days[i])return;const ds=qDates(Q);
[["title","title"],["company","company"],["director","director"]].forEach(([a,b])=>{if(!String(S[a]||"").trim()&&Q[b])S[a]=Q[b]});
if(ds[i])S.date=ds[i];S.day=String(i+1);S.days=String(Q.days.length);
S.fs={day:i,sig:qSig(Q,i)};form();prev();persist();toast(`Filled from Day ${i+1} of the schedule.`)}
const camsOf=v=>[...new Set(String(v||"").toUpperCase().split(/[^A-Z]+/).filter(x=>x.length===1))];
function slFill(i){const L=shotLoad();if(!L||!L.days[i])return;const day=L.days[i],rows=slShots(day);
if(S.shots.some(r=>Object.values(r).some(v=>v))&&!confirm("Replace the shots on the camera report with the ones from the Shot List?"))return;
const none=v=>/^none$/i.test(String(v||"").trim())?"":v||"";
S.shots=rows.map(r=>({sc:r.scene||"",shot:r.shot||"",cam:r.camera||"",lens:r.lens||"",fps:r.fps||"",filt:none(r.filters),desc:[r.size,r.description].filter(Boolean).join(" · "),takes:r.takes?String(r.takes):""}));
/* cameras: every letter used in the day's shots, if the shot list says */
const used=[...new Set(rows.flatMap(r=>camsOf(r.camera)))].sort();if(used.length)S.cams=used.join(", ");
if(!S.date&&day.date)S.date=day.date;
S.sl={day:i,sig:sig(rows)};form();prev();persist();toast(`${rows.length} shot${rows.length==1?"":"s"} brought in from the Shot List.`)}

/* ───────── the printed pages ───────── */
const niceDate=ds=>ds?new Date(ds+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
const lines=n=>Array.from({length:n},()=>'<div class="wl"></div>').join("");
const dayTxt=()=>S.day?`Day ${esc(S.day)}${S.days?" of "+esc(S.days):""}`:"Day ___ of ___";
function head(kind,big,extra){return `<div class="hd"><div><div class="kick">${kind}</div><div class="ln1">${big}</div><div class="ln2">${esc(S.company)}</div></div>
<div class="hm"><span>Date</span><b>${esc(niceDate(S.date))}</b><span>Shoot day</span><b>${dayTxt()}${S.unit?" · "+esc(S.unit):""}</b>${extra||""}</div></div>`}
const foot=(what,n,of)=>`<div class="sp"></div><div class="ft"><span>${esc(S.title||"Film Tool Hub")} · ${what}</span><span>Page ${n} of ${of}</span></div>`;
const camList=()=>{const c=camsOf(S.cams);return c.length?c:["A"]};
const forCam=(r,c)=>{const cs=camsOf(r.cam);return !cs.length||cs.includes(c)};
const KEYTXT=`<div class="key"><span><b>◯</b> circled take = print / good</span><span><b>NG</b> no good</span><span><b>FS</b> false start</span><span><b>INC</b> incomplete</span><span><b>MOS</b> no sound</span><span><b>HS</b> high speed</span><span><b>PU</b> pick-up</span><span><b>RO</b> roll out (card full)</span></div>`;
const TK_ROWS=28;
function takePages(c){const o=S.opt,n=Math.max(1,Math.min(15,parseInt(o.takeLines)||3)),items=[];
S.shots.filter(r=>Object.values(r).some(v=>String(v||"").trim())&&forCam(r,c)).forEach(r=>{const k=Math.max(n,Math.min(15,(parseInt(r.takes)||0)+1));items.push({h:r,k})});
const pages=[];let cur=[],left=TK_ROWS;
items.forEach(it=>{let k=it.k,first=true,tk=1;while(k>0){if(left<(first?3:2)){pages.push(cur);cur=[];left=TK_ROWS}
  const fit=Math.min(k,left-1);cur.push({h:it.h,cont:!first,from:tk,n:fit});left-=fit+1;k-=fit;tk+=fit;first=false}});
if(cur.length)pages.push(cur);
for(let i=0;i<Math.max(0,parseInt(o.takePages)||0);i++)pages.push(null);
if(!pages.length)pages.push(null);return pages}
const SETS=[["Camera body","body"],["Media","media"],["Format / codec","format"],["Frame rate","fps"],["Shutter","shutter"],["ISO / EI","iso"],["White balance","wb"],["LUT / look","lut"],["Aspect ratio","aspect"],["Timecode","tc"]];
function pReport(c,blocks){let rows="",used=0;const E=`<td></td>`;
(blocks||[]).forEach(b=>{const h=b.h,fpsDiff=h.fps&&String(h.fps).trim()!==String(S.fps||"").trim();
  rows+=`<tr class="shot"><td class="c">${esc(h.sc)}</td><td class="c">${esc(h.shot)}</td><td></td><td></td><td class="c">${esc(h.lens)}</td><td></td><td class="c">${esc(h.filt)}</td><td class="c">${fpsDiff?esc(h.fps):""}</td><td></td><td class="d">${esc(h.desc)}${b.cont?" (continued)":""}</td></tr>`;
  for(let t=0;t<b.n;t++)rows+=`<tr class="tk">${E}${E}<td class="c tkn">${b.from+t}</td>${E.repeat(7)}</tr>`;used+=b.n+1});
for(;used<TK_ROWS;used++)rows+=`<tr class="tk">${E.repeat(10)}</tr>`;
return `${head("Camera report · Camera "+esc(c),esc(S.title)||"&nbsp;",`<span>Card / roll</span><b></b><span>DP</span><b>${esc(S.dp)}</b><span>2nd AC / loader</span><b>${esc(S.ac2)}</b>`)}
<div class="set">${SETS.map(([l,k])=>`<div><span>${l}</span><b>${esc(S[k])}</b></div>`).join("")}</div>
<table><tr><th class="c" style="width:38px">Sc</th><th class="c" style="width:48px">Slate</th><th class="c" style="width:28px">Tk</th><th class="c" style="width:48px">Clip #</th><th class="c" style="width:52px">Lens</th><th class="c" style="width:40px">T-stop</th><th class="c" style="width:58px">Filter</th><th class="c" style="width:34px">FPS</th><th class="c" style="width:24px">◯</th><th>Notes</th></tr>${rows}</table>${KEYTXT}
<div class="cardline"><div>Card full / ended at clip</div><div>Total clips</div><div>Handed to DIT at</div><div>2nd AC initials</div></div>`}
function pCards(){const n=Math.max(5,Math.min(20,parseInt(S.opt.cardRows)||16)),bx='<span class="bx"></span>';
return `${head("Camera department · Card and data log",esc(S.title)||"&nbsp;",`<span>Cameras</span><b>${esc(camList().join(", "))}</b><span>2nd AC / loader</span><b>${esc(S.ac2)}</b><span>DIT / data</span><b>${esc(S.dit)}</b>`)}
<div class="warnbox"><b>Never format a card until every box on its row is ticked:</b> offloaded, checked against the camera, and backed up to two separate drives. Hand cards over in a marked case, and mark full cards with red tape until they're cleared.</div>
<table class="cards"><tr><th class="c" style="width:46px">Card</th><th class="c" style="width:32px">Cam</th><th class="c" style="width:76px">Clips first – last</th><th class="c" style="width:48px">Size</th><th class="c" style="width:48px">To DIT at</th><th class="c" style="width:48px">Offloaded</th><th class="c" style="width:44px">Checked</th><th class="c" style="width:44px">Backup 1</th><th class="c" style="width:44px">Backup 2</th><th class="c" style="width:52px">Cleared to format</th><th>Initials / notes</th></tr>
${Array.from({length:n},()=>`<tr><td></td><td></td><td></td><td></td><td></td><td class="c">${bx}</td><td class="c">${bx}</td><td class="c">${bx}</td><td class="c">${bx}</td><td class="c">${bx}</td><td></td></tr>`).join("")}</table>
<div class="cardline" style="grid-template-columns:1fr 1fr;margin-top:30px"><div>Cards used today</div><div>Data shot today (GB / TB)</div></div>
<div class="ph">Notes (camera faults, drops, anything for the editor or DIT)</div>${lines(2)}
<div class="sign"><div>2nd AC / loader${S.ac2?": "+esc(S.ac2):""}</div><div>DIT / data wrangler${S.dit?": "+esc(S.dit):""}</div></div>`}
function prev(){const o=S.opt,out=[];
if(o.report)camList().forEach(c=>takePages(c).forEach(b=>out.push(["Camera report · "+c,pReport(c,b)])));
if(o.cards)out.push(["Card and data log",pCards()]);
$("#pv").innerHTML=out.length?out.map((p,i)=>`<div class="sheet">${p[1]}${foot(p[0],i+1,out.length)}</div>`).join(""):`<div class="sheet"><p style="color:#777">Tick at least one sheet under 05 What to print.</p></div>`;
$("#pvCount").textContent=out.length?out.length+" page"+(out.length==1?"":"s"):"";}

/* ───────── events ───────── */
const toNum=(v,lo,hi)=>{v=parseInt(v);return isNaN(v)?lo:Math.max(lo,Math.min(hi,v))};
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.o){const k=t.dataset.o;S.opt[k]=t.type==="checkbox"?t.checked:t.value;prev();persist();return}
  const k=t.dataset.k;if(!k)return;if(t.dataset.a)S[t.dataset.a][+t.dataset.i][k]=t.value;else S[k]=t.value;prev();persist()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.o&&t.type==="number"){const lim={takeLines:[1,15],takePages:[0,10],cardRows:[5,20]}[t.dataset.o];S.opt[t.dataset.o]=toNum(t.value,...lim);t.value=S.opt[t.dataset.o];prev();persist()}});
document.addEventListener("click",e=>{const t=e.target.closest("button,b.fth-info");if(!t)return;
  if(t.dataset.tip){const n=t.closest("h2,.fs-h");const tp=n&&n.nextElementSibling;tp&&tp.classList.toggle("on");return}
  if(t.dataset.fsgo){fsFill(+$("#fsDay").value);return}
  if(t.dataset.slgo){slFill(+$("#slDay").value);return}
  if(t.dataset.add){S[t.dataset.add].push({});form();prev();persist();return}
  if(t.dataset.del){const a=S[t.dataset.del],r=a[+t.dataset.i];if(Object.values(r).some(v=>v)&&!confirm("Remove this row?"))return;a.splice(+t.dataset.i,1);form();prev();persist();return}
  if(t.dataset.clear){if(!confirm("Remove every shot from the camera report?"))return;S.shots=[];S.sl=null;form();prev();persist();return}
  if(t.dataset.view){$$(".mswitch button").forEach(b=>b.classList.toggle("on",b===t));document.body.classList.toggle("vpv",t.dataset.view==="pv");return}});
$("#newBtn").onclick=()=>{if(!confirm("Start a new day? The date and shots are cleared. Production details, camera settings and print choices are kept."))return;
  const keep=["title","company","director","dp","ac1","ac2","dit","unit","days","cams","body","format","fps","shutter","iso","wb","lut","aspect","tc","media","opt"],k={};keep.forEach(x=>k[x]=S[x]);S=Object.assign(blank(),k);form();prev();persist()};
addEventListener("storage",e=>{if(!e.key||e.key===SCHED_KEY||e.key===SHOT_KEY)fsRender()});

/* Documentation (Film Tool Hub): window.fthDocs only exists inside the hub. page() returns true when the person chose
   "Save to Documentation", which means: don't open the print window. */
const fthPage=(type,name,group)=>!!(window.fthDocs&&window.fthDocs.page({type,name,group}));
function pdf(){if(!fthPage("Camera Report PDF","Camera report "+(S.date||"draft")))print()}
$("#printBtn").onclick=pdf;
if(window.fthDocs)fthDocs.attach($("#docBtn"),[{label:"Camera Report PDF",fn:pdf}]);
form();prev();showSaved();
