ection and lighting patterns", "Contrast ratio", "Inverse square law", "Colour temperature and white balance", "Colour rendering and spectrum"]], ["Fixtures", ["Tungsten", "HMI", "LED (panels, tubes, COB)", "Fresnels and open-faced lights", "Soft sources", "Wireless and DMX control"]], ["Shaping & Control", ["Flags and negative fill", "Nets and scrims", "Diffusion", "Bounce and reflect", "Gels (CTO, CTB, corrective)"]], ["Lighting Approach", ["Key, fill, back and background", "Motivated light", "Three-point lighting as a starting point", "Practicals", "Mixed light sources", "Lighting for continuity", "Lighting spaces, not just subjects", "Catchlights"]], ["Lighting Situations", ["Lighting day interiors", "Lighting day exteriors", "Lighting night interiors", "Day-for-night and night exteriors", "Working with only available light", "Atmospherics (haze and smoke)", "Lighting for different skin tones", "Lighting for subject movement"]], ["The Framework (Wandering DP)", ["Upstage Lighting", "Point of Control", "Lighting Triad", "Room Tone (lighting)", "L of the Room", "Salt and Pepper"]], ["Power & Electrical Safety", ["Power calculation and load", "Distribution and cabling", "Generators", "Electrical safety in the UK"]], ["Grip & Rigging", ["C-stands", "Sandbagging and stand safety", "Track and dolly", "Rigging safety", "Advanced grip for lighting"]], ["Cross-Department Awareness", ["RF interference with sound", "Practicals with art department", "Frame lines and boom shadows", "Show LUT and DIT workflow"]]];const CONTENT={"exposure-as-a-system-of-five-elements":{"w":"Exposure is controlled by five elements working together: light, ND, aperture, shutter speed and ISO.","f":"You can diagnose any exposure problem by asking which element to change and what each change costs creatively."},"light-as-an-exposure-element":{"w":"The amount and quality of light on the scene is the first exposure element, and the one you can change most.","f":"You treat light as the primary exposure control, shaping it before reaching for camera settings."},"nd-as-a-core-tool":{"w":"Filters that cut light without changing colour, so you can keep your creative aperture, shutter and ISO choices in bright conditions.","f":"You can calculate the ND a shot needs, choose between types, and plan it across a changing day."},"aperture-and-t-stops":{"w":"The lens opening sets how much light passes through and how deep the focus is; T-stops measure the light actually transmitted.","f":"You choose aperture for its look first, know why cine lenses use T-stops, and predict the effect on depth of field."},"shutter-speed-and-shutter-angle":{"w":"Shutter speed sets the exposure time per frame and so how motion looks; shutter angle expresses it independently of frame rate.","f":"You choose shutter angle deliberately for motion rendering and know how it interacts with frame rate and light flicker."},"iso-and-exposure-index":{"w":"ISO (or exposure index) is the sensitivity setting the image is exposed for, trading noise against usable light.","f":"You choose ISO to protect the image rather than to rescue an exposure."},"base-iso":{"w":"The ISO setting at which a camera’s sensor performs best for noise and dynamic range.","f":"You know your camera’s native ISO, why it is native, and when departing from it is worth the trade-off."},"stops-as-a-common-language":{"w":"A stop is a doubling or halving of light, the shared unit for all five elements.","f":"You move between elements fluently in stops, for example trading three stops of ND for aperture and shutter."},"creative-consequences-of-each-element":{"w":"Each element carries a creative side effect: depth of field, motion blur, noise, light quality.","f":"You choose the combination of elements for the image you want, not just a correct exposure."},"exposure-strategy":{"w":"Deciding what to protect in the frame (shadows, highlights or skin) when you can’t hold everything.","f":"You expose deliberately for the story and the camera’ d:['<b>Neutral density (ND)</b> filters reduce the light reaching the sensor equally across the spectrum, so exposure changes but colour (ideally) doesn’t. In the five-element model of exposure (light, ND, aperture, shutter speed, ISO), ND lets you manage too much light <b>without giving up the creative choices</b> the other elements control.','<b>Why it matters:</b> aperture sets depth of field, shutter speed sets how motion looks, and ISO sets noise and native performance. In bright light, without ND you must stop down, speed the shutter up, or drop ISO below native, and each costs a decision about the image. ND gives that decision back. It is also the only exposure element with no effect on the image other than brightness.','<b>Worked example (approximate):</b> at 24fps with a 180° shutter (about 1/48), ISO 800, the “sunny 16” guide puts direct sun around f/16 at 1/800. Slowing to 1/50 is 4 stops more light; opening from f/16 to f/2.8 is 5 more. That’s roughly 9 stops to lose, which is why exteriors at wide apertures need heavy ND (often stacked, or combined with shade and flags).','<div class="tbl"><div>ND 0.3<small>1 stop</small></div><div>ND 0.6<small>2 stops</small></div><div>ND 0.9<small>3 stops</small></div><div>ND 1.2<small>4 stops</small></div><div>ND 1.8<small>6 stops</small></div></div><p class="tip">Some makers label the same filters ND2, ND4, ND8, ND16 and ND64: same stops, different notation.</p>'],
lad:['I can say what ND is and that it cuts light without (ideally) changing colour.','I can explain why ND is one of five exposure elements, what each other element costs creatively if it compensates for excess light, and convert between ND values and stops.','I can calculate the ND a shot needs, choose between fixed, variable and built-in ND, verify with waveform or false colour, and spot colour cast, IR contamination or banding.','For a stated look I can plan ND across a changing shoot day, predict the settings I’ll end up with, test and explain any mismatch, justify ND against alternatives (flagging, relocating, rescheduling), and teach it to a peer.'],
q:[['You’re shooting an exterior at 24fps, 180° shutter, ISO 800, and want f/2.8 in direct sun. Roughly how many stops over are you, and what are your options?','About 9 stops (4 for the slower shutter, 5 for the wider aperture, using sunny 16 as an approximation). Options: ND (often stacked), shade or flagging the subject, accepting a smaller aperture, and why the other element changes each cost something creative.'],['Why isn’t “just raise the shutter speed” a neutral fix for too much light?','It changes how motion looks (less blur, more strobing) and abandons the shutter angle you chose, so it trades a creative decision for an exposure one.'],['How many stops is ND 0.9, and what else might it be labelled?','3 stops (each 0.3 of density is one stop), so light is cut to 1/8. Often labelled ND8.'],['What might you notice in footage shot through cheap or stacked ND?','Colour casts (including infrared contamination), softness, flare or reflections, and with variable ND at extremes, uneven darkening or banding. Vignetting is possible when stacking on wide lenses.']],
sp:[['read','foundational','Brown, Cinematography: Theory and Practice','Exposure and filters'],['read','foundational','Elkins, The Camera Assistant’s Manual','Filters and matte box practice'],['watch','foundational','Wandering DP','Search: “ND filters”'],['read','deeper','Filter manufacturer guides (Tiffen, Schneider, Formatt-Hitech)','Search: “IRND infrared contamination”, “variable ND cross polarisation”'],['try','foundational','Camera test with your own kit','See the experiment below'],['ask','deeper','Your kit technician','Which NDs do we hold, and which cameras have built-in ND?']],
ex:'Pick a bright exterior (or a window-lit interior). Lock shutter and ISO, then shoot the same subject at a wide aperture with and without ND, and again stopped down to match exposure. Compare depth of field and motion. Then shoot a grey card or plain wall through a variable ND and a stack of fixed NDs, and look for colour shifts or banding. Before you shoot, write down what you expect. Log: ND value, T-stop, shutter, ISO, light conditions.'});

const X=[
['Exposure as a system of five elements','Exposure is the amount of light reaching the sensor over time, controlled by five elements: lighting, ND, aperture, shutter speed and ISO.','You can diagnose any exposure problem by naming which element to change and what else that change affects.',['Exposure is the amount of light that reaches the sensor, creating visual data over a period of time. Five elements each change that amount in their own way: lighting (the origin of every exposure), ND, aperture, shutter speed and ISO.','Aperture, shutter speed and ISO each also change the image in a second way, ND changes nothing but brightness, and lighting alone changes the scene itself. Seeing all five as one connected system stops lighting and ND being treated as separate from exposure.'],
['I can name the five elements and say that each changes how much light reaches the sensor.','I can explain what each element physically does, which ones have a side effect beyond brightness, and why lighting is different from the other four.','Given a scene and a target look, I can say which elements are fixed and which are free, and what to change to reach a correct exposure.','I can diagnose a flawed exposure from the footage alone, predict what each possible fix will change besides brightness, and design an exposure plan for a scene that I test and refine.'],
[['Name the five elements. Which three have a visible side effect besides brightness?','Lighting, ND, aperture, shutter speed, ISO. Aperture (depth of field), shutter speed (motion blur) and ISO (noise) each have one. ND has none, and lighting changes the scene itself.'],['A shot is too bright. What does changing each element cost you?','Lighting: changes the look of the scene (may be the right fix). ND: nothing but brightness. Aperture: depth of field. Shutter: motion blur. ISO: noise, and moving off base.']],'BEW','Take one scene and one camera. List the current value of all five elements, then change one at a time to make the same brightness change and compare what else changes. Write your predictions first.'],
['Light as an exposure element','Lighting is the origin of every exposure and the only element that changes the scene itself, not just how the camera records it.','You treat light as your first exposure control, shaping what is lit and by how much before touching camera settings.',['Light only travels in straight lines and interacts differently with different objects. It is the only exposure element with a local effect: you can brighten or darken one part of the frame without touching the rest. Aperture, shutter speed, ISO and ND are global and change the whole image equally.','That makes lighting the one element that shapes three-dimensional space, not just how it is interpreted, and, paired with ND, the one that gives the filmmaker most control.'],
['I can say that light is the origin of exposure and travels in straight lines.','I can explain local versus global effects on exposure and give an example of each.','I can change the exposure of part of a frame with lighting alone (adding, flagging, moving, distance) and predict the change in stops.','For a scene with a stated look I can plan where light goes so camera settings can stay at their preferred values, test the plan, and explain any gap between prediction and result.'],
[['Which elements have a local effect on the image, and which a global one?','Only lighting is local. ND, aperture, shutter speed and ISO are global and change the whole image equally.'],['A face is two stops darker than the window behind it. Which element can fix that without changing the rest of the frame?','Lighting: add or move light toward the face, or reduce the window with flags or ND gel. Camera-side elements would change the whole frame.']],'BLW','Near a window, change the brightness of a subject by exactly one stop using only light (distance, power or diffusion) with camera settings locked. Predict the change, then check with a meter or false colour.'],
['Aperture','Aperture is the opening in the lens that lets light through. It changes brightness globally and also sets how deep the focus is.','You choose aperture for its depth of field first, and can move through the full-stop sequence fluently.',['Aperture is the size of the hole in the lens. It affects the whole image equally and also changes depth of field: the wider the aperture, the shallower the focus.','Each stop doubles or halves the light: f/1, f/1.4, f/2, f/2.8, f/4, f/5.6, f/8, f/11, f/16, f/22, f/32. Because depth of field matters so much visually, aperture should be chosen for that, not mainly to brighten or darken the image. See T-stops vs. f-stops for how apertures are measured.'],
['I can say aperture is the lens opening and that wider means more light and shallower focus.','I can recite the full-stop sequence and explain why aperture has an effect separate from exposure.','I can choose an aperture for a depth of field I want and keep exposure right using the other elements, especially ND.','I can predict depth of field across several apertures and lenses, test it, and design aperture choices that support a stated storytelling intention.'],
[['Recite the f-stop sequence from f/1 to f/32. What does each step do to the light?','f/1, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22, 32. Each step is one stop: half the light going up the numbers, double going down.'],['Why shouldn’t aperture be your main brightness control?','Aperture changes depth of field, a major creative decision, so ND and lighting should manage brightness instead.']],'BEQ','Frame one subject at every full stop from your widest aperture to f/16, holding brightness constant with ND. Compare background blur and sharpness. Predict the pattern first.'],
['Shutter speed','Shutter speed is how long the sensor is exposed per frame. It changes brightness globally and sets how much motion blur you see.','You choose shutter deliberately for motion rendering, know the frame-rate rule, and can explain what changes if you break it.',['Shutter speed is the length of time the sensor is exposed to light per image: the longer the shutter, the brighter the image and the more motion blur. It is measured in fractions of a second (1/25, 1/50, 1/200).','For video, natural-looking motion blur comes from setting the shutter speed to double the frame rate (24fps gives 1/48, often set as 1/50). Unconventional speeds give unnatural blur, so the rule effectively decides your shutter for you. See Shutter angle for how this is expressed on many cine cameras.'],
['I can say shutter speed is exposure time per frame and that longer shutters give more blur.','I can explain the frame rate × 2 rule, why it gives natural blur, and what happens to blur and brightness if I depart from it.','I can set the right shutter for any frame rate, use ND instead of shutter for brightness, and spot a wrong shutter in footage.','I can choose and justify a deliberate departure from the rule for a specific effect, predict how it will look and what it does to exposure, test it, and explain the result.'],
[['What shutter speed do you use at 25fps and at 50fps, and why?','1/50 at 25fps and 1/100 at 50fps: double the frame rate, which gives natural-looking motion blur.'],['It’s too bright outdoors. Why not raise the shutter speed? What would 1/50 to 1/100 do to brightness?','It reduces blur and makes motion look staccato, so use ND instead. 1/100 is one stop darker than 1/50.']],'BEW','Film the same moving action (someone walking, a fan) at 24fps with shutters of 1/24, 1/48, 1/96 and 1/200, holding brightness with ND. Note how motion feels. Predict first.'],
['ISO and exposure index','ISO is the artificial amplification of the signal from the sensor. It brightens the whole image and adds noise.','You keep ISO at the camera’s base value and treat departures from it as a deliberate trade-off, not a quick brightness fix.',['ISO is the artificial signal amplification the camera applies to the image reaching the sensor. It affects the whole image equally and has an effect separate from brightness: noise, which is generally unwanted and avoided where possible.','It is measured intuitively: 100 ISO is half as bright as 200, which is half as bright as 400. In most cases the other elements are adjusted so the camera stays at its base ISO.'],
['I can say ISO is amplification and that raising it brightens the image and adds noise.','I can explain ISO doublings in stops, why it adds noise, and why we usually avoid changing it.','I can keep a camera at base ISO and reach exposure with the other elements, and know when raising ISO is the least bad option.','I can test my camera’s noise across its ISO range, decide where I would accept noise for a story reason, and justify that from my results.'],
[['How many stops brighter is 800 ISO than 200 ISO?','Two stops (200 to 400 to 800).'],['Why do cinematographers usually keep ISO at base? When might raising it be the best option?','Base gives the cleanest image, and ISO’s side effect is unwanted, so lighting and ND manage brightness. Raising it can be least costly when light can’t be added and aperture and shutter are creatively fixed.']],'SMT','Shoot a mid-grey wall and a dark corner at each ISO your camera offers, holding exposure constant with ND or aperture. Compare shadow noise at 100%. Predict where it becomes unacceptable.'],
['Base ISO','The ISO at which the manufacturer considers the image cleanest, with the least noise. Also called native ISO.','You know your camera’s base ISO, why it matters, and how dual base ISOs change the picture.',['Every camera has a base ISO: the setting the manufacturer considers gives the cleanest image. Generally lower ISOs are cleaner, but base is not necessarily the lowest setting, and some cameras have more than one base (dual native ISO), so check your camera’s documentation.','Staying at base ISO is why the other elements, especially ND, do the work of managing brightness.'],
['I can say what base ISO means.','I can explain why it exists, why it may not be the lowest setting, and what staying near it achieves.','I can find my camera’s base ISO(s) in its documentation and tests and use it as my default.','I can plan a shoot day around base ISO, including when and why to depart from it, and verify the cost with my own camera tests.'],
[['What is your camera’s base ISO, and where did you find that out?','Depends on the camera. It should come from the manufacturer’s documentation or your own test, and you should check whether it has more than one.'],['Why isn’t the lowest ISO setting always the best?','Base ISO is where the sensor performs best. Settings below it can cost dynamic range on many cameras, so check yours.']],'MST','Look up your camera’s base ISO(s), then confirm with a noise test across its ISO range.'],
['Stops as a common language','A stop is a doubling or halving of light, the shared unit across all five exposure elements.','You can move between elements in stops, trading one against another to hold exposure.',['Light is measured in stops. Each stop is a doubling or halving, not a linear step. Aperture, shutter speed, ISO and ND all change exposure in stops, which is what lets you swap one for another and keep the same brightness.','Example: moving from f/8 to f/2.8 is three stops brighter, so adding three stops of ND (ND 0.9) holds the exposure.'],
['I can say a stop is a doubling or halving of light.','I can give the stop value of changes in each element (f-stop steps, shutter fractions, ISO doublings, ND values).','I can balance a change in one element with an equal change in another and verify it on a meter or waveform.','I can plan multi-element changes across a changing day in stops, predict the result, check it, and teach the system to a peer.'],
[['Going from f/8 to f/2.8 with exposure held the same, how much ND must you add?','Three stops (ND 0.9, or ND8).'],['You change shutter from 1/50 to 1/200. How many stops, which way, and why isn’t a stop linear?','Two stops darker. Each stop doubles or halves, so three stops is eight times the light, not three.']],'BEQ','With a meter or waveform, change each element in turn by exactly one stop and confirm the reading moves by one stop. Predict before you check.'],
['Creative consequences of each element','Aperture, shutter and ISO each change the image beyond brightness (depth of field, motion blur, noise). Lighting changes the scene itself. ND changes nothing else.','You choose each element for the image you want, not just for a correct exposure.',['Every element changes brightness. What matters creatively is what else it changes: aperture changes depth of field, shutter speed changes motion blur, ISO changes noise, lighting changes the three-dimensional space (and can do so locally), and ND changes nothing except brightness.','That is why, in practice, shutter is set by frame rate, aperture by the depth of field you want, ISO by the camera’s base, and brightness is managed with lighting and ND.'],
['I can name the side effect of each element.','I can explain why each side effect matters and why ND is different.','I can pick each element for its creative effect, balance the rest, and show the result in a test.','For a scene with a stated intention I can choose a combination of elements, predict how it will look, shoot it, and justify every choice, including what I gave up.'],
[['Complete: aperture gives …, shutter gives …, ISO gives …, ND gives …, lighting gives …','Depth of field; motion blur; noise; nothing but brightness; the three-dimensional space and local control of light and shadow.'],['You need deep focus in bright sun at 24fps. What do you change, and what do you leave alone?','Close the aperture and add ND to hold exposure. Leave shutter at about 1/48 and ISO at base. Shade or lighting can also help.']],'BWL','Shoot one scene three ways, each time using a different element (ND, aperture, shutter) to reach the same brightness. Compare what else changed and write which you would choose and why.'],
['Exposure strategy','Deciding what to protect and how to expose it when a scene holds more brightness range than the camera can record.','You find the element you can’t change, build exposure around it, and verify with tools.',['Every scene has a brightness range, and a camera can only record so much of it. Exposure strategy is the decision about what to protect: for example, building exposure around the element whose brightness you can’t change (the Framework calls this the Point of Control), then using lighting, ND and camera settings around it.','You verify the decision with exposure tools (meter, waveform, false colour) rather than trusting the monitor alone.'],
['I can say that I need to decide what to protect in the frame.','I can explain what a point of control is and how it determines exposure.','I can identify the point of control in a scene, expose around it, and confirm the result with a meter, waveform or false colour.','For a scene I can plan a strategy (what to protect, what to let go, what lighting is needed), predict readings, test them with tools, and justify the compromises.'],
[['A window is far brighter than the room and you can’t dim it. What is your point of control, and what are your options?','The window, since you can’t change it. Expose for it and light the room up, gel or ND the window, or choose silhouette or a blown window deliberately. Verify with false colour or waveform.'],['Why not trust the camera monitor alone?','Monitor brightness and viewing conditions vary. Meters, waveform and false colour give measurable values.']],'WBS','In a high-contrast location, identify your point of control, write your plan and predicted readings, expose, then check with false colour. Compare.'],
['Hard and soft light','Hard and soft describe how sharply light turns to shadow (its wrap), not how bright it is.','You can predict and control the hardness of light by controlling the relative size of the source.',['Hard light has very little wrap: the transition from light to shadow is sudden, giving sharp shadow lines. Soft light has a gentle wrap: the transition is gradual, minimising any clear shadow line. Neither term has anything to do with brightness.','What decides it is the size of the light source relative to the subject. A small source (or a large one far away, like the Sun) gives hard light. A larger source, made by passing light through diffusion, bouncing it, or bringing it closer, gives soft light. Intensity has no effect on how hard or soft a light is.'],
['I can say hard and soft light are about shadow edges, not brightness.','I can explain wrap and why relative source size decides hardness, including why a huge source far away can still be hard.','I can make a light harder or softer on purpose (diffusion, bounce, distance) and judge the result by looking at the shadow edge.','For a scene with a stated mood I can choose where it needs hard and soft light, design the sources to achieve it, predict how the shadows will fall, test it, and explain what I would change.'],
[['Does making a light brighter make it harder? Explain.','No. Intensity is unrelated to quality. Hardness depends on the size of the source relative to the subject.'],['Why is the Sun hard when it is enormous? Give three ways to soften a small light.','From Earth it is far away, so its relative size is small. Soften by diffusing it, bouncing it off a large surface, or bringing it closer (compensating exposure).']],'BLW','Light one subject with a single lamp bare, then through diffusion, then bounced, then moved closer. Photograph the shadow edge each time, noting any exposure change. Predict the order of softness first.'],
['Direction and lighting patterns','The angle light hits a subject from shapes its shadows. Named patterns describe common arrangements and the mood each gives.','You choose light direction deliberately, recognise the classic patterns, and know what each does to a face and to the mood.',['Direction is where the light comes from relative to the subject and camera. It decides where shadows fall and how much shape and texture you see. Six common patterns name the results: back lighting, split, Rembrandt, loop, flat and butterfly lighting.','Direction also connects to the Framework: light on the opposite side of the subject from the camera (camera > subject > light) gives depth, while light from beside or behind the camera flattens the subject.'],
['I can name the six lighting patterns and say that direction shapes shadows.','I can explain how each pattern places shadows on a face and the mood it tends to carry.','I can set up each pattern on a person from a description and recognise which pattern a still uses.','For a character and scene I can choose a pattern and justify it, adapt it to the set and camera position, test it, and critique why it works or doesn’t.'],
[['Name the six patterns and describe where the key sits for each.','Back, split, Rembrandt, loop, flat, butterfly. Split lights one half of the face, Rembrandt leaves a small lit triangle on the shadow cheek, loop casts a small nose shadow toward the cheek, butterfly sits high and in front, flat comes from the camera position, back comes from behind.'],['How does camera > subject > light differ from light > camera > subject?','The first gives depth and modelling; the second flattens the subject.']],'BLW','Photograph one willing subject in each of the six patterns with the same lens, distance and exposure. Label each and note where the nose, cheek and eye shadows land. Predict first.'],
['Contrast ratio','Contrast ratio compares the brightness of a subject’s lit side to its shadow side, expressed as a ratio or in stops.','You can measure and set contrast to suit a look, and relate it to what your camera can hold.',['Lighting contrast ratio compares the key-lit side of a subject with the shadow side, for example 4:1. Each stop doubles the light, so 2:1 is one stop, 4:1 two stops, 8:1 three stops.','Low ratios look flat and gentle; high ratios look dramatic. It is a creative choice and a technical one: the scene’s whole brightness range has to fit what the camera can record (see Dynamic range and latitude).'],
['I can say contrast ratio compares lit and shadow brightness.','I can convert between ratios and stops (2:1, 4:1, 8:1) and describe how low and high ratios look.','I can read the key and shadow sides of a face with a meter or false colour, work out the ratio, and change it by adding or removing fill.','For a scene I can choose a contrast ratio for the mood, predict the readings, set it, test it against my camera’s range, and justify the choice.'],
[['The key reads two stops brighter than the shadow side. What is the ratio?','4:1, since each stop doubles the light.'],['How could you lower the contrast on a face without moving the key? Why does ratio matter technically?','Add fill or bounce on the shadow side, or remove negative fill. The whole range has to fit within what the camera records, or detail is lost.']],'BLS','Read the lit and shadow sides of a face with a meter or false colour. Add fill in steps and record each ratio in stops. Predict each reading first.'],
['Inverse square law','Light falls off with distance faster than intuition suggests: doubling the distance gives a quarter of the light.','You can predict exposure changes from moving a light, and use falloff to shape a scene.',['For a small, point-like source, the light reaching a subject is inversely proportional to the square of the distance. Double the distance and the light is quartered (two stops darker); halve it and you get four times the light (two stops brighter).','This makes distance one of lighting’s strongest controls: a small move near the source changes exposure a lot, the same move far away changes little. The law is exact only for small sources; large soft sources behave less predictably up close.'],
['I can say light falls off quickly with distance.','I can state the law and work out the stop change when a light’s distance doubles or halves.','I can set exposure by moving a light, and use falloff to make a subject brighter than the background.','I can plan a lighting layout using falloff to separate subject from background, predict exposures at each position, test them, and explain where the law stops being accurate.'],
[['A light is 2m from a subject and you move it to 4m. How many stops darker?','Two stops, a quarter of the light.'],['Why does a light placed close to a person make the background look darker?','Falloff is steep near the source, so the nearby person gets much more light than the background further along.']],'BLT','Place a light 1m, 2m and 4m from a grey card and read each with a meter or false colour. Predict the stop differences, then compare with the law.'],
['Colour temperature and white balance','Colour temperature describes how warm or cool a light is, in Kelvin. White balance is the camera’s way of neutralising it.','You can read a scene’s colour temperatures, set white balance deliberately, and explain what you are telling the camera when you do.',['Colour temperature describes the warmth or coolness of a light source in Kelvin (commonly 1800K to 8000K). It is counterintuitive: lower values are warmer, higher values cooler. Candlelight is around 1800K, tungsten 3200K, daylight 5600K, overcast 6500K or more.','White balance is a camera function; colour temperature belongs to the light. They must be understood together. White balance does not paint the image with the Kelvin value you set. It tells the camera how much to compensate to neutralise the image. You can tell the camera the truth, so it neutralises the light, or lie to it, forcing a warm or cool tone.'],
['I can say colour temperature is measured in Kelvin and that lower is warmer.','I can place common sources on the scale and explain what white balance does and doesn’t do.','I can set white balance to match a source, set it deliberately to shift the look, and handle mixed colour temperatures (for example with gels).','For a scene with mixed sources I can design the colour of the light, predict how the camera will render each source at my white balance, test it, and justify what to neutralise and what to leave.'],
[['Which is warmer, 3200K or 5600K? What happens if you set white balance to 3200K in daylight?','3200K is warmer. The camera assumes warm light and compensates by cooling, so the daylight image looks blue.'],['A window (5600K) and a tungsten lamp (3200K) are in one frame. What are your options?','Neutralise one and let the other go warm or cool as a choice, or gel one source to match. Decide by what the story needs.']],'BLW','Shoot a scene lit by one tungsten lamp and a window at white balances of 3200K, 5600K and auto. Describe how each light renders in each. Predict first.'],
['Colour rendering and spectrum','Two lights can share a colour temperature but render colours differently, depending on the spectrum they emit.','You can judge whether a light will render skin and colours faithfully, and know the measures used (CRI, TLCI).',['Colour temperature says how warm or cool a light looks, not how well it renders colour. Sources with a full, continuous spectrum, like tungsten and daylight, render colours faithfully. Some fluorescent and cheap LED sources emit a spiky spectrum, which can make colours look wrong even when the Kelvin value seems right.','Measures such as CRI (colour rendering index) and TLCI (television lighting consistency index) try to rate this. Many LEDs also have a green-magenta shift that needs correcting separately from Kelvin.'],
['I can say that two lights of the same colour temperature can render colour differently.','I can explain spectrum, why a spiky spectrum renders poorly, and what CRI and TLCI aim to measure.','I can read a light’s CRI or TLCI and spectrum data, choose lights for skin tones, and spot a green-magenta shift.','I can test several lights on skin and colour charts, compare them, justify a choice for a production, and correct or avoid problem sources.'],
[['Why can two 5600K lights look different on a face?','They can have different spectra. A continuous spectrum renders colour more accurately than a spiky one.'],['What do CRI and TLCI measure, and what is a limit of relying on one number?','How faithfully a light renders colour (TLCI is designed for cameras). One number can hide where the gaps are, so test on real skin and colours.']],'SLT','Photograph a colour chart and a skin tone under two or more lights set to the same Kelvin, including a cheap LED if available. Compare colours and any green-magenta shift.'],
['Key, fill, back and background','Any image can be broken into four portions of light (key, fill, back and background), each with its own job.','You can identify the four portions in any frame, expose them in a sensible order, and use variation between them to build depth.',['Key is the light primarily illuminating the subject. Fill deals with the shadows the key creates on the subject. Back light comes from behind the subject and separates them from the background. Background light accounts for the background, often whatever is not the subject.','The same portions exist outdoors, but some can’t be changed by lighting, only by global means such as ND (time of day largely sets the background, which ND may then bring down). Begin by exposing for the portion you have least control over and build the rest around it. In a controlled studio, begin by setting the key to your desired level (often middle grey) and build around that. Avoid losing information in any portion, and aim for variation between them to create contrast, depth and interest.'],
['I can name the four portions and say what each is for.','I can identify the four portions in a frame, including exteriors, and say which could be changed by lighting and which only by ND or exposure.','I can light and expose a subject so all four portions keep detail, choosing a starting point and verifying with tools.','For a scene I can plan how the four portions should relate for the mood, predict readings for each, set them, test, and justify the relationships I chose, including what I left alone.'],
[['Name the four portions of light and what each does.','Key lights the subject; fill handles the shadows the key creates; back separates the subject from the background; background lights what isn’t the subject.'],['An exterior has a bright sky behind your actors. Where do you start your exposure, and why?','With the portion you have least control over (the sky), then build key, fill and back around it, using ND for global changes and lighting where it can help.']],'BLW','Photograph a person in an interior with a bright window behind. Identify the four portions, write your exposure order and predicted readings, then check with false colour that no portion has lost detail.'],
['Motivated light','Lighting that appears to come from a believable source in the scene, even when the crew places and shapes it.','You place light so it feels justified by the world of the scene, and know when to bend that for effect.',['Motivated light appears to come from a believable source within the scene, such as a window, lamp, screen or the sun, even when the actual light is placed and shaped by the crew. The motivation gives direction, colour and quality a reason, which helps an image feel natural and consistent.','Motivation is a starting point, not a rule. The light that serves the story and the actor may need to be more flattering or dramatic than the real source would be, so part of the skill is judging how far you can push it.'],
['I can say what motivated light means and name possible motivations.','I can explain how a source’s direction, colour and quality should follow its motivation, and spot motivated and unmotivated lighting in a film frame.','I can set up lighting that is believable for a described source and adjust it for the actor without breaking the motivation.','For a scene I can design a motivation scheme, predict how it will look, test it, justify where I bend it, and critique other work in these terms.'],
[['A room has one window and a table lamp. Where does the key come from, and what are its colour and quality?','From the window or the lamp, whichever the story favours. Match direction, colour temperature and softness to that source.'],['When might you deliberately break motivation?','When the story or performance needs it (flattering a face, adding a rim to separate from the background), as long as it doesn’t pull the viewer out of the scene.']],'BLW','In a room with one window and one lamp, light a person so every light seems to come from them. Add an unmotivated light and compare how believable the two versions feel.'],
['Three-point lighting as a starting point','Three-point lighting (key, fill and back) is a classic starting arrangement, useful to learn but not a universal rule.','You can build and explain three-point lighting, and know where it falls short and what alternatives offer.',['Three-point lighting uses a key light, a fill light and a back light. It maps onto the portions of key, fill and back, and is a common way to learn how each contributes to a subject’s shape and separation.','It isn’t a universal recipe. Real scenes often need fewer or more lights, and fill can flatten an image. Alternatives such as the Framework’s Lighting Triad (a key light, negative fill and a back edge) take a different approach, and comparing them shows what each choice does to depth and contrast.'],
['I can name the three lights in three-point lighting.','I can explain what each light does and the limits of the setup.','I can build three-point lighting, adjust its ratios, and recognise it in an image.','I can compare three-point lighting with an alternative on the same subject, predict the differences, test them, and justify which I would use for a given scene.'],
[['What does each of the three lights do?','Key shapes and illuminates the subject; fill lifts the shadow side; back light separates the subject from the background.'],['Give one limitation of three-point lighting.','It can feel formulaic or flat, assumes a controlled set, and fill can reduce depth. Many scenes need fewer or different lights.']],'BLW','Light a subject with three-point lighting, then re-light with key, negative fill and back edge. Compare depth and contrast with exposure held constant. Predict first.'],
['Practicals','Practicals are working lights visible in the frame, such as lamps and screens, used as part of the lighting.','You can use visible sources as both set dressing and light, and control them so they expose and look right.',['A practical is a light source that appears in the shot, such as a table lamp, neon sign, TV or street light. It helps motivate light and make the space believable, and it can contribute real light.','Practicals are often too weak or too bright, or the wrong colour or quality, so crews may change bulbs, dim them, or supplement them with hidden lights. They need checking for clipping in frame, colour temperature and flicker, and they are shared territory with the art department.'],
['I can say what a practical is and give examples.','I can explain why practicals are used and what problems they bring (brightness, colour, flicker).','I can use a practical in a shot, adjust it (dimmer, bulb) and supplement it so it looks right.','For a scene I can plan practicals with the art department, predict how they will expose and render, test them on camera, and justify what I changed or hid.'],
[['Why might a practical alone not light a scene well?','It can be too dim or too bright in frame, the wrong colour or quality, and it can’t be directed, so it may need a different bulb or help from another light.'],['What would you check on a practical before the shoot?','Brightness in frame (clipping), colour temperature, flicker at your frame rate and shutter, and where it sits in the shot, agreed with the art department.']],'BLT','Shoot a person lit by a lamp in frame: lamp alone, lamp on a dimmer, and lamp plus a hidden supplementary light. Check how the lamp itself exposes in each.'],
['Mixed light sources','A scene often holds light of different colours and qualities at once; handling them is a creative and technical choice.','You can spot mixed sources, decide what to neutralise and what to leave, and control them with gels, white balance and placement.',['Mixed light sources are different kinds of light in one frame, for example daylight through a window and tungsten or LED inside. They differ in colour temperature and sometimes spectrum, and the camera can only be balanced to one at a time.','You can balance them by gelling one source to match the other, choose a white balance for one and let the other shift warm or cool as a deliberate contrast, or remove a source. The right choice depends on what the scene needs, not only on neutral colour.'],
['I can say what mixed light sources are and give an example.','I can explain why they cause colour differences and the options for dealing with them.','I can identify the sources in a scene, choose a white balance, and use gels to match or deliberately contrast them.','For a scene I can design the colour relationships between sources, predict how they will render, test them, and justify the balance I chose, including what I let go.'],
[['Daylight through a window mixes with a warm lamp. What are your options?','Gel the window warm or the lamp cool to match, balance for one and let the other shift as a choice, or remove one source.'],['Why can’t white balance alone fix mixed sources?','It sets one neutral for the whole image, so one source will always be off against it.']],'BLW','Shoot a room with a window and a tungsten lamp balanced for daylight, balanced for tungsten, and with one source gelled to match. Compare the moods and say which story each suits.'],
['Day-for-night and night exteriors','A night scene is made either by shooting day exteriors treated to look like night, or by lighting a real night exterior.','You can choose and justify an approach for a night scene and know what each costs.',['Day-for-night means shooting in daylight and treating the image (exposure, light direction, colour and often grade) so it reads as night. It avoids lighting a large exterior at night but needs careful control of shadows and sky, and doesn’t always convince.','A real night exterior has to be lit enough for the camera while still feeling dark, balancing sources, background depth and practicals. Both rely on exposure, contrast and colour, and neither is easy to make convincing on a small budget.'],
['I can say what day-for-night is and how it differs from a night exterior.','I can explain the strengths and weaknesses of each approach and what has to be controlled.','I can plan and shoot a simple night look with either approach and judge where it fails.','For a scene I can choose between approaches against budget and story, plan the lighting and exposure, predict the look, test it, and critique the result.'],
[['Give one advantage and one disadvantage of day-for-night.','Advantage: you don’t have to light a large exterior at night. Disadvantage: harder to make convincing (hard sun shadows, bright sky), and it relies on careful control and grade.'],['What does a night exterior need that a day exterior doesn’t?','Enough lit sources for the camera to record while it still feels dark, plus control of background depth.']],'BLT','Plan a short night exterior. Shoot it as day-for-night and, if safe and practical, as a real night exterior. Compare believability and effort.'],
['Lighting for continuity','Keeping the look of light consistent across shots and takes, even as real light changes.','You can plan and monitor lighting so shots cut together.',['Shots in one scene are filmed at different times but must look like one moment. Continuity of light means keeping direction, brightness, colour and quality consistent between setups, and between takes when the light changes (sun moving, clouds).','Strategies include lighting interiors independently of changing daylight, planning the order and time window of exterior shots, matching exposure with ND and lights, and recording settings and positions so they can be reproduced. Continuity photography and notes help.'],
['I can say what continuity of light is and why it matters.','I can explain what can change between setups and takes (sun, cloud, power, practicals) and how it makes cuts jar.','I can record and reproduce a lighting setup and match shots across a changing day.','I can plan a day’s lighting for continuity across a scene, predict where it will break, build in controls, and critique cuts for continuity of light.'],
[['Name three things that can change lighting continuity across a day.','The sun’s position, cloud cover and time of day; changes to practicals or power; moved gear or drifting camera settings.'],['How can you protect an interior scene near a window from changing daylight?','Control the window (flag, gel or block it) and light independently, or limit the shooting window, and track your settings.']],'BLT','Film the same short exchange by a window at two times of day without changing lights, then again controlling the window. Cut both together and compare continuity.'],
['Upstage Lighting','Light your subject from one side and film them from the other: camera > subject > light.','You can place light and camera on opposite sides of the subject to create depth, and explain why other arrangements flatten.',['Upstage lighting (also called shadow side lighting) is the first principle of the Framework: wherever your subject is, light them from one side but film them from the other, using the arrangement camera > subject > light. One way to think of it is to take the 180-degree line and place the light on one side of it and the camera on the other.','Arrangements that put the light between camera and subject, or beside or behind the camera, tend to produce flat images: camera > light > subject is flat, and light > camera > subject is flat. Light on the far side of the subject, with the camera opposite, gives depth.'],
['I can state the camera > subject > light arrangement.','I can explain why upstage lighting gives depth and why the other arrangements flatten, and relate it to the 180-degree line.','I can place light and camera for upstage lighting around a subject in a real space, including as the subject moves, and recognise it in a frame.','For a scene with a moving subject I can plan light and camera positions to keep upstage lighting through the action, predict where it will break, test it, and justify any compromise.'],
[['Describe the arrangement of camera, subject and light that gives depth, and two that flatten.','Camera > subject > light gives depth, with the light on one side of the 180-degree line and the camera on the other. Camera > light > subject and light > camera > subject both flatten.'],['How does the 180-degree line help you place upstage light?','Put the light on one side of the line and the camera on the other.']],'FAD','Light one subject three ways: camera > light > subject, light > camera > subject, and camera > subject > light. Keep exposure constant and compare depth and modelling. Predict first.'],
['Point of Control','The element in your scene whose brightness you can’t change, which you build your exposure around.','You find the point of control first, expose around it, and build the rest of the lighting from there.',['The Point of Control (POC) is the element in your scene you can’t control, whose brightness you can’t change, and therefore the thing you build your exposure around. Typical examples are a bright window, the sky, or a sunlit wall.','Choosing it first stops you rebalancing everything later, because every other portion of the image is set relative to it. It links directly to exposure strategy and to the key, fill, back and background portions.'],
['I can say what a point of control is.','I can explain why it is chosen first and how it differs from elements I can change.','I can identify the point of control in a real location, expose around it and build the other portions of light relative to it.','For an unfamiliar location I can identify the point of control, plan the lighting and exposure around it, predict the readings, test them with false colour or waveform, and justify the compromises.'],
[['Define the point of control and give one indoor and one outdoor example.','The element whose brightness you can’t change, which you build exposure around. Indoors, a bright window; outdoors, the sky or a sunlit wall.'],['Why choose the point of control before setting anything else?','Everything else is adjusted relative to it, so choosing it first avoids rebalancing the whole scene.']],'FAB','Visit three locations with a fixed bright element. For each, identify the point of control, write your plan and predicted readings, expose around it, and check with false colour.'],
['Lighting Triad','A key light, negative fill and a back edge: an alternative to three-point lighting.','You can build the triad, explain how it differs from three-point lighting, and choose between them.',['Instead of three-point lighting (key, fill, back), the Lighting Triad proposes a key light, negative fill and a back edge. The key shapes the subject, negative fill takes light away from the shadow side to deepen it, and the back edge defines the subject’s edge against the background.','The difference is the fill: three-point adds light to the shadows, while the triad subtracts it, keeping more shape and contrast. Comparing the two on the same subject shows what that one change does.'],
['I can name the three parts of the Lighting Triad.','I can explain what negative fill does and how the triad differs from three-point lighting.','I can build the triad on a subject, adjust the negative fill, and recognise it in a frame.','I can compare the triad and three-point lighting on the same subject, predict the differences in contrast and depth, test them, and justify which suits a given scene.'],
[['Name the three parts of the Lighting Triad and how it differs from three-point lighting.','Key, negative fill and back edge. It replaces fill (adding light to shadows) with negative fill (removing light).'],['What does negative fill do that fill doesn’t?','It absorbs light, deepening shadows and contrast, instead of lifting them.']],'FAB','Light one subject with the triad and with three-point lighting. Hold exposure constant and compare shadow depth and contrast. Predict first.'],
['Room Tone (lighting)','Subtle, non-directional light that sets the exposure of the background and brings detail back to the darkest parts of the image.','You can add and balance a subtle wash of light for the background and shadows without changing the look of the key.',['In the Framework, Room Tone is subtle, non-directional lighting designed to set an exposure for the background and bring detail back to the darkest parts of an image. It is light you add to the room itself, rather than to the subject.','This is not the same as room tone in sound, which is a recording of a location’s silence. In lighting, the aim is to make the background and shadows read at a deliberate level without adding a new directional source that competes with the key.'],
['I can say what Room Tone is in the Framework and that it differs from room tone in sound.','I can explain its purpose and why it should be subtle and non-directional.','I can add a room tone to a dim interior and set it so the background and shadows read at a chosen level.','For a scene I can decide the background and shadow levels, plan the room tone to reach them, predict the readings, test it, and justify how much detail I chose to recover or leave.'],
[['What is Room Tone in the Framework, and how does it differ from room tone in sound?','Subtle, non-directional light that sets the background exposure and brings detail back to the darkest areas. In sound, room tone is a recording of a location’s silence.'],['Why should it be non-directional?','So it raises the background and shadows without adding a visible new source or changing the look of the key.']],'FAB','Shoot a dim interior with and without a soft, non-directional wash tuned to the background. Compare shadow detail and background exposure with false colour. Predict first.'],
['L of the Room','Composing into the corner or angles of a room rather than face on, to get 3D perspective.','You choose camera angles that use the space’s depth, and can explain why face-on framing flattens it.',['L of the Room means composing your shot to shoot into the “L” of the room rather than face on. It also covers shooting into angles generally, rather than head on at objects, to take advantage of 3D perspective.','Face on to a wall, everything sits at roughly the same distance from the camera, which gives little sense of depth. Shooting into a corner or angle puts things at differing distances, so perspective and depth appear.'],
['I can say what the L of the room is.','I can explain how face-on framing and angled framing differ in the distances of objects from the camera and why that affects depth.','I can choose and set up a camera position into the L of a real room, and recognise it in a frame.','For a space I can compare candidate camera positions, predict the depth each will give, test them, and justify the one I choose against the needs of the scene.'],
[['What does shooting into the L of the room mean, and why do it?','Composing into the corner or angles rather than face on, so objects sit at differing distances from the camera and the image gains 3D perspective.'],['Why does a face-on wall look flat?','Everything on it is roughly the same distance from the camera, which gives few depth cues.']],'FAB','Shoot the same subject face on to a wall and then into the corner of the room with the same lens. Compare depth. Predict first.'],
['Salt and Pepper','Small last-minute additions that add depth or interest to a shot that is already working.','You can spot what a shot needs and add small touches without undoing what is already working.',['Salt and Pepper means any last-minute changes you can make to add a little depth or interest to the shot. Examples include adding a pop of light or colour somewhere in the set (through lighting or the art department), repositioning slightly to put the subject in a frame within a frame, adding a catchlight, taking fuller advantage of leading lines, or adding layers of dark, light, dark, light for a chequerboarding effect.','These are finishing touches, added once the main lighting, composition and exposure are working. They season a shot rather than rescue it.'],
['I can name some examples of salt and pepper.','I can explain why they come last and what each tends to add to a frame.','I can look at a working shot, pick small additions that improve it, and make them quickly.','For a shot I can identify what is missing, propose several small additions, predict the effect of each, try them, and justify which I kept and which I dropped.'],
[['Name three salt-and-pepper moves.','For example a pop of light or colour, a frame within a frame, a catchlight, leading lines, or alternating dark and light layers.'],['Why are they last-minute touches rather than the main plan?','They refine a shot whose lighting, composition and exposure already work; they don’t fix a weak one.']],'FAT','Set up a static shot, then try three small additions (a pop of light or colour, a frame within a frame, a catchlight, leading lines, or light and dark layering). Compare the versions and say what each changed.'],
['Image circle and sensor coverage','A lens projects a circle of light, which must be large enough to cover the camera’s sensor.','You can check whether a lens covers a sensor and explain what happens when it doesn’t.',['A lens projects a circular image, the image circle, and its size determines which sensor sizes it can cover. Lenses are categorised by coverage as full frame, APS-C, Micro Four Thirds and so on.','If the image circle is smaller than the sensor, the corners can darken or be lost. Lenses are also commonly categorised by whether they were designed for cinema or for photography. Any lens can shoot video, since it is the camera that decides, but each is most purposefully designed for one.'],
['I can say what an image circle is.','I can explain how the image circle relates to sensor size and to lens categories such as full frame, APS-C and Micro Four Thirds.','I can check a lens and camera for coverage and recognise vignetting caused by insufficient coverage.','For a production I can choose lenses that cover my sensor and recording format, predict the consequences of a mismatch, test them, and justify the choice.'],
[['What is an image circle and why does it matter?','The circle of light a lens projects. It must cover the sensor or the corners will darken or be lost.'],['A lens designed for APS-C is used on a full frame camera. What might you see?','Vignetting or dark corners, or the camera cropping the image, because the image circle may not cover the larger sensor.']],'BE','Compare two lenses designed for different sensor sizes on the same camera if your kit allows, and examine the corners at several focal lengths. Predict what you will see first.',[['read','foundational','Elkins, The Camera Assistant’s Manual (2020)','p.26 on lenses and p.230 on cinema versus photography lenses, as cited in the course slides']]],
['Focal length, field of view and crop factor','Focal length (in mm) sets how wide or narrow the view is. Crop factor adjusts that for the sensor’s size.','You can predict the framing from a focal length on any sensor and explain how these three relate.',['Focal length, measured in mm, is the distance between the optical centre of the lens and the camera’s image plane. Field of view is the extent of the scene the camera captures at a given moment. The shorter the focal length, the wider the field of view.','Crop factor is the degree to which the image is cropped by the sensor’s size, with full frame as the standard. A 50mm lens gives a 50mm image on full frame, an 80mm full-frame equivalent on APS-C (1.6x) and a 100mm equivalent on Micro Four Thirds (2x). As a rough guide: wide is 14-35mm, normal 35-70mm, telephoto 70-150mm and beyond.'],
['I can define focal length, field of view and crop factor.','I can explain how focal length and field of view relate and calculate a full-frame equivalent from a crop factor.','I can choose a focal length to achieve a described framing on a given sensor and describe wide, normal and telephoto ranges.','For a scene I can pick focal lengths for a shot list on my actual camera, predict the framing, test it on location, and justify each choice.'],
[['What is the full-frame equivalent of a 35mm lens on a Micro Four Thirds sensor?','70mm, using the 2x crop factor.'],['How are focal length, field of view and crop factor related?','Shorter focal length means wider field of view. A smaller sensor crops the view, as though the focal length were longer by the crop factor.']],'BE','Shoot from one position at several focal lengths on your camera. Note the field of view each time and convert to full-frame equivalents. Predict the framing before you shoot.',[['read','deeper','Ascher, The Filmmaker’s Handbook (2019)','p.197 on angle of view; Elkins 2020 p.495, as cited in the course slides']]],
['Perspective and compression','Perspective is the spatial relationship between things in the frame. It depends on camera position, not on focal length itself.','You can separate the effects of camera position and focal length, and choose each for its own purpose.',['Perspective, the apparent size relationship and spacing between near and far objects, is set by where the camera is relative to the subject. Focal length decides how much of that view you crop in on. Telephoto lenses are often said to compress space, but the compression comes from standing farther back to frame the same subject.','In practice, keeping a subject the same size while moving back and using a longer lens changes the perspective. Keeping the same position and changing focal length only crops or widens the view. Lens choice and camera position should therefore be decided together.'],
['I can say what perspective means in an image.','I can explain that perspective depends on camera position, that focal length changes framing, and why telephoto shots look compressed.','I can show the effect by shooting the same subject size from different distances with different lenses.','For a scene I can choose position and focal length together to get a desired spatial feel, predict the result, test it, and explain it.'],
[['Does a longer lens change perspective if the camera doesn’t move? Explain.','No. Perspective is set by camera position, and a longer lens crops the same view.'],['How do you keep a face the same size but change the feel of the background?','Move the camera and change focal length together. Farther back with a longer lens compresses the background; closer with a wider lens stretches it.']],'BE','Frame a person at the same size with a wide lens up close and a telephoto from far away, and compare the backgrounds. Then keep the camera still and change only focal length. Predict first.'],
['Prime vs. zoom','Primes have one fixed focal length and zooms cover a range. Each trades flexibility against speed, size and character.','You can choose between primes and zooms for a shot and a production, and justify it.',['Lenses with a single fixed focal length are prime lenses. Those with a range of focal lengths are zoom lenses. Primes generally have wider maximum apertures and are often smaller, while zooms let you change framing without moving or changing lens.','The choice depends on speed of working, light levels, the look you want, weight and rigging, and budget. Some zooms are parfocal (they hold focus while zooming) and some are varifocal (they don’t), which matters for operating.'],
['I can say what a prime and a zoom are.','I can explain the trade-offs between them and what parfocal and varifocal mean.','I can choose primes or zooms for a described shoot and justify the choice using speed, light, look and practicality.','For a production I can plan a lens package, predict how it will affect workflow and look, test candidates, and defend what I chose and left out.'],
[['Give one advantage each for primes and zooms.','Primes: usually wider apertures and smaller size. Zooms: framing changes without changing lenses or moving the camera.'],['What is the difference between parfocal and varifocal?','Parfocal zooms hold focus as the focal length changes. Varifocal ones don’t, so you must refocus.']],'BE','Shoot the same short scene with a zoom and with primes. Time the setups and compare the images and how each affects the way you work. Predict first.',[['read','deeper','Ascher, The Filmmaker’s Handbook (2019)','p.212 on parfocal and varifocal, as cited in the course slides']]],
['Depth of field','Depth of field is the zone of acceptable sharpness in front of and behind the point of focus.','You can predict and control depth of field to direct attention, and know which lever costs what.',['Depth of field is the range of distances that appears acceptably sharp. Aperture shapes it (wider means shallower), as do focal length (for the same subject distance, longer is shallower), subject distance (closer is shallower) and sensor size (for the same framing and aperture, larger is shallower).','Because its visual impact is so significant, aperture should be chosen for depth of field and brightness managed with ND and lighting. Depth of field is a creative decision about where to direct attention.'],
['I can say depth of field is the zone of acceptable sharpness.','I can name the factors that affect it and the direction of each.','I can set up a shot for a chosen depth of field by adjusting aperture, distance, focal length and ND.','For a scene I can plan depth of field shot by shot, predict how much will be in focus, test it with a monitor and focus tools, and justify each choice against story and practicality.'],
[['Name four factors affecting depth of field.','Aperture, focal length, subject distance and sensor size.'],['You want shallower depth of field in bright sun without changing shutter or ISO. What do you do?','Open the aperture and add ND to hold exposure. You can also move closer or use a longer lens.']],'BEW','Shoot one subject changing only one factor at a time (aperture, then distance, then focal length), using ND to hold exposure. Record how much of the frame is sharp. Predict first.',[['read','foundational','Elkins, The Camera Assistant’s Manual (2020)','p.492 on depth of field, as cited in the course slides']]],
['Anamorphic','Anamorphic lenses squeeze the image horizontally so a wider field of view fits the sensor and is later de-squeezed.','You understand squeeze factors and the workflow they need, and know when the look serves the story.',['Most lenses are spherical because anamorphic design is costly and complex. Anamorphic lens elements squeeze the image so a wider field of view can be captured on the sensor, then de-squeezed later to produce a unique look and a wider aspect ratio.','Squeeze factors vary (for example 1.6x), and anamorphic images need de-squeezing on monitors and in post. The look includes characteristic flares and out-of-focus rendering, so the choice is partly practical and partly aesthetic.'],
['I can say what anamorphic means and how it differs from spherical.','I can explain squeezing, de-squeezing and the squeeze factor.','I can set up monitoring and recording for anamorphic and recognise its characteristics in an image.','For a project I can decide whether anamorphic suits the story and budget, plan its workflow, test it, and justify the choice.'],
[['What does an anamorphic lens do to the image, and what must happen afterwards?','It squeezes the image horizontally to fit a wider field of view on the sensor, and it must be de-squeezed for viewing.'],['Why are most lenses spherical?','Anamorphic design is more complex and costly.']],'BE','Compare a spherical and an anamorphic lens (or a clip from each) of similar focal length: look at aspect ratio, flares and out-of-focus areas. Predict first.',[['read','deeper','Ascher, The Filmmaker’s Handbook (2019)','p.224-225 on anamorphic, as cited in the course slides']]],
['Lens character and optical qualities','Beyond focal length and aperture, lenses differ in aberrations, distortion, focus breathing, bokeh, sharpness, vignetting, contrast and flare.','You can spot and describe the optical qualities that make lenses look different, and choose lenses for them.',['The main considerations in lens choice include spherical and chromatic aberration, depth of field (maximum and minimum aperture), angle of view, focus breathing, distortion, bokeh, sharpness, vignetting, contrast, minimum focus distance, flare, and whether a zoom is parfocal or varifocal.','Two lenses with the same focal length and aperture can render very differently, which is why lens tests matter. Some imperfections are flaws to avoid and others are character to choose.'],
['I can list several optical qualities that differ between lenses.','I can explain what qualities such as focus breathing, bokeh, flare and distortion are.','I can test lenses side by side, identify differences, and describe them precisely.','I can pick lenses for a project based on tested optical qualities that serve the look, justify the choice, and explain what I accepted.'],
[['What is focus breathing?','The change in field of view as focus is adjusted.'],['Why test lenses instead of relying on specs?','Specs don’t capture how a lens renders sharpness, contrast, flare, bokeh and distortion. The same focal length and aperture can look different.']],'BES','Shoot a detailed scene with two lenses at matching focal length and aperture. Compare corners, flare, out-of-focus areas and breathing when focus is pulled. Predict the differences first.',[['read','deeper','Elkins and Ascher, as cited in the course slides','Elkins 2020 p.489 breathing, p.496 flare; Ascher 2019 p.217 bokeh, p.221 minimum focus, p.228-229 aberrations, p.230 sharpness and vignetting']]],
['Focus and focus pulling','Setting and changing focus precisely during a shot, usually the job of the 1st AC (focus puller).','You can plan and carry out a focus pull and understand the tools and constraints.',['Focus is set with the lens’s focus ring, and focus pulling is changing it during a shot. On larger productions this is the job of the 1st AC (focus puller), helped by accessories such as manual or wireless follow focus devices and monitors with focus tools. Focus peaking is one of these aids: it draws a coloured outline on the edges that are in sharp focus. It can mislead on low-contrast or noisy images, so confirm critical focus another way, such as magnifying the image.','Pulling is easier with deeper depth of field and harder at wide apertures, close distances and with moving subjects, so it links directly to depth of field choices. Measuring distances, marking, rehearsing and monitoring are central parts of the job.'],
['I can say what focus pulling is and who usually does it.','I can explain the tools used (follow focus, monitors, focus aids) and how depth of field affects difficulty.','I can perform simple focus pulls between two subjects using marks and a monitor.','For a scene I can plan the focus pulls, predict where they will be hard, rehearse and test them, and adjust aperture or blocking to make the shot achievable.'],
[['Why is pulling focus harder at a wide aperture?','Depth of field is shallower, so there is less margin for error.'],['Name two tools that help a focus puller.','A follow focus (manual or wireless) and a monitor with focus aids such as peaking.'],['What does focus peaking show, and what doesn’t it show?','It outlines the edges that are in sharp focus. It says nothing about exposure, and it can mislead on low-contrast or noisy images, so confirm critical focus another way, such as magnifying the image.']],'EWT','Plan and shoot a two-subject focus pull at two different apertures. Count successful takes at each and note what helped. Predict the difference first.'],
['T-stops vs. f-stops','F-stops are a calculated aperture value. T-stops measure how much light the lens actually transmits.','You know why cine lenses are marked in T-stops and can compare lenses fairly.',['An f-stop is a theoretical value calculated from the lens’s focal length and the size of its opening. It doesn’t account for light lost inside the lens as it passes through the glass. A T-stop is a true measurement of the light the lens actually transmits, so it is always a little higher than the matching f-stop.','Cine lenses are marked in T-stops so that two lenses set to the same T-stop give the same exposure, which matters when you change lenses between shots. Depth of field is still governed by the physical opening (the f-number).'],
['I can say that f-stops are calculated and T-stops are measured.','I can explain why a T-stop is higher than the matching f-stop and why cine lenses use T-stops.','I can read both markings on a lens and use T-stops to match exposure between lenses.','I can test two lenses set to the same T-stop, predict and verify any difference in exposure or depth of field, and justify which scale to use for a given job.'],
[['What does a T-stop account for that an f-stop doesn’t?','Light lost as it passes through the lens elements, so it measures the light actually transmitted.'],['Why do cine lenses use T-stops?','So the same T-stop gives the same exposure across different lenses, avoiding exposure shifts when changing lenses.']],'BEQ','Set two different lenses to the same stop value on the same scene and compare exposure with a waveform or meter. Predict whether they will match first.'],
['Shutter angle','Shutter angle describes exposure time as a fraction of the frame time, so it keeps the same motion look at any frame rate.','You can convert between shutter angle and shutter speed, and choose an angle for the motion look you want.',['Shutter angle expresses how long the sensor is exposed relative to the time of one frame, as an angle out of 360°. Exposure time = (angle ÷ 360) ÷ frame rate. At 24fps, 180° gives 1/48, 360° gives 1/24 and 90° gives 1/96. Because it is relative to frame rate, 180° gives the same natural-looking motion blur at any frame rate: it is the “double the frame rate” rule from the Shutter speed card.','Cine cameras often show angle instead of speed. A smaller angle gives crisper, more staccato motion and a darker image; a larger angle gives smearier motion and a brighter one, by the matching number of stops. A shutter of 1/50 at 24fps (about 172.8°) is commonly used in 50Hz countries to avoid flicker from some artificial lights. At 25fps, the UK convention, a 180° shutter is already 1/50.'],
['I can say shutter angle describes exposure time relative to the frame.','I can convert between angle and shutter speed at a given frame rate and explain why 180° looks natural at any frame rate.','I can set a chosen shutter angle on my camera, predict the change in blur and brightness, and recognise flicker risks with artificial lights.','For a scene I can choose an angle for a motion look (including flicker constraints), predict blur and exposure, test it, and justify any departure from 180° and what it costs.'],
[['What shutter speed is a 180° angle at 24fps? And 90°?','1/48 and 1/96.'],['What happens to brightness and motion if you reduce the angle from 180° to 90°?','One stop darker, with less motion blur, so movement looks crisper and more staccato.'],['Why might you shoot at about 172.8° at 24fps in the UK?','It equals 1/50, which commonly avoids flicker from some lights on 50Hz mains.']],'BEM','Work out the speeds for 360°, 180°, 90° and 172.8° at 24fps and check your camera shows the same. Then film a practical light at 1/48 and 1/50 to look for flicker. Predict first.'],
['High key vs. low key','High key and low key describe a lighting style (overall brightness and contrast), not how bright the exposure is.','You can choose and build a high key or low key look on purpose, and explain what each does to the mood.',['High key lighting is bright with a low contrast ratio: the frame is dominated by light tones, and shadows are soft or filled. It is often associated with comedy, light drama, and clean or optimistic looks. Low key lighting is dark with a high contrast ratio: most of the frame sits in shadow, with selective light. It is often used for tension, mystery or drama.','The terms describe the lighting design, built from contrast ratio, fill and the balance of light and dark in the frame, not simply how bright you expose. A low key scene can be exposed correctly and still be mostly shadow. Real scenes often sit between the two, and a film can move along the range to follow the story.'],
['I can say what high key and low key mean and give an example of each.','I can explain how contrast ratio, fill and the amount of shadow produce each look, and the moods they tend to carry.','I can light the same subject high key and low key and recognise each in a film frame.','For a scene I can choose where on the high key to low key range it should sit, plan the ratios and fill to achieve it, predict the readings, test it, and justify how it serves the story.'],
[['Is a low key image underexposed? Explain.','No. Low key is a high-contrast lighting style with dominant shadows, and it can be correctly exposed. Exposure sets overall brightness; the lighting design creates the style.'],['Which changes move a scene from high key toward low key?','Reduce or remove fill (raising the contrast ratio), add negative fill, darken the background and let the shadows fall deeper.']],'BLW','Light one subject high key (soft, plenty of fill, bright background), then low key (less fill or negative fill, darker background) with the same key light. Measure the contrast ratio of each and compare the mood. Predict the ratios first.'],
['Naturalistic vs. stylised','Naturalistic lighting aims to look like real light in the real world. Stylised lighting is shaped to look designed, for effect.','You can place a look on the naturalistic to stylised range and choose it to suit the story.',['Naturalistic lighting makes the audience feel the light could really be there: believable sources, direction and colour for the time and place, and a subtle hand. Stylised lighting departs from realism to heighten emotion or express an idea, using saturated colour, extreme contrast, unmotivated shafts of light or exaggerated shadows.','They are the ends of a spectrum, not right and wrong. Motivated light is a common tool for keeping even stylised work grounded, and naturalistic work often involves heavy control behind the scenes. The choice should come from the story, the genre and the world of the film.'],
