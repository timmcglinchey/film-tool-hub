write the beats as short phrases. Watch it, predict where the cuts and camera moves will fall, then check how closely they match your beats.", []], ["Subtext", "Subtext is the meaning beneath what characters say. People rarely say what they really feel, and good direction shows the gap.", "You can find and play subtext, and direct it without over-explaining.", ["<b>Subtext</b> is the meaning underneath the surface of what characters say and do. Characters rarely express their true feelings directly, and the audience learns most from what is unsaid: a pause, a glance, a change of subject, an action that contradicts the words. Strong screenwriting and direction both work through subtext rather than explicit statement.", "To find it, ask what each character is really trying to do beneath their words, and what they are avoiding. In rehearsal, try playing the opposite of the words, or having actors do an unrelated task while speaking. Use the camera and sound too: a close-up on the listener, the sound of a clock, a detail in the set. Resist making it obvious: if every line is played as its meaning, the scene is flat."], ["I can say what subtext is.", "I can explain how it differs from the words and how a pause or action can carry it.", "I can find the subtext in a scene and suggest ways of playing it.", "For a film I can plan where subtext is carried by performance, camera and sound, predict how audiences will read it, test, and justify what I leave unsaid."], [["What is the subtext of a character who says ‘I’m fine’ while gripping a chair?", "They are not fine, and are trying to hide it. The action contradicts the words."], ["Name two tools besides dialogue for expressing subtext.", "For example performance (a pause or glance), camera framing, sound or a detail in the set."]], "wKa", "Pick a short dialogue scene and write what each character really wants beneath their lines. Perform it twice with a partner, once playing the words and once playing the subtext. Predict which will feel more real, then compare.", []], ["Tone and genre", "Genre sets the audience’s expectations, and tone is how the film feels. A director controls both through many small choices.", "You can identify the tone and genre of a project and make consistent choices to support them.", ["<b>Genre</b> (comedy, thriller, drama, horror and so on) creates expectations about story, style and character, which a film can fulfil, play with or subvert. <b>Tone</b> is the emotional register of the film (cold, warm, playful, tense, ironic), and it can be consistent or deliberately shift. A film’s tone comes from performance, rhythm, camera, lighting, colour, sound and music working together.", "Define the tone in a few words with references (two or three films, with notes on exactly what you’re drawing on), then check each choice against it. Tonal shifts need care: a joke in a tragedy can work or wreck it depending on preparation. Think about the audience’s experience: what do you want them to feel and when? Test with early viewers. Use genre conventions knowingly, as shorthand, and don’t be bound by them."], ["I can name a film’s genre and describe its tone.", "I can explain how genre creates expectation and how tone is built from many choices.", "I can define the tone of my project and give examples of choices that support it.", "For a film I can plan tonal consistency or shifts, predict viewer reactions, test them, and justify decisions where I subvert genre."], [["What is the difference between genre and tone?", "Genre is a category with conventions and expectations, while tone is the emotional register of the film."], ["Why test tonal shifts with viewers?", "A change of tone can fail without careful preparation, and you can’t judge it as the person who made it."]], "aeK", "Choose a scene and rework it in two different tones (for example comic and tense) by changing only camera, sound and performance, not the dialogue. Predict what each change will do, then show both to someone and ask what they felt.", []], ["Intent vs. execution", "What you meant to say and what an audience sees can differ. A director learns to check the gap.", "You can test whether an intention is reaching the screen, and fix it.", ["Directors carry the intention in their heads, but the audience only sees and hears the result. The gap can come from a performance that doesn’t quite match, a shot that doesn’t show what you think, a missing piece of information or a sound that sends a different message. Common causes are being too close to the material, shooting in a rush and not checking playback.", "Close the gap by being specific about what the audience should think and feel at each key moment, then checking with people who don’t know the intent. Review footage during shooting and in the edit, ask others what they notice, and compare it with what you intended. Be honest about what is and isn’t working, and be ready to re-shoot or reframe. Learning to see your own work as a viewer is a core directing skill."], ["I can say that what a director intends and what an audience perceives can differ.", "I can explain common causes of the gap and ways to check it.", "I can test a scene with a viewer and compare their reading with my intention.", "For a film I can predict where intent and result will diverge, test with fresh viewers, and justify the changes I make."], [["Why ask someone who doesn’t know the intent to watch your scene?", "They see only what is on screen, which reveals whether the intention is actually reaching the audience."], ["Name a cause of the gap between intent and result.", "For example being too close to the material, rushing without checking playback, or a shot not showing what you think it does."]], "Kam", "Write down what you want the audience to think and feel at three moments in a scene. Show the scene to two people and ask what they thought and felt. Predict their answers first, then compare.", []], ["Casting", "Casting is finding actors whose instincts, energy and chemistry are right for the role, and who you can direct well.", "You can plan a casting process and choose actors for reasons you can explain.", ["Casting starts with a clear picture of the role. Write a breakdown that describes personality and needs, not just appearance, specific enough to attract the right people but open to unexpected choices. Include practical details (dates, location, whether paid or deferred) and what applicants should send (self-tape, headshot, CV). Platforms and drama school networks are common routes.", "A usual process is a self-tape round, then callbacks in person or by video, with <b>chemistry reads</b> where two roles have a pivotal relationship. Look for truthfulness more than polish, and see how actors respond to adjustment: coachability matters. Treat everyone respectfully, give clear information and feedback, and be explicit about anything sensitive in the role. Confirm the decision in writing with a proper agreement. Remember you will have to work with this person under pressure."], ["I can say what a casting breakdown is.", "I can explain the stages of casting and what to look for.", "I can write a breakdown and run a short audition with clear direction.", "For a film I can plan the casting process, predict where it will go wrong, test it with a mock audition, and justify my final choices."], [["What is a chemistry read for?", "To see how two actors work together when their relationship is central to the film."], ["Why test how an actor responds to adjustment?", "It shows how well you will be able to direct them, which matters more than a polished first read."]], "wmK", "Write a casting breakdown for one role in your film. Run three short auditions with friends, giving the same adjustment to each. Predict which will respond best, then reflect on why.", []], ["Rehearsal methods", "Rehearsal is where a director and actors explore the scene, build trust and find problems, without wearing it out.", "You can choose rehearsal methods to fit the scene, the actors and the time you have.", ["Methods include a <b>table read</b> (a relaxed read-through of the script by the cast to hear the rhythm and fix unnatural dialogue), <b>discussion</b> of character and objectives, <b>improvisation</b> around the scene’s situation to find the real behaviour, <b>blocking rehearsals</b> to plan movement with the DP and 1st AD, and <b>running</b> the scene at full performance. Different actors need different approaches, and some work best with less preparation.", "Prioritise emotionally complex scenes and those with the most characters. Don’t over-rehearse, because you want freshness on the day. Use rehearsals to build relationships and to discover problems that can be fixed cheaply, and to give the 1st AD and DP the information to refine the plan. Record what you find, including changes to dialogue. Be clear about what is rehearsal and what is performance, and respect people’s time."], ["I can name some rehearsal methods.", "I can explain what each is for and why over-rehearsing is a risk.", "I can run a rehearsal session using more than one method and record what I found.", "For a film I can plan rehearsals for each scene type, predict what will go wrong, test them, and justify my balance between preparation and freshness."], [["Why not rehearse a scene many times?", "The performance loses freshness, and you want the best of it for the camera."], ["Which scenes should get rehearsal priority?", "Emotionally complex scenes and those with many characters."]], "wKm", "Rehearse the same short scene in two ways (a table read and a run on its feet) with two actors. Predict which will teach you more, then compare and record what changed in the scene.", []], ["Directing through action verbs", "Instead of asking an actor for a result (‘be angrier’), give them something to do to the other person (‘to threaten him’).", "You can give direction as an action an actor can play, and avoid asking for results.", ["An <b>action verb</b> is a transitive verb: something one character does to another, such as to persuade, to tease, to confront, to comfort or to dismiss. It gives actors something they can do, and the emotion comes out of the doing. A <b>result direction</b> (‘be sadder’, ‘more energy’) asks for an outcome the actor can only fake, which tends to produce tension and generalised acting.", "To use them, work out what each character is trying to do in each beat (their objective and tactics), choose a verb that is active, specific and aimed at the other person, and offer it as a choice in rehearsal (‘what if you try to coax him?’). Ask rather than tell, and expect actors to bring their own. Change the verb to change the scene without describing the emotion. It becomes a shared vocabulary between you and the actors for quick notes between takes."], ["I can say what an action verb is and what a result direction is.", "I can explain why verbs work better than emotions for actors.", "I can give a note as an action verb for a given moment.", "For a scene I can choose verbs for each beat, predict how the performances will change, test them with actors, and justify my choices."], [["Rewrite ‘be angrier’ as an action direction.", "For example, ‘try to shut him down’ or ‘try to make her back off’."], ["Why is a result direction a problem?", "It asks for an outcome the actor can only imitate, which tends to be forced."]], "wKB", "Direct the same short scene with a partner three times, each time giving a different action verb for one character. Predict what each will change, then compare and note which gave the clearest difference.", []], ["Directing through beats", "Directing beat by beat means giving the actor a clear shift to play at each turn in a scene, instead of a general feel for the whole.", "You can give notes tied to specific beats, so actors know where and how a scene changes.", ["Once you have broken a scene into beats, you can direct each of them. Tell the actor what changes at a beat (‘here, you realise she knows’) and what to do differently (‘now try to protect yourself’). This is more precise than a note about the whole scene, and it makes a performance clearer by marking its turns.", "Use the beats in rehearsal to work in sections, to practise a hard transition, or to cut a piece for a particular shot. It also helps in shooting: you can pick up from the middle of a scene at a specific beat. Check you are all working with the same beats, since actors might see the scene differently. Overdoing it can make performances mechanical, so use beats as a map and leave room for discovery."], ["I can say what directing through beats means.", "I can explain how it differs from a general note on a scene.", "I can give a note tied to a specific beat and its change of action.", "For a scene I can plan beat-by-beat direction, predict where actors will blur beats, test, and justify how much detail to give."], [["Why is a beat-specific note more precise than a general one?", "It identifies exactly where and how the scene changes, so the actor can make that turn clear."], ["What is a risk of over-using beats?", "Performances can become mechanical, with no room for discovery."]], "wKB", "Take a two-page scene, mark the beats, and direct it by giving one note per beat. Predict which beat will be hardest for actors to play, then check and adjust.", []], ["Blocking and emotion", "Where actors stand and move in the space shows relationship, power and feeling, often more than words can.", "You can design blocking that expresses what the scene is about, and adapt it with the actors and the DP.", ["<b>Blocking</b> is the planned movement and positioning of actors within a scene. It is agreed between the director and actors, often in collaboration with the DP, during rehearsal or at the beginning of each setup. Distance, height, who moves towards whom, who turns away, who is in the doorway: all show relationship and emotion. Closeness can be tender or threatening, a character who stays still while others move can seem powerful or trapped.", "Start from the beats and objectives: what does each person want, and how would they move in the space to get it? Be open to the actors’ instincts, since they often find movement that is more truthful than a plan. Check blocking against the camera, lighting and sound, because a beautiful move might be impossible to shoot or record. Mark positions, and be consistent between takes and setups. Blocking changes as the scene’s emotional shape changes."], ["I can say what blocking is.", "I can explain how position and movement show relationship, power and feeling.", "I can block a scene so the movement expresses the beats and works for camera.", "For a scene I can design blocking, predict its emotional effect and the technical challenges, test it with actors and crew, and justify the changes."], [["How can blocking show power between characters?", "Through height, distance, who moves towards or away, who controls the space, and who is still."], ["Why check blocking with the DP and sound?", "It must be possible to light, frame and record as well as feel right."]], "KwB", "Block a two-person argument in three ways (close and facing, far apart, one standing and one sitting). Film each and predict how each will change the relationship. Show them to someone and compare their reading to your prediction.", []], ["Ensuring emotional continuity", "Scenes are shot out of order, so the director has to track where each character is emotionally, and keep it consistent within the scene and across the film.", "You can plan and maintain emotional continuity through a disrupted shooting schedule.", ["Films are rarely shot in story order, so an actor may film the end of a relationship before the beginning, or a scene’s close-up hours after its wide. <b>Emotional continuity</b> means keeping the character’s emotional state consistent with where they are in the story and within the scene: the same level of tension, energy, tears or restraint from shot to shot.", "Prepare by mapping the character’s emotional arc scene by scene (for example, a simple chart with a level or a one-line state for each), and share it with the actors and the script supervisor. Before each shoot day, remind the actors where the character has just been. Within a scene, keep track of the energy, volume and physical state between takes and setups, and use the script supervisor’s notes. Allow actors time to reach the right state, and be careful with extremely emotional work. Replay earlier takes when needed."], ["I can say what emotional continuity is and why it is a problem.", "I can explain how out-of-order shooting makes it difficult.", "I can build an emotional map of a character’s arc and use it to brief actors on a shoot day.", "For a film I can predict where emotional continuity will break, plan how to prevent it, test the plan on a mock shoot, and justify how I order scenes."], [["Why is emotional continuity harder than physical continuity?", "The emotional state can’t be photographed, and actors have to recreate it out of order, so it needs mapping and briefing."], ["What can you do at the start of each shoot day to help?", "Remind actors where the character has been and where they are in the arc, and review earlier material if needed."]], "wKq", "Create an emotional map for one character across five scenes, each with a level and a line of state. Predict which scene will be most at risk if shot out of order, then test by having an actor play them in a scrambled order.", []], ["Giving direction and notes", "The way you give direction decides whether actors feel safe and clear, so what you say, when and how matters as much as what you want.", "You can give brief, useful, respectful direction that improves the next take.", ["Good direction is <b>specific, brief, positive and playable</b>. Give notes privately where possible, before the next take and not in front of the crew. Say what to do and not what to avoid, tie it to the objective or action rather than the emotion, and offer one or two things at a time so the actor isn’t overloaded. Start by saying what worked.", "Listen first: ask what the actor was trying to do and whether they felt it was working. Don’t give line readings (the exact way to say it) unless you have to, because the actor then copies instead of finds it. Remember that every note has an emotional effect, and so does silence. Vary your approach for each actor, and be honest. If a note doesn’t work, try another angle rather than repeating it louder."], ["I can name what makes direction useful.", "I can explain why notes are best given privately, briefly and in positive, playable terms.", "I can give a note on a take that improves the next one.", "For a day of shooting I can plan my approach for each actor, predict how they will respond, test it, and justify how I adapt."], [["Why avoid giving line readings?", "The actor copies the sound instead of finding it, which tends to look imitated."], ["Why give a note privately?", "It spares the actor embarrassment in front of the crew and keeps them open."]], "wKj", "Watch a scene and write a note that would help each actor’s next take. Rewrite each as a positive, playable action. Give them to a partner who plays the actor, and predict which note will be misunderstood.", []], ["Working with non-actors", "People without training can give very truthful performances, with the right preparation and a lighter touch.", "You can find, prepare and direct non-actors so they feel comfortable and are convincing.", ["Non-actors bring authenticity, particularly when playing something close to themselves, such as their own job or community. They are usually less comfortable with repeating lines, working with the crew watching, and delivering a performance on cue. They might look at the camera, speak too fast or freeze.", "Choose them for who they are, and be open about what you are asking and how it will be used, including a release. Rehearse in an informal setting, keep the crew small and quiet, and give simple, concrete tasks and actions (‘pour the tea and tell her about the day’) instead of notes about acting. Keep takes short, and don’t over-repeat. Adapt the lines to their natural speech. Look after them: they are not used to long days on set and need extra explanation, breaks and care."], ["I can say that non-actors bring authenticity and different challenges.", "I can explain how to prepare and direct them differently from trained actors.", "I can direct a non-actor in a simple scene using concrete tasks.", "For a film I can plan where to use non-actors, predict the difficulties, test on a short shoot, and justify the approach."], [["Why give a non-actor a physical task?", "It gives them something concrete to do, so they behave naturally and don’t try to ‘act’."], ["Why keep the crew small around a non-actor?", "They are more self-conscious, and a large crew makes them tense."]], "wmj", "Film a non-actor explaining something they know well, then film them in a short scripted scene. Predict which will look more natural, then compare, and note what helped.", []], ["Composition", "Composition is how you arrange people and things in the frame, and a director uses it to tell the audience where to look and what to feel.", "You can choose compositions for meaning and not just for balance, and explain what each says.", ["Composition decides what is in the frame, where, and how much space it has. For a director it is a storytelling tool: a character placed small at the edge of an empty frame feels isolated, two people separated by a gap or an object feel divided, and tight, crowded framing feels trapped. Balance, symmetry, leading lines, depth and the amount of empty space can all be used to express a relationship or a state of mind. The Cinematography role covers the techniques in detail.", "Think about composition early: in storyboards, floor plans and blocking, as well as at the monitor. Ask what the shot is about, and what the audience should notice first. Work with the DP, who brings craft and ideas, and use references. Repeating or breaking a composition can create a visual pattern or a shock. Check the composition for the final aspect ratio and screen size."], ["I can say that composition is about arranging elements in the frame.", "I can explain how placement, space and balance change the meaning of a shot.", "I can compose a shot to express a specific relationship or feeling.", "For a scene I can design compositions that carry its meaning, predict how viewers will read them, test them, and justify choices including where I break convention."], [["How could you show that two characters are emotionally distant through composition?", "Place them far apart in the frame, with space or an object between them, or in separate shots."], ["Why check composition against the final aspect ratio?", "The framing of the edges changes with the ratio, which can cut off or add space you didn’t intend."]], "BgK", "Frame the same two-person scene in three compositions meaning intimacy, tension and distance. Predict what viewers will say about each, then show them to someone and compare.", []], ["Shot size and meaning", "The size of a shot controls how close we feel to a character and how much we know, so each size has a job.", "You can choose a shot size for what the moment needs, and predict its effect.", ["Shot size is how much of the subject is in frame, from an extreme wide shot to an extreme close-up. Wider shots show place, scale and relationships, and tend to feel more objective and distant. Closer shots show faces and details, and tend to feel more intimate, emotional and intense. A close-up of an object can mean it is important.", "Directors use size to control rhythm: wides to set the scene, mediums for conversation, close-ups for the key moments, and the movement between them. Overusing close-ups lessens their power, and staying wide for a long time can hold the audience at a distance. The same size can mean different things in different films, so judge by the effect. The Cinematography role has more on how shot size, type and angle differ."], ["I can name the main shot sizes.", "I can explain what wide and close shots usually do emotionally.", "I can choose sizes for a scene and give a reason for each.", "For a scene I can plan a progression of sizes, predict its emotional effect and pace, test in an assembly, and justify my choices."], [["What is a typical effect of moving from a wide shot to a close-up?", "We move from the context to the character’s feelings, creating intimacy and emphasis."], ["Why is overusing close-ups a problem?", "They lose their power and the audience loses the sense of space."]], "gKB", "Shoot a short scene in only medium shots, then reshoot it using a progression from wide to close-up. Predict how the emotional impact will differ, then cut both and compare.", []], ["Lens choice as storytelling", "The focal length changes how space, depth and distance feel, so a lens is a storytelling choice as well as a technical one.", "You can choose lenses to support a story, not just to fit the frame.", ["Wide lenses show more of the space, exaggerate depth and distance, and make movement towards the camera feel dramatic. They can feel immersive and, used close up, distorting. Longer (telephoto) lenses compress space, so subjects feel closer together or more isolated against a flattened background, and they feel more observational and voyeuristic. Normal lenses are closest to the eye’s natural perspective. Shallow focus isolates, and deep focus connects characters with their environment.", "A director can choose a ‘lens language’ for a film or character: for example a wide lens for a character who is exposed, a long lens for surveillance. Be consistent unless there is a reason to change. Talk to the DP about the effect you want, not just the numbers, and test lenses on location. The Cinematography role covers focal length and perspective in detail."], ["I can say that lenses change how space and depth feel.", "I can explain the usual effects of wide and long lenses on perspective and mood.", "I can choose lenses for a scene to support its meaning and justify the choice.", "For a film I can design a lens language, predict its effect, test lenses on location, and justify the consistent choices and the exceptions."], [["What happens to the sense of distance with a long lens?", "Space is compressed, so subjects and background appear closer together."], ["Why talk to the DP about the effect and not just numbers?", "The DP can choose the right lens, camera position and setup for the effect, which is what matters."]], "BgK", "Shoot the same close-up of a person with a wide lens up close and a long lens from far away. Predict how each changes the feeling of the face and background, then compare.", [["read", "foundational", "Lens manufacturers’ guides on focal length and perspective (Zeiss, Cooke)", "Search: “focal length perspective compression explained”"]]], ["Motivated camera movement", "Camera movement should have a reason: following a character, revealing information or expressing a feeling.", "You can decide when the camera should move, and justify each move.", ["Motivated camera movement has a narrative or dramatic justification: it follows a character, reveals new information, or expresses an emotional state. Movement without motivation is generally considered distracting. Motivation can come from action (a character walks), from information (the camera moves to show what a character sees), or from emotion (a slow push in as tension builds).", "Types include pans, tilts, dolly and track moves, handheld, Steadicam and gimbal, and each has its own feel (smooth, restless, observational). Choose both whether to move and how. Static shots can be powerful too, and a move after a long static period has impact. Consider the cost and time of moves, and work with the DP and 1st AD. Think about where each move starts and ends. The Cinematography role covers the techniques."], ["I can say what motivated camera movement means.", "I can explain the sources of motivation and why unmotivated movement distracts.", "I can plan a move for a scene and say what motivates it.", "For a scene I can design movement, predict its effect and cost, test it, and justify moving or not moving at each point."], [["Name three kinds of motivation for a camera move.", "Following action, revealing information, or expressing an emotion."], ["Why can a static shot be powerful?", "Stillness can create tension or focus, and a later move gains impact by contrast."]], "BKi", "Plan a one-minute scene twice, once with the camera always moving and once with only two motivated moves. Predict which will feel stronger, then shoot or storyboard both and discuss.", []], ["Storytelling through lighting", "Light shapes mood, directs attention and shows time and place. A director uses it as part of the story.", "You can talk about light with the DP in terms of story, and recognise what it communicates.", ["Lighting tells the audience where to look, what time it is, what a place feels like and how a character is feeling. Hard, high-contrast light can feel dramatic or threatening, soft, even light gentle or flat, and darkness can hide or suggest. Colour carries mood and place. Light can also reveal or conceal a character, and change over the film to follow the story.", "As a director you don’t need to light the scene, but you need to describe what you want it to do: the mood, the time of day, who should be emphasised. Share your references and talk through each scene’s emotion with the DP. Respect that the lighting takes time, and recognise how your blocking affects it. See the Cinematography domain ‘Visual Storytelling with Light and Camera’ for the techniques."], ["I can say that lighting affects mood and attention.", "I can explain what hard and soft light, contrast and colour usually communicate.", "I can describe the lighting I want for a scene in terms of story and mood.", "For a film I can plan a lighting approach that follows the story, predict its effect, test it with the DP, and justify the choices."], [["Give an example of lighting directing attention.", "A brighter area or a lit face draws the eye, and darker areas recede."], ["How can a director brief a DP on lighting without technical language?", "Describe the mood, time of day and what should be emphasised, and share references."]], "BKe", "Choose a scene and write a lighting brief in three sentences using only story and mood terms. Predict what the DP will ask, then discuss it with a cinematography student.", []], ["Motif and visual language", "Visual language is the sum of a film’s visual choices. A motif is something that returns and gains meaning through repetition.", "You can define a film’s visual language and use motifs on purpose.", ["<b>Visual language</b> is the sum of all the visual choices in a film: framing, camera movement, lens choice, lighting, colour and aspect ratio. Together they make up the expressive vocabulary through which the film communicates. A coherent visual language has rules (for example, ‘the camera never moves except when a character loses control’), and you can plan them and share them in a look book.", "A <b>motif</b> is a recurring element, such as an image, sound, object, phrase or colour, that gains meaning through repetition across the film. It should relate to the theme, appear at key moments, and change as the story changes. Plan motifs in the script and storyboard and share them with the departments. Don’t overload the film, and be wary of obvious symbols. Test whether viewers notice them."], ["I can say what visual language and motif mean.", "I can explain how a coherent visual language is built from a set of rules.", "I can define the visual language of a short film in a few rules and name a motif.", "For a film I can design visual language and motifs tied to theme, predict how viewers will read them, test, and justify where I change or break the rules."], [["What is a motif?", "A recurring image, sound, object, phrase or colour that gains meaning through repetition."], ["How can a film’s visual language have ‘rules’?", "For example fixed framing, camera movement only at certain moments, or a limited palette, applied consistently."]], "aeB", "Define three visual rules for your film in one sentence each. Predict which one you will break first and why, then check against your storyboards.", []], ["Mise-en-scène", "Mise-en-scène is everything in the frame (set, props, costume, lighting, actors and their positions) arranged to tell the story.", "You can read and design mise-en-scène as a whole, working with the production designer and DP.", ["<b>Mise-en-scène</b> means ‘placing on stage’. It covers everything the audience sees in a frame: the setting and set dressing, props, costume and make-up, lighting, the actors’ appearance and positions, and the composition. Each element tells the audience something about the characters and their world, so production design is not decoration but world-building.", "As a director, think of the frame as a whole and ask what each thing in it is saying. Work with the production designer on each space (what does it say about the character who lives there?), with costume on how characters appear and change, and with the DP on light and framing. Details matter: a single object can reveal a character’s past. Remove what doesn’t help. Watch films and describe their mise-en-scène in detail to learn."], ["I can say what mise-en-scène includes.", "I can explain how set, costume, lighting and positions each tell the story.", "I can describe the mise-en-scène of a shot and what each element suggests.", "For a scene I can design the mise-en-scène as a whole with the departments, predict how viewers will read it, test, and justify what I add or remove."], [["Name five parts of mise-en-scène.", "For example set, props, costume, lighting, actors’ positions and composition."], ["Why is production design more than decoration?", "Each object in frame tells the audience about the characters and their world."]], "aKB", "Take a single film frame and list every element of mise-en-scène and what it suggests. Predict which elements the director added deliberately, then research the film to check.", []], ["180° rule and the axis", "The 180° rule keeps all cameras on one side of an imaginary line between subjects, so the audience always knows where everyone is.", "You can set up and keep to the axis, and know how to cross it safely when you need to.", ["The <b>axis</b> (or line of action) is the imaginary line between two subjects, or along the direction of movement. The <b>180-degree rule</b> says that all cameras should stay on the same side of it throughout a scene. This keeps left and right consistent between shots (A is always on the left, B on the right). <b>Crossing the line</b> reverses the apparent screen positions and can confuse the audience about where people are.", "The axis needs to be decided at the start of each scene and everyone (DP, script supervisor, 1st AD) needs to know it. You can change the axis legitimately: by showing the camera move across the line in a continuous shot, by cutting to a neutral shot on the line, by using a character’s movement to establish a new axis, or by a cutaway. You can also cross it deliberately for disorientation. The script supervisor tracks the axis for each scene and flags risky setups."], ["I can say what the axis and the 180° rule are.", "I can explain why crossing the line confuses viewers and how to cross it safely.", "I can set the axis in a scene and plan camera positions on one side.", "For a scene I can plan coverage around the axis, predict where it might be crossed, test the cuts, and justify when I deliberately break it."], [["What happens to screen positions when you cross the line?", "They reverse (the character on the left appears on the right), which can confuse the audience."], ["Name two ways to cross the axis without confusing viewers.", "Show the camera moving across in a shot, or cut to a neutral shot on the line or a cutaway first."]], "gqK", "Shoot a two-person conversation on one side of the axis, and then add one shot from the other side. Predict what viewers will notice, then cut it together and ask someone to say where each person is.", []], ["Screen direction", "Screen direction is the way characters and objects move or face on screen, and it must stay consistent across cuts.", "You can keep screen direction consistent and use changes deliberately.", ["<b>Screen direction</b> is the direction in which characters or objects move or face within the frame. If a character exits frame right, they should normally enter the next shot from frame left, so the viewer reads continuous movement in the same direction. If direction reverses without a reason, it can look like they have turned back, or give the feeling of confusion.", "Plan screen direction in the script and storyboard, particularly for journeys, chases and arrivals. Decide the direction of travel for each sequence and keep it, checking it as locations and setups change. To change direction legitimately, use a neutral shot (head-on or from behind), show the character turning, or cut away. Script supervisors keep track of screen direction and warn of errors, and editors depend on it. The same applies to the direction of a look."], ["I can say what screen direction is.", "I can explain the exit and entry rule and what happens if it reverses.", "I can plan screen direction for a journey and keep it consistent across setups.", "For a sequence I can plan directions, predict where errors occur, test the cuts, and justify any deliberate reversal."], [["A character exits frame right. Where should they enter the next shot?", "From the left, to keep the direction of travel consistent."], ["How can you legitimately reverse direction?", "Use a neutral shot, show the character turning, or cut away."]], "gqK", "Shoot a character crossing a room in three setups. First keep the direction the same, then deliberately reverse it in one. Predict what viewers will think, then cut and ask someone what happened.", []], ["Eyelines and eyeline match", "Where an actor looks must match the position of what they’re looking at, so the audience can follow who is looking at what.", "You can plan and check eyelines so that cuts between characters work.", ["<b>Eyeline</b> is the direction in which an actor is looking during a shot. An <b>eyeline match</b> is an editing convention: if a character looks off-screen in one shot, the next shot should show what they are looking at, and its position in the frame should correspond to the direction of their gaze. If someone looks left to right, the thing they see should be on the right of the next frame’s subject.", "On set, eyelines need an object or person at the right place and height for the actor to look at, and consistency between takes. If the other actor isn’t available (for example, for an over-the-shoulder reverse), have someone stand in, or the actor look at a mark. Wrong eyelines (too high, too far from the camera, looking past someone) make conversations feel disconnected. The script supervisor records the direction and height of each eyeline so later shots match."], ["I can say what an eyeline and an eyeline match are.", "I can explain why the position of the looked-at thing in the next shot must correspond.", "I can set eyelines in a conversation and check they cut together.", "For a scene I can plan eyelines in each setup, predict where they will fail, test in an assembly, and justify any deliberate mismatch."], [["Why do eyelines matter in a conversation?", "If they don’t match, the characters appear not to be looking at each other, and the scene feels disconnected."], ["What should an actor look at if their scene partner is not there?", "A stand-in or a mark placed at the right position and height."]], "gqK", "Shoot a conversation with matching eyelines and then with a deliberate mismatch (looking too high or too far). Predict what viewers will feel in each, then cut and test.", []], ["Coverage techniques", "Coverage is the set of shots that makes a scene editable and serves its emotional intent. Directors plan it, not just collect it.", "You can plan coverage that gives an editor the options they need without wasting time.", ["From the director’s perspective, planning coverage means deciding which shots are needed to make the scene editable, and which shots serve the emotional intention of the scene. A common approach is to start with a <b>master shot</b> (a wide shot covering the whole scene, which establishes geography and blocking), then closer coverage such as mediums, close-ups and reactions, plus inserts and cutaways. Other approaches include shooting in long takes or single set-ups when the scene is built that way.", "Cover for the cut: make sure you have entrances and exits, matching action, reactions, and enough overlap. Over-coverage wastes time and money, while insufficient coverage found in the edit is almost impossible to fix without a reshoot. Plan with the shot list and decide your must-haves. Think about whether you’d use each shot, and how many angles each moment needs. Tell the script supervisor what you’ve covered."], ["I can say what coverage is and name common shots in it.", "I can explain what a master shot does and the risks of too much or too little coverage.", "I can plan coverage for a dialogue scene including the master, closer shots, reactions and inserts.", "For a scene I can design coverage that serves the emotion, predict what the editor will need, test in a rough assembly, and justify what I leave out."], [["What does a master shot give you?", "A wide shot covering the whole scene, establishing geography and blocking."], ["Why is missing coverage a serious problem?", "It’s almost impossible to fix in the edit without a reshoot."]], "Kgq", "Plan coverage for a three-minute dialogue scene in two ways (extensive and minimal). Shoot the minimal version and try cutting it, noting what you wished you had. Predict the gaps first.", []], ["Directing with editing in mind", "Shooting is gathering material for the edit. Thinking like an editor while directing gets you the footage that cuts together.", "You can plan and shoot with the cut in mind so the scene works in the edit.", ["The film is made in the edit, so a director considers how shots will join. Practical habits include: shooting enough <b>overlap</b> of action between angles to allow cuts on action, starting and ending takes cleanly with a little space before and after so editors can cut in and out, getting reactions and cutaways, keeping continuity of props, positions and performance, capturing room tone and clean dialogue, and thinking about where each cut will go and what it will look like.", "Think about rhythm: how long you want each shot to hold, and how shots will change pace. Watch rough assemblies during the shoot if possible and have the editor’s feedback early. Don’t assume problems can be fixed in post. A director who understands editing makes fewer, better choices on set, and the editor’s work is easier."], ["I can say that a director should think about the edit while shooting.", "I can explain habits such as overlap, clean starts and ends, reactions and cutaways.", "I can shoot a scene with overlap and clean entrances and exits, and cut it.", "For a film I can plan for the edit, predict where the cut will fail, test with a rough assembly during the shoot, and justify changes."], [["Why leave a little time before and after each take?", "So editors have room to cut in and out and to handle transitions."], ["Why assemble footage during the shoot if possible?", "To find problems with coverage or continuity while there is still time to fix them."]], "uqg", "Shoot a short scene and cut it the same day. Note every moment where you wished you had a different shot. Predict how many there will be, then count, and use the list to plan your next shoot.", []], ["Cutting on action", "A cut made during a movement hides the join, so two angles feel like one continuous action.", "You can plan and shoot so that cutting on action works smoothly.", ["A cut on action takes place during a physical movement, such as someone standing, opening a door or turning, so the movement carries the viewer’s eye across the cut and the join is almost invisible. It requires the action to be performed in the same way, at the same pace, in both angles. A related technique is <b>overlapping action</b>, where actors begin or complete the action slightly earlier or later in the next angle, giving the editor flexibility to find the best cut point.", "To plan it, choose where the cut will fall (for example, mid-movement), and ask actors to repeat the movement in each setup in the same way, with a little overlap. The script supervisor records the exact moment and the details (which hand, which foot) so they match. Check props and positions. A <b>match cut</b> joins two shots through a visual or action similarity, which can also link ideas, as well as continuity. The editor and script supervisor depend on consistency."], ["I can say what a cut on action is.", "I can explain why it hides the cut and what overlapping action is.", "I can shoot a simple action from two angles so it cuts smoothly.", "For a scene I can plan action matches and overlaps, predict where continuity will break, test in the edit, and justify the choices."], [["Why does a cut on action look smooth?", "The movement carries the viewer’s eye over the cut, so the change of angle is less noticeable."], ["What does the script supervisor record to help with it?", "The exact moment and details of the action, such as which hand and which foot, so they can be matched."]], "uqg", "Film someone sitting down from a wide and a medium angle, both with a clear overlap. Cut at three different points and predict which will be smoothest, then compare.", []], ["Kuleshov effect and montage", "Meaning in film comes from the juxtaposition of shots. The same face means different things depending on what it is cut with.", "You can use the cut between shots to create meaning, and know the limits.", ["The <b>Kuleshov effect</b> is the phenomenon by which the meaning of a shot (typically a close-up of an expressionless face) is determined by the shot that precedes or follows it. The same face reads as hungry, mournful or desiring depending on what it is cut with. It shows that audiences connect shots into meaning, and that the edit creates ideas, not just continuity.", "<b>Montage</b> uses a sequence of shots to compress time, build an idea or an emotion, or show a relationship between things, as in a training sequence or the juxtaposition of two situations. Directors plan montage in the shot list and the script, shoot inserts and details to give the editor material, and think about how shots will relate. Be careful about unintended meanings: a shot next to another will always create a relationship. Test the sequence on viewers."], ["I can say what the Kuleshov effect is.", "I can explain how montage uses juxtaposition to make meaning.", "I can create a short sequence where the meaning of a shot changes with its neighbours.", "For a film I can design montages, predict their meanings and unintended readings, test them, and justify the choices."], [["What does the Kuleshov effect show?", "That the meaning of a shot depends on the shots before and after it."], ["What is a risk of juxtaposing two shots?", "They will create a relationship that viewers will read, whether or not you intended one."]], "auK", "Film one neutral close-up of a face and three different second shots (food, a coffin, a smiling child). Cut each pairing and predict what viewers will say the person feels, then test it.", [["watch", "foundational", "Filmmaker IQ on the Kuleshov effect and montage", "Search: “Filmmaker IQ Kuleshov effect”"]]], ["Breaking the rules deliberately", "Conventions such as the 180° rule or continuity cutting can be broken on purpose to create an effect, but only if you know what you are breaking.", "You can break a rule deliberately, predict the effect, and tell it from a mistake.", ["Film grammar (the axis, screen direction, eyeline matching, smooth cutting) exists to keep viewers oriented. Breaking it creates disorientation, tension or energy. Examples include a <b>jump cut</b> (between two similar shots of the same subject, creating a jarring discontinuity, used for style by filmmakers like Godard), a <b>Dutch angle</b> (a tilted horizon creating unease), crossing the line, or a mismatched eyeline.", "The difference between an effect and an error is intention, consistency and context. If you know the rule, you can predict what will happen when you break it, and prepare the audience or let the break serve the story. If a rule is broken accidentally, viewers just feel something is wrong. Test deliberately broken rules on viewers to check the effect is what you intended, and use them sparingly so that they keep their power."], ["I can name some conventions that can be broken and what effect that gives.", "I can explain the difference between a deliberate break and a mistake.", "I can break a convention on purpose in a scene and predict its effect.", "For a film I can plan where and why to break rules, test the effect on viewers, and justify the decisions, including where I choose to keep the rules."], [["What distinguishes a deliberate rule-break from a mistake?", "Intention and consistency: the break serves the story and the audience feels it as an effect."], ["Name two rules that can be broken for effect.", "For example the 180° rule and smooth continuity cutting (jump cuts)."]], "aeu", "Shoot a calm conversation, then re-cut it to create unease by breaking one rule (for example, a jump cut or crossing the line). Predict what viewers will say, then test it on two people.", []], ["Shot lists", "A shot list is the director’s translation of the script into camera language: every planned shot, in order, with its purpose.", "You can write a shot list that guides the day, supports the schedule and helps the crew.", ["A <b>shot list</b> is prepared by the director and DP, and lists every planned shot for a scene or shoot day. Typical columns are the scene number and location, shot number (for example 1A, 1B), shot size (WS, MS, MCU, CU, ECU), camera movement (static, pan, dolly, handheld), lens focal length, and a description or purpose of the shot. It is the primary planning tool for the day: it tells the DP what coverage you intend and helps the 1st AD estimate the time per setup.", "A good shot list is more than a list: each shot has a reason in terms of the story, and priorities are marked (must-have, nice-to-have). Update it as plans change after the recce and rehearsal, and share it with the crew. Keep it realistic: too many shots for the time guarantees compromise. Tools include dedicated software, spreadsheets or index cards. During shooting, use it with the script supervisor to track what is done."], ["I can say what a shot list is and name its usual columns.", "I can explain why each shot needs a purpose and how it helps the schedule.", "I can write a shot list for a scene with size, movement, lens and purpose, and mark priorities.", "For a day I can plan a realistic shot list, predict the time each setup takes, test it with the 1st AD, and justify what I cut or reorder."], [["Why does a shot list need a purpose for each shot?", "So you can decide what is essential, and explain and protect the important shots when time is short."], ["How does the shot list help the 1st AD?", "It shows how many setups there are, so they can estimate the time and schedule the day."]], "KsB", "Write a shot list for a one-page scene with a purpose for every shot and mark the must-haves. Ask a 1st AD (or a producing student) to estimate the time. Predict their total, then compare with your own estimate.", []], ["Storyboards", "A storyboard is a visual plan of the film drawn shot by shot, used to commit to ideas and communicate them to the crew.", "You can storyboard a sequence clearly enough that others can understand your intent.", ["A <b>storyboard</b> is a visual plan of the film drawn as sequential panels, each representing a shot. It communicates visual intentions to the crew, particularly for complex or action-heavy sequences, and helps the director, DP, production designer and 1st AD agree on what is wanted. Stick figures with clear framing indicators are enough: the value is in the thinking, as committing to a visual approach before the shoot reduces the load on the day.", "Include in each panel the framing, the key action, camera movement (with arrows) and the shot number that matches the shot list. Add short notes on dialogue, sound or lighting. Don’t draw everything: focus on complex sequences, key moments and anything where you need to align people. Treat a storyboard as a proposal that can change when you see the real location and actors. Digital tools and index cards can also be used."], ["I can say what a storyboard is for.", "I can explain what to include in each panel and why stick figures are enough.", "I can storyboard a short sequence with framing, movement and shot numbers.", "For a sequence I can plan which parts need boards, predict how others will read them, test on the DP and crew, and justify changes made on set."], [["Why are rough sketches enough for a storyboard?", "The value is in deciding the framing and sequence, not in the quality of drawing."], ["Which sequences most need storyboards?", "Complex or action-heavy sequences and any where several departments need to align."]], "KsB", "Storyboard a thirty-second sequence with stick figures. Give it to someone who hasn’t read the script and ask them to describe what happens. Predict what they’ll misread first, then compare.", []], ["Floor plans and overheads", "A floor plan shows the space from above, with actors’ and camera positions, so you can plan blocking and coverage and check the axis.", "You can draw an overhead plan of a scene that others can use.", ["An <b>overhead</b> (or floor plan) is a top-down diagram of the set or location showing walls, doors, windows and furniture, with the actors’ positions and movement (usually arrows) and the positions of the cameras for each setup, with lines showing their field of view. It is a fast way of working out blocking, checking coverage and the 180° rule, and showing the DP, designer and 1st AD what you want. Software such as Shot Designer helps, but pen and paper work well.", "Draw it to scale where possible (ideally from a recce measurement), mark the axis, the camera positions and the numbering of setups, and note lights if you know them. Use one for each scene or for each change of blocking. It reveals problems early: a wall in the way of a shot, a position too tight for the camera, or crossed axes. The production designer’s floor plans and the lighting plan can be combined with it."], ["I can say what an overhead plan shows.", "I can explain how it is used to plan blocking, coverage and the axis.", "I can draw an overhead for a scene with actor and camera positions and the axis.", "For a scene I can plan blocking and cameras on a plan, predict the problems, test on location, and justify changes."], [["How does an overhead help you check the 180° rule?", "You can draw the axis and see whether all camera positions are on the same side."], ["Why draw it to scale?", "To check whether the space can actually hold the camera, lights and people."]], "KBs", "Draw an overhead for a conversation scene in a real room, with three setups and the axis marked. Visit the room with a camera and predict which setup won’t fit, then test.", []], ["Look and tone references", "References show collaborators what you mean. They work best when you explain exactly what you are drawing on.", "You can build and use references so that heads of department understand the look and tone you want.", ["Visual and tonal references (films, photographs, paintings, music) let you describe something that is hard to say in words. Typically three to five films are chosen whose visual approach is close to what you want, and it matters to be specific about what you draw from each (the colour, the framing, the pace, the light, the sound). A reference without a specific point just says ‘I like this film’.", "Gather them in a <b>look book</b> or visual bible shared with the crew, with images and notes. Use them as a start for discussion, not as something to copy: the aim is a shared understanding that each head of department adapts to the story and budget. Include references for sound and music as well as the picture. Update the look book as decisions are made. See the cinematography domain on look development."], ["I can say what a reference is for.", "I can explain why references need a specific point and what a look book is.", "I can build a reference set with annotations for a project.", "For a film I can choose references that suit the story and budget, predict how departments will interpret them, test with the team, and justify adaptations."], [["Why explain what you’re drawing from a reference?", "Without a specific point, the reference is just a general liking and others can’t act on it."], ["Why not copy a reference exactly?", "The story, location and budget differ, so each department should adapt the ideas."]], "BeK", "Choose three films as references for your project and annotate exactly what you draw from each. Present them to a DP or designer, predict what they will interpret differently from you, then compare.", []], ["Recce", "The recce is when a director visualises the film in the real space, and finds out what the space will and won’t allow.", "You can use a recce to plan shots, blocking and problems, and share what you find.", ["A recce (reconnaissance) is a visit to a location, by the director and key heads of department, to assess its suitability and plan the shoot. For the director, it is a chance to imagine the scene in the actual space: where the actors will stand and move, where the camera will go, what the light does, and what the sound is like. Problems found on a recce cost nothing, but those found on the day cost a lot.", "Take your shot list, storyboard and overhead plan and test them in the space. Note where the plan doesn’t work and find alternatives. Photograph and take measurements, check the time of day for the light, and listen. Talk to each head of department about their needs. After the recce, update the plans and tell the 1st AD of anything that changes the schedule. See ‘Location recces vs. tech scouts’ in the Producing role for the logistics."], ["I can say what a recce is for.", "I can explain what a director looks for and why problems are cheap to fix at this stage.", "I can test a scene’s blocking and shots in a real location and note changes.", "For a film I can plan recces, predict what the locations will force me to change, test the plan on site, and justify the adaptations."], [["Why is a recce valuable to a director?", "It shows how the planned blocking, shots and light work in the real space, while changes are cheap."], ["What should you bring to a recce?", "The shot list, storyboard and floor plan, and a camera or phone to test and record."]], "KBp", "Visit a real location with your storyboards and test each shot in the space. Predict which two shots will have to change, then record what happened and how you adapted.", []], ["Conveying a vision to crew", "A director’s vision is only useful if the crew understand it, and each department can see how to contribute.", "You can explain a vision so that others can act on it and add to it.", ["The vision is the film’s intention, look, tone and meaning. To convey it, be clear and specific: state the theme, the tone, and the few key ideas, show references with the points you draw from, explain the rules of the visual language and what the film is trying to make the audience feel. Use a look book, a short briefing, a table read and one-to-one conversations with each head of department, with their department’s needs in mind.", "Communicate it more than once, because people forget and hear things differently. Invite their ideas: heads of department often improve it. Keep it consistent, and say when it changes and why. On the day, give brief reminders: ‘this scene is about trust’, rather than long speeches. Check understanding by asking people to explain it back. Be generous and clear, since unclear visions waste time and cause conflict."], ["I can say what a director’s vision is.", "I can explain why it needs to be specific, repeated and checked.", "I can brief a head of department on the vision and ask them to explain it back.", "For a production I can plan how to communicate the vision to each department, predict where it will be misunderstood, test it, and justify how I adapt."], [["Why ask people to explain the vision back?", "To check that they have understood it as you meant it."], ["What should you do when the vision changes?", "Say so clearly, explain why, and tell everyone affected."]], "mKj", "Prepare a five-minute briefing on your film’s vision for a sound recordist and a designer. Ask each to explain it back, and predict how their versions will differ from each other and from yours.", []], ["Communication chain on set", "A set works because information flows through the right people. A director needs to know who to talk to, and who talks to whom.", "You can use the communication chain so your decisions reach the right people quickly.", ["On set, the director gives creative direction, the <b>1st AD</b> runs the schedule and relays decisions to the crew, heads of department manage their own teams, and the script supervisor tracks continuity. Creative notes to actors come from the director, privately where possible, not through the crew. Requests to departments go through their heads (the DP for camera and lighting, the production designer for art) and not directly to their teams.", "Using the chain protects your time and prevents confusion: if you tell a camera assistant to change a lens without telling the DP, the DP finds out too late. Tell the 1st AD about any change that affects the schedule. Be concise and clear. Set up how people reach you with problems, so you aren’t constantly interrupted but are told what matters. In emergencies and safety matters, anyone should be able to speak up. Learn each role’s job so you know who to ask."], ["I can say who runs the schedule and who gives creative notes to actors.", "I can explain why requests go through heads of department and the 1st AD.", "I can give instructions on a practice shoot using the chain.", "For a production I can plan the communication lines, predict where they will break down, test on a practice shoot, and justify the structure."], [["Why tell the 1st AD about changes?", "They affect the schedule and other departments, and the 1st AD can relay them."], ["Why speak to the DP, not the camera assistant, about a lens change?", "The DP is responsible for the image and needs to know and agree, otherwise they may find out too late."]], "bfK", "Run a practice shoot where you must give five instructions to different departments. Write down who you told. Predict where the chain will be broken, then check with the 1st AD and the heads of department.", []], ["Working with HODs", "Heads of department are specialists who can improve your film. A director who briefs, listens and trusts them gets the best from them.", "You can build a working relationship with each head of department that gets better work.", ["Each head of department (DP, production designer, sound recordist, gaffer and others) has expertise and a team, and their own priorities. Your job is to give them a clear brief and the vision, listen to their ideas and constraints, and then make decisions. Meet them early and individually, share the script, the references and the schedule, and agree what you want from their department and what they need from you.", "Respect their craft: say what you want to achieve and ask how, instead of dictating the method. Be honest about the budget and time, and present priorities. Listen to problems early and thank people. Give feedback privately and specifically. Differences will arise between departments (for example, between camera and sound), so help find solutions. Trust grows from clear communication and consistent decisions. Keep the working relationship in mind beyond one project."], ["I can name the main heads of department and say what each does.", "I can explain what each needs from a director and what a director should ask of them.", "I can run a first meeting with a head of department, with a clear brief and questions.", "For a production I can plan how to work with each head, predict conflicts between departments, test my approach, and justify the decisions."], [["Why say what you want to achieve rather than how?", "The head of department knows the best method and may find a better solution."], ["When should you meet heads of department?", "Early, individually, before major decisions are fixed."]], "mKj", "Meet a DP or designer and brief them on a scene by describing the effect and not the method. Predict their first question and one idea they will add, then record what happened.", []], ["Decision-making under time pressure", "On set there are always more things to do than time. A director must decide quickly, clearly and for the right reasons.", "You can make fast decisions that protect what matters most and communicate them calmly.", ["Time pressure forces choices: which shot to drop, whether to do another take, how to fix a problem. Good decisions rely on preparation: know your priorities (what is essential to the story), have a shot list with must-haves, and know the options. In the moment, ask what the scene needs, what you can live without, and what each option costs in time and quality.", "Decide, say it clearly, and move on, instead of hesitating, since indecision wastes the time of the whole crew. Consult your heads of department briefly if the answer is technical. If you are unsure, take the safer option and the one that protects the performance. Avoid changing your mind repeatedly. Afterwards, review what you decided and learn from it. Safety and welfare decisions are not negotiable under pressure."], ["I can say that preparation and priorities help decisions under pressure.", "I can explain a quick way to decide using what the scene needs and what each option costs.", "I can make and communicate a decision in a simulated time crunch.", "For a shoot I can plan decision rules for likely problems, predict where I will be tempted to compromise, test them in a simulation, and justify the choices."], [["What questions help in a quick decision?", "What does the scene need, what can I live without, and what does each option cost in time and quality?"], ["Why is indecision costly on set?", "The whole crew waits, so time is lost even if the eventual choice is good."]], "mKj", "With a partner acting as the 1st AD, run a practice day where you lose an hour at midday. Predict what you will cut, then make the calls in real time and reflect on how it went.", []], ["Prioritising shots", "Not every shot is equal. Knowing the ones that must be got lets you protect them when time runs short.", "You can rank shots by importance and use the ranking during the day.", ["A shot list should tell you which shots the film cannot do without. Rank each as essential, important or nice-to-have, based on the story and the edit: the key performance, the shot that sets geography, the reaction that makes the moment. Share the ranking with the 1st AD and DP, so they can schedule the essential shots when the crew and light are best.", "During the day, watch the time against the plan. If you fall behind, decide early what to drop, simplify coverage, combine shots, or shoot an essential in a different way, and tell the crew. Consider what the editor needs: a scene can often be cut with fewer angles but never without its key moments. Record anything you drop so it can be picked up later if possible. See ‘Must-have shots’ in the Producing role."], ["I can say what a must-have shot is.", "I can explain how to rank shots and why the ranking is shared.", "I can rank the shots in a scene and choose what to drop if time is lost.", "For a day I can plan priorities, predict where I’ll be forced to cut, test the plan on a practice day, and justify the decisions."], [["Why share the ranking with the 1st AD?", "So the essential shots are scheduled when conditions are best and protected when time is short."], ["What helps you decide what to drop?", "The ranking of shots and what the editor needs to make the scene work."]], "Kmp", "Rank every shot in a sample scene and cut 30 per cent of the list. Predict whether the scene will still work, then cut it from the remaining shots and judge.", []], ["Set culture and welfare", "The director sets the tone of the set. How people are treated affects their safety and their work.", "You can create a set that is respectful, safe and productive, and respond when it isn’t.", ["A set’s culture is what is normal on it: how people speak to each other, how mistakes are handled, whether it is safe to raise concerns, how breaks and hours are respected. The director is a key influence: if you are calm and respectful, others follow, and if you shout or blame, it spreads. Good culture is not a luxury, since people who feel safe do better work and speak up about problems.", "Practical steps include brief and clear communication, thanking people, reasonable hours and breaks, an open way to raise concerns, and zero tolerance for bullying and harassment. Scenes involving intimacy, nudity, violence or distress need special care: plan them with the actors in advance, obtain informed consent, limit the people present and use trained support (for example, an intimacy coordinator on larger productions) and your institution’s procedures. Look to the Film and TV Charity and union guidance, and use the institution’s support routes."], ["I can say that the director sets the culture of the set.", "I can explain why safety to raise concerns and respect for hours matter.", "I can plan how to run a respectful set and handle a sensitive scene with consent.", "For a production I can predict where the culture will be tested, test my approach through role-play, and justify the standards and the support I put in place."], [["Why does the director influence set culture so much?", "Others follow their behaviour, so calm and respect or shouting and blame spread through the crew."], ["What should you do before filming a sensitive scene?", "Plan it with the actors in advance, get informed consent, limit who is present and arrange appropriate support."]], "cmj", "Write a short set culture statement for your shoot (five things you will do and one you won’t). Share it with the team and predict which will be hardest to keep, then reflect on it at the end of the shoot.", []]];
YR.pd=[["Design breakdown", "The production designer’s breakdown reads the script for everything physical that the art department must create, find or change.", "You can break a script down for design, so the budget, schedule and creative plan can be built from it.", ["A <b>design breakdown</b> goes through the script scene by scene and lists everything the art department is responsible for: every set and location, the time and place, props (hero, action and background), set dressing, graphics (signs, documents, screens), vehicles, animals and food, plus costume and make-up needs and anything that must be built, aged or changed. It should note scene numbers, interior or exterior, day or night, and which characters are in each scene.", "The result drives the design: it shows how many sets and builds there are, what needs sourcing and when, and what is expensive or risky. It feeds the budget, the sourcing schedule and the conversation with the director about priorities. Work from the locked production draft, share it with the director, the 1st AD, and the DP, and update it as the script and locations change. Use a spreadsheet or breakdown software, with a column for each type of element."], ["I can say what a design breakdown is.", "I can explain what it lists and which other documents it feeds.", "I can break a short script down for design into sets, props, dressing, graphics and costume.", "For a script I can predict which elements will be hardest and most expensive, test the breakdown with the director and 1st AD, and justify what I would simplify."], [["Name five things listed in a design breakdown.", "For example sets, hero props, set dressing, graphics, vehicles, food, and costume or make-up needs."], ["Why work from the locked draft?", "Script changes alter the elements needed, so a breakdown from an earlier draft quickly becomes wrong."]], "nsh", "Break down a five-page script for design in a spreadsheet. Predict which three items will be hardest to source, then ask a designer or a producing student to review it.", []], ["Mood boards", "A mood board is a collection of images that communicates a feeling, tone or aesthetic. It is a quick way to agree a direction before spending anything.", "You can build a mood board that communicates a direction clearly and use it to start conversations.", ["A <b>mood board</b> is a collection of visual references assembled to communicate a specific aesthetic feeling or tone. It may include photographs, paintings, film frames, colour swatches, textures, objects, typography and fabric samples. It is a fast and inexpensive way to work out and share ideas with the director and DP, before committing to builds or purchases.", "A good board is selective and annotated: choose images for a reason (colour, texture, shape, light, era or mood) and say what the reason is. Keep one board per environment or theme. Use the board to start a conversation, find where people agree and disagree, and refine it. Respect copyright when sharing or publishing images: boards for internal use are different from public ones, and credit where you can. A mood board is a start, and the look book or design bible develops it."], ["I can say what a mood board is for.", "I can explain why images need a reason and annotation.", "I can build an annotated mood board for one environment.", "For a project I can build boards that communicate a direction, predict where others will disagree, test them with the director and DP, and justify what I changed."], [["Why annotate the images on a mood board?", "So others know what you’re drawing from each one, such as colour, texture or mood."], ["What is the board’s main purpose?", "To communicate and agree a direction cheaply before committing to builds or purchases."]], "nrB", "Make a mood board for one location in your film, with a one-line reason for each image. Show it to your director and predict which image they’ll question, then compare.", []], ["Look book / design bible", "A look book or design bible is the comprehensive visual document that establishes the aesthetic world of the film and is shared with every department.", "You can produce a clear design bible that other departments can use.", ["A <b>look book</b> collects reference images that establish the aesthetic direction of the film, shared with the director and all heads of department to give a common visual language. A <b>design bible</b> is the production designer’s fuller document establishing the world of the film: the colour palette, texture references, notes on location dressing and set builds, and prop references, organised by environment and character. The director’s and DP’s look books relate to it, and should agree on palette and tone.", "Make it usable: structure it by location or sequence, include images, short notes and key decisions, and state clearly what will be added, removed or changed in each real space. Keep it short enough to be read. Share it before the recce so everyone can plan, and update it with decisions. Check it against the schedule and budget. It also gives the costume, make-up and props teams a shared reference."], ["I can say what a look book and design bible are.", "I can explain how they differ and what a design bible should contain.", "I can produce a design document for one location with palette, texture, dressing and builds.", "For a film I can produce a bible that other departments can use, predict where it is unclear, test with them, and justify updates."], [["How does a design bible differ from a look book?", "A look book collects references to set direction, while a design bible is the designer’s fuller document of palette, texture, dressing and prop references by environment."], ["Why share it before the recce?", "So every department can plan for the look when they see the location."]], "nBs", "Write a one-page design document for one location with a mood board, palette, what will be added, removed or changed, and a key prop. Test it by giving it to the DP and noting their questions. Predict them first.", []], ["Primary and secondary research", "Primary research means going to the thing itself. Secondary research means using what others have written or made about it. Good design uses both.", "You can research a world thoroughly, record where your information comes from, and judge it.", ["<b>Primary research</b> is first-hand: visiting places, handling real objects, photographing, measuring, interviewing people who know the world (a nurse for a hospital set, a butcher for a butcher’s shop), and looking at original documents and archives. <b>Secondary research</b> uses what others have produced: books, articles, websites, documentaries and other films. It is quicker and wider, but can repeat errors and film clichés.", "Use both: secondary research to learn what to look for, and primary research to get details that make a set feel true. Keep records of where each source came from so that decisions can be justified and images credited. Be critical about what is reliable. Don’t just copy another film’s version of a world. Archive collections and museums can be a great source, and institutions often have access arrangements."], ["I can say the difference between primary and secondary research.", "I can explain why both are needed and why sources are recorded.", "I can research a setting using at least one primary and one secondary source and keep a source log.", "For a film I can plan the research, predict what it will reveal, test my conclusions against an expert, and justify my design choices from it."], [["Give an example of primary research for a hospital set.", "Visiting a hospital, photographing a ward, and talking to a nurse."], ["Why be careful with other films as research?", "They may repeat clichés and errors instead of showing what the real place is like."]], "nB", "Research one setting from your film using one primary and two secondary sources. Predict which will give you the most useful detail,
