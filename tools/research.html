YR.ss=[["Costume, hair and make-up", "The script supervisor is the film’s memory for what every character looks like in every shot, and works closely with costume, hair and make-up.", "You can track costume, hair and make-up through a scene so every shot matches.", ["Scenes are shot out of order and in pieces, so a jacket, a hairstyle or a smear of mud has to be remembered. The script supervisor notes what each character wears and how (sleeves rolled, collar open, tie loosened), the state of hair, and make-up details such as sweat, tears, cuts and bruises, at every setup. Anything that changes <b>during</b> a scene (a coat taken off, a drink spilled on a shirt) is logged at the exact line or action where it changes.", "Costume, hair and make-up keep their own records and do the detailed dressing, while the script supervisor catches what changed between takes and setups and raises it before the next take. Agree the system before the shoot: who photographs what, how looks are numbered, and how notes are shared. Check each actor against the last setup, in the monitor and in person. See the Production Design role (Costume continuity, Hair and make-up continuity) for the department side."], ["I can say what costume, hair and make-up continuity covers.", "I can explain why changes during a scene are logged at the exact moment they happen.", "I can record the costume and appearance of two characters through a scene and spot a change between setups.", "For a film I can plan a continuity system with the costume and make-up teams, predict where it will break, test it on a practice shoot, and justify the notation I use."], [["Why log a change at the exact line or action where it happens?", "So the editor and the next setup know which part of the scene shows the old state and which the new."], ["Who keeps the detailed costume and make-up records?", "Those departments keep their own, and the script supervisor checks and cross-references against them."]], "qzB", "Shoot a 30-second scene in which a character takes off a jacket and rolls up sleeves, in two setups. Log appearance with notes and photographs. Predict one detail that will change between setups, then cut the scene and check.", []], ["Props and set dressing", "Every visible object has a position and a state. The script supervisor tracks them, with the art department, so cuts between angles don’t jump.", "You can track props and dressing within a scene.", ["Within a scene, objects must be in the same place and state in every angle: how full a glass is, which hand holds a phone, where a bag sits on a table, whether a door is open. Props that are moved or used (hero and action props) are the main risk, and the script supervisor notes <b>who moves what, at which line</b>, and the state at the start and end of each take.", "Note positions with reference to fixed things in frame (the edge of the table, a window) and take a photograph at each setup. Raise differences before the next take, and tell the props team what must be reset. Food and drink need special care because they are consumed: note how much is eaten or drunk at which line, and have spares. Differences are easiest to fix on set, because they are very hard to fix in the edit. See the Production Design role (Tracking and continuity)."], ["I can say what props continuity involves.", "I can explain why moved and consumed items are the main risk.", "I can record the positions and states of props through a scene and notice a difference between takes.", "For a scene I can predict which props will cause problems, test my notes, and justify how I describe positions."], [["How would you describe a prop’s position in notes?", "In relation to fixed things in frame, such as the table edge or a window, plus a photograph."], ["Why are food and drink high risk?", "They are consumed and change between takes, so the amount has to be logged and reset."]], "qzB", "Shoot a scene with a meal across three setups, logging what is eaten at which line. Predict where the cut will show an error, then cut it and check.", []], ["Action matching", "Actions have to start, move and end in the same way across angles, or the cut will jump.", "You can note and match actors’ actions between takes and setups.", ["When a scene is shot from several angles, the actor repeats the same action each time: sitting, picking up a cup, opening a door. The script supervisor notes <b>which hand, which foot, which line</b> each action happens on, and where it begins and ends. Matching action lets the editor <b>cut on action</b> between angles so the cut is hidden by the movement.", "Record the action precisely in the notes (picks up cup with left hand on “I know”), and watch each take against the last, especially in the take that is chosen. If a performance is good but the action is different, tell the director and the editor, who may still be able to use it. Overlapping action, where actors start or finish a movement slightly early or late in each angle, gives the editor more choices. Don’t make an actor stiff by over-correcting: ask the director which matters more."], ["I can say what matching action means.", "I can explain why we note hands, lines and timing.", "I can note the action in a take and tell if the next take matches.", "For a film I can plan action matching with the director and editor, predict problems, test by cutting, and justify when to accept a mismatch."], [["What does cutting on action do?", "It hides the cut within a movement so it looks seamless."], ["What should you do if the best performance has a different action?", "Tell the director and editor so they can decide whether it is usable."]], "qug", "Shoot a character picking up a cup and drinking from two angles. Predict the mistake most likely to appear in the second angle, then cut on the action and check.", []], ["Continuity photography", "Photographs are the memory of a setup: the state of costume, props, hair and set dressing, ready for the next day.", "You can photograph setups systematically so continuity can be restored.", ["Continuity photographs are taken by the script supervisor and the art, costume and make-up departments at each setup. They are the main reference for scenes shot out of order, across days. A good set includes a wide shot of the set, a shot of each actor (front, sides and back as needed), close-ups of props, make-up and costume details, and anything that will change.", "Use a consistent system: a camera or phone with the date correct, a folder per scene and setup, and file names that include scene and setup number. Include a slate, number or whiteboard in the first image. Take photographs <b>before</b> the take (the starting state) and again at the end if it changes. Back them up daily and share the right ones with departments. Keep faces and personal details in line with your institution’s data and consent rules."], ["I can say what continuity photographs are for.", "I can explain what a good photo set for a setup contains.", "I can photograph a setup and organise the files for a scene.", "For a film I can plan a photography system, predict where it will fail, test across a shoot, and justify the folder and naming system."], [["When should photographs be taken?", "Before the take for the starting state, and after if anything changes."], ["Why include scene and setup in file names?", "So the right photographs can be found quickly, days later."]], "qzs", "Photograph a set at three setups with a consistent naming system. A day later, try to recreate the first setup from the photographs alone. Predict what you will miss, then compare.", []], ["Hot sets", "A hot set is dressed and must not be disturbed. Everyone must protect it, and the script supervisor flags changes.", "You can protect and check a hot set between setups.", ["A <b>hot set</b> is a dressed set that must stay exactly as it is between setups (and sometimes overnight) because filming is not finished. Anyone moving things, even slightly, can cause continuity errors. The art department is responsible for photographing it and ensuring nothing is moved, and the script supervisor notes the position of every visible prop and piece of dressing to catch changes before the next setup.", "Agree which sets are hot and tell the whole crew, including the other departments and runners. Mark off areas, keep a rule that nothing is touched without art or continuity approval, and protect sets overnight where needed. When equipment or people need to move things, photograph first and reset after. Check against the last setup before rolling. If something has moved, tell the 1st AD, so it is fixed before the take."], ["I can say what a hot set is.", "I can explain who protects it and why.", "I can check a hot set against photographs and flag differences.", "For a film I can plan hot set procedures, predict how they might be broken, test them, and justify the rules."], [["Who photographs and protects the hot set?", "The art department photographs it and ensures nothing is moved, and the script supervisor checks the positions."], ["What should happen before moving things on a hot set?", "Photograph it first and reset it afterwards."]], "qBy", "Declare a room a hot set for a day. Photograph it, then let others use the space and predict what will be moved. Check against your photographs and note the differences.", []], ["Lining the script", "The lined script is a visual map of what each shot covers, drawn directly on the script pages.", "You can line a script so an editor can see at a glance what was shot and what is missing.", ["A <b>lined script</b> is a copy of the script on which the script supervisor draws a vertical line for each camera setup. The line runs through the dialogue and action covered by the shot, from where the setup starts to where it ends. A straight line means the actor is on screen speaking; a wavy or broken line indicates dialogue spoken off-screen. Each line is labelled with its slate or setup number and often shot size and lens.", "Lines are drawn as the scene is shot, not afterwards, and the page shows overlaps: where setups cover the same lines. Extra notes (takes, printed takes, comments) can be written by each line. Whether you use paper or software such as ScriptE, Movie Slate or Scriptation, choose before day one. The editor can read the lined script to see what is covered, and find gaps. Check conventions with your editor, since they differ."], ["I can say what a lined script is.", "I can explain what a straight line and a wavy line mean.", "I can line a short scene correctly while it is being shot.", "For a film I can plan the lining system with the editor, predict where coverage will confuse readers, test it, and justify my conventions."], [["What does a wavy line usually mean?", "Dialogue spoken off-screen during that setup."], ["Why line during the shoot and not after?", "The detail is only reliable when recorded as it happens."]], "qzu", "Line a one-page scene as someone shoots it in three setups. Ask an editor-minded friend to describe the coverage just from your page. Predict what they will misread, then compare.", []], ["Slate and take numbering", "The slate identifies a setup, and the take number identifies each attempt. Clear, consistent numbering lets everyone find the same shot later.", "You can number setups and takes so camera, sound and notes agree.", ["The <b>slate</b> (or setup identifier) increases with each new camera setup; the <b>take number</b> increases with each attempt at that setup. The clapperboard shows production title, director, DP, scene, slate and take number, roll or card number and date, and the clap synchronises sound and picture. Tail slates are used when a slate at the start would disrupt the performance.", "The script supervisor decides and maintains the numbering with the 2nd AC or whoever slates, and checks it is correct on the board each time. Wrong numbers are the most common cause of confusion in editing. Agree a system before the shoot, for example how pick-ups, inserts and wild tracks are labelled, and use the same format in every document. A typical call is “Quiet on set… turn over… speed… action”. See Sound and Cinematography for slating on those sides."], ["I can say what the slate and take numbers show.", "I can explain why consistency across documents matters.", "I can check the slate against my notes on every take.", "For a film I can design a numbering system, predict where errors will creep in, test it, and justify how I label pick-ups and inserts."], [["What increases with a new setup, and what increases with each attempt?", "The slate number increases with each setup, and the take number with each attempt."], ["What is a tail slate?", "A slate held at the end of a take, upside down, used when slating at the start would disrupt the performance."]], "qbs", "Shoot a scene in three setups with deliberate pick-ups. Number everything on camera, sound and your sheet. Predict where the numbers will disagree, then compare the three records.", []], ["Circle takes", "The director picks the takes they like. The script supervisor records them so the editor starts with the best.", "You can record circled takes accurately and communicate them.", ["A <b>circle take</b> (or print) is a take the director chooses as usable, and the script supervisor circles its number on the continuity sheet. Circle takes are usually the first ones the editor looks at and are often the only ones in the rushes assembly. Other marks note “no good” (NG), a false start, a partial take, or one held back as a possible alternative.", "Ask the director directly, in the moment, and record exactly what they say, including reasons (“good performance, bad focus”). Tell the DIT and the editor which takes are circled, in a way agreed beforehand. Mistakes here waste editing time or lose the best performance. Record partial usability: a take may be good for the first half only. Keep notes short and legible."], ["I can say what a circle take is.", "I can explain why the editor needs this information.", "I can record circle takes and reasons across several setups.", "For a film I can plan how circle takes reach the editor and DIT, predict where information gets lost, test the route, and justify the notation."], [["Why record the director’s reason for choosing a take?", "It tells the editor what is good about it and what to watch out for."], ["What marks other than circle might you use?", "For example NG, false start, partial or hold."]], "qgs", "Shoot a short scene with the director choosing takes. Record the circles and reasons. Predict whether the editor can assemble the scene from your notes alone, then try it.", []], ["Running times and page count", "Timing every take and measuring how much script has been shot tells you whether the film is the right length and the schedule is on track.", "You can time takes and measure progress in pages.", ["The script supervisor times takes with a stopwatch (from action to cut) and records the <b>running time</b> of selected takes and scenes. This lets the director and editor judge pacing and estimate the film’s total length. <b>Page count</b> measures how much script has been shot, in eighths of a page, as a rule of thumb one page is roughly a minute of screen time, though dialogue-light or action-heavy pages vary.", "Record times for each take, and the scene running time when you have the printed takes. Record pages shot each day to compare with the schedule. Report to the producer and 1st AD, who can see if the day is behind. Timecode or the camera’s record time can check your stopwatch. If the script is over or under length, tell the director early, because it is still possible to adapt."], ["I can say what running time and page count are.", "I can explain why they matter for pacing and schedule.", "I can time takes and count pages shot for a day.", "For a film I can predict the final length from running times, test against the cut, and justify any adjustments I recommend."], [["How many pages is a rule-of-thumb minute?", "About one page of script."], ["Why tell the producer and 1st AD the page count each day?", "They can see whether the shoot is on schedule."]], "qhp", "Predict the running time of a 3-page scene from page count, then shoot it, time the circled takes and compare. Explain the difference.", []], ["Director comments and notes", "Good notes capture what the director said about each take, so the editor knows why choices were made.", "You can record director comments clearly and usefully.", ["During the shoot the director says things about takes: “great line reading, camera wobbles”, “use the second half”, “I want a closer look at her hands”. The script supervisor writes these on the continuity sheet beside the take. They help the editor decide what to look at first and what the director intended. Notes also record any planned changes to dialogue or action, since actors often improvise.", "Write short, objective notes quickly, and ask the director when something is unclear. Record changes to the script (new lines, cut lines) in the lined script. Don’t add your own opinions as the director’s. If something is a continuity issue and not a performance issue, mark it separately. Read the notes back at breaks if the director wants. Share the notes with the editor daily in the agreed way."], ["I can say why director comments are recorded.", "I can explain the difference between the director’s notes and my own observations.", "I can record clear comments for several takes.", "For a film I can design a notes system for editor and director, predict what gets lost, test it, and justify the format."], [["Why record changes to the dialogue?", "Actors often improvise, and the editor needs to know what was actually said."], ["Why keep your own observations separate from the director’s notes?", "The editor needs to know which are the director’s choices."]], "qgu", "Shadow a director through three takes and write down their comments. Predict which will matter most to the editor, then ask an editor student to rank them.", []], ["Axis and the 180° rule", "Cameras stay on one side of an imaginary line between characters, so viewers always know where everyone is. The script supervisor guards it.", "You can find the axis of a scene and spot a crossing before it is shot.", ["The <b>axis</b> (line of action) is the imaginary line between two subjects, or along the direction of movement. The <b>180-degree rule</b> says all cameras stay on one side of it through a scene, so characters keep the same left–right positions on screen. <b>Crossing the line</b> flips those positions and can confuse viewers about where people and objects are.", "For every scene, work out and note the axis, with a sketch of where people and cameras are. When a new setup is lit, check the camera position against your sketch, and tell the director and DP before the take if a shot risks crossing. The line can be crossed deliberately (a neutral shot, a moving camera that crosses it in view, or a deliberate disorientation), so the director may choose it. See the Directing role for how the rule is used in staging."], ["I can say what the axis and the 180° rule are.", "I can explain what happens when the line is crossed.", "I can sketch the axis for a scene and check a camera position.", "For a film I can plan axes for each scene, predict risky setups, test by cutting both sides, and justify any deliberate crossing."], [["What happens to characters’ screen positions when the line is crossed?", "They flip left and right."], ["Name one way to cross the line deliberately.", "For example a neutral shot, or a camera movement that crosses it in view."]], "qgu", "Shoot a two-person conversation from both sides of the axis. Predict which edit will confuse viewers, then show it to three people and compare.", []], ["Screen direction", "Characters and objects that move one way should keep moving that way across cuts, or viewers may think they have turned back.", "You can track which way people and things move across shots.", ["<b>Screen direction</b> is the direction characters or objects move or face within the frame. If a car leaves frame right in one shot, it should enter frame left in the next, so it appears to continue the journey. A change reads as turning around. Screen direction ties in with the axis, because shots from the same side of the axis keep consistent directions.", "Note direction for every moving subject at each setup (“exits frame left”, “walks toward camera”), including at cuts between locations, where a consistent direction suggests continuing travel. Mark it on the lined script or sheet. Neutral shots (head-on or straight away) let you change direction legitimately. Tell the director when a planned shot would reverse direction, and note deliberate changes."], ["I can say what screen direction is.", "I can explain why directions must match across cuts.", "I can note screen direction for a moving subject at each setup.", "For a film I can plan screen direction across locations, predict where it will break, test by cutting, and justify deliberate reversals."], [["If a car exits frame right, where should it enter next?", "From frame left, so it appears to continue its journey."], ["How can a neutral shot help?", "It lets direction change without appearing to reverse."]], "gqu", "Shoot someone walking through two locations with screen direction first consistent, then reversed. Predict how viewers will read the reversed version, then ask three of them.", []], ["Eyelines", "Where an actor looks, and at what height, must match what the other shot shows or the cut will feel wrong.", "You can record and match eyelines between setups.", ["An <b>eyeline</b> is the direction in which an actor is looking. In an <b>eyeline match</b>, a character looks off-screen in one shot, and the next shot shows what they are looking at, positioned in frame to correspond with the direction of the gaze. Mismatches make people look as if they are talking past each other.", "Note the direction and height of each actor’s eyeline at every setup, in relation to the camera (a little left of lens, looking up). Over-the-shoulder shots and singles shot separately depend on this, especially when the other actor is absent, so make sure someone stands where the other character should be and at the right height. Check heights if actors differ (boxes, stands). Tell the director and DP when eyelines are drifting, since small changes in lens position change them."], ["I can say what an eyeline is.", "I can explain what an eyeline match is.", "I can record eyelines at each setup and notice a mismatch.", "For a film I can plan eyelines for singles and reverses, predict problems, test by cutting, and justify solutions for actors of different heights."], [["Why does a stand-in for an absent actor matter?", "It gives the on-camera actor a correct eyeline and height."], ["What two things do you record about an eyeline?", "Direction and height, relative to the camera."]], "qeg", "Shoot a conversation as two singles with a different eyeline height in each. Predict how the cut will read, then cut and check.", []], ["Coverage tracking", "Coverage is the set of shots that makes a scene editable. The script supervisor tracks what has been shot and what is still missing.", "You can track coverage so the editor has what they need.", ["<b>Coverage</b> is the range of shots captured for a scene: a master shot, mediums, close-ups, singles, over-the-shoulders, inserts and cutaways. The script supervisor tracks which coverage is complete for each scene, which takes are printed, and what gaps remain. Insufficient coverage found in the edit is almost impossible to fix without a reshoot.", "Use the lined script as a map: every line of dialogue and action should be covered by at least one angle on each character, with overlaps to cut between. Before the company moves on, check with the director and tell the 1st AD of any gaps, so they can be shot while the set is still there. Note intended shots that were dropped for time. Keep a checklist per scene, updated through the day. See Directing (Coverage) for how the director plans it."], ["I can say what coverage is.", "I can explain why gaps must be found before moving on.", "I can check a lined script for gaps and overlaps.", "For a film I can plan a coverage checklist, predict the likely gaps, test by assembling a scene, and justify what I flag."], [["Why check coverage before leaving a set?", "Gaps found later may need a reshoot."], ["What do overlaps between setups give the editor?", "Places to cut between angles."]], "qgu", "Shoot a scene while a classmate secretly leaves a gap in the coverage. Using only your lined script, predict where the gap is, then assemble the scene and check.", []], ["Cutaways and inserts", "Cutaways and inserts are the small shots that give editors a way to bridge, hide or explain.", "You can track cutaways and inserts so they are shot and usable.", ["An <b>insert</b> is a close-up of a specific object or action within a scene (a letter, a phone screen, hands on a key). A <b>cutaway</b> is a shot of something other than the main action. They are often shot separately, and are used to bridge time, relieve continuity errors, or give context. A well-timed cutaway can save an otherwise unusable section.", "Note the inserts and cutaways captured and those still needed. Check the details match the main action (the same hand, the same writing on the paper, the same state of the prop). Shoot reaction shots and ‘safety’ cutaways when the actors and set are available. Label them clearly so the editor can find them, and record the timing that matches the main scene. Wild cutaways are shot without sound, so note if sound is needed."], ["I can say what inserts and cutaways are for.", "I can explain why they need to match the main action.", "I can list the inserts and cutaways needed for a scene.", "For a film I can plan and track them, predict which will be needed in the edit, test by editing, and justify my choices."], [["What can a cutaway do for the editor?", "Bridge time or hide a continuity error."], ["Why check that an insert matches the main action?", "A mismatch (a different hand, different text) is noticed and breaks the illusion."]], "qgu", "Shoot a scene with a deliberate continuity error, then fix it in the edit with a cutaway or insert. Predict which type will hide it best, then compare.", []], ["Editor’s log", "The editor’s log tells the editor what exists, what is good and where to start, so they can begin cutting during the shoot.", "You can write an editor’s log that is clear and usable.", ["An <b>editor’s log</b> is a summary produced by the script supervisor for the editor, covering scenes shot, page count completed, printed takes and coverage notes. It helps the editor start assembling before the shoot is finished, and it makes sure they know about problems and intentions (a take that is good only to a point, a line that changed).", "Agree the format with the editor before the shoot, including what they want first and how they want it delivered (shared document updated daily, say). Include slate and take numbers that match camera and sound reports, notes on performance and technical issues, and lines changed. Keep it concise and correct. Where students edit their own films, the log still helps, because it is a record of what was intended. Rushes protocol: agree which takes go to the editor and in what order, before the night."], ["I can say what an editor’s log contains.", "I can explain why it should be agreed with the editor.", "I can write an editor’s log for a day’s shooting.", "For a film I can design a log, predict what an editor will miss, test it by getting an editor to assemble a scene from it, and justify the format."], [["What does the editor’s log let the editor do?", "Begin assembling before shooting ends."], ["When should you agree the format?", "Before the shoot starts."]], "qsc", "Write an editor’s log for a day’s shoot and give it to an editor with the rushes. Predict the question they will ask, then record what they actually asked.", []], ["Daily progress reports", "A daily report tells the producer and editor what was shot, what remains, and any problems.", "You can produce a clear daily progress report.", ["The <b>daily progress report</b> is a summary of the day: scenes shot, pages shot, scenes completed, scenes remaining, and production notes such as delays, injuries or incidents, overtime and reshoots needed. In student productions the script supervisor often produces it. In larger productions a similar production report may be completed by the AD team, so agree who owns it.", "Fill it in as the day goes and finalise it at wrap. Be accurate: if a scene is not completed, say so and say what is missing. Share it with the producer, 1st AD and editor in the agreed way. Over days it shows whether the schedule is holding, and helps decide what to cut. Keep it factual and avoid blame. Safety incidents follow your institution’s separate reporting rules."], ["I can say what a daily progress report contains.", "I can explain who uses it and why.", "I can write one for a day’s shoot.", "For a film I can use daily reports to predict schedule slip, test the prediction, and justify decisions from them."], [["Name two things a daily progress report records.", "For example pages shot and scenes remaining."], ["Why be exact about uncompleted scenes?", "Planning and the edit depend on knowing what is missing."]], "pfc", "Write a daily progress report for a mock shoot day. Predict what the producer will ask, then ask a classmate to play the producer.", []], ["Cross-referencing camera and sound reports", "Picture and sound are recorded separately. The script supervisor makes sure the notes of all departments agree on which take is which.", "You can check camera, sound and continuity records against each other.", ["The <b>camera report</b> records every roll or card, and the <b>sound report</b> records every audio file. The script supervisor cross-references their own continuity sheet with both, so a printed take is identified the same way across all documents. Differences in numbering, missing takes or labels like ‘wild track’ are caught early.", "Compare notes with the camera assistant, sound recordist and DIT at breaks and at wrap: slate, take, roll or file number, circled takes. Fix disagreements the same day, while people remember. Agree before the shoot how pick-ups, wild tracks and sound-only takes are named. These checks save an editor hours of searching. See the Sound role (Slating) and the DIT role."], ["I can say what camera and sound reports record.", "I can explain why they must agree with the continuity sheet.", "I can compare my notes with the camera and sound records and find a mismatch.", "For a film I can design a cross-checking routine, predict where mismatches happen, test it, and justify its timing."], [["When should disagreements be fixed?", "The same day, while people remember."], ["Why agree names for wild tracks in advance?", "So they are consistently identified and not mistaken for other takes."]], "qpU", "After a shoot, compare your sheet, the camera report and the sound report for the same ten takes. Predict how many disagree, then count them.", []], ["Timecode references", "Timecode is a continuous time label on picture and sound. Recording it for key moments lets the editor find them quickly.", "You can use timecode to help the editor find selected moments.", ["<b>Timecode</b> is a continuous time reference (hours:minutes:seconds:frames) embedded in audio and camera recordings. In the UK, 25 frames per second is common, so frames run 00–24. The script supervisor records timecode for selected takes where relevant, such as the start of a good section, a line change or a mistake, helping the editor find specific moments in the footage.", "When camera and sound timecode are jammed together, they match and can be used to sync automatically. Otherwise, the clap and slate are the reference. Check which system you have, with the camera and sound departments, and note which timecode you are reading. Don’t record timecode for every take unless the editor wants it: use it for important moments. See the Sound role (Timecode) and the DIT role."], ["I can say what timecode is.", "I can explain how it helps the editor find moments.", "I can record timecode for a key moment in a take and say which source it is from.", "For a film I can decide when timecode notes are worth the effort, predict how the editor will use them, test it, and justify the system."], [["What does timecode 00:01:02:12 mean at 25 fps?", "One minute, two seconds and twelve frames."], ["Why note which timecode source you read?", "Camera and sound may differ unless synchronised."]], "qzu", "Record timecode for three key moments in a take, then ask an editor to find them using only your notes. Predict how long it will take, then time it.", []]];
YR.dit=[["The 3-2-1 backup rule", "Footage that exists in only one place has not really been shot. The 3-2-1 rule is the minimum standard for keeping it.", "You can set up and explain a backup plan that survives a drive failure, a theft or a mistake.", ["The <b>3-2-1 rule</b> says every piece of footage must exist in at least <b>three copies</b>, on at least <b>two different types of media</b>, with at least <b>one copy in a separate physical location</b>. On a shoot, the camera card is not a copy to rely on, because it will be reused. A typical student plan is two verified copies on separate drives on the day, with a third copy, on a different kind of storage or off site, made as soon as possible.", "Each part protects against a different failure: several copies cover a dead drive, different media cover a fault that hits one type, and a separate location covers theft, fire or a bag left on a train. Decide the plan in pre-production, including who carries which drive home and where. Cards are only cleared after the copies are verified (see Verified offload). RAID is not a backup: it keeps one device running if a drive fails but does nothing about deletion, corruption or theft."], ["I can state the 3-2-1 rule.", "I can explain what each part protects against and why RAID is not a backup.", "I can write a 3-2-1 plan for a shoot with named drives and locations.", "For a production I can design a backup plan, predict which failure it is weakest against, test it by simulating a loss, and justify the compromises."], [["What does the ‘1’ in 3-2-1 protect against?", "Loss of everything in one place, for example theft, fire or a lost bag."], ["Why is RAID not a backup?", "It does not protect against deletion, corruption, theft or fire."]], "xck", "Write a 3-2-1 plan for a two-day shoot. Then ‘lose’ each copy in turn on paper, predicting which loss would be hardest to recover from, and check whether your plan survives.", []], ["Checksums", "A checksum is a fingerprint of a file. If the fingerprints of original and copy match, every byte arrived intact.", "You can use checksums to prove a copy is identical to its source.", ["A <b>checksum</b> is a value calculated from the data in a file, so that any change to the data gives a different value. Comparing the checksum of the original with that of the copy verifies that every byte was transferred without corruption. Common algorithms include MD5, SHA-1 and xxHash; xxHash is popular on set because it is fast, and the important thing is that the same algorithm is used for source and copy.", "File size and a successful file-manager copy do not prove a file is intact, and a file that opens may still have damaged frames. Offload software such as Hedge, ShotPut Pro or Silverstack calculates checksums as it copies, and writes a report you keep. Checksums can also be re-run later on stored drives to check they have not degraded (sometimes called bit rot). A mismatch means do not clear the card: copy again and investigate the card, reader, cable or drive."], ["I can say what a checksum is.", "I can explain why file size and ‘it plays’ are not proof of a good copy.", "I can run a checksum comparison between two copies and read the result.", "For a workflow I can choose where checksums are calculated and re-run, predict failures, test with a deliberately damaged file, and justify my choice of tool."], [["Why is matching file size not enough?", "A file can be the same size but contain corrupted data."], ["What should you do if checksums do not match?", "Do not clear the card, copy again, and investigate the card, reader, cable and drive."]], "xkc", "Copy a large file, then change one byte in the copy with a hex editor. Predict whether file size, playback or checksum will notice, then test each.", []], ["Verified offload", "Offloading is not just copying: it is copying, then proving the copy is good, before the card is ever wiped.", "You can offload camera media safely and keep a record of it.", ["A <b>verified offload</b> copies the card to two or more destinations at once using software that checksums the data and writes a report. The DIT cross-checks the report with the camera report to confirm that every card or reel has been received, copied and verified. The card is then cleared <b>only</b> when the copies are verified and the camera department agrees.", "Keep to a routine: label cards and track them (for example, full / offloaded / cleared), use a card reader and cable you trust, never rename or edit camera originals, and never drag and drop from the card. Keep the report with the shoot day’s records. Cards are reformatted in the camera, not on the computer. If anything is unclear (a card with an error, a missing clip) keep the card and tell the DP and the 1st AD. Slow, careful offload at the end of a long day is where most data loss happens."], ["I can say what a verified offload is.", "I can explain when a card can be cleared and who agrees.", "I can offload a card to two destinations with verification and keep the report.", "For a shoot I can design the offload routine, predict where it will go wrong at 2am, test with a mock day, and justify the rules."], [["Who should agree before a card is cleared?", "The DIT (verified copies) and the camera department."], ["Why format cards in the camera?", "The camera sets up the right structure, and formatting on a computer can cause errors."]], "xkN", "Run a mock offload of a test card to two drives. Predict which step students will skip when tired, then run it with a classmate and watch.", []], ["File systems (exFAT, etc.)", "A drive’s file system decides which computers can read it and how safe it is. Choose it before the shoot, not during.", "You can choose and prepare file systems for a cross-platform workflow.", ["A <b>file system</b> is the way a drive organises data. <b>exFAT</b> works on both Mac and Windows and supports files larger than 4GB (FAT32 does not), which is why it is the usual choice for drives that move between computers. <b>APFS</b> is the modern Mac file system; Windows cannot read it without extra software. <b>NTFS</b> is Windows’s own, and Macs can read but not normally write it.", "exFAT has no journal, so unsafe ejection or a power cut can corrupt it more easily than a Mac or Windows native format. Always eject properly, and don’t use one drive as the only copy. Format drives before the shoot, label them physically, and record the serial numbers. Decide the formatting in the data meeting and write it into the plan. Your institution’s editing computers may dictate the choice, so ask the technicians (and see Folder structure and naming)."], ["I can name a few file systems.", "I can explain why exFAT is common and its limitation.", "I can format a drive for a given workflow and record the choice.", "For a production I can choose file systems for each machine and drive, predict the cross-platform problems, test by moving a drive around, and justify the choice."], [["Why not FAT32 for video?", "It has a 4GB file size limit."], ["What is the risk of exFAT?", "Without a journal, unsafe ejection can corrupt it, so never rely on one copy."]], "kyN", "Format three drives (exFAT, APFS or NTFS if available) and plug each into a Mac and a Windows machine. Predict which will read and write on each, then test.", []], ["Folder structure and naming", "A consistent structure makes footage findable by everyone, and makes mistakes visible. It should be built before the first card arrives.", "You can design and pre-create a folder structure and naming system.", ["A good structure has one logical place for everything: <b>project / shoot day / camera / roll or card</b>, with matching folders for sound, stills and reports. Pre-create the structure on every drive for every shoot day, so offloading is copying into a prepared place and not making folders at the end of a long day. Camera originals are never renamed, because clip names link to metadata, sound and reports.", "Use clear conventions: dates in a consistent format (for example YYYY-MM-DD, which sorts correctly), no spaces or odd characters, and the same names on every drive. Keep a readme with the structure so a new person understands it. The same logic applies to the edit: agree with the editor how the structure will be imported. A structure agreed once saves hours of searching and prevents duplicate or lost media."], ["I can describe a typical folder structure.", "I can explain why camera originals are not renamed and why dates use a fixed format.", "I can create a structure for a shoot and use it for an offload.", "For a production I can design the structure with editor and sound, predict where confusion will occur, test it with someone new, and justify it."], [["Why write dates as YYYY-MM-DD?", "They sort in the correct order and are unambiguous."], ["Why not rename camera files?", "Names link them to metadata, reports and the sound, so renaming breaks the trail."]], "ckN", "Give a classmate your folder structure and a pile of mixed files, and ask them to file them. Predict the mistakes they will make, then compare.", []], ["SSD, HDD, RAID and LTO", "Different storage types suit different jobs: fast and robust on set, cheap and large at home, and tape for the archive.", "You can choose storage types for each stage of a production.", ["<b>SSDs</b> (flash memory) are fast, robust and compact, so they are the preferred on-set drives. <b>HDDs</b> (spinning disks) are cheaper per terabyte but slower and fragile when moved, and best used for storage. <b>RAID</b> combines drives for speed or protection: RAID 0 stripes for speed but loses everything if one drive fails, RAID 1 mirrors, and RAID 5 uses parity to survive one drive failure. RAID adds resilience but is not a backup.", "<b>LTO</b> (Linear Tape-Open) is a magnetic tape format used for long-term archive: high capacity, low cost per terabyte and a long documented shelf life, though it needs a tape drive and software. For student work, cheap cold storage might be an offline drive pair or cloud storage as part of 3-2-1, but check your institution’s rules about where data may be stored. Buy more storage than your estimate (see Capacity planning) and keep a drive log."], ["I can name the main storage types.", "I can explain what each is good for and what RAID does not do.", "I can match storage types to on-set, working and archive roles.", "For a production I can design the storage chain, predict its weak links, test by simulating a failure, and justify cost against risk."], [["Why SSDs on set?", "They are fast, robust and compact."], ["What does RAID 0 do if one drive fails?", "All data is lost, because it is striped without redundancy."]], "xky", "List the storage you would use at each stage (camera, set, edit, archive). Predict which is the weakest link, and check by asking your technician what fails most.", []], ["Throughput and card speeds", "Speed limits are in megabytes per second, and in bits per second on spec sheets. Mixing them up is a classic error.", "You can work out whether a card, reader or drive is fast enough.", ["A recording format has a <b>data rate</b> (usually in megabits per second, Mbps). Divide by 8 to get megabytes per second (MB/s): 400 Mbps is 50 MB/s, or about 180GB per hour. The card must sustain at least that speed when writing, and the offload chain (card, reader, cable, port, drive) is only as fast as its slowest part.", "Card labels such as ‘up to’ read speeds are not guaranteed sustained write speeds, so check the camera manufacturer’s list of approved cards. For offload, the card reader, the cable standard (USB 3.x, Thunderbolt) and the drive limit speed; a fast SSD on a slow cable is slow. Test the whole chain with real files before the shoot and time a full card: this tells you how long the end-of-day offload will take and affects call and wrap times."], ["I can state the difference between Mbps and MB/s.", "I can explain why the slowest part limits the chain.", "I can calculate data per hour and time an offload.", "For a production I can predict offload times, test them, and justify card and reader choices."], [["How many MB/s is 400 Mbps?", "50 MB/s (divide by 8)."], ["Why does ‘up to’ speed matter?", "It is a best case, and the camera needs sustained write speed."]], "kcN", "Predict how long a full card will take to offload using the numbers on your reader and drive, then time it with a real card and explain the gap.", []], ["Capacity planning", "Running out of storage mid-shoot is avoidable. The calculation is simple, as long as you do it early and add headroom.", "You can calculate how much storage a production needs.", ["A standard planning formula is: <b>(average card size) × (cards per day) × (shoot days) × (number of copies) + 30% headroom</b>. Alternatively use the format’s data rate per hour, multiplied by the expected hours of recording (including a realistic shooting ratio, since much is shot and not used). Add proxies, dailies, stills, sound and project files.", "Buy drives before the shoot, not during it, and plan for the worst day, not the average. Record the sums in the data plan so the producer can budget. Keep a log of free space per drive as you go. If the estimate does not fit the budget, change the format (a lower data rate, fewer takes, more efficient codec) before the shoot, not partway through. Check your institution’s storage options for the edit."], ["I can state the capacity formula.", "I can explain why we add headroom and plan for the worst day.", "I can calculate storage for a short shoot.", "For a production I can plan storage, predict where my estimate is weakest, test it against a shoot, and justify trade-offs."], [["Why add headroom?", "Shooting ratios, extra files and surprises usually mean more data than expected."], ["What counts as ‘copies’ in the formula?", "Every verified backup you keep, as in 3-2-1."]], "phk", "Calculate storage for your film using the format’s real data rate. Predict how much you will actually shoot, then compare with a test day.", []], ["Cabling and connectors", "Bad cables cause lost signal, slow copies and failed drives. The right one for each job is cheap insurance.", "You can pick and handle cables for video and data.", ["For data, USB 3.x and Thunderbolt connect readers and drives, and not all cables of the same shape support the same speeds. For video, <b>SDI</b> is the professional standard for uncompressed digital video over coaxial cable with BNC connectors, and is locking and robust over long runs. HDMI is common on cameras and monitors but its connector is easy to knock out, so locking clamps or cages help.", "Label cables and keep spares, avoid sharp bends and tension, and don’t daisy-chain drives unless you have to. Follow the cable standard through the whole chain (port, cable, device). Keep cables clear of walkways, tape down runs, and follow the safety rules from the lighting and grip departments, because trip hazards are a main cause of accidents. When a signal is lost, check the cable first, then connectors, adapters, and the settings of the camera and monitor."], ["I can name the common connectors.", "I can explain why SDI is preferred for long runs and why cable standard matters.", "I can connect camera to monitor and drive to computer and fix a dropped signal.", "For a production I can design the cable plan, predict failure points, test it, and justify spares."], [["Why is SDI popular on set?", "It is robust, locking and works over long runs."], ["Why can two USB-C cables behave differently?", "They may support different speeds and power."]], "kNy", "Test three cables between the same drive and computer. Predict which is slowest, then time a file copy through each.", []], ["RAW, ProRes and BRAW", "The recording format decides what the image can survive later. RAW keeps the most, ProRes balances quality and size.", "You can choose between recording formats for a production.", ["<b>RAW</b> records data close to what the sensor captured, with colour and exposure decisions largely deferred to the grade, giving the most flexibility and the biggest files. <b>ProRes</b> is Apple’s professional codec family: ProRes 422 is broadcast quality, ProRes 4444 is higher quality and supports alpha channels, and ProRes RAW puts sensor-level data in a ProRes wrapper. <b>BRAW</b> (Blackmagic RAW) is a camera-native RAW format with manageable file sizes, decoded in DaVinci Resolve.", "Choose with your DP before booking the camera: look at the file size per hour, the cards needed, edit-computer power, grade needs and delivery. Higher quality is not always better if the storage and time can’t cope. Test the full chain (shoot, offload, edit, grade) before the shoot. Different cameras offer different formats, so check what yours records and what your software can read."], ["I can name RAW, ProRes and BRAW.", "I can explain the trade-off between flexibility and file size.", "I can compare the formats of a given camera and say what each costs in storage.", "For a production I can choose a format, predict the consequences, test the full chain, and justify the choice to the DP and producer."], [["What does RAW keep that other formats may discard?", "More sensor information, leaving more decisions for the grade."], ["Why test the whole chain?", "A format can be fine on camera but too heavy to edit or grade on your computers."]], "kvC", "Shoot the same scene in two formats if the camera allows. Predict which grade will break first, then push both hard and compare.", []], ["Bit depth", "Bit depth sets how many steps of tone and colour the image has, which decides how well it survives grading.", "You can explain bit depth and choose enough for the job.", ["<b>Bit depth</b> is the number of bits used to represent each colour channel of each pixel. 8-bit gives 256 gradations per channel, 10-bit gives 1024, and 12-bit gives 4096. More bits allow smoother gradients and more resilience to grading, because small differences can be preserved.", "Low bit depth shows up as <b>banding</b> in smooth areas such as skies and walls, particularly after strong grading or when stretching a flat log image. Log recordings especially benefit from 10-bit or more. Higher bit depth means bigger files, so balance it with storage. Bit depth is separate from colour space and from the codec’s compression, although they interact."], ["I can state how many gradations 8-, 10- and 12-bit give.", "I can explain what banding is.", "I can find banding in a graded image and say how bit depth affects it.", "For a production I can choose bit depth, predict where banding will occur, test it with a heavy grade, and justify the choice."], [["How many gradations per channel in 10-bit?", "1024."], ["Where is banding most visible?", "In smooth gradients such as skies and plain walls."]], "vCk", "Grade the same low-contrast gradient shot in 8-bit and 10-bit if you can. Predict where banding appears, then check on a waveform and on screen.", []], ["Compression", "Compression makes files smaller by throwing away or simplifying information. How it is done decides how the image holds up.", "You can explain compression types and their effects.", ["A <b>codec</b> compresses and decompresses video. <b>Lossless</b> compression reduces size without discarding information, and <b>lossy</b> compression discards what it thinks the eye will not miss. <b>Intra-frame</b> codecs compress each frame on its own (easy to edit, larger), while <b>inter-frame</b> codecs compress groups of frames (smaller, harder to edit and prone to artefacts in motion). Chroma subsampling (4:4:4, 4:2:2, 4:2:0) stores less colour than brightness detail.", "Heavy compression shows as blocking, mosquito noise, smearing, and weak keys for green screen. You can’t recover what was thrown away, and repeated recompression makes it worse. Choose by what the footage must survive: grading, VFX, long takes in the edit, or final delivery. Know what your camera records, what your edit computers handle, and what the delivery needs. The DIT configures software and plans storage from the codec."], ["I can say what a codec does.", "I can explain lossy versus lossless and intra- versus inter-frame.", "I can recognise compression artefacts in footage.", "For a production I can choose compression levels, predict where artefacts will show, test, and justify."], [["Which is easier to edit: intra- or inter-frame?", "Intra-frame, because each frame stands alone."], ["Why avoid repeated recompression?", "Each lossy pass discards more and quality falls."]], "kvC", "Export a clip at three compression levels, repeat the heaviest export five times, and predict where artefacts show. Compare the results at 200% zoom.", []], ["Proxy workflows", "Proxies are light copies for editing that relink to the full-quality originals for finishing.", "You can set up a proxy workflow that keeps the link to the originals.", ["A <b>proxy</b> is a lower-resolution, smaller version of the camera original used for smooth editing on modest computers. The editor cuts with proxies and then <b>relinks</b> to the original files for the grade and delivery. Proxies can be made on set by the DIT, in the edit software, or by the camera.", "The workflow depends on names and metadata: proxies must keep the same clip names and timecode as the originals, or relinking fails. Agree the proxy format and resolution with the editor, keep proxies in a structure that mirrors the originals, and test a relink before the shoot ends. Never delete originals when proxies exist. Burnt-in timecode or names can help review but should not be in the editing proxies unless agreed."], ["I can say what a proxy is for.", "I can explain why names and timecode must match the originals.", "I can make proxies and relink to originals in an edit.", "For a production I can plan the proxy workflow, predict relinking failures, test it, and justify the format."], [["What must proxies share with originals?", "Clip names and timecode."], ["When should you test relinking?", "Before the shoot ends, with real files."]], "vkC", "Make proxies of a test clip, edit them, then relink to the originals. Predict what will fail if you rename a file, then rename one and see.", []], ["Log and gamma curves", "A gamma curve is how light becomes numbers. Log curves squeeze a wide range into a recording, so it looks flat until it is decoded.", "You can explain why log looks flat and what is needed to view it.", ["A <b>gamma curve</b> describes the relationship between the light captured by the sensor and the brightness values recorded. <b>Log</b> curves compress highlights and shadows to preserve more information for grading, in a given bit depth. The image looks low in contrast and desaturated because it has not yet been converted for viewing. Every camera has its own log curve (check your camera’s name for it), and its matching conversion.", "Log keeps <b>dynamic range</b> (the stops from the deepest shadow to the brightest highlight) but it needs a technical LUT or a colour-managed grade to look right. Exposure is judged differently: use the manufacturer’s recommendations and test. Underexposed log shows noise when lifted. The DIT sets up the monitoring conversion so everyone sees a viewable image, without changing the recording."], ["I can say what log is and why it looks flat.", "I can explain how it keeps dynamic range and what it needs to be viewed.", "I can apply the correct conversion to a log clip.", "For a production I can choose the curve, predict how it will look at different exposures, test it, and justify the exposure strategy."], [["Why does log look flat?", "It compresses the range for recording and must be converted for viewing."], ["What is dynamic range?", "The range from the deepest shadow to the brightest highlight, measured in stops."]], "kvC", "Shoot a high-contrast scene in log and in a standard profile. Predict which holds more highlight detail, then compare on a waveform.", []], ["Colour spaces (Rec.709, DCI-P3)", "A colour space is the range of colours that can be recorded or shown. Pictures only look right when the right one is assumed at each stage.", "You can match colour spaces across camera, monitor and delivery.", ["A <b>colour space</b> defines the range of colours that can be represented in a recording or display. <b>Rec.709</b> is the standard for HD television and most online delivery, and the default for most monitors. <b>DCI-P3</b> is the standard for digital cinema projection, wider than Rec.709 but narrower than camera colour spaces. Camera colour spaces are typically much wider, to retain information.", "The DIT configures Resolve and the on-set monitors to correctly interpret the camera’s colour space and output to the appropriate display space. A mismatch gives dull, oversaturated or shifted colour. Check what your monitors support and are calibrated for. Decide in the data meeting what the final delivery space is, and whether the grade will be colour-managed. Phones and consumer screens vary, so judge important decisions on a calibrated monitor."], ["I can name Rec.709 and DCI-P3.", "I can explain what happens if the wrong colour space is assumed.", "I can set a monitor and software to display a camera’s footage in Rec.709.", "For a production I can plan the colour space for each stage, predict mismatches, test, and justify the choice for delivery."], [["Which colour space is standard for HD television?", "Rec.709."], ["What does a mismatch in colour space look like?", "Colour that looks dull, oversaturated or shifted."]], "vkt", "View the same clip with the correct and a deliberately wrong colour space setting. Predict the change, then describe it in words someone else could check.", []], ["Monitoring LUTs", "A monitoring LUT makes log footage viewable on set without changing what is recorded.", "You can apply a monitoring LUT and explain what it does and does not do.", ["A <b>LUT</b> (look-up table) is a transformation that converts one set of colour values to another. A <b>monitoring LUT</b> is applied to the signal sent to on-set monitors, converting log footage to a viewable colour space and possibly including a creative look. It does <b>not</b> affect the recorded image unless the camera is set to record it.", "The DIT chooses the correct technical LUT for the camera’s log format and the monitor’s colour space, and loads it into the monitors or the cart. Check that all monitors show the same thing (the director’s and DP’s should match) and note which LUT was used for rushes. Check on a waveform and not only by eye. Anything the DP decides to bake into the recording must be agreed beforehand."], ["I can say what a monitoring LUT does.", "I can explain that it doesn’t change the recorded image.", "I can apply the right LUT for a camera and monitor.", "For a production I can set up the monitoring chain, predict mismatches between monitors, test, and justify which monitor is the reference."], [["Does a monitoring LUT change the recorded file?", "No, it only changes what the monitor shows."], ["Why check the same LUT across monitors?", "So director and DP judge the same picture."]], "vkt", "Put a monitoring LUT on one monitor and not another, showing the same log signal. Predict what the director will say, then ask someone to describe each.", []], ["Show LUTs", "A show LUT carries the intended look of the film from pre-production to the grade.", "You can create, test and share a show LUT.", ["A <b>show LUT</b> is a creative LUT developed by the DP in pre-production to represent the intended look of the film. It is applied by the DIT to the monitoring signals on set, giving the director and crew an on-set idea of the final look, and shared with the colourist. It may be built from camera tests and grading in Resolve.", "Agree when the show LUT will be delivered, and test it on the actual camera footage in different light, not just a perfect test. A LUT that looks good on one scene may crush another, so check on a waveform. Remember it is a guide: the grade can go further. Record the LUT name and version in your reports. See the Cinematography role for the look decisions behind it."], ["I can say what a show LUT is.", "I can explain who creates it and who receives it.", "I can apply a show LUT and check it on different scenes.", "For a production I can plan the show LUT workflow, predict where the look will break, test across conditions, and justify changes."], [["Who creates the show LUT?", "The DP, usually from camera tests."], ["Why check it across different scenes?", "A look that works in one lighting condition may fail in another."]], "vkL", "Build a simple look in Resolve, export it as a LUT and apply it to footage from three different scenes. Predict which will suffer most, then check.", []], ["Waveform and vectorscope", "Waveform and vectorscope show exposure and colour as measurements, so you don’t have to trust your eyes or a screen.", "You can read a waveform and a vectorscope.", ["A <b>waveform monitor</b> displays the brightness (luminance) values across the frame, from black at the bottom to white at the top, with the horizontal axis matching the picture. It shows clipping, crushed blacks and overall exposure. A <b>vectorscope</b> displays chrominance (colour): hue is the angle and saturation is the distance from the centre. It shows colour casts and consistency between shots, and skin tones usually fall along a recognisable line.", "Use the waveform to check exposure objectively, as screen brightness and room light mislead the eye. Check that highlights are not clipped at the top and shadows are not crushed. Use the vectorscope to compare shots in a scene and spot a cast, such as a green tint from fluorescent light. Resolve and many monitors include both. Learn what a normal image looks like on them, so problems stand out."], ["I can say what a waveform and a vectorscope show.", "I can explain what clipping and a colour cast look like on them.", "I can read a waveform and vectorscope to judge a shot.", "For a production I can use scopes to set a consistent exposure and colour across a scene, predict problems, test, and justify the readings."], [["What does clipping look like on a waveform?", "The trace is flattened against the top."], ["What does the vectorscope show that the waveform doesn’t?", "Colour (hue and saturation)."]], "vkC", "Look at a shot and predict its waveform before showing the scope. Then check, and repeat for a shot with a colour cast on the vectorscope.", []], ["False colour", "False colour paints exposure levels as colours so judging exposure is quick and precise.", "You can use false colour to check exposure.", ["<b>False colour</b> replaces image tones with specific colours to indicate exposure levels, allowing quick and precise exposure assessment. Different cameras and monitors use different colour maps, but typically there are colours for clipped highlights, skin tones at a target level, middle grey, and crushed blacks. Check the key for your device.", "DITs and DPs use it to confirm exposure on faces and highlights, and to compare shots. It is more precise than eyeballing the picture, and quicker than reading a waveform for each shot. It doesn’t replace the waveform and judgement of the image. Remember that it measures what the camera is seeing in the chosen signal (log or converted), so be sure which one you are checking against."], ["I can say what false colour does.", "I can explain why the key matters.", "I can use false colour to check exposure on a face.", "For a production I can set an exposure workflow with false colour, predict where it may mislead, test, and justify its use with scopes."], [["Why check the key?", "Colour maps differ between cameras and monitors."], ["Why not rely only on false colour?", "It shows levels, not whether the image works, and it depends on which signal is displayed."]], "vkL", "Photograph a face at three exposures. Predict the false colour of each, then check on the camera and with a waveform.", []], ["The QC process", "QC is a systematic check of every reel for technical problems before the footage is cleared and delivered.", "You can carry out a QC pass and report what you find.", ["<b>QC</b> (quality control) is the systematic review of footage to identify technical problems: focus issues, exposure errors, sensor artefacts, codec problems, or recording failures. The DIT performs it on every reel before rushes are delivered and before cards are cleared. Check each clip plays fully, has picture and sound as expected, and matches the camera report.", "Work to a checklist: files present and the right size, playable from start to end, focus and exposure, dirt on the sensor or lens, flicker, timecode continuity, audio present and in sync. Make notes with the clip name, the timecode and what is wrong, and tell the camera department and the director the same day, while a reshoot is still possible. Keep a QC log. Focus and sensor problems can be missed on a small screen, so check at full size on key shots."], ["I can say what QC is and when it happens.", "I can explain why problems must be reported the same day.", "I can run a QC checklist on a card and write up what I find.", "For a production I can plan QC, predict the problems most likely to be missed, test, and justify how I prioritise."], [["Why report QC problems the same day?", "A reshoot is still possible while the set and cast are available."], ["Name two things to check on every clip.", "For example that it plays through and that focus and exposure are acceptable."]], "kcN", "Create a card with three deliberate faults and ask a classmate to QC it. Predict which they will miss, then compare with their log.", []], ["Spotting recording errors", "Recording errors are rare but costly. Knowing the signs lets you catch them while the shot can still be repeated.", "You can recognise common recording errors and say what to do.", ["Typical errors include <b>corrupted or incomplete files</b>, dropped frames, a camera that stopped early, <b>timecode jumps</b>, missing or silent audio, wrong settings (frame rate, format, colour space), flicker with certain lights, hot or stuck pixels, and soft focus that went unnoticed on the small screen. Data errors can also arise during offload, such as unreadable files or mismatched checksums.", "Verify clips on a proper screen, scrub through the file and not just the first seconds, check audio, and compare settings with the plan each morning. Tell the DP or director at once, with clip name and timecode. Don’t clear the card or fix files before the problem is logged. For damaged files, stop using the card, keep it, and check recovery options. Prevent more by testing the full chain before the shoot and checking each setup."], ["I can list common recording errors.", "I can explain why to scrub the whole file and report immediately.", "I can find an error in a set of clips and log it.", "For a production I can predict likely failure points, build checks for them, test, and justify the routine."], [["Why scrub the whole file?", "Problems can occur partway through and not at the start."], ["What should you do before clearing a card with a suspected error?", "Log it, keep the card, and tell the DP or director."]], "kcN", "Hide three kinds of error in a set of test clips (dropped frames, silent audio, a wrong frame rate) and have a classmate find them. Predict which they will miss, then compare.", []], ["Rushes assembly", "Rushes are the day’s printed takes, assembled with the monitoring look so the director and key crew can review them.", "You can assemble and deliver rushes.", ["<b>Rushes</b> (dailies) are the raw footage from each shooting day, assembled and reviewed by the director, DP and relevant HODs. The DIT prepares the assembly from the <b>printed takes</b> (confirmed with the script supervisor) with the monitoring LUT applied. Usually only circled takes are included, in scene order, labelled so they can be referred to.", "Agree the protocol before the shoot: which takes, in what order, with what information, how delivered, and how quickly. Use the script supervisor’s notes and check them against the camera and sound reports. Include sound synced to picture where possible. Rushes are for judging performance and spotting problems; they are not the grade. Keep to the agreed delivery format, and keep copies in the folder structure for the editor."], ["I can say what rushes are.", "I can explain who confirms which takes to include.", "I can assemble a rushes timeline from printed takes with a LUT.", "For a production I can set a rushes protocol, predict delays, test it on a mock day, and justify the format."], [["Who confirms the printed takes?", "The script supervisor, with the director."], ["Why agree the protocol before the shoot?", "So the work runs automatically after a long day, without arguments."]], "vqs", "Assemble a rushes timeline from your own test shoot using only the continuity sheet. Predict where the sheet and files will disagree, then fix and report.", []], ["Metadata", "Metadata is information about the footage: clip names, timecode, scene, take, camera settings. It is how footage stays findable.", "You can use and check metadata through the pipeline.", ["<b>Metadata</b> is data about the footage, recorded by the camera (clip name, timecode, frame rate, lens, settings) and added by people (scene, take, shot, circled, notes). It makes footage searchable in the edit, links picture to sound, and helps the colourist. Software such as Resolve can read and write it.", "Camera metadata is created automatically, so don’t destroy it by renaming or converting without care. Add scene and take information from the continuity sheet, which saves the editor hours, and agree the fields with the editor in advance. Check that timecode, reel names and frame rate are consistent across cameras. Keep a record of any changes. Wrong or missing metadata is a common cause of failed relinks and sync trouble."], ["I can say what metadata is.", "I can explain why it should not be lost or altered carelessly.", "I can read camera metadata and add scene and take information.", "For a production I can plan the metadata workflow, predict where it breaks, test, and justify the fields I add."], [["Name two pieces of camera metadata.", "For example clip name and timecode."], ["Why add scene and take information?", "It lets the editor search and find footage quickly."]], "vqs", "Add scene and take metadata to ten clips in Resolve. Predict how long an editor would take to find a given take with and without it, and test.", []], ["Cross-checking camera, sound and continuity reports", "Three sets of notes describe the same day. The DIT checks that they agree before anything is cleared.", "You can reconcile camera, sound and continuity records.", ["The <b>camera report</b> records every roll or card, the <b>sound report</b> every audio file, and the script supervisor’s <b>continuity sheet</b> every slate and take. The DIT cross-references them with the offload records to confirm every reel and file from a shoot day is received, copied, verified and accounted for before any media is cleared.", "Compare card and clip counts, slate and take numbers, and audio file names. Resolve discrepancies the same day, with the people involved. Look for takes with picture but no sound, sound with no picture, and cards missing from the report. Agree the naming of wild tracks and pick-ups beforehand. Keep the finished checks with the day’s records. See Script Supervision (Cross-referencing camera and sound reports)."], ["I can name the three records.", "I can explain why they must agree before cards are cleared.", "I can reconcile the three for a set of takes and list discrepancies.", "For a production I can design the cross-check, predict common mismatches, test, and justify its timing." t three questions, then record what they actually ask and improve your readme.", []]];
