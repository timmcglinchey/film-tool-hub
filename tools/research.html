 then list what each added.", [["read", "foundational", "BFI and local archive collections for visual research", "Search: “BFI archive collections” and your local or regional archive"]]], ["Period and cultural research", "Period and cultural research makes sure the objects, spaces and clothes of a world are accurate, and respectful, for the time and community shown.", "You can research a period or culture so that the design is accurate and avoids stereotype.", ["<b>Period research</b> is research into the material culture, design and visual language of a specific historical period. It ensures that props, costumes and dressing are accurate to the time in which the film is set: not just the obvious items but everyday objects, packaging, typography, colours, materials and the way spaces were used. Anachronisms (things out of time, like a modern light switch) break the illusion.", "<b>Cultural research</b> applies the same care to communities and places, including religious and cultural practices and their material signs. Learn from people from that culture, not only from outsiders’ images, and avoid stereotype and decoration without meaning. Decide what is non-negotiable and what can be approximate, and why (a detail in the background may matter less than a hero prop). Check with the director and an adviser if the subject is sensitive. Keep a record of sources and decisions."], ["I can say what period and cultural research are for.", "I can explain what an anachronism is and why advice from people in the culture matters.", "I can research a period or culture and list the non-negotiable details.", "For a film I can plan what must be accurate and what can be approximate, test the plan with an adviser, and justify choices where accuracy and practicality conflict."], [["What is an anachronism?", "Something that doesn’t belong in the period shown, such as a modern object in a historical scene."], ["Why consult people from the culture you are depicting?", "They know details and sensitivities that outsiders’ sources may miss or get wrong."]], "nB", "Choose a decade and list ten everyday objects from a kitchen of that time with a source for each. Predict which two you’d most likely get wrong, then check with someone who remembers or with an archive.", []], ["Art history movements", "Art movements give designers a vocabulary of shapes, colours and ideas that films borrow to create a world.", "You can recognise major art movements and use them to inform and justify design choices.", ["Movements such as the Renaissance, Baroque, Romanticism, Impressionism, Expressionism, Surrealism, Cubism, Bauhaus and modernism, Art Deco, and Pop Art each have a recognisable approach to colour, form, space and meaning. Designers use them as references: German Expressionist cinema (for example <i>The Cabinet of Dr. Caligari</i>) used painted, distorted sets to show a disturbed mind, and Art Deco styling has been used to suggest glamour and a machine-age city.", "Knowing movements helps you find references quickly, talk to directors in shared terms, and understand where a film’s look comes from. Study the ideas behind a movement as well as its look, so that you borrow the meaning (distortion for unease, order for control) and not just a surface. Use references as inspiration and adapt them, rather than copying. Visit galleries, books and online collections. This links to colour, symbolism and the historical use of metaphor."], ["I can name several major art movements and one visual feature of each.", "I can explain how a film might draw on a movement for meaning, not just style.", "I can find a movement to match a mood or theme and gather references.", "For a film I can choose and adapt art references, predict how they will read, test with the director and DP, and justify what I take and what I leave."], [["What is an example of film design drawing on an art movement?", "German Expressionist films used distorted painted sets to express a disturbed state of mind."], ["Why study the ideas behind a movement as well as its look?", "So you can borrow its meaning and not just a surface style."]], "tnB", "Choose one art movement and design a single room for a scene in that style, with a one-page explanation of what its choices mean. Predict how a viewer will read it, then ask one.", []], ["Aesthetic and design movements (clothing, hair, make-up, architecture)", "Fashion, hair, make-up and architecture each have recognisable periods and styles that tell the audience when and where a story is set.", "You can recognise the main design periods across clothing, hair, make-up and architecture and use them accurately.", ["Design periods give each era a recognisable look: Georgian and Victorian architecture and dress, the 1920s with Art Deco buildings and flapper styles, the 1950s ‘New Look’ silhouettes and mid-century furniture, the 1960s mod and psychedelic looks, the 1970s and 1980s with their colours and fabrics, and architectural styles such as brutalism and modernism. Hair and make-up change in step with them, and even small details date a scene.", "Remember that periods overlap and that people don’t all follow fashion: ordinary people wore older clothes, and places mix several periods. Accuracy for the main characters and key objects matters most. Use research (photographs, magazines, catalogues, museums) and talk to costume, hair and make-up, and architecture or location teams so the whole picture agrees. Think about how class, region and culture affect it. A consistent world is believable, even if it isn’t perfectly accurate."], ["I can name several design periods and one feature of their clothing or architecture.", "I can explain how hair, make-up, costume and architecture combine to place a story in an era.", "I can gather accurate references for a period across all four areas.", "For a film I can plan period details across departments, predict where they will conflict or date badly, test with research, and justify the level of accuracy chosen."], [["Why do ordinary people’s clothes in a period film often look older than the fashion?", "People kept wearing older clothes, so a believable crowd mixes recent and older styles."], ["Which departments need to agree on a period’s look?", "Production design, costume, hair and make-up, and the DP, so the whole picture is consistent."]], "nB", "Pick one decade and collect references for architecture, costume, hair and make-up. Predict which area will be hardest to find good references for, then present your findings with sources.", []], ["Historical use of metaphor through production design", "Design can carry meaning: a space or object can stand for an idea. Many films use the physical world as a metaphor.", "You can read and plan visual metaphors in a set, and use them without becoming heavy-handed.", ["A visual metaphor makes a physical thing stand for an idea. In <i>The Cabinet of Dr. Caligari</i>, distorted painted sets express a disturbed mind. In <i>Metropolis</i>, the city’s vertical structure shows a divided society. Xanadu in <i>Citizen Kane</i> is huge and cold, showing wealth and isolation. In <i>Parasite</i> the movement between houses and up and down stairs follows class position. The Overlook Hotel in <i>The Shining</i> has spaces that don’t add up, which unsettles viewers.", "To use metaphor, start with the theme and ask what the space can say: height for status, clutter for a crowded mind, symmetry for control, decay for a failing relationship. Keep it subtle enough to be felt before it is noticed, and make it work as a believable space first. Connect it to the director’s themes and the visual language. Study films and ask what each design choice means and what it costs to achieve."], ["I can give an example of a film where design acts as a metaphor.", "I can explain how a space or object can stand for an idea.", "I can plan a visual metaphor for a theme in a single set and explain it.", "For a film I can design metaphors from its theme, predict how viewers will read them, test them, and justify the balance between subtlety and clarity."], [["How does Caligari’s design act as a metaphor?", "Its distorted, painted sets express a disturbed state of mind."], ["Why should a set be believable before it is symbolic?", "If it feels artificial, the audience notices the device and the metaphor loses power."]], "tBa", "Choose a theme and design one room that expresses it through shape, scale, colour and objects, without any text. Show it to two people and ask what they think it says. Predict their reading first.", []], ["Palette", "A palette is the limited set of colours that dominate a film or scene, and it sets mood, ties departments together and guides the eye.", "You can build and justify a palette, and keep it consistent across sets, costume, and light.", ["A palette is built from a few colours, chosen for what they communicate and how they relate: complementary (opposites on the colour wheel), analogous (neighbours), monochromatic, or a neutral world with one accent. Warm and cool, saturated and desaturated, light and dark all carry meaning, and associations vary between cultures. A palette can shift across a film to follow the story.", "The designer builds the palette with the director, the DP and costume, because colours interact: a costume against a wall, a wall under a particular light. Use swatches of actual paint and fabric under real lighting, not only screens, which show colour differently. Keep a record of exact colours used so they can be matched later. Check how the camera and grade will treat the palette. The Cinematography role covers the camera and lighting side."], ["I can name some colour relationships used in palettes.", "I can explain how a palette sets mood and why colours should be tested under real light.", "I can build a palette for a scene and keep it consistent across set and costume.", "For a film I can design a palette that follows the story, predict how light and camera will change it, test with swatches and the DP, and justify the choices."], [["Why test swatches under real light and not just on screen?", "Colour looks different on screens and under different lights, and the set will be seen under the real lighting."], ["Why share a palette with costume and the DP?", "Colours interact with each other and with light, so departments need to agree."]], "tnB", "Choose a palette for a scene and paint or collect swatches for the wall, costume and a key prop. Photograph them under two types of light and predict what will change, then compare.", []], ["60/30/10 colour proportion rule", "A guide for balancing colour: roughly 60 per cent dominant colour, 30 per cent secondary and 10 per cent accent.", "You can use the 60/30/10 rule to balance a scene’s colour and know when to break it.", ["The <b>60/30/10 rule</b> comes from interior and graphic design. It suggests a balanced colour scheme uses about 60 per cent of a dominant colour (often a calm background, such as walls or large surfaces), 30 per cent of a secondary colour (furniture, curtains, large costume pieces) and 10 per cent of an accent colour (small, strong details that draw the eye). It gives a clear hierarchy and keeps a space from feeling chaotic or flat.", "On a film set, apply it to what the camera sees in the frame, not to the entire room, and remember that frames change with each setup. The accent often falls on what the audience should look at (a costume item or a key prop). Break it for effect: an overwhelming dominant colour feels oppressive, equal proportions feel busy, and removing the accent may feel dull. It is a starting point to be tested through the lens with the DP, not a law."], ["I can state the 60/30/10 proportions.", "I can explain what each part is for and apply it to a frame.", "I can use the rule to design the colour of a set and costume for a shot, and check it through the camera.", "For a scene I can apply and deliberately break the rule, predict the visual effect, test it, and justify the proportions I choose."], [["What are the three parts of the 60/30/10 rule?", "60 per cent dominant colour, 30 per cent secondary and 10 per cent accent."], ["Why apply the rule to the frame and not the room?", "The camera sees only part of the space, so proportions should work in each framed shot."]], "tnr", "Design a shot using 60/30/10, photograph it, and then re-do it breaking the rule (for example 90/10 or equal thirds). Predict how each will feel, then show both to someone and compare.", []], ["Texture and ageing", "Texture and ageing give surfaces a history. Wear, dirt and repair make a space and its people believable.", "You can plan and apply texture and ageing that fits the story and the camera.", ["Real objects show use: worn edges on a table, scuffed paint at handle height, sun-faded curtains, a mended chair. <b>Ageing</b> (also called distressing or breaking down) is the process of making new things look used, through sanding, paint, dirt, dyeing and layering. It should reflect the story: who lives here, how long, how they treat their things, and how time has passed. Texture also affects mood: rough, smooth, glossy, soft.", "Plan it with the director and DP, because the camera and light show texture dramatically, particularly raking light and close-ups. Keep it consistent: dirt, fading and wear shouldn’t change between setups unless the story requires it, and costume breakdown must be tracked. Use safe materials, and test on spare pieces first. Take photographs before and after for continuity and for restoring hired items. Over-ageing looks fake, while no ageing looks like a set."], ["I can say what ageing is and why it is used.", "I can explain how wear should follow the story, and why consistency matters.", "I can age a prop or surface convincingly and photograph it for continuity.", "For a set I can plan ageing from the story, predict how the camera and light will show it, test it, and justify the level of detail."], [["Why does ageing need to be consistent across setups?", "The audience will notice if wear or dirt appears or disappears between shots of the same scene."], ["Why test ageing on a spare piece first?", "It is hard to undo, and the effect on camera may differ from what you expect."]], "nBr", "Age a new object (a mug, a jacket or a piece of wood) to suit a character’s backstory. Photograph it under raking light, and predict which area will look fake, then ask someone to guess the object’s history.", []], ["Properties of materials in production design", "Materials behave differently in front of a camera, a light and a microphone. Knowing their properties saves time, money and problems.", "You can choose and use materials for how they look, perform, sound and withstand a shoot.", ["Every material has properties that matter on set. <b>Look</b>: how it reflects light (matte, gloss, metallic, translucent), how it takes paint, and how it reads on camera at distance and close up. <b>Weight and strength</b>: whether it can be moved, safely stood on or carried by a small crew. <b>Sound</b>: floors that creak, metal that rings, plastic that rattles. <b>Safety</b>: flammability, toxicity, sharp edges, dust. <b>Cost and workability</b>: how easy it is to cut, join, paint and repair.", "Designers also use substitutes: polystyrene carved to look like stone, plywood and paint for wood panelling, painted fabric for leather, and sugar glass for breakable props. These save weight and money but have their own limits (they may look wrong in close-up, or be fragile). Test materials on camera under the planned lighting, and talk to the DP about reflections and to sound about noise. Use fire-retardant materials where required, and follow health and safety guidance."], ["I can name properties of materials that matter on set.", "I can explain why a substitute material may be used and its limits.", "I can choose materials for a set piece considering look, weight, sound and safety.", "For a build I can compare materials, predict how they will perform on camera and microphone, test them, and justify my choice."], [["Name a way a material could cause a sound problem.", "A creaking floor, a metal surface that rings, or plastic that rattles."], ["Why test a substitute material on camera?", "It may look convincing in the workshop but read as fake in close-up or under particular lighting."]], "nB", "Make three samples of a ‘stone’ wall surface using different materials. Film them under the planned light, predict which will look most real on camera, and compare with your choice.", []], ["Symbolism", "Symbolism uses objects, colours and images to stand for ideas. It works best when it grows from the story and is not announced.", "You can use symbols in design deliberately, and spot when they are overdone or unclear.", ["A <b>symbol</b> is an object, colour or image that represents an idea beyond itself: a caged bird for confinement, a clock for time passing, red for danger or passion. Some symbols are widely shared, others come from within the film, and meanings differ between cultures and times, so check yours. The strongest ones are both real in the world of the story and meaningful for it.", "Plan symbols from the theme and tie them to the character’s journey, and let them change as the story changes. Avoid stacking too many, or making them so obvious that the audience feels lectured. Share them with the director, DP and costume so they are consistent and photographed well. Use repetition to build meaning and a motif. Test whether viewers notice and what they take from them, and be willing to cut one that doesn’t work."], ["I can say what a symbol is and give examples.", "I can explain why meanings vary and why too many symbols weaken a film.", "I can plan a small set of symbols for a scene and explain what each means.", "For a film I can design symbols that follow the story, predict how they are read, test on viewers, and justify what I keep and cut."], [["Why check whether a symbol means the same to everyone?", "Meanings differ between cultures and contexts, so the symbol could be misread."], ["What makes a symbol strongest?", "It is believable in the world of the story and also meaningful for its themes."]], "nBa", "Choose three symbols for your film and place them in a set sketch. Show it to three people and ask what each suggests. Predict whether they’ll spot them, then compare.", []], ["How surfaces interact with light", "Surfaces absorb, reflect and colour light, so design and lighting have to be planned together.", "You can predict how a surface will react to a light and choose or treat it accordingly.", ["Every surface does three things to light: it reflects some, absorbs some, and tints what it reflects. A white wall bounces light and fills a room, a dark wall absorbs it and makes it more contrasty, and a coloured wall adds colour to everything near it (a red wall puts a red cast on skin). <b>Matte</b> surfaces scatter light evenly, while <b>glossy</b> and metallic surfaces reflect it directionally, creating highlights and reflections of lights, crew and the camera.", "Colour and reflectivity of set dressing and costume affect how light behaves in the space and how the camera renders it, so they must be coordinated with the DP and lighting department. Practical steps include choosing matte finishes, dulling shiny surfaces with spray, avoiding pure white and pure black, testing colours and materials on camera, and considering what the light will bounce off. Talk to the DP early about problem surfaces such as mirrors, glass and chrome."], ["I can say that surfaces reflect, absorb and tint light.", "I can explain the difference between matte and glossy surfaces and why they matter on set.", "I can pick or treat surfaces to avoid problem reflections and to help the lighting.", "For a set I can predict how surfaces will behave under the planned lights, test them on camera, and justify the choices with the DP."], [["Why is a pure white wall difficult on camera?", "It reflects a lot of light, which can overexpose and bounce unwanted fill into the scene."], ["How can you reduce the glare from a shiny surface?", "Dull it with a matte spray, change its angle, or choose a different material."]], "BLn", "Film the same actor in front of a white, a dark grey, and a coloured wall with identical lighting. Predict the difference in skin tone, contrast and colour cast, then compare in a waveform or on a monitor.", []], ["Environmental storytelling", "A space can tell the audience who lives there, what has happened and what is about to happen, without anyone saying a word.", "You can design a space so that its objects and condition tell a story.", ["<b>Environmental storytelling</b> uses the physical world to convey story, character and history. A room with two toothbrushes and one set of keys tells a different story from one with a single toothbrush. Details such as worn patches, photographs, medicine bottles, unpaid bills, a child’s drawing on the fridge, a repaired object, or a gap on a shelf suggest backstory and relationships. Every object in frame tells the audience something about the characters and their world.", "Start by asking who lives or works here, what they do, what they have lost or hope for, and what has just happened. Choose a few meaningful details instead of filling the room, and think about what the camera will actually see. Make the clues discoverable but not obvious, and keep them consistent with the script. Share the ideas with the director and actors, as actors can use the objects. Check each detail against the budget and the plan for continuity."], ["I can say what environmental storytelling is.", "I can explain how objects, wear and arrangement suggest history and character.", "I can design a room so that five details tell a specific story.", "For a space I can design storytelling details from the script, predict what viewers will read, test on viewers, and justify what I add and remove."], [["Why choose a few meaningful details over many?", "Too many details create noise, while a few well-chosen ones are noticed and understood."], ["Why share storytelling details with actors?", "They can use the objects in their performance, which makes the space feel lived in."]], "nBe", "Dress a small space so that someone entering can tell, without words, who lives there and what happened last night. Show it to three people and predict what they will say, then compare.", []], ["Depth", "Depth in a set comes from layers, overlap, scale and colour, and gives the camera something to travel through.", "You can design a set with layers and cues that give the image depth.", ["A frame is flat, so depth is an illusion created by cues: <b>layering</b> (foreground, middle ground and background), <b>overlap</b> (things in front of other things), <b>scale</b> (objects getting smaller with distance), converging lines and perspective, <b>haze</b> and lower contrast in the distance, and colour (warm advances, cool recedes). Doorways, windows, corridors and mirrors let you see through to other spaces.", "The designer builds depth into the space by planning layers and what the camera will look through: a foreground object at the edge of frame, actors in the middle, a lit room or window behind. Talk to the DP, who creates depth with light, lens and movement as well (see the cinematography domain). Avoid placing actors directly against a flat wall. Sets with several rooms and sightlines are more useful, and a location with a long view gives free depth."], ["I can name cues for depth in an image.", "I can explain how layers and sightlines in a set create depth.", "I can add layers to a set so a shot has foreground, middle ground and background.", "For a set I can design depth for the key shots, predict how it will read on camera, test it, and justify when I choose flat staging deliberately."], [["Name three depth cues a designer can build into a set.", "For example layered foreground and background objects, doorways or windows to look through, and converging lines or colour."], ["Why avoid putting actors directly against a flat wall?", "It flattens the image and loses depth and separation."]], "nBg", "Photograph the same actor in a flat wall setup and then in the same room with a foreground object, a doorway behind and a lit background. Predict the difference in depth, then compare.", []], ["Negative space", "Negative space is the empty area around subjects. It gives the eye rest and can make a character feel small, alone or free.", "You can use empty space deliberately in a set and frame.", ["<b>Negative space</b> is the area of the frame that is empty or uncluttered around the subject. It can create isolation (a small figure in a large empty room), calm, tension (waiting for something to enter), or elegance. Too little makes a frame crowded and confusing. It is a feature of minimalist design, and a classic way of making the character the centre of attention.", "As a designer, plan areas that are deliberately left clear, for example a plain wall or a bare floor, instead of filling every area, and remember that the DP will frame within what you provide. Space also gives the DP room for light and the editor room for graphics. Empty space must feel purposeful: an unfurnished room should look empty for a reason. Test with the lens and aspect ratio that will be used, since they change what space is seen."], ["I can say what negative space is.", "I can explain what emptiness can communicate and the risk of too little.", "I can design a set where empty areas are deliberate and work in frame.", "For a scene I can plan negative space for meaning, predict how it will read with the chosen lens and ratio, test it, and justify how much emptiness to use."], [["What can a small figure in a large empty frame suggest?", "Isolation, vulnerability or insignificance."], ["Why should empty space in a set feel purposeful?", "Otherwise it looks unfinished rather than meaningful."]], "nBe", "Frame a person in a room three ways (filling the space, centred with space around, small in a big empty area). Predict what each says about the character, then show them to someone and compare.", []], ["Scale and proportion", "The size of things relative to people, and to each other, changes how a space feels, and what the camera makes of it.", "You can design with scale and proportion to make a space feel large, small, comforting or threatening.", ["<b>Scale</b> is the size of an object or space compared with the human body. <b>Proportion</b> is the relationship of sizes within a design, such as door to wall, table to chair, window to room. Huge ceilings and doors make a person feel small and a space grand or intimidating, while low ceilings and large furniture can feel cosy or oppressive. Children’s-eye perspective can be created with oversized objects.", "Design for the camera as well as for the eye: lenses and angles change how size reads, and a set built a little smaller or larger than life can look right on screen. Techniques include <b>forced perspective</b> (placing smaller things further away to make the space seem deeper), scaled sets and miniatures (see Miniatures and models). Check the actors’ head and shoulder room, camera access and lighting positions. Keep the scale consistent with the story’s world unless distortion is deliberate."], ["I can say what scale and proportion mean.", "I can explain how size relationships affect feeling and what forced perspective is.", "I can design a set piece with scale chosen to match the character’s emotional state.", "For a film I can plan scale for each key space, predict how the camera will show it, test with a model or tests, and justify distortions."], [["How can a very tall ceiling affect how a character feels?", "They can feel small, exposed or dominated by the space."], ["What is forced perspective?", "Placing smaller objects further away so the space appears deeper than it is."]], "nBg", "Build or draw the same room twice with a low ceiling and a very high ceiling. Photograph an actor in each, predict how each changes the feeling of the character, and compare.", []], ["Floor plans", "A floor plan is a top-down scale drawing of a space, used to plan the set, the blocking and the camera before building anything.", "You can draw and use a floor plan to design and communicate a set.", ["A <b>floor plan</b> shows walls, doors, windows, furniture and levels in a top-down view, drawn to scale. For a location it is made from measurements taken on the recce, and for a built set it is part of the construction drawings. Along with elevations (side views), it lets the team see whether a space works for the story, the blocking and the camera, and what must be built or moved.", "Draw to scale, note dimensions, mark openings and heights, and show where walls can be removed (wild walls). Share it with the director, DP and 1st AD, who can add blocking, camera positions and lighting. Software (for example, SketchUp or simple drawing tools) can produce 3D views, but pencil and graph paper work. Check sightlines, space for crew and kit, and routes for actors and equipment. A good plan prevents many problems and changes."], ["I can say what a floor plan shows.", "I can explain why it is drawn to scale and who uses it.", "I can measure and draw a floor plan of a real room with doors, windows and furniture.", "For a scene I can design a plan, predict problems for camera and blocking, test it on location, and justify changes."], [["Why draw a floor plan to scale?", "So you can check whether people, furniture, camera and equipment actually fit."], ["What is a wild wall?", "A wall that can be removed so the camera or lights can get in."]], "nKs", "Measure a room and draw a floor plan to scale. Add actor blocking and three camera positions for a scene. Predict which position won’t work, then test it in the room.", []], ["Miniatures and models", "Scale models let designers, directors and DPs test ideas in three dimensions before anything full-size is built, and miniatures can appear on screen.", "You can build and use a model to plan a set, and know when a miniature is used on screen.", ["A <b>design model</b> is a scale model of a set, usually in white card or foam board, used to work out the space, sightlines, levels, camera angles and builds. Small cameras or phones (or viewfinders) can look through it to test shots, and moving pieces shows how walls will be removed. It is cheap, quick and clearer than drawings for many people.", "<b>Miniatures</b> are models built to appear on screen as the real thing, such as buildings, landscapes or vehicles, often combined with live action. They have a long history in film, require careful scale, detail and lighting, and are used less now because of digital effects, but still appear. Models need to be consistent in scale and the work takes time, so plan the schedule and budget. They overlap with visual effects and previs (see Planning and pre-visualisation)."], ["I can say what a design model is for.", "I can explain the difference between a design model and an on-screen miniature.", "I can build a simple white card model of a set and test camera positions through it.", "For a set I can use a model to predict problems with sightlines and lighting, test them, and justify design changes before building."], [["What is a white card model used for?", "Working out space, sightlines, levels and camera angles cheaply before building."], ["Why is scale consistency important in miniatures?", "Inconsistent scale makes them look like models on screen."]], "nBK", "Build a white card model of a set at 1:25 scale and look through it with a phone camera. Predict which angle won’t work, then find it and change the model.", []], ["3D scanning", "3D scanning captures a real space or object as a digital model, which can be used for planning, building, and digital sets.", "You can scan a location or prop, and know what the results can and cannot do.", ["<b>3D scanning</b> creates a digital model of a real object or space. <b>Photogrammetry</b> builds a model from many overlapping photographs (even from a phone), while <b>LiDAR</b> and laser scanners measure distances to produce a point cloud. Results can be used to take exact measurements, plan sets and camera moves in a game engine or modelling software, copy a prop, or create digital environments for virtual production and visual effects.", "Scans take time and processing power, and quality depends on lighting, surface (shiny and transparent surfaces scan badly) and coverage. File sizes are large. You need permission to scan a location or someone’s property, and to respect privacy and copyright. For students, a phone scanning app and a medium-size prop is a good start. Check accuracy against real measurements before relying on it. See Unreal Engine pre-viz in Cinematography for what can be done with the model."], ["I can say what 3D scanning is and name two methods.", "I can explain what the results are used for and why shiny surfaces cause problems.", "I can scan a small object or room and check the model against real measurements.", "For a project I can plan where scanning would help, predict its limits, test the accuracy, and justify when it is worth the time."], [["Name two methods of 3D scanning.", "Photogrammetry (from photographs) and LiDAR or laser scanning."], ["Why do shiny and transparent surfaces scan poorly?", "They reflect or pass light, so the scanner can’t reliably measure the surface."]], "nBs", "Scan a prop with a phone app and measure three dimensions on the model and on the real object. Predict the error, then compare, and note which surface caused trouble.", []], ["Recce for design", "On a recce the designer looks at what the space needs, what to take out or add, and what could go wrong.", "You can use a recce to assess a location for design, and leave with a list of actions.", ["The production designer attends the recce to see what needs dressing or undressing and what set builds are needed. Check the colours, surfaces and period details that match or clash with the design, what can be removed or changed (with the owner’s permission), the access for bringing in and out furniture and props, power for practical lights, space for storage, and the possible hot-set areas.", "Measure and photograph carefully, including close-ups of finishes and details, and mark things that can’t be moved or touched. Discuss with the director and DP where cameras and lights will go, as it affects dressing. Agree with the 1st AD how long dressing and strike will take. Afterwards, produce a location-specific design document with a list of what to add, remove or change, and update the budget and sourcing schedule. See ‘Location recces vs. tech scouts’ in Producing."], ["I can say what a designer looks for on a recce.", "I can explain why access, power, storage and what can be changed matter.", "I can run a design recce and produce a list of actions.", "For a location I can predict what the recce will reveal, test my list against the real space, and justify the changes I propose."], [["Why measure and photograph in detail on a recce?", "You will plan dressing, builds and continuity from those records, often away from the location."], ["Who should you agree dressing and strike times with?", "The 1st AD."]], "nhp", "Do a design recce of a real location. Predict the three biggest design changes needed, then list actions with measurements and photographs, and compare with the real needs.", []], ["Build vs. find", "You can build a set or find a real location. Each has costs, advantages and risks, and the right choice depends on the story and the resources.", "You can compare building and finding a location and choose with reasons.", ["<b>Finding</b> a real location is usually cheaper and gives authentic detail and depth, but offers less control: light, sound, access, walls, schedules and what you can change are all limited by the owner and the building. <b>Building</b> a set (in a studio, workshop or empty space) gives control over size, walls (wild walls), lighting access and sound, and can create places that don’t exist, but takes design, materials, labour, time, space and money, and a safe way of working.", "Often the best solution is a mix: a real location dressed to suit, with a part built (a window, a corridor or a single wall). Compare options on cost, time, control, safety, sound, light, story needs and the schedule. For students, a well-chosen and well-dressed real location nearly always beats a poor build. Consider what the camera will see and build only that. Talk to the DP, 1st AD and producer."], ["I can say the main advantage of each approach.", "I can explain the trade-offs between control and cost.", "I can compare two options for a scene on several criteria and choose.", "For a scene I can compare finding, building and hybrids, predict the costs and risks, test with a plan, and justify the choice."], [["Name one advantage of building a set and one of finding a location.", "Building gives control (walls, light, sound), while finding is usually cheaper and gives authentic detail."], ["Why consider a hybrid?", "You can use a real location and build only the part the camera needs."]], "nps", "Choose a scene and compare finding, building and a hybrid in a table (cost, time, control, risk). Predict which the producer will choose, then ask them and compare reasoning.", []], ["Set construction techniques", "Sets are built to be light, strong, safe and quick to move, using methods different from ordinary building.", "You can describe common set construction methods and plan a safe, realistic build.", ["Sets are usually built from <b>flats</b>: timber frames covered with plywood, hardboard or canvas, which are light enough to move, can be joined together and painted to look like walls. <b>Wild walls</b> can be removed for camera access. Surface finishes include paint, wallpaper, plaster, scenic paint effects and carved polystyrene to imitate stone or brick, and many props are faked in lighter or safer materials. Sets are also built to be struck (taken apart) and often reused.", "Construction needs skilled carpenters and builders, tools and workshop space, and follows health and safety rules: safe use of power tools, manual handling, dust and paint ventilation, working at height, fire-retardant materials for sets, and structural strength for people standing or climbing. For student projects, use modular flats or hired or borrowed sets, and always work under supervision with training and the institution’s rules. Draw plans, calculate materials and time, and build in testing and finishing. Talk to the DP about wild walls and ceilings, and to sound about creaks."], ["I can say what a flat and a wild wall are.", "I can explain why sets are built light and removable, and the main safety issues.", "I can plan a simple set build with materials, time and safety measures.", "For a set I can design a build, predict its time, cost and safety risks, test it with a model or mock-up, and justify construction choices, including when to use a specialist."], [["What is a flat?", "A light timber frame covered with board or canvas, used to make a wall."], ["Why are sets built with removable walls?", "So the camera, lights and crew can get into the space."]], "nJy", "Plan a simple two-wall set with a door. List materials, tools, steps, time and safety measures. Predict the biggest risk, then ask a technician to check your plan.", []], ["Dressing", "Dressing is adding the furniture, objects and detail that turn a location into the world of the film.", "You can dress a space so that it looks lived in, matches the design and works for filming.", ["<b>Dressing</b> is the process of adding props, furniture and decorative elements to a location to transform it into the world of the film. <b>Set dressing</b> is what fills the space, as opposed to the props actors handle. A set dresser or art department will source, place and maintain it according to the design bible, with attention to what is in shot.", "Dress for the camera: start with the main sightlines, add layers and details that tell the story, and avoid clutter in places that won’t be seen. Make sure that essential items are consistent through scenes, and that things actors move are tracked. Photograph the finished set before every shoot day as a record, because dressing is often disturbed. Agree with the owner what can be moved, protect surfaces, and plan time for dressing and for strike. Check with the DP and sound before finalising."], ["I can say what dressing is.", "I can explain the difference between dressing and props and why photographs are taken.", "I can dress a space for a scene and photograph it for continuity.", "For a scene I can plan dressing for the key shots, predict where it will be disturbed or fail on camera, test, and justify what I add or leave."], [["What is the difference between set dressing and props?", "Dressing fills the space, while props are handled by actors."], ["Why photograph the set before each shoot day?", "Dressing gets moved, and the photographs let you restore it exactly."]], "nBs", "Dress a corner of a room for a scene and photograph it from the camera position. Move five items and ask a partner to restore the set from the photographs. Predict how many they will get wrong.", []], ["Hot sets", "A hot set is a dressed set that must not be disturbed between setups, because moving anything can break continuity.", "You can protect and manage a hot set, and restore it if needed.", ["A <b>hot set</b> is a dressed set that must not be disturbed between setups. It is announced by the art department or the 1st AD, and everyone on set must know not to move, lean on or take things from it. Moving even a single item can break continuity and cost time. The art department is responsible for making sure nothing is moved, and must photograph the set thoroughly so that it can be restored if anything changes.", "Mark the area clearly, brief the crew and cast, and keep a ‘set dresser’ present to guard and reset. Take photographs from several angles and make notes of positions, including the state of food and drink and anything that changes during the scene. Work with the script supervisor, who also records details. Tell the 1st AD in advance what a hot set means for the schedule (for example, lighting changes must happen around it). Reset between takes where actors move things."], ["I can say what a hot set is.", "I can explain who is responsible and why photographs are taken.", "I can mark and brief a hot set and restore it from records.", "For a scene I can plan how to protect the set across several setups and days, predict where it will be disturbed, test, and justify the system."], [["Who announces a hot set?", "The art department or the 1st AD."], ["What should you do if something on a hot set gets moved?", "Restore it using the photographs and notes, and tell the script supervisor."]], "nqb", "Set up a hot set with ten items, shoot a scene across three setups, and have someone secretly move one item. Predict whether you will notice, then check using your photographs.", []], ["Strike and return", "Strike is taking everything out at the end, and return is leaving the location exactly as you found it.", "You can plan and carry out a strike so that locations and hired items are returned in good order.", ["<b>Strike</b> is the process of removing all set dressing, props and equipment from a location at the end of a shoot. The location must be returned to exactly the state in which it was found. Plan it as carefully as the dressing: who does it, in what order, how long it takes, what vehicles and storage are needed, and where items are going.", "Use the ‘before’ photographs and notes to check that furniture, wall colours and fittings are restored, repair any damage and clean the space. Get the owner’s sign-off. Return hired or borrowed items quickly and in good condition, with documentation and receipts, to protect deposits and relationships. Allow time in the schedule and the budget for strike, and don’t leave it to a tired crew at the end of a long day without a plan. Check the location agreement."], ["I can say what strike means.", "I can explain why before photographs and owner sign-off matter.", "I can plan a strike with people, time, transport and checks.", "For a shoot I can predict where a strike will overrun or damage property, test the plan on a mock set, and justify the schedule."], [["Why take photographs before dressing a location?", "They show how it was originally, so you can restore it and prove the condition."], ["Why plan strike time in the schedule?", "It always takes longer than expected, and tired crews make mistakes."]], "nhf", "Plan and run a strike of a small dressed space, timing each step. Predict the time first, then compare, and list what you would change.", []], ["Hero, action and background props", "Props are grouped by how the camera and actors use them, which decides how much care, how many copies and what tracking each needs.", "You can categorise props and plan each category properly.", ["A <b>hero prop</b> appears prominently on camera and is frequently handled by actors. It must look exactly right from close range, and often needs multiple identical copies in case of damage or repeated takes. An <b>action prop</b> is used in a specific physical action during a scene (a weapon fired, food eaten, a phone that rings), and needs careful thought about safety, continuity and realism, and must be flagged to the continuity team. <b>Background props</b> populate the environment and are not directly handled by actors: dressings and decorative items that build the world.", "Categorising helps you spend wisely: put time and money on hero props, plan the logistics of action props (food that must be replenished for each take, breakaway items, working mechanisms), and use cheaper or simpler solutions for background. Write each prop on a list with its category, who handles it, which scenes and the status (owned, borrowed, hired or to be made). Test heroes on camera, in the actor’s hands and under the lights."], ["I can define hero, action and background props.", "I can explain why the categories decide how many copies, how much time and what safety each prop needs.", "I can sort a script’s props into the three categories and list special needs.", "For a film I can plan props by category, predict which will cause trouble on the day, test them with actors, and justify where I spend and where I save."], [["Why does a hero prop often need several copies?", "It is handled and seen closely, so damage, repeated takes or different actions need spares."], ["Why must action props be flagged to continuity?", "Their use changes between takes (food eaten, items broken), so the state must be tracked and reset."]], "nbq", "List every prop in a five-page script and sort them into hero, action and background. Predict which three will need the most attention, then test the hero props with an actor and a camera.", []], ["Sourcing, making and hiring", "Every prop and costume has to come from somewhere: already owned, borrowed, hired, bought or made. Each route has costs and risks.", "You can choose the right way of getting each item and manage the process.", ["Each item in the breakdown is marked as <b>owned</b>, <b>borrowed</b>, <b>hired</b>, <b>bought</b> or <b>to be made</b>. Borrowing from friends and family, charity shops and online marketplaces are cheap routes but need time and care. Prop and costume hire companies offer quality and range, but charge per day with deposits and damage terms. Making things gives control over appearance, but needs time, skills and materials. Flag anything needing special handling: weapons, food, animals, period items, valuable pieces.", "Agree and record what you borrow or hire and when it must be returned, and who is responsible for damage. Get multiples of important items, check items work, and keep receipts. Begin early because lead times are long. Insurance may be needed for valuable or hired items. For anything borrowed from a person, treat it as if it were hired. Keep a list of sources for future use."], ["I can name the main ways of getting props and costume.", "I can explain the costs and risks of each route and why records matter.", "I can mark a prop list with a source and plan for each.", "For a film I can plan sourcing, predict the late and expensive items, test the plan against real quotes and lead times, and justify the mix of routes."], [["Why treat borrowed items like hired ones?", "You are responsible for their return and condition, and good records protect the relationship."], ["Why start sourcing early?", "Lead times for hire, making and delivery are often longer than expected."]], "nph", "Mark each prop in your film as owned, borrowed, hired, bought or made. Get a real price for three, and predict which will exceed your estimate, then compare.", []], ["Tracking and continuity", "Props and dressing must look the same in every shot of a scene. This takes records, photographs and teamwork with continuity.", "You can track props and dressing so every setup matches.", ["Scenes are shot in pieces and out of order, so the state of every visible item must be recorded: where it sits, whether it is full or empty, clean or dirty, open or shut, in whose hand. The <b>props master</b> (or props person) is responsible for sourcing, managing and tracking all props throughout the production, and works with the script supervisor, who takes <b>continuity photographs</b> at each setup, recording the state of costume, props, hair and set dressing.", "Practical systems include a numbered prop list, a labelled prop table, bags and tags for each scene, photographs of the first and last state, and a note for anything consumed or changed (food, drink, cigarettes, writing). Reset between takes. Keep spares of consumables. Share continuity notes with the whole department each day. Items that are not tracked are the usual cause of continuity errors, which can be very expensive to fix."], ["I can say who tracks props and what continuity photographs are for.", "I can explain what must be recorded and why.", "I can set up a tracking system for props in a scene and keep it up through takes.", "For a scene I can predict where continuity will break, test the system on a practice shoot, and justify the methods I use."], [["What state details should be recorded for a drink on set?", "How full it is, where it sits and what it is in, for each shot."], ["Why take photographs at each setup?", "They let you restore everything exactly for the next setup or day."]], "nqb", "Shoot a short scene with food and drink across three setups. Track the props with notes and photographs. Predict where the cut will show an error, then cut it and check.", []], ["Weapons and regulations", "Real and replica weapons are strictly controlled. Using one on a shoot needs legal knowledge, trained people and clear rules.", "You can plan a scene involving weapons safely and legally, and know when to stop and ask.", ["Using weapons (real, replica, imitation or props) in film is regulated by law, institution policy and safety guidance. In the UK, firearms, imitation firearms and some bladed or offensive items are controlled by legislation, and carrying or displaying them in public can alarm people and has led to police action. Rules on blank-firing and replica firearms are strict, and live ammunition has no place on a film set. Prop weapons that look real can still be dangerous or cause alarm if mishandled or seen by the public.", "Treat any weapon as a high-risk item. Check your institution’s weapons policy before planning anything, and use only approved, clearly managed props (for example soft, rubber or obviously non-functional items) under supervision. For anything realistic or firing, a qualified armourer is essential. Inform the location owner and, where required, the police before filming in public, keep weapons out of sight when not in use, keep a log of who holds them, brief everyone, and follow HSE guidance. Risk assessments are required. When in doubt, don’t."], ["I can say that weapons are regulated and need special care.", "I can explain why realistic props can cause alarm and why an armourer is needed for firearms.", "I can plan a weapon scene according to the institution’s policy, with a risk assessment and brief.", "For a film I can redesign weapon scenes to reduce risk, predict the issues, test with the institution’s safety team, and justify the final approach."], [["Why is a realistic replica weapon filmed in public a risk?", "Members of the public may believe it is real and call the police, and the law restricts such items."], ["Who must be involved in any scene using realistic firearms?", "A qualified armourer, under the institution’s rules and with proper risk assessment."]], "yJN", "Choose a scene with a weapon in your script and write a risk assessment and an alternative way of telling it with no weapon on screen. Have your institution’s safety contact review it, and predict their main concern first.", [["read", "foundational", "HSE guidance on weapons and firearms in film and television", "Search: “HSE firearms film television production”"]]], ["Practicals", "Practicals are light sources visible in frame, dressed by the art department and working with the lighting team.", "You can choose and set up practicals so they look right and work with the lighting.", ["A <b>practical</b> is a light source visible within the frame: a bedside lamp, a ceiling light, a neon sign, a television. Practicals are sourced and managed by the art department, but their placement and wattage must be agreed with the DP and gaffer, because they are both set dressing and light. Common problems are the wrong brightness or colour, flicker, visible dimmers and wiring, and lamps that move between takes.", "Agree who provides what: art chooses fittings and shades, lighting chooses bulbs (wattage, colour temperature, dimmable) and controls. Check that they work at the shooting frame rate and don’t flicker, and that their cables are hidden and safe. Choose shades and surfaces for how they affect the light. Record the on or off state for continuity. Keep heat and fire risks in mind. See ‘Practicals with art department’ in the Cinematography role for the lighting view."], ["I can say what a practical is.", "I can explain why art and lighting must agree on them.", "I can set up a practical with a suitable bulb, shade and hidden power.", "For a scene I can plan practicals with the DP and gaffer, predict their look on camera, test them, and justify the choices."], [["Who agrees a practical’s placement and wattage?", "The art department with the DP and gaffer."], ["Why record whether a practical is on or off?", "So it is consistent between shots of the same scene."]], "nBL", "Dress a lamp as a practical in a scene, agree the bulb and shade with a cinematography student, and shoot it. Predict how bright and what colour it will be on camera, then check on a monitor.", []], ["Character design", "Costume tells us who a character is before they speak: their background, status, mood and how they change.", "You can design costume that expresses character and story, and works for the production.", ["Costume design starts with the script and the character: who are they, where do they come from, how do they feel about themselves, what do they do each day, and how do they change over the story? Silhouette, colour, fabric, condition and fit all communicate. Changes in costume can mark a character’s arc, and the palette must work with the sets and lighting.", "Research the period and culture, make mood boards, and discuss ideas with the director, production designer and actor, who need to feel right in the costume. Plan a look for each scene, and a costume breakdown by character and scene. Think about practicalities: movement, stunts, sound (rustling fabrics, jewellery), lighting (fabrics that reflect or glare), and budget. Test on camera. Costume is also part of the continuity plan."], ["I can say what costume tells an audience.", "I can explain how silhouette, colour and fabric communicate character.", "I can design a costume for a character with reasons for each choice.", "For a film I can plan each character’s costume arc, predict how it will read with set and light, test on camera, and justify the changes."], [["How can costume show a character’s change over a story?", "By changing colour, fit, condition or style at key moments."], ["Why consider fabric for sound and lighting?", "Noisy or reflective fabrics can cause rustle in the sound and glare or colour problems on camera."]], "nBe", "Design costumes for two characters in a scene using only colour, silhouette and fabric. Show photographs to three people and ask what they think of each character. Predict their answers first.", []], ["Fittings", "A fitting checks that a costume fits, moves and looks right on the actor before the shoot. Never assume something will fit.", "You can run a respectful fitting and fix problems early.", ["Every costume should be tried on by the actor before the shoot, with time to alter it. At a fitting, check fit and comfort, movement (can they perform the action, sit, run or fight?), how it looks on camera, the colour with their skin tone, the underlayers and the sound it makes. Photograph the final look from several angles for the continuity record. Take measurements and note any alterations.", "Be respectful of people’s bodies and privacy: fit in a private space, agree who is present, ask before touching, and keep conversation professional. Let the actor share how they feel in the costume. Plan the fitting schedule early, because actors’ availability and alteration time can be short. Check multiples for action or messy scenes, and costume changes during the day. Agree repairs, cleaning and washing."], ["I can say what a fitting is for.", "I can explain what to check and why privacy and consent matter.", "I can run a fitting, record measurements and photographs, and note alterations.", "For a film I can plan fittings, predict where problems will arise, test the process, and justify what I do about problems."], [["Why check movement during a fitting?", "The actor may need to sit, run or fight in it, and a costume that restricts them will affect the performance."], ["What privacy points matter at a fitting?", "A private space, only the necessary people, asking before touching, and professional conversation."]], "nBs", "Run a fitting for one actor with a costume checklist (fit, movement, sound, colour on camera) and photographs. Predict the biggest problem, then record what you found.", []], ["Costume continuity", "Costume has to be the same in every shot of a scene, and different in the right ways between scenes. It needs a record system.", "You can build and run a costume continuity system.", ["Costume continuity means each character wears the same items, worn the same way, within a scene and across the film where the story requires it. The system starts with a <b>costume breakdown</b>: each character’s looks listed by scene and day, with numbered looks (Look 1, Look 2) and details of how each is worn (sleeves rolled, buttons open, jacket on or off). Photographs are taken at each setup (see continuity photography), with notes on dirt, damage and changes during the scene.", "Label and bag each costume by character and look, and keep multiples where needed for dirt, damage or repeated takes. Plan for washing and drying between days. Share the plan with the script supervisor and the hair and make-up team. Check with the director before each day. A wardrobe supervisor or costume assistant on set maintains it between takes. Errors are often noticed by viewers, and difficult to fix in post."], ["I can say what a costume breakdown is.", "I can explain what is recorded and why multiples may be needed.", "I can build a costume continuity chart and photograph looks for a scene.", "For a film I can plan costume continuity across a schedule, predict where it will break, test it on a practice shoot, and justify the system."], [["What is a numbered look?", "A defined costume state for a character in particular scenes, such as Look 1, recorded with details of how it is worn."], ["Why get multiples for some costumes?", "They may become dirty or damaged, or be needed for repeated takes."]], "nqs", "Build a costume continuity chart for one character over four scenes and photograph two looks. Predict which detail will be forgotten between setups, then run a shoot and check.", []], ["Costume budget", "Costume costs more than the price of the clothes. A budget has to include altering, cleaning, multiples, hire and returns.", "You can budget costume realistically and manage spending.", ["A costume budget starts with the breakdown: every look for every character, including extras, multiples and changes. Costs include <b>purchase</b>, <b>hire</b> (per day, with deposits and damage charges), <b>making</b> (fabric, labour), <b>alterations</b>, <b>dyeing and ageing</b>, <b>cleaning and laundry</b>, accessories (shoes, jewellery, underlayers), storage and transport, and returns. Costs rise when something must be duplicated for dirt or damage.", "Save money by borrowing, using charity shops and online marketplaces, using the actor’s own clothes where suitable (with permission and care), and concentrating the budget on the main characters and what is seen clearly. Keep receipts and a running total against the budget, and ask whether each item is seen. Plan the end: return hired items clean and on time, and decide what to do with bought items. Keep a contingency because actors’ fit and damage always add cost."], ["I can name the costs in a costume budget.", "I can explain why multiples, cleaning and returns add cost.", "I can build a costume budget from a breakdown with low and high estimates.", "For a film I can budget costume, predict where it will overrun, test against real quotes, and justify the savings I choose."], [["Name three costs besides buying clothes.", "For example hire fees and deposits, alterations, cleaning and multiples."], ["Where is it sensible to spend more?", "On the main characters and what is seen clearly on camera."]], "nph", "Create a costume budget from your breakdown with a low and a high figure. Get real prices for three items and predict the biggest gap, then compare.", []], ["Hair and make-up basics", "Basic hair and make-up for screen means making people look like themselves, well lit and consistent, and keeping them comfortable and safe.", "You can prepare an actor for camera with good basics and good practice.", ["Make-up for camera is mostly subtle: matching foundation to skin tone, controlling shine (powder, blotting), tidying and defining brows and eyes as needed for the character, and giving a natural look. Modern high-resolution cameras show detail, so skin preparation and blending matter. Hair needs to be neat, styled for the character and the period, and secure, with continuity in mind. The look should suit the character and the lighting.", "Good practice includes working with clean hands and tools, using single-use applicators or sanitising kit between people, asking about allergies and sensitive skin (and patch testing where appropriate), asking before touching, respecting skin tones and hair types with products and knowledge suited to them, and working with the actor to be comfortable. Keep a basic kit on set for touch-ups between takes. Tell the DP about your look, since light affects it. See the Cinematography domain on lighting for different skin tones."], ["I can say what make-up for screen mainly does.", "I can explain why skin preparation, shine control and hygiene matter.", "I can prepare an actor for camera with matched foundation, shine control and neat hair, and do it safely.", "For a film I can plan hair and make-up for each character, predict how the camera and light will show it, test on camera, and justify choices including for different skin tones."], [["Why match foundation to skin tone?", "So the face looks natural and consistent on camera, and doesn’t look masked or mismatched with the neck and hands."], ["Why ask about allergies before using products?", "Reactions can be serious, so you should know and patch test where appropriate."]], "ny", "Prepare an actor for camera with simple make-up, then photograph them in two lighting setups. Predict where shine and colour problems will show, then compare and adjust.", []], ["Character looks", "Hair and make-up help to create a character: age, health, class, personality and the story’s changes.", "You can design looks for characters and explain what each choice says.", ["A character look is more than appearance: hair length, style and condition, skin and make-up, facial hair, scars and details tell the audience about age, class, health, habits, culture and how a character feels about themselves. Looks can change through the story: tiredness, illness, success, a decision to change. The look must fit the period and the world of the film.", "Research references, make a mood board and a look for each character and each stage of their arc, then discuss with the director, costume and the actor. Consider practicalities: how long it takes to apply each day, how it holds up under lights and for long days, whether it can be done in a schedule, and how it appears on camera and in different lighting. Test the looks with the DP before shooting. Keep the continuity plan from the start."], ["I can say what hair and make-up can tell us about a character.", "I can explain how a look can change across a story.", "I can design looks for two characters with references and reasons.", "For a film I can plan looks through each arc, predict their time and cost, test on camera, and justify the changes."], [["Name two things hair and make-up can say about a character.", "For example age, class, health, habits or mood."], ["Why test looks on camera?", "They may look different under lights and lenses, so the choices must be checked."]], "nBs", "Design three looks for one character (start, middle, end of the story). Photograph tests and ask someone to put them in order. Predict whether they will, then check.", []], ["Hair and make-up continuity", "Hair and make-up must look the same across takes and setups, and change correctly between scenes. Records and photographs make it possible.", "You can maintain hair and make-up continuity through a shoot.", ["Every visible detail matters: hair parting, length, style and tightness, products, make-up colours, facial hair, nails, jewellery, tan lines, and any marks, cuts or bruises. Within a scene it should stay consistent, apart from the changes the story calls for (sweat, tears, messed hair). Across the film, it needs to track the story’s timeline, which may not be the shooting order.", "Take photographs at each setup (front, both sides and back), write notes on products and steps, and keep a chart by character, scene and day. Check against the previous setup before each take, and touch up between takes and after breaks. Share the records with the script supervisor and the costume team. If a look takes a long time (wounds, ageing), plan the schedule and the call times with the 1st AD. Follow safe, skin-friendly practice in recording and removal."], ["I can say what hair and make-up continuity covers.", "I can explain why photographs from several angles and a chart are needed.", "I can keep a continuity chart and photographs for a character through a scene.", "For a film I can plan continuity across a schedule with time-consuming looks, predict where it will fail, test on a practice shoot, and justify the system."], [["What photographs are needed for hair continuity?", "Front, both sides and back at each setup."], ["Why tell the 1st AD about time-consuming looks?", "They affect call times and the schedule."]], "nqs", "Shoot a short scene with an actor whose hair and make-up change slightly (sweat, messed hair). Keep a chart and photographs, then cut it and predict where a mismatch will show.", []], ["Basic effects", "Basic make-up effects such as cuts, bruises, ageing and blood can be done safely with simple methods, and need careful safety practice.", "You can create simple effects safely and convincingly, and know when to stop and get a specialist.", ["Simple effects include bruises and scrapes made with cream colours or palettes, small cuts made with scar wax, stage blood and sweat or tears made with products suitable for skin. Ageing and tiredness can be created with shading and powder. Camera closeness and lighting decide how much detail is needed, and effects should match the story’s timeline (a bruise changes colour over days).", "Use only skin-safe, cosmetic-grade products, follow the instructions, patch test for allergies, keep tools clean, and never use anything that could harm eyes, mouth or skin. Get the actor’s agreement to each effect, and remove properly with suitable products. Stage blood can stain costumes and sets, so plan for protection and cleaning. More advanced work (prosthetics, special effects, anything involving heat or chemicals) needs a specialist and your institution’s approval. Check your institution’s guidance first."], ["I can name some simple make-up effects.", "I can explain why skin-safe products, patch tests and consent matter.", "I can create and remove a simple injury effect safely and photograph it.", "For a film I can plan effects through the story timeline, predict how they will read on camera, test, and justify when I would hand over to a specialist."], [["Why patch test products?", "To check for allergic reactions before applying them to the face or body."], ["When should you bring in a specialist?", "For prosthetics, heat, chemicals or any effect that could cause harm, following institutional rules."]], "nyJ", "Create a simple bruise and a small cut on a volunteer with skin-safe products. Photograph under the planned lighting, predict which will look fakest on camera, then check and remove safely.", []], ["Art budget", "The art budget covers everything the art department spends, and has to be built from the design breakdown and managed daily.", "You can build, manage and defend an art department budget.", ["An art budget is built from the design breakdown with a line for each category: set building (materials and labour), dressing and props (purchases and hire), graphics, costume, hair and make-up, location and set fees, transport and storage, consumables, returns and contingency. It starts with an estimate, then uses real quotes and prices, and is reviewed against the producer’s overall figure.", "Spend where the camera sees: a hero prop in close-up or a backdrop in many shots deserves more than something seen for a second. Look for cheaper routes (borrowing, making, hiring, reusing) and compromises in agreement with the director. Keep receipts and a running total, report spending to the producer regularly, and warn early if it is going over. Include costs of returning and striking, and hold a contingency. A good budget helps you say what you can and cannot do."], ["I can name the main categories of an art budget.", "I can explain why it is built from the breakdown and where to spend.", "I can build an art budget with estimates and real prices and track spending.", "For a film I can budget art, predict where it will overrun, test it against quotes, and justify spending decisions to the director and producer."], [["Why spend more on items seen in close-up?", "The audience will see them clearly, so quality shows."], ["Why warn the producer early if you are over budget?", "They need time to find savings or funds, and surprises damage trust."]], "hnp", "Build an art budget for three scenes with a line for each category and price three items. Predict which category will overrun, then track spending through a mock shoot.", []], ["Sourcing schedule", "A sourcing schedule lists when each item is needed, and works backwards to when it must be ordered, made or hired.", "You can build a sourcing schedule that gets everything to set on time.", ["Every item has a date it must be on set. Working backwards from the shooting schedule, a <b>sourcing schedule</b> shows when to order or start making it, how long hire or delivery takes, when it must be fitted or tested, when it is dressed, and when it must be returned. Builds, fittings, dressing days and strike days appear on it too. Long-lead items (made to order, hired from afar, requiring approval or specialist work) go first.", "Share it with the producer and 1st AD so the shoot schedule and the art plan agree: for example, a dressing day before the shoot, or time between two scenes at one location to change the set. Update it when the schedule changes. Give yourself slack for delays and failures. Check progress weekly, and mark what is confirmed, ordered and delivered. Record return dates to avoid late charges."], ["I can say what a sourcing schedule shows.", "I can explain why we work backwards and which items go first.", "I can build a sourcing schedule from a breakdown and shooting schedule.", "For a film I can plan sourcing, predict where it will slip, test it through weekly checks, and justify the order and slack."], [["Which items should be started first?", "Long-lead items: made to order, hired from afar or needing approval or specialist work."], ["Why share the sourcing schedule with the 1st AD?", "So the shoot schedule allows for dressing and set changes."]], "npf", "Make a sourcing schedule for the ten most difficult items in your film, with order, delivery, fitting, dressing and return dates. Predict which will slip, then check weekly.", []], ["Dynamic between cinematography and production design", "The DP and the production designer both shape what the camera sees, and the best images come from them planning together.", "You can work with the DP so design and lighting support each other.", ["The production designer builds and dresses the world, and the DP photographs and lights it, so each affects the other. Colour and texture choices change how light behaves and how the camera renders the image, set walls and ceilings limit where lights and cameras can go, and practical lights need agreement. Surfaces can cause unwanted reflections, and depth, layers and negative space affect the frame.", "Meet early and often: share the design bible and look book, agree the palette and key textures, talk about what the camera will see, and visit locations together. Ask the DP about camera positions, lenses, sightlines, ceilings, practicals and problem surfaces. Test materials and colours on camera. Give the DP room to light, with wild walls and clear lamp positions, and expect them to tell you what the light will do to your work. Resolve conflicts in terms of what the story needs. See the Cinematography role for the camera and lighting side."], ["I can say that design and cinematography affect each other.", "I can explain what the two need to agree on.", "I can run a joint planning meeting with a DP about a set and note decisions.", "For a scene I can plan with a DP, predict conflicts, test on camera, and justify the compromises."], [["Name two things a designer and DP must agree on.", "For example palette, practicals, reflective surfaces, set access and ceilings."], ["Why test materials on camera together?", "So both can see how colour, texture and reflection actually look under the planned light."]], "nBL", "Plan a scene with a cinematography student, covering palette, surfaces, practicals and set access. Predict one conflict, then test it on camera and agree a solution.", []], ["Working with the director", "The designer’s job is to realise the director’s vision, and to bring ideas and constraints to it. This takes a clear brief and honest conversations.", "You can present design ideas to a director, listen and adapt, and agree decisions.", ["The designer presents a vision for each environment: palette, texture, dressing approach and any builds, with a mood board and a design document per location that shows what will be added, removed or changed from the real space. Design is world-building, not decoration. The director responds to what the story needs, and the conversation shapes the design.", "Prepare well, show images and plans, explain your reasons in terms of the story, and be honest about cost, time and what is possible. Listen to the director’s priorities and ask questions. Offer options at different costs. Agree decisions in writing, and keep the director updated as things change. Be ready to adapt, but also to say what a change will cost. Work with the DP so a consistent message reaches the director. See the Directing role."], ["I can say what a designer presents to a director.", "I can explain why explanations should be in terms of the story and cost.", "I can present a design for one location with a mood board and a document, and take feedback.", "For a film I can plan the design conversations, predict objections, test them in a mock meeting, and justify what I hold to and what I change."], [["Why explain design choices in terms of the story?", "The director’s decisions depend on what the story needs, not on style alone."], ["Why offer options at different costs?", "It lets the director choose with an understanding of the trade-offs."]], "nKm", "Present a design for one location to a director student with a mood board and plan. Predict their first objection and a question about cost, then record what they actually raised.", []], ["Working with continuity", "Art, costume and make-up depend on the script supervisor’s notes and photographs, and the script supervisor depends on you to keep things the same.", "You can work with the continuity team so that looks and details match across shots.", ["The script supervisor is responsible for the accuracy, consistency and completeness of what is captured, and takes continuity photographs and notes at each setup. The art, costume and make-up teams keep their own records and track props, dressing, costume and looks. Each depends on the other’s notes, and conflicts or gaps cause errors.", "Meet before the shoot to agree systems: who photographs what, how looks and props are numbered, what to share each day, and how to handle changes. On set, tell the script supervisor about anything changed or consumed, and check their notes against your records. Protect hot sets and reset between takes. Share the daily record at wrap. Work as a team: the common aim is that the film looks consistent without a reshoot. See the Script Supervision role."], ["I can say what the script supervisor records that affects art and costume.", "I can explain why shared systems and daily sharing are needed.", "I can agree a continuity system with a script supervisor for props and looks.", "For a film I can plan the working system, predict where records conflict, test on a practice shoot, and justify how I resolve differences."], [["Who takes continuity photographs, and who keeps department records?", "The script supervisor takes continuity photographs and notes, and each department also keeps its own records."], ["Why meet before the shoot to agree continuity systems?", "So numbering, photographs and sharing are clear before problems arise."]], "nqb", "Agree a continuity system with a script supervisor for one scene (props, costume, hair). Shoot it across two setups, and predict one discrepancy between your records and theirs, then compare notes.", []]];
