['HMI','HMIs are daylight-balanced (about 5600K) arc lamps that give far more light per watt than tungsten, but need a ballast, warm-up time and careful handling.','You can explain what makes HMIs different from tungsten and LED, and handle their flicker and safety issues.',['HMI stands for hydrargyrum medium-arc iodide. It is an arc lamp, not a filament, and gives about 5600K, daylight-balanced light with several times the output of tungsten for the same wattage. That is why HMIs are the traditional way to match or overpower daylight, through windows or on exteriors. Units range from about 200W to 18K, and the larger ones are very powerful.','HMIs need a ballast to start and regulate the arc, take a few minutes to reach full output and colour, and must usually cool before they can restrike. Magnetic ballasts pulse with the mains and can cause visible flicker at some shutter angles and frame rates, especially at high frame rates, so flicker-free electronic ballasts are used for film work. HMIs also emit ultraviolet light, so the lens glass must always be in place and no one should look into the lamp. They can’t be dimmed with ordinary dimmers without colour shifts, so control output with scrims, nets, flags and distance, and expect colour to drift as the lamp ages. Ballasts and head cables add to setup and weight.'],
['I can say what an HMI is and its colour temperature.','I can explain how it works, why it needs a ballast, and what makes it different from tungsten.','I can set up an HMI safely, handle warm-up and restrike, and avoid flicker with the right ballast, frame rate and shutter.','For a scene I can decide whether an HMI is the right light, predict its output, colour and flicker behaviour, test it, and justify the choice including safety.'],
[['Why are HMIs commonly used to balance with daylight?','They are daylight balanced (about 5600K) and give a lot of light for their power, so they can match or overpower sunlight through windows.'],['What causes HMI flicker, and how do you avoid it?','A magnetic ballast pulses with the mains, which can clash with the shutter angle and frame rate, especially at high frame rates. Use a flicker-free electronic ballast, or a safe frame rate and shutter combination.']],'LG','If you have access to an HMI, film it at several frame rates and shutter angles, with a flicker-free ballast and (if available) a magnetic one, looking for flicker. If not, compare HMI data sheets and write a plan for lighting a window from outside. Follow all safety rules: lens in place, never look into the lamp, and work under supervision. Predict where flicker will appear first.',[['read','foundational','Brown, Cinematography: Theory and Practice','pp.244-262 on the types of light, as cited in the course slides'],['read','deeper','HMI manufacturers’ data sheets and guides','Search: “HMI flicker free ballast frame rate”']]],
['LED (panels, tubes, COB)','LEDs are efficient, cool-running, controllable lights, made as panels, tubes, mats, COB points and more. Quality varies widely.','You can choose the right LED for a job and test it before you trust it.',['LEDs (light-emitting diodes) are now the most common film lights. They run cooler than tungsten or HMI, use far less power, often run on batteries, dim without changing colour much, and can change colour: bi-colour units adjust between warm and cool, and RGB or RGBWW units can make almost any colour. Common form factors are panels (flat, spread-out, soft light), tubes (long, good for practicals and edges), mats (flexible), open-faced units, Fresnel-style LED lights, and COB (chip-on-board) units, which are small and point-like and are used with a reflector, softbox or other modifier, often on a Bowens mount.','The weakness is quality. Cheaper LEDs can have a spiky spectrum and poor colour rendering, a green-magenta shift that needs correcting, flicker when dimmed at certain shutter speeds or frame rates, and multiple shadows from a panel made of many small emitters. Check the CRI or TLCI and spectrum data, and test the light on skin and colour with your own camera (see Colour rendering and spectrum). Smaller units can’t match the output of an HMI for daylight work, though large modern units are closing the gap.'],
['I can name some LED form factors and their main advantages.','I can explain bi-colour and RGB, and the problems cheap LEDs can have.','I can set up and control an LED light, correct a green-magenta shift, and check it for flicker and shadows.','I can test several LEDs on skin, colour and camera, predict where each will fail, compare them, and justify a choice including output, battery and cost.'],
[['Name three advantages of LEDs over tungsten.','Cooler running, much more energy efficient, and adjustable colour. Many also run on batteries.'],['Why test an LED before relying on it?','Spectrum quality, green-magenta shift, flicker and shadow behaviour vary between models, so test on skin tones and colour with your own camera.']],'LG','Compare a bi-colour LED at 3200K and 5600K and, if possible, a cheaper and a professional LED. Shoot a colour chart and a face, check for a green-magenta shift, flicker when dimmed at high shutter speeds, and the shadows from the source. Predict the differences first.',[['read','foundational','Brown, Cinematography: Theory and Practice','pp.244-262 on the types of light, as cited in the course slides']]],
['Fresnels and open-faced lights','A Fresnel has a stepped lens that lets you focus the beam from narrow and intense to wide and softer. An open-faced light has no lens, so it is brighter and rougher.','You can choose between Fresnel and open-faced lights and use the focus and accessories to shape the beam.',['A Fresnel light puts a stepped lens in front of the lamp. By moving the lamp toward or away from the lens you focus the beam: spotting gives a narrow, more intense, harder beam, and flooding gives a wider, less intense, slightly softer one. Fresnels give clean, controllable, hard-edged light and take accessories such as barn doors, scrims and gel frames. They come in tungsten, HMI and LED versions, and shaping the beam this way is one of the main ways light is controlled, alongside cutting, absorbing, diffusing and bouncing it.','An open-faced light has no lens. It is lighter, gives more output from the same lamp and can flood more widely, but the beam is less even and harder to control, so it is often used bounced or through diffusion. Barn doors shape the edges of a beam, and snoots and grids can narrow it further. Both types get very hot, so allow safe distances, gloves and cooling time.'],
['I can say what a Fresnel is and that it can be spotted and flooded.','I can explain what spotting and flooding do to the beam and how an open-faced light differs.','I can set up a Fresnel, adjust its focus and barn doors, and choose between Fresnel and open-faced for a job.','For a scene I can choose and position fixtures for beam quality and control, predict the shadow edges and exposure, test them, and justify the choice.'],
[['What happens to a Fresnel’s beam when you spot it versus flood it?','Spotted: narrower, brighter and harder. Flooded: wider, dimmer and a little softer.'],['Why might you bounce or diffuse an open-faced light?','It has more output but a less even, less controllable beam, so bouncing or diffusing it uses the power while making the light more even and soft.']],'BLG','Shoot a subject lit by a Fresnel spotted, then flooded, at the same distance, and read the exposure and shadow edges. Then bounce an open-faced light off a white card and compare. Predict first.'],
['Soft sources','Soft sources are large lights, or lights made large with diffusion or bounce, that give soft, wrapping light with gentle shadows.','You can choose and place soft sources, and control their spill.',['Softness comes from a source being large relative to the subject (see Hard and soft light). Soft sources include softboxes (a box with a diffusion front, often fitted with a grid), lanterns or China balls (spherical diffusers), LED panels, fluorescent tube units such as Kino Flo, large frames of diffusion, and light bounced off a large surface. They flatter faces, lower the contrast ratio and are forgiving of movement. Placed close to the subject they are softest but also give the steepest falloff.','The trade-offs are control and size. Soft light spills and is hard to cut, so it needs flags, grids (egg crate), skirts or negative fill to stop it flooding the room. Big soft sources are bulky, catch wind outdoors, and can be hard to position without appearing in shot. For safety, keep lanterns and fabric away from hot tungsten bulbs (use LED or rated lamps), and make sure anything rigged overhead is secured and rated for its weight.'],
['I can say what makes a light soft.','I can name several soft sources and explain the trade-offs of using them.','I can set up a soft source and control its spill with a grid or flags.','For a scene I can choose between soft sources, predict their softness, falloff and spill, test them, and justify the choice.'],
[['What makes a light source soft?','Being large relative to the subject, such as a softbox, diffusion frame, bounce or lantern, used close.'],['Name two ways to control spill from a soft source.','A grid (egg crate), flags, a skirt or negative fill.']],'BLG','Light a face with a bare source, then through a softbox or diffusion frame, then bounced, at the same distance. Compare the shadow edges and read the contrast ratio. Then add a grid or flag to control the spill. Predict first.'],
['Wireless and DMX control','DMX and wireless systems let you control a light’s brightness, colour and effects remotely, from a console, app or desk.','You can set up and troubleshoot remote lighting control, and plan it before the shoot.',['DMX512 is the industry-standard digital protocol for lighting control. A controller sends data in “universes” of 512 channels to fixtures along a daisy chain of cables (usually 5-pin or 3-pin XLR). Each fixture is set to a start address and a mode, which decides how many channels it uses (for example for intensity, colour temperature and effects). Wireless DMX sends the same data by radio, and many modern lights use Bluetooth or app control, such as Aputure’s Sidus Link app, or their own wireless systems, so you can change intensity, colour and effects from a phone or tablet without touching the light.','Control helps in several ways: dimming and colour changes without a ladder, adjusting a rig that is high or hidden, building cues, and creating effects such as flicker, fire, TV glow or lightning. Common problems are addressing mistakes (two fixtures on the same address, or overlapping channels), the wrong mode, a break in the daisy chain, radio interference or limited range, lag, and dropped app connections. Plan the addresses on paper, label fixtures, test before the shoot and have a fallback. Wireless systems also raise the radio interference concerns covered in Cross-Department Awareness.'],
['I can say what DMX and wireless lighting control are for.','I can explain universes, channels, addresses and modes.','I can set addresses and modes for several lights and control them from a desk or app.','For a scene I can design a control plan, predict where it could fail, test it, and justify the choices including a fallback.'],
[['What do a DMX address and mode tell a fixture?','The address is the first channel it listens to, and the mode sets how many channels it uses and what they control.'],['Give two common problems when setting up DMX or wireless lighting control.','Duplicate or overlapping addresses, the wrong mode, a broken chain, and radio interference or dropped connections.']],'GH','Control two LED lights from one controller or app. Assign addresses and modes, then build a simple cue (change from 3200K to 5600K over ten seconds) and a flicker effect. Record your address plan and anything that went wrong. Predict first.',[['read','deeper','Lighting control manufacturers’ guides','Search: “DMX512 basics addressing universe”']]],
['Flags and negative fill','Flags block light to control where it falls, and negative fill absorbs light to deepen shadows and raise contrast.','You can use flags and negative fill precisely, predict their effect on shadow edges, and choose when to remove light instead of adding it.',['A flag is a solid, usually black, panel (cloth on a frame, or a rigid card) placed between a light and the scene to cut light from part of it: to stop spill onto a wall or lens, shape a pool of light or control the sun. They come in many sizes and shapes, including small flags, large frames, cutters, fingers and dots (thin or round flags for precise cuts) and “floppies” with a hinged flap. Flags are also used to keep light off the lens, which would cause flare, a job shared with the matte box. In the UK modifiers are usually the lighting department’s remit, while in the US they usually sit with the grip department.','Negative fill uses black material (flags, black cloth or boards) placed beside the subject to absorb light that would otherwise bounce back, which deepens the shadow side, raises the contrast ratio and adds shape. It is the “fill” of the Framework’s Lighting Triad, and it is how you get contrast in a bright room full of bounced light. Distance matters: a flag close to the subject gives a sharper shadow edge, one close to the light gives a softer edge, and a larger or softer light softens the edge further. Always secure flags with stands and sandbags, because large frames act as sails in wind.'],
['I can say what a flag does and what negative fill is.','I can explain how flags and negative fill change the light and how distance affects the shadow edge.','I can use flags to cut spill and negative fill to deepen shadows, and judge the result with a meter or false colour.','For a scene I can plan the flagging and negative fill, predict the contrast ratio and shadow edges, test them, and justify what I removed and why.'],
[['What is the difference between fill and negative fill?','Fill adds light to the shadow side. Negative fill removes light by absorbing it with black material, which deepens shadows and raises contrast.'],['How does the distance of a flag change its shadow edge?','Closer to the subject gives a sharper edge, closer to the light gives a softer edge.']],'BLF','Light a face with a window or lamp and record the contrast ratio. Add a black flag beside the shadow side, then flag the key from different distances. Read the changes with a meter or false colour and note the shadow edges. Predict first.'],
['Nets and scrims','Nets and scrims reduce a light’s intensity without changing its quality or colour, in measured amounts.','You can use nets and scrims to control exposure without the side effects of dimming.',['A scrim is a wire mesh fitted inside a light’s holder: a single scrim cuts roughly half a stop and a double roughly a stop, and half scrims reduce only part of the beam. A net is a mesh cloth on a frame, placed in front of a light or window in a range of strengths. Because they reduce light without softening it, they lower output without changing how hard or soft the light is.','This matters because dimming has side effects. Tungsten shifts warmer when dimmed, HMIs on standard ballasts can’t be dimmed, and some LEDs flicker. Nets and scrims reduce output while keeping the colour and quality, and they help match lights to each other or balance a window. A net can also be used to cut just part of a light, giving a soft-edged reduction. Nets and scrims are rated in stops, so check the marking.'],
['I can say what a net and a scrim do.','I can explain why they’re used instead of dimming and what they don’t change.','I can reduce a light with a net or scrim and measure the change in stops.','For a scene I can plan the control of several lights with nets and scrims, predict the stop changes, test them, and justify the choices.'],
[['Why use a scrim instead of dimming a tungsten light?','Dimming makes tungsten warmer. A scrim reduces intensity without changing colour or quality.'],['What does a half scrim do?','It reduces only part of the beam, so you can balance exposure across a subject or between foreground and background.']],'BLG','Read a light’s output at full, then with a single scrim, a double scrim, a net on a frame, and dimmed. Compare the colour temperature and brightness each time. Predict the stop loss first.'],
['Diffusion','Diffusion material in front of a light makes the source larger and softer, at the cost of some light.','You can choose and place diffusion to get the softness you want and compensate for the light it loses.',['Diffusion frames (silks, muslin, grid cloth, translucent plastic sheets) are placed in front of a light, or between a light or the sun and the scene, to soften it by making the effective source larger. Different materials have different strengths and character: some soften slightly, others turn a source almost fully soft, and some, such as muslin, add a warm tint. Frames come in standard sizes, such as 4×4, 6×6, 8×8 and 12×12 feet, and larger overhead frames.','As a rule of thumb, the closer the diffusion is to the subject (and the farther from the light), the softer the result, as long as the light spreads evenly across it. Close to the light it softens little. All diffusion loses light, by amounts the manufacturer states, so compensate. Heat can burn diffusion on hot lights, so use rated materials and keep distance, and large frames need sandbags or secure stands. Diffusion on the light is different from diffusion filters on the lens: this changes the light itself, not the image after the lens.'],
['I can say what diffusion does to a light.','I can explain why it softens, how distance changes the effect, and that it loses light.','I can rig a diffusion frame, judge its softness, and correct the exposure for its loss.','For a scene I can choose the diffusion material and position, predict the softness and light loss, test it, and justify the choice.'],
[['Why does diffusion soften light?','It makes the effective source larger relative to the subject.'],['How does the distance between diffusion and subject change the softness?','Closer to the subject gives softer light, provided the diffusion is evenly lit. Moving it near the light softens little.']],'BLG','Light a face with a bare hard light, then through diffusion at three distances (near the light, middle, near the subject). Read the exposure loss and compare the shadow edges. Then try two materials of different strengths. Predict first.'],
['Bounce and reflect','Bouncing light off a matte surface makes a bigger, softer source. Reflecting off a shiny one redirects light with more punch.','You can choose between bounce and reflect and use each to shape and fill light without power.',['Bounce means redirecting light off a surface to make a larger, softer source. Common bounce surfaces are white foamcore or polyboard, bounce boards and cloth (muslin, ultrabounce), walls and ceilings. A bounce is cheap, fast and uses no power of its own, and the colour of the surface tints the result (a cream wall warms the light), so choose the surface carefully.','Reflect means using a shiny surface to throw light more precisely: silver and gold reflectors (including collapsible five-in-one discs), mirror boards and shiny boards. Reflectors are especially useful outdoors, where they redirect sunlight into shadows without power, and a mirror can send a hard beam a long way. The sun moves, so a reflector needs constant adjustment or an assistant. Reflected light is harder and more intense than bounced light and can be softened with diffusion. Both spill, so control them with flags and negative fill.'],
['I can say what bounce and reflect mean.','I can explain the differences and the effect of the surface colour.','I can bounce or reflect light into a face or shadow side and judge the result.','For a scene I can choose bounce or reflect surfaces, predict their softness, intensity and colour, test them, and justify the choice including the power I saved.'],
[['What is the difference between bounce and reflect?','Bounce uses a matte surface to make a larger, softer source. Reflect uses a shiny surface to redirect light with more intensity and direction.'],['Why must you watch the colour of a bounce surface?','The surface tints the light, so a coloured wall or cream card changes the colour of the light that reaches the subject.']],'BLG','Light a face by bouncing a lamp off a white card and off a coloured wall, then by reflecting a lamp or the sun with a silver reflector. Compare the softness, intensity and colour of each and read the exposure. Predict first.'],
['Gels (CTO, CTB, corrective)','Gels are coloured filters placed over lights or windows to change their colour, correct a mismatch, or reduce brightness.','You can choose and combine gels to match or contrast light sources, and know what each costs in light.',['Gels are thin, heat-resistant coloured plastic sheets (from makers such as Lee Filters and Rosco), fitted in front of lights, on windows or over practicals. CTO (colour temperature orange) warms daylight toward tungsten, so a full CTO turns about 5600K light into about 3200K. CTB (colour temperature blue) does the opposite, turning tungsten into daylight. Both come in strengths, such as full, 3/4, 1/2, 1/4 and 1/8, for partial shifts. Corrective gels such as plus green and minus green adjust the green-magenta balance, to match or neutralise fluorescent or LED sources. ND gel reduces brightness without changing colour and is often used on windows.','Gels cost light: a full CTB on tungsten loses roughly one and a half to two stops, which is why HMIs are used for daylight-balanced work (check the manufacturer’s data for exact values). Gelling a window with CTO and balancing the camera for tungsten, or gelling a lamp with CTB to match the window, are the standard answers to mixed colour temperatures. Heat can burn or fade a gel on a hot light, so use heat-resistant gels, support them well, and replace faded ones. With bi-colour and RGB LEDs you can often dial colour in without gels, but gels still help correct green-magenta and match other sources. Always confirm the result with the camera’s white balance and on the monitor.'],
['I can say what a gel is and name CTO and CTB.','I can explain what each gel does, the strengths available, and that gels cost light.','I can gel a light or window to match another source and set the white balance to suit.','For a scene I can design the gel scheme, predict the colour result and light loss, test it, and justify what I corrected and what I left.'],
[['A tungsten lamp needs to match daylight from a window. Which gel, and what does it cost?','CTB, which converts 3200K toward 5600K, at a cost of roughly one and a half to two stops for a full strength.'],['What are plus green and minus green gels for?','To correct the green-magenta balance, for example to match a fluorescent source or neutralise its green cast.']],'BLG','Light a scene with a tungsten lamp and a window. Photograph it with white balance on daylight, then with a CTB on the lamp, then with a CTO on the window and white balance on tungsten. Compare the colour and measure the light lost to each gel. Predict first.',[['read','foundational','Lee Filters and Rosco gel swatch books','Search: “Lee Filters swatch book”, “Rosco Cinegel”']]],
['Power calculation and load','Every light draws power, and the circuit supplying it has a limit. Load calculation is adding up the draw and checking it fits.','You can work out what a lighting plan will draw, check it against the supply, and recognise a plan that is unsafe.',['Electrical load is the power drawn by everything on a circuit. The basic relationship is watts = volts × amps, so amps = watts ÷ volts. On UK mains (about 230V) a 650W light draws about 2.8A, a 1K about 4.3A, a 2K about 8.7A, a 5K about 22A and a 10K about 43A. Add the loads of everything on a circuit, and keep the total comfortably below its limit, often by leaving a margin of around 20%, because circuits run hot near their maximum.','Limits come from the whole chain, not just the wall socket. A standard UK 13A plug is limited to about 3kW, and a household socket circuit is protected at a limit shared with everything else on it, such as a kettle or heater in another room. LEDs draw far less than tungsten or HMI for the same light output, which is one reason they dominate small sets, and large lights can also have an initial surge when switched on. Work out the plan in advance, check the rating plate on each unit rather than guessing, and find out what supply the location actually has. On larger shoots this is the job of the gaffer and best boy, working with qualified electricians.'],
['I can say that power is watts, volts and amps and that circuits have limits.','I can convert watts to amps on UK mains and add up the load of a group of lights.','I can build a simple power plan for a lighting setup, check it against the circuits available, and leave a sensible margin.','For a location I can plan power for every light and accessory, predict where a circuit would overload, redesign the plan to fix it, and justify the choices including the safety margin.'],
[['What current does a 2K tungsten light draw on UK mains?','About 8.7A (2,000W ÷ 230V).'],['A single socket circuit has a 13A plug limit. Can you safely run two 2K lights from it?','No. Two 2K lights draw about 17A, which is more than a 13A plug can carry. Use separate circuits, lower-power lights such as LEDs, or proper distribution from a qualified person.']],'BHJ','Take a lighting plan for a scene (a key, a fill, a back light and two practicals) with the wattages from the rating plates. Convert each to amps, add up the load, and work out how many circuits you need with a safe margin. Then redo the plan with LEDs and compare. Do not test by overloading anything. Predict the difference first.'],
['Distribution and cabling','Distribution is how power gets from the supply to each light safely. It uses rated cables, distribution boxes and protection devices.','You can plan and check a distribution and cabling layout, and keep it safe for the people working around it.',['Power usually reaches a lighting setup through a chain: the supply (a mains outlet, a larger tie-in, or a generator), distribution boxes (distros, often called spider boxes) that split it into several protected outputs, and cables to each light. Industrial plugs and sockets are colour-coded for their voltage, such as blue for 230V and red for 400V three-phase. Different sizes (such as 16A, 32A and 63A) show the current they are designed for. Extension reels, cable runs and adaptors must all be rated for the load they carry.','Good practice is simple and important. Check cables and plugs for damage before use, and don’t use anything that looks damaged. Fully uncoil cable reels under load, because coiled cable can overheat. Don’t overload extension leads, and don’t daisy-chain extensions. Keep connections and distribution boxes dry and off wet ground. Protect circuits with RCDs (residual current devices), and tape, ramp or cover cables across walkways so nobody trips or crushes them. Keep cables slack, taped and properly stored. Label circuits so they can be isolated quickly, and note that noisy power or dimmers can cause hum or interference in sound, so tell the sound team about your layout. Only qualified people connect to a building’s supply or to a generator.'],
['I can name the parts of a simple power distribution chain.','I can explain colour-coded connectors, why cables must be rated for the load, and why reels must be uncoiled.','I can lay out a cable run safely, check equipment before use, and protect against trip and water hazards.','For a scene I can plan the complete distribution (supply, distros, runs and routes), predict where hazards and overloads could occur, design out the risks, and justify the layout, including how sound is affected.'],
[['Why should a cable reel be fully uncoiled when carrying a heavy load?','Coiled cable can overheat because the heat can’t escape, which risks damage and fire.'],['Name three good habits when laying cables on a set.','Check for damage before use, tape or ramp cables across walkways, keep connections dry and off wet ground, don’t daisy-chain or overload extensions, and keep cables slack and neatly stored.']],'BHJ','Draw a distribution plan for a three-light interior scene: the supply, a distribution box, each cable run (with lengths, ratings and routes), and where you would tape or ramp cables. Mark hazards such as doorways, wet areas and the sound team’s positions. Have a technician check it. Predict the biggest hazard first.'],
['Generators','Generators supply power where there is no mains. They bring noise, fuel, fumes and sizing questions of their own.','You can size and place a generator sensibly, and understand its safety and environmental issues.',['A generator makes electricity on location. Options run from small portable petrol inverter units to large towable generators run by trained operators, and battery power stations are an increasingly common quieter, cleaner alternative for smaller loads. Size is set by the total load plus a margin (often 20 to 25%), and by the kind of equipment: inverter generators provide stable, clean power, whereas cheaper ones can cause flicker with some ballasts and LEDs, or upset sensitive electronics.','The risks are significant. Exhaust contains carbon monoxide, so never run a generator indoors, in enclosed spaces, or near windows, doors or air intakes. Fuel is a fire hazard, so refuel only when it is off and cool, store fuel safely and keep a suitable extinguisher nearby. Generators are loud, so place them far from the sound team, use distance and barriers, and tell sound about them. Follow the hire company’s instructions on earthing and RCD protection, check the location’s permission, and have an experienced operator for anything large. Consider whether a battery power station would do the job more quietly and cleanly.'],
['I can say what a generator is and why it needs care.','I can explain how to size one, and the main safety and noise concerns.','I can work out a generator’s size for a plan and choose a safe, sensible position for it.','For a location shoot I can compare generator and battery options, predict noise, fuel and safety issues, plan around them, and justify the choice including cost and environmental impact.'],
[['Why must a generator never be run indoors or near windows?','The exhaust contains carbon monoxide, which is poisonous and can build up in enclosed spaces or enter through windows and vents.'],['A lighting plan draws 6kW. What size generator would you look for, and why?','Roughly 7.5kW or more, since you add a margin of 20 to 25% so the generator isn’t running at its limit. Check the type of load too.']],'BHJ','Take a location lighting plan and work out its total load. Choose a generator size with a margin, then compare it with a battery power station option for noise, runtime, cost and emissions. Mark where you would position it relative to the sound team. Do not run any generator without a trained operator. Predict which option suits first.'],
['Electrical safety in the UK','Electricity can injure or kill. Safe working means rules, trained people, protective devices and a habit of checking.','You can recognise electrical hazards on a set, follow safe practice, and know when to stop and ask a qualified person.',['In the UK, electricity at work is covered by the Electricity at Work Regulations 1989, supported by HSE guidance for the entertainment sector. Employers and productions must make sure equipment is safe, maintained and used by competent people, and many productions require equipment to be PAT tested (portable appliance testing) and labelled. Protective devices such as RCDs cut the supply quickly if current leaks, which can save a life, but they are a safety net, not a licence to take risks.','Practical rules: inspect plugs, cables and lights before each use and tag out anything damaged. Keep water away from electrical equipment (rain, spills, wet floors, smoke or haze machines near connections), and cover or raise connections outdoors. Don’t open lights or ballasts, since HMI ballasts and some units contain high voltages even when switched off. Only trained, competent people connect to a building’s supply or to a generator. Know where and how to isolate the power, and if someone is in contact with a live supply, switch off at the supply or isolate it before touching them, then call for help. This card is a starting point, not training, so follow your institution’s procedures and your production’s risk assessment.'],
['I can name the main UK electrical safety regulation and a protective device.','I can explain basic safe practice and why protective devices don’t replace good habits.','I can inspect a kit for electrical hazards, set up safely, and use a protective device correctly.','For a production I can identify electrical hazards, include them in a risk assessment, plan controls, and justify who may do what, including how to respond in an emergency.'],
[['What is an RCD and what does it do?','A residual current device. It cuts the supply very quickly if current leaks, which reduces the risk of a fatal shock.'],['Someone is in contact with a live supply. What do you do first?','Switch off or isolate the supply (do not touch the person until it is off), then call for help and give first aid as trained.']],'HJN','Inspect a set of lights, cables and plugs from your kit store for wear, damage, missing PAT labels and unsafe use. Write a short risk assessment for a lighting setup, covering the hazards, who is at risk, and the controls. Have a technician or tutor review it. Predict which hazard you will find most often first.',[['read','foundational','Electricity at Work Regulations 1989: HSE guidance','Search: “HSE Electricity at Work Regulations 1989 guidance”']]],
['C-stands','The C-stand (Century stand) is the standard grip stand for holding flags, diffusion, arms and small lights. Using one well takes technique.','You can set up and load a C-stand safely so that it holds what you need and doesn’t move or fall.',['A C-stand has a three-legged base, a riser (one or more sections), a grip head and a grip arm. Grip heads hold the arm and other grip gear, and the arm extends sideways to carry flags, diffusion, small lights or other items. Quintessential lighting grip gear includes lighting stands and C-stands used with boom arms and grip heads.','Technique matters. Position the arm directly over one of the legs, not between two, with that leg pointing toward the load, and weigh that leg down with a sandbag so the stand won’t tip. Set the grip head so that gravity tightens the lock, not loosens it. Don’t overload an arm or ask a C-stand to hold a heavy light, which needs a proper light stand. Mind the arm at head height, since it can injure faces, and mark the end with tape or a flag. Keep legs tucked in walkways, and keep the base low and centred. Control the weight of gear before loosening anything.'],
['I can name the parts of a C-stand.','I can explain how to set it up so it is stable and where to put the sandbag.','I can set up a C-stand with a flag or diffusion safely, with the arm positioned correctly and the weight controlled.','For a scene I can plan the stands needed, predict stability and head-height hazards, set them up, test them, and justify the arrangement.'],
[['Where should the sandbag go on a C-stand holding an arm and a flag?','On the leg that sits under the arm and the load, so it resists tipping toward the load.'],['Why do you set the grip head so that gravity tightens the lock?','So the weight of the load keeps the head tightening instead of slowly loosening and dropping.']],'GHL','Set up a C-stand with an arm holding a flag at about two metres. Compare the stand’s stability with and without a sandbag, with the arm over the leg and across the legs. Wear gloves, work with a partner, and keep the arm marked. Predict which arrangement is most stable first.'],
['Sandbagging and stand safety','Sandbags keep stands and frames from falling, and every large frame, light or flag on a stand should be assessed for stability.','You can judge when and how to weigh down a stand, and recognise when a setup is unsafe.',['Sandbags (and smaller shot bags) add weight to the base of a stand so it resists tipping. Place them on the stand’s legs, low and on the side of the load, not hung from the head. Add more where there is wind, a heavy load or a tall stand, and when in doubt add another bag. Check sandbags for leaks and secure the loose end.','Loads that look light can be dangerous: a large silk or flag acts as a sail in wind and can pull a stand over or lift off with it, so frames outdoors need guy lines, extra weight or lowering. Raise stand sections from the thickest upward, don’t over-extend them, and lock each. Keep cables from pulling on stands, and keep people clear of the stand’s fall line when working overhead. Assume everything is fragile, keep a clean set clear of clutter and hazards, and don’t leave an unweighted stand with a load on it, even for a moment.'],
['I can say what sandbags are for and where to place them.','I can explain why wind, height and load change the amount of weight needed.','I can weigh down a stand properly and adjust the setup for wind and height.','For a location I can assess stand stability risks, plan weighting, guy lines or alternatives, test them, and justify decisions including what to do if conditions change.'],
[['Why does a large silk or flag outdoors increase risk?','It acts like a sail in wind, creating a large sideways force that can topple the stand or lift it off the ground.'],['Where should a sandbag sit on a stand?','Low on the stand’s legs, on the side of the load, not hung from the head.']],'GHJ','Set up a stand holding a 4×4 frame. Test how stability changes with zero, one and two sandbags, using a gentle push from a supervised helper (never in real wind). Then plan how you would secure the same frame outdoors. Predict first.'],
['Track and dolly','A dolly carries the camera on wheels, usually along track. Setting up and running it is a craft shared by the camera team and the dolly grip.','You can plan, build and run a track and dolly setup, and keep it smooth and safe.',['A dolly is a wheeled platform that carries the camera and operator or just the camera, and track is the rail system it runs along, available in straight and curved sections. Where the floor is smooth and flat, a dolly can also run without track. The camera moves themselves (dolly in, track sideways, arc) are covered in Movement names, while this card is about the hardware and setup.','Smoothness depends on the setup. Track must be level and the joins aligned, using wedges, apple boxes or leveling tools under it, and the surface beneath must be stable. The dolly grip pushes the dolly, working with the operator and focus puller, using marks and rehearsal so starts and stops are smooth. Plan the track route with the lighting and sound teams, because track and dolly take up space, cast shadows and can be seen in reflections. Safety points include pinch points, cables and track edges, never leaving a camera unattended on a dolly, and keeping clear of the dolly’s path.'],
['I can say what a dolly and track are for.','I can explain why levelling matters and who works the dolly.','I can lay and level a short track, mount a camera on a dolly, and push a smooth move with a partner.','For a shot I can plan the track layout and dolly choice, predict problems such as shadows and sound, test it, and justify the setup including rehearsal and safety.'],
[['Why must track be level, and how do you level it?','An uneven track makes the dolly jolt or tilt, so the move isn’t smooth. Use wedges, apple boxes or levelling tools under the track to level it and join sections.'],['What should you consider besides the camera when planning a track route?','Where it crosses lighting and sound positions, cables and shadows, how much room the dolly grip needs, and whether the track or dolly is visible in reflections.']],'GHE','Lay a short section of track and level it, then run a dolly move with a camera at three speeds. Look for bumps, jolts and visible shadows or reflections. Rehearse the starts and stops with a partner. Predict where the move will be least smooth first.'],
['Rigging safety','Rigging puts weight where it can fall. Rated gear, secondary protection, planning and competence are what keep people safe.','You can assess and plan the safety of a rig, and know when to hand it to someone qualified.',['Rigging safety starts with knowing the load and the ratings. Every clamp, strap, chain, stand and mounting point has a safe working load (the most it should carry), and the load includes the weight of everything on it plus movement and wind. Use equipment rated for the job, check it before use, and don’t modify it. Where something could fall, use a second, independent attachment (a safety cable or chain), keep people out of the area beneath it, and control the weight of gear before loosening anything.','Check what you are attaching to: ceilings, walls, trees and vehicles may not take the load, and location owners may not permit it. Rigging at height, overhead lights, vehicles and anything near people is a job for experienced, trained people under a risk assessment and method statement, and the UK has legal duties for work at height and lifting equipment (the Work at Height Regulations 2005 and the Lifting Operations and Lifting Equipment Regulations 1998 are examples). If unsure, stop and ask. Use gloves and appropriate protective equipment, and don’t add more force when something doesn’t fit.'],
['I can say why rigging needs safety checks.','I can explain safe working loads, secondary protection and why anchor points matter.','I can check a simple rig for ratings, attachments and risks and set up a basic safe rig under supervision.','For a production I can assess a rigging plan, identify hazards, write controls into a risk assessment, decide what to hand to specialists, and justify the decisions.'],
[['What does a safe working load mean, and what counts toward it?','The most a piece of equipment should carry. It includes the weight of everything on it plus extra from movement or wind.'],['Why use a second attachment (a safety cable) on an overhead light?','If the main attachment fails, the second one stops it falling on people.']],'HJN','Plan the rigging of a light over a set. Write a short risk assessment and method statement covering the load, ratings, anchor points, secondary protection, exclusion zone and who is qualified to do it. Have a technician or tutor review it. Do not rig anything overhead without supervision. Predict the weakest point first.',[['read','foundational','HSE guidance on work at height and lifting equipment','Search: “HSE Work at Height Regulations 2005 short guide”, “LOLER 1998 guidance”']]],
['Advanced grip for lighting','Advanced lighting grip gets light where it’s needed without stands in shot, using clamps, trusses, frames and rigging.','You can plan and use grip equipment to place and control lights and large frames safely and tidily.',['Beyond simple stands, lighting grip includes clamps and mounts (such as Mafer, Cardellini and super clamps), boom arms and menace arms, wall spreaders, polecats, goalposts and trusses, overhead frames, and frame rigs. They let you hold lights and diffusion high, from ceilings or walls, or outside windows, so floors stay clear of stands and shadows from stands stay out of shot. Trusses and frame rigs provide the elaborate infrastructure behind larger setups.','These setups are heavier and riskier, so they need planning with the gaffer and key grip: check the load and ratings, check what you are attaching to, use secondary safety, plan access and exclusion zones, and control wind on large frames. Get permission from the location owner before clamping to anything. In the UK, lighting-related grip such as stands and fabrics is usually handled by the lighting department’s electricians, while in the US it usually sits with the grip department, so learn the skills whichever department does them.'],
['I can name some grip tools used for lighting.','I can explain why a rig might be used instead of stands, and the extra risks.','I can set up a simple rigged light (such as on a clamp or wall spreader) under supervision.','For a scene I can design a lighting rig, predict the load, access and safety needs, plan it with the key grip and gaffer, and justify the choice against stands.'],
[['Why might you rig a light on a clamp or wall spreader instead of a stand?','It keeps the floor clear, keeps stand shadows out of shot, and lets you place a light in a position a stand can’t reach.'],['Name two extra risks of rigging lights overhead or on walls.','The load may exceed the attachment or structure rating, and a fall could injure people below. You also need permission from the location owner.']],'GHJ','Design a lighting rig for a small interior using clamps, a wall spreader or a polecat. Draw it with the loads, ratings, attachment points, secondary protection and exclusion zones, then have a technician review it. Build only a simple version, under supervision. Predict the biggest risk first.'],
['Setup workflow','Setup workflow is the repeatable order in which a camera team prepares, builds, checks and wraps the camera, so nothing is missed under pressure.','You can prepare, build and wrap a camera package methodically, and know who in the camera team does what.',['A camera team works in a set order so that problems are found before the shoot, not during it. The camera department is responsible for shots being sharp and technically sound. The 1st AC (focus puller) builds and balances the camera rig, handles lens swaps and focus-related accessories, and needs a strong technical understanding of camera systems and accessories. The 2nd AC (clapper loader) assists the operator and focus puller in setting up and maintaining gear, handles media cards, keeps notes of camera and lens settings for continuity, and ensures gear on set is clean, tidy, charged, logged and ready for use. The camera operator physically operates the camera and is often involved in pre-production, such as tech scouts and camera tests.','A typical workflow runs in stages. In prep, check out and test the whole package: camera, lenses, batteries, media, monitors, cables and accessories, with firmware and settings (frame rate, resolution, codec, ISO, white balance, LUT) checked. On the day, build the rig, power up, format cards, set the agreed settings and check the image. Between setups, re-check settings, rebalance after changes, and protect the camera from weather and knocks. At wrap, clean and pack gear, charge batteries, secure the media and complete the logs. Use checklists, label everything, never leave a camera unattended, and keep the essentials to hand: spare batteries and cards, lens tissue, a blower, tape and a notebook.'],
['I can name the roles in the camera department and say what each is responsible for.','I can explain the stages of camera prep, setup and wrap, and why a fixed order helps.','I can build a camera package from case to ready, run through a checklist, and wrap it down properly.','For a shoot I can design a prep and setup workflow for my kit and team, predict where mistakes are most likely, test it, and justify the order and checks.'],
[['What are the 2nd AC’s main responsibilities?','Assisting the operator and focus puller in setting up and maintaining gear, handling media cards, keeping notes of camera and lens settings, and ensuring gear is clean, tidy, charged, logged and ready.'],['Why test a camera package in prep instead of on the day?','Faulty cables, cards, batteries or settings are found when there is time to fix them, not in front of a waiting crew.']],'EGT','Write a checklist for prepping and wrapping your camera package, then use it. Time how long it takes to build the camera from its case to ready, then to wrap it down. Swap checklists with a partner and note what each missed. Predict the step you are most likely to forget first.'],
['Slating','A slate identifies each take on camera, and its clapper sticks give a visual and audio mark so sound and picture can be matched.','You can slate accurately and confidently, and handle the variations (tail slates, MOS, smart slates).',['A slate (clapperboard) is filmed at the start of each take to identify it. It carries the production, director and cinematographer names, date, camera, roll or card, scene, shot and take numbers, and often the frame rate. The clapper sticks give a sharp visible and audible mark, so editors can line up the picture with separately recorded sound. The 2nd AC marks the start of each take and makes sure the information on the slate is accurate, usually working with the script supervisor’s numbering.','Do it properly: hold the slate in focus and in frame, close to the lens and readable, call out the scene, shot and take, say “sticks”, and clap crisply. If you can’t slate at the start, slate at the end of the take with the slate upside down (a tail slate) and announce it. If no sound is being recorded (MOS), say so and show it on the slate, and don’t clap, so no one wastes time looking for sound. Smart slates display timecode that matches the sound recorder. Slating is shared work with the sound team and script supervisor, so agree numbering and routines before shooting.'],
['I can say what a slate is for.','I can explain what goes on it, why clapper sticks are used, and when to tail slate or call MOS.','I can slate takes correctly, including a tail slate and an MOS take.','For a shoot I can agree numbering and slating routines with sound and script, predict where errors will occur, test them, and justify the routine.'],
[['Why does a slate have clapper sticks?','They produce a sharp mark on camera and on the sound, so picture and separately recorded sound can be synchronised.'],['What is a tail slate, and when would you use it?','A slate shown at the end of a take, upside down, announced as a tail slate. Used when you can’t slate at the start, for example when the camera is rolling on action that can’t be interrupted.']],'ET','Shoot a short scene with a slate, using a head slate, a tail slate and an MOS take. In editing, match the clap to the waveform and check the sync. Count how many frames the visual and audio marks are apart. Predict first.',[['read','deeper','Miller, Script Supervising and Film Continuity','Use the contents and index to find slating and numbering']]],
['Camera reports','A camera report records what was shot on each card or roll, and how, so everyone downstream knows what they have.','You can complete a clear, accurate camera report and use it to find shots.',['A camera report is a record kept by the camera team for each card or roll. It usually notes the production and date, camera and card or roll number, scenes and takes recorded, which were good or no good, lens used, frame rate, resolution and codec, ISO, white balance and shutter, filters, and any problems or comments. The 2nd AC keeps detailed notes of camera and lens settings for continuity and logs the media.','Reports travel with the media. Editors, the DIT and post use them to know what is on each card, how it was shot, and where to look when something is wrong. They are cross-checked against sound reports and the script supervisor’s notes to catch mismatches early. Reports can be paper, a spreadsheet or an app, but the habit matters most: fill them in as you go, not afterwards, write legibly, and use consistent names and numbers. A clear report saves hours later.'],
['I can say what a camera report is.','I can explain what it records and who uses it.','I can complete a camera report for a day’s shooting that someone else can follow.','For a production I can design a camera report format, predict what downstream teams will need, test it by finding shots from the report alone, and justify what I include.'],
[['Give five things a camera report records.','For example the card or roll, scenes and takes, lens, frame rate and resolution, ISO, white balance, shutter, filters, and notes on problems.'],['Who uses camera reports, and why?','Editors, the DIT and post, to know what is on each card, how it was shot, and where to look, and they are cross-checked against sound and script notes.']],'E','Fill in a camera report for a short shoot with several setups. Swap it with a partner who has to find a specific take using only the report, then check what was unclear. Predict what is missing first.'],
['Checking the gate','Checking the gate means making sure nothing on the lens or sensor will spoil the image, and that the shot is clean before the crew moves on.','You can check, protect and clean camera and lens safely, and know when to stop and ask.',['On a film camera the gate is the window in front of the film where each frame is exposed, and a hair or piece of dirt in it ruins every frame. After the last take of a setup the 1st AC checks it and tells the director whether it is clean. Digital cameras have no gate, but the principle remains: check that nothing is on the lens or sensor, and that the footage is clean, before the set moves on.','In practice, zoom in on the image on the monitor and look for dust spots, hairs, smudges and flares. Check the front and rear lens elements and the filters, and clean with a blower and a brush first, then proper lens tissue and cleaner, never your clothes. Change lenses quickly, with the camera body facing down and a cap on the open mount, out of wind and dust. Shooting a plain surface or sky at a small aperture (a high f-number) shows dust clearly, because light reaches the sensor through a narrower cone, so the shadows of specks are sharper and easier to see. Sensor cleaning is a delicate job for trained people with proper tools: never touch the sensor yourself. Terminology varies, so confirm which term your team uses.'],
['I can say what checking the gate is for.','I can explain why a hair or dust spot is a problem and how to look for it.','I can check footage and lenses for dirt and clean a lens safely.','For a shoot I can plan when and how to check for dirt, predict where it is likely to appear, prevent it, and justify the routine including when to hand it to a technician.'],
[['Why does a small aperture make sensor dust easier to see?','Light reaches the sensor through a narrower cone, so the shadows cast by specks are sharper and easier to see.'],['How do you clean a lens safely?','Blow off dust with a blower and brush first, then use lens tissue and cleaner, never a sleeve or cloth, and keep contact gentle.']],'ET','Shoot a plain wall or sky at a small aperture, then zoom into the footage at 100% and look for dust spots. Clean the lens (not the sensor) using the correct method, then shoot again and compare. Predict what you will find first.'],
['Media handling','Media handling is how the camera team prepares, protects and backs up the cards that hold the footage.','You can handle cards safely and follow a workflow that never loses footage.',['The footage exists only on the card until it is backed up, so media handling is among the most important jobs in the camera team. The 2nd AC handles media cards, both preparing them for capture and securing recorded footage. Good practice includes formatting cards in the camera at the start of the shoot (and only once earlier footage is safely backed up), and not recording without ample space left.','Back up media regularly, to multiple different drives: when a card is nearly full, at the end of each shoot day as soon as possible, and during breaks from filming. Label cards, separate empty and used cards clearly, keep them in cases away from heat, water and magnets, and never delete footage in the camera. Copy with software that verifies the transfer (see Data Integrity and Verified offload), keep at least two copies in different places, and record every card in the media log. When data wrangling is separate, the DIT handles this, and the camera team hands over the cards with the camera report.'],
['I can say why media needs care.','I can explain when to back up and why verified copies and multiple drives matter.','I can run a media workflow for a shoot day, from labelling cards to verified backups and a media log.','For a production I can design a media workflow for the cameras and cards, predict where footage could be lost, test it, and justify the checks.'],
[['When should media be backed up during a shoot?','When a card is nearly full, at the end of each shoot day as soon as possible, and during breaks, to multiple different drives.'],['Why shouldn’t you delete footage in the camera?','You could delete a good take by mistake, and an unverified copy might be corrupt. Only format a card once it is safely and verifiably backed up.']],'EST','Run a mock shoot day with two cards. Label them, copy each to two drives with a verifying tool, record them in a media log, and make the camera report. Then deliberately damage one copy and see whether you can detect it. Predict first.'],
['Framing and composition','Composition is how you arrange the subjects and space inside the frame. Framing is how you place the edges around them.','You can compose a frame on purpose, use the common guidelines, and break them deliberately.',['Framing is where you put the frame’s edges, and composition is how everything inside them is arranged. Common tools include the rule of thirds (placing key points near the lines that divide the frame into thirds), balance between the sides of the frame, symmetry, negative space (empty space around a subject), leading lines that draw the eye, a frame within a frame, and layering foreground, middle ground and background for depth.','Some conventions are practical. Headroom is the space above a subject’s head, and too much or too little looks wrong. Lead room (or looking room) leaves space in the direction a person faces or moves, so they don’t seem to press against the edge. Avoid cutting a person off at the joints (ankles, knees, wrists), and cut between them instead. These are guides, not laws, and breaking them can create tension or unease. Composition steers the viewer’s eye, so it works together with lighting and focus, and it depends on the aspect ratio chosen.'],
['I can name some composition guidelines.','I can explain headroom, lead room, the rule of thirds and what each is for.','I can compose a frame using several guidelines and explain why each choice was made.','For a scene I can design compositions that express its meaning, predict how viewers will read them, test alternatives, and justify when I break a guideline.'],
[['What is lead room, and why give it?','Space in front of a subject in the direction they face or move, so they don’t look cramped or about to leave the frame.'],['Why avoid cutting a person off at the joints?','It looks awkward, as if the limb has been amputated. Cutting between joints looks more natural.']],'BK','Shoot the same subject six ways (centred, thirds, with lead room, with too little headroom, through a frame within a frame, with leading lines). Show them to someone and ask which feel calm, tense or odd. Predict their answers first.'],
['Shot size, type and angle','Shot size is how much of the subject is in frame, shot type is the shot’s purpose, and shot angle is where the camera sits relative to the subject.','You can tell size, type and angle apart, name common examples of each, and choose them for meaning.',['These three describe different things. Shot size is how much of the subject is in the frame: extreme wide, wide (also full or long), medium wide, medium, medium close-up, close-up and extreme close-up. Shot type focuses on the function or purpose of the shot: for example an establishing shot, master shot, two shot, three shot, over-the-shoulder shot, point of view (POV) and insert. Shot angle is the position and perspective of the camera in relation to the subject: eye level, low angle, extreme low angle, high angle, overhead and Dutch angle.','Each combines with the others, so a shot might be a medium over-the-shoulder at a low angle. Size usually affects intimacy, from the context of a wide to the emotion of a close-up. Angle affects how a subject appears, such as a low angle suggesting power and a high angle vulnerability, though this is a convention and not a rule, and clichés can be subverted. Terms vary a little between crews, so confirm them. Coverage principles combine sizes, types and angles so a scene can be cut together.'],
['I can name shot sizes, types and angles.','I can explain the difference between size, type and angle and what each usually communicates.','I can identify the size, type and angle of shots in a scene and set them up on request.','For a scene I can choose a set of shots (size, type and angle) for what the story needs, predict their effect and how they will cut, test them, and justify each choice.'],
[['What is the difference between a medium close-up and an over-the-shoulder shot?','Medium close-up is a shot size (how much of the subject is in frame). Over-the-shoulder is a shot type (its purpose and arrangement). A shot can be both.'],['How might a low angle change how a character appears?','It can make them seem powerful or imposing, though this is a convention that can be subverted.']],'KB','Shoot one line of dialogue in four combinations of size and angle (for example wide and eye level, close-up and eye level, close-up and low, close-up and high). Show them to someone and ask how the character seems in each. Predict their answers first.'],
['Parallax and spatial depth','Parallax is how near objects seem to move faster than far ones when the camera moves. It is one of the strongest cues for depth.','You can create and use parallax and other depth cues on purpose.',['Parallax is the apparent shift of objects against each other when the camera changes position: near objects seem to move more than far ones. A track, a dolly or a handheld move creates parallax, while a pan that only rotates the camera does not, which is why movements that change position feel more three-dimensional (see Movement names).','Parallax is one of several depth cues. Others include overlap (things in front of other things), relative size, converging lines (perspective), atmospheric haze, focus (depth of field), and light and colour. Layering foreground, middle ground and background builds depth within a frame, and wide lenses exaggerate it. You can emphasise depth with foreground objects, lighting that separates planes, and camera movement, or flatten it deliberately for a graphic or claustrophobic look.'],
['I can say what parallax is.','I can explain why a track creates parallax and a pan doesn’t, and name other depth cues.','I can set up a shot that uses parallax and layering to show depth.','For a scene I can design depth cues (movement, layers, lens, light), predict how deep the image will feel, test it, and justify choosing depth or flatness.'],
[['Why does a track create parallax but a pan doesn’t?','A track changes the camera’s position, so near and far objects shift by different amounts. A pan only rotates the camera, so everything moves together.'],['Name three depth cues besides parallax.','Overlap, relative size, converging lines, atmospheric haze, depth of field and lighting.']],'BW','Film a layered scene (foreground object, subject, background) with a track sideways, a pan, and a static shot. Compare the sense of depth, then remove the foreground layer and compare again. Predict first.'],
['Colour palette','A colour palette is the limited set of colours that dominates a frame or film. It sets mood and ties the image together.','You can build, control and test a colour palette, and know how light, art and the grade each affect it.',['A palette is the range of colours seen in an image. It can be built from colour relationships: complementary (opposite on the colour wheel), analogous (neighbours), monochrome, or a mostly neutral frame with one accent. Warm and cool contrast, and saturation, also shape mood. Colours carry associations that vary between cultures, so treat them as tools, not fixed meanings.','A palette is built by several departments: production design and costume choose what colours exist, lighting chooses the colour of light on them (surface and light colours interact, so a blue gel changes a red wall), and the grade finishes it. Plan palette early, using references in the lookbook, and keep it consistent through a scene. Tools such as a vectorscope can check what the camera actually recorded. Production design has its own proportion guides, such as the 60/30/10 rule, which are worth knowing.'],
['I can name colour relationships such as complementary and analogous.','I can explain how a palette sets mood and how the colour of light interacts with the colour of objects.','I can build a palette for a scene, control it with art, light and white balance, and check it.','For a project I can design a palette that supports the story, plan how each department contributes, test it, and justify the choices, including where I deliberately break it.'],
[['Name two colour relationships used to build a palette.','Complementary (opposite colours), analogous (neighbours), or monochrome with an accent.'],['Why does a blue gel change how a red wall looks?','Light and surface colour combine: the wall reflects only the colours it can, so changing the light’s colour changes what is reflected.']],'BW','Choose a still you admire and extract its palette. Recreate a scene with a similar palette using costume, props and gels, then check the result on a vectorscope or in the grade. Predict which element is hardest to control first.'],
['Contrast and tonality','Contrast is the difference between light and dark in an image. Tonality is how those tones are spread across it.','You can read and control tonal contrast to separate subjects and set mood.',['Tonal contrast is the difference between the brightest and darkest parts of an image, and tonality is how tones are distributed: mostly bright, mostly dark, or a full range. It is shaped by lighting (including the contrast ratio), exposure, the surfaces in the scene, filters such as diffusion, lens flare, and the camera’s recording curve and the grade. A high contrast image has strong blacks and whites, while a low contrast image is flatter and gentler.','Tonal separation helps the subject stand out from the background: a light subject against a dark background, or vice versa. Converting to black and white, or looking at a waveform, shows whether the tones are separated. Contrast also affects mood (see High key vs. low key) and can be local, such as a bright spot drawing the eye (see Directing gaze through lighting). Check how contrast will translate through the camera format and the grade, not just on set.'],
['I can say what contrast is.','I can explain tonality and how lighting, exposure, filters and the grade each change contrast.','I can read contrast from a waveform or in black and white and adjust a scene to separate subject and background.','For a scene I can plan tonal contrast and separation, predict how it will read through the camera and grade, test it, and justify the choices.'],
[['How can you check tonal separation quickly?','Look at the image in black and white or on a waveform, to see whether subject and background sit at different tones.'],['Name three things that change an image’s contrast.','Lighting (contrast ratio), exposure, diffusion or other filters, flare, the camera’s recording curve and the grade.']],'BS','Shoot a scene, convert it to black and white, and judge the separation between subject and background. Re-light or reposition to improve it, and compare on a waveform. Predict first.'],
['Look development and lookbooks','Look development is deciding the visual style of a project and communicating it, usually in a lookbook, before you shoot.','You can research, define and communicate a look, and test it before the shoot.',['The look is the combined result of composition, lighting, colour, lens, filtration, movement and the grade. It starts with the script and conversations with the director, then gathers references (films, photographs, paintings) and breaks them down into what you like and why: the contrast, colour, light direction, lensing and movement. A lookbook (a document or slide deck) organises these references with notes so that the director, production designer, gaffer and colourist share one picture.','Don’t copy a reference: take its ideas and adapt them to the story and budget. Test the look before the shoot with camera tests (see Camera tests), and with a show LUT, so you can see it on set. Keep the lookbook for internal use. It is a communication tool, so keep it clear and short, and update it as decisions are made.'],
['I can say what a lookbook is for.','I can explain how a look is built from references and broken down into specifics.','I can research references and build a short lookbook for a scene.','For a project I can develop and communicate a look, predict how it will translate to the shoot and grade, test it, and justify each decision against the story and budget.'],
[['Why break a reference down into specifics?','So you know what exactly you like (contrast, colour, light direction, lensing, movement) and can reproduce or adapt it, instead of just saying “like that film”.'],['Who might use a lookbook besides the director?','The production designer, gaffer, colourist and others who need a shared picture of the look.']],'BW','Choose a scene and build a short lookbook with six annotated references covering lighting, colour, lens and movement. Present it, then shoot a test frame to match it. Compare the two. Predict what will be hardest to achieve first.'],
['Camera tests','Camera tests check the equipment, settings and workflow, and let you make decisions about the look, before the shoot.','You can plan and run camera tests that answer real questions and report the results.',['A camera test is a trial shoot to answer questions before it is too late to change. Typical tests cover lenses (see Lens testing), the camera’s dynamic range and noise at different ISOs, filters and diffusion, skin tones with the actual cast, costume, make-up and locations, the effect of lights, and the whole workflow from camera through the DIT, edit and grade. The camera operator is often involved in tests as part of pre-production.','Plan tests carefully: define the question for each, shoot a consistent set of charts, a grey card, skin tones, high-contrast and low-light scenes and some movement, log all settings, and view the results on a proper monitor with the people who will use them, such as the colourist and editor. Decide what you learned and document it. Testing the end-to-end pipeline finds problems with codecs, LUTs and handover early.'],
['I can say why camera tests are done.','I can explain what a test can reveal and who should see the results.','I can plan and run a test for a specific question and record the settings and results.','For a project I can design a test plan that covers the key risks, predict outcomes, run and analyse it with the team, and justify the decisions made.'],
[['What should every test start with?','A clear question about what you need to find out or decide.'],['Why test the whole workflow and not just the camera?','Problems with codecs, LUTs, metadata or handover often appear only when footage goes through the DIT, edit and grade.']],'BT','Plan a test day for a short project: list your questions, the scenes, charts and cast you will shoot, and how you will log and review the results. Run a short version and write up what you learned. Predict the biggest surprise first.'],
['Tech recce','A tech recce is a visit to a location by the key crew to check what each department needs, before the shoot.','You can run and use a tech recce to find problems early and plan the shoot.',['A tech recce (technical recce or tech scout) is a visit to the location after it has been chosen, by the director, cinematographer, gaffer, key grip, sound, production designer and 1st AD, among others. It is where each department checks what they will need. Location scouts and tech scouts are part of the core cinematography documentation.','Look at light (windows, orientation and the sun’s path, with a sun-path app, at the time you will shoot), power (supply, circuits and generator position), space and access (loading, parking, rigging points), sound (noise sources, echo, hum and traffic), permissions, safety hazards, and the planned camera positions, using photographs or a viewfinder app. Record decisions in notes or a location report, and use them to plan the kit list, the schedule and the risk assessment. A tech recce should end with a list of problems, solutions and actions.'],
['I can say what a tech recce is for.','I can explain what each department looks for and who attends.','I can carry out a recce of a location and record light, power, sound, space and safety.','For a shoot I can plan and run a tech recce, predict the problems, record solutions and actions, and justify the kit and schedule from it.'],
[['Name four things a cinematographer or gaffer checks on a tech recce.','For example the light and sun path, power supply, space for rigging and equipment, camera positions, access and loading, and hazards.'],['Why take sound on the tech recce?','Noise, echo and hum can ruin recorded sound, and may mean changing the location, schedule or lighting.']],'BHJ','Carry out a mock tech recce of a location. Record the light (with the sun path), power, access, sound, hazards and planned camera positions with photos, and write a short report listing problems and solutions. Predict the biggest problem first.'],
['Lighting plans and diagrams','A lighting plan is a drawing of where lights, modifiers and cameras go, so the plan can be communicated and executed.','You can draw a clear lighting plan and use it to communicate with the gaffer and team.',['A lighting plan or diagram is usually a top-down plan of the set or location, showing the camera positions, the actors’ blocking and each light with its type, position, height, modifiers (flags, diffusion, gels) and notes on level or colour. Lighting plans are part of the core cinematography documentation. The gaffer and lighting team use it to plan power, kit and rigging, and to execute the DP’s vision, though they do not usually design it.','Draw it neatly with a legend, because symbols vary, using pen and paper, a dedicated lighting diagram tool or ordinary drawing software. Include enough to avoid guesswork: sizes, wattages, distances and heights, which light is key, fill, back and background, and how it motivates. A plan is a starting point, and the real set will change it, so update it after the shoot as a record for continuity and for the next time.'],
['I can say what a lighting plan shows.','I can explain what belongs on it and who uses it.','I can draw a lighting plan for a simple scene that someone else could follow.','For a scene I can design a complete lighting plan, predict how it will translate to the set, test it with a colleague, and justify the choices and any changes.'],
[['Name five things to include on a lighting plan.','For example camera positions, blocking, each light’s type and position, height, modifiers, gels or colour, and a legend.'],['Why include power and rigging information?','So the gaffer and team can plan distribution, kit and rigging in advance.']],'BG','Draw a lighting plan for a scene, then give it to a colleague to set the lights without speaking to you. Compare the result with your intent and update the plan. Predict what will be misread first.'],
['Unreal Engine pre-viz for lighting','Unreal Engine is a real-time 3D tool that can be used to test lighting and camera ideas in a virtual set before the shoot.','You can use a virtual set to explore light and camera decisions, and know the limits of what it shows.',['Unreal Engine is a real-time 3D engine used for games, previsualisation and virtual production. For lighting, you can build or import a model of the set or location, place virtual lights (directional or sun, spot, point, rectangular or area lights) and a virtual camera with physical settings such as focal length, aperture and sensor size, and see how light, shadows and colour will look from the planned positions. You can move the sun to see the time of day, test practicals and windows, and make reference images for the director and gaffer.','It supports early decisions and communication, but it doesn’t replace tests. Virtual lights don’t behave exactly like real fixtures (their units, falloff, spectrum and softness depend on settings), real-time shadows and bounced light depend on the render settings, and auto exposure can mislead, so set exposure manually. Building a good virtual set takes time, so use it where it saves more time than it costs, and keep it consistent with the lighting plan.'],
['I can say what Unreal Engine can be used for in pre-visualisation.','I can explain how virtual lights and cameras relate to real ones and what the limits are.','I can build a simple virtual set, light it and place a camera to preview a scene.','For a scene I can use a virtual set to compare lighting options, predict real-world results, check them against a test, and justify when virtual pre-viz is worth the time.'],
[['Why is it a problem to leave auto exposure on in a virtual scene?','It adjusts brightness automatically, so you can’t judge the real contrast and exposure of the lighting. Set it manually.'],['Name one way a virtual light differs from a real one.','It may not match the real fixture’s output, falloff, spectrum or softness, depending on the settings.']],'W','Build a simple room in a virtual engine with a window and a lamp, light it and place a camera. Then photograph a similar real space and compare the contrast, shadows and colour. Note the differences. Predict them first.',[['read','deeper','Unreal Engine documentation on lighting and cameras','Search: “Unreal Engine lighting the environment”, “Unreal Engine Cine Camera Actor”']]],
