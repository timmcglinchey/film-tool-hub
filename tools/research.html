han online. Record every licence. Clearing music at the end is the commonest mistake: plan it in development."], ["I can say that songs need two sets of permissions.", "I can explain the safer alternatives and why licence terms matter.", "I can create a music and archive plan with sources and licences for a short film.", "For a project I can predict clearance cost and risk, test the plan by requesting a quote, and justify my choices."], [["Why does using a commercial song need two permissions?", "The composition and the master recording are owned separately."], ["What is the safest way to get music for a student film?", "Original music under a written agreement or properly licensed library music, with licence terms that cover your intended use."]], "lhc", "List every piece of music and archive material in a short film (real or imagined), the likely owner, and your plan for each. Predict which will be most expensive, then request one real quote or licence.", []], ["Credits", "Credits record who did what. They are a form of payment, so they need to be agreed in writing and applied consistently.", "You can plan credits that are accurate, fair and consistent with agreements.", ["Credits are how people are recognised, and for many in low-budget film they are the main reward. Names, job titles and the order and size of credits should be agreed in writing in the deal memo. Typical conventions put principal cast and key heads of department in particular positions, but there is flexibility, and festival or distributor requirements and legal obligations (for example to people who have provided funds, music or locations) also matter.", "Keep a running list of everyone to be credited from day one, with spellings and job titles confirmed by the person. Agree who approves the final credits. Check them against agreements, funding conditions and rewards promised to backers. Errors in names or job titles cause real upset and are expensive to fix after the film is finished, so proof-read carefully with the team."], ["I can say why credits matter.", "I can explain what should be agreed in writing and how conventions order credits.", "I can build a credits list from agreements and funding rewards, with confirmed names.", "For a project I can predict credit disputes, test my list against every agreement, and justify the order and approvals."], [["Why agree credits in the deal memo?", "They can be a main reward for the crew, so the title, position and size should be clear before work begins."], ["Who should confirm the spelling of a person’s name and title?", "The person themselves."]], "lh", "Draft the end credits for your film from your deal memos and crowdfunding rewards. Ask each person to confirm their entry. Predict how many will need a correction, then count.", []], ["Legal and compliance basics", "Beyond contracts and permissions, a production must follow general law on copyright, data protection, health and safety, equality and more.", "You can recognise the main legal obligations affecting a student production and know where to get advice.", ["Several areas of law affect even a small production. <b>Copyright</b> and clearances (above), <b>health and safety</b> law (covered in its own domain), <b>employment and working time</b> rules, <b>equality law</b> (fair treatment of cast and crew, and non-discriminatory hiring), and <b>data protection</b>. Data protection applies because you hold personal information about cast and crew, such as names, phone numbers and sometimes health or dietary details, and you must keep it safe, use it only for the stated purpose and share it appropriately.", "Other areas can apply to specific shoots: drone filming has its own aviation rules, filming children has licensing requirements, filming in public may raise privacy considerations, and weapons or stunts have specific rules. You are not expected to be a lawyer, but you are expected to know the questions to ask and who to ask: your institution’s legal or compliance staff, industry bodies and official guidance. Document your decisions."], ["I can name some areas of law that affect film production.", "I can explain why data protection applies to contact sheets and what it requires.", "I can identify the compliance questions for a given shoot and who to ask.", "For a project I can predict legal risks, test my list with institutional advice, and justify my mitigations."], [["Why does data protection matter for a contact sheet?", "It contains personal data, which must be kept safe, used only for its purpose and shared appropriately."], ["What should you do when you are unsure about a legal issue?", "Ask your institution’s legal or compliance contact or the relevant official body, and record the advice."]], "lhc", "For your shoot, list every legal or compliance issue you can think of (data, drones, children, public filming, weapons). Predict which two you’re least sure about, then ask your institution about them and record the answers.", []], ["Health and safety assessments", "A risk assessment records the hazards, who could be harmed and what you will do about it, and is a legal requirement for workplace activity in the UK.", "You can complete a useful risk assessment for a location or activity, and use it on set.", ["A <b>risk assessment</b> is a written document identifying hazards at a location or in an activity, who is at risk, how serious the risk is, and what control measures are in place. The UK’s Health and Safety Executive (HSE) describes a simple five-step approach: identify the hazards, decide who might be harmed and how, evaluate the risks and decide on precautions, record the findings and implement them, and review and update. It applies to the whole production, not just stunts.", "Write one for each location and for each specific activity (heights, water, vehicles, fire, working at night, weapons or stunts). Be specific: ‘trip hazard from cables across the doorway, mitigated by cable ramp and tape, checked by the gaffer’ is useful, while ‘be careful’ is not. Brief the crew on the main risks at the start of each day, keep it on set, and update it when conditions change. Your institution may have its own forms and approval process."], ["I can say what a risk assessment is and that it is a legal requirement.", "I can explain the five steps and what makes a control measure specific.", "I can write a risk assessment for a location with specific hazards, controls and owners.", "For a shoot I can predict the highest risks, test the assessment by walking the location, and justify the controls and what I would stop."], [["What are the five steps in the HSE’s approach?", "Identify hazards, decide who might be harmed and how, evaluate risks and decide precautions, record and implement findings, and review and update."], ["Why is ‘be careful’ a poor control measure?", "It isn’t specific, has no owner and can’t be checked."]], "JNc", "Walk a real location and write a risk assessment for it. Predict your three highest risks first, then ask someone experienced to review it and note what you missed.", []], ["HSE guidance for film production", "The HSE and industry bodies publish guidance specific to film and television, covering the work and risks you are likely to meet.", "You can find and use official guidance for the activities in your shoot.", ["The HSE publishes guidance for the entertainment and broadcasting sector, and industry organisations such as ScreenSkills and the Film and TV Charity provide production safety information, templates and training. These cover areas such as working at height, electrical safety, rigging, vehicles and filming on roads, working with children, special effects and stunts, fatigue and welfare.", "The guidance is practical: it tells you what is considered reasonable. Use it to inform risk assessments, to brief crew, and to decide when to bring in a specialist. Some tasks should only be done by qualified people (for example stunts, pyrotechnics, working at height or large electrical work). Treat the guidance as a baseline and follow your institution’s rules as well. Look at the date, because guidance gets updated."], ["I can say where to find film-specific safety guidance.", "I can explain what areas the guidance covers and why some jobs need specialists.", "I can find the relevant guidance for my shoot’s activities and use it in the risk assessment.", "For a production I can compare guidance with my plan, predict where I’m falling short, test it with a safety adviser, and justify the changes."], [["Name two sources of film safety guidance in the UK.", "For example the HSE’s entertainment and broadcasting guidance and ScreenSkills."], ["Why check the date on guidance?", "It is updated, and an old version may no longer reflect current rules or practice."]], "JNc", "Choose one risky activity in your shoot (for example working at height or filming on a road). Find the official guidance on it, summarise the main requirements, and predict which one you would have missed. Compare with your plan.", []], ["Safe sets and hazards", "A set is full of recognisable hazards, such as cables, stands, heavy kit, heat and crowds, and most can be controlled with habits.", "You can spot and control common set hazards and keep a safe working space.", ["Common hazards include trip hazards (cables, sandbags, stands), falling objects (unsecured lights or flags), hot equipment, electrical risks, heavy lifting, vehicles, uneven or slippery surfaces, working near water or heights, noise, and tired people. Many are managed by simple habits: tape and ramp cables, use sandbags, keep walkways and exits clear, label hot lights, lift sensibly, and keep spaces tidy.", "Everyone shares responsibility, but the 1st AD and producer lead on it. Brief the crew at the start of each day about the hazards and emergency arrangements, make it easy for anyone to raise a problem and stop work if something is unsafe, and respond fast. Don’t let schedule pressure justify shortcuts: an accident costs far more than a delay. Specific areas (electricity, rigging) have their own domains in Cinematography."], ["I can name common set hazards.", "I can explain simple habits that control them and who is responsible.", "I can walk a set and spot and fix hazards.", "For a shoot I can predict where hazards will appear as the day changes, test with a safety walk, and justify my stop rules."], [["Name three common hazards on set and a control for each.", "For example cables (tape and ramps), unsecured lights (sandbags and safety cables), hot lamps (labelling and guards)."], ["Who can stop work if something is unsafe?", "Anyone, and it should be easy and respected."]], "JNb", "Walk a practice set with a checklist, listing every hazard you can see. Predict the number you will find, then ask a partner to repeat the walk and compare.", []], ["Safeguarding and working with minors", "Children have legal protection and specific rules on hours, licensing and supervision, and you must also take care of any vulnerable people on set.", "You can plan a shoot involving young people safely and legally.", ["Under-16s who perform usually need a licence or approval from the local authority, and there are limits on hours, rest and tutoring, along with requirements for a chaperone. Parents or guardians must give consent. These rules affect schedule and budget, and need to be dealt with well in advance. Students under 18 on a production crew also have extra considerations.", "<b>Safeguarding</b> is wider than legal licensing: it is about keeping children and vulnerable adults safe from harm. Follow your institution’s safeguarding policy, ensure no one is alone with a child, carry out appropriate checks where needed, and know who the designated safeguarding lead is and how to report a concern. Brief the crew on behaviour and language. If a child or adult discloses a concern, follow the procedure and don’t investigate yourself."], ["I can say that children’s performances are regulated.", "I can explain that safeguarding goes beyond licensing and who the lead is.", "I can plan the licence, chaperone, hours and consent for a young performer.", "For a production I can predict the effect on the schedule and budget, test the plan with the institution, and justify the safeguarding measures."], [["Why does using a child performer affect the schedule?", "There are legal limits on hours and rest, plus requirements for chaperones and licences."], ["What should you do if you are worried about someone’s welfare?", "Follow your safeguarding procedure and tell the designated lead, and don’t investigate yourself."]], "cNb", "Plan a half-day shoot with a 12-year-old performer: list the licence, chaperone, hours, breaks and consents needed. Predict the effect on the schedule, then check with your institution.", [["read", "foundational", "Gov.uk guidance on child performance licensing", "Search: “gov.uk child performance licence”"]]], ["Fatigue and welfare", "Tired, hungry and stressed people make mistakes and get hurt, so welfare is part of safety and quality.", "You can plan a shoot that looks after people, and notice when it isn’t.", ["Film work often means long days, early starts, physical effort and pressure. <b>Fatigue</b> reduces concentration and reaction time and is a documented cause of accidents and errors, including drowsy driving after wrap. Welfare also includes food and drink, rest areas, temperature, toilets, access, mental wellbeing, respect and dealing with harassment or bullying.", "Plan for it: realistic days, proper meal breaks and drinks throughout, adequate turnarounds, transport options for tired people, a quiet space, and a culture where people can say they’re struggling. Check in with the team, and the 1st AD and producer should model good behaviour. Industry sources such as the Film and TV Charity’s Whole Picture Toolkit and Bectu provide guidance. A well-looked-after crew works better and returns."], ["I can say that fatigue and welfare affect safety and quality.", "I can explain what to provide and why turnarounds and meal breaks matter.", "I can build a welfare plan covering hours, food, rest and support for a shoot.", "For a production I can predict where welfare will fail, test the plan by asking the team, and justify the changes."], [["Why is the journey home after wrap a safety issue?", "Tired people are more likely to have accidents when driving."], ["Name three welfare provisions for a long shoot day.", "For example meal breaks, drinks and snacks, rest areas, adequate turnaround and a way for people to raise concerns."]], "cb", "Write a welfare plan for your shoot, including meals, breaks, rest, transport and how people can raise concerns. Ask three people what they would add, and predict what they will say first.", [["read", "foundational", "Film and TV Charity, Whole Picture Toolkit", "Search: “Whole Picture Toolkit film tv charity”"]]], ["Emergency procedures", "Everyone on set should know what to do in an emergency before it happens, because there is no time to work it out during one.", "You can plan and brief emergency arrangements for any shoot.", ["For every location, know: where the exits and assembly point are, where the first aid kit and a named first aider are, where the nearest hospital or emergency department is, how to call for help (including the exact address, because on location it is often unclear), who is the person in charge in an emergency, and what to do for fire, injury and evacuation. Locations may have their own procedures too.", "Brief everyone at the start of each shoot day, state the plan on the call sheet and production pack, and make sure the first aider is named and present. Check that mobile signal works and that someone is responsible for calling. Practise an evacuation if the location is complex. After any incident, record what happened (see Incident reporting). Your institution may have additional rules, and some activities need specialist cover."], ["I can say what to know about every location in case of an emergency.", "I can explain who is responsible and why briefing everyone matters.", "I can write the emergency section of a call sheet and brief a crew.", "For a location I can predict emergencies, test the plan by drilling it, and justify the arrangements."], [["What is easy to forget when calling an ambulance from a film location?", "The exact address or location details, which can be unclear on a remote or complex site."], ["Who should be named on every shoot day?", "A first aider."]], "JNb", "Write an emergency plan for your location with exits, assembly point, first aider, hospital and address details. Run a two-minute practice briefing and ask a listener to repeat the key points. Predict what they will forget.", []], ["Incident reporting", "Incidents, injuries and near misses should be recorded promptly and honestly so they can be dealt with and prevented.", "You can record and report incidents correctly and learn from them.", ["An <b>incident</b> is an accident, injury or damage, and a <b>near miss</b> is something that could have caused harm but didn’t. Both should be reported and recorded: what happened, when and where, who was involved, what was done, and who was told. Serious injuries may need to be reported formally to the relevant authority, and your institution will have its own reporting process and forms.", "Reporting should be encouraged and never punished, because you learn from near misses before they become accidents. Record facts, not blame. Make sure the injured person gets help first, secure the scene if needed, tell the designated person, and review the risk assessment afterwards. Keep records safely, with attention to privacy. Know the reporting process before you shoot."], ["I can say what an incident and a near miss are.", "I can explain why reporting is encouraged and what a record should contain.", "I can complete an incident report accurately for a given scenario.", "For a production I can design a reporting process, predict barriers to people reporting, test it, and justify what I include."], [["Why record near misses?", "They show hazards before someone is hurt, so the risk can be reduced."], ["What comes first at an incident?", "Helping the injured person, then recording and reporting."]], "JNc", "Take a fictional on-set accident and write the incident report with only facts. Swap with a partner who marks anything that sounds like blame or opinion. Predict how much they will find.", []], ["Location recces vs. tech scouts", "A recce checks whether a location suits the story and logistics. A tech scout checks, with the key crew, exactly how each department will work there.", "You can run both, say what each is for, and use their results to plan.", ["A <b>recce</b> (reconnaissance) is a site visit, usually by the director and producer or location manager, to assess whether a place is suitable and plan the shoot. A <b>tech scout</b> (technical recce) comes later, once the location is chosen, and brings the key heads of department to work out how they’ll use it. Problems found on a recce or tech scout cost nothing, while those found on the day cost a lot.", "On every visit, assess light (at the time of day you will shoot, and where the sun comes from), sound (traffic, aircraft, air conditioning), power, access (parking, load-in, a holding area for cast), health and safety, and continuity risk (will it look the same on shoot day?). Photograph and note everything. Each HOD should leave with a location-specific prep list, and the 1st AD updates the schedule. The Cinematography role covers this from the camera and lighting side."], ["I can say what a recce is and how a tech scout differs.", "I can explain what to assess at each visit and who attends.", "I can run a recce, record light, sound, power, access and safety, and produce a prep list.", "For a project I can plan recces and scouts, predict the problems they will reveal, test the plan against the shoot, and justify the changes."], [["How does a tech scout differ from a recce?", "A recce assesses suitability, while a tech scout brings the key HODs to a chosen location to plan how they’ll work there."], ["Why visit at the time of day you will shoot?", "Light, noise and activity change through the day, so a visit at another time may mislead."]], "hpb", "Recce a possible location at your planned shoot time. Record light, sound, power, access and hazards, and predict the three biggest problems for each department. Then ask each HOD to check the list.", []], ["Call sheets and daily logistics", "The call sheet is the main document of the shoot day. It tells everyone where to be, when, and what is happening.", "You can create a clear, accurate call sheet that gives everyone what they need.", ["A <b>call sheet</b> is issued the evening before each shoot day. It lists the general call time, location and address with parking and access details, the individual call times for each person (staggered according to when they are needed), scenes to be shot with cast and page counts, special requirements (props, vehicles, stunts, children), the weather forecast, sunrise and sunset, emergency contacts, nearest hospital, and notes about safety and catering.", "Accuracy is vital because everyone relies on it. Check addresses and times, include a map or pin, and send it in the usual way to everyone, with the most important changes highlighted. Confirm that people have received it. The call sheet is built from the schedule by the 1st AD with the production team, so check it carefully against the stripboard and the cast list. Poor call sheets cause late starts, confusion and arguments."], ["I can say what a call sheet contains and when it is issued.", "I can explain why individual call times are staggered and why accuracy matters.", "I can write a call sheet for a shoot day from a schedule.", "For a shoot I can predict the problems a call sheet will cause, test it with someone who didn’t write it, and justify the format."], [["Why are individual call times staggered?", "People are needed at different times, and staggering avoids waiting around."], ["Name five items on a call sheet.", "For example call time, address, scenes, cast, weather, emergency contacts."]], "hfs", "Write a call sheet for one day of your shoot. Give it to a colleague and ask them to find five facts. Predict how long it will take them and what they won’t find.", []], ["Cast and crew contact sheets", "A contact sheet lists how to reach everyone on the production, and holds private information that must be handled responsibly.", "You can build and share a contact sheet that is useful and respects privacy.", ["A <b>contact sheet</b> lists every cast and crew member with their role, phone number and email, and often includes emergency contacts, dietary requirements and, where needed, relevant medical information. It is used by the production team to reach people quickly and is usually part of the production pack.", "It contains personal data, so data protection applies: collect only what you need, tell people how it will be used, share it only with those who need it (for example, sensitive information such as medical details only with the people who need to act on it), store it securely, and delete it when the production is over if appropriate. Keep it up to date. Test that numbers work before the shoot, and keep a printed copy for when the signal fails."], ["I can say what a contact sheet is.", "I can explain what it should contain and why privacy rules apply.", "I can build a contact sheet and decide who sees which parts.", "For a production I can predict problems with contact information, test it by calling everyone, and justify my data-handling choices."], [["Why should medical information be limited to those who need it?", "It is sensitive personal data, and sharing it more widely breaks privacy rules and trust."], ["Why keep a printed copy?", "Signal and devices can fail on location."]], "hf", "Build a contact sheet for your cast and crew and test it by sending a message to everyone. Predict how many won’t reply in an hour, then count.", []], ["Production management systems", "A good system keeps documents, schedules and messages in one findable place, so the team always works from the current version.", "You can set up and use simple production management tools that people will actually follow.", ["A production generates a lot of documents: scripts and revisions, breakdowns, schedules, budgets, call sheets, contracts, risk assessments and reports. A <b>production management system</b> is the way you organise it: shared folders with clear naming, version control (always mark the date or revision), a master calendar, a checklist or task board, and a single channel for official messages. Software exists for scheduling, budgeting and call sheets, but a well-organised shared drive and a spreadsheet can work just as well.", "The best system is the simplest one that everyone uses. Agree it at the start, set naming and folder rules, say where official versions live, and make one person responsible for keeping it tidy. Don’t rely on chat or email alone to hold decisions. Check that everyone can open the files on their phones on set. Back everything up, and archive a clean copy at the end."], ["I can say what a production management system is for.", "I can explain version control, naming and a single source of truth.", "I can set up a shared folder structure, naming and calendar for a project.", "For a production I can choose and set up tools, predict how people will ignore them, test with the team, and justify the simplest system that works."], [["Why mark documents with a date or revision?", "So everyone knows which is the current version and avoids working from old ones."], ["Why is a simple system better than a complicated one?", "A tool that people don’t use is worse than a basic one that they do."]], "hfs", "Set up your project’s folder structure, naming rules and a task board. After a week, check who is using it and predict which part will be ignored.", []], ["Daily progress reports", "A daily progress report summarises what was shot each day against the plan, so the producer and editor know where the project stands.", "You can read and complete a daily progress report and use it to manage the project.", ["A <b>daily progress report</b> (DPR) is a summary produced each day, often by the script supervisor with the 1st AD and production office, covering scenes shot, pages shot, scenes completed, scenes remaining, time lost and why, wrap time, and any production notes such as problems or overtime. The producer uses it to see whether the shoot is on schedule and budget, and the editor to follow what has been captured.", "Accuracy and speed matter: produce it at wrap while memories are fresh, record the real reasons for delays, and share it consistently. Over several days it shows trends (for example, a consistently late start) that tell you to change something. It also provides a record if there is a dispute, and a source of estimating data for future schedules. See also the script supervisor’s version in that role."], ["I can say what a daily progress report is.", "I can explain who uses it and what it tells them.", "I can complete a DPR for a shoot day, including reasons for delay.", "For a production I can use the DPRs to predict the shoot’s outcome, test my forecast, and justify decisions to catch up or cut."], [["What does a DPR tell the producer?", "Whether the shoot is on schedule and budget, and why not if it isn’t."], ["Why record the reasons for delays?", "They show patterns to fix and give a record if there is a dispute."]], "hp", "Fill in a DPR for a practice shoot day. Predict, from the first day, how many days the full shoot will really take, and check against later reports.", []], ["Wrap paperwork", "At the end of the shoot, wrap paperwork closes the production: returns, reports, payments, handovers and records.", "You can close a shoot properly so nothing is left loose.", ["<b>Wrap</b> is the end of a shooting day or the whole production. For the day it means the 1st AD calls it, equipment is checked and packed, locations are left as found, and reports are completed. For the whole production, wrap paperwork includes returning equipment, settling invoices and expenses, final timesheets or payments, location sign-offs, collecting all reports and logs, archiving contracts and releases, and thanking people.", "Leaving a location properly is part of your reputation: tidy up, check for damage or lost items, get the owner’s sign-off, and return keys. Make a final cost report and a record of any deferral promises. Hand all documents to post (sound reports, camera reports, continuity notes) and archive the production records in a place you can find later. A good wrap makes it easier to work with the same people and locations again."], ["I can say what wrap means and a few things done at wrap.", "I can explain why leaving a location properly matters.", "I can create and complete a wrap checklist for a day and for the whole production.", "For a production I can predict what will be forgotten at wrap, test my checklist, and justify what I include."], [["Name three things done at the end of a shoot day.", "For example check and pack equipment, leave the location as found, and complete reports."], ["Why get a location owner’s sign-off at wrap?", "It shows you left it in good order and prevents later disputes."]], "hf", "Write a wrap checklist for a shoot day and for the production. Use it on a practice shoot and predict which item will be missed, then record what was.", []], ["Set etiquette and protocols", "Set etiquette is the shared set of habits (who speaks to whom, when to be quiet, how to move) that lets a crew work fast and safely.", "You can follow and explain set etiquette, and teach it to people who are new to set.", ["A set works because people follow shared habits. Communicate through the right channel (requests about the schedule or the director go through the 1st AD, and department business goes through the head of department), keep quiet and still when the 1st AD calls for it, don’t walk through a shot or a hot set, and don’t touch other departments’ equipment. Know the standard calls: ‘quiet on set’, ‘rolling’, ‘cut’, ‘checking the gate’, ‘moving on’, ‘wrap’. Know the slang too, such as ‘martini shot’ (last shot of the day) and ‘Abby Singer’ (second to last).", "Etiquette is also about respect: arrive early, listen, introduce yourself, ask before assuming, speak politely, don’t gossip, and take responsibility for mistakes. A <b>hot set</b> is a dressed set that must not be disturbed. Brief newcomers (including extras and visitors) at the start of the day. Good etiquette is not rigid hierarchy: it keeps the working space safe and efficient and lets creative people concentrate."], ["I can name some standard calls and what they mean.", "I can explain who communicates through whom and why quiet and hot sets matter.", "I can follow and explain set etiquette on a practice shoot, and brief a newcomer.", "For a production I can design a short briefing on etiquette, predict where it will be broken, test it, and justify what I include."], [["Why do requests about the schedule go through the 1st AD?", "The 1st AD controls the plan, so changes through other routes cause confusion and missed knock-on effects."], ["What does ‘hot set’ mean?", "A dressed set that must not be disturbed, because moving items can break continuity."]], "bfj", "Write a one-page set etiquette briefing for newcomers and deliver it in two minutes. Ask a listener to list what they remember, and predict the three points they’ll forget.", []], ["Floor management and pacing", "The 1st AD keeps the set moving: the right people ready at the right time, at a pace that is fast enough and still safe.", "You can manage the flow of a shoot day, keep the pace and protect quality.", ["Floor management means keeping track of everything happening on set and moving the day forward. The 1st AD watches the time against the schedule, tells departments what is coming (‘next setup is…’) so they can prepare early, makes sure cast are ready (make-up, costume, rehearsal), and calls the crew in the right order. They also decide when to push on and when to give a team the time it needs.", "Pace is a skill. Too slow and the day runs out. Too fast and mistakes happen, performances are rushed and people are stressed. Work ahead by pre-lighting and pre-rigging the next setup, keep an eye on the day’s priorities, and make clear calls. Keep communications calm and brief, never shout. Check with department heads before deciding the day is on track, and tell the director and producer early when it isn’t."], ["I can say what floor management is.", "I can explain how to keep pace without rushing.", "I can run a practice shoot’s floor, keeping the schedule and calling departments in order.", "For a shoot I can predict where time will be lost, test my approach, and justify the decisions I make about pace."], [["How does a 1st AD help departments prepare early?", "By telling them what is coming next, so they can pre-light, pre-rig and be ready."], ["Why is rushing a risk?", "Mistakes, rushed performances and safety issues increase, costing more than the time saved."]], "bfp", "Run a mock shoot day with three setups. Use a stopwatch to compare planned and actual times, and predict where you’ll lose time. Afterwards ask each department what you could have told them earlier.", []], ["Turnover sequence", "The turnover sequence is the standard set of calls that gets everyone ready, recording, and acting in order.", "You can run the sequence clearly and know what each call means for each department.", ["Before a take the 1st AD calls for quiet and asks the departments to confirm they are ready. A common sequence is: <b>quiet on set</b>, <b>turnover</b> (start rolling), <b>speed</b> (sound and camera confirm they are recording at speed), the slate is clapped, and the director calls <b>action</b>. After the take the director calls <b>cut</b>, and the 1st AD may check if everyone is happy to move on. The precise calls and order vary between productions and countries (some add ‘roll sound’, ‘roll camera’ or ‘mark it’), so agree yours at the start.", "Each call matters to a department: sound needs time to roll and reach speed, camera likewise, the slate operator needs to be ready, and cast need a moment to prepare. Don’t skip steps to save time because the cost is often a lost take. Call clearly and calmly, wait for confirmations and use the same sequence all day. Brief newcomers. See Slating in the sound role for the sound department’s view."], ["I can say the standard turnover sequence.", "I can explain what each call asks of each department.", "I can run the sequence with confirmations on a practice shoot.", "For a shoot I can agree a sequence with the crew, predict where it will break down, test it, and justify any variations."], [["Why wait for ‘speed’ before the slate and action?", "Sound and camera need to be recording stably, otherwise the start of the take is lost."], ["Why agree the sequence at the start of a shoot?", "Calls vary, and everyone needs to know exactly what theirs mean."]], "bf", "Run the turnover sequence five times on a practice setup with a camera and sound recorder. Predict which call will be missed or mistimed first, then check the recordings for lost starts.", []], ["Managing background and extras", "Background performers (extras) fill the world of a scene, and they need clear direction, care and organisation, especially on small films.", "You can plan, brief and manage background so they help rather than hinder a scene.", ["<b>Background</b> artists add realism and scale. They cost time and money (catering, costume, supervision, releases) and take careful management. Plan how many you really need, and where you can use fewer, camera tricks, or well-placed crew and friends. Check what the location can hold and ensure safety and welfare, with a holding area, drinks and toilets.", "Brief them clearly: where to go, what to do, what not to do (don’t look at the camera, keep movement consistent between takes), and when to stop. A background co-ordinator or an AD should lead them, with the 1st AD giving cues. Collect signed releases before shooting, track their positions for continuity, and thank them. Keep waiting time short, because bored extras lose focus and quality drops. Cue them separately from principal action."], ["I can say what background performers are.", "I can explain what they cost and how to brief them.", "I can plan and brief a small group of extras for a scene, with releases and holding.", "For a scene I can predict the problems with background, test my briefing, and justify the numbers and how I reduce cost."], [["Why track background positions between takes?", "So the scene matches across takes and setups."], ["Why keep extras’ waiting time short?", "They lose focus and energy, which shows on screen and affects welfare."]], "hpb", "Plan a café scene with ten background performers using only four people. Predict how you will make it look full, then test it with a camera and see how well it works.", []], ["Rehearsal-to-camera workflow", "The sequence from blocking and rehearsal to lighting, a last rehearsal and the take is how the day gets its structure.", "You can organise the flow of a setup so each department has the information and time it needs.", ["A typical setup runs: the director and actors <b>block</b> the scene, the 1st AD and HODs watch it and ask questions, actors go to make-up and costume while the crew <b>light and rig</b> (using stand-ins if needed), then a <b>final rehearsal</b> to check everything including sound and camera movement, and then the <b>take</b> follows the turnover sequence.", "The 1st AD organises this, making sure the right people are watching the blocking, the actors are ready when the set is, and everyone has time to adjust. The more efficient the rehearsal, the shorter the time actors wait. Don’t skip the technical rehearsal: boom shadows, focus marks and radio mic positions are often only found then. Pass information to HODs promptly, such as a change in blocking."], ["I can list the stages from blocking to the take.", "I can explain what each department does while the others work.", "I can run a setup with blocking, lighting, final rehearsal and a take on a practice shoot.", "For a shoot I can predict where the workflow stalls, test it, and justify changes to who is where and when."], [["Why do HODs watch the blocking?", "So they know what the shot needs (light, focus, boom, props) before they set up."], ["Why do a final rehearsal after lighting?", "To catch problems such as boom shadows, focus issues and microphone positions before the take."]], "bf", "Time one setup with a clear workflow (block, light, final rehearsal, take) and note waits for each person. Predict who waits longest, then check and propose one change.", []], ["Communicating with every department", "The 1st AD is the information hub: telling each department what they need to know, when they need it, in a form they can use.", "You can give brief, clear and well-timed information to each department.", ["Each department needs different information. Camera needs the next setup and shot, lighting needs to know about the blocking and time, sound needs to know who is speaking and where, art needs to know what is in shot, and cast need to know when they’re needed. Information should be specific (who, what, when), brief and given at the right time (early enough to be useful).", "Use a consistent channel: for example short radio calls (walkie-talkies) for the crew and direct conversation for sensitive points. Check that it has been understood (ask for confirmation), speak calmly, and listen. Pass along changes to everyone affected. Personal respect and a clear tone help difficult messages. Good communication prevents waiting and mistakes more than anything else."], ["I can say that each department needs different information.", "I can explain why messages should be specific, brief and timely.", "I can give clear updates to departments on a practice shoot and check they understood.", "For a production I can design a communication plan, predict where messages will fail, test it, and justify the channels."], [["Why ask for confirmation of a message?", "To check it has been received and understood, so mistakes don’t happen."], ["Why give information early?", "So departments can prepare before the set is waiting for them."]], "fbj", "On a practice shoot, write down every message you give to each department. Predict which messages will be misunderstood, then check by asking the recipients to repeat them.", []], ["Hiring and crewing", "Choosing the right people, early enough and with clear expectations, is the producer’s most important job.", "You can build a crew by priority, check their suitability, and set expectations in writing.", ["Hire in the order that determines other decisions: the <b>1st AD</b> (who needs the most time to build the schedule), then the <b>DP</b> (who influences locations and equipment), the <b>production designer</b> (who needs time to source and build), and the <b>sound recordist</b> (often with their own kit, so confirm availability early). Below-the-line crew (gaffer, grip, hair and make-up, costume, production assistants) are confirmed once there is a provisional schedule, so you know the dates.", "Look at people’s previous work, not just a showreel, and ask who they have worked with. Ask HODs who they like working with, because established relationships are more efficient. Use industry sites, college networks and recommendations. Check availability, willingness to work on the terms offered, and attitude. Confirm with a written deal memo before any work begins. A mix of experience matters, and everyone’s role must be clear."], ["I can say which crew to hire first and why.", "I can explain why previous work and relationships matter.", "I can create a hiring plan with priorities, dates and a deal memo for each role.", "For a project I can predict hiring difficulties, test my plan by approaching candidates, and justify my choices."], [["Why hire the 1st AD early?", "They need the most lead time to build the schedule, which affects everything else."], ["Why confirm below-the-line crew only after a provisional schedule?", "Without dates you can’t know if they’re available or how many days you need them."]], "hpj", "Create a crew list for your project in priority order, with the date you must confirm each role. Predict which role will be hardest to fill, then try to fill it.", []], ["Briefing HODs", "A good briefing gives heads of department the script, the plan, the limits and the support they need to do their best work.", "You can brief a head of department so they know what is wanted, what is possible, and who decides.", ["HODs make better decisions when they know the whole picture. A briefing covers the story and tone, the director’s vision, the schedule and shoot days, the budget they have and how to spend it, the deliverables expected and the deadlines, who they report to and who else they should coordinate with, and the rules (safety, behaviour, communication). Send material before the meeting so the discussion is useful.", "Listen as well as tell: HODs know their field and often see problems and opportunities you don’t. Agree what they will bring to you for decisions and what they can decide themselves. Record the outcomes in writing, check understanding and follow up. Brief them again whenever things change significantly. Weak briefings create wasted work, surprise costs and conflict."], ["I can say what a briefing should cover.", "I can explain why to listen as well as tell and agree decision limits.", "I can prepare and run a briefing for one HOD with written outcomes.", "For a project I can predict the questions each HOD will ask, test the briefing on them, and justify changes."], [["Name four things to cover when briefing a HOD.", "For example story and tone, schedule, budget, deliverables, reporting lines and rules."], ["Why record the outcomes of a briefing?", "So there is a shared understanding of what was agreed and nobody has to remember it."]], "pfh", "Prepare and deliver a 15-minute briefing to a head of department. Predict their three main questions, then compare with what they ask and note what your briefing missed.", []], ["Negotiating logistical and creative needs", "Creative wants and logistical limits often collide. Negotiation finds a workable answer that respects both.", "You can broker a solution between a creative request and a practical constraint.", ["Directors and HODs want ambitious things that the schedule, budget or location may not allow. The producer or 1st AD’s job is not to say no, but to find the version that works. Start by understanding the underlying need (what is the shot or effect for?), be clear about the constraint (time, money, safety, the law), and explore options: a cheaper way of achieving the effect, a different time, simplifying something else, or accepting a trade-off knowingly.", "Stay calm, factual and respectful. Put options in front of people with their costs and consequences, and let the decision-maker choose. Agree what to do and write it down. Know your limits: safety and legal issues are not negotiable. Learn from how experienced people do it, and keep the long-term relationship in mind, because you will work with these people again."], ["I can say that a good solution respects both a creative need and a practical limit.", "I can explain how to find the underlying need and offer options with consequences.", "I can role-play a negotiation between a request and a constraint and reach a workable plan.", "For a project I can predict conflicts, prepare options, test them in a role-play, and justify what is and isn’t negotiable."], [["What should you find out first when a creative request seems impossible?", "The underlying need: what the shot or effect is for."], ["Which kinds of issue are not negotiable?", "Safety and legal requirements."]], "mfj", "Role-play with a partner: the director wants a night exterior with fire; you have a small budget and limited time. Predict three options before the meeting, then compare with what you agree.", []], ["Mediating conflict in production and pre-production", "Disagreements happen on every project. Early, fair handling stops them damaging people, safety or the film.", "You can notice conflict early, listen to each side, and help people reach a workable outcome.", ["Conflict is common where people are under pressure with different priorities. Sources include unclear roles, tight schedules, money, creative disagreement, fatigue and personality clashes. Early signs are silence, short answers, avoiding someone, gossip and mistakes. The earlier you deal with them the easier they are to resolve.", "Meet people privately, listen to each side separately and ask open questions, separate facts from feelings, and look for shared aims. Help them agree on specific next steps, write them down, and follow up. Keep your own opinions out of it, and don’t take sides publicly. Escalate if there’s bullying, harassment or safety problems: follow the institution’s procedures and the relevant support routes (the Film and TV Charity and unions offer support). Welfare must always come before getting on with the day."], ["I can say what often causes conflict on productions.", "I can explain why early action and listening matter.", "I can run a structured private conversation with someone in a dispute.", "For a project I can predict where conflicts will occur, test my approach in a role-play, and justify when I would escalate."], [["Why talk to each side separately first?", "People speak more openly, and you can separate facts from feelings before bringing them together."], ["When should you escalate instead of mediating?", "With bullying, harassment or safety issues, following formal procedures."]], "mfc", "Role-play a dispute between a director and a producer over an extra shooting day, with a partner observing. Predict how it will go wrong, then discuss what worked in the observer’s notes.", []], ["Translating intent into schedule", "A director’s vision has to become a day-by-day plan. The 1st AD translates what the director wants into time, order and resources.", "You can turn a creative intention into a workable schedule without losing what matters.", ["Directors think in scenes, moods and priorities. The 1st AD thinks in setups, hours and people. The skill is to ask the director which scenes and shots matter most, how much time each deserves, and what they could live without, and then to build a schedule that protects those priorities. Prioritise the scenes that carry the story, and keep the flexibility in less important coverage.", "Show the director the schedule in a form they can understand, explain the trade-offs, and invite reactions early. Ask for the shot list and storyboard in good time, and keep both in front of you while scheduling. When the schedule changes, explain what was lost and what was kept. Over time, learn how the director works, whether they need more time on performance or on camera, and plan accordingly."], ["I can say that the 1st AD translates creative priorities into time.", "I can explain how to find the director’s priorities and protect them.", "I can build a schedule from a shot list that protects the director’s key scenes.", "For a project I can predict where creative and schedule priorities will clash, test the plan with the director, and justify my trade-offs."], [["What should you ask a director before scheduling?", "Which scenes and shots matter most, how much time they need, and what could be dropped."], ["Why show the director the schedule early?", "Their reactions reveal problems with priorities while changes are still cheap."]], "pfh", "Interview a director about their top three scenes. Build a one-day schedule protecting them and predict which they’ll want more time for. Then present it and record their response.", []], ["Managing expectations", "Expectations managed early prevent disappointment later. Tell people honestly what is possible, and when it changes.", "You can set realistic expectations with the team, funders and cast, and update them honestly.", ["People’s expectations (of the budget, the scale, the schedule, credit, pay or the finished film) shape how they feel later. If they are unrealistic, disappointment follows. Producers and ADs manage them by being honest from the start about constraints, being specific about what is promised and what is not, and putting things in writing.", "When things change, tell people quickly and directly, explain the reason and the plan, and don’t hide bad news because it only grows. Under-promise and over-deliver, and never promise what you can’t guarantee. This applies to crew, cast, the director, funders and crowdfunding backers. Keep a record of promises made. Trust is built by reliability, and it is the main thing a producer has."], ["I can say why honest expectations matter.", "I can explain how to set and update them.", "I can write a short, honest message to a team about a change.", "For a project I can predict where expectations will diverge, test my communications on the people involved, and justify what I promise."], [["Why is hiding bad news a mistake?", "It grows over time and damages trust, and people lose the chance to help."], ["What does ‘under-promise and over-deliver’ mean in production?", "Promise what you’re sure of and exceed it, instead of overpromising and disappointing."]], "mfj", "List every promise your project has made (to crew, cast, funders, backers). Predict which you may not keep, and write a short honest message about one of them.", []], ["Tact and authority", "Running a set needs a firm voice and a respectful manner. The aim is to be clear and trusted, not to shout.", "You can lead with authority without losing goodwill.", ["Authority on set comes from clarity, preparation and fairness, not volume. People follow someone who knows the plan, makes decisions promptly, explains when they can, and treats everyone respectfully. A 1st AD often has to tell people what to do, including senior colleagues, so tone matters: be direct and calm, give reasons where there is time, say please and thank you, and never humiliate anyone in public.", "Tact is knowing when and how to say something: private for criticism, public for praise, and short in the moment. If you make a mistake, admit it. Be consistent, because inconsistent rules breed resentment. Stay calm when others panic, since your behaviour sets the tone. Watch for the line between firm and bullying, and remember that people’s welfare and safety come before the schedule."], ["I can say what separates authority from shouting.", "I can explain when to give criticism privately and why consistency matters.", "I can give a firm instruction politely and handle a disagreement calmly.", "For a production I can predict where my authority will be tested, test responses in role-play, and justify the approach I take."], [["Where should criticism usually be given?", "Privately, with praise given publicly."], ["Why is staying calm important when others panic?", "Your behaviour sets the tone for the whole set."]], "fjb", "Role-play giving three firm instructions on set to a friendly partner (stop work, change position, hurry up). Ask for feedback on tone, and predict which instruction will sound worst.", []], ["Contingency planning", "Contingency planning means deciding in advance what you will do when the likely problems happen.", "You can identify the main risks to a production and prepare responses before they occur.", ["Every production faces predictable problems: weather, illness, equipment failure, a location pulling out, actors unavailable, a late start, a missing person or a data loss. <b>Contingency planning</b> lists the most likely and most damaging of these, estimates how bad each would be, and decides what to do. A simple risk register has columns for the risk, likelihood, impact, prevention, and the plan if it happens.", "Some answers are preventive (back up media, have a second equipment source, check the forecast), some are fallback (an indoor cover set, a spare actor on call, a later date) and some are decisions about what you would cut. Share the plan so people know what to do, and keep contact details to hand. A plan you have thought about in calm conditions is far better than one invented under pressure. It is not the same as the financial contingency, which pays for the consequences."], ["I can say what contingency planning is and give examples of common risks.", "I can explain a risk register and the difference between prevention and fallback.", "I can build a risk register for a shoot with a plan for each major risk.", "For a project I can predict the highest risks, test my plans by simulating one, and justify my priorities."], [["What two things do you estimate for each risk?", "How likely it is and how serious the impact would be."], ["How does contingency planning differ from the budget contingency?", "Planning decides what to do, while the budget contingency pays for the cost."]], "pmh", "Build a risk register with ten risks for your shoot. Predict the three that will actually occur, then check afterwards. Simulate one on paper with the team.", []], ["Weather cover", "Weather cover means having a plan, usually an indoor or alternative scene, for when exteriors can’t be shot.", "You can plan for weather so that a bad forecast costs a few hours and not a day.", ["Weather affects exteriors in many ways: rain, wind (which affects sound as well), cold and changing light and continuity. A <b>cover set</b> is an interior or sheltered location to move to if the weather prevents the planned exterior scene. The schedule should include cover sets for exterior days, and the relevant departments should be ready for the change.", "Check forecasts regularly in the days before and on the day, and agree a decision point (such as ‘we call it at 7am’). Have equipment for weather protection (covers, tarps, umbrellas, towels), consider whether continuity allows a different weather, and plan for what happens if a whole exterior day is lost. Make sure insurance and permits allow for rescheduling. Safety comes first in severe weather."], ["I can say what a cover set is.", "I can explain what weather affects and why a decision point is agreed in advance.", "I can add a weather cover plan to a schedule for each exterior day.", "For a shoot I can predict the weather risk, test my plan against a forecast, and justify the cover choices."], [["What is a cover set?", "An alternative indoor or sheltered scene to shoot if weather stops the planned exterior."], ["Why agree a decision point on weather?", "So the call is made in time for people to prepare, not left until everyone is waiting."]], "hp", "For each exterior scene in your film, name a cover scene and what it needs. Predict how many exterior days will be affected by weather, then compare with a historical forecast for the dates.", []], ["Plan B and what to cut", "When you fall behind, you need to know in advance which shots and scenes can go, and who decides.", "You can prepare a priority list so cuts are chosen calmly and protect the story.", ["Schedules slip. Decisions about what to drop are far better made in advance, in discussion with the director, than in a panic at 4pm. Rank scenes and shots into <b>essential</b> (the film doesn’t work without them), <b>important</b> and <b>nice to have</b>. Think about simplifying coverage, combining setups, using a wider shot instead of two, or using a location pick-up later.", "Agree who makes the call (usually the director with the 1st AD and producer), and what triggers it (for example, being a set number of hours behind at lunch). When it happens, explain the change to the crew, and keep morale up. Record what was cut, so that if there’s a chance to shoot pick-ups later you know what to restore. Keep the plan realistic: having a Plan B is not an admission of failure."], ["I can say why cuts are planned in advance.", "I can explain a priority ranking and who decides what to drop.", "I can create a ranked list of scenes and shots with a trigger point for cutting.", "For a shoot I can predict where we’ll fall behind, test the ranking with the director, and justify the cuts."], [["Why decide what to cut before the day?", "Decisions made calmly with the director protect the story, whereas panic decisions often cut the wrong things."], ["What triggers a Plan B?", "An agreed condition, such as being a certain amount behind schedule at a set time."]], "mph", "Rank every scene in your film as essential, important or nice to have. Predict which three will be cut if you lose a day, then discuss with the director and compare.", []], ["Must-have shots", "Must-have shots are the ones the film cannot work without, which you protect throughout the day.", "You can identify them with the director and schedule around them.", ["Every scene has shots without which it won’t cut together or tell its story: the key moment of performance, the shot that sets the geography, a crucial insert. The director, DP and 1st AD should identify them in advance (see the shot list) and ensure they are done in good time, with the best conditions, a fresh cast and crew and enough time, not left to the end of the day.", "As the day progresses, keep a short list of what has been captured and what is still needed, maintained with the script supervisor. If time is running short, drop the nice-to-have shots, not the must-haves. Check with the director before moving on, because they may have changed their mind. Don’t leave a location until the must-haves are done, because going back is expensive."], ["I can say what a must-have shot is.", "I can explain why they are protected and checked before moving on.", "I can list must-have shots for a scene and schedule them early.", "For a day I can predict which must-haves are most at risk, test my approach with the director, and justify my choices."], [["Why not leave must-have shots to the end of the day?", "Time and energy run low, and if something goes wrong they are lost."], ["Who helps keep track of what has been shot?", "The script supervisor, with the 1st AD."]], "pm", "Pick a scene from your film and mark its must-have shots with the director. Predict what would be missing if you lost an hour, then simulate by cutting the schedule short.", []], ["Recovering lost time", "When a day goes behind, you can claw back time by changing how you work, not by rushing everything.", "You can find realistic ways to recover time without losing safety or quality.", ["Time is lost to late starts, slow setups, long rehearsals, technical problems, weather, and indecision. To recover it: find out where it went, tell the director and department heads clearly, and pick options such as pre-lighting the next setup, shooting two setups in parallel with a second camera or unit, combining shots, shortening a meal break (within the rules), simplifying coverage, or moving a scene to another day.", "Don’t cut safety checks, breaks required by regulation, or rest. Avoid pushing rushed performances. If the delay can’t be recovered in the day, decide early what to move or cut rather than letting everything slip. Learn from the cause: if the same problem recurs, change the schedule. Be honest with the producer about the effect on budget and plan the cost of overtime."], ["I can name common causes of lost time.", "I can explain realistic ways of recovering it and what should never be cut.", "I can propose recovery options for a late day, with consequences.", "For a shoot I can predict where time will be lost, test recovery options with the team, and justify which I choose."], [["Name two ways to recover time without rushing performances.", "For example pre-lighting the next setup, combining shots or shooting with two cameras."], ["What should never be cut to save time?", "Safety checks and legally required breaks and rest."]], "pmf", "Take a practice schedule and cut an hour at midday. List three recovery options with their consequences, and predict which the director will accept. Then discuss with them.", []], ["Post-production handover", "Handover is passing everything post needs, in good order and with clear documentation, so the edit can start without chasing.", "You can plan and complete a handover that post can trust.", ["At the end of the shoot, the production hands over footage, sound, and documentation to editing and post-production: camera and sound files with verified backups, camera reports, sound reports, continuity notes and daily reports, lined script and editor’s log, the shot list and any LUTs or colour notes, and a list of problems and wild tracks. Each department has its own deliverables (see Understanding the deliverables of each department).", "A good handover is planned in advance with the editor and post supervisor: agree formats, folder structure, naming, and what they need first. Check it from their side: could someone who wasn’t there use it? Keep a copy of everything and record what was delivered. Problems at handover (missing files, unlabelled cards, mismatched reports) are expensive and often avoidable with checklists. The DIT and sound roles in the hub cover their parts."], ["I can say what is handed over to post.", "I can explain why the handover is planned with the editor.", "I can complete a handover checklist and test it from the editor’s side.", "For a production I can predict what will go missing, test the handover with an editor, and justify the format and process."], [["Name five things handed to post-production.", "For example camera and sound files, camera and sound reports, continuity notes, the lined script and an editor’s log."], ["How can you test a handover?", "Ask someone who wasn’t on the shoot to find and use a take from the documents alone."]], "hpl", "Create a handover checklist and run it on a practice shoot. Give the result to an editor and predict what they will ask for, then record their actual questions.", []], ["Deliverables and technical specs", "Distributors, festivals and funders each require specific files and documents, in exact formats, and the requirements start earlier than you think.", "You can find the delivery requirements for a project and plan to meet them.", ["A finished film has to be delivered in the form its audience needs. Festivals, broadcasters, platforms and funders each publish technical specifications: picture format and frame rate, resolution and codec, sound mix and loudness, subtitles, running time, file naming, and supporting documents such as a music cue sheet, a credits list, chain of title and clearance documents, stills, a synopsis and posters. Some require specific formats or tests.", "Find the requirements early, because they affect choices made in production (frame rate, aspect ratio, sound format) and budget (subtitling, mastering, extra mixes). Keep a delivery checklist per destination. Check the actual files by playing them, and check that all legal documents are in place. Missing a delivery item can delay a screening or a payment, so plan time to fix errors."], ["I can say that each destination has its own specifications.", "I can explain why requirements affect decisions made during production.", "I can create a delivery checklist for a festival from its published requirements.", "For a project I can predict where the film will fail a specification, test the files, and justify choices made to meet different destinations."], [["Why check delivery requirements early?", "They affect production choices such as frame rate and sound format, and the budget for mastering and subtitles."], ["Name three documents a festival or distributor may ask for.", "For example a credits list, music cue sheet, clearance documents, chain of title, stills and a synopsis."]], "hlm", "Choose three festivals and list each one’s technical and document requirements. Predict where your film would fail, then check your files and note the gaps.", []], ["Festival strategy", "Festivals are a way for a film to be seen and noticed. A strategy chooses where to send it, when and in what order, within a budget.", "You can plan a realistic festival submission strategy for a short film.", ["Festivals vary in size, type and prestige. Some premiere requirements mean that a film can only be entered in some festivals if it has not been shown elsewhere. Submissions cost money (fees per festival), so a strategy picks where your film fits (genre, length, region, student categories), when deadlines fall and in what order to enter, often starting with the most prestigious and those requiring premieres, then moving down.", "Prepare a package: a clean screener, stills, a synopsis, a short biography, a trailer and a credits list. Use submission platforms and check each festival’s rules and track results. Budget for fees and plan for rejection, which is the usual outcome, so be patient. A realistic plan aims for several suitable festivals, and for screenings that bring useful audiences and contacts."], ["I can say what a festival strategy is for.", "I can explain premiere rules, fees and ordering.", "I can build a festival list and a timeline with deadlines and fees for a short film.", "For a film I can predict which festivals suit it, test the plan against the criteria, and justify the order and budget."], [["Why do premiere rules matter when choosing festivals?", "Showing the film elsewhere first can make it ineligible for festivals that demand a premiere."], ["Why plan for rejection?", "Most submissions are rejected, so budgets and timelines should expect it."]], "mlc", "Research ten suitable festivals for a short film (genre, length, student category). Predict how many will accept it, then draw up an order, with fees and deadlines.", [["read", "foundational", "Short of the Week and festival submission platforms", "Search: “Short of the Week festival guide”, “FilmFreeway”"]]], ["Marketing materials", "Marketing materials (trailer, poster, stills, synopsis) make a film easy to promote, and most are made during the shoot.", "You can plan the materials that you need for festivals and audiences, and capture them while you can.", ["A film needs a small set of materials: a <b>synopsis</b> (short and long), a <b>poster</b>, <b>stills</b> from the film and behind the scenes, a <b>trailer</b> or teaser, a <b>press kit</b> (credits, biographies, director’s statement), and social media assets. They are used by festivals, press, backers and distributors, and for your own showreel and CV.", "Plan them in production: arrange a stills photographer or take behind-the-scenes photographs and short video at each location, and ask for permission and releases. Keep high-quality originals and organise them. Write a clear, honest synopsis and a one-line logline. Good materials make it easier for others to talk about your film, and they should reflect its tone. Check that every image and font is licensed for your use."], ["I can name the main marketing materials.", "I can explain why they are planned during production and need releases and licences.", "I can plan and make a basic set of materials for a short film.", "For a film I can predict what each audience will need, test the materials on real viewers, and justify the choices."], [["Why plan marketing stills during production?", "Capturing images at the time is much easier than recreating them later."], ["What should you check about images and fonts used on a poster?", "That they are licensed for your use."]], "ml", "Write a one-line logline, a short synopsis and a poster concept for your film. Ask three strangers what kind of film it is, and predict their answers before checking.", []], ["Audience and release routes", "Where and how a film reaches people (festivals, online, broadcast, cinema, community screenings) shapes what it earns and who sees it.", "You can compare release routes and choose one that fits the film and its aims.", ["A film can reach an audience in several ways: festivals, online platforms (a channel of your own, or a curated site), community or educational screenings, television, streaming services and cinema. Each has a different audience, income, rights and timing. For most short films, the realistic aims are recognition, a showreel, career connections and sometimes a small income, not major distribution.", "Think about <b>rights and exclusivity</b>: putting a film online early may close off festivals and some sales, and any licence can limit other uses. Match the route to your aims (a career calling card, social impact, or income) and the film’s audience. Industry bodies such as the BFI and PACT publish information on distribution. Keep records of where the film has been shown and what was agreed."], ["I can name common release routes for a film.", "I can explain that each has different audiences, rights and timing.", "I can compare routes against the aims of a project and choose a sensible sequence.", "For a film I can predict the effect of each route on later options, test the plan against what others did, and justify my choice."], [["Why might putting a film online early be a problem?", "It can make the film ineligible for festivals that want premieres, and limit other sales."], ["What are realistic aims for most short films?", "Recognition, a showreel, connections and sometimes a small income, rather than large distribution."]], "lmc", "Choose a recent short film that succeeded and trace how it reached audiences. Predict the release route you’d choose for your own film and why, then discuss it with a tutor.", []]];
YR.dir=[["Theme as driving creative decisions", "Theme is the question the film explores beneath its plot. A director uses it as a test for every creative choice.", "You can state a film’s theme, and use it to choose between options in casting, design, camera and sound.", ["<b>Theme</b> is the central idea or question a film explores beneath its plot. It is not a moral or message, but an inquiry about human experience that the story examines through its characters (for example, what loyalty costs, or whether people can change). Stating it clearly gives the director a way to decide: for any choice (a location, a lens, a costume colour, a line reading) you can ask whether it serves the theme.", "A theme is usually found by working with the logline and the script, asking what the story is really about and what the character learns or fails to learn. It is best stated as a question or a short sentence that you can test, not a single word like ‘love’. Share it with your heads of department so that their decisions work together, without turning every scene into a lecture. A theme that is present in every decision gives a film unity."], ["I can say what theme is and that it is different from plot.", "I can explain how to state a theme as a question and why it is not a moral.", "I can state the theme of a script and give examples of how it should affect three different departments’ choices.", "For a film I can use the theme to choose between two options in each department, predict their effect, test them on a sample audience, and justify what I kept or rejected."], [["Why state a theme as a question and not a single word?", "A question can be tested against decisions, while a word like ‘love’ is too broad to guide choices."], ["Give an example of using theme to choose between two options.", "For example if the theme is isolation, choosing a wide frame that leaves the character small in the space over a tight frame that makes them feel close to us."]], "KaB", "Write the theme of a short film you admire as a question. Predict three choices that serve it, then watch and check. Do the same for your own film, then use it to decide one real creative choice.", []], ["Character: motivation, objective, obstacle", "Every character wants something, for a reason, and something stands in their way. Directing starts there.", "You can analyse a character’s motivation, objective and obstacle in each scene, and use them to direct.", ["<b>Motivation</b> is why a character wants something, <b>objective</b> is what they want in the scene, and <b>obstacle</b> is what stands in the way (another character, a circumstance or their own flaw). A scene has drama when a character pursues an objective against an obstacle, and each scene has a different objective. Objectives should be specific, active and about another person if possible (‘to make her admit she lied’, not ‘to be angry’).", "Do this analysis scene by scene before rehearsal, then share it with the actors and ask them for theirs. It gives you a shared language for notes, such as ‘what are you trying to get from him here?’, which is more useful than describing an emotion. It also helps with the stakes: if nothing is at risk, there is no drama. The writer’s work on character and the actor’s work on a role overlap with yours, so treat the analysis as a conversation."], ["I can define motivation, objective and obstacle.", "I can explain why objectives should be specific and active and how they differ from emotions.", "I can break down a scene into each character’s objective and obstacle.", "For a film I can analyse every key scene, predict where actors will disagree, test the analysis in rehearsal, and justify the choices I settle on."], [["How does an objective differ from an emotion?", "An objective is something a character is trying to do or get, while an emotion is a feeling. Objectives can be played, emotions are the result."], ["What happens to a scene if the character has no obstacle?", "There is little drama, because they simply get what they want."]], "wKa", "Choose a scene and write each character’s objective and obstacle in a single line. Predict where two actors would disagree, then rehearse the scene with a partner, and note what changed.", []], ["Beats and structure", "A scene is built from beats: small units of action where something changes. Seeing them shows you how a scene works and where it turns.", "You can break a scene into beats, find the turning point, and use the structure to plan the scene.", ["A <b>beat</b> is a unit of action within a scene, where a character’s tactic or the balance of the scene shifts. A scene often has a few beats and one main turn. Beats are also a way to see the larger <b>structure</b> of the film: the setup, an inciting incident, escalating obstacles, a crisis and a resolution (three-act structure being the most common model), which a director may use or deliberately subvert.", "Mark beats in the script by finding where something changes: a new piece of information, a decision, a shift in power, a change in tactic. Give each a short name. Beats tell you where to place the camera move or cut, where to give an actor a note, and where the scene’s energy shifts. Knowing the structure helps you pace the film and decide what to protect when time or money is short."], ["I can say what a beat is.", "I can explain how beats relate to the scene’s turning point and to the film’s structure.", "I can mark beats in a scene and name each.", "For a film I can map the beats and structure, predict where the audience’s attention will wander, test with a table read, and justify my changes to pace or order."], [["How do you find a beat in a scene?", "Look for where something changes: new information, a decision, a shift of power or a change of tactic."], ["Why mark beats before shooting?", "They show where to focus the camera, the cut and the notes, and where the scene’s energy changes."]], "KwB", "Take a scene from a film you know and
