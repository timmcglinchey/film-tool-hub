 broadcast or recorded."]], "VUN", "Set up three radio mics on three people, create a channel plan, and run a ten-minute mock shoot including a battery change and a move between two rooms. Predict the likely problems first, then record what actually happened.", []], ["Lav concealment techniques", "A lav has to be hidden from the camera yet close enough to the voice and quiet enough to be usable. This takes careful technique and good manners.", "You can place and conceal a lav so it is clear and rustle-free, working respectfully with the actor and costume department.", ["The usual placement is on the chest, in the middle, about 15 to 20 cm below the chin, where it picks up a balanced voice. Techniques include hiding it under clothing with tape or a purpose-made mount, forming a small loop of cable (a strain relief) to stop movement transmitting along it, using a small piece of fabric or a windscreen, and using placement alternatives such as in the hairline, in a hat or on a collar when the chest isn’t possible. The transmitter sits in a pouch or on a belt or thigh, and in some costumes on the back.", "The main enemy is <b>rustle</b>: fabrics that rub, tight clothes, and movement. Synthetic or stiff fabrics are worst. Test by having the actor move, walk and sit while you monitor, and adjust. Always ask the actor’s permission before touching, explain what you are doing, offer to let them place it, agree with costume, and respect personal boundaries (consider who is best placed to fit it). Be open about what is recorded and when mics are live."], ["I can say where a lav is usually placed.", "I can explain why rustle happens and how a strain-relief loop helps.", "I can fit and hide a lav on an actor, test with movement, and handle consent properly.", "For a costume I can plan placement and hiding options, predict rustle and visibility problems, test them with the costume team, and justify the choices including how I ask for consent."], [["Where is a lav usually placed on the body, and why?", "Centre of the chest, around 15 to 20 cm below the chin, because the voice is balanced there."], ["What should you do before touching an actor to fit a mic?", "Ask permission, explain what you’re doing, and agree with the actor and costume who will fit it."]], "VUP", "Hide a lav in three ways on a volunteer (under a shirt with tape, with a loop, and clipped on the outside), then record walking and sitting. Predict which will rustle most, then listen back.", []], ["Frame lines", "The boom operator must get the microphone as close as possible without it appearing in the picture, which means knowing exactly where the frame ends.", "You can work out and respect the frame lines for every shot, and keep the camera team informed.", ["The <b>frame lines</b> are the edges of the shot. The boom operator needs to know them for the widest part of every shot, including any camera movement, so the mic stays just outside. A monitor with frame guides, a marked viewfinder, or a quick check with the camera operator all help. The lens matters because a change of focal length changes where the edges are, so always ask which lens and what the shot size is.", "Rehearse the boom pass with the camera, ask the operator to stop and check if the framing changes, and be honest about when the mic can’t get close enough. In that case there are options: a different position, a wider mic, using lavs, a different shot or a wild line. Think of the frame as shared territory and communicate. The Cinematography role covers this from the camera side."], ["I can say what frame lines are and why the boom needs them.", "I can explain why lens and movement change frame lines and how to find them.", "I can find the frame lines for a shot using a monitor or the camera operator, and keep the boom outside them.", "For a moving shot I can predict the frame limits, plan the boom route, rehearse it, and justify the compromises."], [["Why does a change of lens matter to the boom operator?", "The focal length changes how much is in frame, and so how close the boom can get."], ["What can you do if the mic can’t get close enough?", "Change position, use lavs, plan a wild line or adjust the shot with the director and DP."]], "VU", "Run a boom pass for a walking shot on a monitor with frame guides, once as a plan and once for real. Predict where you’ll enter frame, then check the playback and measure how many frames were spoiled.", []], ["Boom shadows", "A boom pole or microphone can throw a shadow into the shot, and it is solved with positioning, not with luck.", "You can predict and prevent boom shadows by working with the lighting team.", ["A <b>boom shadow</b> appears when the pole, microphone or the operator blocks a light and casts a shadow on an actor or the set. It depends on where the lights are and how high and in which direction the boom is held. Lights close to the subject, low and to the front are most likely to cause a problem. Because lighting is usually set before the boom is rehearsed, the problem often shows up late.", "The cure is early communication and testing: check the lighting plan, do a boom pass with the lights on, and look at the shadows on the monitor, not just on the wall. Solutions include moving a light, raising or lowering it, flagging it, changing the boom side (overhead or underneath), using a lav, or accepting a different line. Tell the gaffer or DP what you see in clear terms. The Cinematography role covers this from the lighting side."], ["I can say what a boom shadow is.", "I can explain which lighting positions cause them and how to check for them.", "I can do a boom pass with the lights on, find shadows, and suggest a fix.", "For a lit scene I can predict shadows from the lighting plan, test them in rehearsal, and justify the compromise between sound and lighting."], [["Why do boom shadows often appear late in a setup?", "The lights are set before the boom pass, so the sound team often finds the problem only at rehearsal."], ["Name two ways to remove a boom shadow.", "Move or flag the light, change the boom direction (overhead or underneath), or use a lav."]], "VU", "With a lit two-person scene and a camera frame, do a boom pass at three heights and positions. Predict where the shadow will fall, then check on the monitor and fix it with a flag or a different boom angle.", []], ["Cable management", "Good cable handling keeps the boom quiet, the set safe, and the kit working.", "You can run, secure and coil cables safely and quietly.", ["Boom cables are best run so they don’t knock against the pole, either wrapped in loose loops or run through the pole (if it is internally cabled), with a little slack at the ends and leaving some for movement. Cables transmit handling noise to the mic, so keep movement away from the mic end. Use quality cables, label them, and keep spares. On the floor, cables cause trips: tape them down, cover with ramps or mats, and keep them away from walkways, doorways and other departments’ cables where possible.", "Coil cables using the <b>over-under method</b> so they don’t twist and kink, and store them neatly. Check for damage at wrap (cuts, bent connectors) and test them before use. Keep audio cables separated from mains and lighting cables where possible because they can induce hum. Tidy cables mean quicker setups and fewer faults, which matter when the crew is waiting."], ["I can say why cables should be coiled and secured.", "I can explain the over-under coil, handling noise and trip hazards.", "I can run and secure a boom cable quietly, and coil cables neatly.", "For a location I can plan cable routes for safety and noise, predict the problems, test them, and justify my approach."], [["Why coil cables with the over-under method?", "It avoids twists and kinks, which keeps them neat and prolongs their life."], ["Why keep audio cables away from mains cables?", "Mains and lighting cables can induce hum and interference in audio cables."]], "VUJ", "Run a boom cable in three ways (loose on the floor, wrapped round the pole, through slack loops) while walking. Predict which will give the most handling noise, then record and compare on headphones.", []], ["Working with the DP", "The boom operator and DP each need space and light, and the best results come from early, respectful negotiation.", "You can discuss and solve conflicts between sound and picture constructively.", ["Camera and sound compete for the same space: the DP wants lighting and the widest, best frame, while the sound team wants the mic close and shadow-free. Neither wins by default. Good practice is for sound to ask early which lenses, frame sizes and lighting positions are planned, to request a rehearsal pass before the lights are locked, and to raise problems early with practical suggestions, not complaints.", "Be specific and honest: say how much of the line you can’t record at this frame, what you’d like to move, and what you can offer (lav, wild line, different boom position). Ask the DP what the shot needs and respect it. Be ready to compromise, and have the director or AD decide when the solution affects schedule or creative choices. Good working relationships save time and make the work better. Tell post about any compromise."], ["I can say that sound and camera often compete for space.", "I can explain what each department needs and how to ask early.", "I can raise a sound problem with the DP in specific terms and propose options.", "For a scene I can predict conflicts, plan a discussion with solutions, and justify the compromises with the DP."], [["Why should sound ask about lenses and lighting early?", "So conflicts over frame, lighting and boom position are found before the shot is locked."], ["What should you offer along with a complaint to the DP?", "A practical option, such as a different position, a lav, or a wild line."]], "VU", "In a short role-play, one person plays the DP planning a tight shot with a low light, and one plays the boom operator. Find a solution in five minutes. Predict the sticking point first, then reflect on what worked.", []], ["Coordination with other crew", "Sound only works if other departments know what it needs, and the sound team knows what they need.", "You can coordinate with every department so the set is quiet and the recording is complete.", ["The sound department depends on others. The <b>1st AD</b> controls silence and tells the set when to be quiet. The <b>script supervisor</b> and camera team share the numbering and slating. The <b>costume</b> and make-up teams affect where radio mics go. The <b>art</b> department chooses props that can be noisy (hard objects, creaking floors). The <b>lighting</b> team creates buzz and shadows. <b>Production</b> chooses the locations and the schedule.", "Coordination means early, short, practical conversations. Share what you need (quiet during takes, rehearsal passes, wild tracks, room tone) and why. Ask what others need from you (fitting a mic, timecode, a feed for the director). Raise issues politely and early. Agree routines in advance, like the roll sequence and a signal for ‘sound problem’, so that nobody has to guess. Good coordination often matters more than the equipment."], ["I can name the departments that sound depends on.", "I can explain what sound needs from each and what each needs from sound.", "I can have short, practical conversations with other departments about specific needs.", "For a production I can plan coordination for each department, predict friction, test it in rehearsal, and justify the routines."], [["Who controls quiet on set?", "The 1st AD, who asks everyone to be silent for sound to roll."], ["Why talk to the art department about props?", "Noisy props, floors or objects can ruin takes, so choices like softer props or surface treatments can be agreed in advance."]], "VU", "List what sound needs from each department in a scene, and what each needs from you. Run a short mock briefing with students from those departments and note what they didn’t realise. Predict the surprises first.", []], ["What editors and sound designers need", "Post needs clean, well-labelled, well-documented sound it can trust without having to ask you.", "You can deliver files, reports and extra recordings that make post-production quick and reliable.", ["Editors and sound designers need: all the audio files in an organised structure with consistent names, complete and accurate metadata and sound reports, <b>isolated tracks</b> as well as the mix, a guide track on the camera, room tone for every location, wild tracks and effects, and notes on any problems or exceptions. They also need to know the sample rate, bit depth and frame rate you used, and any changes made on set (such as filtering).", "The way to know what they need is to ask them before the shoot and to look at the problem from their side: could someone who wasn’t there find, understand and use this? Check your deliverables before handover. Include any special requests, such as dialogue to be kept clean or additional effects to record. Good handover is a part of the job, not an extra, and mistakes here are expensive."], ["I can say what post needs from production sound.", "I can explain why isolated tracks, reports, room tone and wild tracks matter.", "I can organise and label deliverables for an editor and check them against a list.", "For a production I can agree a deliverables list with post, predict what could go wrong, test it, and justify the format and documentation."], [["Why give post isolated tracks as well as a mix?", "They let editors and mixers balance, clean and choose each source, which a mix alone doesn’t allow."], ["How could you check your handover from the editor’s point of view?", "Ask someone who wasn’t there to find and use a take using only your files and reports."]], "VOU", "Prepare a handover folder for a short shoot (files, reports, room tone, wild tracks, notes) and give it to an editor to cut with. Predict their questions, then record what they actually asked.", []], ["ADR planning", "ADR is re-recording dialogue in a studio. It’s costly and often worse than the original, so production sound tries to avoid it, and plans for it when it can’t.", "You can say when ADR will be needed, flag it early, and reduce it with good recording.", ["<b>ADR</b> (automated dialogue replacement, also called looping) means actors re-record lines in a studio while watching the picture. It’s used when the production recording is unusable (noise, wind, mic problems) or when lines change. The performance is hard to match, and it costs time, money and actor availability. Because of this, a good production recording is always the first choice.", "Planning means noting during the shoot which lines are likely to need ADR (on the sound report and in notes to the supervising sound editor), recording <b>wild lines</b> when you can, and telling production early so actors and studios can be booked. Keep a list with scene, take, line and reason. Don’t assume ADR is a safety net for lazy recording: it’s a last resort with a cost."], ["I can say what ADR is.", "I can explain why it is avoided and what makes it necessary.", "I can keep a list of lines that need ADR with reasons, and record wild lines to reduce it.", "For a production I can predict ADR needs from the locations and schedule, plan and communicate them, and justify the trade-off between recording time on set and ADR cost later."], [["Why is ADR a last resort?", "It costs time and money, the performance is hard to match to the original, and the acoustic match is imperfect."], ["How can production sound help reduce ADR?", "By recording clean takes, capturing wild lines, and telling production about problem takes early."]], "VOU", "Go through a scene with a noisy take and make an ADR list with scene, take, line and reason. Record a wild line and a studio-style replacement and compare which is closer to the original. Predict first.", []], ["Clean dialogue priorities", "When there’s a conflict, dialogue comes first. Clean, isolated dialogue gives editors and mixers the most options.", "You can put dialogue first without wasting the day and protect each line from avoidable problems.", ["Dialogue carries the story, and everything else (music, effects, atmosphere) can be added later, but spoiled dialogue can only be replaced by ADR. So in a conflict, the priority order is generally: <b>clean dialogue first</b>, then room tone and atmospheres, then effects. Planning for clean dialogue means asking actors not to overlap speech when possible, having noisy props or actions happen between lines, avoiding music or background sound playing during takes (it can’t be removed), and keeping footsteps and clothing quiet.", "Some of these are creative choices that need the director’s agreement, so raise them early, such as in pre-production, and offer alternatives (such as recording overlaps separately, or playing music for rhythm but with a silent track for the take). If compromises are made, note them. Clean dialogue is a shared effort across the whole crew, not just the sound department."], ["I can say that dialogue is the first priority for production sound.", "I can explain what makes dialogue unclean (overlaps, music, noise) and why clean recording gives post options.", "I can identify threats to clean dialogue in a scene and propose practical changes.", "For a scene I can plan how to protect dialogue while respecting the creative intent, predict conflicts, test the options, and justify the compromises."], [["Why avoid playing music during a dialogue take?", "It is baked into the recording and can’t be removed later, limiting editing and mixing options."], ["How might you handle overlapping speech that the director wants?", "Raise it early, record overlaps normally and also record clean versions separately if possible, and note it in the report."]], "VOU", "Record a scene with overlapping dialogue and a clean-take version. Give both to an editor and ask them to cut the scene two different ways. Predict which choices will be possible only with the clean version, then compare.", []]]};
YR.pro=[["Chain of production", "The chain of production is the order of phases a film passes through, and who is responsible for what at each handover.", "You can describe the phases from development to delivery, say who leads each one, and explain why each depends on the one before.", ["A film moves through <b>development</b> (idea, script, funding), <b>pre-production</b> (hiring, scheduling, locations, testing), <b>production</b> (the shoot), <b>post-production</b> (edit, sound, colour, effects) and <b>delivery and distribution</b>. Each phase produces outputs that the next depends on: a locked script feeds the breakdown, the breakdown feeds the budget and schedule, the schedule feeds the call sheets, and the footage feeds the edit.", "The chain also has a people structure. The producer is responsible for the whole project and its resources, the director for the creative vision, and heads of department (HODs) for their own areas, with the 1st AD running the schedule and the set. Problems usually occur at handovers, where information is lost or assumed. Understanding the chain lets you see what you must receive before you can start, and what you owe the person after you."], ["I can name the main phases from development to delivery in order.", "I can explain what each phase produces and why the next phase depends on it.", "I can map a project onto the chain, naming who is responsible for each handover and what is passed on.", "For a project I can predict where the chain is most likely to break, plan checks at those handovers, test the plan against a real or past project, and justify it."], [["Why does a locked script matter to the rest of the chain?", "The breakdown, budget and schedule are all built from it, so late changes cause rework and extra cost throughout."], ["Where do problems usually occur in a chain of production?", "At handovers between people and phases, where information is lost, assumed or out of date."]], "hps", "Draw the chain of production for your current project, showing each phase, who leads it, and what is handed on. Mark the three handovers most likely to fail and predict why. After a week, check which actually caused trouble.", []], ["Producer vs. 1st AD: who does what", "The producer manages the project’s money, people and legal side. The 1st AD manages the schedule and the set. On small films one person can do both, but the jobs are different.", "You can separate the two roles, say where they overlap, and decide who owns each job on a student shoot.", ["The <b>producer</b> is responsible for the project as a whole: raising and controlling the money, hiring key people, contracts, insurance, permissions, and delivering the finished film. The <b>1st AD</b> (first assistant director) turns the script into a workable schedule, runs the set day to day, controls the pace and safety, and is the link between the director and the crew. A common summary is that the producer looks after the production and the 1st AD looks after the shoot day.", "They overlap at scheduling (the 1st AD builds it, the producer approves the budget implications), at health and safety, and at managing people. On student films these roles are often combined or shared, which is why this hub treats them together. If you do combine them, there is a real conflict: the producer may need to say yes to a cost, while the 1st AD needs to say no to more time. Decide who owns which decisions in writing, and be clear when you are wearing which hat."], ["I can say in one sentence what a producer does and what a 1st AD does.", "I can explain where the roles overlap and why they are different jobs.", "I can split a list of production tasks between producer and 1st AD and justify each.", "For a student shoot I can design a division of responsibilities, predict where conflicts will occur if one person does both, test it against a real schedule, and justify the rules I set."], [["Which role normally builds the shooting schedule, and which approves its cost?", "The 1st AD builds the schedule, and the producer approves its cost and the budget implications."], ["Why can one person doing both roles be a problem?", "The producer may need to protect the budget while the 1st AD needs to protect the time and safety on set, and the two aims can conflict."]], "hpfb", "Take a list of twenty production tasks (for example: sign the location agreement, call ‘turnover’, update the budget, release the cast). Sort them into producer, 1st AD and shared, and predict which you’ll find hardest to place. Compare with a partner and discuss differences.", []], ["Understanding the deliverables of each department and crew member", "Every department is expected to hand something on, and knowing what makes it easier to plan, hire and check work.", "You can say what each department produces, when, and for whom.", ["A <b>deliverable</b> is a concrete output that marks the completion of a task or phase. Each department has them: the director produces a shot list and storyboard, the DP a lighting and equipment plan, the production designer a design breakdown and set drawings, sound a sound report and recorded files, the script supervisor continuity notes and daily reports, the DIT checked and backed-up media, the 1st AD a schedule and call sheets, and the producer budgets, contracts and insurance.", "Knowing these helps producers and ADs in three ways: you can see what to ask for and when, you can spot who is waiting for whom, and you can recognise when work is actually finished. Write deliverables into briefs and deal memos so there is no argument later. For students, a simple table of department, deliverable, deadline and recipient is a very effective tool."], ["I can name at least one deliverable for each main department.", "I can explain who needs each deliverable and when.", "I can build a table of deliverables, deadlines and recipients for a project.", "For a project I can predict which deliverables will be late or unclear, test the table by chasing them, and justify changes I make to the plan."], [["Give a deliverable for the sound department and say who needs it.", "For example the sound report and recorded files, needed by the editor and the script supervisor."], ["Why write deliverables into briefs or deal memos?", "So everyone knows what is expected and when, preventing disputes about whether the work is finished."]], "hpl", "Create a deliverables table for your project: department, deliverable, deadline, and who receives it. Predict which two entries will be late. At the end of pre-production, check what actually happened.", []], ["Chain of title and copyright", "Chain of title is the documented trail showing who owns the rights to the script and film, and that you have the right to make it.", "You can explain who owns what, and set up the paperwork so the film can be shown and sold.", ["Copyright in a script belongs automatically to its author the moment it is written, unless it was written under an employment contract or assigned. <b>Registration</b> doesn’t create copyright but gives a timestamped record that is useful in a dispute. The <b>chain of title</b> is the series of documents (assignments, licences, option agreements) that shows the production has the rights it needs, from the original writer through to the finished film.", "If anyone else owns or contributed to the script, music, images or story, the production needs written permission. Without a clear chain of title, festivals, broadcasters and distributors may refuse the film. When collaborating, confirm in writing who owns the copyright in the script and in the finished film, and what rights the others have. UK copyright law is covered by the Intellectual Property Office’s guidance, and institutions often have their own policy for student work."], ["I can say that copyright belongs to the author automatically.", "I can explain what registration does and does not do, and what a chain of title is.", "I can set up an agreement confirming who owns the script and film for a collaborative project.", "For a project I can map the chain of title, predict where the gaps are, test it against what a festival or distributor would ask for, and justify any changes."], [["Does registering a script create copyright?", "No. Copyright arises automatically on writing. Registration gives a dated record that can help in a dispute."], ["Why might a festival refuse a film with an unclear chain of title?", "They need proof that the filmmakers had the right to make and show it, to avoid legal claims."]], "hlc", "Write a one-page statement of who owns what in your project (script, film, music, images), and who has given what permission. Have a partner act as a festival and list the gaps. Predict the gaps first.", [["read", "foundational", "UK Intellectual Property Office guidance on copyright", "Search: “gov.uk copyright guidance IPO”"]]], ["Options and adaptation rights", "If a film is based on someone else’s work, you need the rights. An option reserves them for a period of time before you commit the full price.", "You can explain how to secure rights to existing material and what an option protects.", ["Adapting a book, play, article, game or true story usually needs the permission of the rights owner. An <b>option</b> is a payment (often small) for the exclusive right to buy the rights within a set period, which gives the producer time to raise money and develop the project without losing the material. If the film goes ahead, the option is exercised and the full purchase price is paid under a rights agreement.", "Key points to settle in writing: what exactly is being licensed (format, territories, media, length of time), how much and when it is paid, credit, and what happens if the project doesn’t go ahead. Some material is in the <b>public domain</b> and free to use, but versions and translations may still be protected, so check carefully. For true stories, real people may have rights over their portrayal. This is a legal area, so students should seek advice from their institution before filming adapted work."], ["I can say that adapting existing work needs the rights owner’s permission.", "I can explain what an option does and what a rights agreement should cover.", "I can draft a simple request for permission and list the points to agree.", "For an adaptation I can identify what rights are needed, predict the obstacles, test my approach with a mock negotiation, and justify the terms I propose."], [["What does an option give a producer?", "The exclusive right to buy the rights within a set time, so they can develop and fund the project without losing the material."], ["Why check public domain material carefully?", "Specific editions, translations or adaptations may still be under copyright even if the original work isn’t."]], "hlm", "Choose a short story you would like to adapt, find who owns the rights, and write the first email to ask permission. Predict what they will ask for, and check against the answer if you can get one.", []], ["Clearances", "A clearance is permission to use something you don’t own, such as music, artwork, brands or a person’s likeness, inside your film.", "You can spot what in a film needs clearing and plan how to get it.", ["Anything visible or audible in the film that someone else created or owns may need <b>clearance</b>: music and recordings, artwork or posters on a wall, logos and brands, clips from other films, text, and people’s likenesses (including crowd members and passers-by). A good habit is to check the script and every shot for these things before shooting, not after the edit.", "Routes to clearance include written permission, a licence for a fee, using material that is royalty-free or in the public domain, or changing the item (for example, replacing a real brand with an invented one, or using original music). For music there are separate rights for the composition and the recording, so you may need two permissions. Keep a log of every clearance and a copy of every agreement, because festivals and distributors will ask for them."], ["I can say what a clearance is and give examples.", "I can explain why music has two sets of rights and what can be done about brands and artwork.", "I can go through a script and list everything needing clearance, with a plan for each.", "For a project I can predict the clearances likely to be difficult, test the plan by seeking one in advance, and justify the alternatives I choose."], [["Name three kinds of thing that might need clearance.", "For example music, artwork on a wall, brand logos, clips, and recognisable people."], ["Why does music often need two permissions?", "The composition (the song) and the recording (a particular performance of it) are separately owned."]], "hlc", "Watch a short film and list everything in it that you think would need clearance. Then predict which are easiest and hardest to get, and for the hardest write what you would do instead.", []], ["Pitching", "A pitch is a short, persuasive way of getting people to back your project, and good ones are clear, specific and honest.", "You can pitch a film in a way that makes it understood and makes people want to be involved.", ["A pitch has to communicate quickly: what the film is (a short, clear logline), why it is worth making (what makes it fresh or personal), who is making it (why you can do it), and what you need. Pitches range from a 30-second verbal version to a written pitch deck with a treatment, mood boards and a sample budget. A good pitch is specific rather than vague, and never claims more than the team can deliver.", "Preparation matters: know your audience (a funding panel, a crew member, a backer, or a tutor) and what they care about. Practise out loud and cut anything that doesn’t earn its place. Be honest about risks and show you have a plan for them. Listen to the questions, because they show what is unclear. A strong pitch also helps the whole team, because writing it forces agreement on what the film is."], ["I can say what a pitch should communicate.", "I can explain how to adapt a pitch for different audiences.", "I can deliver a two-minute pitch that is clear, specific and honest, and respond to questions.", "For a project I can design pitches for different audiences, predict their questions, test them on real listeners, and justify what I changed after feedback."], [["What four things should a short pitch make clear?", "What the film is, why it’s worth making, who is making it, and what you need."], ["Why should a pitch be honest about risks?", "Funders and collaborators notice problems anyway, and showing a plan for them builds trust."]], "mlp", "Pitch your film in 30 seconds and in two minutes to a partner who knows nothing about it. Predict the first question they will ask, then count how many of their questions your pitch should have answered.", []], ["Project development stages", "Development is the structured journey from idea to a project ready to be financed and shot, with clear points to continue, change or stop.", "You can describe the stages of development, and decide what must be true before a project is ready to go ahead.", ["Development usually runs from <b>concept and logline</b>, through a <b>treatment</b>, script drafts and notes, to a <b>locked production draft</b>, with decisions along the way about whether to proceed. A formal <b>greenlight</b> is the point at which the project is approved to go into production, which in a student context is when the script is locked and approved.", "Each stage has outputs and decisions. Revisions should be limited and structured, with notes gathered and prioritised, and the producer should raise production concerns early, such as scenes with large crowds, complex locations or special equipment that could be simplified. After greenlight, significant changes to the script have large consequences for the budget, schedule and every department. Keep a version history with dates so everyone works from the current draft."], ["I can list the main stages of development in order.", "I can explain what a greenlight is and why the script should be locked afterwards.", "I can plan a development timeline with outputs and decision points for a short film.", "For a project I can predict where development will stall, build checkpoints, test them against real deadlines, and justify what I would cut or change to keep to the plan."], [["What does a greenlight mean in practice?", "The script is locked and approved, and the project moves into production with everyone working from the same draft."], ["Why should production concerns be raised during development?", "Simplifying a crowd scene or a complex location on paper is cheap, while changing it after the budget and schedule exist is expensive."]], "hpm", "Plan a development timeline for your project with stages, outputs and decision points. Mark the point at which you would stop or change the idea if the budget estimate is too high. Predict which stage will take longest, and check.", []], ["Top sheet and detailed budget", "A top sheet summarises the budget on one page. The detailed budget lists every cost line by line, and is built from the script breakdown.", "You can build a budget that is complete, realistic and traceable to the script.", ["A <b>detailed budget</b> lists every expected cost, grouped by department: equipment, locations, cast and crew, art department, post-production, catering, transport and insurance. It can only be built accurately once there is a locked script, a script breakdown and confirmed heads of department, who can give real figures. The <b>top sheet</b> is the one-page summary showing totals per department for a quick overview.", "Start with a <b>provisional budget</b> early, a rough estimate with a low and a high figure for each category, as a reality check on whether the film is achievable at the scale you imagine. Later replace it with quotes and real costs. Keep assumptions visible (day rates, number of days, how many people), compare with actual spend as you go, and update when things change. A budget is a planning tool, not a formality: if the number is too high, simplify the script or the production now."], ["I can say what the top sheet and detailed budget are.", "I can explain how a budget is built from the breakdown and why a provisional budget comes first.", "I can create a budget with sensible categories, assumptions and low and high estimates.", "For a project I can build and update a budget, predict where it will overrun, test it against real quotes, and justify the decisions I make to keep it in range."], [["Why can a detailed budget only be built after the breakdown?", "Costs come from the specific elements in the script (locations, cast, props, days), which the breakdown identifies."], ["What is a provisional budget for?", "A rough early reality check that shows what scale of production the idea needs and informs the funding strategy."]], "hpl", "Build a provisional budget for your film with a low and a high figure for each category. Then ask three suppliers for real quotes and compare. Predict which category will be most underestimated first.", []], ["Above-the-line and below-the-line costs", "Above-the-line costs are the creative principals whose fees are negotiated one by one. Below-the-line costs are the crew, equipment and everything else, budgeted at standard rates.", "You can place costs on the right side of the line and explain why the split matters.", ["<b>Above the line</b> covers the creative principals: typically the writer, director, producer and lead cast. Their costs are negotiated individually and often fixed early. <b>Below the line</b> covers most technical crew, equipment, locations, art department, and post-production, budgeted at more standardised rates.", "The split matters because the two behave differently. Above-the-line costs are often agreed before the film is financed and are hard to change, while below-the-line costs vary with the schedule and the scale of the shoot, and are where most savings (or overspends) happen. Investors and funders often look at the proportion between them. On student films, nobody may be paid, but the distinction still helps when you think about deferrals and what to prioritise."], ["I can say which costs fall above and below the line.", "I can explain why the two behave differently and which is easier to adjust.", "I can sort the lines of a budget into the two categories correctly.", "For a budget I can predict which category will change most as the schedule changes, test it, and justify how I would rebalance if funding falls short."], [["Is a lighting rental above or below the line?", "Below the line (equipment)."], ["Which category is usually fixed first and harder to change?", "Above the line, because principal fees are negotiated individually and often agreed early."]], "hlb", "Take a sample budget (yours or a template) and sort every line into above or below the line. Predict which three lines you will find hardest to place, then check your answers with a partner.", []], ["Fringes", "Fringes are extra costs on top of wages, such as taxes and national insurance, that must be budgeted for every paid person.", "You can include fringes correctly so paid crew don’t cost more than you planned.", ["A person’s agreed fee is not the whole cost of employing them. <b>Fringes</b> are the additional costs an employer pays on top of wages, in the UK typically employer’s national insurance and other payroll-related costs, and sometimes pension contributions and holiday pay. They can add a significant percentage to the labour cost, and are easily forgotten at the budgeting stage.", "Whether fringes apply depends on how the person is engaged (employee or self-employed), which is a legal question with tax consequences, so get advice from your institution or an accountant before paying anyone. For a student film where nobody is paid it may not apply, but you should know the principle, especially if you work on professional productions. Always treat travel and food as costs for everyone, including unpaid crew."], ["I can say what a fringe is.", "I can explain why they must be in the budget and that employment status affects them.", "I can add fringes to a labour budget using a sensible percentage and flag where advice is needed.", "For a paid production I can predict fringe costs, test the budget against payroll advice, and justify how I treat employed and self-employed crew."], [["Why is a person’s fee not the full cost of hiring them?", "Employer taxes and other payroll costs are added on top of the wages."], ["Who should you ask before paying crew?", "Your institution’s finance team or an accountant, because employment status affects tax and fringes."]], "hlc", "Take the crew list of a small budget and add a fringe percentage you have researched. Predict how much the total will change, then compare with the real change.", []], ["Contingency in the budget", "Contingency is a percentage of the budget reserved for things that will cost more than expected, which they always do.", "You can set and manage a contingency, and know what it is for.", ["<b>Contingency</b> is money set aside to cover unforeseen costs, usually 10 to 15 per cent of the total. It is not a luxury or padding. It exists because something nearly always costs more than expected: a hire runs a day longer, a permit is more expensive, a card is lost, an actor is ill, or weather moves a day. Financiers often require it.", "Manage it well. Don’t treat it as spare money for upgrades or planned extras, record every time it is used and why, and keep an eye on how much is left as the project progresses, as using it early leaves nothing for the shoot. If the contingency is spent before the end of the shoot, that is a warning. A related idea, contingency planning, is about what you would do if things go wrong, and is covered in its own domain."], ["I can say what contingency is and the usual percentage.", "I can explain why it exists and what it should and shouldn’t be used for.", "I can set a contingency in a budget and log its use through a project.", "For a project I can predict where contingency will be drawn, set the right level, test it against a past overspend, and justify the percentage I choose."], [["What is a typical contingency percentage?", "About 10 to 15 per cent of the budget."], ["Why not use the contingency for planned upgrades?", "It is there for unforeseen costs, and spending it early leaves nothing for the problems that will arise."]], "hpl", "Look at a finished project (yours or a case study) and list every cost that was unexpected. Predict what percentage of the budget they added up to, then calculate it and compare with 10 to 15 per cent.", []], ["Cashflow and cost reporting", "Cashflow is when money comes in and goes out. Cost reporting tracks what has been spent against the budget so problems show early.", "You can track spending and cash against a budget and spot trouble before it grows.", ["A budget says how much a film will cost, but <b>cashflow</b> says when the money is needed. Equipment deposits, hire fees and wages are due at specific times, while funding and crowdfunding money arrive on their own schedule. A project can be affordable overall but still run out of cash at a crucial moment.", "<b>Cost reporting</b> compares actual spending with the budget, usually weekly during prep and daily during the shoot, showing for each category the budget, spent, committed (ordered but not paid) and forecast to the end. This helps the producer decide, for example, to cut a planned extra or raise a small amount of additional funding before it becomes an emergency. Keep every receipt and invoice, record who authorised each spend, and agree who can approve costs."], ["I can say what cashflow and cost reporting are.", "I can explain the difference between budget, spent and committed costs.", "I can keep a simple cost report and cashflow table for a small project.", "For a project I can predict cashflow gaps, test a cost report against real transactions, and justify the decisions I make when spending is ahead of plan."], [["What is the difference between spent and committed?", "Spent is already paid, while committed is ordered or agreed but not yet paid."], ["Why can a project that is affordable overall still run out of cash?", "Payments fall due before income arrives, so timing matters as well as totals."]], "hpl", "Set up a simple cost report for your project with budget, spent, committed and forecast columns, and a week-by-week cashflow row. Update it for one week of prep. Predict which category will show a problem first.", []], ["Funding bodies, tax incentives and rebates", "Beyond your own money, funding can come from grants, institutions and, for larger films, tax reliefs. Each has rules, deadlines and competition.", "You can identify realistic funding routes for a project, and understand what each requires and returns.", ["Common routes for student and low-budget films are institutional funds (equipment funds, bursaries, production grants), public funding bodies (for example the BFI, Creative Scotland, Arts Council England and regional screen agencies, each with their own schemes), industry and charity schemes, and personal contributions. Grants are competitive, have long lead times and strict criteria, so apply early and read the guidance carefully.", "<b>Tax incentives and rebates</b> reward spending in a particular country or region. The UK has film and high-end TV tax reliefs, but they are aimed at larger productions that meet qualifying tests (such as a cultural test and minimum UK spend) and their rules have changed in recent years. Most student films will not qualify, but it is important to know that they exist and how they affect real producers’ financing. Always check current rules with the funding body or HMRC, because details change often."], ["I can name some kinds of funding available for film projects.", "I can explain the difference between grants, institutional funds and tax incentives, and why lead times matter.", "I can find a suitable fund for my project, read its criteria, and plan an application.", "For a project I can compare funding routes, predict which is most likely to succeed, test the match by drafting an application, and justify the mix of funding I would pursue."], [["Why apply for grants early?", "They are competitive, have strict deadlines and can take months to decide."], ["Would a typical student short qualify for UK film tax relief?", "Usually not, because the schemes target larger productions that pass qualifying tests. Check the current rules."]], "lms", "Find three funding schemes you could apply to for your film. For each, note the deadline, criteria, amount and lead time, and predict which you’re most likely to win. Draft the first page of one application.", [["read", "foundational", "BFI funding and support schemes for filmmakers", "Search: “BFI NETWORK funding” and the websites of your regional screen agency"], ["read", "deeper", "HMRC and BFI guidance on UK film tax reliefs", "Search: “UK film tax relief gov.uk”"]]], ["Running a successful crowdfunding campaign", "A crowdfunding campaign is a sales and community project. It is won by preparation and momentum in the first days, and by honest communication throughout.", "You can plan, launch and manage a campaign, and set a target that includes fees and rewards.", ["Start with a realistic <b>target</b> based on a budget, remembering to add platform and payment fees (often cited as around 8 per cent on larger platforms; check current rates) and the cost of fulfilling rewards. Platforms differ: some are all-or-nothing, so you only receive money if you reach the target, while others allow flexible funding. Build a clear campaign page with a short, personal video (typically two to three minutes) that shows the film, the team and what the money is for. Use clean sound and subtitles.", "Plan the <b>rewards</b> (four to six tiers is plenty, with digital rewards that cost little to fulfil, and only promising what you can deliver) and the <b>launch</b>. Your first backers will mostly come from your own network, so ask people personally before launch day, because early momentum helps platforms and later backers trust the project. Post regular updates, answer messages promptly and plan a push for the last days. Keep promises, and if a problem occurs, tell backers honestly."], ["I can say what a crowdfunding campaign needs.", "I can explain why the first days matter, how rewards and fees affect the target, and the difference between all-or-nothing and flexible platforms.", "I can plan a campaign page, video outline, rewards and a launch plan with a realistic target.", "For a project I can predict how much my network will give, plan the campaign to reach the target, test the pitch on real people, and justify the rewards and timing."], [["Why is the first 48 hours of a campaign so important?", "Early momentum signals credibility and helps platforms and later backers trust the project, and your own network provides most first backers."], ["Why add fees and reward costs when setting the target?", "Otherwise you receive less than needed after fees and fulfilment, leaving the film underfunded."]], "msl", "Plan a campaign for your film: target (with fees), rewards, video outline and a list of the first thirty people you will personally ask. Predict how many will back on day one, then test by sounding them out.", []], ["Deferrals and in-kind support", "A deferral means being paid later, if money comes in. In-kind support means being given goods or services instead of cash. Both need to be written down.", "You can use deferrals and in-kind support fairly and without causing problems later.", ["A <b>deferral</b> is an agreement that a person’s fee will be paid later, usually when the production earns revenue. <b>In-kind</b> support is the donation or discount of equipment, locations, food or services in exchange for credit, exposure or a future favour. Both can make a low-budget film possible, but they carry real risk: people have costs of their own, and revenue from short films is rare.", "Be honest about the chance of ever paying a deferral, and put every agreement in writing: what is owed, what triggers payment, and what happens if it never does. Record the value of in-kind support in the budget (so the film’s true cost is clear) and give the agreed credit. Consider the fairness and legality of unpaid work, and the impact on people’s time and goodwill. Union and industry bodies publish guidance on working unpaid or deferred, and your institution may have its own policy."], ["I can say what a deferral and in-kind support are.", "I can explain why they must be in writing and what risks they carry.", "I can draft a clear deferral agreement and record in-kind support in a budget.", "For a project I can decide where deferrals and in-kind support are appropriate, predict the risks, test the wording with a collaborator, and justify the fairness of what I offer."], [["Why put a deferral in writing?", "So both sides know what is owed and when, and it is enforceable if there is a dispute."], ["Why record in-kind support in the budget?", "It shows the film’s true cost and helps with funders and future planning, even though no cash changes hands."]], "hlc", "Draft a one-page deferral agreement for a crew member, stating the fee, the trigger for payment, and what happens if there is no income. Ask a partner to find loopholes, and predict how many they will find.", []], ["Breaking down a script", "A breakdown reads the script as a production document, identifying every element with a cost, logistical need or creative decision attached.", "You can break a script down so that the schedule and budget can be built from it.", ["A <b>script breakdown</b> goes through the script scene by scene and lists everything required: cast, extras, locations, props, set dressing, costumes, make-up, vehicles, animals, stunts, special effects, sound, music and special equipment. Each department also breaks the script down for its own needs: the DP for visual requirements and times of day, the production designer for sets and props, sound for difficult audio, and the 1st AD and producer for scene, location and cast counts.", "Details to record include the scene number, interior or exterior, day or night, location, a short description, the page length (measured in eighths of a page) and the elements. Software (such as StudioBinder or Celtx) or a simple spreadsheet with a column per department both work. Do the breakdown from the <b>locked production draft</b>, because later changes mean re-doing it. It feeds directly into the schedule and the budget."], ["I can say what a breakdown is.", "I can explain what is recorded for each scene and why the locked draft is used.", "I can break down a short script into a scene-by-scene sheet with all department elements.", "For a script I can predict which scenes are most expensive or difficult, build the breakdown, test it against a department’s needs, and justify the changes I propose to simplify."], [["Why do a breakdown from the locked draft?", "Later changes would force you to redo it and change the schedule and budget."], ["How are page lengths measured, and why?", "In eighths of a page, which gives a consistent measure of how much material a scene contains and helps estimate shooting time."]], "hps", "Break down a five-page script scene by scene, with a column per department. Predict which scene will be hardest and most expensive, then ask a department head to review and compare.", []], ["Stripboard and one-liner", "A one-liner summarises each scene on one line. A stripboard puts each scene on a movable strip so the schedule can be rearranged.", "You can build and use a stripboard and one-liner to plan the schedule.", ["A <b>one-liner</b> is a condensed version of the schedule with one line per scene, showing scene number, interior or exterior, day or night, location, cast required and estimated page count. A <b>stripboard</b> (physical, or in scheduling software) lays out a strip for each scene, usually colour-coded (for example by interior or exterior and day or night), that can be moved to try different orders of shooting.", "The point is to find the best order to shoot, which is almost never the order of the script. Group strips by location, cast availability and lighting conditions. Look at each day’s total to see if the amount is achievable. The stripboard is a working document that changes constantly, and the one-liner is a clear overview for others. Keep older versions so you can see why decisions were made."], ["I can say what a one-liner and a stripboard are.", "I can explain why strips are moved and what they are grouped by.", "I can build a stripboard from a breakdown and check each day’s page count.", "For a project I can predict the best shooting order, test alternatives, and justify the final board against cost and cast constraints."], [["Why is the shooting order rarely the script order?", "Grouping by location, cast and lighting saves time and money, so scenes are scheduled for efficiency instead."], ["What information is on a one-liner?", "Scene number, interior or exterior, day or night, location, cast and estimated page count."]], "hps", "Create a stripboard (physical cards or software) for your film. Try two different shooting orders and predict which has fewer company moves. Count the moves in each to check.", []], ["Day-out-of-days", "A day-out-of-days chart shows on which days each cast member or element is needed, so you can see when they work, rest and overlap.", "You can build and read a day-out-of-days chart to plan cast and resources.", ["A <b>day-out-of-days (DOOD)</b> chart is a grid with the shooting days across the top and each actor, or other element such as a location or a key prop, down the side. For each day it marks whether the person starts, works, is on hold, or finishes. It is built from the stripboard once the shooting order is set.", "It shows how many days each person needs, when they must be available, and how to schedule them efficiently, for example by grouping an actor’s scenes together so a busy performer is only needed on a few days. It is also used to check costs (cast paid per day) and to see gaps where actors are waiting. Update it every time the schedule changes, and share it with cast so they can confirm their availability."], ["I can say what a day-out-of-days chart shows.", "I can explain what the symbols mean and why it is built from the stripboard.", "I can build a chart from a stripboard and spot where an actor is booked inefficiently.", "For a project I can predict where cast scheduling will be a problem, test alternatives, and justify the final chart against cost and availability."], [["What does a day-out-of-days chart help you check?", "How many days each person is needed and when, so they can be scheduled efficiently and confirmed."], ["What should you do with the chart each time the schedule changes?", "Update it and share it with cast so they can confirm availability."]], "hps", "Build a day-out-of-days chart for your film. Predict which actor has the least efficient booking, then reorder two scenes to improve it and see by how many days.", []], ["Scheduling and the factors affecting it", "A schedule turns the script into days. It has to balance locations, cast, light, setups and people’s limits, and it should leave room for trouble.", "You can build a realistic schedule and explain the choices behind it.", ["Scheduling priorities, roughly in order, are: <b>locations</b> (group scenes to minimise company moves), <b>cast availability</b> (schedule around confirmed dates, and release cast as early as you can), <b>light and time of day</b> (group day scenes and night scenes), and <b>complexity</b> (don’t put your hardest shots first thing in the morning, and consider what to shoot first when the crew are fresh). Other factors include weather for exteriors, child actors’ limited hours, access times at locations, and crew working-hour limits.", "The schedule is only as good as its estimates. Be honest about how many pages and setups a day can realistically hold, and consider the experience of the crew. Leave time for meals and moves, and leave a bit of slack. Share a draft with the HODs early, because they often know what you can’t see, such as that a lighting setup will take longer. Expect to revise it as the recce, casting and permits come in."], ["I can name the main factors that affect a schedule.", "I can explain the priorities when ordering scenes and why estimates must be realistic.", "I can build a one-week schedule from a stripboard and justify the order.", "For a project I can predict where the schedule is most likely to overrun, test it with HODs, and justify the changes I make."], [["Why not shoot the hardest scene first thing in the morning?", "The crew is still settling in and the day’s risk is highest, so it can derail everything after."], ["Why share a draft schedule with HODs early?", "They know their setups’ real needs and can spot problems you can’t."]], "hps", "Schedule your shoot in two different ways (by location first, and by cast first). Predict which gives fewer overtime risks, then ask a DP and a producer to review both and compare their opinions with your prediction.", []], ["Estimating setup and shoot times", "A schedule depends on honest estimates of how long each setup and scene really takes, and these are usually too optimistic.", "You can estimate setup and shooting times from evidence and use them to decide how much a day can hold.", ["Time estimates come from <b>pages per day</b> (a rough guide for the scale of film), the number of <b>setups</b>, and the time for each setup: lighting, camera positioning, rehearsal, and the takes themselves. Complex lighting, camera movement, stunts, night shoots and large casts take longer. New or inexperienced crews take longer than established ones.", "Ask the heads of department how long they need, and compare with similar scenes you have done before. Record the actual times on every shoot, as this is the most useful data for the next one. Build in time for company moves, meals, changes of costume or make-up, and breaks. If the schedule is too ambitious, cut coverage or combine setups with the director. Overestimating the day is a more common failing than underestimating."], ["I can say what time estimates are based on.", "I can explain why complexity and inexperience increase time.", "I can estimate a day’s capacity from setups, pages and the department’s advice.", "For a project I can predict where my estimates are too optimistic, test them by timing real setups, and justify the revised plan."], [["What affects how long a setup takes?", "Lighting complexity, camera movement, rehearsal, cast size, and the crew’s experience."], ["Why record actual times on every shoot?", "They give real data for estimating future schedules."]], "hp", "Time three real setups on a practice shoot (build the shot, light it, rehearse, shoot). Predict the times first, then compare. Use the result to revise one day of your schedule.", []], ["Sequencing for light, cast and location", "Within a day, the order of scenes should follow the available light, actors’ readiness and the geography of the location.", "You can sequence a day so that light, cast and location work together.", ["Once scenes are grouped by day, the order within the day matters. Exteriors need daylight and have a limited window, so schedule them in the best part of the day and plan interiors for the rest. Night scenes belong at the end, which affects cast and crew hours. If lighting changes a lot during a day, shoot scenes needing consistent light together, and consider ‘cover sets’ (an indoor alternative) in case of weather.", "Think about cast: actors with make-up or costume changes need time between scenes, and emotionally demanding scenes need thought about order (see Emotional continuity in Directing). Think about location: don’t make the company cross a building repeatedly, and shoot in the order that avoids undressing and redressing sets. Check against the sunrise and sunset times and the weather forecast for the dates."], ["I can say that the order within a day should follow light, cast and location.", "I can explain what to schedule at which time of day and why.", "I can sequence a day to fit daylight, cast changes and the location.", "For a day with many constraints I can predict the bottlenecks, test the sequence against the actual conditions, and justify the order."], [["Why schedule exteriors in the best part of the day?", "Daylight is limited and changes, so exteriors need priority and interiors can use the rest."], ["What is a cover set?", "An alternative indoor location or scene to shoot if the weather or other problems stop exterior work."]], "hp", "Plan a single shoot day with two exteriors, one interior and a night scene. Use sunrise and sunset times for your location. Predict which scene is the most at risk from timing, then explain how you would protect it.", []], ["Managing a production calendar", "The production calendar shows every date that matters, from first prep to final delivery, and helps everyone see how their work fits.", "You can build and maintain a calendar covering prep, shoot, post and delivery.", ["A <b>production calendar</b> is a master timeline for the whole project: development milestones, funding deadlines, hiring dates, recces, tests, rehearsals, shoot days, wrap, post-production stages and delivery. It includes dependencies, for example that the budget can’t be finalised until the breakdown is done and that permits can take weeks. Working backwards from fixed dates (a festival deadline or an assessment submission) shows when each step must start.", "Keep it in one shared place that everyone can see, update it as plans change and tell people when it does. Include deadlines for other people’s deliverables, because they are the part you rely on. Build slack around the dates that can’t move. Review it regularly with the team, and use colours or categories to make it readable."], ["I can say what a production calendar covers.", "I can explain dependencies and why we work backwards from fixed dates.", "I can build a shared calendar with milestones, dependencies and deadlines for a project.", "For a project I can predict which milestones are most at risk, test the calendar by running a review, and justify how I build slack."], [["Why work backwards from fixed dates?", "It shows when each step must start to meet the deadline, and exposes whether the plan is feasible."], ["Why make the calendar visible to everyone?", "So people can see how their work fits and which of their deadlines other people depend on."]], "hp", "Build a production calendar for your project from first prep to final delivery, working backwards from a fixed submission date. Predict which three milestones are most at risk and why, then check at the halfway point.", []], ["Company moves", "A company move is when the whole cast and crew relocate during a shoot day. It costs a lot of time and should be minimised.", "You can plan moves and estimate their real cost in time.", ["A <b>company move</b> means packing up equipment, moving people and vehicles, and setting up again. It always takes longer than it looks on a map: a 20-minute journey often takes 45 minutes or more with kit, and unpacking, parking and finding the way add time. Moves also affect cast hours, catering and the light available.", "Plan moves carefully: group scenes by location to reduce them, allow at least 30 minutes between locations, and prepare logistics in detail (vehicles, parking, who goes in which car, where the kit goes, how to find the next location). Consider having a second unit or an early team to prepare the next location. If you must move, schedule it at a time that fits naturally, such as lunch."], ["I can say what a company move is.", "I can explain why it takes longer than expected and how to reduce them.", "I can plan a move with travel, parking, packing and setup time included.", "For a multi-location day I can predict the true time of each move, test it by timing a practice run, and justify the schedule I propose."], [["Why does a 20-minute drive cost more than 20 minutes?", "Packing, loading, parking, unloading and setting up add significant time."], ["How can you reduce company moves?", "Group scenes by location in the schedule."]], "hp", "Plan a two-location day. Estimate the time for each step of the move, then time a practice move with real kit. Predict the total first, then compare.", []], ["Turnarounds and working hours", "Crew and cast need enough rest between days, and the law and good practice set limits that a schedule must respect.", "You can build a schedule that respects working-hour rules and safe turnaround time.", ["A <b>turnaround</b> is the time between the end of one working day and the start of the next. Long days and short turnarounds cause fatigue, errors and accidents, particularly driving home after wrap. The UK Working Time Regulations set legal limits and rest periods for workers, and industry agreements and guidance (for example from Bectu and the Film and TV Charity) set standards for rest, breaks and daily hours. Child performers have specific legal limits.", "Plan the schedule so that wrap time plus the next call time leaves enough rest, with meal breaks at proper intervals. Watch for ‘forced calls’ (a call time earlier than the rest period allows) and for long days before early calls. Students and volunteers still need rest, and your institution may have specific rules. If a day runs over, it affects the next, so plan for it. This links to Fatigue and welfare in the health and safety domain."], ["I can say what a turnaround is.", "I can explain why rest and working-hour limits matter for safety and quality.", "I can check a schedule against rest and break requirements.", "For a production I can predict where hours will become unsafe, test the schedule against current rules, and justify changes."], [["Why are short turnarounds dangerous?", "Fatigue leads to mistakes and accidents, including on the drive home."], ["Who has specific legal limits on working hours?", "Child performers, in addition to the general working time rules."]], "hlc", "Check your shoot schedule for rest periods: for each day, write wrap time, next call time and the gap. Predict which day has the worst turnaround, then adjust the schedule to fix it.", [["read", "foundational", "Gov.uk guidance on working time regulations", "Search: “gov.uk working time regulations rest breaks”"]]], ["Cast and location constraints", "Actors, locations and the rules around them (availability, access times, noise, children) are fixed points that the schedule has to fit around.", "You can identify, record and schedule around cast and location constraints.", ["<b>Cast constraints</b> include availability dates, other jobs, working-hour limits, children’s legal limits, religious observances and personal needs, make-up and costume time, and their emotional or physical demands. <b>Location constraints</b> include access times, noise restrictions, parking, power, restricted areas, neighbours, permits that cover specific dates, and what you are allowed to move or change.", "Gather constraints early and record them in one place. Confirm cast availability in writing (see Actor agreements in your deal memo), and get access details in the location agreement. Share constraints with the schedule builder, who treats them as fixed points, and with HODs so they can plan. When a constraint changes, update everything that depended on it, and tell everyone."], ["I can name cast and location constraints.", "I can explain why they are recorded early and treated as fixed points.", "I can build a constraints sheet for a project and use it when scheduling.", "For a project I can predict which constraints will cause conflicts, test the schedule against them, and justify the compromises."], [["Name two cast constraints and two location constraints.", "Cast: availability, working-hour limits. Location: access times, noise restrictions."], ["What should you do when a constraint changes?", "Update everything that depended on it and tell everyone affected."]], "hp", "List all cast and location constraints for your film in a table, with a source for each. Predict which two will cause the biggest scheduling problems, then check by building the schedule.", []], ["Permits, insurance and contracts", "Permission to film, cover if things go wrong, and written agreements with the people involved, are the three foundations of a legally safe shoot.", "You can name what a shoot needs in each category, and secure it in time.", ["<b>Permits and permissions</b>: filming without permission risks being shut down mid-shoot, with footage that may be unusable. Private property needs written consent from the owner or leaseholder. Public land in the UK usually needs a local authority filming permit (many councils have a film office), and parks and heritage sites have their own application processes. Roads and pavements may need traffic management if you restrict movement. Allow two to four weeks or more, and start as soon as a location is confirmed.", "<b>Insurance</b> is often a condition of getting access. Typical cover is public liability (commonly several million pounds, with some councils and venues requiring more), equipment cover, and employers’ liability if anyone is paid. Student productions may be covered by an institutional policy, so check what it includes and excludes before relying on it. <b>Contracts</b> (deal memos, location agreements and releases) put agreements in writing. Everyone you work with should have one before any work begins. Rules and amounts vary, so confirm with your institution and the venue."], ["I can name the three foundations and an example of each.", "I can explain why they must be sorted before the shoot and who can help.", "I can build a checklist of permits, insurance and contracts for a project with deadlines.", "For a project I can predict which will take longest, test the checklist against a real application or policy, and justify the order I tackle them."], [["How far ahead should you apply for a filming permit?", "As soon as the location is confirmed, allowing at least two to four weeks."], ["Why check your institution’s insurance policy?", "It may not cover everything you need (for example particular activities, locations or hired equipment) and may need extra cover."]], "hlc", "Make a checklist for your project of every permit, insurance and contract needed, with a name, date and status. Predict which will be late, then check at the halfway point.", []], ["Location agreements", "A location agreement is the signed contract with the owner that sets out when, where and how you can film, and what you must put right afterwards.", "You can draft, agree and use a location agreement that protects everyone.", ["A <b>location agreement</b> is a signed document confirming the terms on which a property owner permits filming on their premises. It should cover access times, the areas permitted, what can be moved or changed, noise restrictions, parking and power, insurance and liability, how damage will be dealt with, and any payment. It should also say how the location can be shown or named in the film.", "Get it signed before you arrive, by the person with authority (the owner or leaseholder, not just whoever answers the door), and carry a copy on set. Photograph the location before and after to record its condition. Be honest about what you will do (such as crew numbers, lights, cabling, or night work), because surprises damage trust. Neighbours can be affected too, so consider informing them. Templates are available from industry bodies and institutions."], ["I can say what a location agreement covers.", "I can explain who should sign it and why photographs of the location’s condition matter.", "I can draft a location agreement for a simple shoot and brief the owner.", "For a location I can predict the owner’s concerns, test the agreement by role-playing a negotiation, and justify the terms."], [["Who should sign a location agreement?", "The owner or leaseholder, someone with authority over the property."], ["Why photograph a location before and after filming?", "To record its condition and settle any disagreement about damage."]], "hlc", "Write a location agreement for a real or imagined location, then role-play presenting it to a property owner while a partner raises objections. Predict their three main worries first.", []], ["Cast and crew releases", "A release is a written permission to use a person’s image, voice and performance in the film and its promotion.", "You can obtain the right releases from cast, crew and anyone recognisable in the film.", ["Actors and crew appear in or contribute to the film, and anyone identifiable in it (including members of the public or extras) may need to give permission for their image to be used. A <b>release</b> covers use of image and voice, the media and territories the film may be shown in, promotional use, and credits. For actors, the agreement should also cover festival and distribution rights, credit, pay or deferral, and dates.", "Rights should be worldwide and cover all media for the long term, because you can’t submit to some festivals or platforms without them. Get releases signed before shooting, keep them safe, and have a process for extras and crowds (for example a sign saying filming is in progress and signed release forms). Children need a parent or guardian to sign, and may need additional licences. Without releases a finished film can become impossible to show."], ["I can say what a release is for.", "I can explain what rights it should cover and why they must be wide.", "I can prepare and collect releases for a shoot, including for extras.", "For a production I can predict which releases will be hardest to get, test my process, and justify how I handle crowds and children."], [["Why should release rights be worldwide and long-term?", "Festivals, distributors and platforms need clear rights, and narrow ones can block the film being shown."], ["Who must sign a release for a child?", "A parent or guardian, and licensing rules may also apply."]], "hlc", "Draft a release form for actors and extras. Test it by giving it to two friends and asking them to explain what rights they are giving. Predict which clause they will misunderstand, then check.", []], ["Music and archive clearances", "Using someone else’s music or archive footage needs permission for each right involved, and the cost can be large.", "You can plan music and archive use so the film can be shown legally.", ["Using a commercial song involves two sets of rights: the <b>composition</b> (the song, usually owned by a publisher or writer) and the <b>master recording</b> (a specific recording, usually owned by a label). Both usually need permission. In the UK, music licensing bodies such as PRS for Music and PPL administer parts of this, but they do not clear a song for use in a film, which usually needs direct agreements. Archive footage and photographs also need permission from the owner, and ‘found’ internet material is not free to use.", "Safer routes include original music written by a collaborator under a written agreement, music from libraries with a licence that covers your use, and properly licensed royalty-free or openly licensed material. The licence terms matter (where and how long you can show the film, and in what media), and festival and broadcast use often need wider licences t
