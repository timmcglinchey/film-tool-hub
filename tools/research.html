['I can say what naturalistic and stylised lighting mean.','I can explain the techniques that push lighting toward each end (motivation, colour, contrast, direction) and the effect on the audience.','I can recognise where a film frame sits on the range and light a subject at two points on it.','For a scene I can decide where it should sit, design the light, colour and contrast to match, predict the result, test it, and defend the choice against alternatives.'],
[['Give two techniques that push a scene toward stylised lighting.','Strong unmotivated colour, extreme contrast, exaggerated shadows or shafts of light, or light that doesn’t match a plausible source.'],['Can a naturalistic look be heavily lit? Explain.','Yes. It is about how believable the result feels. Naturalistic scenes often use a lot of lighting and control to look unlit.']],'BLW','Light the same simple scene twice: naturalistic (motivated by a window or lamp) and stylised (unmotivated colour, stronger contrast). Show both to someone and ask what each makes them feel. Predict their answers first.'],
['Subjective vs. objective camera','A subjective camera shows events from a character’s point of view. An objective camera observes from outside.','You can choose camera position, movement and framing to place the audience inside or outside a character.',['An objective camera presents events as an outside observer: stable, neutral framing that doesn’t claim to be anyone’s eyes. A subjective camera aligns the audience with a character’s perspective, from a literal point-of-view (POV) shot to subtler cues such as over-the-shoulder framing, handheld unease, or lens and focus choices that mirror how the character perceives the moment.','Most films mix them, and shifts between the two change how close the audience feels to a character. Camera height, distance, movement, focus and lens all signal which one you are using, so the choice should be deliberate and consistent with what the scene needs.'],
['I can say what subjective and objective camera mean.','I can explain how camera position, movement, lens and focus shift a shot between subjective and objective, including POV and over-the-shoulder.','I can shoot the same action objectively and subjectively and recognise each in a film scene.','For a scene I can plan where the camera should be subjective or objective, design shots and movement to do it, predict the effect on the audience, test it, and justify the shifts.'],
[['Name three ways a shot can feel subjective without being a literal POV.','Over-the-shoulder framing, handheld or unsteady movement tied to a character’s state, lens or focus choices that mimic their perception, and holding on their reactions.'],['Why might a filmmaker switch from objective to subjective in a scene?','To bring the audience closer to a character at a key moment, such as fear or realisation, or to show how the character perceives something.']],'KBW','Shoot a short action (someone opening a door to find something unexpected) once objectively and once subjectively. Show both and compare how close each makes the viewer feel to the character. Predict first.'],
['Directing gaze through lighting','Viewers look first at what is brightest, sharpest or highest in contrast, so lighting can lead the eye.','You can predict where viewers will look and shape light to guide them to what matters.',['Viewers tend to look first at the brightest areas, areas of high contrast, strong colour, sharp focus, and faces. Lighting can use all of these: lifting the brightness of what matters, letting less important areas fall into shadow, adding a pool of contrast or colour around the subject, or using shafts and edges of light as lines that lead the eye.','Because light and shadow hide or reveal, they also control what the audience notices and when. This links to the Framework: the key’s position, negative fill and a back edge shape the subject, and salt and pepper touches can steer the eye with a pop of light or colour, or layers of light and dark.'],
['I can say that lighting can lead the viewer’s eye.','I can explain what attracts attention in a frame (brightness, contrast, colour, sharpness, faces) and how light controls each.','I can adjust the lighting of a scene so a chosen subject becomes the first thing viewers look at, and check it.','For a scene I can plan the order in which the audience should notice things, design the light to do that, predict where people will look, test it on viewers, and revise.'],
[['Name three things that attract the eye in a frame and how light can control each.','Brightness (raise or lower an area), contrast (add or remove shadow around the subject), and colour (gel or add a coloured pop). Focus and faces also draw attention.'],['How could you make a background object less noticeable without moving it?','Flag light off it or darken it, reduce its contrast or colour, or keep it out of focus.']],'BLF','Take a cluttered frame and light it three ways so the eye goes to a different subject each time. Ask three people to point to where they looked first and compare with your prediction.'],
['Achieving depth through lighting','Lighting can make a flat, two-dimensional image feel three-dimensional through direction, separation and layers of light and dark.','You can use light direction, separation and layering to build depth, and know which choices flatten.',['A frame is two-dimensional, so depth has to be suggested. Lighting does it in several ways: shadow side (upstage) lighting that models a subject’s form, back or edge light that separates the subject from the background, variation in brightness between the portions of the image (key, fill, back, background), and layers of light and dark moving back through the frame. Falloff can also add depth as light drops off with distance.','Flat lighting (light from beside or behind the camera with even brightness) removes these cues. This links to Upstage Lighting, the Lighting Triad and Salt and Pepper, and to depth from lens and composition choices such as shooting into the L of the room.'],
['I can say that lighting can add depth to a flat image.','I can explain how direction, separation, falloff and variation between portions create depth, and what flattens it.','I can light a subject and space to read as three-dimensional and compare it with a flat version.','For a scene I can plan the lighting layers from foreground to background, predict how deep the frame will feel, test it, and explain how each choice contributes.'],
[['Give three ways lighting adds depth to an image.','Upstage (shadow side) lighting that models form; a back or edge light that separates subject from background; variation in brightness between foreground, subject and background, with layers of light and dark; and falloff over distance.'],['What arrangement tends to flatten an image, and why?','Light from the camera position or beside it with even brightness removes the shadows that show form and gives no separation between subject and background.']],'BLF','Light a subject in a room to flatten the frame (light at the camera, even background), then re-light for depth (upstage key, back edge, darker background, falloff). Compare the two. Predict which layers will add the most depth first.'],
['Lighting day interiors','Interior scenes lit by daylight through windows, where the brightness gap between inside and outside is the central problem.','You can balance interior and window exposure deliberately, and keep the light consistent across a changing day.',['In a day interior, windows are usually the brightest thing in the frame and the light you have least control over, which makes them the point of control. You can expose for the window and add light inside, expose for the interior and let the window blow out as a choice, or reduce the window with ND gel or film, or keep it out of frame.','Daylight is about 5600K and room lights are usually warmer, so mixed colour temperature has to be handled too. The sun moves and clouds pass, so daylight changes between takes and setups. Control the windows (flags, nets, blackout) or add stronger light of your own so the changing daylight matters less.'],
['I can say why day interiors are difficult and name the window as the main problem.','I can explain the options for balancing interior and window exposure and what each costs.','I can light a day interior by choosing the point of control, balancing the interior to it, and checking with false colour or a meter.','For a scene I can plan the lighting across a changing day, predict window and interior readings, choose between ND gel, added light and a blown window, test it, and justify the choice.'],
[['A bright window is in the background of a dialogue scene. What are your main options?','Expose for the window and add light inside; expose for the interior and accept a blown window as a choice; or reduce the window with ND gel or film, or change the framing.'],['Why does daylight through a window cause continuity problems?','The sun moves and clouds change, so brightness and direction shift between takes and setups unless the window is controlled or overpowered.']],'BLF','In a room with a large window, shoot a person exposed for the window, exposed for the interior, and with ND gel on the window (or a simulated reduction). Check each with false colour and compare.'],
['Lighting day exteriors','Exterior scenes in daylight, where the sun is a hard, moving light you can’t switch off.','You can control or work with the sun to get the light you want, and manage its changes across a shoot.',['In a day exterior the sun is a hard source whose direction and height change through the day, and the sky is a very large soft source. The four portions of light still apply, but some, such as the background, can only be changed with global tools like ND, or by changing camera position, time or framing.','Overhead midday sun gives hard top light and deep shadows in the eye sockets. Common solutions are shooting in shade, softening the sun with large diffusion frames, bouncing it back as fill, adding fill lights, or choosing a time of day or subject angle that suits (for example the sun as back light with fill on the face). Clouds and the moving sun change the light, so plan the shooting order, and remember that overcast days act as a giant soft source. Large frames catch wind and need secure rigging.'],
['I can say the sun is a hard, moving source.','I can explain how the time of day and weather change the light and the main tools for controlling it.','I can light a day exterior using shade, diffusion, bounce or fill, expose around the sky or background, and check the result.','For a location I can plan the day around the sun’s path and the weather, design the light and fill, predict the contrast, test it, and justify the schedule and compromises.'],
[['Why is midday sun difficult to light with, and what can you do about it?','It is hard top light with harsh shadows, especially in the eyes. Move to shade, diffuse it with large frames, bounce or add fill, or change the time or subject angle.'],['Which portion of light can you usually not change with lighting in a bright exterior, and what do you do?','The background or sky. Treat it as your point of control, use ND or change framing or camera position, and build the other portions around it.']],'BLF','Shoot the same subject at midday in direct sun, in shade, with a diffusion frame (or reflector fill), and with the sun as back light plus fill. Compare faces and contrast and read the contrast ratios. Predict first.'],
['Lighting night interiors','Interior night scenes are built from practicals and a few controlled sources, so the space reads as dark but readable.','You can make a night interior feel dark while keeping enough light to record faces and detail.',['A night interior has to look dark without being black. The usual approach is to make practicals (lamps, screens, signs) the visible motivation and add controlled light that matches them at low levels, so the subject is readable while the space still feels dark. Keeping highlights on practicals under control and holding some shadow detail are part of the exposure judgement.','Colour helps: warm practicals against cooler light from windows is a common way to read as night, though it is a convention more than realism. Windows at night are dark, so the view outside needs light too if you want it visible. Lower light levels also mean paying attention to noise, lens speed and ISO.'],
['I can say what makes a night interior look like night.','I can explain how practicals, colour contrast and light levels create the look and what the constraints are.','I can light a night interior with practicals and a few sources, and expose it to keep faces readable and highlights under control.','For a scene I can design the night look from motivated sources, predict readings and noise, test it, and justify how dark or readable it should be.'],
[['How do you make a scene read as night without it being black?','Use practicals as visible motivation, keep overall levels low with controlled light that matches them, and keep faces readable with some shadow detail.'],['What technical problems come with low light levels?','Noise from higher ISO, limited lens speed, and practicals that clip in the highlights.']],'BLW','Light a room at night with only practicals, then add one small controlled source to lift the faces. Compare how dark each feels, and check the practicals’ highlights and noise in the shadows. Predict first.'],
['Working with only available light','Working with the light already at a location, using position, timing and simple control instead of adding lights.','You can read a location’s light and plan the shoot around it to get the best from it.',['Available light means working with the light that already exists at a location (sun, windows, practicals, street lights) without adding your own lights, though some definitions allow simple reflectors or flags. The skill is reading the light: where it comes from, how hard or soft it is, how it changes through the day, and where in the space it falls best.','You control it through camera position, where you place the subject relative to the source, the time you shoot, what you frame out, and what you block or reflect. It is common in documentary and low-budget work, and it demands fast lenses, comfort with low-light settings and good exposure strategy, because you can’t add light to fix a problem.'],
['I can say what available light means.','I can explain how to read and use existing light and the limits of working without added lights.','I can shoot a scene in available light by choosing the time, position and framing to suit it, and exposing for it.','For a location I can scout, plan when and where to shoot, predict the exposure and look, test it, and justify the choices and compromises.'],
[['Without adding lights, name three ways to control the look of a scene.','Move the subject or camera relative to the light, choose the time of day, frame out unwanted light, and block or reflect light with simple tools.'],['Why does working in available light demand good exposure judgement?','You can’t add light to fix a problem, so you must choose a position and exposure that protect what matters.']],'BLW','Visit one location at three times of day and photograph the same subject using only existing light. Note the direction, hardness and colour, and how you would frame each. Predict which will be best before you go.'],
['Atmospherics (haze and smoke)','Haze, smoke and fog make light visible, add depth and lower contrast, and bring safety and continuity responsibilities.','You can use atmospherics deliberately and safely, and predict what they do to light and exposure.',['Atmospherics are particles in the air, such as haze, smoke or fog. They scatter light so beams become visible, separate planes in depth, soften and lift the shadows (reducing contrast), and can shift colour. Backlight shows atmosphere best, and the density of the effect changes how strongly everything reads.','They bring responsibilities: a risk assessment, permission from the location, checks on ventilation and smoke or fire alarms, and awareness of people with asthma or other sensitivities. Continuity is difficult because density drifts, wind moves it outdoors, and machines can make noise that affects sound. Plan, test and agree the safety measures with the production before using any.'],
['I can say what atmospherics are and what they do to light.','I can explain how haze affects beams, depth, contrast and colour, and the safety and continuity concerns.','I can use light haze to show light beams and add depth, with a risk assessment and safety checks in place.','For a scene I can decide whether and how much atmosphere serves the look, plan sources and safety measures, predict the effect on contrast and exposure, test it, and justify the choice.'],
[['Name three visual effects of haze on a lit scene.','It makes light beams visible, adds depth by separating planes, and lowers contrast by lifting shadows.'],['What must you arrange before using haze or smoke on a shoot?','A risk assessment, permission from the location, ventilation and alarm checks, awareness of health sensitivities, and a plan for continuity.']],'BLW','With permission and a risk assessment in place, shoot a backlit subject with and without light haze. Compare beam visibility, depth and contrast with false colour. Predict first. If haze isn’t possible, study frames from films that use it.',[['read','foundational','HSE guidance on smoke and haze effects','Search: “HSE smoke vapour effects entertainment”']]],
['Lighting for different skin tones','Skin reflects different amounts of light and varies in tone and undertone, so lighting and exposure must be tested for each person.','You can expose and light different skin tones well, and avoid habits that favour one.',['Skin tones differ in how much light they reflect, their undertones, and how much they show specular highlights. One exposure setting won’t suit everyone in a frame, so check faces directly with a meter, waveform or false colour instead of relying on habit or the monitor.','Practical approaches include lighting each person for their own skin (placing them differently relative to the key, adjusting fill and the contrast ratio), using soft sources and controlling shine with make-up or diffusion, and choosing lights with good colour rendering. Historically, film stocks and processing were calibrated for lighter skin, which shaped lighting habits, and modern cameras are more capable. Testing with the actual people and camera is still the most reliable method.'],
['I can say that skin tones reflect and render light differently.','I can explain why one exposure and lighting setup won’t suit all skin tones and the tools for checking.','I can light and expose a subject for their skin tone, check with scopes, and balance a frame containing different skin tones.','For a production I can test cameras, lights and make-up on the actual cast, predict how each will render, adjust the lighting for each person, and justify the choices.'],
[['Why can’t you use the same exposure and lighting for everyone in a frame?','Skin reflects different amounts of light and has different undertones and specular behaviour, so one setting can overexpose one face while underexposing another.'],['How would you check a face’s exposure objectively?','With a meter, waveform or false colour on the face, not only by eye on the monitor.']],'BLS','With consent, photograph several people of different skin tones under the same lighting and exposure, then adjust placement, fill and exposure for each. Compare scopes and images. Predict first.',[['read','deeper','DP interviews and published camera and lighting tests','Search: “lighting for different skin tones cinematography”, and compare several sources']]],
['Lighting for subject movement','When subjects move through a space, the light has to work along their path as well as at the start and end marks.','You can plan lighting that holds up as people and the camera move.',['Moving subjects change their distance from lights (see Inverse square law), their direction relative to the key, and the background behind them, so exposure and shadow change as they move. Larger, softer sources or lights placed farther away reduce falloff changes across a path, and layering lights in pools along it, or following a subject with a light from out of frame, are common solutions.','When the camera also moves, more of the space is visible, so lights have to be hidden, built into practicals or placed to stay out of shot. Rehearsing with the lighting, blocking the movement around the light and keeping the key on the upstage side as the subject turns all help, and the plan has to be agreed with the director, 1st AD and camera team.'],
['I can say that movement changes exposure and shadow.','I can explain how falloff and direction change along a path and the main solutions (distance, soft sources, pooled lighting, following lights).','I can light a short move so exposure and look hold across it, and check it at several marks.','For a scene with a moving subject and camera I can design the lighting for the whole space, predict readings at key marks, rehearse and test it, and justify compromises.'],
[['Why does a subject’s exposure change as they walk toward a light?','Falloff: the light’s intensity changes with distance, so they get brighter as they approach and darker as they move away.'],['Name two ways to keep exposure consistent along a path.','Use a larger or farther source to reduce falloff changes, pool several lights along the path, or follow the subject with a light.']],'BLT','Have someone walk a 5m path past a light. Read the exposure at the start, middle and end with a meter or false colour. Then re-light (farther source, diffusion, second light) and compare. Predict first.'],
['Lens testing','Lens testing is a structured way to see how lenses actually behave, so you choose them on evidence, not reputation or specifications.','You can plan and run a fair lens test, read the results, and choose lenses for the look and the job.',['A lens test puts lenses in the same controlled conditions so any differences come from the lenses, not the setup. Use the same camera, tripod, lighting and distances, and change only the lens. Typical things to check are sharpness across the frame and at each aperture, vignetting, distortion (with a grid or straight lines), focus breathing during a focus pull, flare with a light source in or near frame, the look of out-of-focus highlights (bokeh), colour and contrast, and minimum focus distance.','Testing also shows practical problems: stiff or inaccurate focus marks, exposure differences between lenses set to the same stop, and colour or contrast mismatches between lenses in a set that will be cut together. Record the settings and results so you can compare them later, and judge them against the look and demands of the project.'],
['I can say why lenses are tested.','I can list what a lens test should check and why the conditions must be controlled.','I can plan and run a fair test of two lenses and record what I see.','For a project I can design a lens test that answers my specific needs, predict what I expect to see, run it, analyse the differences, and choose lenses with evidence for each decision.'],
[['Why must you change only the lens when comparing lenses?','So any difference in the results comes from the lenses, not from changes in light, distance, camera or settings.'],['Name four things a lens test can reveal.','Any four of: sharpness and vignetting across the frame, distortion, focus breathing, flare, bokeh, colour or contrast differences between lenses, and focus accuracy.']],'BE','Test two lenses of the same focal length on the same camera. Shoot a detailed scene at several apertures, a grid for distortion, a light source for flare and out-of-focus highlights, and a focus pull for breathing. Predict the differences first, then compare.'],
['Lighting spaces, not just subjects','Lighting a space means building the light of the whole room or location first, so people can move freely, instead of lighting each subject in isolation.','You can decide when to light the space, when to light the subject, and how to combine them.',['Lighting a subject means shaping light for one person or object in one position. Lighting a space means creating the light of the whole location, such as a soft overhead source, bounced light, or lights placed outside windows, so the environment reads consistently from many angles. The Framework’s Room Tone is one way of doing this.','A lit space gives actors and camera more freedom, supports camera movement and makes coverage faster and more consistent, but it can reduce control over faces and contrast, and can look flat if nothing shapes it. Many scenes combine the two: a base level for the space, then added shaping on the subject where the story needs it.'],
['I can say the difference between lighting a space and lighting a subject.','I can explain the advantages and limits of each and give examples of how a space is lit.','I can light a room so actors can move through it, then add shaping on the subject where needed.','For a scene I can decide how much to light the space versus the subject, design the base and shaping lights, predict the readings, test it with blocking and camera movement, and justify the balance.'],
[['Give one advantage and one limitation of lighting the space instead of each subject.','Advantage: freedom for blocking and camera movement, and a consistent look. Limitation: less control over faces and contrast, and it can look flat.'],['How can the two approaches be combined?','Light a base level for the whole space, then add shaping light on the subject where the shot needs it.']],'BLF','Light a room with only a soft base (bounced or overhead light), have a person move through it while you film from several angles, then add shaping light on their face for one angle. Compare how each version holds up. Predict first.'],
['Catchlights','A catchlight is the small reflection of a light source in the eyes. It gives a face life and focus.','You can see, create and control catchlights, and know when they help or distract.',['A catchlight is the reflection of a light source in a subject’s eyes. Without one, eyes can look flat or lifeless. Its shape, size and position show what the light is (a window, a soft source, a bare lamp) and where it sits, so it also affects how natural the lighting feels.','You can create or improve a catchlight by placing the key where it will reflect in the eyes, adding a small source or bounce card close to the camera axis, or moving the subject’s head or eyeline slightly. Several competing catchlights from multiple sources can distract, and glasses or very dark scenes may need a different solution. In the Framework, adding a catchlight is one of the salt and pepper touches.'],
['I can say what a catchlight is.','I can explain why catchlights matter and what their shape and position say about the light.','I can see whether a shot has a catchlight, and add or adjust one with a small source, bounce or repositioning.','For a scene I can decide where catchlights should appear, plan how to create them across a changing shot, predict how they will look, test it, and justify when to leave them out.'],
[['What does a catchlight add to a shot?','Life and focus in the eyes. It also shows the shape and position of the light source.'],['Name two ways to add a catchlight to a shot that doesn’t have one.','Add a small source or bounce card near the camera axis, or move the key or the subject’s head or eyeline so the light reflects in the eyes.']],'BLF','Film a close-up with no catchlight, then add one with a small source or bounce card and compare. Then try two catchlights from different sources and see whether the second helps or distracts. Predict first.'],
['Dynamic range and latitude','Dynamic range is the range of usable information in an image, from its darkest to its brightest parts.','You can describe your camera’s dynamic range, recognise clipping and crushing, and expose to make the most of it.',['Dynamic range is the range of useable information in your image, from its darkest part to its brightest. Beyond those limits there is no useable light information: bright areas are overexposed (“blown out”) and dark areas are underexposed (“crushed”). It is usually measured in stops, and a camera’s dynamic range is the span of stops it can record with useable detail.','Latitude is related: how far you can over- or underexpose and still recover an acceptable image. The scene’s own brightness range has to fit within what the camera can record, which is why exposure strategy, lighting ratios and tools such as waveform and false colour matter. Footage recorded in log or RAW generally gives more room to adjust in the grade.'],
['I can define dynamic range and say what blown out and crushed mean.','I can explain dynamic range in stops, its relationship to latitude, and why a scene’s contrast must fit the camera.','I can judge from scopes or false colour whether a scene fits my camera’s dynamic range, and adjust exposure or lighting to protect highlights and shadows.','I can test my camera’s usable dynamic range, predict where a given scene will clip or crush, plan lighting and exposure to fit it, verify with a test, and justify what I chose to sacrifice.'],
[['What do “blown out” and “crushed” mean?','Blown out: overexposed highlights with no usable detail. Crushed: underexposed shadows with no usable detail.'],['A scene has a bright window and dark corners and exceeds your camera’s dynamic range. What can you do?','Reduce the contrast (add light to the shadows, reduce the window with ND gel or flags), choose what to protect (the point of control), or accept clipping as a creative decision.']],'SBT','Shoot a grey scale or a high-contrast scene at exposures in one-stop steps from clearly under to clearly over. Use waveform and false colour to find where highlights clip and shadows lose detail, and count the stops of usable range. Predict first.'],
['Sensor size and format','Sensor size and format describe the size of the image plane. It affects field of view, depth of field, light gathering and the lenses you need.','You can compare sensor formats and predict how each changes framing, depth of field and lens choice.',['Digital cameras capture the image on a sensor, and sensors come in standard sizes: Micro Four Thirds, APS-C (Super 35), full frame (35mm), and larger formats such as large format and medium format. Size also decides which lenses cover it (see Image circle and sensor coverage).','A larger sensor gives a wider field of view for the same focal length (see crop factor), a shallower depth of field at the same framing and aperture, and generally more light-gathering area, but it needs larger and more expensive lenses and equipment. Sensor size alone does not decide image quality, since sensor design, processing and recording also matter.'],
['I can name the main sensor formats.','I can explain how sensor size affects field of view, depth of field and lens coverage.','I can compare two cameras with different sensor sizes and predict the framing and depth of field each gives with the same lens settings.','For a production I can choose a format for the look, budget and workflow, predict its effect on lenses and shots, test it, and justify the choice.'],
[['Name four sensor formats from smallest to largest.','Micro Four Thirds, APS-C (Super 35), full frame (35mm), and large or medium format.'],['How does a larger sensor change depth of field at the same framing and aperture?','It gives shallower depth of field.']],'BES','Frame the same subject at the same distance and aperture on two cameras with different sensor sizes if you can (or compare published tests). Note the field of view and depth of field. Predict first.'],
['Frame rate and motion rendering','Frame rate is how many images the camera captures per second. It sets how motion looks and how slow motion works.','You can choose a frame rate for the look, the delivery format and the region, and explain how it changes motion.',['Frame rate determines the number of still images the camera captures each second, for example 24, 25, 30, 60 or 120fps. System frequency is the electrical frequency used in your region: the UK uses the PAL system at 50Hz, so conventional footage is shot at 25fps, while the US uses NTSC and often 24 or 30fps.','Frame rate changes how motion looks. Lower rates (24-25fps) give the familiar filmic motion, higher rates look smoother, and shooting at a higher rate than you play back (for example 50fps played at 25) gives slow motion. Frame rate interacts with shutter speed (the frame rate × 2 rule), with flicker from lights, and with the frame rate of the project you deliver in, so choose it at the start.'],
['I can say what frame rate is and what the UK convention is.','I can explain system frequency, how frame rate changes motion, and how shooting at a higher rate creates slow motion.','I can set a frame rate for a project, pair it with the right shutter, and work out slow-motion speed from capture and playback rates.','For a project I can choose frame rates for each shot, predict the motion look and any flicker or workflow issues, test them, and justify the choices.'],
[['Why is UK footage conventionally shot at 25fps?','The UK uses the PAL system with a 50Hz frequency, so 25fps is the convention.'],['You shoot at 50fps and play back at 25fps. What do you see?','Slow motion at half speed.']],'BEM','Film the same action (a person walking, a spinning object) at 25, 50 and 100fps, with shutter set by the frame rate × 2 rule. Play them at 25fps and compare motion and speed. Predict first.'],
['Resolution','Resolution is the number of pixels in an image. More pixels allow more detail, but detail also depends on the lens, focus and compression.','You can compare resolutions and decide how much you need for a project.',['Resolution is the number of pixels in the image: effectively individual dots of light and colour information. It is described by width and height (for example 1920×1080, HD, or 3840×2160, UHD, often called “4K”). More pixels mean more potential detail and more room to reframe or stabilise in post, but also larger files and heavier processing.','Resolution is not the same as sharpness. Real detail depends on the lens, focus, sensor, compression and motion, and on how large and close the screen is. Choose resolution for the delivery format and the reframing you might need, not just the highest number available.'],
['I can say what resolution is.','I can explain common resolutions, the difference between resolution and sharpness, and the trade-offs of higher resolution.','I can choose a capture resolution for a delivery format and reframing needs and set it on my camera.','I can test how resolution, lens and compression combine to affect real detail on my camera, predict the result, and justify a resolution for a project.'],
[['What is the difference between 1920×1080 and 3840×2160?','HD versus UHD (often called 4K). UHD has four times as many pixels.'],['Why doesn’t higher resolution always mean a sharper image?','Sharpness also depends on the lens, focus, compression and motion, not only the pixel count.']],'SBM','Shoot a detailed chart or scene at two resolutions on the same camera and lens and compare at full size. Then reframe a UHD shot into an HD frame. Predict how much detail you will gain or lose first.'],
['Aspect ratio','Aspect ratio is the proportion of the frame’s width to its height. It shapes composition and mood.','You can choose an aspect ratio deliberately and handle it through shooting and delivery.',['Aspect ratio describes the frame’s width in relation to its height. Common ratios include 4:3 (older television), 16:9 (HD and most modern screens), 1.85:1 (common cinema) and 2.39:1 (widescreen cinema, often associated with anamorphic).','The ratio shapes composition: wider frames suit landscapes and groups and can feel epic, while taller ones feel more intimate or enclosed. Decide it early, since it affects framing, lens choice, monitoring and delivery. Shooting one ratio and delivering another means bars or cropping, and anamorphic capture adds a de-squeeze step.'],
['I can say what aspect ratio is and name common ones.','I can explain how ratios affect composition and what happens when a different one is delivered.','I can set up a frame guide for a chosen ratio and compose for it.','For a project I can choose the aspect ratio to serve the story, plan framing, monitoring and delivery around it, test it, and justify the choice.'],
[['Name three common aspect ratios and where they are used.','4:3 (older television), 16:9 (HD and modern screens), and 2.39:1 or 1.85:1 (cinema).'],['Why decide the aspect ratio before shooting?','It affects composition, lens choice, monitoring and delivery, and changing it later can mean cropping or bars.']],'KB','Frame the same scene in 4:3, 16:9 and 2.39:1 using frame guides. Note how each changes the composition and mood. Predict first.'],
['Log vs. RAW vs. Rec.709','Rec.709, log and RAW are three ways a camera can record brightness and colour, trading ease of use against flexibility in the grade.','You can choose a recording format and explain what each keeps, what it costs and how it needs to be handled.',['Rec.709 is the standard colour space and contrast curve for HD video. Footage recorded in it is ready to view and needs little work, but its contrast is baked in and it has limited room to adjust. Log records brightness with a flattened curve that squeezes more of the camera’s dynamic range into the file. It looks washed out until it is converted (with a LUT or colour management) and gives much more room in the grade. RAW records the sensor data with little or no processing, giving the most flexibility but the largest files and the most work in post.','Log and RAW usually pair with higher bit depth, because stretching a wide range across too few levels causes banding. They also reward careful exposure and monitoring with a LUT or false colour. The choice depends on the grade, the workflow and the storage you have (see Show LUT and DIT workflow).'],
['I can name Rec.709, log and RAW and say which is the most flexible.','I can explain what each records, how each looks straight out of camera, and the trade-offs.','I can choose a format for a described project, set it up on my camera, and monitor it with a LUT or false colour.','I can test the same scene in each format, predict how each will behave in the grade, analyse the results, and justify the choice for a project including storage and workflow.'],
[['Why does log footage look flat and washed out?','It records a compressed, flattened curve to hold more dynamic range, so it needs converting (for example with a LUT) to look normal.'],['Give one advantage and one cost of RAW compared with Rec.709.','Advantage: the most flexibility in the grade. Cost: larger files, more processing and careful exposure.']],'SBT','Record the same high-contrast scene in Rec.709 and in log (and RAW if your camera allows). Grade each to match a target look and compare how far you can push highlights and shadows. Predict first.'],
['Bit depth','Bit depth is how many levels of brightness and colour each channel can record. More bits mean smoother gradations.','You can compare 8, 10 and 12-bit recording and know when bit depth matters.',['Bit depth, also called colour depth, determines the amount of colour and brightness information captured within each pixel. Common values are 8-bit, 10-bit and 12-bit: 8-bit gives 256 levels per channel, 10-bit gives 1,024, and 12-bit gives 4,096.','More levels give smoother gradients and more room to adjust in the grade without visible banding, which matters most for skies, shadows and soft light, and with log footage. Higher bit depth also means larger files and demands more of the camera and storage, so the right choice depends on the grade and workflow.'],
['I can say what bit depth is and name common values.','I can explain the number of levels in 8, 10 and 12-bit and why banding happens.','I can choose a bit depth for a project and spot banding in footage.','I can test the effect of bit depth on grading headroom, predict where banding will appear, verify it, and justify a choice including its cost in storage.'],
[['How many levels per channel does 10-bit record?','1,024.'],['When is higher bit depth most important?','When grading heavily, especially with log footage, and in smooth gradients such as skies and shadows where banding shows.']],'SBM','Find or shoot a smooth gradient (a sky, a lit wall) in 8-bit and 10-bit, then push the contrast and saturation in the grade. Look for banding. Predict which will band first.'],
['Chroma subsampling','Chroma subsampling reduces the colour information stored in an image while keeping full brightness detail, to save space.','You can read a ratio like 4:2:2, know what it costs, and decide when it matters.',['Chroma sampling, written as ratios such as 4:2:0, 4:2:2 and 4:4:4, describes how much colour information is kept compared with brightness. Our eyes are more sensitive to brightness detail than to colour detail, so cameras store full brightness resolution but share colour information between neighbouring pixels. 4:4:4 keeps full colour for every pixel, 4:2:2 halves the horizontal colour resolution, and 4:2:0 reduces it further.','The cost shows up in work that depends on precise colour edges, such as green screen keying, heavy grading and fine coloured detail, where more colour information gives cleaner results. For many everyday uses 4:2:0 or 4:2:2 is fine, but it is part of the file size and quality trade-off alongside bit depth and compression.'],
['I can say what chroma subsampling is.','I can explain 4:4:4, 4:2:2 and 4:2:0 and why subsampling is used.','I can choose a chroma sampling for a project (for example for keying) and set it on my camera.','I can test footage with different chroma sampling in a key or heavy grade, predict where the differences will show, verify them, and justify the choice against storage.'],
[['What does 4:2:2 mean compared with 4:4:4?','4:2:2 keeps full brightness detail but half the horizontal colour resolution. 4:4:4 keeps full colour for every pixel.'],['Name a task where chroma subsampling can cause visible problems.','Green screen keying, heavy colour grading, or fine coloured edges.']],'SBM','Shoot a green screen subject (or a high-contrast coloured edge) at 4:2:0 and 4:2:2 if available. Pull a key or push the colour and compare the edges. Predict which will be cleaner first.'],
['Codecs and compression ratio','A codec compresses video so the camera can process and store it. The compression level and bitrate decide file size and quality.','You can compare codecs and bitrates, and choose one for the shoot, the grade and the storage you have.',['Codecs determine the degree of compression applied to footage so the camera can process and store it. Bitrate is the amount of data recorded per second, typically in megabits per second. The compression ratio compares the size of the uncompressed data with the file: the higher the compression, the smaller the file and the more information is discarded.','Common camera codecs include highly compressed H.264 and H.265 (small files, less flexible), lighter-compression professional codecs such as ProRes and DNx (larger files, better for editing and grading), and RAW formats at the top. Editing and storage demands matter too, which is why some workflows use proxies. The choice trades quality against storage, workflow speed and what the camera can record.'],
['I can say what a codec is and what bitrate measures.','I can explain compression, bitrate and compression ratio and the trade-offs between common codecs.','I can choose a codec and bitrate for a project given storage and workflow, and calculate storage needs from bitrate.','I can test codecs on a demanding scene, predict where compression artefacts will appear, analyse the results, and justify a codec and bitrate for a project including storage and editing.'],
[['What does bitrate measure, and in what units?','The amount of data recorded per second, typically in megabits per second.'],['Why might you choose ProRes over H.264?','Lighter compression gives better quality for grading and easier editing, at the cost of larger files.']],'SBM','Record a detailed, moving scene in a heavily compressed codec and in a lighter one if your camera allows. Compare file sizes, look for compression artefacts, then grade both. Predict first.'],
['Light meters','A light meter measures light so you can set exposure and lighting ratios from numbers, not guesswork.','You can choose and use incident and reflected meters, and read the results in stops.',['A light meter measures light and tells you the exposure for a given ISO and shutter. An incident meter measures the light falling on the subject (held at the subject and pointed toward the camera or the light), so it is unaffected by how bright or dark the subject is. A reflected meter, including a spot meter and the one built into a camera, measures the light bouncing off the scene, so what it reads depends on the subject’s own brightness and assumes everything is middle grey.','That is why a reflected reading of a white wall or dark skin needs interpreting, while incident readings give consistent lighting levels. Meters are used to set exposure, to read the key and fill separately and work out contrast ratios in stops, and to check how bright a window or background is. Set the meter to the camera’s ISO, frame rate and shutter before reading.'],
['I can say what a light meter does and name incident and reflected meters.','I can explain the difference between incident and reflected readings and why a reflected reading depends on the subject.','I can set up a meter for my camera, take incident readings of key and fill and a reflected reading of a window, and work out the contrast ratio and the exposure.','For a scene I can plan a metering strategy, predict the readings, take them, compare them with what the camera records, and justify any difference.'],
[['Why does a reflected reading of a white wall need interpreting?','A reflected meter assumes the surface is middle grey, so it tells you to underexpose a bright wall and overexpose a dark one.'],['How do you find the contrast ratio on a face with an incident meter?','Read the key side and the fill side separately (for example key plus fill, then fill alone) and compare the difference in stops.']],'BLT','Use a light meter to read the key and fill on a subject, work out the contrast ratio in stops, then check the same face with false colour or a waveform on camera. Predict the readings first.'],
['Waveform','A waveform monitor plots how bright each part of the image is, so you can judge exposure objectively across the frame.','You can read a waveform to find clipping, crushing and where skin and key areas sit.',['A waveform plots brightness against position: the horizontal axis matches the image from left to right, and the vertical axis shows how bright that part of the image is, from 0 (black) up to 100% (the top of the range). Bright areas show high on the display and dark areas low, so you can see at a glance whether highlights are touching the top (clipping) or shadows are pressed against the bottom (crushed).','It is more precise than the eye or a monitor, which can mislead because of screen brightness and viewing conditions. Read it for the parts of the image that matter, such as a face or a window, and use it to match exposure from shot to shot. Where middle grey and skin sit depends on the recording format (log curves put them at different levels from Rec.709), so learn your camera’s values through testing. A vectorscope is the companion tool for colour.'],
['I can say what a waveform shows.','I can explain its axes and how to spot clipping and crushing on it.','I can use a waveform to set exposure for a subject, compare shots, and find the levels of important areas such as skin and highlights.','I can test where middle grey, skin and clipping fall for my camera and format, predict how a scene will read on the waveform, verify it, and justify my exposure choices from it.'],
[['What do the horizontal and vertical axes of a waveform represent?','Horizontal: position across the image. Vertical: brightness level, from black at the bottom to peak white at the top.'],['Why use a waveform instead of judging by the monitor?','Monitor brightness and viewing conditions vary, whereas a waveform gives objective levels.']],'SBM','Shoot a scene with a face and a bright window and look at it on a waveform. Change exposure by stops and note where the face, window and shadows move. Predict where each will sit first.'],
['False colour','False colour overlays colours on the image to show which brightness level each part sits at.','You can read false colour to check exposure quickly and accurately, and know that schemes differ by device.',['False colour replaces the normal picture on a monitor with colours that each stand for a range of brightness. In many common schemes green marks middle grey, pink or a similar colour marks typical skin levels, and purple or blue and yellow or red mark the crushed shadows and the clipping highlights. Schemes differ between cameras and monitors, so always check the legend.','It is quick and covers the whole frame, so it is useful for setting a key light in a controlled space to middle grey (green), checking that a background or window sits where you want, and spotting areas about to clip or crush. It shows levels, not looks, so you still judge the result on the real image.'],
['I can say what false colour shows.','I can explain what common colours mean, why schemes differ, and what false colour can’t tell me.','I can use false colour to set a key to a target, check the background and highlights, and fix areas that clip or crush.','I can test my monitor’s false colour against a waveform and a grey card, predict how a scene will map, use it to light and expose a scene, and justify the levels.'],
[['In many false colour schemes, what do green and red usually indicate?','Green: middle grey. Red: clipped highlights. Always check the legend, since schemes differ.'],['What can false colour not tell you?','How the image looks aesthetically. It shows exposure levels only, so you still judge the picture itself.']],'SMT','Put a grey card in a scene and check it in false colour. Adjust exposure until it reads as middle grey, then compare the same frame on a waveform. Check your monitor’s legend first, and predict the colour of a face and a window before you look.'],
['Histogram and zebras','A histogram and zebras are the exposure aids built into most cameras and monitors.','You can use each built-in aid for what it actually shows, and know its limits.',['A histogram is a graph of how much of the image sits at each brightness level, from shadows on the left to highlights on the right. It shows the overall distribution and whether the image is piling up at either end, but not where in the frame. Zebras are stripes overlaid on any part of the image above a brightness level you choose, so you can find exactly where highlights are at or near clipping, or where skin sits at a target level.','They are quick and always available, but they depend on what the camera or monitor is displaying, so check whether they are reading the recorded signal or a viewing LUT, and set the zebra level to match your target. They are an aid, not a replacement for a waveform or meter on important shots.'],
['I can say what a histogram and zebras each show.','I can explain what each tool tells me and what it can’t.','I can set zebra levels for a target and read a histogram for clipping or crushing.','I can check how each tool behaves on my camera (including with a LUT or log), predict what it will show, verify it against a waveform or meter, and choose which tools to rely on for a given shot.'],
[['What is the difference between a histogram and a waveform?','A histogram shows how much of the image is at each brightness but not where. A waveform shows brightness by position across the frame.'],['What do zebras tell you that a histogram doesn’t?','Where in the frame the bright (or target) levels are, since a histogram shows no position.']],'BEM','Point a camera at a scene with a bright window and a darker corner. Note what the histogram, zebras and a waveform each tell you, then change exposure and watch each respond. Predict first.'],
['Monitoring on set','Monitoring is how you view and assess the image being captured, using monitors and tools beyond the camera’s own screen.','You can set up and use monitoring on set, trust it appropriately, and keep it consistent with what is recorded.',['Monitoring is the ability to view, and assess elements of, the image being captured by the camera. Monitors are the main accessory in this category, from simple larger or secondary screens that avoid crowding the camera to monitors equipped with tools for focus, exposure, composition and more. Transmission accessories, from a simple cable to wireless video, send the picture to other monitors or software so others can see it.','Good monitoring means knowing what you are looking at: whether it is the recorded signal or one with a LUT applied, whether its brightness and colour are calibrated or only approximate, and whether the viewing environment (sunlight on the screen, a bright room) is misleading you. For critical judgements use scopes and false colour as well as the picture, and agree who watches what so the director, DP and focus puller each have what they need.'],
['I can say what monitoring is and name the main kinds of monitor.','I can explain what a monitor can and can’t be trusted for, and the role of transmission and LUTs.','I can set up a monitor with the tools I need, check that it matches what is recorded, and position it sensibly for the crew.','For a shoot I can plan monitoring for each role (DP, director, focus puller, DIT), including transmission and LUTs, predict the problems, test them, and justify the setup.'],
[['Why can’t you fully trust a monitor’s picture for exposure?','Its brightness and colour may not be calibrated, a LUT may change what you see, and viewing conditions such as sunlight can mislead you. Use scopes or false colour as well.'],['Why send the picture wirelessly to other monitors?','So the director, focus puller and other crew can see it without crowding the camera.']],'EMT','Set up a camera with its own screen and an external monitor in bright light and in a dim room. Compare how the same frame looks, then check with false colour or a waveform. Predict where the screen will mislead you first.'],
['Filter types and what they do','Filters change light before it reaches the sensor. Each does a job that is hard or impossible to reproduce in post.','You can name the main filter types, know what each is for, and decide whether a filter is the right tool.',['The main filter families are neutral density (ND, which cuts light), IRND (ND with infrared cut), polarisers (reduce reflections and glare), diffusion (soften contrast and add glow), graduated filters (darken part of the frame, usually a sky), colour and contrast filters, and clear or protective filters. Filters are fitted in front of the lens, either screwed on or held in a matte box.','Filters earn their place when the effect can’t be created later. A blown sky or a reflection can’t be rebuilt in post, and the optical glow of diffusion is hard to imitate, whereas colour balance and graduated darkening can often be done in the grade. Every filter also costs light, adds surfaces that can reflect or flare, and can soften or tint the image, so use the fewest that do the job, keep them clean, and test combinations before the shoot.'],
['I can name the main types of filter.','I can explain what each type does and which effects can and can’t be done in post.','I can choose filters for a described shot, justify them, and say what each costs.','For a project I can plan a filter package, predict the effect and cost of each filter and stack, test it, and justify what I include and leave out.'],
[['Name three filter types and what each does.','ND cuts light, polarisers reduce reflections and darken skies, and diffusion softens contrast and adds glow. Others are graduated, colour, contrast, IRND and protective filters.'],['Why might you use a filter instead of fixing it in post?','Some effects can’t be recreated, such as blown highlights or reflections, and the optical character of some filters is hard to imitate.']],'BE','Shoot the same scene with no filter, then through ND, a polariser and a diffusion filter if you have them. Note what each changes in light, contrast, reflections and sharpness. Predict first.',[['read','deeper','Filter manufacturers’ guides (Tiffen, Schneider, Formatt-Hitech)','Search: “cinema filter guide”']]],
['Fixed, variable and built-in ND','ND comes as fixed filters, variable filters or built into the camera, each with different trade-offs.','You can choose between fixed, variable and built-in ND and know the problems to watch for.',['Fixed ND filters are glass or resin filters of a set density, such as ND 0.3 (1 stop), 0.6 (2), 0.9 (3), 1.2 (4), 1.5 (5) and 1.8 (6). Densities add when you stack them, so ND 0.6 plus ND 0.9 gives ND 1.5, or 5 stops. Variable ND filters use two polarising layers that you rotate to change the strength. That is quick, but the range is limited, a dark cross (X) pattern or colour shifts can appear at high strength and on wide lenses, and the result is less predictable. Many cinema cameras have built-in ND, either in fixed steps or electronically variable, which avoids extra glass in front of the lens.','With digital sensors, strong ND filters can let infrared light through, which shows up as a colour cast, often a red or magenta tint in dark areas. IRND filters, or an IR cut filter used with the ND, deal with this. Choose by how often the light changes and how critical the image is: fixed or built-in ND for reliability and quality, variable for speed when you can accept the compromises.'],
['I can name the three types of ND.','I can explain how ND densities stack, how variable ND works, and the main problems of each type.','I can choose and combine ND for a described exposure and recognise IR contamination or variable ND artefacts.','I can test fixed, variable and built-in ND on my camera, predict where each will show colour casts or artefacts, verify it, and justify a choice for a project.'],
[['What is the total of an ND 0.6 and an ND 0.9 stacked?','ND 1.5, which is 5 stops.'],['What problems can variable ND have, and why?','It uses two rotating polarisers, so it can show a dark X pattern and colour shifts at high strength and on wide lenses, and its range and strength are less predictable.']],'BEM','Shoot a grey card or plain wall through a fixed ND, a variable ND at several settings, and a stack of fixed NDs. Check for colour shifts, an X pattern and any IR tint in the shadows. Predict first.'],
['Polarisers','Polarisers cut reflections and glare, deepen blue skies and boost colour saturation, with an effect that changes as the filter is rotated.','You can use a polariser to control reflections and skies, and know its limits.',['A polarising filter blocks light waves vibrating in a certain direction, which reduces reflections from non-metallic surfaces such as glass and water, cuts glare, and can darken blue skies and deepen colour. You rotate it to change the effect, which is strongest at about 90° to the sun for skies and at an angle to a reflective surface.','Polarisers cost roughly one and a half to two stops of light, don’t work on metal surfaces, can make skies uneven on wide lenses, and the effect changes if the camera or subject moves relative to the light. A reflection removed optically is very hard to recreate in post, so a polariser is one of the most useful filters for exteriors and for shooting through glass or on water.'],
['I can say what a polariser does.','I can explain how it works, why it is rotated, and when it is most and least effective.','I can use a polariser to reduce a reflection or darken a sky and compensate for the exposure loss.','For a location I can plan the angle and timing for a polariser, predict the effect, test it, and justify using it against alternatives.'],
[['Which reflections can a polariser reduce, and which can it not?','Reflections from non-metallic surfaces such as glass and water, but not from metal.'],['Why might a polarised sky look uneven on a wide lens?','The effect changes with the angle to the sun, so a wide field of view covers regions where it varies.']],'BE','Shoot a window or water reflection and a blue sky with and without a polariser, rotating it through its range. Note the light lost and the effect at different angles to the sun. Predict first.'],
['Diffusion filters','Diffusion filters soften contrast and add glow around highlights, changing how sharp and clinical the image looks.','You can choose and use diffusion filters, predict their effect, and avoid common problems.',['Diffusion filters scatter some of the light inside the filter, which softens fine detail, lowers contrast, lifts the blacks slightly and makes bright light sources glow (bloom). They come in grades of strength, such as 1/8, 1/4, 1/2, 1 and 2, and in families with different characters, such as Black Pro-Mist, Glimmerglass, Classic Soft and Hollywood Black Magic. They are used to flatter skin, take the edge off digital sharpness and add a stylised glow.','The effect depends on the lens, focal length and aperture, and on bright sources in frame, so test the strength on your actual lenses and lighting and match it between shots in a scene. Diffusion can lower contrast more than you want in dark scenes, and stacking it with other filters can add flare. Some looks can be imitated in post, but the optical effect around practicals and highlights is hard to match exactly. Find out what look is wanted, then choose and test.'],
['I can say what diffusion filters do.','I can explain how they change contrast, sharpness and highlights, and how strengths and types differ.','I can choose a diffusion filter and strength for a described look and check the result on camera.','I can test several diffusion filters and strengths on my lenses and lighting, predict the differences, compare them, and justify a choice including how I match it across shots.'],
[['Name three visual effects of a diffusion filter.','Softer fine detail, lower contrast (lifted blacks), and glow or bloom around bright sources.'],['Why must you test diffusion on the actual lenses and lighting?','Its effect changes with focal length, aperture and bright sources in frame, and it must match from shot to shot.']],'BEW','Shoot a person next to a practical lamp with no filter and through two strengths of diffusion if available. Compare the skin, contrast and glow around the lamp. Predict first.'],
['Graduated and contrast filters','Graduated filters darken part of the frame, and contrast filters lower or raise the overall contrast of the image.','You can use graduated and contrast filters on purpose, and know when lighting or the grade is a better route.',['A graduated ND (grad) filter is clear on one side and darkens toward the other, usually used to bring a bright sky down to match the foreground. It comes with a soft or hard edge, and has to be positioned and rotated so the transition matches the horizon, which needs a matte box with a rotating stage. Colour grads tint part of the frame for effect.','The transition line can show if the camera tilts or the horizon is irregular, so grads suit controlled framings. Much of the same effect can now be made in the grade with a gradient or window, but only if the sky still holds detail, which a very bright sky may not. Contrast filters lower the overall contrast by lifting the blacks, with less softening than diffusion, and should be tested like any other filter.'],
['I can say what a graduated filter does.','I can explain soft and hard edges, how a grad is positioned, and what a contrast filter does.','I can fit and align a grad for a described shot and judge its effect.','For a shot I can decide between a grad filter, lighting and the grade, predict the result and its limits, test it, and justify the choice.'],
[['When might a graduated filter be a better choice than fixing a sky in post?','When the sky is so bright it would clip and lose detail without it, since post can’t recover missing detail.'],['What limits the use of a graduated filter?','The transition line can show if the camera tilts or the horizon is uneven, and you need a matte box with a rotating stage.']],'BEW','Shoot a landscape with a bright sky with no filter and with a soft-edge grad, then try to match the grad look in the grade on the no-filter shot. Compare the sky detail and the transition. Predict first.'],
['Matte boxes and filter handling','A matte box holds filters in front of the lens and shades it from stray light. Filter handling is how you fit, order and care for them.','You can set up a matte box, order filters sensibly, and handle and clean them correctly.',['Filtration accessories are what make adding filters to a camera and lens possible. As well as the filters themselves, matte boxes and similar accessories are often required. A matte box mounts on rods or the lens, holds filters in trays or stages (some rotate, for polarisers and grads), and carries flags or a hood that block light entering the lens at an angle and causing flare.','Filters come as round screw-in types or as rectangular sizes such as 4×4 and 4×5.65 inches, so check the filter size fits the matte box. Order matters and conventions vary. A common approach is ND closest to the lens, diffusion in the middle, and polarisers or grads at the front where they can be rotated, but agree it with the DP and test it, since extra filters and surfaces add reflections and flare. Handle filters by the edges, clean them with a blower first, then lens tissue and cleaner, store them in cases, label them, and check for scratches and dust before use.'],
['I can say what a matte box is for.','I can explain filter sizes, why order matters, and how a matte box helps prevent flare.','I can mount a matte box, load filters in a sensible order, and clean and handle them correctly.','For a shoot I can plan the matte box and filter setup for each lens and look, predict flare and reflection risks, test it, and justify the order and choices.'],
[['What does a matte box do besides holding filters?','It shades the lens from stray light to reduce flare, using flags or a hood.'],['How should you clean a filter?','Blow off dust first, then use lens tissue and cleaner, handling it by the edges. Wiping a dusty filter can scratch it.']],'EB','Mount a matte box on a lens, fit ND and a polariser or diffusion filter, and shoot toward a bright light with and without flags. Compare flare and reflections, then swap the filter order and compare again. Predict first.'],
['Motivated camera movement','Camera movement is motivated when it has a reason in the story, such as following action, revealing information or changing emphasis.','You can justify each camera move, and choose to leave the camera still when that serves better.',['A motivated camera move has a reason the audience can feel: following a character or action, revealing something that was out of frame, changing the emphasis of a scene, shifting our relationship to a character, or expressing an emotion or state of mind. A move without a reason can draw attention to the camera and distract from the story.','Motivation can be literal (the camera follows a character who walks) or emotional (a slow push-in as tension builds). Every move also costs time, equipment and rehearsal, and a still camera is often the strongest choice. Plan moves together with blocking, framing and lighting, since the move changes what is seen, what must be lit and what must be hidden.'],
['I can say what makes a camera move motivated.','I can explain common motivations for movement and the effect of an unmotivated move.','I can analyse the motivation of moves in a film scene and design a move for a described motivation.','For a scene I can decide which shots should move and which stay still, design the moves and their motivation, predict the effect and cost, test them, and justify the choices.'],
[['Give three reasons a camera might move.','To follow a character or action, to reveal new information, to change emphasis or the audience’s relationship to a character, or to express emotion.'],['Why can an unmotivated camera move be a problem?','It draws attention to the camera itself and can distract from the story.']],'KBW','Film a short scene twice: once with a static camera and once with moves you can justify. Show both and ask what each makes the viewer feel and notice. Predict first.'],
['Movement names','Camera movements have standard names, so crews can discuss, plan and communicate moves precisely.','You can name and distinguish common moves, and know what each does to the image.',['Camera moves fall into two groups. Moves that rotate the camera from a fixed position are the pan (horizontal), tilt (vertical) and roll (around the lens axis). Moves that physically change the camera’s position include the dolly or track (forward, back or sideways, following or leading a subject), truck (sideways), pedestal (straight up or down), crane or jib (an arm raising, lowering or swinging), and arc or orbit (circling a subject). Handheld, Steadicam and gimbal describe how the camera is supported and may carry out any of these moves.','The two groups look different. A pan changes what is in frame but not the camera’s perspective, whereas a move that changes position creates parallax, with near objects shifting against far ones and a stronger feeling of depth. A zoom changes focal length without moving the camera: it magnifies the image but keeps the same perspective. The dolly zoom (moving one way while zooming the other) is a well-known combination. Use the standard names so the crew understand exactly what you want.'],
['I can name pan, tilt, dolly or track, and zoom.','I can distinguish rotating moves from moves that change position, and describe parallax.','I can identify the moves in a scene and request a specific move from a crew using the right terms.','For a scene I can plan a sequence of named moves, predict how each will look (including parallax and perspective), test them, and justify the choices.'],
[['What is the difference between a pan and a track?','A pan rotates the camera from a fixed position and doesn’t change perspective. A track moves the camera’s position, creating parallax and changing perspective.'],['How does a zoom differ from a dolly in?','A zoom changes focal length without moving the camera: it magnifies the image but the perspective stays the same. A dolly in changes the camera’s position and the perspective.']],'KBW','Film the same subject with a pan, a track past it, and a zoom. Compare how the background behaves in each, and watch for parallax. Predict first.'],
['Low budget vs. big budget solutions','Most camera moves can be achieved at several budgets. The skill is picking the simplest solution that delivers what the shot needs.','You can choose and justify a camera movement solution that fits the shot, the budget and the crew.',['The same move can often be built with very different resources. At low budget: handheld or shoulder-mounted camera, tripod and slider moves, a monopod, a small gimbal, wheeled or improvised dollies (such as a wheelchair or skateboard rig) on a smooth floor, and stabilisation in post. At higher budget: a professional dolly on track, Steadicam or other stabilised systems with a skilled operator, cranes and jibs, remote heads, cable or vehicle-mounted rigs, drone or aerial work, and motion control.','The choice trades smoothness, control, setup time, crew and safety against cost. A cheaper solution can be faster and perfectly good for a simple move, while a larger rig can be slower to set up and light around. Choose the solution from the shot (what it must do and how it should feel) rather than from the equipment you happen to have, test it before the shoot, and plan safety for any rig that carries people, travels at speed or hangs overhead.'],
['I can name a low budget and a high budget way to achieve a camera move.','I can explain the trade-offs between solutions in smoothness, control, setup time and risk.','I can choose and set up a suitable solution for a described shot within a limited budget, and test it.','For a shot I can compare several solutions, predict the result, time and risks of each, test the leading option, and justify the choice.'],
[['Give a low budget and a big budget way to achieve a tracking shot.','Low: a slider, an improvised dolly on a smooth floor, or a gimbal. High: a professional dolly on track or a Steadicam.'],['Why choose a solution from the shot rather than from the equipment you have?','The shot’s needs decide what is necessary. The simplest solution that delivers them saves time and risk, and avoids forcing a rig that doesn’t suit.']],'EWT','Choose a simple move, such as a track-in on a subject. Achieve it three ways with what you can access (for example handheld, slider or improvised dolly, gimbal), time the setups and compare smoothness and results. Predict which will be best before you start.'],
['Rigging and mounting','Rigging and mounting is how a camera is attached to supports and accessories so it is stable, balanced and safe.','You can choose, build and check a camera rig, and mount a camera safely.',['Rigging is everything that supports the camera and its accessories: tripods and fluid heads, baseplates and quick-release plates, rods, cages and shoulder rigs, clamps and articulated arms, suction mounts and other specialist mounts, together with the grip gear that holds it all steady (sandbags, apple boxes, clamps, speed rail, straps, safety chains and wedges). Grip equipment generally means all equipment required to support or move camera and lighting gear.','A good rig is stable, balanced and safe. Balance affects how the camera moves on a head, a heavier camera needs a head and plate rated for it, and mounts should be rated for the load, with a second point of attachment (a safety cable) wherever something could fall. Think about weight, access to media, battery and ports, how quickly the rig can be adjusted and what the operator needs. Unusual mounts, such as vehicles or high positions, need an experienced grip and a risk assessment.'],
['I can name common camera supports and accessories.','I can explain balance, load ratings and why safety cables and sandbags matter.','I can build a camera rig on a tripod or shoulder support, balance it, and attach it securely.','For a shot I can design the rigging, predict stability and safety issues, test the rig, and justify each mounting choice including the risk assessment.'],
[['Why does balance matter when a camera is on a fluid head?','An unbalanced camera tilts or drifts and moves unevenly, making smooth moves harder and stressing the head.'],['What should you check before mounting a camera in a high or moving position?','That the mount is rated for the load, there is a safety cable or second attachment, an experienced grip has checked the rig, and a risk assessment has been done.']],'EWT','Build a camera rig on a tripod head, balance it, and test pans and tilts. Then add a heavier accessory such as a monitor or matte box, re-balance, and note how the handling changes. Predict first.'],
['Tungsten','Tungsten lights heat a filament to make warm (about 3200K), smooth-spectrum light. They give lovely colour but draw a lot of power and run very hot.','You can explain what tungsten does well and badly, use it safely, and choose it, or an alternative, for a job.',['Tungsten lights (also called incandescent or tungsten-halogen) make light by heating a filament until it glows. They are one of the three main types of artificial light on modern sets, alongside LED and HMI. The light is about 3200K and has a full, continuous spectrum, so it renders colour and skin faithfully. Tungsten dims smoothly with a dimmer, but as it dims it also gets warmer (the colour temperature falls) as well as darker.','The costs are efficiency and heat. Most of the energy becomes heat, so a tungsten unit draws a lot of power for its light: a 2K draws about 2,000 watts, roughly 9 amps on UK mains (2,000W ÷ 230V). Housings and barn doors burn skin, nearby gels, diffusion and fabric can scorch or catch fire, and halogen bulbs should not be touched with bare fingers because skin oils shorten their life. Let lamps cool before moving them and use gloves. Converting tungsten to daylight needs a CTB gel, which costs roughly two stops, so tungsten is best used where a warm, 3200K-balanced look is wanted. Common sizes run from small units of a few hundred watts to 1K, 2K, 5K and 10K.'],
['I can say what tungsten lights are, their colour temperature, and that they get hot.','I can explain their spectrum, how they dim, their efficiency and heat, and why they suit a 3200K-balanced setup.','I can set up and use tungsten lights safely, dim and gel them, and calculate their power draw.','I can choose between tungsten and alternatives for a scene, predict the colour, exposure and power consequences (including dimming and CTB), test them, and justify the choice including safety and power.'],
[['What happens to the colour of tungsten light as you dim it?','It gets warmer (the colour temperature falls) as well as darker.'],['Roughly what current does a 2K tungsten draw on UK mains, and why does it matter?','About 9 amps (2,000W ÷ 230V). It matters for circuit loading, so you add up the loads before plugging in.'],['Why shouldn’t you touch a halogen bulb with bare fingers?','Skin oils can create hot spots that shorten the bulb’s life, and the bulb and housing may also be very hot.']],'LG','Light a subject with a tungsten lamp at full power and dimmed to about half, with white balance fixed at 3200K. Compare the brightness and colour. Work out the power draw of the lamp. Allow lamps to cool before moving them, wear gloves, and follow your kit store’s safety rules. Predict the colour shift first.',[['read','foundational','Brown, Cinematography: Theory and Practice','pp.244-262 on the types of light, as cited in the course slides']]],
