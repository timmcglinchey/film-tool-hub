['RF interference with sound','Radio signals from camera and lighting gear, and electrical noise from lights, can interrupt or spoil the sound team’s recordings.','You can recognise and prevent interference between camera, lighting and sound.',['Wireless microphones and other radio gear share the airwaves with other equipment on a set. Wireless video transmitters, wireless lighting control and DMX, phones, wi-fi and Bluetooth can interfere with radio mics, causing dropouts, hiss or buzz. Electrical noise also travels through cables and power: some LED drivers and dimmers, generators and badly shielded cables can cause hum or buzzing in recorded sound.','Prevention is mostly communication and testing. Ask the sound team which frequencies and equipment they use and tell them yours, test everything running together at the tech recce, and keep transmitters and antennas apart. Try different dimming levels, since some LEDs buzz at certain settings, and swap or move noisy units, run cables away from sound cables, and switch off wi-fi and phones where not needed. Record a test and listen on headphones before shooting. Sound will also have its own detailed view of this problem.'],
['I can say that radio and electrical noise can affect sound.','I can explain what equipment can cause interference and what it sounds like.','I can test lights and wireless gear alongside a sound recorder and identify the source of noise.','For a shoot I can plan to avoid interference, predict the likely sources, test and fix them with the sound team, and justify the changes.'],
[['Name two camera or lighting items that can interfere with sound.','Wireless video transmitters, wireless lighting control, dimmed LED lights, generators, and wi-fi or phones.'],['What is the best first step to prevent interference?','Talk to the sound team early about each side’s equipment and frequencies, then test everything running together.']],'HT','With a sound recorder and headphones, test a dimmed LED light at several levels, a wireless video transmitter and a radio mic running together. Note any buzz or dropout and fix it. Work with a sound student or technician. Predict which will cause trouble first.'],
['Practicals with art department','Practicals are lights in the set, so the art department dresses them while lighting powers and controls them. Both need to agree.','You can plan practicals with the art department so they look right and work reliably.',['A practical is a light that appears in the shot, such as a lamp, neon sign or screen. It is both set dressing, which belongs to the art department, and a light source, which concerns the lighting team. Problems arise when neither team owns the detail: bulbs that are too dim, too bright or the wrong colour, flicker, dimmers that aren’t hidden, cables visible in frame, switches that don’t work, and lamps moved between takes.','Agree who does what in pre-production: the art department chooses and places the fittings, while lighting chooses bulbs (wattage, colour temperature, dimmable, with good colour rendering), arranges power and hides dimmers and wiring. Share the lighting plan so the art department knows where practicals sit and their colours, and agree on the on and off state for continuity. Check practicals at the tech recce, and watch heat, fire risk and fragile props. Palette matters too, because the colour of lampshades and surfaces affects the light.'],
['I can say what a practical is.','I can explain why practicals need coordination between art and lighting.','I can plan a practical with the art department, choosing the bulb and power.','For a scene I can design the practicals with the art department, predict problems of exposure, colour and continuity, test them, and justify the choices.'],
[['Who is usually responsible for dressing a practical, and for lighting it?','The art department dresses and places it, while the lighting team chooses bulbs, powers and controls it. Agree this in pre-production.'],['Name three problems a practical can cause.','Too dim or too bright in frame, wrong colour, flicker, visible dimmers or cables, and continuity of its on and off state.']],'BG','Plan a scene with two practicals. Agree with a production design student which bulbs, shades, positions and dimmers you will use, then shoot it. Check the exposure, colour and flicker. Predict the biggest problem first.'],
['Frame lines and boom shadows','The boom operator needs to know the edges of frame and where light casts shadows, so the microphone stays out of the picture.','You can help the sound team record good audio without compromising the image.',['The boom microphone must be as close as possible to the actors without entering the frame, so the boom operator needs to know the frame lines, the edges of the widest shot. Provide a monitor with frame guides, or mark the limits, and tell the sound team about lens changes and movements in advance. The boom operator also needs to watch for boom shadows, where the boom casts a shadow on a wall or actor from a light.','Prevent shadows by placing lights so shadows fall out of frame or on to dark surfaces, using higher or more lateral light positions, adding flags, or lighting from behind the boom path. Test with a boom pass in rehearsal with the lights on, before shooting. If the boom can’t get close enough, discuss compromises such as a wider lens, a closer position, a lavalier microphone or recording a wild track. Lighting and camera changes should be shared with the boom operator.'],
['I can say what frame lines are and why the boom operator needs them.','I can explain what causes boom shadows and basic ways to avoid them.','I can set a frame guide and rehearse a boom pass to find shadows and adjust the lights.','For a scene I can plan camera, lighting and boom positions together, predict the conflicts, test them in rehearsal, and justify the compromises.'],
[['Why does the boom operator need to know the frame lines?','To keep the microphone as close as possible to the actors without being seen in the shot.'],['Name two ways to prevent boom shadows.','Place lights so shadows fall out of frame or on dark surfaces, use flags, or light from higher or at the side of the boom path.']],'BG','Rehearse a two-person scene with a boom operator, a camera frame guide and lights on. Find where the boom shadow falls, then change the light position or use flags to remove it. Predict where the shadow will fall first.'],
['Show LUT and DIT workflow','A show LUT applies the planned look to the image on set. It sits in the DIT workflow, which also handles dailies and data.','You can plan and use a show LUT and understand how it fits into the DIT workflow.',['A LUT (look-up table) converts the colours and brightness of an image from one form to another. A show LUT carries the planned look, based on the look development, and the DIT applies it to monitors (and sometimes camera monitoring) so the cinematographer and director see something close to the intended image while the camera records log or RAW. It is usually applied only to monitoring and dailies, not baked into the original footage.','Plan it before the shoot: test the LUT with camera tests, match it to the camera’s colour space, name and version it, and tell everyone on set which LUT is in use. Be aware that judging exposure with a LUT on can mislead, since it changes how bright things look, so check exposure on the log signal with false colour or a waveform. The DIT passes LUT information and notes to the editor and colourist, so the look continues into post. Distinguish a technical conversion LUT (for example log to Rec.709) from a creative show LUT.'],
['I can say what a LUT is.','I can explain what a show LUT is for and how it differs from the footage.','I can load a show LUT in a monitor, check exposure correctly with it, and describe how it moves to post.','For a project I can plan the LUT workflow from look development to delivery, predict the problems, test it, and justify the choices.'],
[['Is a show LUT normally baked into the original recorded footage?','No. It is usually applied only to monitoring and dailies, while the camera records log or RAW.'],['Why can judging exposure with a LUT applied mislead you?','The LUT changes how bright and contrasty things look, so check the log signal with false colour or a waveform.']],'ES','Apply a show LUT to log footage on a monitor or in software and judge exposure with and without it, then check the same frame on a waveform. Write down how your judgement differed. Predict first.']];
const YR={snd:[["Polar patterns", "A microphone’s polar pattern shows how sensitive it is to sound from different directions around it.", "You can choose a pattern for a situation, predict what it will pick up and reject, and check it by listening.", ["A polar pattern describes how a microphone’s sensitivity changes with the direction of the sound. <b>Omnidirectional</b> mics hear equally from all directions. <b>Cardioid</b> mics favour the front and reject the rear. <b>Supercardioid</b> and <b>hypercardioid</b> mics are narrower at the front but have a small pickup lobe at the rear. <b>Figure-of-eight</b> mics hear front and back and reject the sides. A pattern is a tendency, not a wall: sound off to the side is quieter, not gone.", "Patterns matter on set because most of the work is deciding what to keep out. A shotgun mic is highly directional (and has extra side and rear lobes caused by its design), so it helps against noise from behind but can pick up reflections from the room. Lavalier mics are usually omnidirectional, which makes them forgiving of exact placement but unable to reject anything. Always check which pattern a mic has, and remember that the narrower it is, the more carefully it must be aimed."], ["I can name the main polar patterns and say which way each one hears.", "I can explain what each pattern rejects, why a narrow pattern needs careful aiming, and why patterns are tendencies and not walls.", "I can pick a pattern for a given scene, aim the mic to put noise in its least sensitive direction, and confirm it by listening.", "For a scene with several noise sources I can plan mic type, pattern and position, predict what will leak in, test it against my prediction, and justify the compromise."], [["Where does a cardioid microphone reject sound, and where would you point that part?", "Mainly from the rear. Point the rear of the mic at the loudest noise source, such as a road or a fan."], ["Why can a shotgun mic still pick up a noisy room even though it is highly directional?", "It has side and rear lobes, and it picks up reflections from walls and ceilings that arrive from the front. Direction helps, but it doesn’t remove the room."]], "VOP", "Record someone talking while a radio plays to one side of you. Predict how much of the radio each of an omni and a cardioid (or shotgun) will pick up at the same distance, then test, turning the mic around to find where the radio is quietest.", [["read", "deeper", "Microphone manufacturer guides to polar patterns (Shure, Rode, Sennheiser)", "Search: “microphone polar patterns explained”"]]], ["Signal frequency", "Frequency is how fast a sound vibrates, and it decides pitch, tone and how a sound behaves around a microphone.", "You can think about a sound in terms of its frequencies, and use that to understand mic choice, noise and filters.", ["Frequency is the number of vibrations per second (Hz). Humans hear roughly 20 Hz to 20 kHz. Speech lives mostly between about 100 Hz and 8 kHz: the body and warmth of a voice sit in the low hundreds of hertz, and the consonants that make words intelligible sit in the few-kilohertz range. Low frequencies (rumble, wind, traffic) carry a long way and are hard to block, while high frequencies are absorbed easily and are directional.", "Thinking in frequencies explains many on-set decisions. A <b>high-pass (low-cut) filter</b> removes rumble and wind below a chosen frequency, usually without hurting dialogue if set sensibly. Hum from mains electricity sits at 50 Hz in the UK. Heavy blankets stop high frequencies far better than low ones. A mic’s <b>frequency response</b> shows how evenly it hears across the range, and this is part of why two mics sound different. Filtering decisions should be made by ear and carefully, because anything removed on set is gone for post."], ["I can say roughly what range of frequencies humans hear and that speech sits in the middle of it.", "I can explain why low frequencies are hard to block, what a high-pass filter does, and where mains hum sits.", "I can set a high-pass filter by ear to reduce a noise without damaging dialogue, and describe a noise as low, mid or high.", "For a noisy location I can predict which noises filters will help with and which not, test settings against my prediction, and justify what to filter on set and what to leave for post."], [["Why does a heavy blanket stop a squeaky high-pitched noise better than traffic rumble?", "High frequencies are absorbed easily by soft, heavy materials, while low frequencies pass through or around them."], ["Why be cautious about filtering heavily on set?", "It can’t be undone in post, and too high a cut thins out the voice. It is safer to filter lightly and leave the rest to post."]], "VOR", "Record a voice in a room with a fan or air conditioning, with the high-pass filter off, then at a low setting, then at a higher one. Predict where the voice starts to sound thin, then listen back on headphones to check.", []], ["Microphone types and the impact of the choice", "The type of microphone you choose decides how much it hears, how it sounds, and what you can get away with on set.", "You can explain how the main mic types differ and choose the right one for a situation.", ["Most mics are either <b>dynamic</b> or <b>condenser</b> (capacitor). Dynamic mics are rugged and need no power, but are less sensitive. Condenser mics are more sensitive, with a fuller high-frequency response, and need power (phantom power or a battery). Film sound relies mainly on condensers: <b>shotguns</b> on a boom for the main dialogue, <b>lavaliers</b> worn on the body, and sometimes boundary or other specialist mics. Dynamic mics are used for loud sources or rough conditions.", "Choice has real consequences. Look at <b>self-noise</b> (how much hiss the mic itself makes), <b>sensitivity</b>, <b>maximum sound level</b> before distortion, and <b>pattern</b>. A quiet interior with a good boom position suits a sensitive shotgun, while a reverberant room may make a lav the better option. Wind and handling noise change the answer outdoors. Different mics also change the sound the editor has to match, so mixing mic types between shots in a scene has a cost. There is rarely a single right answer, but you must be able to justify the choice."], ["I can name the main microphone types and say which need power.", "I can explain the trade-offs between dynamic and condenser mics and between shotguns and lavs.", "I can choose a mic type and power it correctly for a situation, and say what I’m trading off.", "For a scene I can plan the mic types for each shot, predict how they will sound and match, test them, and justify the choices including what could go wrong."], [["Why might you choose a lav over a boomed shotgun in a very echoey room?", "A lav sits close to the mouth, so there is far more direct voice compared with the room’s reverberation than a distant boom can achieve."], ["Name two specifications to compare when choosing a mic, and why.", "For example self-noise (hiss), sensitivity, maximum level and pattern. They decide how quiet, how loud and how directional the mic can usefully be."]], "VOU", "Record the same line with two different mic types in the same room and compare them on headphones for hiss, room sound and tone. Write down your predictions first, then check them.", []], ["Boom vs. lav", "A boom mic gives the most natural sound but needs a clear route in. A lav goes where the boom can’t, with a different sound and its own problems.", "You can choose between boom and lav for each shot and use them together, knowing what each gives and costs.", ["A <b>boom</b> mic (usually a shotgun on a pole) is held above or below the actors, close to but outside the frame. It sounds natural, because it hears the voice with some of the room, and it is not affected by clothing. It needs a clear space, a boom operator, and a frame that allows it. A <b>lav</b> is hidden on the body, so it works in wide shots, moving shots or tight spaces, and always gives the same close, voice-forward sound.", "Lavs have costs: clothing rustle, a sound that may not match the boom, and the time to hide them and put them on actors. Booms have costs in shadows, frame lines and reach. The usual professional answer is to record both: the boom as the first choice for sound quality, the lavs as a safety, and let editors choose. Check how they combine, because they arrive at slightly different times (see the speed of sound card) and can be out of phase if mixed without care."], ["I can say what each is and the main reason for choosing one or the other.", "I can explain the costs of each (rustle, shadows, reach, matching) and why both may be recorded.", "I can plan which mic to use for a given shot and set up both, labelling the tracks clearly.", "For a scene I can plan boom and lav coverage, predict where each will fail, test them, and justify the plan including how the two will be combined in post."], [["Name one advantage and one disadvantage of a lav compared with a boom.", "Advantage: it works in wide or moving shots and sounds consistent. Disadvantage: clothing rustle, and the sound may not match the boom’s."], ["Why record both boom and lav for the same take?", "The lav is insurance if the boom is blocked or the shot is wide, and the editor can choose the better track for each line."]], "VOU", "Record a short walking dialogue with a boom and a lav on each person, on separate tracks. Predict which will win for each line, then listen back and note rustle, room tone and any mismatch.", []], ["Proximity effect", "Directional microphones boost low frequencies when the source is very close, making voices boomy as the mic approaches.", "You can predict and control proximity effect, and use or avoid it by choosing mic and distance.", ["The <b>proximity effect</b> is the increase in bass that occurs when a directional microphone (cardioid and similar) is placed very close to a sound source, often within a few centimetres. The closer it gets, the more the low end swells. Omnidirectional mics don’t show it in the same way. Broadcast presenters use it deliberately to sound warmer.", "On set it appears as a boom that moves in and out. As the boom operator moves close to a quiet speaker and then away from a loud one, the tone and level change in ways that are hard to match. Good boom operating keeps a steady distance, and a low-cut filter helps tame it. Close-up lav placement is far enough from the mouth (and mostly omnidirectional) that it is rarely a problem, but any directional close mic can suffer."], ["I can say that directional mics get more bass when close.", "I can explain why it happens with directional mics and not omnis, and why a moving boom varies in tone.", "I can hear the effect, change the distance to control it, and use a low-cut filter appropriately.", "For a performance with changing distances I can predict where proximity effect will cause trouble, test my technique and filters, and justify the settings I choose."], [["Why does a voice sound boomier when a cardioid mic is brought very close?", "Directional mics emphasise low frequencies at very short distances (the proximity effect)."], ["How would you reduce it on a boom?", "Keep a steady distance rather than pushing in close, and use a low-cut filter."]], "VOP", "Speak into a cardioid mic at 5 cm, 15 cm and 40 cm, with a consistent level. Predict how the low end will change, then record and compare. Repeat with an omni if you have one.", []], ["Off-axis colouration", "A microphone sounds different to sound arriving from the side or rear, so a source that drifts off-aim can sound thin or hollow.", "You can hear, predict and prevent off-axis colouration by aiming and choosing mics sensibly.", ["Off-axis colouration is the change in tone when sound reaches a microphone from an angle away from its main axis. Even where the level has dropped only a little, the frequency balance changes: high frequencies tend to fall away first, which leaves a hollow or dull sound. This is worst for narrow shotgun mics, whose side response varies with frequency.", "In practice, it means that a mic that isn’t aimed at the mouth won’t just be quieter, it will sound worse, and the tone will shift as the actor turns. This is also why room reflections (which reach the mic from many directions) can sound coloured. The cures are simple: keep the mic pointed at the source, move it for each line when you can, and be aware of the sound shifting when actors turn their heads or the boom pans. Listen on headphones for the change."], ["I can say that sound off the mic’s axis can change in tone.", "I can explain why aiming matters for tone, not just level, and why shotguns show it strongly.", "I can aim a boom or lav to keep the source on-axis and hear when it drifts off.", "For a moving performance I can plan boom movement to stay on axis, predict where colouration will appear, test and justify the technique."], [["Why can a voice sound hollow when the mic isn’t pointed at the mouth?", "Off-axis, the mic’s response changes, usually losing high frequencies, so the tone gets duller or hollower as well as quieter."], ["Why is this more of a problem with shotgun mics?", "Their narrow pattern and interference tube make the off-axis response very uneven."]], "VOP", "Record a line with a shotgun on-axis, then at 30° and 60° off-axis from the mouth at the same distance. Predict what will change before you listen, then compare.", []], ["Acoustics of spaces", "Every room adds its own sound to the recording through reflections, reverberation and resonance, and you have to deal with it.", "You can judge a space’s acoustics by ear, predict how it will record, and improve or avoid problems.", ["Sound in a room reaches the mic directly and also after bouncing off surfaces. Those reflections create <b>reverberation</b>: hard, parallel surfaces (glass, tile, concrete, bare walls) give a lot of it, while soft furnishings, carpet and curtains absorb it. Rooms can also have <b>resonances</b> and standing waves that boost certain frequencies. The ratio of direct voice to reverberant sound is what the listener hears as ‘roomy’ or ‘dry’, and it is hard to remove afterwards.", "You can’t change the laws of physics but you can change the ratio: place the mic closer to the actor, hang <b>sound blankets</b> or add soft furnishings out of frame, avoid shooting into bare walls, and choose locations carefully on the recce. Clapping once and listening to the decay is a quick test. Remember that reverb is part of how a place feels, so decisions should be agreed with the director and post, not simply minimised."], ["I can say that rooms add reflections and that hard surfaces make more.", "I can explain reverberation, why close mic placement reduces it, and what soft materials do.", "I can test a space by ear, find the worst reflections and reduce them with placement and blankets.", "For a location I can predict how it will record, plan mic placement and treatment, test it, and justify what to treat and what to leave for atmosphere."], [["How can you test a room’s acoustics quickly?", "Clap or speak and listen to how long it rings and what colour it has, ideally with headphones on a recording."], ["Why does moving the mic closer reduce the sound of the room?", "It increases the proportion of direct voice compared with reflected sound."]], "VO", "Record the same line in a bare room and again with sound blankets or soft furnishings on the walls. Predict how much difference it will make, then compare the recordings.", []], ["The signal chain", "The signal chain is the route sound takes from the performer to the recording, and any weak link affects everything after it.", "You can trace a signal from source to recording, and know what each stage does and how it can fail.", ["A typical chain runs: sound source, microphone, cable (or wireless transmitter and receiver), preamplifier (which raises the mic’s tiny signal to a usable level), analogue-to-digital conversion, mixer or recorder, and then monitoring on headphones. Each stage can add noise, distortion or loss, and it’s the weakest stage that limits quality.", "Understanding the chain is how you troubleshoot. If there is hiss, check gain and mic first. If there is crackling, check cables and connectors. If there is no signal on one track, check each link in turn (mic, power, cable, input, routing, headphones). It also tells you where to set levels: get a strong signal early in the chain so noise added later is relatively small, while avoiding overload anywhere. Label everything and check the chain as a whole before the shoot."], ["I can list the main stages in a signal chain in order.", "I can explain what each stage does and what goes wrong at each one.", "I can trace a fault through the chain stage by stage and fix it.", "For a given kit I can plan the signal chain, predict its weak points, test it, and justify the setup including spares."], [["Why does it matter to get a healthy signal early in the chain?", "Noise added later is then small compared with the signal, whereas a weak early signal has to be boosted, boosting the noise as well."], ["There is no sound on one track. What is your approach?", "Check each link in order: mic and its power, cable, input and routing, level, headphones. Swap one item at a time."]], "VOU", "Draw the signal chain for your own kit from mic to headphones. Then deliberately break one link at a time (unplug a cable, switch off phantom power, mute a track) and note what it sounds like. Predict first.", []], ["Gain staging", "Gain staging means setting the level at each stage so the signal is strong enough to stay above noise but never clips.", "You can set levels so recordings are clean, with headroom, and explain what you’re balancing.", ["Gain is amplification. Set it too low and the recording is full of hiss when the level is raised later. Set it too high and the loudest moments <b>clip</b>, which in digital audio is permanent distortion. Gain staging is finding the level that keeps speech comfortably above the noise floor and leaves headroom for the loudest moments. Because performers are unpredictable, ask for the loudest version at a rehearsal and set gain for that.", "Common practice is to aim for dialogue peaks well below the digital maximum (0 dBFS), often somewhere around −12 to −6 dBFS, but check any house standard. Watch the meters, but also listen, because meters don’t tell you about distortion upstream (for example, an overloaded mic or preamp). Some recorders record in 32-bit float, which makes clipping and low recordings much easier to recover, but this does not replace monitoring and sensible gain, and not all of the chain (for example, wireless transmitters) is protected."], ["I can say what gain is and that clipping is distortion.", "I can explain headroom and the trade-off between noise and clipping, and read the meters.", "I can set gain for a rehearsed performance, leave headroom for the loudest line, and adjust as the action changes.", "For a scene with sudden changes in level I can predict the loudest and quietest moments, set levels and limiters accordingly, test, and justify the settings and the risks left over."], [["Why leave headroom when setting levels?", "Performers can get louder than rehearsal, and clipped digital audio can’t be repaired."], ["Why can’t meters alone tell you the recording is clean?", "Distortion can occur earlier in the chain (at the mic or preamp) before the meter, so you must also listen on headphones."]], "VOR", "Record someone speaking at normal level, then shouting suddenly, with gain set from the quiet version. Predict what will happen, then check the meters and listen. Repeat with gain set with headroom for the shout.", []], ["Phantom power", "Phantom power is a 48 V supply sent down the XLR cable to power condenser microphones.", "You can use phantom power correctly and safely, and recognise when a mic needs it.", ["Condenser mics need power. <b>Phantom power</b> (usually written +48V or P48) supplies it down the same balanced cable that carries the audio, from the mixer or recorder. Many professional mics need it, and it’s switched per channel or for the whole unit. Some mics run on internal batteries instead, and a few lavs use a different system called plug-in power, which is not the same.", "Handle it with care. Switch it on after connecting the mic and off before disconnecting, to avoid loud thumps. Dynamic mics are usually unaffected, but some other equipment (certain ribbon mics, unbalanced devices or faulty cables) can be damaged. Running it uses battery power, so check the budget. If a condenser mic is silent or very quiet, check phantom power first."], ["I can say phantom power is used for condenser mics.", "I can explain how it is delivered and the sequence for connecting and disconnecting.", "I can set phantom power per channel, spot when it is missing, and avoid risking other gear.", "For a kit with mixed mics I can plan power for each one, predict the risks, test the setup, and justify my checks, including battery use."], [["A condenser mic is silent. What do you check first?", "Whether phantom power (or its battery) is on for that channel, and then the cable and routing."], ["Why switch phantom power off before unplugging a mic?", "To avoid loud pops and possible damage to the mic or the equipment."]], "VOR", "With a condenser mic connected, switch phantom power off, then on, while listening on headphones at a safe, low volume. Predict what you will hear and the order you should do things in, then note any thump.", []], ["Limiters and pads", "A pad turns the level down before it overloads a stage. A limiter automatically controls peaks after you’ve set the gain.", "You can use pads and limiters as safety tools without relying on them to fix poor gain.", ["A <b>pad</b> is a fixed attenuator (commonly 10 or 20 dB) that lowers the signal before the preamp. It’s used when a source is so loud that it would overload the mic’s electronics or the preamp, however low the gain is turned down. A <b>limiter</b> is a processor that reduces the level when it passes a threshold, catching peaks that would otherwise clip. Limiters can be applied at the input of a recorder, or on a mix.", "They are safety nets, not substitutes for good level setting. A limiter that is working constantly makes the audio pump or sound squashed, and it cannot undo clipping that happened earlier in the chain. Use a pad when the source is loud and the gain is already at minimum with distortion, and use a limiter to protect against unexpected peaks, such as a shout. Check the settings, because the wrong threshold wastes the benefit."], ["I can say what a pad and a limiter each do.", "I can explain the difference between them and why neither replaces good gain setting.", "I can decide when to use a pad or limiter and set them sensibly.", "For a scene with extreme dynamics I can plan pads, gain and limiting, predict the artefacts, test them, and justify the final settings."], [["How does a pad differ from turning the gain down?", "A pad reduces the signal before the preamp, so it can stop the preamp being overloaded, while gain control acts on the preamp’s own amplification."], ["What is a downside of a limiter working too hard?", "It squashes the sound and can cause pumping or distortion, and the level changes are audible."]], "VOR", "Record a loud clap or shout close to a mic with the limiter off, then on. Predict how the waveform and sound will differ, then compare the meters and the recording.", []], ["Balanced audio and XLR", "Balanced audio uses two opposite-polarity signals and a shield to cancel interference over long cables. XLR is the standard connector.", "You can explain why balanced connections work, and use and troubleshoot XLR cables and levels.", ["In a <b>balanced</b> connection the audio travels on two conductors, one carrying the signal and one an inverted copy, plus a shield. Interference picked up along the cable affects both equally, and the receiving input subtracts one from the other, so the interference cancels out while the audio doubles. This allows long cable runs and quiet recordings. On a 3-pin <b>XLR</b>, pin 1 is the shield, and pins 2 and 3 carry the signal and its inversion.", "Unbalanced connections (such as many 3.5 mm leads) are more prone to hum and interference and are limited to short runs. You need to know the signal levels: <b>mic level</b> is tiny and needs a preamp, <b>line level</b> is much stronger, and mixing them up gives a very quiet or very loud, distorted signal. Faulty cables are a major cause of crackle, so test, label and carry spares. Wiring errors (for example, a reversed pin 2 and 3) can leave a signal out of phase."], ["I can say what XLR is and that it is a balanced connection.", "I can explain how balancing cancels interference and what mic level and line level are.", "I can connect and test XLR cables, find a faulty one, and match signal levels between devices.", "For a complex kit I can plan balanced connections and levels, predict where interference could enter, test it, and justify the cable choices."], [["Why can balanced cables run further without picking up hum?", "Interference affects both conductors equally and is cancelled at the input, leaving only the audio."], ["What’s the difference between mic level and line level?", "Mic level is a very weak signal needing a preamp, while line level is much stronger. Connecting one to the wrong input gives a signal that is too quiet or distorted."]], "VOU", "Compare a balanced XLR run and an unbalanced run of similar length near a power cable or dimmer. Predict which will hum, then record both and listen.", []], ["Bit depth and dynamic range", "Bit depth sets how many levels each audio sample can have, and so the dynamic range between the noise floor and the loudest sound.", "You can say what bit depth means for recordings and why film sound uses 24-bit.", ["Digital audio measures the signal many times a second, and bit depth is how finely each measurement is divided. More bits give more steps, so a bigger <b>dynamic range</b> between the quietest detail and the loudest peak before clipping. 16-bit audio has a theoretical range of about 96 dB, and 24-bit about 144 dB, far more than any microphone or room can use in practice. Film and television sound is recorded at <b>24-bit</b> as standard.", "The practical benefit is headroom and quiet detail. With 24-bit you can leave a safe margin below clipping and still record quiet speech cleanly. It does not make clipping recoverable or make a noisy room quiet: the limits are usually the microphone, the preamp and the location, not the bit depth. Some recorders offer 32-bit float, which gives so much range that levels can largely be rescued in post, though you should still monitor and set gain sensibly."], ["I can say that bit depth affects dynamic range and that film uses 24-bit.", "I can explain why more bits give more range and why this doesn’t cure clipping or noise from the room.", "I can set the correct bit depth on a recorder and explain the headroom it gives me.", "For a production I can choose the format settings, predict what limits quality in practice, test it, and justify the settings including any use of 32-bit float."], [["Why is 24-bit used for film instead of 16-bit?", "It gives much more dynamic range, which allows safer headroom while still recording quiet detail cleanly."], ["Does recording in 24-bit make a noisy location sound clean?", "No. The noise is part of the signal being recorded. Bit depth only sets the recording system’s own limits."]], "VOR", "Record a quiet voice at low level in 16-bit and 24-bit, then raise both by the same amount in editing software. Predict which will have more audible noise, then check.", []], ["Sample rate", "Sample rate is how many times per second the sound is measured. Film and video use 48 kHz.", "You can set and explain sample rate and say why it must stay consistent through a project.", ["The sample rate is the number of measurements per second. By the Nyquist principle, a system can capture frequencies up to half the sample rate, so 48 kHz covers beyond the range of human hearing. <b>48 kHz</b> is the standard for film and video, while 44.1 kHz is the standard for music CDs. Higher rates (96 kHz and above) are sometimes used for sound design that will be slowed down, and take more storage.", "The most important rule is <b>consistency</b>: use the rate your post-production pipeline expects (normally 48 kHz) for every file. Mismatched rates cause files to play at the wrong speed or require conversion that can cause errors. Check the camera’s audio settings as well as the recorder’s. If you aren’t sure, ask the editor or post supervisor before shooting."], ["I can say the standard sample rate for film and video.", "I can explain what sample rate means and why consistency across all files matters.", "I can set the correct rate on recorder and camera and spot a mismatch.", "For a production I can agree format settings with post, predict what a mismatch would cause, test it, and justify any non-standard choice."], [["What sample rate does film and video usually use?", "48 kHz."], ["Why check the rate on both recorder and camera?", "A mismatch can cause speed or sync problems, or extra conversion, when the files are brought together."]], "VOR", "Record a short clip at 44.1 kHz and another at 48 kHz, then place both on a 48 kHz timeline in editing software. Predict what each will do, then note what the software does to the 44.1 kHz file.", []], ["Mono vs. multitrack recording", "Dialogue is usually recorded on separate mono tracks, one per microphone, plus a mix for reference.", "You can plan a track layout so every mic is recorded separately and clearly labelled.", ["Film dialogue is normally recorded in <b>mono</b>, with each microphone on its own track. A polyphonic WAV file holds all the tracks together. This lets the editor and mixer choose, balance and clean each source separately in post. A common layout is the boom on track 1, each lav on a track of its own, and a mixed version (the <b>mix track</b>) on a pair of tracks for quick use. Ambiences or effects may be recorded in stereo or other formats when needed.", "More tracks mean more flexibility but also more to manage: more to monitor, more storage, more to name correctly. Decide the layout in advance and keep it consistent through a day or production, so editors know what each track is. If you change it, tell them and record it in the sound report. A mixed track alone is quick and easy but allows no later rescue of a voice you didn’t want to balance in the mix."], ["I can say dialogue is usually recorded as separate mono tracks.", "I can explain why isolated tracks and a mix track are both recorded.", "I can set up a track layout, label each track, and explain it in the report.", "For a scene I can design the layout for the number of mics, predict what post will need, test the setup, and justify it, including what I would change if the scene gets more complex."], [["Why record each microphone on its own track?", "So post can balance, clean and choose between mics, which is impossible if they are only recorded as a single mix."], ["Why record a mix track as well?", "It’s a quick reference for editors, and a back-up if something goes wrong with the separate tracks."]], "VOR", "Record a two-person dialogue with a boom and two lavs on separate tracks plus a mix. In editing software, mute and solo each track to see what each gives. Predict how they differ first.", []], ["File management (embedding scene, shot and take)", "Sound files need clear names and the right metadata so editors can match every file to its picture, long after the shoot.", "You can name, organise and protect files in a way that nobody has to guess later.", ["Recorders produce numbered files, and the sound team makes them meaningful. The professional format is the <b>Broadcast WAV (BWF)</b>, which can carry the scene, shot and take, a timecode start point and track names inside the file as metadata. Agree a naming system with the script supervisor and editor before shooting (for example, one that includes scene and take), keep it identical to the slate, and don’t improvise during the day.", "Organise the files into a folder per day (and per roll, if used), and back them up promptly to at least two separate places, only deleting or formatting cards when you’ve verified the copies (see the DIT and data management role). Bad naming is a common cause of expensive post-production problems: files that don’t match the picture, duplicated names across days, and unknown tracks. Check numbering at lunch and at wrap."], ["I can say why files need meaningful names and metadata.", "I can explain BWF metadata, naming systems and why scene and take must match the slate.", "I can set up naming and folders for a shoot day, and enter scene and take correctly as I work.", "For a production I can agree a naming and folder system with picture and post, predict what could go wrong, test it, and justify it, including how I would recover from a mistake."], [["Why should a file’s name and metadata match the slate?", "So editors and assistants can identify and sync it with the right picture without guessing."], ["When is it safe to format a card or delete files?", "Only after the files are copied to at least two separate places and verified. Never earlier."]], "VOR", "Record several takes with scene and take entered on the recorder, then export the files and check what the file names and metadata look like in editing or file-viewing software. Predict what will show before you look.", []], ["Writing sound logs on set", "A sound report records what was recorded, on which tracks and with what settings, and which takes are good.", "You can complete a sound report that an editor can use without having to ask you.", ["A <b>sound report</b> (sound log) is the paperwork that travels with the recordings. It usually notes the production, date, recorder, file or roll numbers, scene and take, the settings (sample rate, bit depth, timecode frame rate), what each track contains, and notes for each take such as ‘good’, ‘wild’, ‘MOS’, ‘noise on line 3’ or ‘plane’. Circling or marking preferred takes can help editors.", "It is the best way to pass information on to post, particularly on problems: if an actor crumpled a script or a plane passed over, the editor needs to know. Reports are cross-checked with the camera report and the script supervisor’s notes. Fill it in as you go rather than from memory at the end, be legible and consistent, and make sure the track list matches what is recorded. Digital reports from recorders or apps are fine if they are complete and backed up."], ["I can say what a sound report is for.", "I can explain what it records and who uses it.", "I can complete a sound report during a shoot, including track labels and notes on problems.", "For a production I can design a report format, predict what each user needs, test it by having someone find a take using only the report, and justify what I include."], [["Name five things recorded on a sound report.", "For example date, scene and take, file number, track list, sample rate, timecode frame rate, notes on good, wild or problem takes."], ["Why note a problem such as a plane flyover on the report?", "So editors know why the take is unusable or needs care, and can plan ADR or choose another take."]], "VOR", "Complete a sound report for a short shoot with several takes and some noise problems. Swap it with a partner who has to find a specific take using only the report. Predict what will be unclear first.", []], ["Metadata", "Metadata is the information stored inside and alongside a recording, such as timecode, scene, take and track names.", "You can enter and check metadata so files can be found, sorted and synced automatically.", ["Besides the audio, a BWF file stores metadata: the start <b>timecode</b>, sample rate, bit depth, and, in iXML or similar fields, the project name, scene, take, tape or roll, track names, notes and flags for circled takes. Editing and sync software reads this to sort files and to sync them with picture automatically.", "Metadata is only useful if it is right. Enter scene and take before or as you record, label each track clearly (for example, ‘Boom’, ‘Lav A’), and check that the timecode and frame rate are correct. Mistakes are hard to find later and can cost hours. Check with the editor which fields they need, and use software to view the metadata before handing the files over."], ["I can say that files carry information beyond the audio.", "I can explain what metadata fields are stored and what they are used for.", "I can enter metadata correctly during a shoot and check it in software.", "For a production I can agree metadata needs with post, predict what errors are likely, test the workflow, and justify the checks I’d make."], [["Why is metadata important for sync and sorting?", "Software reads timecode, scene and take from it to sort and sync files automatically."], ["How would you check metadata is correct before handover?", "Open the files in a metadata viewer or editing software and compare the fields with the sound report and slate."]], "VOR", "Record several takes with different scene and take values, then open the files in a metadata viewer or editing software. Predict what fields will appear, then check and find any that were wrong.", []], ["Monitoring on set", "Monitoring means listening to what is being recorded, on good headphones, throughout the take.", "You can monitor critically, hear problems as they happen, and act on them.", ["Meters show level, but only listening shows quality. The sound mixer and boom operator monitor on <b>closed-back headphones</b>, which keep out the sound of the set so that what they hear is what is recorded. They listen for noise (hum, planes, fridge), distortion, clothing rustle, wireless dropouts, and whether the dialogue is clear and the boom is on mic. Monitoring is for judging the signal itself, so keep the volume safe and consistent.", "Others may listen on a feed: the director and script supervisor often get a mix to follow performance. Remember that a feed on speakers or lightweight headphones doesn’t sound like what you hear. Develop a habit of listening to the whole take, including the start and end, and note problems straight away. After a take, play back anything suspicious while the set is still in place. Protect your hearing: loud monitoring for hours causes damage."], ["I can say why sound people monitor on headphones.", "I can explain what to listen for and why closed-back headphones are used.", "I can monitor a take, spot problems such as noise or rustle, and report them to the right person.", "For a shoot I can plan a monitoring setup for the sound team and others, predict what each user will and won’t hear, test it, and justify it, including how I protect my hearing."], [["Why can’t you rely on meters alone?", "Meters show level but not noise, rustle, distortion upstream, or tone, which you only hear by listening."], ["Why use closed-back headphones on set?", "They keep out the set’s sound, so you hear the recording rather than the room."]], "VOU", "Record a take with a deliberate fault (a rustling jacket or a hum) and monitor it first on closed-back headphones and then on laptop speakers. Predict what you will notice on each, then compare.", []], ["Timecode", "Timecode labels every frame with a time, so separate recordings can be lined up.", "You can set, read and check timecode, and match its frame rate to the camera.", ["<b>SMPTE timecode</b> is a clock in the form hours:minutes:seconds:frames. A recorder and a camera that both record the same timecode can be synced in post automatically. Timecode runs at a stated frame rate (24, 25, 30 and fractional versions such as 23.976 and 29.97), and in the UK 25 fps is the usual standard. It can be set to <b>time of day</b> (the clock time) or to start at a chosen value, and can run continuously (free run) or only while recording (record run).", "The key points are that both devices must use the same frame rate and be in step. Check the frame rate setting first on every device. Write down what you use in the sound report. Also know that fractional rates and drop-frame timecode exist and cause trouble if mixed up. Timecode makes sync fast, but it doesn’t replace a slate, because things can fail and slates are the backup."], ["I can say what timecode is and how it is written.", "I can explain frame rates, free run and record run, and why devices must match.", "I can set timecode on a recorder and camera, and check that it matches.", "For a production I can plan the timecode system, predict where it might fail, test it, and justify the settings with the picture team."], [["What does timecode let post do?", "Line up separate picture and sound recordings automatically, using matching time labels."], ["Why is it still important to use a slate when you have timecode?", "Timecode can drift or fail, and the slate gives a visual and audible backup that can always be used."]], "VOU", "Record a short clip on a recorder and a camera with matching timecode, then bring both into editing software and sync them automatically. Predict the result, then check how close the sync is, frame by frame.", [["read", "foundational", "Timecode device manufacturers’ guides (Tentacle Sync, Ambient)", "Search: “what is timecode film sound explained”"]]], ["Jam sync", "Jam syncing copies the correct timecode into a device, which then keeps running it by itself. It slowly drifts, so it needs re-jamming.", "You can jam sync devices, check for drift and re-jam at the right times.", ["Jam sync means feeding a master timecode source to another device, which then locks to it and keeps counting independently. This is how a camera or recorder with no cable connection can still match the sound recorder. Devices such as timecode boxes (e.g. Tentacle or Ambient) make it quick. Each device’s clock is slightly different, so over hours they <b>drift</b> apart.", "To prevent drift, re-jam at regular intervals (typically at the start of the day, after lunch, and after any battery change or power-off). Check sync with a timecode slate or by comparing the displays at intervals. Drift is rarely dramatic in short school shoots but can build up over a day, and the cost of an error is a long, tedious sync job. Note jam times in the sound report, and keep the timecode devices powered."], ["I can say what jam sync is.", "I can explain drift and why re-jamming is needed.", "I can jam devices, check them against one another, and re-jam at suitable times.", "For a production day I can plan jam times and checks, predict where drift would show up, test it, and justify the schedule."], [["Why do devices drift apart after being jammed?", "Each has a slightly different internal clock, so the difference builds up."], ["When would you re-jam?", "At the start of the day, after lunch, after a power-off or battery change, and whenever a check shows they have drifted."]], "VOU", "Jam a recorder and a camera, record side by side at the start of the day and again several hours later. Predict how much drift will show, then compare the timecodes.", []], ["Slating", "From the sound side, slating means making sure the recording starts with a clear spoken and clapped mark that matches picture.", "You can run a clean roll and slate sequence and use the slate to check sync.", ["The slate announces scene, shot and take, and the clap gives a sharp sound and a visible frame to line up. For the sound mixer, the sequence matters: sound is rolled first and says it is up to speed, then the camera, then the slate is announced and clapped, and then the director calls action. The slate must be audible and clearly spoken, as it identifies the take in the recording and the report. A timecode slate displays the timecode so the match can be checked.", "Know the variations. A <b>tail slate</b> is made at the end of a take when it can’t be done at the start. <b>MOS</b> (shot without sound) takes should be labelled so nobody looks for sound that isn’t there, and wild tracks are announced. Slates can fail: no clap, mumbled numbers or hands over the clapper. Agree the routine with the camera assistant and script supervisor before shooting, and tell them quickly when you can’t hear the slate."], ["I can say what a slate does and who calls the sequence.", "I can explain the roll sequence from sound and what tail slates and MOS mean.", "I can run the sequence on set, check the slate is audible and number-matched, and flag problems.", "For a production I can agree a slating routine with camera and script, predict failure points, test it, and justify the routine."], [["In what order do sound and camera roll before the slate?", "Sound rolls and confirms speed first, then camera, and then the slate is called and clapped."], ["What should you do if you can’t hear the slate clearly?", "Tell the camera assistant or AD straight away and ask for it to be repeated, because it’s the take’s identity in the recording."]], "VOU", "Run a mock slate sequence with sound and camera, including a head slate, a tail slate and an MOS take. Predict where mistakes are likely, then check the recordings for audibility and sync.", []], ["Dual system recording", "Dual system means picture and sound are recorded on separate devices and synced afterwards.", "You can plan and run a dual-system workflow and explain its benefits and risks.", ["In dual system recording the camera and the sound recorder are separate. Film has always worked this way, and professional digital shoots still do, because it allows better microphones, more tracks and better preamps than a camera offers, and lets the sound mixer work independently of the camera crew. The camera usually records a <b>guide track</b> (a reference mix) so editors can sync the proper sound to picture by matching waveforms, timecode or the clap.", "The costs are more things to manage: syncing, two sets of media, consistent naming, and the risk that something goes wrong between the two. Plan the system: agree frame rate, timecode source and slating method. Make sure the camera guide track is plugged in and working, as it is the editor’s back-up if everything else fails. Single-system recording straight into the camera may be fine for quick, small jobs but limits quality."], ["I can say what dual system recording is.", "I can explain why it is used and what extra work it creates.", "I can set up a dual-system workflow with timecode, a guide track and slating, and check sync in practice.", "For a production I can choose between single and dual system, predict the risks, test the workflow, and justify the plan."], [["Why do professional shoots usually use dual system sound?", "Better microphones, preamps and track control than cameras provide, and independence from the camera crew."], ["What is the guide track on camera for?", "It lets editors sync the recorder’s files by matching waveforms, and acts as a backup if other sync methods fail."]], "VOU", "Record the same scene with a camera mic only and with a separate recorder and boom. Sync the recorder to the camera in editing software, then compare quality. Predict the main differences first.", []], ["Frame rate compatibility", "The timecode and picture frame rates must match, or sync will drift or fail.", "You can spot and avoid frame rate mismatches between camera, recorder and post.", ["Timecode runs at a frame rate, and so does the camera. If a recorder is set to 25 fps timecode and the camera records at 24 fps, the two clocks count frames at different speeds and will not match over time. Common rates include 23.976 and 24 (film and some drama), 25 (UK and European television), and 29.97 and 30 (North American). Rates like 23.976 and 29.97 are ‘fractional’ rates, and 29.97 can also be drop-frame, which is a way of keeping timecode in step with the clock.", "On set, check that the camera, recorder and timecode devices all agree before shooting, and record the rate in the sound report. In the UK, 25 fps is the normal choice, but an international or cinema project may be different. Slow-motion (high-frame-rate) shots are generally recorded without sync sound. If a mismatch happens it can usually be fixed in post, but with extra work and some risk, so check before you roll."], ["I can say that the camera and sound must use the same frame rate.", "I can explain common frame rates and why fractional rates cause problems.", "I can check and set matching rates on all devices and record them on the report.", "For a production I can agree the frame rate with picture and post, predict what a mismatch would cause, test the workflow, and justify the choice."], [["Why does a 25 fps recorder and a 24 fps camera cause a problem?", "They count frames at different speeds, so their timecodes don’t match and sync drifts."], ["What should you do before the first take of the day?", "Check the frame rate setting on every device, and write it on the sound report."]], "VOU", "Record with a recorder at 25 fps timecode and a camera at 24 fps (or any mismatch you can set). Predict what will happen when you try to sync them automatically, then try it and describe the result.", []], ["Wind and weather", "Wind and rain cause some of the worst problems for location sound, and the answers are mostly protection and positioning.", "You can protect a recording from wind and weather and know when conditions make a take unusable.", ["Wind blowing across a mic creates low-frequency rumble and bursts of noise that can ruin a take. Protection comes in layers: a <b>foam cover</b> for light breezes, a <b>windshield (basket or ‘blimp’) with a fur cover</b> (often called a ‘dead cat’ or ‘windjammer’) for moderate to strong wind, and a <b>low-cut filter</b> for the rest. Each layer costs a little high-frequency detail, and no cover will rescue a mic in a gale. Rain adds noise by hitting surfaces and the equipment.", "Position makes a big difference: shelter the mic behind the actor’s body, a wall or a vehicle, and use lavs hidden under clothing if the boom can’t cope. Protect electronics from moisture with covers and keep spares dry. Tell the director and AD early when conditions will make sound unusable (it may be better to record wild lines in a sheltered spot, or to plan ADR). Remember hearing too: wind can mask problems you only notice later."], ["I can say wind noise comes from air blowing across the mic.", "I can explain the layers of wind protection and their trade-offs.", "I can pick a cover for conditions, position the mic for shelter, and keep kit dry.", "For an outdoor scene I can predict wind and weather risks, plan protection and fallback options, test them, and justify the decisions including when to stop."], [["Why not always use the biggest windshield?", "Heavier covers lose some high-frequency detail and are bulkier, so you use the lightest that works."], ["What can you do if conditions are too windy for the boom?", "Use lavs under clothing, shelter the mic, record wild lines in a calmer spot, or plan ADR."]], "VUP", "Record speech outdoors on a breezy day with a bare mic, a foam cover and a fur cover. Predict which will cope, then compare and note any loss of tone.", []], ["Room tone", "Room tone is the sound of a location when nobody is speaking, recorded so editors can fill gaps and match the atmosphere.", "You can record useful room tone for every location and setup, and explain what post does with it.", ["Every space has its own background sound: air conditioning, distant traffic, electrical hum, the acoustic character of the room. When editors cut dialogue, they leave gaps, and silence would sound wrong. <b>Room tone</b> is a recording, typically 30 to 60 seconds of the room with everyone quiet and still, made on the same mic setup so it matches. It is also called atmosphere or presence, and it’s requested by the sound mixer (‘quiet please, recording room tone’).", "Record it for each location, and again if something significant changes (a window opened, lights or equipment turned on or off). Note that the term has a different meaning in lighting: one of the principles in The Framework is also called Room Tone, so be aware that students from other departments may mean something else. Without good room tone, editors have to patch gaps with generic noise, which sounds obviously false."], ["I can say what room tone is and why it’s recorded.", "I can explain how editors use it and why it must be recorded with everyone silent.", "I can record room tone for a location at the right moment and label it in the report.", "For a production I can plan when to capture room tone for every setup, predict where it may differ, test it, and justify what I record."], [["How long should room tone be, and who must be quiet?", "Around 30 to 60 seconds, with everyone on set silent and still."], ["Why record room tone again if a window is opened?", "The background sound has changed, so the old tone won’t match takes recorded after the change."]], "VUP", "Record 30 seconds of room tone in a space, then cut a gap into a dialogue recording and fill it first with silence, then with your room tone. Predict how each will sound, then compare.", []], ["Noise sources", "Unwanted noise decides whether a location is usable, so sound people hunt for it early and manage it.", "You can identify, rank and deal with noise sources at a location.", ["Common noise sources are air conditioning and ventilation, refrigerators, fluorescent and some LED lights (hum or buzz), traffic and aircraft, neighbours, generators, clothing and footsteps, and the film crew themselves. Some are steady (like a fan), which can be reduced by distance or filtering, while others are intermittent (a plane or a door), which may need to be waited out.", "Find them on the recce by listening at the time of day you’ll shoot. Then manage them in order: remove or turn off the source (and make sure appliances are switched back on afterwards), move the shot, choose a different time, add absorption, use closer mic placement, or accept the noise and plan wild lines or ADR. Communicate in good time with production, as location, schedule and lighting choices often matter more than microphones. Never expect post to fix everything."], ["I can name common location noise sources.", "I can explain the difference between steady and intermittent noise and which are easiest to fix.", "I can find noise sources by listening and deal with them by removal, positioning or scheduling.", "For a location I can survey noise at the shooting time, predict its effect on takes, plan fixes and fall-backs, test them, and justify the decisions."], [["Why check for noise at the time of day you’ll shoot?", "Noise changes through the day (traffic, building use, aircraft), so a quiet visit might not reflect the real shoot."], ["You turn off a fridge to reduce noise. What must you do afterwards?", "Switch it back on, or mark it clearly and tell the owner or location manager, so food and equipment aren’t damaged."]], "VUP", "Visit a location at your planned shoot time with headphones and a recorder. List every noise source, rank them, and propose a fix for each. Predict which two will cause most trouble, then record a test to check.", []], ["Wild tracks", "A wild track is audio recorded without the camera rolling, for example a line, an effect or atmosphere, to fix or add to the take.", "You can plan and record wild tracks that save problems in post.", ["‘Wild’ means recorded without picture. Types include <b>wild lines</b> (dialogue repeated cleanly because the take had noise or the mic was not close enough), <b>atmospheres</b> (the background sound of a location), and <b>effects</b> (specific sounds such as a door, footsteps or a prop). They are announced on the recorder (‘wild track’) and written in the sound report so editors know what they are.", "Wild lines can rescue a scene that would otherwise need ADR: ask the actors to deliver the lines again close to the mic, in the same performance, after the take. Be tactful about the time they take, and ask the AD at a sensible moment. Atmospheres and effects from the real location are often better than library sound, and they are cheap to capture while the crew is already there. They are the opposite of MOS, which is picture without sound."], ["I can say what a wild track is.", "I can explain wild lines, atmospheres and effects, and how to record and label them.", "I can record a wild line and an atmosphere, and note them in the report.", "For a production I can plan which wild tracks I’ll need, predict where I’ll need them, and justify the time they take against the cost of ADR."], [["What is a wild line?", "A line of dialogue re-recorded without the camera rolling, usually to replace a take spoiled by noise or distance."], ["How should a wild track be identified?", "Announce it on the recording and write it on the sound report."]], "VUP", "Record a scene with a deliberate noise problem, then immediately record a wild line of the same dialogue close to the mic. Cut the wild line into the scene and judge how well it works. Predict first.", []], ["Impact of the speed of sound on recording decisions", "Sound travels slowly compared with light, so mic distance affects timing, phase and how recordings combine.", "You can account for the delay of sound over distance when you choose and place mics.", ["Sound travels at about 343 metres per second in air at room temperature, roughly 3 milliseconds per metre. Light is effectively instant, so a mic far from the source hears it later than one close to it, and a distant camera sees an action before it can be heard. At 25 frames per second one frame lasts 40 ms, which is about 14 metres of travel, so a mic several metres away is noticeably late relative to the picture only at large distances.", "The real impacts are on combining mics. Recording the same voice with a boom and a lav puts them slightly out of time, and mixing them can cause <b>comb filtering</b>, where frequencies cancel and give a hollow sound. This is why editors choose between sources or align them in time. It also affects wide shots, where a distant camera and a mic at the camera will hear the action late and may need to be moved in post. Place mics close, and don’t mix two spaced mics blindly."], ["I can say that sound travels slowly and about how fast.", "I can explain why two mics at different distances record at different times.", "I can estimate the delay for a given distance and explain how it could cause phase problems.", "For a scene I can predict delay and comb filtering from my mic positions, test them, and justify the placement or time alignment I choose."], [["Roughly how long does sound take to travel one metre?", "About 3 ms."], ["Why can mixing a boom and a lav of the same voice sound hollow?", "They arrive at slightly different times, and combining them cancels some frequencies (comb filtering)."]], "VO", "Record one voice with two mics at different distances, then zoom in on the waveforms in editing software and measure the delay. Predict the delay from the distance, then check. Try mixing both and listen for the hollow quality.", []], ["Problem-solving under pressure", "Sound problems happen in front of a waiting crew. Calm, clear, fast decisions are as important as technical knowledge.", "You can diagnose problems quickly, communicate clearly and make good priorities when time is short.", ["On a set, time costs money and goodwill, and the sound department is often the one asking people to wait. Good practice means being prepared (spares, tools, labelled kit, tested chains), knowing the priorities (dialogue first), and having a method for finding faults quickly (follow the signal chain, change one thing at a time). Communicate in short, neutral, useful sentences: what the problem is, how long it will take, and what the options are.", "Options are to fix it now, record wild lines later, move or reschedule, or accept and plan ADR. The decision isn’t only the sound mixer’s, so give the director and AD the information to choose. Stay polite and avoid blaming people for noise. Make notes of unresolved problems on the sound report so that post knows. Afterwards, think about what could have been prevented by preparation, and update your checklist."], ["I can say that dialogue is usually the first priority.", "I can explain a systematic way of finding faults and how to communicate about them.", "I can handle a simulated fault calmly, communicating the problem and options clearly.", "For a shoot I can anticipate likely problems, prepare spares and a plan, test my response to simulated faults, and justify the choices I make under time pressure."], [["What should you say when you stop a take for a sound problem?", "What the problem is, how long it should take to fix or wait out, and what the options are."], ["Why note unresolved problems on the sound report?", "So editors and post know what is wrong with the take and can plan ADR or choose another take."]], "VUN", "Ask a partner to secretly introduce a fault into your signal chain or location (unplugged cable, noise, dead battery). Predict how long you’ll take to find it, then time yourself and reflect on your communication.", [["read", "foundational", "Judge, Runner", "Look for the sections on set communication and professional behaviour"]]], ["Frequencies and licensing", "Radio microphones use radio frequencies that are shared and regulated, so you need to know what’s legal and which ones are free where you are.", "You can plan wireless frequencies and know the licensing rules for the UK, checking them before every use.", ["Wireless mics broadcast on UHF radio frequencies. These are shared with other users (television, other productions, events), and the use of the spectrum is regulated. In the UK, <b>Ofcom</b> manages licences for professional wireless microphones, and in some narrow bands a licence isn’t required, but those bands are limited and crowded. Available frequencies also vary by place and change over time as spectrum is reallocated, so don’t assume last year’s settings are still legal.", "In practice you need to know your equipment’s frequency range, check the current rules for your location, use a licence where one is needed, and plan a channel list so that transmitters on the same set don’t clash. In some places, a frequency scan shows what is in use. Working with an institution, the technician or kit store should know which licences cover your kit. This is a detail that changes, so verify it with Ofcom and your institution, and never rely on this summary alone."], ["I can say that wireless mics use regulated radio frequencies.", "I can explain why frequencies are shared and why a licence or licence-exempt band may apply.", "I can find the current rules for my location, set my kit to legal frequencies and scan for free ones.", "For a production I can plan frequencies and licences for the whole kit, predict clashes, test the plan, and justify the choices, including how I would check them for a new location."], [["Who regulates professional wireless mic frequencies in the UK?", "Ofcom."], ["Why shouldn’t you reuse last year’s frequency settings without checking?", "The available and legal frequencies change over time and by location, so old settings may now be illegal or clash with others."]], "UP", "Find your kit’s frequency range and the current Ofcom guidance on the bands it can use. Write a one-page channel plan for four radio mics, and have your technician check it. Predict what is likely to change first.", [["read", "foundational", "Ofcom guidance on wireless microphones (PMSE)", "Search: “Ofcom wireless microphones licence”"], ["read", "deeper", "Wireless microphone manufacturers’ frequency guides (Shure, Sennheiser)", "Search: “wireless microphone frequency coordination guide”"]]], ["Interference", "Wireless microphones can be disturbed by other transmitters and electronics, giving dropouts, hiss or buzzing.", "You can recognise interference, find its source and fix it.", ["Interference is anything that disrupts the radio link. Sources include other wireless mics on nearby frequencies, TV transmitters, wireless video links, mobile phones, Wi-Fi and Bluetooth devices, LED lights and dimmers, and computers. Transmitters on the same set can also interact with each other (<b>intermodulation</b>) and create spurious signals if the frequencies are poorly chosen. Symptoms are dropouts, bursts of noise, hiss, or a buzz that comes and goes.", "To deal with it: scan for a clear frequency, plan a compatible channel list, keep antennas in line of sight, increase the distance from other equipment, switch off devices that aren’t needed, and swap or move equipment. Test with everything running together at the recce, including lights and camera accessories, and tell other departments what to avoid. Record a test and listen before the shoot, because interference is easier to prevent than fix."], ["I can say what interference sounds like.", "I can name common sources, including intermodulation between transmitters.", "I can scan for clear frequencies, test with all equipment running, and track down a source by switching things off.", "For a shoot I can predict likely interference, plan frequencies and layout, test with all departments’ gear, and justify the fixes."], [["Name three things on a film set that can cause radio interference.", "For example other wireless mics, wireless video links, mobile phones, Wi-Fi, LED lights and dimmers."], ["What is the best way to find an interference source?", "Switch equipment off one item at a time while monitoring, after scanning for clear frequencies."]], "VUP", "With a radio mic running, switch on nearby equipment one item at a time (phone, Wi-Fi, LED panel at several dim levels). Predict which will cause trouble, then listen and record what you hear.", []], ["Antenna placement", "The position of antennas, on both the transmitter and the receiver, decides how reliable a wireless mic is.", "You can place antennas to keep a strong, clear link.", ["Radio signals weaken with distance and are absorbed or blocked by bodies, walls, metal and water. Good practice: keep a clear line of sight between the transmitter and the receiver, place the receiver antennas high and in the open rather than in a bag or behind a metal cart, keep them away from each other and from other electronics, and use antennas designed for the frequency. A person’s body absorbs signals, so the position of the transmitter on the body matters.", "For larger spaces, <b>remote antennas</b> on cables can be placed close to the action, and a <b>diversity</b> receiver with two antennas picks the stronger signal. Test by walking the whole action area while monitoring, listening for dropouts. Re-test when the set or the people change position. Don’t coil antenna cables, and check connectors regularly. Poor antenna positioning is a very common reason for dropouts."], ["I can say that antennas should have a clear line of sight.", "I can explain what blocks signals and what diversity and remote antennas do.", "I can place receiver antennas and test a walk through the action area for dropouts.", "For a location I can plan antenna positions, predict weak spots, test them, and justify the layout including how I’ll respond to changes."], [["Why shouldn’t you keep the receiver antennas inside a bag?", "Bags, bodies and metal block or weaken signals, so antennas should be in the open with a clear line of sight."], ["What does a diversity receiver do?", "It uses two antennas and chooses the stronger signal to reduce dropouts."]], "VUP", "Walk around a set with a radio mic while a partner monitors. Try the receiver antenna in different places (in a bag, on a stand at head height, close to a wall) and note where dropouts happen. Predict first.", []], ["Radio mic management", "Running radio mics is a day-long job: batteries, channels, levels, checks and communication with the cast.", "You can run a radio mic system smoothly through a day, and fix problems calmly.", ["Radio mics need ongoing care. Use fresh batteries at regular intervals (and record when they were changed), label every transmitter and receiver, keep a <b>channel plan</b> listing which frequency belongs to which actor, set transmitter gain and check the level of each, and test each mic at every new setup. Keep transmitters muted or off when not being recorded, partly for battery life and partly for the actors’ privacy.", "Clothing and movement cause problems, so work with the costume department, and agree how to speak to actors about wearing mics and who will fit them. Monitor every channel continuously and tell the actor or AD quickly of problems like rustle. Keep spare batteries, tape and mics ready. Good organisation prevents most problems: a written channel plan and a consistent routine at each setup."], ["I can say what a channel plan is.", "I can explain battery, labelling, gain and muting routines for radio mics.", "I can run a radio mic system through a setup, check each channel and fix a simple fault.", "For a shoot day I can plan the system and routines, predict where problems will occur, test them, and justify the plan including spares."], [["Why keep a written channel plan?", "So everyone knows which transmitter and frequency belongs to each actor, preventing mix-ups and clashes."], ["Why mute transmitters when not recording?", "It saves battery and protects actors’ privacy, because private conversation shouldn’t be
