<!DOCTYPE html>
<html lang="en"><head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

/* "Save to Documentation" buttons stay hidden until the hub switches them on (window.fthDocs.attach) */
[data-fth-doc][hidden]{display:none!important}

:root{--fth-cat:#4fc7b5;--fth-accent:#4fc7b5;--fth-accent-ink:#4fc7b5;--fth-accent-soft:rgba(79,199,181,0.14);--fth-accent-line:rgba(79,199,181,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#2e7369;--fth-accent-ink:#2e7369;--fth-accent-soft:rgba(79,199,181,0.16);--fth-accent-line:rgba(79,199,181,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>
<!--/fth-standalone-->
<meta charset="utf-8"><title>Casting Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:14px/1.45 var(--fth-display)}
button{font:inherit;color:inherit}
a{color:var(--fth-accent-ink)}
[hidden]{display:none!important}

/* ---------- stage palette ---------- */
:root{
  --st-submitted:#8f96a3; --st-reviewed:#97a3ff; --st-selftape:#e889c8; --st-callback:#f5b14c;
  --st-producer:#ff8a5c; --st-offered:#4fc7b5; --st-booked:#5cc98a; --st-passed:#666c77;
}
:root[data-theme="light"]{
  --st-submitted:#7b8290; --st-reviewed:#5d6be0; --st-selftape:#c2479a; --st-callback:#c27d0e;
  --st-producer:#d4582a; --st-offered:#1f9a87; --st-booked:#22804a; --st-passed:#9aa0aa;
}

/* ---------- header extras ---------- */
.status{font:500 11px var(--fth-mono);letter-spacing:.04em;color:var(--fth-faint);white-space:nowrap}
.modes{display:flex;gap:2px;padding:3px;border:1px solid var(--fth-line2);border-radius:11px;background:var(--fth-bg2)}
.modes button{height:30px;padding:0 13px;border:0;border-radius:8px;background:transparent;color:var(--fth-muted);font:600 13px/1 var(--fth-display);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.modes button:hover{color:var(--fth-text);background:var(--fth-surface2)}
.modes button.on{background:var(--fth-accent);color:var(--fth-on-accent)}
.modes svg{width:15px;height:15px}
.menuwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:250px;background:var(--fth-surface);border:1px solid var(--fth-line2);border-radius:12px;box-shadow:var(--fth-shadow);padding:6px}
.pop button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.pop button:hover{background:var(--fth-surface2)}
.pop button small{display:block;color:var(--fth-muted);font-size:11.5px;margin-top:1px}
.pop hr{border:0;border-top:1px solid var(--fth-line);margin:5px 4px}
.pop .danger{color:var(--fth-bad)}
.pop svg{width:16px;height:16px;flex:none;color:var(--fth-muted)}

/* ---------- layout ---------- */
.page{max-width:1320px;margin:0 auto;padding:18px 22px 80px}
.crumbs{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font:500 11px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--fth-muted);font:inherit;letter-spacing:inherit;text-transform:inherit}
.crumbs button:hover{color:var(--fth-accent-ink)}
.crumbs .sl{color:var(--fth-faint)}
.intro{color:var(--fth-muted);font-size:13.5px;max-width:70ch;margin:0 0 6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.lbl{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);display:block;margin-bottom:5px}
.lbl em{font-style:normal;color:var(--fth-faint);text-transform:none;letter-spacing:0;font-family:var(--fth-display);font-size:11.5px}
.f{min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
.pair{display:flex;align-items:center;gap:6px}
.pair .fth-input{flex:1}
.pair .to{color:var(--fth-faint);font-size:12px}
textarea.fth-input{min-height:68px}
.fth-input.sm{padding:5px 8px;font-size:13px}
.empty{border:1.5px dashed var(--fth-line2);border-radius:var(--fth-radius);padding:34px 24px;text-align:center;color:var(--fth-muted)}
.empty h3{margin:0 0 6px;color:var(--fth-text);font:800 20px/1.1 var(--fth-display);font-variation-settings:"wdth" 72;text-transform:uppercase}
.empty p{margin:0 auto 14px;max-width:56ch}
.empty .row{justify-content:center}
.hint{font-size:12px;color:var(--fth-faint);margin-top:4px}
.ico{width:16px;height:16px;flex:none}
.fth-btn svg{width:15px;height:15px;flex:none}

/* ---------- production strip ---------- */
.prod{padding:14px 16px;margin-bottom:16px}
.prod-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;user-select:none}
.prod-top h2{margin:0;font:800 26px/1 var(--fth-display);font-variation-settings:"wdth" 66;text-transform:uppercase;letter-spacing:.01em}
.prod-top h2.ph{color:var(--fth-faint)}
.prod-meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--fth-muted);font-size:12.5px}
.prod-meta b{color:var(--fth-text);font-weight:600}
.chev{width:18px;height:18px;color:var(--fth-muted);transition:transform .2s}
.open>.prod-top .chev,.open>.bd-top .chev{transform:rotate(180deg)}
.prod-body{margin-top:14px;padding-top:14px;border-top:1px solid var(--fth-line)}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{padding:12px 14px;border:1px solid var(--fth-line);border-radius:12px;background:var(--fth-bg2)}
.stat b{display:block;font:800 26px/1 var(--fth-display);font-variation-settings:"wdth" 70;margin-top:6px}
.stat small{color:var(--fth-muted);font-size:12px}
.stat .lbl{margin:0}

/* ---------- role cards ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.toolbar h3{margin:0;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.toolbar .count{font:500 11px var(--fth-mono);color:var(--fth-faint)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.rcard{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s}
.rcard:hover{border-color:var(--fth-line3);transform:translateY(-2px)}
.rcard .band{height:4px;background:var(--rc)}
.rcard .in{padding:14px 15px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.rcard .top{display:flex;align-items:flex-start;gap:10px}
.rcard h4{margin:0;font:800 22px/1 var(--fth-display);font-variation-settings:"wdth" 66;text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.rcard h4.ph{color:var(--fth-faint)}
.rcard .type{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);margin-top:4px}
.rcard .spec{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--fth-surface2);border:1px solid var(--fth-line);font-size:12px;color:var(--fth-text);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.m{color:var(--fth-muted)}
.chip svg{width:12px;height:12px}
.rcard .desc{color:var(--fth-muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.rcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--fth-line)}
.faces{display:flex}
.faces .hs{width:28px;height:28px;border-radius:50%;border:2px solid var(--fth-surface);margin-left:-8px;font-size:10px}
.faces .hs:first-child{margin-left:0}
.rcard .foot small{color:var(--fth-muted);font-size:12px}
.pipe{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--fth-surface3);gap:1px}
.pipe i{display:block;height:100%}
.src{position:absolute;top:12px;right:12px;font:500 9.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-faint);border:1px solid var(--fth-line2);border-radius:5px;padding:2px 5px}
.addcard{border:1.5px dashed var(--fth-line2);border-radius:var(--fth-radius);background:transparent;min-height:190px;color:var(--fth-muted);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:18px}
.addcard:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}
.addcard svg{width:22px;height:22px}

/* role status pill */
.rs{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:600 11px/1 var(--fth-display);white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--fth-text);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.rs::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- headshots ---------- */
.hs{position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--rc,#888) 38%,var(--fth-surface3)),var(--fth-surface2));color:var(--fth-text);font:800 18px/1 var(--fth-display);font-variation-settings:"wdth" 75;letter-spacing:.02em;flex:none}
.hs img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- role page ---------- */
.rhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.rhead>.row{margin-top:10px}
.rhead .dot{width:14px;height:14px;border-radius:50%;background:var(--rc);box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 22%,transparent);margin-top:15px;flex:none}
.rname{flex:1;min-width:240px}
.rname input{width:100%;border:0;background:transparent;color:var(--fth-text);font:800 44px/1 var(--fth-display);font-variation-settings:"wdth" 62;text-transform:uppercase;letter-spacing:.005em;padding:0;outline:none}
.rname input::placeholder{color:var(--fth-faint)}
.rname .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bd{margin-bottom:22px}
.bd-top{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
.bd-top h3{margin:0;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.bd-top .sum{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.bd-body{padding:4px 16px 18px;border-top:1px solid var(--fth-line)}
.grp{margin-top:16px}
.grp-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:600 11px var(--fth-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fth-accent-ink)}
.grp-h::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;padding-top:3px}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.swatches button.on{border-color:var(--fth-text);box-shadow:0 0 0 2px var(--fth-bg)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--fth-line2);border-radius:9px;background:var(--fth-bg2);flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--fth-muted);font:600 12.5px/1 var(--fth-display);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fth-text)}
.seg button.on{background:var(--fth-surface3);color:var(--fth-text)}
.seg.acc button.on{background:var(--fth-accent);color:var(--fth-on-accent)}
.budgetline{font-size:12.5px;color:var(--fth-muted);margin-top:6px}
.budgetline b{color:var(--fth-text)}

/* stage filter chips */
.stchips{display:flex;gap:6px;flex-wrap:wrap}
.stchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--fth-line2);background:var(--fth-surface);cursor:pointer;font:600 12.5px var(--fth-display);color:var(--fth-muted)}
.stchip:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.stchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stchip b{font:500 11px var(--fth-mono);color:var(--fth-faint)}
.stchip.on{color:var(--fth-text);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--fth-surface))}

/* actor cards */
.actors{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;padding:0;overflow:hidden;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s;position:relative}
.acard:hover{border-color:var(--fth-line3);transform:translateY(-2px)}
.acard .hs{width:100%;aspect-ratio:4/5;font-size:40px}
.acard .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.acard h5{margin:0;font:700 16px/1.15 var(--fth-display);font-variation-settings:"wdth" 85}
.acard .meta{color:var(--fth-muted);font-size:12px;line-height:1.35}
.acard.passed{opacity:.5}
.acard.passed h5{text-decoration:line-through}
.acard .star{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;border:0;cursor:pointer;backdrop-filter:blur(4px)}
.acard .star svg{width:15px;height:15px}
.acard .star.on{background:var(--fth-accent);color:var(--fth-on-accent)}
.acard .warnb{position:absolute;top:8px;left:8px;height:22px;padding:0 7px;border-radius:6px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);color:#ffd28a;font:600 10.5px var(--fth-mono);letter-spacing:.04em;backdrop-filter:blur(4px)}
.acard .warnb svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font:600 11.5px/1 var(--fth-display);white-space:nowrap;background:color-mix(in srgb,var(--c) 17%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);color:var(--fth-text)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.score{font:600 12px var(--fth-mono);color:var(--fth-muted);display:inline-flex;align-items:center;gap:4px}
.score b{color:var(--fth-text)}
.stars{display:inline-flex;gap:1px;color:var(--fth-accent)}
.stars svg{width:13px;height:13px}
.stars .off{color:var(--fth-line3)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--fth-bg2);border:1px solid var(--fth-line);border-radius:12px;display:flex;flex-direction:column;min-height:240px}
.col-h{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--fth-line);font:600 12.5px var(--fth-display)}
.col-h i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col-h b{margin-left:auto;font:500 11px var(--fth-mono);color:var(--fth-faint)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.col.over{border-color:var(--fth-accent);background:var(--fth-accent-soft)}
.bcard{display:flex;gap:9px;align-items:center;padding:7px;border-radius:9px;background:var(--fth-surface);border:1px solid var(--fth-line);cursor:grab;text-align:left}
.bcard:hover{border-color:var(--fth-line3)}
.bcard .hs{width:38px;height:46px;border-radius:6px;font-size:13px}
.bcard b{display:block;font-size:13px;line-height:1.2}
.bcard small{color:var(--fth-muted);font-size:11.5px}
.bcard.dragging{opacity:.4}

/* table */
.tw{overflow-x:auto;border:1px solid var(--fth-line);border-radius:12px;background:var(--fth-bg2)}
table.t{border-collapse:collapse;min-width:100%;font-size:13px}
.t th{font:500 10px/1.2 var(--fth-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fth-muted);text-align:left;white-space:nowrap;padding:10px 8px 8px;border-bottom:1px solid var(--fth-line);background:var(--fth-surface);position:sticky;top:0}
.t td{padding:7px 8px;border-bottom:1px solid var(--fth-line);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--fth-surface)}
.t .hs{width:30px;height:36px;border-radius:5px;font-size:11px}
.t .num{font-family:var(--fth-mono);text-align:center}
.t .hi{color:var(--fth-good);font-weight:600}
.t .lo{color:var(--fth-bad)}

/* ---------- dialog ---------- */
dialog{overflow:auto;border:1px solid var(--fth-line2);border-radius:16px;padding:0;background:var(--fth-bg);color:var(--fth-text);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);max-width:min(1120px,calc(100vw - 28px));width:100%;max-height:calc(100vh - 28px)}
dialog.narrow{max-width:min(640px,calc(100vw - 28px))}
dialog::backdrop{background:rgba(5,6,8,.62);backdrop-filter:blur(3px)}
:root[data-theme="light"] dialog::backdrop{background:rgba(40,32,20,.35)}
.dlg-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--fth-line);background:color-mix(in srgb,var(--fth-bg) 92%,transparent);backdrop-filter:blur(10px)}
.dlg-h h3{margin:0;font:800 20px/1 var(--fth-display);font-variation-settings:"wdth" 70;text-transform:uppercase}
.dlg-b{padding:18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--fth-line);position:sticky;bottom:0;background:var(--fth-bg)}

/* actor detail */
.ad{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.ad-side{display:flex;flex-direction:column;gap:12px}
.ad-shot{position:relative;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--fth-line2)}
.ad-shot .hs{width:100%;height:100%;font-size:64px}
.ad-shot .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font:600 12px var(--fth-display);display:flex;gap:6px;justify-content:center;opacity:0;transition:opacity .15s}
.ad-shot:hover .ov,.ad-shot.drop .ov{opacity:1}
.ad-shot.drop{outline:2px dashed var(--fth-accent);outline-offset:3px}
.ad-name{width:100%;border:0;background:transparent;color:var(--fth-text);font:800 30px/1.05 var(--fth-display);font-variation-settings:"wdth" 66;text-transform:uppercase;outline:none;padding:0}
.ad-name::placeholder{color:var(--fth-faint)}
.stepper{display:flex;flex-direction:column;gap:2px}
.stepper button{display:flex;align-items:center;gap:9px;padding:6px 8px;border:0;background:transparent;border-radius:7px;cursor:pointer;text-align:left;font-size:13px;color:var(--fth-muted)}
.stepper button:hover{background:var(--fth-surface2);color:var(--fth-text)}
.stepper .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--fth-mono);border:1.5px solid var(--fth-line3);color:var(--fth-faint);flex:none}
.stepper .done .n{background:var(--c);border-color:var(--c);color:#111}
.stepper .done{color:var(--fth-text)}
.stepper .cur{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--fth-text);font-weight:600}
.stepper .cur .n{background:var(--c);border-color:var(--c);color:#111;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.stepper .when{margin-left:auto;font:500 10.5px var(--fth-mono);color:var(--fth-faint)}
.ad-main{min-width:0}
.ad-tabs{display:flex;gap:2px;border-bottom:1px solid var(--fth-line);margin-bottom:16px;overflow-x:auto}
.ad-tabs button{border:0;background:none;padding:9px 12px 10px;cursor:pointer;color:var(--fth-muted);font:600 13px var(--fth-display);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ad-tabs button:hover{color:var(--fth-text)}
.ad-tabs button.on{color:var(--fth-text);border-bottom-color:var(--fth-accent)}
.ad-tabs button b{font:500 10px var(--fth-mono);color:var(--fth-faint);margin-left:4px}
.links{display:flex;flex-direction:column;gap:7px}
.lrow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px auto auto;gap:6px;align-items:center}
.lrow.two{grid-template-columns:150px minmax(0,1fr) auto auto}
.ibtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--fth-line2);background:var(--fth-surface);display:grid;place-items:center;cursor:pointer;color:var(--fth-muted);text-decoration:none}
.ibtn:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.ibtn.x:hover{color:var(--fth-bad)}
.ibtn svg{width:15px;height:15px}
.ibtn.dis{opacity:.35;pointer-events:none}

/* ratings */
.rates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px}
.rate{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border:1px solid var(--fth-line);border-radius:10px;background:var(--fth-bg2)}
.rate .rl{min-width:0}
.rate .rl b{display:block;font-size:13px;font-weight:600}
.rate .rl small{display:block;color:var(--fth-faint);font-size:11.5px;line-height:1.3}
.dots{display:flex;gap:4px;flex:none}
.dots button{width:26px;height:26px;border-radius:7px;border:1px solid var(--fth-line2);background:var(--fth-surface);cursor:pointer;font:600 11px var(--fth-mono);color:var(--fth-faint);padding:0}
.dots button:hover{border-color:var(--fth-accent);color:var(--fth-text)}
.dots button.on{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.dots button.lit{background:var(--fth-accent-soft);border-color:var(--fth-accent-line);color:var(--fth-text)}
.overall{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--fth-accent-soft);border:1px solid var(--fth-accent-line);margin-bottom:12px}
.overall b{font:800 34px/1 var(--fth-display);font-variation-settings:"wdth" 70}
.overall small{color:var(--fth-muted);font-size:12.5px}
.verdict{display:inline-flex;gap:4px}
.verdict button{white-space:nowrap;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--fth-line2);background:var(--fth-surface);cursor:pointer;font:600 12.5px var(--fth-display);color:var(--fth-muted)}
.verdict button:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.verdict button.on.y{background:color-mix(in srgb,var(--fth-good) 22%,transparent);border-color:var(--fth-good);color:var(--fth-text)}
.verdict button.on.m{background:color-mix(in srgb,var(--fth-warn) 22%,transparent);border-color:var(--fth-warn);color:var(--fth-text)}
.verdict button.on.n{background:color-mix(in srgb,var(--fth-bad) 20%,transparent);border-color:var(--fth-bad);color:var(--fth-text)}
.verdict button.on.sy{background:var(--fth-good);border-color:var(--fth-good);color:#0b1a10}

/* calendar */
.cal-wrap{display:flex;gap:18px;flex-wrap:wrap}
.cal{width:252px}
.cal h6{margin:0 0 6px;font:600 12px var(--fth-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fth-muted)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .dn{font:500 9.5px var(--fth-mono);color:var(--fth-faint);text-align:center;padding:2px 0}
.cal-g button{aspect-ratio:1;border:1px solid var(--fth-line);border-radius:6px;background:var(--fth-bg2);cursor:pointer;font:500 11px var(--fth-mono);color:var(--fth-muted);padding:0;position:relative}
.cal-g button:hover{border-color:var(--fth-line3);color:var(--fth-text)}
.cal-g button.shoot{border-color:var(--fth-accent-line);color:var(--fth-text);box-shadow:inset 0 -2px 0 var(--fth-accent)}
.cal-g button.a{background:color-mix(in srgb,var(--fth-good) 28%,var(--fth-bg2));color:var(--fth-text);border-color:color-mix(in srgb,var(--fth-good) 55%,transparent)}
.cal-g button.p{background:color-mix(in srgb,var(--fth-warn) 26%,var(--fth-bg2));color:var(--fth-text);border-color:color-mix(in srgb,var(--fth-warn) 55%,transparent)}
.cal-g button.u{background:color-mix(in srgb,var(--fth-bad) 24%,var(--fth-bg2));color:var(--fth-text);border-color:color-mix(in srgb,var(--fth-bad) 50%,transparent);text-decoration:line-through}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fth-muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.availsum{font-size:13px;margin:4px 0 12px}
.availsum b{font-weight:700}

.hist{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fth-muted)}
.hist div{display:flex;gap:8px;align-items:center}
.hist time{font:500 11px var(--fth-mono);color:var(--fth-faint);min-width:96px}
.rounds{display:flex;flex-direction:column;gap:8px}
.rsum{padding:10px 12px;border:1px solid var(--fth-line);border-radius:10px;background:var(--fth-bg2);font-size:13px}
.rsum .row{gap:10px}
.rsum p{margin:6px 0 0;color:var(--fth-muted);white-space:pre-wrap}

/* ---------- auditions ---------- */
.afil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px 12px;border:1px solid var(--fth-line);border-radius:12px;background:var(--fth-bg2)}
.afil .fth-input{width:auto}
.afil .search{min-width:180px}
.alist{display:flex;flex-direction:column;gap:12px}
.au{display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}
.au-side{padding:14px;border-right:1px solid var(--fth-line);display:flex;flex-direction:column;gap:9px;background:var(--fth-bg2)}
.au-side .hs{width:100%;aspect-ratio:4/5;border-radius:10px;font-size:40px}
.au-side h5{margin:0;font:800 19px/1.05 var(--fth-display);font-variation-settings:"wdth" 70;text-transform:uppercase}
.au-side .role{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);display:flex;align-items:center;gap:6px}
.au-side .role i{width:7px;height:7px;border-radius:50%;background:var(--rc)}
.au-main{padding:14px 16px 16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.au-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.au-rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.au-rates .rate{padding:7px 9px}
.au-rates .dots button{width:24px;height:24px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--fth-line2);background:transparent;color:var(--fth-muted);cursor:pointer;font:500 12px var(--fth-display)}
.tag:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.tag.on{background:var(--fth-accent-soft);border-color:var(--fth-accent);color:var(--fth-text)}
.au-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--fth-line)}
.au-avg{font:500 11px var(--fth-mono);color:var(--fth-muted);letter-spacing:.04em}
.au-avg b{font:800 20px var(--fth-display);font-variation-settings:"wdth" 70;color:var(--fth-text);margin-right:3px}
.prev{display:flex;gap:6px;flex-wrap:wrap}
.prof{grid-column:1/-1;border-top:1px solid var(--fth-line);padding:14px 16px;background:var(--fth-bg2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;font-size:13px}
.prof .k{font:500 10px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-faint);margin-bottom:3px}
.prof .v{white-space:pre-wrap;word-break:break-word}
.prof .v a{word-break:break-all}
.focusnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.focusnav .pos{font:500 12px var(--fth-mono);color:var(--fth-muted)}
.au.focus{grid-template-columns:300px minmax(0,1fr)}
.seen button.on.ok{background:color-mix(in srgb,var(--fth-good) 22%,transparent);color:var(--fth-text)}
.seen button.on.ns{background:color-mix(in srgb,var(--fth-bad) 20%,transparent);color:var(--fth-text)}

/* ---------- chemistry ---------- */
.mx-wrap{overflow-x:auto;border:1px solid var(--fth-line);border-radius:12px;background:var(--fth-bg2);margin-bottom:22px}
table.mx{border-collapse:separate;border-spacing:0}
.mx th,.mx td{padding:8px;border-bottom:1px solid var(--fth-line);border-right:1px solid var(--fth-line)}
.mx tr:last-child td{border-bottom:0}
.mx th:last-child,.mx td:last-child{border-right:0}
.mx thead th{background:var(--fth-surface);vertical-align:bottom;min-width:118px}
.mx .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;text-align:left}
.mx .who .hs{width:30px;height:36px;border-radius:5px;font-size:11px}
.mx thead .who{flex-direction:column;align-items:center;text-align:center;gap:5px}
.mx thead .who .hs{width:44px;height:54px;border-radius:7px;font-size:14px}
.mx .corner{font:500 10px var(--fth-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fth-faint);text-align:left;line-height:1.5}
.mx .corner b{color:var(--fth-text);font-weight:600}
.cell{width:100%;min-width:100px;height:54px;border-radius:9px;border:1px dashed var(--fth-line2);background:transparent;cursor:pointer;color:var(--fth-faint);font:600 13px var(--fth-display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cell:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}
.cell.has{border-style:solid;color:var(--fth-text);background:color-mix(in srgb,var(--c) calc(var(--k) * 32%),var(--fth-surface));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.cell.has b{font:800 20px/1 var(--fth-display);font-variation-settings:"wdth" 70}
.cell.has small{font:500 10px var(--fth-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--fth-muted)}
.cell.sel{outline:2px solid var(--fth-accent);outline-offset:2px}
.pairs{display:flex;flex-direction:column;gap:12px}
.pc{overflow:hidden}
.pc-h{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--fth-line);background:var(--fth-bg2);flex-wrap:wrap}
.duo{display:flex;align-items:center;gap:10px}
.duo .hs{width:46px;height:56px;border-radius:7px;font-size:15px}
.duo .x{font:300 22px var(--fth-display);color:var(--fth-faint)}
.duo b{display:block;font:700 15px/1.1 var(--fth-display)}
.duo small{font:500 10px var(--fth-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fth-muted)}
.pc-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.pc.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--fth-accent)}100%{box-shadow:0 0 0 0 transparent}}

/* import list */
.imp{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.imp label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--fth-line);border-radius:10px;background:var(--fth-bg2);cursor:pointer}
.imp label:hover{border-color:var(--fth-line3)}
.imp label b{font-size:14px}
.imp label small{display:block;color:var(--fth-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.srcnote{font-size:12.5px;color:var(--fth-muted);margin:0 0 12px;display:flex;flex-direction:column;gap:4px}
.srcnote span{display:flex;gap:6px;align-items:center}
.srcnote .ok{color:var(--fth-good)}.srcnote .no{color:var(--fth-faint)}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:10.5pt/1.4 Arial,Helvetica,sans-serif}
  .pp{page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp h1{font:800 20pt/1.1 Arial,Helvetica,sans-serif;margin:0 0 2mm;text-transform:uppercase;letter-spacing:.02em}
  .pp h2{font:700 9pt Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#555;margin:0 0 5mm}
  .pp .ph{display:flex;justify-content:space-between;border-bottom:2pt solid #000;padding-bottom:2mm;margin-bottom:5mm;font-size:9pt}
  .pp table{width:100%;border-collapse:collapse;margin-bottom:4mm}
  .pp td,.pp th{border:0.6pt solid #999;padding:1.6mm 2.2mm;vertical-align:top;text-align:left;font-size:9.5pt}
  .pp th{background:#eee;width:30%;font-weight:700}
  .pp .txt{white-space:pre-wrap}
  .pp .sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
  .pp .tile{border:0.6pt solid #999;break-inside:avoid}
  .pp .tile .im{-webkit-print-color-adjust:exact;print-color-adjust:exact;aspect-ratio:4/5;background:#ddd;display:grid;place-items:center;font:700 20pt Arial;color:#777;overflow:hidden}
  .pp .tile img{width:100%;height:100%;object-fit:cover}
  .pp .tile .tx{padding:1.6mm 2mm;font-size:8.5pt;line-height:1.3}
  .pp .tile .tx b{font-size:10pt;display:block}
}

@media(max-width:1000px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ad{grid-template-columns:1fr}.ad-side{display:grid;grid-template-columns:180px 1fr;gap:14px}.ad-shot{grid-row:span 3}
  .au-rates{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prof{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .page{padding:14px 14px 60px}
  .g2,.g3,.g4,.rates{grid-template-columns:1fr}.span2{grid-column:auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .au,.au.focus{grid-template-columns:1fr}.au-side{border-right:0;border-bottom:1px solid var(--fth-line);flex-direction:row;flex-wrap:wrap}.au-side .hs{width:84px}
  .ad-side{grid-template-columns:1fr}
  .lrow,.lrow.two{grid-template-columns:1fr auto auto}
  .lrow>:nth-child(1){grid-column:1/-1}
  .rname input{font-size:34px}
}

<body>
<header class="fth-head">
  <div class="fth-id"><span class="fth-eyebrow" data-fth-cat>04 · Planning &amp; Scheduling</span><h1 class="fth-title">Casting Tracker</h1></div>
  <nav class="modes" id="modes" aria-label="Mode"></nav>
  <div class="fth-actions">
    <span class="status" id="saveState"></span>
    <button class="fth-btn" data-act="import" title="Pull characters from Script Development and Script Breakdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>Import characters</button>
    <span class="fth-vsep"></span>
    <div class="menuwrap">
      <button class="fth-btn ghost" data-act="menu" aria-haspopup="menu">Export &amp; more<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="pop" id="pop" role="menu" hidden></div>

</header>
<main id="app"></main>

<input type="file" id="imgPick" accept="image/*" hidden>
<input type="file" id="bkPick" accept=".json,application/json" hidden>
<div id="print"></div>

<script>
'use strict';
/* ═════════════ constants ═════════════ */
const STAGES = [
  {id:'submitted', n:'Submitted'},
  {id:'reviewed',  n:'Reviewed'},
  {id:'selftape',  n:'Self-tape received'},
  {id:'callback',  n:'Callback'},
  {id:'producer',  n:'Producer session'},
  {id:'offered',   n:'Offered'},
  {id:'booked',    n:'Booked'}
];
const SIDX = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
const stName = id => (STAGES.find(s => s.id === id) || {n: id}).n;
const stCol = id => `var(--st-${id})`;
const ROLE_TYPES = ['Lead', 'Supporting', 'Featured', 'Day player', 'Recurring', 'Cameo', 'Background / SA'];
const ROLE_COLORS = ['#4fc7b5', '#f5b14c', '#e889c8', '#97a3ff', '#ff7152', '#8bd16a', '#5ab8f0', '#c79bff', '#ffd166', '#ef6f8e'];
const UNITS = [['day', 'per day'], ['hour', 'per hour'], ['week', 'per week'], ['project', 'flat fee'], ['deferred', 'deferred'], ['expenses', 'expenses only'], ['unpaid', 'unpaid']];
const UNIT_SHORT = {hour: '/hr', day: '/day', week: '/wk', project: ' flat', deferred: ' deferred', expenses: ' expenses', unpaid: ' unpaid'};
const UNIONS = ['', 'Equity (UK)', 'Irish Equity', 'SAG-AFTRA', 'ACTRA', 'MEAA', 'Non-union', 'Other'];
const CONTRACTS = ['', 'Equity / PACT', 'Equity low-budget', 'SAG-AFTRA Ultra Low Budget', 'SAG-AFTRA Short Project', 'Non-union', 'Student / collaborative', 'Other'];
const NUDITY = ['None', 'Implied', 'Partial', 'Full'];
const FORMATS = ['Self-tape first', 'In person', 'Self-tape, then in person', 'Online (Zoom)', 'Offer only'];
const DIR_RATES = [
  ['pref', 'Preference', 'How much you want them for this role'],
  ['look', 'Look suitability', 'Matches the look of the character'],
  ['voice', 'Voice suitability', 'Voice, accent and delivery'],
  ['perf', 'Performance', 'Truth and quality of the read or tape'],
  ['adjust', 'Takes direction', 'Adjusts well when given a note'],
  ['pro', 'Professionalism', 'Prep, punctuality, communication']
];
const AUD_RATES = [
  ['prep', 'Preparation', 'Knew the material, made choices'],
  ['fit', 'Character fit', 'Feels like the person on the page'],
  ['truth', 'Emotional truth', 'Present, listening, believable'],
  ['adjust', 'Redirection', 'How well they took the note'],
  ['voice', 'Voice & accent', 'Clarity, accent, range'],
  ['presence', 'Screen presence', 'Holds the frame / the room']
];
const AUD_TAGS = ['Off-book', 'Strong choices', 'Natural on camera', 'Great listener', 'Brought something new', 'Nervous', 'Needs accent work', 'Late'];
const CHEM_RATES = [
  ['spark', 'Connection', 'Spark and genuine rapport'],
  ['listen', 'Listening', 'React to each other, not the page'],
  ['rhythm', 'Rhythm & timing', 'Dialogue pace feels lived-in'],
  ['status', 'Power dynamic', 'Status between them fits the story'],
  ['visual', 'Visual match', 'Believable together on screen'],
  ['history', 'Shared history', 'Feels like they have a past']
];
const ROUNDS = [['audition', 'Audition'], ['callback', 'Callback'], ['producer', 'Producer session']];
const NEXT_STAGE = {audition: 'callback', callback: 'producer', producer: 'offered'};
const KEY = 'fth-casting-v1';

/* ═════════════ icons ═════════════ */
const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  back: I('<path d="M15 6l-6 6 6 6"/>'),
  chev: I('<path d="M7 10l5 5 5-5"/>'),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>',
  starO: I('<path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/>'),
  link: I('<path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  trash: I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  mail: I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>'),
  people: I('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8"/>'),
  clap: I('<rect x="3.5" y="10" width="17" height="10" rx="1.5"/><path d="M3.3 10L2.7 6.6l16.2-2.9.6 3.4"/><path d="M7.2 5.8l2.3 3.1M11.6 5l2.3 3.1"/>'),
  chem: I('<circle cx="8.5" cy="12" r="5"/><circle cx="15.5" cy="12" r="5"/>'),
  grid: I('<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>'),
  board: I('<rect x="3.5" y="4" width="5" height="16" rx="1"/><rect x="9.5" y="4" width="5" height="11" rx="1"/><rect x="15.5" y="4" width="5" height="7" rx="1"/>'),
  table: I('<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9 4.5v15"/>'),
  print: I('<path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8" rx="1.5"/><path d="M7 13h10v7.5H7z"/>'),
  csv: I('<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h6"/>'),
  save: I('<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>'),
  open: I('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>'),
  spark: I('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'),
  reset: I('<path d="M4 4v5h5"/><path d="M5.2 15a7.5 7.5 0 1 0 1.4-7.6L4 9"/>'),
  warn: I('<path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.2" r=".4" fill="currentColor"/>'),
  cam: I('<rect x="3" y="7" width="13" height="11" rx="1.5"/><path d="M16 11l5-3v9l-5-3"/>'),
  img: I('<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/>'),
  list: I('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8" fill="currentColor"/><circle cx="4" cy="12" r=".8" fill="currentColor"/><circle cx="4" cy="18" r=".8" fill="currentColor"/>'),
  focus: I('<rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="M9 9h6M9 13h6"/>'),
  right: I('<path d="M9 6l6 6-6 6"/>'),
  left: I('<path d="M15 6l-6 6 6 6"/>')
};

/* ═════════════ helpers ═════════════ */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
const today = () => iso(new Date());
const fmtD = s => { const d = parseISO(s); return d ? d.toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) : ''; };
const fmtDY = s => { const d = parseISO(s); return d ? d.toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'}) : ''; };
const fmtT = t => t ? new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) + ' ' + new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
const initials = n => { const p = String(n || '').trim().split(/\s+/).filter(Boolean); return p.length ? (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() : '?'; };
const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); let t = o; ks.slice(0, -1).forEach(k => { if (t[k] == null || typeof t[k] !== 'object') t[k] = {}; t = t[k]; }); t[ks[ks.length - 1]] = v; };
const avg = arr => { const v = arr.filter(x => typeof x === 'number' && x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const f1 = n => n == null ? '–' : (Math.round(n * 10) / 10).toFixed(1);
const cur = () => S.prod.currency || '£';
const money = n => (n === '' || n == null || isNaN(n)) ? '' : cur() + Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
const nameUp = s => String(s || '').trim().toUpperCase();

function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms); }

/* ═════════════ state ═════════════ */
const blankProd = () => ({title: '', company: '', director: '', producer: '', cd: '', shootStart: '', shootEnd: '', location: '', contract: '', deadline: '', currency: '£', notes: ''});
const blank = () => ({v: 1, prod: blankProd(), roles: [], actors: [], auds: {}, pairs: [],
  ui: {mode: 'manager', roleId: null, view: 'grid', stage: '', sort: 'stage', prodOpen: false, aRound: 'audition', aRole: '', aStage: 'active', aQ: '', aLayout: 'list', aIdx: 0, cA: '', cB: '', cAll: false}});
function newRole(o = {}) {
  return Object.assign({id: uid(), name: '', type: 'Supporting', color: ROLE_COLORS[S.roles.length % ROLE_COLORS.length],
    ageMin: '', ageMax: '', gender: '', ethnicity: '', height: '', build: '', look: '', accent: '', skills: '',
    desc: '', arc: '', traits: '', backstory: '', scenes: '', sceneList: '', days: '', dates: '',
    nudity: 'None', intimacy: '', stunts: '', format: 'Self-tape first', sides: '', tapeInstr: '',
    rate: '', budget: '', budgetUnit: 'day', hours: '', contract: '', usage: '', notes: '', src: null, created: Date.now(), bdOpen: true}, o);
}
function newActor(roleId, o = {}) {
  return Object.assign({id: uid(), roleId, name: '', pronouns: '', ageMin: '', ageMax: '', base: '', height: '', union: '', skills: '',
    rep: 'agent', agentName: '', agency: '', agentEmail: '', agentPhone: '', email: '', phone: '', profile: '', reel: '',
    tapes: [], links: [], stage: 'submitted', passed: false, shortlist: false, submitted: today(),
    hist: [{s: 'submitted', at: Date.now()}], avail: {days: {}, notes: '', confirmed: false},
    fee: {amount: '', unit: 'day', notes: ''}, dir: {notes: '', concerns: '', rec: ''}, img: false, created: Date.now()}, o);
}

let S = blank(), savedAt = 0;
function mergeDefaults(d, t) {
  if (Array.isArray(t)) return Array.isArray(d) ? d : t;
  if (t && typeof t === 'object') { const o = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {}; for (const k in t) o[k] = (k in o) ? mergeDefaults(o[k], t[k]) : t[k]; return o; }
  return d === undefined ? t : d;
}
function normalise(s) {
  s = mergeDefaults(s, blank());
  s.roles = s.roles.map(r => mergeDefaults(r, newRole({id: r.id})));
  s.actors = s.actors.map(a => mergeDefaults(a, newActor(a.roleId, {id: a.id, hist: a.hist || []})));
  return s;
}
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.S) { S = normalise(o.S); savedAt = o.at || 0; } } catch (e) {}

function showSaved() { const el = $('#saveState'); if (el) el.textContent = savedAt ? 'Saved in this browser · ' + new Date(savedAt).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : ''; }
let saveT;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify({S, at: savedAt})); showSaved(); }
    catch (e) { const el = $('#saveState'); if (el) el.textContent = 'Couldn’t save in this browser'; }
  }, 350);
}
window.addEventListener('pagehide', () => { if (saveT) { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify({S, at: Date.now()})); } catch (e) {} } });

/* headshots live in IndexedDB (localStorage is too small for images) */
const IMG = new Map();
const imgDB = {
  p: null,
  open() { return this.p || (this.p = new Promise((res, rej) => { try { const r = indexedDB.open('casting-tracker', 1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); },
  async all() { const d = await this.open(); return new Promise(res => { const out = new Map(), q = d.transaction('img').objectStore('img').openCursor(); q.onsuccess = () => { const c = q.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); }; q.onerror = () => res(out); }); },
  async put(k, v) { const d = await this.open(); return new Promise(res => { const t = d.transaction('img', 'readwrite'); t.objectStore('img').put(v, k); t.oncomplete = res; t.onerror = res; }); },
  async del(k) { const d = await this.open(); return new Promise(res => { const t = d.transaction('img', 'readwrite'); t.objectStore('img').delete(k); t.oncomplete = res; t.onerror = res; }); },
  async clear() { const d = await this.open(); return new Promise(res => { const t = d.transaction('img', 'readwrite'); t.objectStore('img').clear(); t.oncomplete = res; t.onerror = res; }); }
};

/* ═════════════ lookups & derived ═════════════ */
const role = id => S.roles.find(r => r.id === id);
const actor = id => S.actors.find(a => a.id === id);
const pair = id => S.pairs.find(p => p.id === id);
const actorsOf = rid => S.actors.filter(a => a.roleId === rid);
const rc = r => (r && r.color) || '#888';
const audKey = (aid, round) => aid + '|' + round;
const aud = (aid, round) => S.auds[audKey(aid, round)];
const dirAvg = a => avg(DIR_RATES.map(([k]) => a.dir[k]));
const audAvg = rec => rec ? avg(AUD_RATES.map(([k]) => (rec.r || {})[k])) : null;
const pairAvg = p => avg(CHEM_RATES.map(([k]) => (p.r || {})[k]));
const ageTxt = (a, b) => a && b ? `${a}–${b}` : a ? `${a}+` : b ? `up to ${b}` : '';

function roleStatus(r) {
  const as = actorsOf(r.id).filter(a => !a.passed);
  if (as.some(a => a.stage === 'booked')) return ['Cast', stCol('booked')];
  if (as.some(a => a.stage === 'offered')) return ['Offer out', stCol('offered')];
  if (as.some(a => SIDX[a.stage] >= SIDX.callback)) return ['Shortlisting', stCol('callback')];
  if (actorsOf(r.id).length) return ['Auditioning', stCol('reviewed')];
  return ['Open', stCol('submitted')];
}
const bookedOf = r => actorsOf(r.id).find(a => a.stage === 'booked' && !a.passed);

function feeTotal(amount, unit, days, hours) {
  const a = parseFloat(amount), d = parseFloat(days) || 0, h = parseFloat(hours) || 10;
  if (isNaN(a)) return null;
  if (unit === 'project') return a;
  if (!d) return null;
  if (unit === 'day') return a * d;
  if (unit === 'hour') return a * h * d;
  if (unit === 'week') return a * Math.max(1, Math.ceil(d / 5));
  return null;
}
const roleBudget = r => feeTotal(r.budget, r.budgetUnit, r.days, r.hours);
const actorCost = a => { const r = role(a.roleId); return r ? feeTotal(a.fee.amount, a.fee.unit, r.days, r.hours) : null; };

function shootDays() {
  const a = parseISO(S.prod.shootStart), b = parseISO(S.prod.shootEnd) || a;
  if (!a) return [];
  const out = []; for (let d = new Date(a); d <= b && out.length < 120; d.setDate(d.getDate() + 1)) out.push(iso(d));
  return out;
}
function availSum(a) {
  const days = shootDays(), o = {a: 0, p: 0, u: 0, n: 0, total: days.length};
  days.forEach(d => { const v = a.avail.days[d]; o[v || 'n']++; });
  return o;
}

/* ═════════════ rendering helpers ═════════════ */
function hs(a, cls = '') {
  const r = role(a.roleId), src = a.img && IMG.get(a.id);
  return `<div class="hs ${cls}" style="--rc:${rc(r)}">${src ? `<img src="${src}" alt="">` : esc(initials(a.name))}</div>`;
}
const pill = st => `<span class="pill" style="--c:${stCol(st)}">${esc(stName(st))}</span>`;

function stars(n) { n = Math.round(n || 0); let s = ''; for (let i = 1; i <= 5; i++) s += i <= n ? IC.star : `<span class="off">${IC.star}</span>`; return `<span class="stars">${s}</span>`; }
const opt = (list, v) => list.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o || '—']; return `<option value="${esc(val)}"${String(val) === String(v ?? '') ? ' selected' : ''}>${esc(lab)}</option>`; }).join('');
const inp = (k, v, ph = '', extra = '') => `<input class="fth-input" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}" ${extra}>`;
const num = (k, v, ph = '', extra = '') => `<input class="fth-input" type="number" min="0" step="any" data-k="${k}" data-type="num" value="${esc(v)}" placeholder="${esc(ph)}" ${extra}>`;
const ta = (k, v, ph = '', rows = 3) => `<textarea class="fth-input" data-k="${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const sel = (k, list, v, extra = '') => `<select class="fth-input" data-k="${k}" ${extra}>${opt(list, v)}</select>`;
const fld = (label, html, cls = '', hint = '') => `<div class="f ${cls}"><label class="lbl">${label}</label>${html}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
function dots(k, v, act = 'rate') {
  let s = ''; for (let i = 1; i <= 5; i++) s += `<button type="button" data-act="${act}" data-k="${k}" data-v="${i}" class="${v === i ? 'on' : v > i ? 'lit' : ''}" aria-label="${i} of 5">${i}</button>`;
  return `<div class="dots">${s}</div>`;
}
const rateRow = (k, label, help, v, act) => `<div class="rate"><div class="rl"><b>${esc(label)}</b><small>${esc(help)}</small></div>${dots(k, v, act)}</div>`;

function roleCard(r) {

  const top = (b ? [b] : as.filter(a => !a.passed).sort((x, y) => (y.shortlist - x.shortlist) || (SIDX[y.stage] - SIDX[x.stage]) || ((y.dir.pref || 0) - (x.dir.pref || 0)))).slice(0, 5);
  const age = ageTxt(r.ageMin, r.ageMax);

function filtered(all) {
  const f = S.ui.stage;
  let as = all.filter(a => f === 'passed' ? a.passed : f ? !a.passed && a.stage === f : true);
  const s = S.ui.sort;
  const by = {
    stage: (x, y) => (x.passed - y.passed) || (SIDX[y.stage] - SIDX[x.stage]) || (y.shortlist - x.shortlist) || ((y.dir.pref || 0) - (x.dir.pref || 0)),
    pref: (x, y) => (x.passed - y.passed) || ((y.dir.pref || 0) - (x.dir.pref || 0)) || ((dirAvg(y) || 0) - (dirAvg(x) || 0)),
    score: (x, y) => (x.passed - y.passed) || ((dirAvg(y) || 0) - (dirAvg(x) || 0)),
    name: (x, y) => (x.name || '').localeCompare(y.name || ''),
    new: (x, y) => y.created - x.created
  }[s] || (() => 0);
  return as.slice().sort(by);
}
function stageChips(all) {
  const n = id => all.filter(a => !a.passed && a.stage === id).length;
  const f = S.ui.stage;
  return `<div class="stchips" style="margin-bottom:14px">
    <button class="stchip ${!f ? 'on' : ''}" style="--c:var(--fth-text)" data-act="stageF" data-v="">All <b>${all.length}</b></button>
    ${STAGES.map(s => `<button class="stchip ${f === s.id ? 'on' : ''}" style="--c:${stCol(s.id)}" data-act="stageF" data-v="${s.id}"><i></i>${s.n} <b>${n(s.id)}</b></button>`).join('')}
    <button class="stchip ${f === 'passed' ? 'on' : ''}" style="--c:var(--st-passed)" data-act="stageF" data-v="passed"><i></i>Passed <b>${all.filter(a => a.passed).length}</b></button>
  </div>`;
}
function grid(r, as) {
  if (!as.length) return '<div class="empty"><p style="margin:0">Nobody at this stage.</p></div>';
  return `<div class="actors">${as.map(actorCard).join('')}<button class="addcard" data-act="addActor" data-id="${r.id}" style="min-height:280px">${IC.plus}Add auditionee</button></div>`;
}
function actorCard(a) {
  const av = availSum(a), sc = dirAvg(a);
  const meta = [ageTxt(a.ageMin, a.ageMax) && 'Plays ' + ageTxt(a.ageMin, a.ageMax), a.base, a.rep === 'self' ? 'Self-represented' : a.agency || a.agentName].filter(Boolean).join(' · ');
  return `<article class="fth-card acard ${a.passed ? 'passed' : ''}" data-act="openActor" data-id="${a.id}" tabindex="0">
    ${hs(a)}
    <button class="star ${a.shortlist ? 'on' : ''}" data-act="shortlist" data-id="${a.id}" title="${a.shortlist ? 'On your shortlist' : 'Add to shortlist'}">${a.shortlist ? IC.star : IC.starO}</button>

}
function rerenderAll() { render(); if ($('#adlg').open) renderActor(); }

/* ═════════════ binding ═════════════ */
function ctxObj(el) {
  const c = el.closest('[data-ctx]'); if (!c) return null;
  const [t, id, x] = c.dataset.ctx.split(':');
  if (t === 'prod') return S.prod;
  if (t === 'ui') return S.ui;
  if (t === 'role') return role(id);
  if (t === 'actor') return actor(id);
  if (t === 'pair') return pair(id);
  if (t === 'aud') { const k = audKey(id, x); return S.auds[k] || (S.auds[k] = {date: today(), r: {}, tags: []}); }
  return null;
}
function readVal(el) {
  if (el.dataset.type === 'bool') return el.checked;
  if (el.dataset.type === 'num') return el.value === '' ? '' : Math.max(0, parseFloat(el.value));
  return el.value;
}
function onField(e) {
  const el = e.target; if (!el.dataset || !el.dataset.k) return;
  const o = ctxObj(el); if (!o) return;
  const k = el.dataset.k, v = readVal(el);
  if (k === 'roleId' && o.roleId !== v) { o.hist.push({s: 'role', at: Date.now()}); }
  setP(o, k, v);
  if (el.dataset.live) { const t = document.getElementById(el.dataset.live); if (t) t.textContent = v || (el.dataset.live === 'adTitle' ? 'New auditionee' : 'Unnamed role'); }
  if (k.startsWith('tapes.') && k.endsWith('.url') && v && SIDX[o.stage] < SIDX.selftape) { o.stage = 'selftape'; o.passed = false; o.hist.push({s: 'selftape', at: Date.now()}); }
  persist();
  const r = el.dataset.r;
  if (e.type === 'change' && r !== undefined) setTimeout(rerenderAll, 0);   /* after focus has moved on, so it can be restored */
  else if (e.type === 'input' && r === 'soft') { clearTimeout(onField.t); onField.t = setTimeout(() => render(), 250); }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.actChange === 'aJump') { S.ui.aIdx = +e.target.value; persist(); render(false); return; }
  if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT' || e.target.type === 'date' || e.target.type === 'number' || e.target.dataset.r !== undefined) onField(e);
});

function shrink(file) {

    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const max = 520, s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .84)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ═════════════ import from other hub tools ═════════════
   Every tool in the hub runs on the same origin and the hub files each tool's storage under the current
   project, so the Casting Tracker can read Script Development (localStorage) and Script Breakdown
   (IndexedDB) for the same project directly. Nothing in those tools is changed. */
const ARC_NAMES = {positive: ['Positive change', 'Lie', 'Truth'], flat: ['Flat', 'Truth', 'Truth'], corruption: ['Corruption', 'Truth', 'Lie'], fall: ['Fall', 'Lie', 'Lie'], disillusionment: ['Disillusionment', 'Lie', 'Tragic Truth']};
const TYPE_MAP = {Protagonist: 'Lead', Antagonist: 'Lead', Supporting: 'Supporting', Minor: 'Day player'};
function readScriptDev() {
  try {
    const keys = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('scaffold-script:p:') === 0) keys.push(k); }
    const projs = keys.map(k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }).filter(p => p && p.develop);
    if (!projs.length) return null;
    const last = localStorage.getItem('scaffold-script:last');
    return projs.find(p => p.id === last) || projs.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0];
  } catch (e) { return null; }
}
function readBreakdown() {
  return new Promise(res => {
    let r, made = false;
    try { r = indexedDB.open('script-breakdown'); } catch (e) { return res(null); }
    r.onupgradeneeded = () => { made = true; try { r.transaction.abort(); } catch (e) {} };   /* it didn't exist: don't create it */
    r.onerror = r.onblocked = () => res(null);
    r.onsuccess = () => {
      const db = r.result;
      if (made || !db.objectStoreNames.contains('s')) { db.close(); return res(null); }
      try { const q = db.transaction('s').objectStore('s').get('last'); q.onsuccess = () => { db.close(); res(q.result || null); }; q.onerror = () => { db.close(); res(null); }; }
      catch (e) { db.close(); res(null); }
    };
  });
}
function fountainScenes(text) {
  const L = String(text || '').replace(/\r/g, '').split('\n'), cues = new Map(); let sc = 0;
  for (let i = 0; i < L.length; i++) {
    const t = L[i].trim(), prevBlank = i === 0 || !L[i - 1].trim(), next = (L[i + 1] || '').trim();
    if (!t) continue;
    if (prevBlank && /^(\.(?=[A-Z0-9])|(INT|EXT|EST|INT\.?\/EXT|I\/E)[.\s])/i.test(t)) { sc++; continue; }
    if (prevBlank && next && (t[0] === '@' || (t === t.toUpperCase() && /[A-Z]/.test(t) && !/TO:$/.test(t) && t.length < 40 && !/^[!>=#~]/.test(t)))) {
      const n = t.replace(/^@/, '').replace(/\^$/, '').replace(/\(.*?\)/g, '').trim().toUpperCase();
      if (n) { if (!cues.has(n)) cues.set(n, new Set()); cues.get(n).add(sc || 1); }
    }
  }
  return cues;
}
function cueFor(cues, name) {
  const up = nameUp(name), parts = up.split(/\s+/);
  for (const k of [up, parts[0], parts[parts.length - 1]]) if (k && cues.has(k)) return cues.get(k);
  return null;
}
function rangeList(nums) {
  const s = [...nums].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length; i++) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j > i + 1 ? `${s[i]}–${s[j]}` : j === i + 1 ? `${s[i]}, ${s[j]}` : `${s[i]}`); i = j; }
  return out.join(', ');
}
async function gatherSources() {
  const found = new Map(), info = {sd: null, bd: null};
  const sd = readScriptDev();
  if (sd) {
    const d = sd.develop, cues = fountainScenes(sd.script && sd.script.text);
    info.sd = {title: sd.title || 'Untitled script', n: 0};
    (d.characters || []).filter(c => (c.name || '').trim()).forEach(c => {
      const isP = c.role === 'Protagonist', arcK = isP ? d.arc : c.arcOn ? c.arc : null, an = ARC_NAMES[arcK];
      const lie = isP ? d.lie : c.lie, truth = isP ? (arcK === 'disillusionment' ? d.tragic || d.truth : d.truth) : c.truth;
      let arc = '';
      if (an) { const fr = (an[1] === 'Lie' ? lie : truth) || '…', to = (an[2] === 'Lie' ? lie : truth) || '…';
        arc = `${an[0]} arc` + (lie || truth ? (an[1] === an[2] ? `: holds to “${fr}” while it’s tested` : `: from believing “${fr}” to “${to}”`) : ''); }
      const cyc = c.cycle || {}, cycTxt = [cyc.s, cyc.e, cyc.b, cyc.r].some(Boolean) ? `Pattern: ${[cyc.s, cyc.e, cyc.b, cyc.r].map(x => x || '…').join(' › ')}` : '';
      const back = [c.want && 'Wants: ' + c.want, c.flaw && 'Flaw: ' + c.flaw, c.history && c.history, cycTxt].filter(Boolean).join('\n');
      const sc = cueFor(cues, c.name);
      found.set(nameUp(c.name), {name: c.name.trim(), from: ['Script Development'], sdId: c.id,
        fields: {type: TYPE_MAP[c.role] || 'Supporting', desc: c.desc || '', arc, backstory: back, scenes: sc ? sc.size : '', sceneList: sc ? rangeList(sc) : ''},
        note: [c.role, sc && sc.size + ' scene' + (sc.size > 1 ? 's' : '')].filter(Boolean).join(' · ')});
      info.sd.n++;
    });
  }
  const bd = await readBreakdown();
  if (bd && Array.isArray(bd.tags)) {
    const castCat = (bd.cats || []).find(c => c && (c.id === 'cast' || /^cast$/i.test(c.name || ''))), cid = castCat ? castCat.id : 'cast';
    const counts = new Map();
    bd.tags.filter(t => t.cat === cid && (t.item || '').trim()).forEach(t => { const k = nameUp(t.item); counts.set(k, {name: counts.get(k) ? counts.get(k).name : t.item.trim(), n: (counts.get(k) ? counts.get(k).n : 0) + 1}); });
    info.bd = {title: bd.title || bd.fileName || 'Script', n: counts.size};
    counts.forEach((v, k) => {

      const ex = found.get(k) || [...found.values()].find(f => cueFor(new Map([[k, 1]]), f.name));
      if (ex) { ex.from.push('Script Breakdown'); ex.note += ` · tagged ${v.n}× in Breakdown`; if (!ex.fields.desc && noteTxt) ex.fields.desc = noteTxt; }
      else found.set(k, {name: v.name.replace(/\b\w+/g, w => w[0] + w.slice(1).toLowerCase()), from: ['Script Breakdown'], fields: {type: 'Supporting', desc: noteTxt}, note: `Tagged ${v.n}× as cast in Breakdown`});
    });
  }
  return {list: [...found.values()], info};
}

$('#bkPick').addEventListener('change', async e => {

  try {
    const o = JSON.parse(await f.text()); if (!o || o.app !== 'fth-casting' || !o.S) throw 0;
    if (!await confirmDlg('Restore this backup?', `Everything in the Casting Tracker for this project is replaced with the backup from ${new Date(o.at).toLocaleString()}.`, 'Restore')) return;

    for (const [k, v] of Object.entries(o.img || {})) { IMG.set(k, v); await imgDB.put(k, v); }

});
