<html lang="en"><head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

/* "Save to Documentation" buttons stay hidden until the hub switches them on (window.fthDocs.attach) */
[data-fth-doc][hidden]{display:none!important}

:root{--fth-cat:#ff7152;--fth-accent:#ff7152;--fth-accent-ink:#ff7152;--fth-accent-soft:rgba(255,113,82,0.14);--fth-accent-line:rgba(255,113,82,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#944230;--fth-accent-ink:#944230;--fth-accent-soft:rgba(255,113,82,0.16);--fth-accent-line:rgba(255,113,82,0.6);--fth-on-accent:#ffffff}
</style>

*{box-sizing:border-box}

.tip{display:none;margin:2px 0 8px}.tip.on{display:block}
.fth-sec .fth-info{margin-left:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}

.t td{padding:3px 3px;border-bottom:1px solid var(--fth-line)}
.t tr:last-child td{border-bottom:0}

.t .fth-input:hover{border-color:var(--fth-line3)}
.t .fth-input:focus{background:var(--fth-surface)}
.t td:first-child{padding-left:6px}
.t input[type=checkbox]{margin:0 8px}
.x{color:var(--fth-faint)}.x:hover{color:var(--fth-bad)}
#warn .fth-warn{margin:14px 0 0}#warn .fth-warn b{display:block;margin-bottom:3px}
/* preview: the call sheet itself stays a white printed page in both themes */
.pvlabel{max-width:820px;margin:0 auto 10px;display:flex;justify-content:space-between;gap:10px}
#pv{padding:14px;font:9px/1.35 Arial,Helvetica,sans-serif;width:100%;max-width:820px;margin:auto}
#pv table{border-collapse:collapse;width:100%}#pv td,#pv th{border:1px solid #000;padding:2px 4px;vertical-align:top}
#pv th{background:#ccc;font-size:8px}#pv .c{text-align:center}#pv .box{border:1px solid #000;padding:3px 5px;min-height:60px}
#pv .top{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;margin:8px 0}.hd{display:flex;justify-content:space-between;font-size:8px;font-style:italic}
#pv .ti{background:#bbb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;text-align:center;padding:6px}
#pv .big td{text-align:center;font-size:11px;font-weight:700}#pv .sp{height:8px;border:0}
@media(max-width:900px){html,body{height:auto}body{display:block}.app{grid-template-columns:1fr}.ed{border-right:0;border-bottom:1px solid var(--fth-line)}.ed,.pvw{overflow:visible}}
@media print{@page{size:A4;margin:8mm}html,body{height:auto}body{display:block}.ed,.pvlabel{display:none}.app{display:block}.pvw{padding:0;overflow:visible}#pv{max-width:none;padding:0;font-size:9.5px}}

${F("AM temp (°C)","amT","number")}${F("PM temp (°C)","pmT","number")}${F("Humidity (%)","hum","number")}<div></div>${F("Latitude","lat","number","loc")}${F("Longitude","lng","number")}</div>

<h2 class="fth-sec"><span class="fth-num">09</span>Crew ${info("crew")}</h2>${tip("crew")}${tbl("crew",[["pos","Position"],["name","Name"],["ph","Phone"],["set","Set (time)"]])}${window.fthPeople&&window.fthPeople().length?`<div class="bar"><button class="fth-btn sm" data-crewfill="1" title="Adds everyone this project is shared with, by the name and role in the project's crew list. You can still type over any of it.">＋ Add project crew</button></div>`:""}`;
if(act&&act.dataset&&act.dataset.k){const q=`[data-k="${act.dataset.k}"]`+(act.dataset.a?`[data-a="${act.dataset.a}"][data-i="${act.dataset.i}"]`:":not([data-a])");const n=$(q);n&&n.focus()}}
// maths
const pv=v=>{const m=String(v||"").trim().match(/^(?:(\d+)\s+)?(?:(\d+)\/(\d+))?$|^(\d+)$/);if(!m||!String(v).trim())return 0;return m[4]?+m[4]:(+m[1]||0)+(m[2]?m[2]/m[3]:0)};
const fp=x=>{const e=Math.round(x*8),w=Math.floor(e/8),r=e%8;return (w?w+" ":"")+(r?r+"/8":"")||"0"};
const t12=t=>{if(!t)return"";let[h,m]=t.split(":");const a=h>=12?"pm":"am";h=h%12||12;return h+":"+m+" "+a};
const hm=m=>{if(m==null||isNaN(m))return"";m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=Math.round(m%60);return(mi==60?h+1:h)+":"+String(mi==60?0:mi).padStart(2,"0")};
function sun(ds,lat,lng){if(!ds||isNaN(lat)||isNaN(lng))return["",""];const[y,mo,d]=ds.split("-").map(Number),R=Math.PI/180,N=Math.round((Date.UTC(y,mo-1,d)-Date.UTC(y,0,0))/864e5),tz=-new Date(y,mo-1,d,12).getTimezoneOffset()/60,lh=lng/15;
const f=r=>{const t=N+((r?6:18)-lh)/24,M=0.9856*t-3.289;let L=(M+1.916*Math.sin(M*R)+0.02*Math.sin(2*M*R)+282.634+720)%360,RA=Math.atan(0.91764*Math.tan(L*R))/R;RA=(RA+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
const sd=0.39782*Math.sin(L*R),cd=Math.cos(Math.asin(sd)),ch=(Math.cos(90.833*R)-sd*Math.sin(lat*R))/(cd*Math.cos(lat*R));if(Math.abs(ch)>1)return null;
let H=(r?360-Math.acos(ch)/R:Math.acos(ch)/R)/15;let T=H+RA-0.06571*t-6.622,ut=((T-lh)%24+24)%24;return ((ut+tz)%24)*60};
const a=f(1),b=f(0);return[a==null?"":hm(a),b==null?"":hm(b)]}
const wxI=n=>(WX.find(w=>w[1]==n)||["",""])[0];
function totals(){return S.scenes.reduce((s,r)=>s+pv(r.pg),0)}
function warns(){const w=[],c=S.call,v=(x,m)=>x&&w.push(m);
v(S.first&&c&&S.first<c,"First shot is before call time.");v(S.last&&S.camWrap&&S.last>S.camWrap,"Last shot is after camera wrap.");v(S.camWrap&&S.crewWrap&&S.camWrap>S.crewWrap,"Camera wrap is after crew wrap.");
v(S.dinner&&c&&S.camWrap&&(S.dinner<c||S.dinner>S.camWrap),"Dinner falls outside call time to camera wrap.");
v(S.dinner&&c&&(parseInt(S.dinner)-parseInt(c))>6,"Dinner is more than 6 hours after call, so consider an earlier meal break.");
S.cast.forEach(r=>{if(r.set&&S.first&&r.set>S.first)w.push((r.name||"A cast member")+" is on set after the first shot.")});
const sc=S.scenes.filter(r=>r.st&&r.en).sort((a,b)=>a.st<b.st?-1:1);sc.forEach((r,i)=>{if(r.en<=r.st)w.push("Scene row “"+(r.sc||i+1)+"” ends before it starts.");if(sc[i+1]&&r.en>sc[i+1].st)w.push("Scene times overlap: "+(r.sc||"?")+" and "+(sc[i+1].sc||"?")+".")});
v(!S.date,"No shoot date yet, so sunrise and sunset can't be worked out.");v(!S.hosp,"Nearest hospital is missing; call sheets should always include it.");return w}
// preview
const sc_=r=>r.part?"("+r.sc+")":r.sc||"";
function prev(){const[sr,ss]=sun(S.date,+S.lat,+S.lng),dd=S.date?new Date(S.date+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
$("#pv").innerHTML=`<div class="hd"><span>${esc(S.title)}</span><span>${esc(S.place)}</span><span>${dd}</span><span>Day ${S.day} of ${S.days}</span></div>
<div class="top"><div class="box"><b>Producer</b> ${esc(S.producer)}<br><b>Director</b> ${esc(S.director)} ${esc(S.dirPhone)}<br><br><b>Nearest Hospital</b> ${esc(S.hospPhone)}<br>${esc(S.hosp)}<br>${esc(S.hospAddr)}</div>
<div class="ti">${esc(S.title.toUpperCase())}</div>
<table><tr><td><b>DINNER</b> ${t12(S.dinner)}</td><td><b>CRAFT SERVICES</b><br>${esc(S.craft)}</td></tr><tr><td><b>SUNRISE</b> 🌅 ${sr}<br><b>SUNSET</b> 🌇 ${ss}</td><td><b>WEATHER</b> ${wxI(S.wx)} ${esc(S.wx)}<br>AM: ${S.amT?S.amT+"C":""} PM: ${S.pmT?S.pmT+"C":""}<br>Humidity ${S.hum?S.hum+"%":""}</td></tr></table></div>
<div class="top"><div class="box" style="min-height:40px"><b>Set Address:</b><br>${esc(S.addr).replace(/\n/g,"<br>")}<br><b>What3Words:</b> ${esc(S.w3w)}</div>
<table class="big"><tr><td>CALL TIME<br>${S.call}</td><td>DINNER<br>${S.dinner}</td></tr><tr><td>CAMERA WRAP<br>${S.camWrap}</td><td>CREW WRAP<br>${S.crewWrap}</td></tr></table>
<div class="box" style="min-height:40px"><b>Notes:</b><br><i>${esc(S.notes).replace(/\n/g,"<br>")}</i></div></div>
<table><tr><th>SCENES</th><th>SET AND DESCRIPTION</th><th>CHAR #</th><th>D/N</th><th>PAGES</th><th>START</th><th>END</th><th>NOTES</th></tr>
${S.scenes.map(r=>`<tr><td class="c">${esc(sc_(r))}</td><td><b>${esc(r.set)}</b><br><i>${esc(r.desc)}</i></td><td class="c">${esc(r.ch)}</td><td class="c">${esc(r.dn)}</td><td>${esc(r.pg)}</td><td class="c">${r.st||""}</td><td class="c">${r.en||""}</td><td>${esc(r.nt)}</td></tr>`).join("")}
<tr><td colspan="4" style="border:0"></td><td colspan="2"><b>TOTAL PAGES</b></td><td colspan="2"><b>${fp(totals())}</b></td></tr></table><div class="sp"></div>
<table><tr><th>#</th><th>CAST</th><th>CHARACTER</th><th>SWHF</th><th>MU</th><th>SET</th><th>MINOR?</th><th>SPECIAL INSTRUCTIONS</th></tr>
${S.cast.map((r,i)=>`<tr class="c"><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.ch)}</td><td>${esc(r.sw)}</td><td>${r.mu||""}</td><td>${r.set||""}</td><td>${esc(r.minor)}</td><td>${esc(r.si)}</td></tr>`).join("")}</table><div class="sp"></div>
<table><tr><th colspan="2">SHOT INFORMATION</th></tr><tr class="c"><td>FIRST SHOT</td><td>${S.first}</td></tr><tr class="c"><td>LAST SHOT</td><td>${S.last}</td></tr></table><div class="sp"></div>
<table><tr><th>POSITION</th><th>NAME</th><th>PHONE</th><th>SET</th></tr>${S.crew.map(r=>`<tr class="c"><td>${esc(r.pos)}</td><td>${esc(r.name)}</td><td>${esc(r.ph)}</td><td>${esc(r.set)}</td></tr>`).join("")}</table>`;
const w=warns();$("#warn").innerHTML=w.length?`<div class="fth-warn"><b>Sense checks</b>${w.map(x=>"• "+esc(x)).join("<br>")}</div>`:""}
// events
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.k;if(!k)return;const v=t.type=="checkbox"?t.checked:t.value;
if(t.dataset.a)S[t.dataset.a][+t.dataset.i][k]=v;else S[k]=v;prev();persist()});
document.addEventListener("change",e=>{if(e.target.dataset.k)prev()});
/* in a shared project: bring the project's crew list into the crew table (names already there are left alone) */
function crewFill(){const same=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();let n=0;
(window.fthPeople?window.fthPeople():[]).forEach(p=>{if(S.crew.some(r=>same(r.name,p.name)))return;
const r=(p.role&&S.crew.find(r=>same(r.pos,p.role)&&!String(r.name||"").trim()))||S.crew.find(r=>!String(r.pos||"").trim()&&!String(r.name||"").trim());
if(r){r.name=p.name;if(p.role&&!String(r.pos||"").trim())r.pos=p.role}else S.crew.push({pos:p.role||"",name:p.name});n++});return n}
document.addEventListener("click",e=>{const t=e.target;if(t.dataset.crewfill){crewFill();form();prev();persist();return}if(t.dataset.add){S[t.dataset.add].push({});form();prev();persist()}
if(t.dataset.del&&confirm("Remove this row?")){S[t.dataset.del].splice(+t.dataset.i,1);form();prev();persist()}});
/* Documentation (Film Tool Hub): each export is also filed in the project's Documentation folder.
   window.fthDocs only exists inside the hub. Both helpers return true when the person chose
   "Save to Documentation", which means: don't download / don't open the print window. */
const fthDoc = (type, filename, blob, group) => !!(window.fthDocs && window.fthDocs.save({type, filename, blob, group}));
const fthPage = (type, name, group) => !!(window.fthDocs && window.fthDocs.page({type, name, group}));
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
let saveT;function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify({S,at:savedAt}));showSaved()}catch(e){$("#saveState").textContent="Couldn’t save in this browser"}},400)}
function showSaved(){$("#saveState").textContent=savedAt?"Saved in this browser · "+new Date(savedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}
function newSheet(){if(!confirm("Start a new, empty call sheet? The current one will be cleared from this browser."))return;S=JSON.parse(DEF);try{localStorage.removeItem(KEY)}catch(e){}savedAt=0;form();prev();showSaved()}
function xl(){if(typeof XLSX=="undefined")return alert("The Excel library couldn't load. Check your internet connection and try again.");
const[sr,ss]=sun(S.date,+S.lat,+S.lng),e=[""],R=[[S.title,"",S.place,"",S.date,"Day "+S.day+" of "+S.days],e,
["Producer",S.producer,"","Dinner",t12(S.dinner),"Craft services",S.craft],["Director",S.director+" "+S.dirPhone,"","Sunrise",sr,"Sunset",ss],
["Nearest hospital",S.hosp+", "+S.hospAddr+" "+S.hospPhone,"","Weather",S.wx,"AM "+S.amT+"C / PM "+S.pmT+"C","Humidity "+S.hum+"%"],e,
["Set address",S.addr,"","Call time",S.call,"Dinner",S.dinner],["What3Words",S.w3w,"","Camera wrap",S.camWrap,"Crew wrap",S.crewWrap],["Notes",S.notes],e,
["SCENES","SET","DESCRIPTION","CHAR #","D/N","PAGES","START","END","NOTES"],...S.scenes.map(r=>[sc_(r),r.set,r.desc,r.ch,r.dn,r.pg,r.st,r.en,r.nt]),["","","","","TOTAL PAGES",fp(totals())],e,
["#","CAST","CHARACTER","SWHF","MU","SET","MINOR?","SPECIAL INSTRUCTIONS"],...S.cast.map((r,i)=>[i+1,r.name,r.ch,r.sw,r.mu,r.set,r.minor,r.si]),e,
["SHOT INFORMATION"],["First shot",S.first],["Last shot",S.last],e,["POSITION","NAME","PHONE","SET"],...S.crew.map(r=>[r.pos,r.name,r.ph,r.set])];
const ws=XLSX.utils.aoa_to_sheet(R);ws["!cols"]=[{wch:22},{wch:28},{wch:36},{wch:16},{wch:16},{wch:18},{wch:12},{wch:12},{wch:24}];
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Call Sheet");const xn="Call_Sheet_"+(S.date||"draft")+".xlsx";
if(!fthDoc("Call Sheet Excel",xn,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})))XLSX.writeFile(wb,xn)}
function pdf(){if(!fthPage("Call Sheet PDF","Call Sheet "+(S.date||"draft")))print()}
if(window.fthDocs)fthDocs.attach($("#docBtn"),[{label:"Call Sheet PDF",fn:pdf},{label:"Call Sheet Excel",fn:xl}]);

</script></body></html>
