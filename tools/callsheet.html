<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Call Sheet Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--fth-display);display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(400px,46%) 1fr}
.ed{padding:6px 22px 48px;border-right:1px solid var(--fth-line);overflow:auto}
.pvw{padding:28px 24px 40px;overflow:auto}
.intro{color:var(--fth-muted);margin:16px 0 4px;font-size:13.5px;max-width:62ch}
.intro .fth-info{cursor:default}
.sub{color:var(--fth-muted);margin:0 0 10px;font-size:12.5px}
.status{font:500 11px var(--fth-mono);letter-spacing:.04em;color:var(--fth-faint);white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.g .w{grid-column:1/-1}
.ed label{display:flex;align-items:center;margin-bottom:5px}
.ed label:not(.fth-label){font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
textarea.fth-input{min-height:64px}
.inline{display:flex;gap:8px;align-items:center;color:var(--fth-muted);font-size:13px}
.tip{display:none;margin:2px 0 8px}.tip.on{display:block}
.fth-sec .fth-info{margin-left:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.tw{overflow-x:auto;border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-bg2)}
table.t{border-collapse:collapse;min-width:100%}
.t th{font:500 10px/1.2 var(--fth-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fth-muted);text-align:left;white-space:nowrap;padding:9px 6px 7px;border-bottom:1px solid var(--fth-line);background:var(--fth-surface)}
.t td{padding:3px 3px;border-bottom:1px solid var(--fth-line)}
.t tr:last-child td{border-bottom:0}
.t .fth-input{min-width:76px;padding:5px 7px;font-size:13px;border-radius:6px;background:var(--fth-surface);border-color:var(--fth-line)}
.t .fth-input:hover{border-color:var(--fth-line3)}
.t .fth-input:focus{background:var(--fth-surface)}
.t td:first-child{padding-left:6px}
.t input[type=checkbox]{margin:0 8px}
.x{color:var(--fth-faint)}.x:hover{color:var(--fth-bad)}
#warn .fth-warn{margin:14px 0 0}#warn .fth-warn b{display:block;margin-bottom:3px}
/* preview: the call sheet itself stays a white printed page in both themes */
.pvlabel{max-width:820px;margin:0 auto 10px;display:flex;justify-content:space-between;gap:10px}
#pv{padding:14px;font:9px/1.35 Arial,Helvetica,sans-serif;width:100%;max-width:820px;margin:auto}
#pv table{border-collapse:collapse;width:100%}#pv td,#pv th{border:1px solid #000;padding:2px 4px;vertical-align:top}
#pv th{background:#ccc;font-size:8px}#pv .c{text-align:center}#pv .box{border:1px solid #000;padding:3px 5px;min-height:60px}
#pv .top{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;margin:8px 0}.hd{display:flex;justify-content:space-between;font-size:8px;font-style:italic}
#pv .ti{background:#bbb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;text-align:center;padding:6px}
#pv .big td{text-align:center;font-size:11px;font-weight:700}#pv .sp{height:8px;border:0}
@media(max-width:900px){html,body{height:auto}body{display:block}.app{grid-template-columns:1fr}.ed{border-right:0;border-bottom:1px solid var(--fth-line)}.ed,.pvw{overflow:visible}}
@media print{@page{size:A4;margin:8mm}html,body{height:auto}body{display:block}.ed,.pvlabel{display:none}.app{display:block}.pvw{padding:0;overflow:visible}#pv{max-width:none;padding:0;font-size:9.5px}}

title:"The name of your production. It appears as the big heading on the sheet.",place:"The studio or company name shown in the top strip, e.g. 'E3 Studios, Belfast Met'.",

function form(){const act=document.activeElement;$("#ed").innerHTML=`
<p class="intro">Fill in each section and the call sheet builds live on the right. Click the <b class="fth-info">i</b> icons for help. For a PDF, choose “Save as PDF” as the printer. Excel needs an internet connection.</p>

<h2 class="fth-sec"><span class="fth-num">07</span>Scenes &amp; schedule ${info("scenes")}</h2>${tip("scenes")}${tbl("scenes",[["sc","Scenes"],["part","Partial","chk"],["set","Set"],["desc","Description"],["ch","Char #"],["dn","D/N","sel",["D","N"]],["pg","Pages"],["st","Start","time"],["en","End","time"],["nt","Notes"]])}
<h2 class="fth-sec"><span class="fth-num">08</span>Cast ${info("cast")}</h2>${tip("cast")}${tbl("cast",[["name","Cast"],["ch","Character"],["sw","SWHF","sel",["S","W","H","F","SW","WF","SWF"]],["mu","MU","time"],["set","Set","time"],["minor","Minor?","sel",["Y","N"]],["si","Special instructions"]])}

if(act&&act.dataset&&act.dataset.k){const q=`[data-k="${act.dataset.k}"]`+(act.dataset.a?`[data-a="${act.dataset.a}"][data-i="${act.dataset.i}"]`:":not([data-a])");const n=$(q);n&&n.focus()}}
// maths
const pv=v=>{const m=String(v||"").trim().match(/^(?:(\d+)\s+)?(?:(\d+)\/(\d+))?$|^(\d+)$/);if(!m||!String(v).trim())return 0;return m[4]?+m[4]:(+m[1]||0)+(m[2]?m[2]/m[3]:0)};

function sun(ds,lat,lng){if(!ds||isNaN(lat)||isNaN(lng))return["",""];const[y,mo,d]=ds.split("-").map(Number),R=Math.PI/180,N=Math.round((Date.UTC(y,mo-1,d)-Date.UTC(y,0,0))/864e5),tz=-new Date(y,mo-1,d,12).getTimezoneOffset()/60,lh=lng/15;

const a=f(1),b=f(0);return[a==null?"":hm(a),b==null?"":hm(b)]}
const wxI=n=>(WX.find(w=>w[1]==n)||["",""])[0];
function totals(){return S.scenes.reduce((s,r)=>s+pv(r.pg),0)}
function warns(){const w=[],c=S.call,v=(x,m)=>x&&w.push(m);
v(S.first&&c&&S.first<c,"First shot is before call time.");v(S.last&&S.camWrap&&S.last>S.camWrap,"Last shot is after camera wrap.");v(S.camWrap&&S.crewWrap&&S.camWrap>S.crewWrap,"Camera wrap is after crew wrap.");
v(S.dinner&&c&&S.camWrap&&(S.dinner<c||S.dinner>S.camWrap),"Dinner falls outside call time to camera wrap.");
v(S.dinner&&c&&(parseInt(S.dinner)-parseInt(c))>6,"Dinner is more than 6 hours after call, so consider an earlier meal break.");

// preview

$("#pv").innerHTML=`<div class="hd"><span>${esc(S.title)}</span><span>${esc(S.place)}</span><span>${dd}</span><span>Day ${S.day} of ${S.days}</span></div>
<div class="top"><div class="box"><b>Producer</b> ${esc(S.producer)}<br><b>Director</b> ${esc(S.director)} ${esc(S.dirPhone)}<br><br><b>Nearest Hospital</b> ${esc(S.hospPhone)}<br>${esc(S.hosp)}<br>${esc(S.hospAddr)}</div>
<div class="ti">${esc(S.title.toUpperCase())}</div>

<table class="big"><tr><td>CALL TIME<br>${S.call}</td><td>DINNER<br>${S.dinner}</td></tr><tr><td>CAMERA WRAP<br>${S.camWrap}</td><td>CREW WRAP<br>${S.crewWrap}</td></tr></table>

${S.scenes.map(r=>`<tr><td class="c">${esc(sc_(r))}</td><td><b>${esc(r.set)}</b><br><i>${esc(r.desc)}</i></td><td class="c">${esc(r.ch)}</td><td class="c">${esc(r.dn)}</td><td>${esc(r.pg)}</td><td class="c">${r.st||""}</td><td class="c">${r.en||""}</td><td>${esc(r.nt)}</td></tr>`).join("")}

${S.cast.map((r,i)=>`<tr class="c"><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.ch)}</td><td>${esc(r.sw)}</td><td>${r.mu||""}</td><td>${r.set||""}</td><td>${esc(r.minor)}</td><td>${esc(r.si)}</td></tr>`).join("")}</table><div class="sp"></div>

const w=warns();$("#warn").innerHTML=w.length?`<div class="fth-warn"><b>Sense checks</b>${w.map(x=>"• "+esc(x)).join("<br>")}</div>`:""}
// events
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.k;if(!k)return;const v=t.type=="checkbox"?t.checked:t.value;
if(t.dataset.a)S[t.dataset.a][+t.dataset.i][k]=v;else S[k]=v;prev();persist()});

const[sr,ss]=sun(S.date,+S.lat,+S.lng),e=[""],R=[[S.title,"",S.place,"",S.date,"Day "+S.day+" of "+S.days],e,
["Producer",S.producer,"","Dinner",t12(S.dinner),"Craft services",S.craft],["Director",S.director+" "+S.dirPhone,"","Sunrise",sr,"Sunset",ss],
