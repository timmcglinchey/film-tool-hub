<html lang="en"><head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

:root{--fth-cat:#97a3ff;--fth-accent:#97a3ff;--fth-accent-ink:#97a3ff;--fth-accent-soft:rgba(151,163,255,0.14);--fth-accent-line:rgba(151,163,255,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#585f94;--fth-accent-ink:#585f94;--fth-accent-soft:rgba(151,163,255,0.16);--fth-accent-line:rgba(151,163,255,0.6);--fth-on-accent:#ffffff}
</style>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Lighting Plan Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one-screen workstation. Kit/generic/set/grip palette left, plan centre, inspector + layers right. Road-case stencil wordmark, tungsten amber accent, daylight blue for cameras. */
:root{
  --bg:#E4E7EB; --panel:#F6F7F9; --panel-2:#ECEEF2; --ink:#15181D; --muted:#59616D; --line:#CDD2D9; --line-2:#B9BFC8;
  --accent:#C26E16; --accent-ink:#965009; --accent-soft:#F5E3CC; --cam:#2C61C4; --cam-soft:#DDE7F8; --danger:#B3262D; --ok:#2E7A4E;
  --canvas:#FAFBFC; --grid:#E9ECF0; --grid-major:#D6DBE2; --room:#38404B;
  --sym-ink:#1F242C; --sym-fill:#FFFFFF; --sym-mod:#7A5A2E; --sym-modfill:rgba(194,110,22,.10); --sym-set:#5B6574; --sym-setfill:#E8EBEF;
  --sym-grip:#3E4551; --sym-gripfill:#D8DCE2; --sym-wedge:rgba(44,97,196,.09); --sym-glass:#9CC3E8; --sym-sel:#2C61C4; --sym-green:#5DBB63;
  --shadow:0 10px 30px rgba(20,24,30,.14), 0 2px 6px rgba(20,24,30,.08);
  --font-display:'Saira Stencil One','Archivo',system-ui,sans-serif;
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --panel:#171A1F; --panel-2:#1E2228; --ink:#E5E7EA; --muted:#8D95A1; --line:#2A2F37; --line-2:#3A404A;
  --accent:#E8973A; --accent-ink:#F1B067; --accent-soft:#3A2915; --cam:#7BA3F5; --cam-soft:#1E2A42; --danger:#F06A70; --ok:#5CC48A;
  --canvas:#13161A; --grid:#1B1F25; --grid-major:#262B33; --room:#A9B1BD;
  --sym-ink:#D8DCE2; --sym-fill:#22262D; --sym-mod:#CFA772; --sym-modfill:rgba(232,151,58,.12); --sym-set:#8F99A8; --sym-setfill:#1F232A;
  --sym-grip:#AFB7C3; --sym-gripfill:#2B3038; --sym-wedge:rgba(123,163,245,.11); --sym-glass:#3D6A90; --sym-sel:#7BA3F5; --sym-green:#3E8E45;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1114; --panel:#171A1F; --panel-2:#1E2228; --ink:#E5E7EA; --muted:#8D95A1; --line:#2A2F37; --line-2:#3A404A;
  --accent:#E8973A; --accent-ink:#F1B067; --accent-soft:#3A2915; --cam:#7BA3F5; --cam-soft:#1E2A42; --danger:#F06A70; --ok:#5CC48A;
  --canvas:#13161A; --grid:#1B1F25; --grid-major:#262B33; --room:#A9B1BD;
  --sym-ink:#D8DCE2; --sym-fill:#22262D; --sym-mod:#CFA772; --sym-modfill:rgba(232,151,58,.12); --sym-set:#8F99A8; --sym-setfill:#1F232A;
  --sym-grip:#AFB7C3; --sym-gripfill:#2B3038; --sym-wedge:rgba(123,163,245,.11); --sym-glass:#3D6A90; --sym-sel:#7BA3F5; --sym-green:#3E8E45;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35); color-scheme:dark;}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cam);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding-block:10px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.mark{font-family:var(--font-display);font-size:22px;letter-spacing:.04em;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.proj{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 220px}
.proj input{border:1px solid transparent;background:transparent;font-weight:600;font-size:15px;padding:5px 8px;border-radius:6px;min-width:0;width:100%;max-width:340px;font-stretch:90%}
.proj input:hover{border-color:var(--line)} .proj input:focus{border-color:var(--line-2);background:var(--panel)}
.save{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.save b{font-weight:500;color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg,.tb svg{width:15px;height:15px;flex:none}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.grp{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp-l{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-stretch:80%;padding:0 6px 0 4px;font-weight:600}
.tb{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted)}
.tb:hover{background:var(--panel-2);color:var(--ink)}
.tb:disabled{opacity:.4;cursor:default;background:transparent}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tb.tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 8px;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.mini-sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 4px;font-size:11.5px}
.zoom{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:42px;text-align:center}
.mobile-only{display:none}

/* work area */
.work{display:grid;grid-template-columns:288px minmax(0,1fr) 300px;gap:8px;min-height:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 4px;flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);font-stretch:85%;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.scroll{overflow:auto;min-height:0;flex:1;padding:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);font-stretch:85%;margin:14px 2px 6px}
.sec-h:first-child{margin-top:2px}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:4px 2px 10px}
.search{width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:7px;padding:7px 9px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;text-align:center;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile svg{width:44px;height:44px}
.tile span{font-size:11.5px;line-height:1.2;font-weight:500;overflow-wrap:anywhere}
.krow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);margin-bottom:5px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.krow:hover{border-color:var(--accent)}
.krow svg{width:38px;height:38px}
.krow .nm{font-weight:600;font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.krow .sb{font-size:11px;color:var(--muted);margin-top:2px}
.krow .sb .warn{color:var(--danger);font-weight:600}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.qty button{border:0;background:transparent;width:22px;height:24px;font-size:14px;color:var(--muted)}
.qty button:hover{background:var(--panel-2);color:var(--ink)}
.qty span{font-family:var(--font-mono);font-size:11.5px;min-width:18px;text-align:center}

/* canvas */
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column}
#planWrap{position:relative;flex:1;min-height:0;touch-action:none}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#plan.t-pan{cursor:grab} #plan.t-pan.grabbing{cursor:grabbing} #plan.t-measure,#plan.t-text{cursor:crosshair}
.titleblock{position:absolute;left:10px;bottom:10px;max-width:min(420px,calc(100% - 20px));background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;pointer-events:none;backdrop-filter:blur(4px)}
.titleblock .t1{font-weight:700;font-size:13px;font-stretch:90%}

const ENTRIES={};
const CATALOG=[];
function regEntry(e){ENTRIES[e.id]=e;return e}
function lightDims(type,watts,w,name){
  const W=num(watts);
  switch(type){
    case 'cob':{if(/CS32|XT52|XT26|Evoke 5000|Evoke 2400|MG2400/.test(name||''))return [38,62];if(!W)return [22,36];if(W<=80)return [11,18];if(W<=150)return [13,22];if(W<=350)return [17,28];if(W<=750)return [22,38];if(W<=1500)return [28,46];return [38,62]}
    case 'fresnel':{if(!W)return [18,22];if(W<=200)return [20,24];if(W<=650)return [30,36];return [38,46]}
    case 'hmi':{if(W<=1800)return [34,50];if(W<=4000)return [45,65];return [60,80]}
    case 'openface':return [26,22];
    case 'panel':{const ww=num(w)||60;return [ww,ww>=100?10:8]}
    case 'tube':return [num(w)||120,4];
    case 'mat':return [num(w)||60,3];
    case 'spot':return [12,26];case 'par':return [22,20];case 'bulb':return [7,7];case 'pocket':return [9,3];
    case 'practical':return [35,35];case 'chinaball':return [60,60];case 'balloon':return [150,150];case 'sun':return [60,60];
  }
  const d=LTYPES[type]||LTYPES.cob;return [num(w)||d.w,d.h];
}
function mkLight(id,brand,name,type,sub,watts,w){const [lw,lh]=lightDims(type,watts,w,name);return {id,cat:'light',brand,name,type,sub:sub||'',watts:num(watts),w:lw,h:lh}}
function mkMod(id,brand,name,type,size){const d=MTYPES[type]||MTYPES.softbox;return {id,cat:'modifier',brand,name,type,size:num(size,d.d)}}
function camDims(cls,name){ // [body width, body depth, lens dia, lens length] cm, top-down
  if(/VENICE|ALEXA 35|ALEXA LF|ALEXA 265|AMIRA|URSA|V-RAPTOR \[X\]|VariCam|ETERNA/.test(name||''))return [18,30,11,18];
  if(cls==='Cinema'){if(/KOMODO|PYXIS|Ronin|E2|Mini LF|BURANO|C70|C80|C50|Cinema Camera 6K|Pocket|BGH1|EVA1|ZR|V-RAPTOR/.test(name||''))return [13,15,9,13];return [15,22,10,15]}
  if(cls==='Action')return [7,4,3,1];
  if(cls==='Compact')return [4,4,3,2];
  return [13,8,8,10];
}
function mkCam(id,brand,name,cls,sensor){const [bw,bd,lw,ll]=camDims(cls||'',name);return {id,cat:'camera',brand,name,type:'camera',sub:cls||'',sensor:num(sensor,36),cw:bw,cd:bd,lw,ll,w:bw,h:bd+ll}}

function modGeom(type,D){
  switch(type){
    case 'softbox':return {dep:D*.55,front:D};case 'strip':return {dep:35,front:D};case 'octa':return {dep:D*.45,front:D};
    case 'dome':return {dep:D*.6,front:D};case 'parabolic':return {dep:D*.75,front:D};case 'lantern':return {dep:D,front:D,round:true};
    case 'spacelight':return {dep:D,front:D,round:true};case 'umbrella':return {dep:D*.45,front:D};case 'fresnel':return {dep:Math.max(14,D*.5),front:D};
    case 'projection':return {dep:Math.max(22,D*1.2),front:Math.max(12,D*.5)};case 'reflector':return {dep:20,front:D};case 'grid':return {dep:3,front:0};
    case 'barndoors':return {dep:4,front:0};case 'snoot':return {dep:20,front:8};default:return {dep:20,front:D}
  }
}

    case 'lantern':case 'spacelight':{const cy=y0-D/2;s=`<circle cx="0" cy="${cy}" r="${D/2}" ${fl}/><circle cx="0" cy="${cy}" r="${D*.28}" fill="none" ${st(Pp.mod,.8,'stroke-dasharray="3 3"')}/>`;if(type==='spacelight')s+=`<circle cx="0" cy="${cy}" r="${D/2+6}" fill="none" ${st(Pp.mod,.8)}/>`;break}

    case 'fresnel':s=`<path d="M${-hw} ${y0}L${-HW} ${y0-g.dep*.4}L${-HW} ${y1}L${HW} ${y1}L${HW} ${y0-g.dep*.4}L${hw} ${y0}Z" fill="${Pp.fill}" ${st(Pp.ink)}/><path d="M${-HW+2} ${y1+1}Q0 ${y1-HW*.3} ${HW-2} ${y1+1}" fill="none" ${st(Pp.accent,2)}/>`;break;
    case 'projection':s=`<rect x="${-HW}" y="${y1}" width="${HW*2}" height="${g.dep}" rx="1.5" fill="${Pp.fill}" ${st(Pp.ink)}/><rect x="${-HW-1.5}" y="${y1-2}" width="${HW*2+3}" height="3" rx="1" fill="${Pp.accent}"/>`;break;
    case 'snoot':s=`<rect x="${-HW}" y="${y1}" width="${HW*2}" height="${g.dep}" fill="${Pp.ink}" ${st(Pp.ink)}/>`;break;
    case 'grid':{let l='';const n=Math.max(3,Math.round(fw/10));for(let i=0;i<=n;i++){const x=-hw+fw*i/n;l+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0-4}" ${st(Pp.mod,1)}/>`}s=l+`<line x1="${-hw}" y1="${y0-4}" x2="${hw}" y2="${y0-4}" ${st(Pp.mod,1)}/>`;return {s,y:y0-4,fw}}

addEventListener('keydown',e=>{

  if($('#modalRoot').children.length){if(e.key==='Escape')closeModal();return}
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(typing)return;

  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();return}
  if(mod&&e.key.toLowerCase()==='c'){if(ui.sel.size){e.preventDefault();copySel()}return}
  if(mod&&e.key.toLowerCase()==='x'){if(ui.sel.size){e.preventDefault();copySel(true)}return}

function layerAction(a,id){

  if(a==='add'){const n={id:uid(),name:'Layer '+(Sx.layers.length+1),visible:true,locked:false,kind:'custom'};Sx.layers.push(n);ui.activeLayer=n.id;commit();return}
  if(a==='ilock'){const it=itemById(id);if(it){it.locked=!it.locked;commit()}return}

  else if(a==='del'){if(Sx.layers.length<=1){toast('A setup needs at least one layer.');return}const to=Sx.layers.find(l=>l.id!==L.id);const n=Sx.items.filter(it=>it.layer===L.id).length;Sx.items.forEach(it=>{if(it.layer===L.id)it.layer=to.id});Sx.layers.splice(i,1);if(n)toast(`Moved ${n} item${n>1?'s':''} to “${to.name}”.`)}
  commit();
}

function normalise(p){

      const blank=newSetup('Setup A');p.setups.unshift(blank);p.current=blank.id;

}

  if(downloads){try{const r=await downloads.save({filename,data});if(r&&r.status==='saved')toast('Saved '+filename);return true}catch(err){if(err&&err.code==='declined')return false;if(err&&err.code==='rate_limited'){toast('A save prompt is already open.');return false}}}
  // standalone file opened in a normal browser: plain download
  if(!window.claude||!window.claude.use){try{const blob=data instanceof Blob?data:new Blob([data],{type:kind==='text'?'text/plain;charset=utf-8':'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Downloaded '+filename);return true}catch(e){}}
  // fallback
  if(kind==='text'){showText(filename,typeof data==='string'?data:await data.text(),filename)}
  else if(kind==='image'){const url=URL.createObjectURL(data);openModal(`${mh('Your image')}<div class="modal-b"><p class="hint" style="margin-top:0">Saving files isn't available here. Right-click or long-press the image to save it.</p><img class="preview-img" src="${url}" alt="Exported lighting plan"></div><div class="modal-f"><button class="btn pri" data-close>Done</button></div>`)}
  else toast('Saving files isn’t available in this view. Try opening the page directly in claude.ai.',4200);
  return false;
}
function showText(title,text){openModal(`${mh(esc(title))}<div class="modal-b"><p class="hint" style="margin-top:0">Select all and copy.</p><textarea class="out" readonly>${esc(text)}</textarea></div><div class="modal-f"><button class="btn pri" data-close>Done</button></div>`);setTimeout(()=>{const t=$('textarea.out');t.focus();t.select()},30)}
const exState={fmt:'pdf',scope:'current',setups:new Set(),one:'',incSample:false,legend:true,title:true,kit:true,photos:true,paper:'a4'};
function openExport(){
  {const ns=P.setups.filter(x=>!x.sample);exState.setups=new Set(ns.map(x=>x.id));exState.one=S().sample&&ns[0]?ns[0].id:S().id;exState.incSample=false}
  const r=(name,val,label,desc)=>`<label class="opt"><input type="radio" name="${name}" value="${val}" ${exState[name]===val?'checked':''}><div><b>${label}</b><span>${desc}</span></div></label>`;
  const c=(k,label)=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px"><input type="checkbox" data-ex="${k}" ${exState[k]?'checked':''} style="accent-color:var(--accent)">${label}</label>`;
  openModal(`${mh('Save &amp; export')}<div class="modal-b"><div class="grid2"><div><div class="sec-h" style="margin-top:0">Format</div>
  ${r('fmt','pdf','PDF','Plan pages plus kit list, ready to send round')}${r('fmt','png','PNG image','One setup as a high-res picture')}${r('fmt','svg','SVG','Vector drawing for editing elsewhere')}${r('fmt','csv','Kit list (CSV)','Opens in Excel, Numbers or Sheets')}${r('fmt','json','Project file (.json)','Full backup you can re-open with Projects')}</div>
  <div><div class="sec-h" style="margin-top:0">Options</div><div id="exOpts"></div></div></div></div>
  <div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn pri" id="exGo">Export</button></div>`);
  const opts=()=>{const f=exState.fmt;let h='';
    if(f==='pdf')h+=`<div class="hint" style="margin:0 0 4px">Setups to include</div><div class="exsetups">${P.setups.map(x=>`<label><input type="checkbox" data-exs="${x.id}" ${exState.setups.has(x.id)?'checked':''}>${esc(x.name)}${x.sample?' <span class="tag">Sample</span>':''}</label>`).join('')}</div>`+c('kit','Add kit list page')+c('photos','Add location photos')+`<div class="fld" style="margin-top:8px"><label>Paper</label><select data-ex="paper"><option value="a4" ${exState.paper==='a4'?'selected':''}>A4 landscape</option><option value="a3" ${exState.paper==='a3'?'selected':''}>A3 landscape</option><option value="letter" ${exState.paper==='letter'?'selected':''}>US Letter landscape</option></select></div>`;
    if(f==='png'||f==='svg')h+=fld('Setup',`<select data-ex="one">${P.setups.map(x=>`<option value="${x.id}" ${exState.one===x.id?'selected':''}>${esc(x.name)}${x.sample?' (sample)':''}</option>`).join('')}</select>`);
    if(f==='pdf'||f==='png'||f==='svg')h+=c('legend','Include key (numbered lights & cameras)')+c('title','Include title block')+`<p class="hint">Uses the current Show settings for labels, details, FOV, grip and grid.</p>`;
    if(f==='csv')h+=`<p class="hint">${kitScope==='project'?'Whole project, with the most needed in any one setup.'+(P.setups.some(x=>x.sample)?' Sample setups aren’t included.':''):'Current kit list view.'}</p>`;
    if(f==='json'&&P.setups.some(x=>x.sample))h+=c('incSample','Include the sample setup');
    if(f==='json')h+=`<p class="hint">Includes your setups, shoot info and any custom catalogue items used. Re-open it from Projects → Open project file.</p>`;
    $('#exOpts').innerHTML=h};
  opts();
  $('.modal').addEventListener('change',e=>{const t=e.target;if(t.name==='fmt'){exState.fmt=t.value;opts()}else if(t.name==='scope')exState.scope=t.value;else if(t.dataset.exs){t.checked?exState.setups.add(t.dataset.exs):exState.setups.delete(t.dataset.exs)}else if(t.dataset.ex){exState[t.dataset.ex]=t.type==='checkbox'?t.checked:t.value}});
  $('#exGo').onclick=async()=>{closeModal();toast('Preparing export…',1500);try{await runExport()}catch(err){console.error(err);toast('Export failed: '+(err.message||'unknown error'))}};
}
async function runExport(){
  const f=exState.fmt,base=safeName();
  if(f==='json'){let proj=P;if(!exState.incSample&&P.setups.some(x=>x.sample)&&P.setups.some(x=>!x.sample)){proj=JSON.parse(JSON.stringify(P));proj.setups=proj.setups.filter(x=>!x.sample);if(!proj.setups.find(x=>x.id===proj.current))proj.current=proj.setups[0].id}
    const usedCustom=prefs.custom.filter(c=>proj.setups.some(s=>s.items.some(i=>i.ref===c.id||(i.mods||[]).includes(c.id))));await saveFile(base+'.json',JSON.stringify({format:'lighting-plan-studio',version:1,project:proj,custom:usedCustom,setups:proj.setups},null,1),'text');return}
  if(f==='csv'){await saveFile(base+' - kit list.csv',kitCSV(kitScope==='project'?kitProject():kitFor(P.setups.find(s=>s.id===kitScope)||S())),'text');return}
  const one=P.setups.find(x=>x.id===exState.one)||S();
  if(f==='svg'){const x=buildExport(one,{legend:exState.legend,title:exState.title});await saveFile(base+' - '+one.name+'.svg',x.svg,'text');return}
  if(f==='png'){const x=buildExport(one,{legend:exState.legend,title:exState.title});const c=await svgToCanvas(x.svg,x.W,x.H,1.5);const blob=await new Promise(r=>c.toBlob(r,'image/png'));await saveFile(base+' - '+one.name+'.png',blob,'image');return}
  if(f==='pdf'){
    if(!window.jspdf){toast('The PDF engine didn’t load. Check your connection and reload.');return}
    const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:exState.paper});const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),m=10;
    const setups=P.setups.filter(x=>exState.setups.has(x.id));if(!setups.length){toast('Tick at least one setup to export.');return}let first=true;
    for(const s of setups){const x=buildExport(s,{legend:exState.legend,title:exState.title,planW:2200});const c=await svgToCanvas(x.svg,x.W,x.H,1.2);if(!first)doc.addPage();first=false;
      const r=Math.min((PW-m*2)/x.W,(PH-m*2)/x.H);const w=x.W*r,h=x.H*r;doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',(PW-w)/2,(PH-h)/2,w,h)}
    if(exState.photos){for(const s of setups){for(const ph of (s.photos||[])){try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=photoSrc(ph)});
      const cv=document.createElement('canvas');const r0=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));cv.width=Math.round(img.naturalWidth*r0);cv.height=Math.round(img.naturalHeight*r0);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      doc.addPage();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(20);doc.text(`${s.name} — ${ph.cap||'Location photo'}`,m,m+5);
      const avH=PH-m*2-10,r=Math.min((PW-m*2)/cv.width,avH/cv.height);const w=cv.width*r,h=cv.height*r;doc.addImage(cv.toDataURL('image/jpeg',.88),'JPEG',(PW-w)/2,m+10,w,h)}catch(e){}}}}
    if(exState.kit){const mm=setups.length>1?kitProject(setups):kitFor(setups[0]);const groups=kitRows(mm);doc.addPage();let y=m+8;
      doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text((P.info.production||P.name)+' — kit list',m,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);
      doc.text([setups.length>1?setups.map(x=>x.name).join(', ')+' (most needed in any one setup)':setups[0].name,P.info.date?fmtDate(P.info.date):'',P.info.location].filter(Boolean).join('  ·  '),m,y);y+=8;doc.setTextColor(20);
      const colW=(PW-m*2-10)/2;let col=0;const startY=y;
      const line=(txt,bold,size=10)=>{if(y>PH-m){if(col===0){col=1;y=startY}else{doc.addPage();col=0;y=m+8}}doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);doc.text(txt,m+col*(colW+10),y,{maxWidth:colW});y+=size*0.5+1.5};
      if(!groups.length)line('Nothing on the plan yet.',false);
      for(const g of groups){y+=2;line(g.label.toUpperCase(),true,9);for(const {e,n} of g.rows){const own=prefs.kit[e.id];line(`${n}×   ${e.generic?e.name+' (unspecified)':(e.cat==='grip'?'':e.brand+' ')+e.name}${own&&n>own?`   (have ${own})`:''}`,false)}}
      if(P.info.notes){y+=4;line('NOTES',true,9);line(P.info.notes,false,9)}}
    await saveFile(base+'.pdf',doc.output('blob'),'pdf');
  }
}

/* ============ render all & wiring ============ */
function renderAll(){
  $('#projName').value!==P.name&&document.activeElement!==$('#projName')&&($('#projName').value=P.name);
  renderToolbar();renderLeft();renderRight();renderSetups();renderCanvas();
}
$('#projName').addEventListener('change',e=>{P.name=e.target.value.trim()||'Untitled shoot';delete P.example;commit()});
$('#bLib').onclick=openLibrary;$('#bInfo').onclick=openInfo;$('#bKit').onclick=()=>{kitScope='project';openKit()};$('#bExport').onclick=openExport;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readPal();renderAll()});
new MutationObserver(()=>{readPal();renderAll()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('pointerdown',e=>{if(innerWidth>980)return;const l=$('#left'),r=$('#right');if(!e.target.closest('.side')&&!e.target.closest('.toolbar')&&!e.target.closest('#modalRoot')){l.classList.remove('open');r.classList.remove('open')}},true);

async function connectCloud(){
  if(!window.claude||!window.claude.use)return;
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(!db||!user)return;let id=null;try{id=await user.id()}catch(e){}if(!id)return;
  Store.db=db;Store.uid=id;Store.mode='cloud';
  try{
    const cp=await Store.loadPrefs();
    if(cp){prefs={...prefs,...cp,toggles:{...defaultToggles,...(cp.toggles||{})},kit:{...(cp.kit||{})},custom:cp.custom||[]};if(migrateKit())await Store.savePrefs()}else await Store.savePrefs();
    const cloud=await Store.list();const ids=new Set(cloud.map(c=>c.id));
    for(const meta of (LS.get('lps2:index')||[])){if(!ids.has(meta.id)){const p=LS.get('lps2:p:'+meta.id);if(p&&!(p.example&&cloud.length))await Store.save(p)}}
    const want=prefs.lastProject&&cloud.find(c=>c.id===prefs.lastProject);
    if(want&&want.id!==P.id){const p=await Store.load(want.id);if(p){P=normalise(p);ui.sel.clear();resetHistory();setTimeout(fitView,10)}}
    else if(!want&&cloud.length&&P.example){const newest=cloud.sort((a,b)=>(b.updated||0)-(a.updated||0))[0];const p=await Store.load(newest.id);if(p){P=normalise(p);ui.sel.clear();resetHistory();setTimeout(fitView,10)}}
    else await Store.save(P);
  }catch(e){console.warn(e)}
  setSaveState('saved');renderAll();
}
const DEFAULT_KIT={'c:red-komodo-6k':1,'c:blackmagic-ursa-mini-pro-4-6k-g2':1,'c:canon-eos-c300':1,'c:sony-fx30':1,'c:sony-a7s-iii':1,
  'c:aputure-ls-600c-pro-ii':1,'c:aputure-ls-600d-pro':1,'c:aputure-ls-300x':1,'c:aputure-ls-60x':1,'c:aputure-mc':1,'c:aputure-amaran-300c':1,'c:aputure-amaran-f22c':1,'c:nanlite-pavotube-ii-30c':1,'c:aputure-amaran-ray-60c':1,'c:aputure-amaran-ray-120c':1,'c:godox-vl150':1,
  'c:aputure-light-dome-iii':1,'c:aputure-light-dome-grid':1,'c:aputure-bowens-barndoors':1,'c:aputure-lantern-90':1};
const OLD_DEFAULT_KIT=['c:aputure-ls-600x-pro','c:aputure-amaran-200x-s','c:aputure-light-dome-iii','c:aputure-light-dome-grid','c:aputure-bowens-barndoors','c:aputure-lantern-90','c:nanlite-pavotube-ii-30c','c:nanlite-forza-300b-ii','c:sony-fx6','c:sony-fx3'];
function migrateKit(){if((prefs.kitV||0)>=2)return false;OLD_DEFAULT_KIT.forEach(k=>delete prefs.kit[k]);for(const [k,n] of Object.entries(DEFAULT_KIT))if(!prefs.kit[k])prefs.kit[k]=n;prefs.kitV=2;return true}
function boot(){
  readPal();
  $('#lensList').innerHTML=Object.keys(LENS_SETS).map(n=>`<option value="${esc(n)}">`).join('');
  $('#stopList').innerHTML=STOPS.map(v=>`<option value="${v}">`).join('');
  $('#kList').innerHTML=KELVINS.map(v=>`<option value="${v}">`).join('');
  $('#ratioList').innerHTML=['1:1','1.5:1','2:1','3:1','4:1','6:1','8:1','16:1'].map(v=>`<option value="${v}">`).join('');
  const lp=LS.get('lps2:prefs');
  if(lp)prefs={...prefs,...lp,toggles:{...defaultToggles,...(lp.toggles||{})},kit:lp.kit||{},custom:lp.custom||[]};
  else{prefs.kit={...DEFAULT_KIT};prefs.kitV=2}
  if(migrateKit())persistPrefs(true);
  const last=prefs.lastProject&&LS.get('lps2:p:'+prefs.lastProject);
  P=normalise(last||firstRunProject());resetHistory();
  renderAll();setSaveState('saved');requestAnimationFrame(()=>fitView());
  if(!last)saveNow();
  connectCloud();
}
boot();
