<!doctype html>
<html lang="en">
<head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

:root{--fth-cat:#97a3ff;--fth-accent:#97a3ff;--fth-accent-ink:#97a3ff;--fth-accent-soft:rgba(151,163,255,0.14);--fth-accent-line:rgba(151,163,255,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#585f94;--fth-accent-ink:#585f94;--fth-accent-soft:rgba(151,163,255,0.16);--fth-accent-line:rgba(151,163,255,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>False Colour Studio</title>
<style>
:root{
  --bg:#0f1013; --panel:#16181d; --panel2:#1d2027; --field:#1f2229;
  --line:#272b33; --line2:#383e48;
  --fg:#f0ece5; --muted:#9aa0aa; --faint:#6b717b;
  --accent:#ffb547; --accent-ink:#1a1206; --accent-soft:rgba(255,181,71,.12);
  --good:#7fd6a2; --ok:#ffcf6e; --bad:#ff8f7a;
  --shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f3f0ea; --panel:#ffffff; --panel2:#f4f1ea; --field:#f7f4ee;
  --line:#e3ded4; --line2:#cfc8bb;
  --fg:#16181c; --muted:#565c66; --faint:#878c95;
  --accent:#a35f00; --accent-ink:#ffffff; --accent-soft:rgba(163,95,0,.09);
  --good:#1f8a50; --ok:#9a6400; --bad:#c0392b;
  --shadow:0 14px 30px -16px rgba(70,50,20,.28);
  color-scheme:light;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;padding:18px 20px 48px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:6px}
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:0;font-stretch:72%;font-weight:800;font-size:26px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.proj{flex:1;min-width:180px;max-width:380px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--field);font-size:14px}
.proj::placeholder{color:var(--faint)}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none}
.btn svg{width:15px;height:15px;flex:none}

/* control bar */
.bar{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin:16px 0 18px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.modes button{padding:7px 14px;font-size:13.5px}
.seg.modes button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.seg .n{font:500 11px var(--mono);opacity:.75;margin-left:4px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl>label,.lbl{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl input[type=range]{width:110px;accent-color:var(--accent)}
.kval{font:600 15px var(--mono);min-width:16px;text-align:center}
.vsep{width:1px;height:26px;background:var(--line2)}
.hint{font-size:12.5px;color:var(--muted)}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--field)}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:1050px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 10px;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.stack{display:grid;gap:18px}

/* drop zone */
.drop{display:grid;place-items:center;text-align:center;min-height:52vh;border:1.5px dashed var(--line2);border-radius:16px;background:var(--panel);padding:30px;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{margin:14px 0 6px;font-stretch:80%;font-weight:750;font-size:26px;letter-spacing:-.005em}
.drop p{margin:0 auto;color:var(--muted);max-width:480px}
.drop .chips{display:flex;gap:3px;justify-content:center}
.drop .chips i{width:22px;height:46px;border-radius:5px;display:block}

/* single still stage */
.still{padding:14px}
.stagewrap{background:#000;border-radius:9px;overflow:hidden;display:grid;place-items:center}
.stage{position:relative;max-width:100%;cursor:crosshair;touch-action:none;user-select:none}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .divider{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none;display:none}
.stage .divider::after{content:"";position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.stage .tag{position:absolute;top:8px;padding:3px 7px;border-radius:6px;background:rgba(10,11,13,.72);color:#f0ece5;font:600 10.5px var(--mono);letter-spacing:.05em;display:none;pointer-events:none}
.stage .tag.l{left:8px}.stage .tag.r{right:8px}
.stage.split{cursor:ew-resize}
.stage.split .divider,.stage.split .tag{display:block}
.still .foot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.fname{font:500 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:120px}

/* viewer + IRE strip */
.viewer{display:flex;gap:10px;justify-content:center;align-items:stretch}
.viewer .stagewrap{flex:0 0 auto}
.viewer .stage{width:100%}
.strip{position:relative;width:74px;flex:none;min-height:160px}
.strip .cap{position:absolute;top:0;left:24px;font:600 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.strip .scale{position:absolute;top:20px;bottom:6px;left:0;right:0}
.strip .bar{position:absolute;left:24px;top:0;bottom:0;width:16px;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.strip .bar span{position:absolute;left:0;right:0}
.strip .tk{position:absolute;left:44px;transform:translateY(50%);font:500 10px/1 var(--mono);color:var(--muted);padding-left:7px}
.strip .tk::before{content:"";position:absolute;left:0;top:50%;width:4px;height:1px;background:var(--line2)}
.strip .ptr{position:absolute;left:18px;width:28px;height:0;border-top:2px solid var(--fg);margin-top:-1px;pointer-events:none}
.strip .ptr::before{content:"";position:absolute;left:-5px;top:-6px;border:5px solid transparent;border-left-color:var(--fg)}
.strip .rmk{position:absolute;left:0;transform:translateY(50%);min-width:20px;padding:1px 3px;border-radius:3px;background:var(--c);color:#111;font:700 9px/1.2 var(--mono);text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.strip .rmk::after{content:"";position:absolute;left:100%;top:50%;width:4px;height:1px;background:var(--c)}

/* ratio markers on the image */
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:grid;place-items:center}
.mk i{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 0 1.5px rgba(0,0,0,.75),inset 0 0 0 1.5px rgba(0,0,0,.75)}
.mk i::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.7)}
.mk b{position:absolute;left:100%;margin-left:6px;white-space:nowrap;background:var(--c);color:#111;font:700 10px/1 var(--mono);padding:3px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mk.act i{border-width:3px}

/* ratios panel */
.roles{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roles li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:8px 9px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--panel)}
.roles li:hover{border-color:var(--line2)}
.roles li.act{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--panel2)}
.roles .rchip{width:30px;height:30px;border-radius:8px;background:var(--c);color:#111;display:grid;place-items:center;font:700 11px var(--mono)}
.roles .nm{font-weight:650;font-size:13.5px;min-width:0}
.roles .nm small{display:block;font:400 11.5px var(--mono);color:var(--muted)}
.roles .nm small.warn{color:var(--ok);font-family:var(--display)}
.roles .k{font:500 10.5px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.mctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.hero .lbl{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero b{display:block;font-stretch:72%;font-weight:800;font-size:46px;line-height:1;letter-spacing:-.01em;margin-top:6px}
.hero .why{text-align:right;font-size:12.5px;color:var(--muted);max-width:170px}
.hero .why strong{display:block;font:600 14px var(--mono);color:var(--fg)}
.plist2{list-style:none;margin:6px 0 0;padding:0}
.plist2 li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.plist2 li:first-child{border-top:0}
.plist2 .pn{font-weight:650;font-size:13px}
.plist2 .pn small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.plist2 .pr{font:700 17px var(--mono)}
.plist2 .ps{font:500 11.5px var(--mono);color:var(--muted);min-width:70px;text-align:right}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:600 11px var(--mono)}
.lnk:hover{text-decoration:underline}

/* legend */
.pname{font-stretch:80%;font-weight:750;font-size:18px;margin:-2px 0 8px}
.badge{font:600 9.5px/1 var(--mono);padding:4px 7px;border-radius:5px;letter-spacing:.08em;text-transform:uppercase}
.badge.official{background:rgba(127,214,162,.14);color:var(--good)}
.badge.approx{background:rgba(255,207,110,.14);color:var(--ok)}
.badge.generic,.badge.custom{background:var(--panel2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px;transition:opacity .15s}
.legend li:first-child{border-top:0}
.legend li:hover{background:var(--panel2)}
.legend li.off{opacity:.38}
.legend li.off .chip{background-image:linear-gradient(135deg,transparent 45%,var(--panel) 45% 55%,transparent 55%)!important}
.legend li.rest{cursor:default}.legend li.rest:hover{background:none}
.legend .chip{width:24px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);display:block}
.legend .chip.grey{background:linear-gradient(90deg,#111,#888,#eee)}
.legend .nm{font-weight:650;font-size:13px;min-width:0}
.legend .rg{font:500 11px var(--mono);color:var(--muted);margin-left:4px}
.legend .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.3}
.legend .v{text-align:right;font:600 12.5px var(--mono)}
.legend .v small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.pcbar{height:3px;border-radius:2px;background:var(--line);margin-top:4px;width:64px;margin-left:auto;overflow:hidden}
.pcbar i{display:block;height:100%;background:var(--muted)}
.srcnote{margin:12px 0 0;padding:9px 11px;border-radius:9px;background:var(--panel2);font-size:12px;color:var(--muted);line-height:1.5}
.srcnote b{color:var(--fg);font-weight:650}
.legendfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--faint)}

/* histogram + stats */
.hist{width:100%;height:130px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:9px;padding:8px 10px}
.stat span{display:block;font:600 9.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:600 16px var(--mono);margin-top:4px}

/* custom editor */
.custom{margin:-4px 0 18px}
.ctable{display:grid;gap:6px;margin-top:10px}
.crow{display:grid;grid-template-columns:38px minmax(90px,1fr) 84px 84px minmax(140px,2fr) 30px 30px;gap:6px;align-items:center}
.crow.head{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crow input{height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--field);padding:0 8px;font-size:13px;min-width:0;width:100%}
.crow input[type=color]{padding:2px;cursor:pointer}
.crow input[type=number]{font-family:var(--mono)}
.ibtn{height:30px;width:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;padding:0}
.ibtn:hover{border-color:var(--fg)}
.ibtn svg{width:13px;height:13px}
select.sel{height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--field);padding:0 8px;font-size:12.5px}

/* deck: range chart */
.rchart{display:grid;gap:3px}
.rrow,.raxis{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center}
.raxis .ticks{position:relative;height:16px}
.raxis .ticks span{position:absolute;transform:translateX(-50%);font:500 10px var(--mono);color:var(--faint)}
.raxis .ticks span:first-child{transform:none}.raxis .ticks span:last-child{transform:translateX(-100%)}
.rn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.flag .rn{color:var(--ok)}
.track{position:relative;height:22px;border-radius:5px;background:var(--panel2);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;opacity:.22}
.track .dm{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--muted);opacity:.7}
.track .wh{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--fg);opacity:.75}
.track .bx{position:absolute;top:5px;bottom:5px;border-radius:3px;background:var(--fg);opacity:.55}
.track .md{position:absolute;top:2px;bottom:2px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent)}
.rv{text-align:right;font:600 12.5px var(--mono)}
.rv small{display:block;font-size:10.5px;color:var(--ok);font-weight:500}
.rkey{font-size:11.5px;color:var(--faint);margin-top:8px}

/* consistency */
.ratio .head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px}
.ratio .head h2{margin:0}
.ratio .head p{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:220px}
.score{text-align:right;line-height:1}
.score b{display:block;font-stretch:72%;font-weight:800;font-size:40px;letter-spacing:-.01em}
.score span{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score.good b{color:var(--good)}.score.ok b{color:var(--ok)}.score.bad b{color:var(--bad)}.score.na b{color:var(--faint)}
.facts{list-style:none;margin:10px 0 0;padding:0}
.facts li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.facts li b{font-weight:650}
.facts li span{font:500 12.5px var(--mono);text-align:right}
.facts li span small{display:block;font-size:10.5px;color:var(--muted)}
.verdict{margin:12px 0 0;padding:9px 11px;border-radius:9px;background:var(--panel2);font-size:12.5px}

/* deck cards */
.deckhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px}
.deckhead h3{margin:0;font-stretch:80%;font-weight:750;font-size:19px}
.deckhead .hint{flex:1;min-width:200px}
.grid{display:grid;gap:12px}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:opacity .2s,border-color .2s}
.ref.flag{border-color:var(--ok)}
.ref .thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:crosshair}
.ref .thumb canvas{width:100%;height:100%;object-fit:contain;display:block}
.ref.off .thumb canvas{opacity:.28;filter:grayscale(1)}
.ref.off .mini{opacity:.35}
.ref.off{border-style:dashed}
.inc{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 6px;border-radius:7px;border:0;background:rgba(10,11,13,.72);color:#f0ece5;font:600 11px var(--mono);backdrop-filter:blur(6px)}
.inc .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid #f0ece5;display:grid;place-items:center}
.inc .bx svg{width:11px;height:11px}
.ref:not(.off) .inc .bx{background:#ffb547;border-color:#ffb547;color:#1a1206}
.ref.off .inc .bx svg{display:none}
.rm{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:7px;border:0;background:rgba(10,11,13,.72);color:#f0ece5;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.ref:hover .rm,.rm:focus-visible{opacity:1}
.rm svg{width:13px;height:13px}
.ref .meta{padding:8px 10px 10px}
.ref .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;height:9px;border-radius:3px;overflow:hidden;margin-top:6px;background:#777}
.mini span{display:block}
.ref .sc{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font:500 11px var(--mono);color:var(--muted)}
.ref .sc .fl{color:var(--ok)}
.addtile{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line2);border-radius:12px;min-height:160px;background:none;color:var(--muted);padding:16px}
.addtile:hover{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.addtile b{display:block;font-size:14px;color:var(--fg);margin-top:6px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* overlay, spot meter, toast */
#dragOv{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,11,13,.6);backdrop-filter:blur(3px);pointer-events:none}
#dragOv div{border:2px dashed var(--accent);border-radius:18px;padding:34px 46px;background:var(--panel);font-stretch:80%;font-weight:750;font-size:22px}
#spot{position:fixed;z-index:50;pointer-events:none;background:rgba(10,11,13,.88);color:#f0ece5;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.35;box-shadow:var(--shadow);max-width:260px;backdrop-filter:blur(6px)}
#spot b{font:600 15px var(--mono)}
#spot .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
#spot small{display:block;color:#a9aeb7}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:all .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═════ Film Tool Hub kit mapping ═════ */
:root:root:root{--bg:var(--fth-bg);--panel:var(--fth-surface);--panel2:var(--fth-surface2);--field:var(--fth-bg2);--line:var(--fth-line);--line2:var(--fth-line2);--fg:var(--fth-text);--muted:var(--fth-muted);--faint:var(--fth-faint);--accent:var(--fth-accent);--accent-ink:var(--fth-on-accent);--accent-soft:var(--fth-accent-soft);--good:var(--fth-good);--ok:var(--fth-warn);--bad:var(--fth-bad);--shadow:var(--fth-shadow);--display:var(--fth-display);--mono:var(--fth-mono);}
.fth-head .proj{flex:1;min-width:180px;max-width:380px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--fth-line2);background:var(--fth-bg2);font-size:14px;color:var(--fth-text);outline:none}
.fth-head .proj:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
.fth-head .fth-btn svg{width:15px;height:15px;flex:none}
.app{padding-top:16px}

</style>
</head>
<body>
<header class="fth-head">
  <div class="fth-id"><span class="fth-eyebrow" data-fth-cat>05 · Visual Planning</span><h1 class="fth-title">False Colour Studio</h1></div>
  <span class="fth-vsep"></span><input id="proj" class="proj" placeholder="Project title (used on exports)" aria-label="Project title">
  <div class="fth-actions">
      <button class="fth-btn" id="openBtn" title="Open a saved .json project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V18a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9a1.5 1.5 0 0 0-1.5-1.5H12L10 5H4.5A1.5 1.5 0 0 0 3 6.5z"/></svg>Open .json</button>
      <button class="fth-btn" id="saveBtn" title="Save stills, chart and settings as a .json project file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M4.5 19.5h15"/></svg>Download .json</button>
      <button class="fth-btn primary" id="pdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 13h6M9 16.5h4"/></svg><span id="pdfLbl">Export PDF</span></button>
    </div>
</header>
<div class="app">
  

  <div class="bar">
    <div class="seg modes" role="tablist">
      <button data-mode="single" role="tab">Single still</button>
      <button data-mode="deck" role="tab">Compare stills<span class="n" id="deckN"></span></button>
      <button data-mode="ratios" role="tab">Ratios</button>
    </div>
    <div class="vsep"></div>
    <div class="ctl"><span class="lbl">Chart</span><div class="seg" id="presetSeg"></div></div>
    <div class="vsep"></div>
    <div class="ctl"><span class="lbl">Levels</span>
      <div class="seg" id="levelSeg">
        <button data-levels="full" title="8-bit 0–255 reads as 0–100%. Right for JPEG/PNG stills and most frame grabs.">Full</button>
        <button data-levels="legal" title="16–235 reads as 0–100%. Use for stills exported from video without range conversion (milky blacks).">Legal</button>
      </div></div>
    <div class="vsep"></div>
    <div class="ctl"><span class="lbl">View</span>
      <div class="seg" id="viewSeg">
        <button data-view="fc">False colour</button>
        <button data-view="orig">Original</button>
        <button data-view="split" id="splitBtn" title="Drag across the image to move the split">Split</button>
      </div></div>
    <div class="ctl" id="colsCtl"><label for="cols">Columns</label><input type="range" id="cols" min="1" max="6" step="1" value="3"><span class="kval" id="colsVal">3</span></div>
    <span class="hint">Hold <kbd>Space</kbd> to peek at the original.</span>
  </div>

  <section id="customBox" class="card custom" hidden></section>
  <main id="main"></main>
</div>

<div id="dragOv" hidden><div id="dragTxt">Drop to add</div></div>
<div id="spot" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ───────────── charts ─────────────
   Levels are % of signal (0 = black, 100 = white). A band matches when lo ≤ level ≤ hi; bands are
   checked top to bottom and the first match wins. Anything that matches no band shows as greyscale. */
const B = (n, m, lo, hi, c, r) => ({ n, m, lo, hi, c, r });
const PRESETS = [
  { id: 'arri', label: 'ARRI', name: 'ARRI ALEXA', src: 'official',
    cite: 'ARRI ALEXA, ALEXA Mini and ALEXA Mini LF user manuals (False Color).',
    sig: 'ARRI tints six ranges and shows the rest in black and white, calculated on whatever signal the output carries (Rec 709 or LogC).',
    bands: [
      B('Red', 'White clipping', 99, 200, '#ff2b1f', '99–100%'),
      B('Yellow', 'Just below white clipping', 97, 99, '#ffe41a', '97–99%'),
      B('Pink', 'One stop over 18% grey (light skin)', 52, 56, '#ff6ec7', '52–56%'),
      B('Green', '18% medium grey', 38, 42, '#34c83c', '38–42%'),
      B('Blue', 'Just above black clipping', 2.5, 4, '#2b6dff', '2.5–4%'),
      B('Purple', 'Black clipping', -100, 2.5, '#8a36d8', '0–2.5%')] },
  { id: 'red', label: 'RED', name: 'RED · Video mode', src: 'official',
    cite: 'RED operation guides (DSMC2, RANGER, KOMODO/V-RAPTOR), False Color: Video mode.',
    sig: 'Based on the RGB levels of the video (monitor) path, the cooked look rather than RAW. RED quotes whole IRE numbers, so band edges sit halfway between them.',
    bands: [
      B('Red', 'Untextured white', 98.5, 200, '#ff2020', 'IRE 99–100'),
      B('Orange', 'Strong highlight, closest to white', 95.5, 98.5, '#ff8a00', 'IRE 96–98'),
      B('Yellow', 'Strong highlight', 93.5, 95.5, '#ffe100', 'IRE 94–95'),
      B('Straw', 'Strong highlight', 91.5, 93.5, '#e3cf8c', 'IRE 92–93'),
      B('Pink', 'Typical light skin', 60.5, 70.5, '#ff7fc8', 'IRE 61–70'),
      B('Green', '18% grey', 40.5, 48.5, '#2ec33d', 'IRE 41–48'),
      B('Teal', 'Deep shadow', 9.5, 12.5, '#139c9c', 'IRE 10–12'),
      B('Blue', 'On the verge of untextured black', 4.5, 5.5, '#2d5bff', 'IRE 5'),
      B('Purple', 'Untextured black', -100, 4.5, '#8b2fd1', 'IRE 0–4')] },
  { id: 'bmd', label: 'Blackmagic', name: 'Blackmagic Design', src: 'approx',
    cite: 'Colours and meanings from Blackmagic camera manuals (Pocket, Cinema Camera, URSA). Blackmagic shows the cut-off levels only on the camera’s on-screen chart, so these edges are approximate.',
    sig: 'Mid grey uses Blackmagic’s 38.4% figure for Film gamma, with pink one stop above. Check against your camera’s chart and fine-tune with Custom if needed.',
    bands: [
      B('Red', 'White clipping (95% WC)', 95, 200, '#ff2b1f', '≥95%'),
      B('Yellow', 'Near white clipping', 90, 95, '#ffe41a', '~90–95%'),
      B('Pink', 'One stop over middle grey (lighter skin)', 46.4, 50.4, '#ff6ec7', '~48% (MG+1)'),
      B('Green', '18% middle grey (darker skin)', 36.4, 40.4, '#34c83c', '~38.4% (18% MG)'),
      B('Blue', 'Near black detail loss', 2.5, 5, '#2b6dff', '~2.5–5% (NBDL)'),
      B('Purple', 'Black detail loss', -100, 2.5, '#8a36d8', '<2.5% (BDL)')] },
  { id: 'sony', label: 'Sony', name: 'Sony VENICE 2 · S-Log3 preset', src: 'official',
    cite: 'Sony VENICE 2 operating instructions, False Color Display (S-Log3 default levels).',
    sig: 'Sony’s levels are for an S-Log3 signal, so use this on ungraded S-Log3 frame grabs. Sony lists levels only; descriptions other than the grey references are ours.',
    bands: [
      B('Red', 'Near S-Log3 clip', 93.4, 96.1, '#ff2020', '93.4–96.1%'),
      B('Yellow', 'Bright highlights', 91.3, 93.4, '#ffe100', '91.3–93.4%'),
      B('Orange', 'Highlights', 87.7, 90.6, '#ff8c1a', '87.7–90.6%'),
      B('Pink', 'Bright mid-tones', 54.3, 58.0, '#ff5fb8', '54.3–58.0%'),
      B('Light pink', '18% grey + 1 stop', 47.8, 50.8, '#ffb3dc', '47.8–50.8%'),
      B('Cyan', 'Between grey and +1 stop', 43.8, 46.5, '#20d9e6', '43.8–46.5%'),
      B('Green', '18% grey', 38.9, 42.2, '#2fbf3a', '38.9–42.2%'),
      B('Light blue', 'Lower mid-tones', 24.6, 34.4, '#7fb6ff', '24.6–34.4%'),
      B('Blue', 'Near black', 3.5, 5.6, '#2a55ff', '3.5–5.6%'),
      B('Purple', 'Black', -100, 3.5, '#8b2fd1', '−7.3–3.5%')] },
  { id: 'stops', label: 'Stops', name: 'Stops from 18% grey', src: 'generic',
    cite: 'Worked out from the encoding curve, not a manufacturer chart.',
    get sig() { return `Each band is one stop wide, centred on whole stops from 18% grey, with edges calculated from the ${CURVES[state.curve].n} curve (change it in Ratios). On Rec 709, grey sits near 41% and the image clips about 2½ stops over, so the bright stops are narrow. Read stops on graded stills as approximate, because a grade bends the curve.`; },
    get bands() { return stopBands(); } },
  { id: 'zones', label: 'Zones', name: 'Ten zones', src: 'generic',
    cite: 'Not a manufacturer chart.',
    sig: 'Colours every 10% of signal so nothing stays grey. Useful for seeing where the bulk of each still sits.',
    bands: [
      B('90–100', 'Brightest highlights', 90, 200, '#e8202a'), B('80–90', 'Highlights', 80, 90, '#ff6a1a'),
      B('70–80', 'Upper mid-tones', 70, 80, '#ffa31a'), B('60–70', 'Upper mid-tones', 60, 70, '#ffd21f'),
      B('50–60', 'Mid-tones', 50, 60, '#9ad02b'), B('40–50', 'Mid-tones', 40, 50, '#2fbf4a'),
      B('30–40', 'Lower mid-tones', 30, 40, '#18b5b5'), B('20–30', 'Shadows', 20, 30, '#1f86d9'),
      B('10–20', 'Deep shadows', 10, 20, '#2b3fbf'), B('0–10', 'Near black', -100, 10, '#3b1a78')] },
  { id: 'custom', label: 'Custom', name: 'Custom chart', src: 'custom',
    cite: 'Your own bands.', sig: 'Edit them in the panel above. They’re saved with the project.' }
];
const BADGE = { official: 'Official', approx: 'Approximate', generic: 'Generic', custom: 'Custom' };
const clone = o => JSON.parse(JSON.stringify(o));

/* ───────────── state ───────────── */
const state = { mode: 'single', preset: 'arri', levels: 'full', view: 'fc', cols: 3, order: 'added', split: 50,
  single: null, deck: [], custom: clone(PRESETS[0].bands), hidden: new Set(), peek: false,
  role: 'key', sample: 'small', curve: 'rec709' };

/* ───────────── ratios ─────────────
   Each reading averages the signal over a small disc, converts it back to linear light with the chosen
   curve, and compares readings in stops (each stop doubles the light). */
const ROLES = [
  { id: 'key', n: 'Key', s: 'K', c: '#ffb547' },
  { id: 'fill', n: 'Fill', s: 'F', c: '#5ab0ff' },
  { id: 'back', n: 'Backlight', s: 'B', c: '#c9a7ff' },
  { id: 'bg', n: 'Background', s: 'BG', c: '#7fd6a2' }];
const PAIRS = [
  ['key', 'fill', 'Key : Fill', 'Contrast across the subject'],

        row.forEach((it, c) => { const [iw, ih] = sizes[c]; doc.addImage(fcUrl(it, 'thumb'), 'JPEG', PM + (gw - rowW) / 2 + c * (best.cw + gap) + (best.cw - iw) / 2, ry + (rh - ih) / 2, iw, ih, undefined, 'FAST'); });
        ry += rh + gap;
      }
      let y = ry + 3; doc.setDrawColor(...RULE); doc.line(PM, y, PW - PM, y);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); const sc = A.score == null ? MUTED : A.score >= 80 ? [31, 138, 80] : A.score >= 60 ? [154, 100, 0] : [192, 57, 43];
      doc.setTextColor(...sc); doc.text(A.score == null ? '-' : A.score + '%', PM, y + 8);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.6); doc.setTextColor(...INK);
      const [m0, m1] = A.ext('p50'), [s0, s1] = A.ext('p5'), [h0, h1] = A.ext('p95');
      doc.text(T(`Consistency: ${scoreLbl(A.score)}   ·   Median ${Math.round(m0)}–${Math.round(m1)}%   ·   Shadows (P5) ${Math.round(s0)}–${Math.round(s1)}%   ·   Highlights (P95) ${Math.round(h0)}–${Math.round(h1)}%`), PM + 16, y + 5.5);
      doc.setTextColor(...MUTED); doc.text(clipText(doc, verdictText(A).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>'), PW - 2 * PM - 16), PM + 16, y + 10);
      // range chart pages
      chunks.forEach((ch, ci) => {
        doc.addPage(); pg++;
        const t2 = pdfHeader(doc, 'Exposure spread', `${T0}  ·  line 5th–95th percentile, box middle 50%, orange median, dashed set median`, `Page ${pg} of ${total}`);
        const yEnd = pdfRangeRows(doc, ch, A.deckMed, t2 + 3);
        if (ci === chunks.length - 1 && !legendOwnPage) { doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text('CHART ACROSS THE SET  ·  average share (range across stills)', PM, yEnd + 7); pdfLegend(doc, A.avg, A.restAvg, PM, yEnd + 13, PW - 2 * PM, A.rng); }
      });
      if (legendOwnPage) { doc.addPage(); pg++; const t3 = pdfHeader(doc, 'Chart across the set', T0, `Page ${pg} of ${total}`); pdfLegend(doc, A.avg, A.restAvg, PM, t3 + 4, PW - 2 * PM, A.rng); }
      list.forEach((it, i) => { doc.addPage(); pg++; pdfStillPage(doc, it, it.name, `Still ${i + 1} of ${inc.length}  ·  ${T0}  ·  ${subLine()}`, `Page ${pg} of ${total}`); });
      doc.save(slug(T0) + '-false-colour.pdf');
    }
    toast('PDF exported');
  } catch (e) { console.error(e); toast('Something went wrong building the PDF.', 4000); }
};

renderCustom();
render();
</script>
