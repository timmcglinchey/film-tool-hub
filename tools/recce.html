<!DOCTYPE html>
<html lang="en"><head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

/* "Save to Documentation" buttons stay hidden until the hub switches them on (window.fthDocs.attach) */
[data-fth-doc][hidden]{display:none!important}

:root{--fth-cat:#4fc7b5;--fth-accent:#4fc7b5;--fth-accent-ink:#4fc7b5;--fth-accent-soft:rgba(79,199,181,0.14);--fth-accent-line:rgba(79,199,181,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#2e7369;--fth-accent-ink:#2e7369;--fth-accent-soft:rgba(79,199,181,0.16);--fth-accent-line:rgba(79,199,181,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>

<meta charset="utf-8"><title>Location Recce</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--fth-display);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(420px,47%) 1fr}
.ed{padding:0 22px 60px;border-right:1px solid var(--fth-line);overflow:auto;position:relative}
.pvw{padding:0 24px 40px;overflow:auto}
.status{font:500 11px var(--fth-mono);letter-spacing:.04em;color:var(--fth-faint);white-space:nowrap}
.intro{color:var(--fth-muted);margin:16px 0 12px;font-size:13.5px;max-width:64ch}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.how .fth-card{padding:12px 14px}
.how b{display:block;font:700 13px/1.2 var(--fth-display);text-transform:uppercase;letter-spacing:.03em;font-variation-settings:"wdth" 82;margin-bottom:4px}
.how b small{font:500 10px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.1em;margin-right:6px}
.how p{margin:0;color:var(--fth-muted);font-size:12.5px;line-height:1.45}
.how p b{display:inline;font:inherit;font-weight:700;color:var(--fth-text);text-transform:none;letter-spacing:0;margin:0}
.kit{margin:0 0 14px}.kit summary{cursor:pointer;font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.kit ul{margin:8px 0 0;padding-left:18px;color:var(--fth-muted);font-size:12.5px;columns:2;column-gap:24px}
/* location bar */
.locbar{padding:12px 14px;margin:0 0 4px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:end}
.locbar .lbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.locbar .prod{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px;border-top:1px solid var(--fth-line)}
.locsel{display:flex;flex-direction:column;gap:5px;min-width:0}
.stdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px;margin-right:6px}
/* section nav */
.snav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0 9px;margin:0 -22px;padding-left:22px;padding-right:22px;
  background:color-mix(in srgb,var(--fth-bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--fth-line)}
.snav::-webkit-scrollbar{display:none}
.snav a{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--fth-line2);color:var(--fth-muted);font:500 12px var(--fth-display);text-decoration:none;white-space:nowrap}
.snav a:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.snav a i{font:600 10px var(--fth-mono);font-style:normal;color:var(--fth-accent-ink)}
.snav a.done{border-color:var(--fth-accent-line)}
.snav a.off{opacity:.45;text-decoration:line-through}
/* sections */
.sec{scroll-margin-top:56px}
.sh{cursor:pointer;user-select:none}
.sh .pg{font:500 10.5px var(--fth-mono);color:var(--fth-faint);letter-spacing:.04em;text-transform:none}
.sh .tg{margin-left:auto;order:3}
.sh::after{order:2}
.sh .car{order:4;width:14px;color:var(--fth-faint);transition:transform .15s;font-size:11px}
.sec.shut .car{transform:rotate(-90deg)}
.sec.shut .sb{display:none}
.sec.off .sh{opacity:.55}
.prt{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--fth-line2);background:none;color:var(--fth-muted);font:500 10px var(--fth-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.prt:hover{border-color:var(--fth-line3);color:var(--fth-text)}
.sec.off .prt{color:var(--fth-bad);border-color:color-mix(in srgb,var(--fth-bad) 40%,transparent)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.g .w{grid-column:1/-1}
.ed label{display:flex;align-items:center;margin-bottom:5px;font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
textarea.fth-input{min-height:60px}
.tip{display:none;margin:2px 0 8px}.tip.on{display:block}
.sectip{margin:0 0 12px}
.fth-sec .fth-info{margin-left:0}
.cg{margin-top:16px}
.cgh{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);margin:0 0 6px}
.ckl{border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-bg2);overflow:hidden}
.ckr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--fth-line);font-size:13.5px}
.ckr:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--fth-line2);border-radius:7px;overflow:hidden;flex:none;background:var(--fth-surface)}
.seg button{height:26px;min-width:36px;padding:0 8px;border:0;border-left:1px solid var(--fth-line2);background:none;color:var(--fth-muted);font:600 11px var(--fth-mono);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--fth-text);background:var(--fth-surface2)}
.seg button.on[data-v=y]{background:color-mix(in srgb,var(--fth-good) 22%,transparent);color:var(--fth-good)}
.seg button.on[data-v=n]{background:color-mix(in srgb,var(--fth-bad) 20%,transparent);color:var(--fth-bad)}
.seg button.on[data-v=na],.seg button.on.sv{background:var(--fth-accent-soft);color:var(--fth-accent-ink)}
.tks{display:flex;flex-wrap:wrap;gap:6px}
.tks button{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-muted);font-size:13px;cursor:pointer}
.tks button:hover{color:var(--fth-text);border-color:var(--fth-line3)}
.tks button.on{background:var(--fth-accent-soft);border-color:var(--fth-accent);color:var(--fth-text)}
.tks button.on::before{content:"✓ ";color:var(--fth-accent-ink);font-weight:700}
.sub{color:var(--fth-muted);font-size:12.5px;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lnk{color:var(--fth-accent-ink);font-size:12.5px;text-decoration:none}.lnk:hover{text-decoration:underline}
/* sun */
.sunw{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-top:14px;padding:14px;border:1px solid var(--fth-line);border-radius:12px;background:var(--fth-bg2)}
.sunw svg{width:100%;height:auto}
.sunsvg .ring{fill:none;stroke:var(--fth-line2)}.sunsvg .hz{fill:none;stroke:var(--fth-line3);stroke-width:1.2}
.sunsvg .ax{stroke:var(--fth-line2)}.sunsvg text{fill:var(--fth-muted);font:600 10px var(--fth-mono)}
.sunsvg .path{fill:none;stroke:var(--fth-warn);stroke-width:2.4;stroke-linecap:round}
.sunsvg .hr{fill:var(--fth-warn)}.sunsvg .hrt{fill:var(--fth-faint);font-size:7.5px}
.sunsvg .rs{fill:var(--fth-bg2);stroke:var(--fth-warn);stroke-width:1.6}
.sunsvg .dir{stroke:var(--fth-accent);stroke-width:1.8;stroke-dasharray:4 3}.sunsvg .dirh{fill:var(--fth-accent)}.sunsvg .dirt{fill:var(--fth-accent-ink);font-size:8.5px}
.sunsvg .now{fill:var(--fth-warn);stroke:var(--fth-bg2);stroke-width:2}
.st{width:100%;border-collapse:collapse;font-size:12.5px}
.st td{padding:4px 0;border-bottom:1px solid var(--fth-line)}.st td:last-child{text-align:right;font-family:var(--fth-mono);font-size:12px}
.st tr:last-child td{border-bottom:0}
.sunh{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);margin-bottom:6px}
.dirs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dirs .dr{display:grid;grid-template-columns:1fr 140px 30px;gap:6px}
.winsun{margin-top:8px;font-size:12.5px;color:var(--fth-text)}.winsun div{padding:2px 0}.winsun b{color:var(--fth-accent-ink);font-weight:600}
/* photos */
.drop{border:1.5px dashed var(--fth-line3);border-radius:12px;padding:14px;text-align:center;color:var(--fth-muted);font-size:13px;background:var(--fth-bg2)}
.drop.over{border-color:var(--fth-accent);background:var(--fth-accent-soft)}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.phc{border:1px solid var(--fth-line);border-radius:11px;overflow:hidden;background:var(--fth-surface);display:flex;flex-direction:column}
.phc .im{position:relative;aspect-ratio:3/2;background:#000}
.phc img{width:100%;height:100%;object-fit:cover;display:block}
.phc .n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font:600 10px var(--fth-mono);padding:2px 6px;border-radius:5px}
.phc .del{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:6px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
.phc .del:hover{background:#c0392b}
.phc .mv{position:absolute;right:33px;top:5px;display:flex;gap:3px}.phc .mv button{width:24px;height:24px;border-radius:6px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px}
.phc .fl{padding:7px;display:flex;flex-direction:column;gap:5px}
.phc .fl .fth-input{padding:5px 7px;font-size:12.5px}
.phc .fl .two{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sk{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sk img{max-height:110px;border-radius:9px;border:1px solid var(--fth-line2)}
/* verdict */
.scs{display:flex;flex-direction:column;gap:6px}
.scr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.avg{display:flex;align-items:baseline;gap:10px;margin:12px 0 0;padding:12px 14px;border-radius:11px;background:var(--fth-accent-soft);border:1px solid var(--fth-accent-line)}
.avg b{font:800 28px/1 var(--fth-display);font-variation-settings:"wdth" 70}.avg span{color:var(--fth-muted);font-size:12.5px}
.acts{display:flex;flex-direction:column;gap:6px}

/* ───────── photos (IndexedDB, so they don't fill up the small text store) ───────── */
const IMG=new Map();let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const q=indexedDB.open("fth-recce",1);q.onupgradeneeded=()=>q.result.createObjectStore("img");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function itx(mode,fn){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction("img",mode),r=fn(t.objectStore("img"));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)}))}
const putImg=(id,blob)=>itx("readwrite",s=>s.put(blob,id)).then(()=>{IMG.set(id,URL.createObjectURL(blob))});
const delImg=id=>{const u=IMG.get(id);if(u)URL.revokeObjectURL(u);IMG.delete(id);return itx("readwrite",s=>s.delete(id)).catch(()=>{})};
async function loadImgs(){try{const d=await db();await new Promise(res=>{const t=d.transaction("img"),c=t.objectStore("img").openCursor();c.onsuccess=e=>{const k=e.target.result;if(k){if(k.value instanceof Blob)IMG.set(k.key,URL.createObjectURL(k.value));k.continue()}};t.oncomplete=res;t.onerror=res})}catch(e){}}
function shrink(file,max=1600){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function addPhotos(files){const R=cur();let n=0;for(const f of files){if(!/^image\//.test(f.type))continue;try{const b=await shrink(f),id="p"+uid();await putImg(id,b);R.photos.push({id,cap:"",tag:"",dir:""});n++}catch(e){}}
  if(n){persist();renderSpecial("photos");prevSoon();toast(n+" photo"+(n>1?"s":"")+" added")}else toast("Couldn't read those files as images")}

/* ───────── sun (NOAA-style approximation, accurate to a minute or two) ───────── */
const RAD=Math.PI/180;
function sunAt(ms,lat,lng){const d=ms/864e5-10957.5,g=(357.529+.98560028*d)*RAD,q=280.459+.98564736*d,L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*RAD,e=(23.439-3.6e-7*d)*RAD;

  const el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H)),az=(Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(la)-Math.tan(dec)*Math.cos(la))/RAD+540)%360;
  return{el:el/RAD,az}}
const hhmm=ms=>ms==null?"–":new Date(ms).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const adiff=(a,b)=>{const d=Math.abs(((a-b)%360+360)%360);return d>180?360-d:d};
function sunDay(ds,lat,lng){if(!ds||!isFinite(lat)||!isFinite(lng))return null;const[y,m,d]=ds.split("-").map(Number);if(!y)return null;const t0=new Date(y,m-1,d).getTime(),st=2*6e4,P=[];
  for(let t=t0;t<=t0+864e5;t+=st)P.push({t,...sunAt(t,lat,lng)});
  const cross=(th,up)=>{for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];if(up?(a.el<th&&b.el>=th):(a.el>=th&&b.el<th)){const k=(th-a.el)/(b.el-a.el);return{t:a.t+k*(b.t-a.t),az:a.az+(((b.az-a.az+540)%360)-180)*k}}}return null};
  let hi=P[0];P.forEach(p=>{if(p.el>hi.el)hi=p});
  return{P,t0,lat,lng,rise:cross(-.833,1),set:cross(-.833,0),dawn:cross(-6,1),dusk:cross(-6,0),gAm:[cross(-4,1),cross(6,1)],gPm:[cross(6,0),cross(-4,0)],noon:hi,max:hi.el}}
function windowSun(D,bearing){if(!D||bearing===""||bearing==null)return null;const b=+bearing,out=[];let s=null;
  D.P.forEach(p=>{const on=p.el>0&&adiff(p.az,b)<80;if(on&&s==null)s=p.t;if(!on&&s!=null){out.push([s,p.t]);s=null}});if(s!=null)out.push([s,D.P[D.P.length-1].t]);return out}
function sunSVG(D,dirs,nowMs){const c=110,R=88,pt=(az,el)=>{const r=R*(90-Math.max(el,0))/90;return[c+r*Math.sin(az*RAD),c-r*Math.cos(az*RAD)]};
  let s=`<svg class="sunsvg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg"><circle class="ring" cx="${c}" cy="${c}" r="${R*2/3}"/><circle class="ring" cx="${c}" cy="${c}" r="${R/3}"/><line class="ax" x1="${c}" y1="${c-R}" x2="${c}" y2="${c+R}"/><line class="ax" x1="${c-R}" y1="${c}" x2="${c+R}" y2="${c}"/><circle class="hz" cx="${c}" cy="${c}" r="${R}"/>`;
  s+=`<text x="${c}" y="${c-R-6}" text-anchor="middle">N</text><text x="${c+R+7}" y="${c+3.5}" text-anchor="start">E</text><text x="${c}" y="${c+R+14}" text-anchor="middle">S</text><text x="${c-R-7}" y="${c+3.5}" text-anchor="end">W</text>`;
  (dirs||[]).forEach(d=>{if(d.d===""||d.d==null)return;const a=+d.d*RAD,x=c+R*Math.sin(a),y=c-R*Math.cos(a),hx=c+(R-7)*Math.sin(a),hy=c-(R-7)*Math.cos(a),px=Math.cos(a)*4,py=Math.sin(a)*4,lx=c+(R*.62)*Math.sin(a),ly=c-(R*.62)*Math.cos(a);
    s+=`<line class="dir" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/><path class="dirh" d="M${x} ${y}L${hx+px} ${hy+py}L${hx-px} ${hy-py}Z"/><text class="dirt" x="${lx+(Math.cos(a)*8)}" y="${ly+(Math.sin(a)*8)+3}" text-anchor="middle">${esc((d.l||"").slice(0,16))}</text>`});
  if(D){const up=D.P.filter((p,i)=>i%5===0&&p.el>0).map(p=>pt(p.az,p.el).map(v=>v.toFixed(1)).join(","));if(up.length>1)s+=`<polyline class="path" points="${up.join(" ")}"/>`;
    for(let h=1;h<24;h++){const p=D.P[h*30];if(p&&p.el>0){const[x,y]=pt(p.az,p.el);s+=`<circle class="hr" cx="${x}" cy="${y}" r="2.1"/>`;if(h%2===0)s+=`<text class="hrt" x="${x}" y="${y-5}" text-anchor="middle">${h}</text>`}}
    [D.rise,D.set].forEach(e=>{if(e){const[x,y]=pt(e.az,0);s+=`<circle class="rs" cx="${x}" cy="${y}" r="4"/>`}});
    if(nowMs&&nowMs>=D.t0&&nowMs<D.t0+864e5){const p=sunAt(nowMs,D.lat,D.lng);if(p.el>0){const[x,y]=pt(p.az,p.el);s+=`<circle class="now" cx="${x}" cy="${y}" r="5"/>`}}}
  return s+"</svg>"}
function sunRows(D){return[["Light from (civil dawn)",hhmm(D.dawn&&D.dawn.t)],["Sunrise"+(D.rise?" · "+ptOf(D.rise.az):""),hhmm(D.rise&&D.rise.t)],["Morning golden hour",D.gAm[0]||D.gAm[1]?hhmm(D.gAm[0]&&D.gAm[0].t)+"–"+hhmm(D.gAm[1]&&D.gAm[1].t):"–"],
  ["Sun highest ("+Math.round(D.max)+"°)",hhmm(D.noon.t)],["Evening golden hour",D.gPm[0]||D.gPm[1]?hhmm(D.gPm[0]&&D.gPm[0].t)+"–"+hhmm(D.gPm[1]&&D.gPm[1].t):"–"],["Sunset"+(D.set?" · "+ptOf(D.set.az):""),hhmm(D.set&&D.set.t)],["Dark by (civil dusk)",hhmm(D.dusk&&D.dusk.t)]]}
const sunDate=R=>R.f.shoot?[R.f.shoot,"shoot date"]:R.f.rdate?[R.f.rdate,"recce date"]:[new Date().toISOString().slice(0,10),"today"];
function parseLL(s){s=String(s||"");let m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/)||s.match(/(-?\d{1,3}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/);

const hasLL=R=>isFinite(parseFloat(R.f.lat))&&isFinite(parseFloat(R.f.lng));
const mapUrl=R=>hasLL(R)?"https://www.google.com/maps/search/?api=1&query="+R.f.lat+","+R.f.lng:R.f.addr?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(R.f.addr):"";

    const fields=(s.f||[]).map(f=>pField(V,f,report)).join(""),sp=s.sp==="sun"?pSun(V,R,report):"",cks=pChecks(V,s,report),nt=s.n?(report?(V.f["n_"+s.id]?`<div class="pf w nt"><div class="pl">${esc(s.n[0])}</div><div class="pvv">${nl(V.f["n_"+s.id])}</div></div>`:""):`<div class="pf w nt"><div class="pl">${esc(s.n[0])}</div>${V.f["n_"+s.id]?`<div class="pvv">${nl(V.f["n_"+s.id])}</div>`:lines(s.n[1])}</div>`):"";
    if(report&&!fields&&!sp&&!cks&&!nt)return;
    h+=`<div class="ps"><div class="ph"><i>${n}</i>${esc(s.t)}</div>${fields?`<div class="pg">${fields}</div>`:""}${sp}${cks}${nt}</div>`;
    if(s.id==="ov"&&!report)h+=`<div class="kitb"><b>Recce kit</b><div>${KIT.map(k=>box(0,esc(k))).join("")}</div></div>`});
  h+=tail;h+=`<div class="ft"><span>${esc(S.prod.title||"Film Tool Hub")} · Location recce</span><span>${report?"Written up "+new Date().toLocaleDateString("en-GB"):"Field sheet"}</span></div>`;return h}
const markYN=v=>v==="y"?'<span class="mk y">✓</span>':v==="n"?'<span class="mk n">✕</span>':'<span class="mk u">·</span>';
function cmpRows(){const g={};S.locs.forEach(r=>{const k=(r.f.setting||"").trim().toUpperCase()||"NO SETTING YET";(g[k]=g[k]||[]).push(r)});
  return Object.keys(g).sort().map(k=>[k,g[k].slice().sort((a,b)=>(avg(b)||0)-(avg(a)||0))])}
function paperCompare(){const G=cmpRows();if(!S.locs.some(r=>r.f.name||r.f.setting))return `<div class="emptyp">Add a few locations and score them in 12 Verdict to compare them here.</div>`;
  return `<div class="hd" style="grid-template-columns:1fr auto"><div><div class="kick">Location recce · Comparison</div><div class="ln1">${esc(S.prod.title||"All locations")}</div><div class="ln2">${S.locs.length} location${S.locs.length>1?"s":""} across ${G.length} setting${G.length>1?"s":""}, best score first</div></div><div class="hm"><span>Printed</span><b>${new Date().toLocaleDateString("en-GB")}</b></div></div>
  <table class="cmp" style="margin-top:12px"><tr><th>Location</th><th>Status</th><th class="c">Score</th>${SCORES.map(s=>`<th class="c" title="${s[1]}">${s[1].split(" ")[0]}</th>`).join("")}<th>Permission / fee</th><th class="c">Power</th><th class="c">Loos</th><th class="c">Noise</th><th>Verdict</th></tr>
  ${G.map(([k,rs])=>`<tr class="grp"><td colspan="${SCORES.length+8}">${esc(k)}</td></tr>`+rs.map(r=>{const a=avg(r);return `<tr><td><b>${esc(r.f.name||"Untitled")}</b>${r.f.scenes?`<br><span style="color:#666">Sc. ${esc(r.f.scenes)}</span>`:""}</td><td><span class="chip" style="background:${stCol(r.f.status)}">${esc(r.f.status||"–")}</span></td><td class="c sc">${a?a.toFixed(1):"–"}</td>${SCORES.map(s=>`<td class="c">${r.sc[s[0]]||'<span class="mk u">·</span>'}</td>`).join("")}<td>${esc(r.f.perm||"")}${r.f.fee?"<br>"+esc(r.f.fee):""}</td><td class="c">${markYN(r.ck.pow_perm)}</td><td class="c">${markYN(r.ck.fac_wc)}</td><td class="c">${r.f.noise||'<span class="mk u">·</span>'}</td><td>${esc(r.f.verdict||"")}</td></tr>`}).join("")).join("")}</table>
  <p style="font-size:9px;color:#666;margin-top:8px">Scores 1–5 from each recce's verdict. Power = allowed to use mains power. Loos = toilets crew can use. Noise 1 silent – 5 very loud.</p>`}
function prev(){const m=UI.mode;$$("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));$("#optFill").hidden=m!=="field";$("#csvBtn").hidden=m!=="compare";
  $("#mhint").textContent=m==="field"?"Print this, take it on location and write on it. Anything you've already filled in is printed; the rest gets tick boxes and lines.":m==="report"?"A tidy write-up of everything filled in, with photos and the verdict up front. Empty fields are left out.":"Every location in this project, grouped by script setting, best score first.";
  $("#pv").innerHTML=m==="compare"?paperCompare():paperRecce(cur(),m)}
let pT;const prevSoon=()=>{clearTimeout(pT);pT=setTimeout(prev,180)};

/* ───────── links to the other tools ───────── */
function readTool(k){try{const o=JSON.parse(localStorage.getItem(k)||"null");return o&&o.S?o:null}catch(e){return null}}
function reloadToolFrame(title){try{if(window.parent===window)return false;let hit=false;window.parent.document.querySelectorAll("iframe").forEach(fr=>{if(fr.title===title){try{fr.contentWindow.location.reload();hit=true}catch(e){}}});return hit}catch(e){return false}}
function importSchedule(){const o=readTool("fth-schedule-v1");if(!o||!o.S.locs||!o.S.locs.some(l=>l.name)){toast("No locations found in the Production Schedule Builder for this project yet.");return}
  const items=[];(o.S.days||[]).forEach(d=>(d.items||[]).forEach(it=>{if(it.t==="s")items.push(it)}));let add=0,upd=0;
  if(!S.prod.title&&o.S.title)S.prod.title=o.S.title;
  o.S.locs.filter(l=>l.name).forEach(l=>{const nm=l.name.trim(),its=items.filter(it=>(it.loc||"").trim().toUpperCase()===nm.toUpperCase()),u=a=>[...new Set(a.filter(Boolean))];
    const ie=u(its.map(i=>i.ie)),dn=u(its.map(i=>i.dn)),info={name:nm,addr:l.addr||"",scenes:u(its.map(i=>i.sc)).join(", "),setting:u(its.map(i=>i.hd)).join("; "),ie:ie.length>1?"INT/EXT":ie[0]||"",dn:dn.length>1?"DAY & NIGHT":dn[0]||""};
    let r=S.locs.find(x=>(x.f.name||"").trim().toUpperCase()===nm.toUpperCase());
    if(!r){const blank=S.locs.length===1&&!Object.keys(S.locs[0].f).some(k=>k!=="status"&&S.locs[0].f[k]);r=blank?S.locs[0]:newR();if(!blank)S.locs.push(r);add++}else upd++;
    Object.entries(info).forEach(([k,v])=>{if(v&&!String(r.f[k]||"").trim())r.f[k]=v});if(info.scenes)r.f.scenes=info.scenes});
  persist();form();prev();toast(`From the schedule: ${add} new location${add===1?"":"s"}${upd?`, ${upd} updated`:""}.`)}
function sendCallSheet(){const R=cur(),o=readTool("fth-callsheet-v1")||{S:null,at:0},C=o.S||{};
  const m={addr:R.f.addr,w3w:R.f.w3w,hosp:R.f.hosp,hospAddr:R.f.hospAddr,hospPhone:R.f.hospPhone};if(hasLL(R)){m.lat=+R.f.lat;m.lng=+R.f.lng}if(!C.title&&S.prod.title)m.title=S.prod.title;if(!C.date&&R.f.shoot)m.date=R.f.shoot;
  const keys=Object.keys(m).filter(k=>m[k]!==undefined&&m[k]!=="");if(!keys.length){toast("Nothing to send yet. Add the address, What3Words or A&E first.");return}
  if(!confirm(`Copy ${R.f.name||"this location"}'s address, What3Words, coordinates and A&E details into the Call Sheet Builder?\n\nThose fields on the call sheet will be replaced.`))return;
  if(!o.S){toast("Open the Call Sheet Builder once first, then send again.");return}
  keys.forEach(k=>C[k]=m[k]);try{localStorage.setItem("fth-callsheet-v1",JSON.stringify({S:C,at:Date.now()}))}catch(e){toast("Couldn't write to the call sheet.");return}
  toast(reloadToolFrame("Call Sheet Builder")?"Sent to the call sheet (it's been refreshed).":"Sent. The call sheet will show it next time it's opened.")}
/* Documentation (Film Tool Hub): each export is also filed in the project's Documentation folder.
   window.fthDocs only exists inside the hub. Both helpers return true when the person chose
   "Save to Documentation", which means: don't download / don't open the print window. */
const fthDoc = (type, filename, blob, group) => !!(window.fthDocs && window.fthDocs.save({type, filename, blob, group}));
const fthPage = (type, name, group) => !!(window.fthDocs && window.fthDocs.page({type, name, group}));
const rfile=()=>"Location_Recces"+(S.prod.title?"_"+S.prod.title.replace(/[^\w]+/g,"_"):"");
function csv(){const H=["Setting","Location","Status","Scenes","Address","What3Words","Coordinates","Score",...SCORES.map(s=>s[1]),"Permission","Fee","Mains power allowed","Crew toilets","Noise (1-5)","Verdict","Pros","Cons"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',yn=v=>v==="y"?"Yes":v==="n"?"No":v==="na"?"N/A":"";
  const rows=cmpRows().flatMap(([k,rs])=>rs.map(r=>[k,r.f.name,r.f.status,r.f.scenes,r.f.addr,r.f.w3w,hasLL(r)?r.f.lat+", "+r.f.lng:"",avg(r)?avg(r).toFixed(1):"",...SCORES.map(s=>r.sc[s[0]]||""),r.f.perm,r.f.fee,yn(r.ck.pow_perm),yn(r.ck.fac_wc),r.f.noise,r.f.verdict,r.f.pros,r.f.cons]));
  const b=new Blob(["﻿"+[H,...rows].map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"});if(fthDoc("Recce CSV",rfile()+".csv",b))return;
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=rfile()+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}

/* ───────── events ───────── */
const ed=$("#ed");
ed.addEventListener("input",e=>{const t=e.target,R=cur(),d=t.dataset;
  if(d.f){const k=d.f;R.f[k]=t.value;
    if(k==="coords"){const ll=parseLL(t.value);if(ll){R.f.lat=ll[0];R.f.lng=ll[1]}else{delete R.f.lat;delete R.f.lng}const s=$("#llState");if(s)s.innerHTML=llState(R);renderSpecial("sun");renderSpecial("hosp")}
    if(k==="shoot"||k==="rdate")renderSpecial("sun");
    if(k==="name"||k==="status"||k==="setting")$("#locSel").innerHTML=locOpts();
    if(k==="ie"){persist();form();prev();return}}
  else if(d.prod)S.prod[d.prod]=t.value;
  else if(d.dir!=null){R.dirs[+d.dir][d.dk]=t.value;if(d.dk==="d")renderSpecial("sun")}
  else if(d.ph!=null)R.photos[+d.ph][d.pk]=t.value;
  else if(d.ac!=null)R.acts[+d.ac][d.ak]=t.type==="checkbox"?t.checked:t.value;
  else return;
  updProgress();persist();prevSoon()});
ed.addEventListener("change",e=>{if(e.target.dataset.dk==="l"){setTimeout(()=>renderSpecial("sun"),0);return}if(e.target.id==="locSel"){S.cur=e.target.value;persist();form();prev();$("#ed").scrollTop=0}});
ed.addEventListener("click",e=>{const t=e.target.closest("button,[data-tip],[data-shut]");if(!t)return;const R=cur(),d=t.dataset;
  if(d.tip!=null){e.stopPropagation();const n=t.parentNode.nextElementSibling;if(n&&n.classList.contains("tip"))n.classList.toggle("on");else{const x=t.closest(".sunh");x&&x.nextElementSibling&&x.nextElementSibling.classList.toggle("on")}return}
  if(d.off){e.stopPropagation();R.off[d.off]=!R.off[d.off];persist();form();prev();return}
  if(d.shut&&t.tagName!=="BUTTON"){UI.shut[d.shut]=!UI.shut[d.shut];t.closest(".sec").classList.toggle("shut",UI.shut[d.shut]);return}
  if(d.ck){R.ck[d.ck]=R.ck[d.ck]===d.v?"":d.v;$$(`[data-ck="${d.ck}"]`).forEach(b=>b.classList.toggle("on",b.dataset.v===R.ck[d.ck]))}
  else if(d.tick){R.ck[d.tick]=!R.ck[d.tick];t.classList.toggle("on",R.ck[d.tick]);const sid=d.tick.split("_")[0];if(R.ck[d.tick]&&!d.tick.endsWith("__none"))R.ck[sid+"__none"]=false;if(d.tick.endsWith("__none")&&R.ck[d.tick])Object.keys(R.ck).forEach(k=>{const s=SEC.find(x=>x.id===sid);if(k.startsWith(sid+"_")&&k!==d.tick&&s.c.some(g=>g.y==="tick"&&g.i.some(i=>ckKey(s,i[0])===k)))R.ck[k]=false});$$(`[data-tick^="${sid}_"]`).forEach(b=>b.classList.toggle("on",!!R.ck[b.dataset.tick]))}
  else if(d.scale){R.f[d.scale]=String(R.f[d.scale])===d.v?"":d.v;$$(`[data-scale="${d.scale}"]`).forEach(b=>b.classList.toggle("on",b.dataset.v===String(R.f[d.scale])));$$(`[data-scale="${d.scale}"]`).forEach(b=>b.classList.toggle("sv",b.dataset.v===String(R.f[d.scale])))}
  else if(d.sc){R.sc[d.sc]=+R.sc[d.sc]===+d.v?0:+d.v;renderSpecial("verdict")}
  else if(d.act){const a=d.act,i=+d.i;
    if(a==="geo"){if(!navigator.geolocation){toast("Location isn't available in this browser.");return}t.textContent="Finding…";navigator.geolocation.getCurrentPosition(p=>{R.f.lat=+p.coords.latitude.toFixed(6);R.f.lng=+p.coords.longitude.toFixed(6);R.f.coords=R.f.lat+", "+R.f.lng;persist();form();prev();toast("Location set (±"+Math.round(p.coords.accuracy)+" m)")},er=>{t.textContent="Use my location";toast("Couldn't get your location: "+(er.message||"permission denied"))},{enableHighAccuracy:true,timeout:15000});return}
    if(a==="adddir")R.dirs.push({l:"",d:""}),renderSpecial("sun");
    else if(a==="deldir")R.dirs.splice(i,1),renderSpecial("sun");
    else if(a==="usehosp"){const h=HS[+d.h];R.f.hosp=h[0];R.f.hospAddr=h[1];persist();form();prev();toast("A&E set to "+h[0]);return}
    else if(a==="addph"){$("#photoPick").click();return}
    else if(a==="delph"){if(!confirm("Remove this photo?"))return;const[p]=R.photos.splice(i,1);delImg(p.id);renderSpecial("photos")}
    else if(a==="mvph"){const j=i+ +d.d,[p]=R.photos.splice(i,1);R.photos.splice(j,0,p);renderSpecial("photos")}
    else if(a==="addsk"){$("#sketchPick").click();return}
    else if(a==="delsk"){delImg(R.sketch);R.sketch=null;renderSpecial("photos")}
    else if(a==="addact")R.acts.push({t:"",who:"",done:false}),renderSpecial("verdict");
    else if(a==="delact")R.acts.splice(i,1),renderSpecial("verdict");
    else if(a==="dup"){const c=JSON.parse(JSON.stringify(R));c.id=uid();c.f.name=(R.f.name||"Location")+" (copy)";c.photos=[];c.sketch=null;c.sc={};c.f.verdict="";c.at=Date.now();S.locs.push(c);S.cur=c.id;persist();form();prev();toast("Duplicated without photos or scores.");return}
    else if(a==="del"){if(!confirm(`Delete “${R.f.name||"this location"}” and its photos? This can't be undone (unless you restore a project backup).`))return;R.photos.forEach(p=>delImg(p.id));if(R.sketch)delImg(R.sketch);S.locs=S.locs.filter(x=>x!==R);if(!S.locs.length)S.locs.push(newR());S.cur=S.locs[0].id;persist();form();prev();return}
    else if(a==="tocs"){sendCallSheet();return}
    else return}
  else return;
  updProgress();persist();prevSoon()});
ed.addEventListener("click",e=>{const a=e.target.closest("[data-nav]");if(!a)return;e.preventDefault();const s=$("#s-"+a.dataset.nav);if(UI.shut[a.dataset.nav]){UI.shut[a.dataset.nav]=false;s.classList.remove("shut")}s.scrollIntoView({behavior:"smooth",block:"start"})});
$("#photoPick").addEventListener("change",e=>{addPhotos([...e.target.files]);e.target.value=""});
$("#sketchPick").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const R=cur();try{const b=await shrink(f,2000),id="s"+uid();if(R.sketch)delImg(R.sketch);await putImg(id,b);R.sketch=id;persist();renderSpecial("photos");prevSoon()}catch(er){toast("Couldn't read that image.")}});

const pdfKind=()=>({field:"Recce Field Sheet PDF",report:"Recce Report PDF",compare:"Recce Comparison PDF"})[UI.mode]||"Recce PDF";
$("#printBtn").addEventListener("click",()=>{if(innerWidth<=900)document.body.classList.add("vpv");setTimeout(()=>{if(!fthPage(pdfKind(),rfile()))print()},50)});
if(window.fthDocs)fthDocs.attach($("#docBtn"),()=>[{label:pdfKind().replace("Recce ",""),fn:()=>$("#printBtn").click()},{label:"Comparison spreadsheet (CSV)",fn:csv}]);
$("#addBtn").addEventListener("click",()=>{const r=newR();S.locs.push(r);S.cur=r.id;persist();form();prev();$("#ed").scrollTop=0;
  toast("New location added. Tip: Duplicate copies the setting and scenes for another candidate.");setTimeout(()=>{const n=$('[data-f="name"]');n&&n.focus()},60)});
$("#impBtn").addEventListener("click",importSchedule);
$$(".mswitch button").forEach(b=>b.addEventListener("click",()=>{document.body.classList.toggle("vpv",b.dataset.view==="pv");$$(".mswitch button").forEach(x=>x.classList.toggle("on",x===b));scrollTo(0,0)}));
window.addEventListener("storage",e=>{if(e.key&&e.key.endsWith(KEY)&&e.newValue){try{const o=JSON.parse(e.newValue);if(o&&o.S&&o.at>savedAt){S=o.S;savedAt=o.at;form();prev();showSaved()}}catch(er){}}});
/* keep the "sun right now" dot moving */
setInterval(()=>{if(document.visibilityState==="visible"&&!document.activeElement.closest?.(".sunw"))renderSpecial("sun")},60000);

$("#incFill").checked=UI.fill;
form();prev();showSaved();
loadImgs().then(()=>{renderSpecial("photos");prev()});
</script></body></html>
