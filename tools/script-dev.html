<html lang="en-GB">

<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

:root{--fth-cat:#f5b14c;--fth-accent:#f5b14c;--fth-accent-ink:#f5b14c;--fth-accent-soft:rgba(245,177,76,0.14);--fth-accent-line:rgba(245,177,76,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#8e672c;--fth-accent-ink:#8e672c;--fth-accent-soft:rgba(245,177,76,0.16);--fth-accent-line:rgba(245,177,76,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaffolded Scriptwriting</title>
<style>
:root{
  --ui:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  --bg:#f3f0e9; --panel:#faf8f3; --card:#ffffff; --sunk:#efebe2;
  --ink:#1d1b18; --ink2:#57514a; --ink3:#8b847a; --line:#e2dcd0; --line2:#cfc7b8;
  --accent:#2c4f84; --accent2:#e8eef8; --accent-ink:#fff;
  --paper:#fffefb; --paper-ink:#151412; --paper-edge:#e6e0d4;
  --shadow:0 1px 2px rgba(50,35,10,.05),0 6px 20px rgba(50,35,10,.06);
  --shadow2:0 10px 40px rgba(30,20,0,.18);
  --lie:#a8475a; --truth:#c48a12; --tragic:#5d6a7e;
  --cs:#2c8a78; --pr:#cf8526; --ch:#cc5638; --a2:#4a6fb5; --mid:#8a5cc2;
  --warn-bg:#fff3d6; --warn-ink:#6f4700; --warn-line:#efd39a;
  --tip-bg:#eaf0f9; --tip-ink:#26436d; --tip-line:#c8d7ee;
  --ok:#2f7d4f;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131417; --panel:#191a1e; --card:#202227; --sunk:#16171a;
    --ink:#ecebe6; --ink2:#b4afa6; --ink3:#7f7b74; --line:#2c2e34; --line2:#3a3d44;
    --accent:#8fb0e6; --accent2:#1f2a3c; --accent-ink:#0f1520;
    --paper:#1c1d21; --paper-ink:#e9e7e1; --paper-edge:#2c2e34;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --lie:#d77689; --truth:#e2b04a; --tragic:#8f9db3;
    --cs:#4fb8a3; --pr:#e6a24c; --ch:#e9785b; --a2:#7d9ee0; --mid:#ad86e0;
    --warn-bg:#33290f; --warn-ink:#f3d58f; --warn-line:#5a4a1d;
    --tip-bg:#18243a; --tip-ink:#b9cdf0; --tip-line:#2a3c5c;
  }
}
:root[data-theme="dark"]{
  --bg:#131417; --panel:#191a1e; --card:#202227; --sunk:#16171a;
  --ink:#ecebe6; --ink2:#b4afa6; --ink3:#7f7b74; --line:#2c2e34; --line2:#3a3d44;
  --accent:#8fb0e6; --accent2:#1f2a3c; --accent-ink:#0f1520;
  --paper:#1c1d21; --paper-ink:#e9e7e1; --paper-edge:#2c2e34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --lie:#d77689; --truth:#e2b04a; --tragic:#8f9db3;
  --cs:#4fb8a3; --pr:#e6a24c; --ch:#e9785b; --a2:#7d9ee0; --mid:#ad86e0;
  --warn-bg:#33290f; --warn-ink:#f3d58f; --warn-line:#5a4a1d;
  --tip-bg:#18243a; --tip-ink:#b9cdf0; --tip-line:#2a3c5c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
a{color:var(--accent)}
.fam-cs{--c:var(--cs)} .fam-pr{--c:var(--pr)} .fam-ch{--c:var(--ch)} .fam-a2{--c:var(--a2)} .fam-mid{--c:var(--mid)}

/* ---------- top bar ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 15px var(--serif);flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-txt small{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.proj-title{border:1px solid transparent;background:transparent;font:600 17px var(--serif);padding:2px 6px;margin-left:-6px;border-radius:6px;width:min(320px,30vw);text-overflow:ellipsis}
.proj-title:hover{border-color:var(--line)} .proj-title:focus{outline:none;border-color:var(--accent);background:var(--card)}
.tabs{display:flex;gap:4px;margin:0 auto;background:var(--sunk);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 16px 7px 10px;border-radius:999px;display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600;font-size:14px}
.tab .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink2)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tab.on .n{background:var(--ink);color:var(--bg)}
.tab-arrow{color:var(--ink3);align-self:center;font-size:12px}
.top-actions{display:flex;align-items:center;gap:8px}
.save-state{font-size:12px;color:var(--ink3);text-align:right;line-height:1.25;max-width:190px}
.save-state b{color:var(--ink2);font-weight:600}
.save-state.nag b{color:var(--warn-ink)}
.btn{border:1px solid var(--line2);background:var(--card);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:7px 9px}
.btn.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--warn-ink);display:none}
.btn.nag .dot{display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.btn svg,.ico{width:16px;height:16px;flex:none}

#view{flex:1;overflow:auto;position:relative;scroll-behavior:auto}

/* ---------- generic UI ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:24px} h3{font-size:18px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.muted{color:var(--ink3)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{padding:24px 26px;margin-bottom:22px;scroll-margin-top:20px}
.sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.sec-num{font:600 13px var(--ui);width:28px;height:28px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink2)}
.sec-head h2{flex:1}
.lede{color:var(--ink2);margin:4px 0 18px 42px;max-width:70ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.flabel{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.fhint{font-size:12.5px;color:var(--ink3);margin-top:-2px}
.field input,.field textarea,.field select,.inp{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:9px 11px;width:100%;line-height:1.45;transition:border-color .15s,box-shadow .15s}
.field textarea{resize:vertical;min-height:44px;overflow:hidden}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--card)}
.field.big textarea{font-size:16px}
.field.lie textarea{border-left:4px solid var(--lie)} .field.truth textarea{border-left:4px solid var(--truth)} .field.tragic textarea{border-left:4px solid var(--tragic)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.chip:hover{border-color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.also{font-size:11px;color:var(--ink3);font-weight:500}
.also b{color:var(--ink2);font-weight:600}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink3);font:italic 700 11px/1 Georgia,serif;display:inline-grid;place-items:center;padding:0;flex:none}
.info:hover{color:var(--accent);border-color:var(--accent)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msgs:empty{display:none}
.msg{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;border:1px solid}
.msg .mi{flex:none;width:18px;height:18px;margin-top:1px}
.msg.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.msg.tip,.msg.info{background:var(--tip-bg);color:var(--tip-ink);border-color:var(--tip-line)}
.msg .mact{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.msg .mact button{border:1px solid currentColor;background:transparent;border-radius:7px;padding:2px 9px;font-size:12px;font-weight:600;color:inherit}
.hint{background:var(--tip-bg);color:var(--tip-ink);border:1px solid var(--tip-line);border-radius:10px;padding:10px 13px;font-size:13.5px;display:flex;gap:10px}
.hint b{font-weight:700}
body.no-tips .hint,body.no-tips .teach{display:none!important}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:18px 0}
.empty{padding:22px;text-align:center;color:var(--ink3);border:1.5px dashed var(--line2);border-radius:12px;font-size:14px}
.kbd{font:600 11.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line2);position:relative;transition:.2s;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}

/* ---------- develop ---------- */
.dev{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:26px 24px 120px}
.dnav{position:sticky;top:22px;align-self:start;display:flex;flex-direction:column;gap:2px}
.dnav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px}
.dnav a:hover{background:var(--sunk);color:var(--ink)}
.dnav a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.dnav .cdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.dnav .cdot.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.dnav .cdot.full{background:var(--ok);border-color:var(--ok)}
.dnav .navfoot{margin-top:14px;padding:12px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line)}
.welcome{padding:22px 26px;margin-bottom:22px;background:linear-gradient(135deg,var(--card),var(--accent2));position:relative}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 6px}
.welcome .flow div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.welcome .flow b{display:block;color:var(--ink);font-family:var(--serif);font-size:16px;margin-bottom:2px}
.xbtn{position:absolute;top:12px;right:12px}
.spark{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:16px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.spark .field{margin-bottom:8px}
.logline-preview{font:500 18px/1.5 var(--serif);padding:16px 18px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);margin:4px 0 12px}
.logline-preview .slot{border-bottom:2px solid var(--accent);color:var(--ink)}
.logline-preview .slot.empty{color:var(--ink3);border-bottom-style:dashed;font-style:italic}
.lb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lb .field{margin:0}
.lb .lbk{font:700 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lbex{font-size:13.5px;color:var(--ink2);margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;font-style:italic}
.lbex b{font-style:normal;color:var(--ink)}
.lbconn{border:1px solid var(--line2);background:var(--card);border-radius:6px;font:700 11px var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding:1px 2px;margin-right:4px}
.lbk{display:flex;align-items:center;min-height:22px}
.field select.lbconn{width:auto;padding:1px 4px;border-radius:6px;line-height:1.2;background:var(--card)}
.wc{font-size:12px;color:var(--ink3);text-align:right;margin-top:-8px}
.lt{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lt .ltcol{border-radius:12px;padding:14px 16px 4px;border:1px solid var(--line)}
.lt .ltcol.l{background:color-mix(in srgb,var(--lie) 7%,var(--card))}
.lt .ltcol.t{background:color-mix(in srgb,var(--truth) 8%,var(--card))}
.ltlab{font:700 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ltcol.l .ltlab{color:var(--lie)} .ltcol.t .ltlab{color:var(--truth)}
.checks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:6px}
.checks h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.checks label{display:flex;gap:8px;font-size:13px;color:var(--ink2);padding:3px 0;cursor:pointer;align-items:flex-start}
.checks input{margin-top:3px;accent-color:var(--accent)}
.topics{max-height:220px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.topics .chip{font-size:11.5px;padding:2px 8px}
details.disc>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent);list-style:none;display:inline-flex;gap:6px;align-items:center;margin:2px 0 10px}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary::before{content:"▸";transition:.15s;display:inline-block}
details.disc[open]>summary::before{transform:rotate(90deg)}
.arcs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.arc-opt{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:.15s}
.arc-opt:hover{border-color:var(--line2)}
.arc-opt.on{border-color:var(--accent);background:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.arc-opt b{font-size:13.5px}
.arc-opt .ft{font:700 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.arc-opt svg{width:100%;height:38px;display:block}
.arc-opt .st{font-size:11.5px;color:var(--ink2);line-height:1.35}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ccard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px 4px;position:relative}
.ccard.prot{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:inset 4px 0 0 var(--accent)}
.ccard-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ccard-head input{font:600 17px var(--serif);border:0;background:transparent;padding:2px 0;flex:1;min-width:0;border-bottom:1.5px dashed var(--line2);border-radius:0}
.ccard-head input:focus{outline:none;border-bottom-color:var(--accent)}
.ccard-head select{border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:3px 6px;font-size:12.5px;font-weight:600}
.ccard .field{margin-bottom:10px}
.ccard .field textarea,.ccard .field input{background:var(--card)}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end}
.cycle .field{margin:0}
.cycle .flabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.addcard{border:1.5px dashed var(--line2);border-radius:12px;background:transparent;min-height:120px;color:var(--ink3);font-weight:600;display:grid;place-items:center}
.addcard:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- outline ---------- */
.ol{max-width:1280px;margin:0 auto;padding:22px 24px 120px}
.glance{padding:18px 22px 16px;margin-bottom:18px}
.glance-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.arcchart{position:relative;height:190px;margin:8px 0 0}
.arcchart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arcchart .zone{position:absolute;left:0;right:0;pointer-events:none}
.arcchart .zl{position:absolute;left:8px;font:700 10.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arcchart .zl span{font:500 12.5px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink2);margin-left:6px}
.adot{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.adot.sm{width:8px;height:8px;border-width:1.5px}
.atip{position:absolute;transform:translate(-50%,8px);font-size:11px;color:var(--ink2);white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:6px;pointer-events:none;opacity:0;transition:.12s}
.adot:hover+.atip{opacity:1}
.alegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.alegend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink);vertical-align:middle;margin-right:5px}
.tl{position:relative;margin-top:8px}
.tl-row{display:flex;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tl-seg{position:relative;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--card)}
.tl-seg:last-child{border-right:0}
.tl-part{flex:1;min-height:0;overflow:hidden;padding:7px 10px;background:color-mix(in srgb,var(--c) 13%,var(--card));border-top:4px solid var(--c);cursor:pointer;transition:background .15s}
.tl-part:hover{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.tl-part.sel{background:color-mix(in srgb,var(--c) 28%,var(--card));box-shadow:inset 0 0 0 2px var(--c)}
.tl-seg.grp .tl-part{padding:3px 8px}
.tl-seg.grp .tl-part+.tl-part{border-top:3px solid var(--c)}
.tl-seg.grp .ts{-webkit-line-clamp:1}
.tl-part .tn{font:700 11px var(--ui);letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-part .ts{font-size:12px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tl-part .ts.e{color:var(--ink3);font-style:italic}
.tl-m.sel .dia{box-shadow:0 0 0 4px color-mix(in srgb,var(--mid) 40%,transparent)}
.tl-m{position:absolute;top:-8px;bottom:-8px;width:0;z-index:2;cursor:pointer}
.tl-m::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;border-left:3px solid var(--c)}
.tl-m .dia{position:absolute;top:50%;left:0;width:18px;height:18px;transform:translate(-50%,-50%) rotate(45deg);background:var(--c);border:3px solid var(--card);border-radius:3px}
.tl-m.filled .dia{box-shadow:0 0 0 2px var(--c)}
.tl-mlab{position:absolute;top:0;transform:translateX(-50%);margin-top:6px;width:150px;text-align:center;font-size:11.5px;color:var(--ink2);line-height:1.3;cursor:pointer}
.tl-mlab b{display:block;font:700 10.5px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.tl-mlab span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:4px;position:relative;height:14px}
.tl-scale span{position:absolute;transform:translateX(-50%)}
.tl-under{height:58px}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 18px}
.step{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px 6px 6px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.step .sn{width:22px;height:22px;border-radius:50%;background:var(--sunk);border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px}
.step.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.step.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--shadow)}
.step.on .sn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.half .sn{background:linear-gradient(90deg,var(--ok) 50%,var(--sunk) 50%);border-color:var(--ok);color:var(--ink)}
.step.on.half .sn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.passcap{font-size:12px;color:var(--ink3);margin-left:8px}
.passcap b{color:var(--ink2)}
.bcard.later{opacity:.55;transition:opacity .15s}
.bcard.later:hover,.bcard.later:focus-within{opacity:1}
.halfhead b{color:var(--ink)}
.stepbody{padding:24px 26px}
.stephead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.stephead p{margin:6px 0 0;color:var(--ink2);max-width:75ch}
.pairs{display:grid;grid-template-columns:1fr 46px 1fr;gap:0;align-items:stretch}
.pairs .mir{display:grid;place-items:center;color:var(--ink3)}
.pairs .mir span{writing-mode:vertical-rl;font-size:11px;letter-spacing:.15em;text-transform:uppercase;border-left:1.5px dashed var(--line2);padding-left:8px;height:80%;display:flex;align-items:center;justify-content:center}
.halfhead{font:700 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.bcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px 6px;border-top:4px solid var(--c);margin-bottom:14px}
.bcard-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bcard-head h3{font-size:17px;flex:1}
.bcard-head .rng{font-size:12px;color:var(--ink3);font-weight:600}
.bdesc{font-size:13.5px;color:var(--ink2);margin:0 0 8px;line-height:1.5}
.barc{font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--sunk);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.barc .bdot{width:10px;height:10px;border-radius:50%;flex:none}
.bprompt{font:italic 500 14px/1.45 var(--serif);color:var(--ink);margin:2px 0 10px;padding-left:10px;border-left:3px solid var(--c)}
.bfrom{font-size:12.5px;color:var(--ink2);background:var(--card);border:1px dashed var(--line2);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.bfrom b{color:var(--ink)}
.mid-wrap{max-width:640px;margin:0 auto}
.stepnav{display:flex;justify-content:space-between;margin-top:8px;gap:10px}
/* toggle list */
.tgl{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.tgl.hl{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.tgl-h{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-left:5px solid var(--c);user-select:none}
.tgl-h:hover{background:var(--sunk)}
.tgl-h .car{transition:.15s;color:var(--ink3);width:14px;flex:none}
.tgl.open>.tgl-h .car{transform:rotate(90deg)}
.tgl-h .tt{font-weight:700;font-size:14.5px;white-space:nowrap}
.tgl-h .tsum{flex:1;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl-h .tsum.e{color:var(--ink3);font-style:italic}
.tgl-h .mirtag{font-size:11px;color:var(--ink3);white-space:nowrap}
.tgl-b{display:none;padding:6px 14px 14px 33px;border-left:5px solid var(--c)}
.tgl.open>.tgl-b{display:block}
.items{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{border:1px solid var(--line);border-radius:9px;background:var(--card)}
.item-h{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px}
.item-h .car{border:0;background:transparent;color:var(--ink3);width:24px;height:24px;border-radius:6px;transition:.15s;padding:0}
.item.open .item-h .car{transform:rotate(90deg)}
.item-h input{flex:1;border:0;background:transparent;padding:5px 4px;font-weight:600;min-width:0}
.item-h input:focus{outline:none}
.item-h .ib{border:0;background:transparent;color:var(--ink3);width:26px;height:26px;border-radius:6px;opacity:.0;transition:.12s;padding:0}
.item:hover .ib,.item:focus-within .ib{opacity:1}
.item-h .ib:hover{background:var(--sunk);color:var(--ink)}
.item-b{display:none;padding:0 10px 10px 34px}
.item.open .item-b{display:block}
.item-b textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;resize:vertical;min-height:60px;line-height:1.45}
.item-b textarea:focus{outline:none;border-color:var(--accent)}
.letter{font:700 11px var(--mono);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:1px 5px;min-width:24px;text-align:center}
/* mirror */
.mirror{display:flex;flex-direction:column}
.mpair,.mconn{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}
.mcard{border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line));border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--c) 6%,var(--card));min-width:0;transition:box-shadow .15s}
.mcard.hl{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.mpair>.mcard:first-child{border-left-width:4px}
.mpair>.mcard:last-child{border-right-width:4px}
.mch{height:28px;display:flex;align-items:center;gap:8px}
.mch .mname{font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 75%,var(--ink));flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mch .rng{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap}
.mpair>.mcard:last-child .mch{flex-direction:row-reverse;text-align:right}
.msl{height:22px;margin-bottom:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msl.e{color:var(--ink3);font-style:italic}
.mpair>.mcard:last-child .msl{text-align:right}
.mcell{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;height:38px;margin-bottom:6px}
.mcell:last-child{margin-bottom:0}
.mcell input{flex:1;border:0;background:transparent;padding:5px 2px;min-width:0;font-weight:500}
.mcell input:focus{outline:none}
.mcell.ph{border-style:dashed;background:transparent;color:var(--ink3);justify-content:center;cursor:pointer;font-size:13px}
.mcell.ph:hover{color:var(--accent);border-color:var(--accent)}
.mbreak{border:1.5px solid transparent;padding:12px 0;text-align:center;color:var(--ink3)}
.mbreak .msl{color:var(--ink3);overflow:visible}
.mbreak .mx{height:38px;line-height:38px;margin-bottom:6px;font-size:15px}
.mbreak::before{content:"";display:block}
.mcard.jtop{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-width:0}
.mcard.jbot{border-top-left-radius:0;border-top-right-radius:0;border-top:2px dashed color-mix(in srgb,var(--c) 45%,var(--line))}
.mpair.jtop .mcard{background:color-mix(in srgb,var(--pr) 7%,var(--card))}
.mconn{height:44px;color:var(--ink3)}
.mconn>div{display:flex;justify-content:center;align-items:center}
.marrow svg{display:block;width:22px;height:32px}
.mconn.final{height:46px}
.mconn.final>div:first-child{justify-content:flex-end;padding-right:6px}
.mconn.final>div:last-child{justify-content:flex-start;padding-left:6px}
.mconn.final .marrow svg{width:52px;height:38px}
.mhinge{text-align:center;padding:14px 18px;border-radius:14px;border:2px solid var(--mid);background:color-mix(in srgb,var(--mid) 9%,var(--card));margin:0 auto;width:min(440px,100%)}
.mhinge b{font:700 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}

/* ---------- write ---------- */
.write{min-height:100%}
.wbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbar .grp{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid var(--line)}
.wbar .grp:last-child{border-right:0}
.elsel{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 8px;font-weight:600;font-size:13px;min-width:140px}
.tgt{width:56px;border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:4px 6px;text-align:center}
.wstat{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.wstat b{color:var(--ink)}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--warn-ink);color:var(--warn-bg);font-size:11px;display:inline-grid;place-items:center;padding:0 5px}

function mergeDefaults(d, t){
  if (Array.isArray(t)) return Array.isArray(d) ? d : t;
  if (t && typeof t === 'object'){
    const o = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
    for (const k in t) o[k] = (k in o) ? mergeDefaults(o[k], t[k]) : t[k];
    return o;
  }
  return d === undefined ? t : d;
}
function normaliseProject(p){
  const b = blankProject();
  p = mergeDefaults(p, b);
  for (const id of BEAT_IDS){ p.outline.beats[id] = mergeDefaults(p.outline.beats[id], {summary:'', items:[]}); }
  p.develop.characters = p.develop.characters.map(c => mergeDefaults(c, newChar()));
  return p;
}

(function boot(){
  let local = null;
  const readLocal = id => { try { const r = lsGet(LS+'p:'+id); return r ? JSON.parse(r) : null; } catch(e){ return null; } };
  if (embedded && embedded.id){

    if (local && (local.savedAt||0) > (embedded.savedAt||0) + 1000){
      S = normaliseProject(local);
      bootNotice = {kind:'newer', when: local.savedAt};

    const last = lsGet(LS+'last');
    local = last ? readLocal(last) : null;
    if (local){ S = normaliseProject(local); bootNotice = {kind:'continue'}; }
    else S = blankProject();
  }
})();

let saveTimer = null, dirtySinceBackup = 0;
const derived = [];        // view-scoped updaters
const gDerived = [];       // global updaters (header etc.)

function touch(){
  S.savedAt = Date.now();

  saveTimer = setTimeout(saveLocal, 350);

}
function saveLocal(){
  clearTimeout(saveTimer);

  updateSaveState();
}
let storageOK = true;
function scheduleDerived(){ clearTimeout(derivedTimer); derivedTimer = setTimeout(runDerived, 140); }
function runDerived(){ for (const f of gDerived) try{ f(); }catch(e){ console.error(e); } for (const f of derived) try{ f(); }catch(e){ console.error(e); } }

function stamp(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function slug(s){ return (String(s||'').trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_').slice(0,50)) || 'Untitled_Script'; }
function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = h('a', {href: URL.createObjectURL(blob), download: name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function backupHTML(){
  flushEditor && flushEditor();
  S.backedUpAt = Date.now();
  const json = JSON.stringify(S).replace(/</g, '\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const open = '<script type="application/json" id="project-data">';
  const i = TEMPLATE.indexOf(open);
  const j = TEMPLATE.indexOf('</' + 'script>', i);
  if (i < 0 || j < 0){ toast('Sorry, the backup failed (template not found).'); return; }
  const html = (TEMPLATE.slice(0, i + open.length) + json + TEMPLATE.slice(j)).replace(/<title>[\s\S]*?<\/title>/, '<title>' + esc(S.title || 'Untitled script') + '</title>');
  download(`${slug(S.title)}_${stamp(new Date())}.html`, html, 'text/html');
  dirtySinceBackup = 0;
  saveLocal();
  toast('Backup downloaded. Keep it somewhere safe (your SSD, OneDrive…). Open it any time to carry on.');
}
function ago(t){
  if (!t) return 'never';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s/60) + ' min ago';
  if (s < 86400) return Math.round(s/3600) + ' hr ago';
  const d = Math.round(s/86400); return d + (d === 1 ? ' day ago' : ' days ago');
}

/* ---------- UI primitives ---------- */
function toast(msg, ms=3200){ $$('.toast').forEach(x => x.remove()); const t = h('div', {class:'toast'}, msg); $('#layer').append(t); setTimeout(() => t.remove(), ms); }
let popEl = null;
function closePop(){ if (popEl){ popEl.remove(); popEl = null; } }
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-pop]')) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closePop(); } });
function placePop(el, anchor, prefer='below'){
  $('#layer').append(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, ht = el.offsetHeight;
  let x = clamp(r.left, 10, innerWidth - w - 10), y = r.bottom + 8;
  if (prefer === 'below-right') x = clamp(r.right - w, 10, innerWidth - w - 10);
  if (y + ht > innerHeight - 10) y = Math.max(10, r.top - ht - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function infoBtn(key){
  const b = h('button', {class:'info', type:'button', title:'What does this mean?', 'data-pop':'1', onclick: e => {
    e.preventDefault(); e.stopPropagation();
    if (popEl && popEl._k === key){ closePop(); return; }
    closePop();
    const g = GLOSS[key]; if (!g) return;
    popEl = h('div', {class:'pop'}, h('h4', null, g[0]), h('div', {html:g[1]}));
    popEl._k = key; placePop(popEl, b);
  }}, 'i');
  return b;
}
function menu(anchor, items){
  closePop();
  popEl = h('div', {class:'menu'}, items.map(it => it === '-' ? h('hr') : h('button', {onclick: () => { closePop(); it.fn(); }}, it.icon ? svgIcon(IC[it.icon]) : null, it.label, it.sub ? h('small', null, it.sub) : null)));

}
function modal(title, body, buttons){
  const scrim = h('div', {class:'scrim', onmousedown: e => { if (e.target === scrim) close(); }});
  const close = () => scrim.remove();
  const m = h('div', {class:'modal', role:'dialog'}, h('h3', null, title), h('div', {class:'mb'}, body),
    h('div', {class:'mf'}, (buttons || [{label:'Close'}]).map(b => h('button', {class:'btn' + (b.primary ? ' primary' : ''), onclick: () => { if (b.fn && b.fn() === false) return; close(); }}, b.label))));

function msgEl(m, onClick){
  const el = h('div', {class:'msg ' + (m.level || 'tip') + (onClick ? ' j' : '')},
    svgIcon(m.level === 'warn' ? IC.warn : IC.bulb, 'mi'),
    h('div', null, h('div', {html: m.text}), m.actions && m.actions.length ? h('div', {class:'mact'}, m.actions.map(a => h('button', {type:'button', onclick: e => { e.stopPropagation(); a.fn(); }}, a.label))) : null));
  if (onClick) el.addEventListener('click', onClick);
  return el;
}
function msgSlot(fn){
  const el = h('div', {class:'msgs'});
  let last = '';
  const upd = () => { const ms = fn() || []; const key = JSON.stringify(ms.map(m => [m.level, m.text])); if (key === last) return; last = key; el.replaceChildren(...ms.map(m => msgEl(m))); };
  derived.push(upd); setTimeout(upd);
  return el;
}
function autosize(t){ if (!t || t.tagName !== 'TEXTAREA') return; t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function bindInput(input, obj, key, onInput){
  input.value = obj[key] ?? '';
  input.addEventListener('input', () => { obj[key] = input.value; autosize(input); touch(); onInput && onInput(input.value); });
  derived.push(() => { if (document.activeElement !== input && input.value !== (obj[key] ?? '')){ input.value = obj[key] ?? ''; autosize(input); } });
  return input;
}

    label ? h('label', {class:'flabel', for:id}, label, o.info ? infoBtn(o.info) : null, o.also ? h('span', {class:'also', html:o.also}) : null) : null,
    o.hint ? h('span', {class:'fhint' + (o.teach ? ' teach' : ''), html:o.hint}) : null,

function arcChart(){
  const wrap = h('div', {class:'arcchart'});

    const d = S.develop, arc = d.arc, topCol = arc === 'disillusionment' ? 'var(--tragic)' : 'var(--truth)';

    const Y = b => 86 - b * 72;
    const curve = (pts) => { // catmull-rom → bezier in viewBox 0..1000 x 0..100
      let s = `M${pts[0][0]*10},${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++){
        const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2, t = 6;
        s += ` C${p1[0]*10 + (p2[0]-p0[0])*10/t},${p1[1] + (p2[1]-p0[1])/t} ${p2[0]*10 - (p3[0]-p1[0])*10/t},${p2[1] - (p3[1]-p1[1])/t} ${p2[0]*10},${p2[1]}`;
      }
      return s;
    };
    const main = ARC_BEATS[arc].map((b, i) => [beatPos(BEATS[i]), Y(b[0])]);

/* =====================================================================
   WRITE TAB — Fountain / Slugline-style auto-formatting editor
   ===================================================================== */
const LPP = 55;                                    // printed lines per page
const WIDTH = {scene:60, action:60, character:38, dialogue:35, parenthetical:28, transition:60, centered:60, lyric:50};
const HIDDEN = new Set(['note','section','synopsis','boneyard','pagebreak']);
const SCENE_RE = /^(INT\.?\/EXT|EXT\.?\/INT|INT|EXT|EST|I\/E)(\.|\s)/i;
const TIMES = ['DAY','NIGHT','MORNING','AFTERNOON','EVENING','DUSK','DAWN','CONTINUOUS','LATER','MOMENTS LATER','SAME TIME'];
const ELEMENTS = [['scene','Scene heading'],['action','Action'],['character','Character'],['dialogue','Dialogue'],['parenthetical','Parenthetical'],['transition','Transition'],['centered','Centred'],['lyric','Lyrics'],['section','Section (not printed)'],['synopsis','Synopsis (not printed)'],['note','Note (not printed)'],['blank','(blank line)']];
const ELNAME = Object.fromEntries(ELEMENTS);

function isUpperName(t){
  const s = t.replace(/^@/, '').replace(/\^\s*$/, '').replace(/\([^)]*\)?/g, '').trim();
  return /\p{L}/u.test(s) && s === s.toUpperCase();
}
function classify(lines, caret){
  const n = lines.length, T = new Array(n);
  let dlg = false, bone = false;
  for (let i = 0; i < n; i++){
    const raw = lines[i], t = raw.trim();
    if (bone){ T[i] = 'boneyard'; if (t.includes('*/')) bone = false; continue; }
    if (t.startsWith('/*')){ T[i] = 'boneyard'; if (!t.slice(2).includes('*/')) bone = true; dlg = false; continue; }
    if (t === ''){
      if (dlg && i === caret && raw.length < 2){ T[i] = 'dialogue'; dlg = false; continue; }
      if (dlg && raw.length >= 2){ T[i] = 'dialogue'; continue; }   // Fountain: two spaces keep dialogue going
      T[i] = 'blank'; dlg = false; continue;
    }
    if (dlg){ T[i] = t.startsWith('(') ? 'parenthetical' : 'dialogue'; continue; }
    const prevBlank = i === 0 || lines[i-1].trim() === '';
    const hasNext = i + 1 < n, nextBlank = !hasNext || lines[i+1].trim() === '';
    const nextCaretEmpty = hasNext && caret === i + 1 && lines[i+1].trim() === '';
    if (/^\[\[[\s\S]*\]\]$/.test(t)){ T[i] = 'note'; continue; }
    if (/^={3,}$/.test(t)){ T[i] = 'pagebreak'; continue; }
    if (t.startsWith('#')){ T[i] = 'section'; continue; }
    if (t.startsWith('=')){ T[i] = 'synopsis'; continue; }
    if (t.startsWith('!')){ T[i] = 'action'; continue; }
    if (t.startsWith('~')){ T[i] = 'lyric'; continue; }
    if (t.startsWith('>') && t.endsWith('<') && t.length > 1){ T[i] = 'centered'; continue; }
    if (t.startsWith('>')){ T[i] = 'transition'; continue; }
    if (/^\.[^.]/.test(t)){ T[i] = 'scene'; continue; }
    if (prevBlank && SCENE_RE.test(t)){ T[i] = 'scene'; continue; }
    if (t.startsWith('@')){ T[i] = 'character'; dlg = hasNext && (!nextBlank || nextCaretEmpty); continue; }
    const up = isUpperName(t);
    if (prevBlank && up && /TO:$/.test(t) && nextBlank){ T[i] = 'transition'; continue; }
    if (prevBlank && up && !/:$/.test(t) && hasNext && (!nextBlank || nextCaretEmpty)){ T[i] = 'character'; dlg = true; continue; }
    T[i] = 'action';
  }
  return T;
}
function cleanText(t, type){
  let s = t.replace(/\[\[[\s\S]*?\]\]/g, '').replace(/\*\*|\*|_/g, '');
  s = s.trim();
  if (type === 'scene') s = s.replace(/^\./, '').replace(/\s*#[^#]*#\s*$/, '');
  if (type === 'character') s = s.replace(/^@/, '').replace(/\s*\^$/, '');
  if (type === 'action') s = s.replace(/^!/, '');
  if (type === 'transition') s = s.replace(/^>\s*/, '');
  if (type === 'centered') s = s.replace(/^>\s*/, '').replace(/\s*<$/, '');
  if (type === 'lyric') s = s.replace(/^~\s*/, '');
  return s;
}
function wrapCount(text, w){
  if (!text) return 1;
  let lines = 1, cur = 0;
  for (const word of text.split(/\s+/)){
    let L = word.length;
    if (cur === 0){ while (L > w){ lines++; L -= w; } cur = L; }
    else if (cur + 1 + L <= w) cur += 1 + L;
    else { lines++; while (L > w){ lines++; L -= w; } cur = L; }
  }
  return lines;
}
function cueName(t){ return t.replace(/^@/, '').replace(/\^\s*$/, '').replace(/\([^)]*\)?/g, '').trim().toUpperCase(); }
function parseHeading(t){
  let s = t.trim().replace(/^\./, '').replace(/\s*#[^#]*#\s*$/, '');
  const m = s.match(/^(INT\.?\/EXT\.?|EXT\.?\/INT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s*/i);
  const prefix = m ? m[1].toUpperCase() : '';
  let rest = m ? s.slice(m[0].length) : s;
  let time = '';
  const k = rest.lastIndexOf(' - ');
  if (k >= 0){ time = rest.slice(k + 3).trim().toUpperCase(); rest = rest.slice(0, k); }
  return {prefix, loc: rest.trim().toUpperCase().replace(/[.\s]+$/, ''), time};
}
function parseScript(text, caret=-1){
  const lines = text.split('\n');
  const types = classify(lines, caret);
  const starts = new Array(lines.length + 1);
  let y = 0;
  for (let i = 0; i < lines.length; i++){
    starts[i] = y;
    const t = types[i];
    if (t === 'pagebreak'){ y = Math.ceil(y / LPP) * LPP; continue; }
    if (HIDDEN.has(t)) continue;
    if (t === 'blank'){ if (y % LPP !== 0) y += 1; continue; }
    y += wrapCount(cleanText(lines[i], t), WIDTH[t] || 60);
  }
  starts[lines.length] = y;
  return {lines, types, starts, total: y};
}
const mdLine = (raw) => {
  if (raw === '') return '<br>';
  let s = esc(raw);
  s = s.replace(/^(\s*)(@|!|~|\.(?!\.)|&gt;|=+|#+)/, (m, sp, mk) => `${sp}<span class="fm">${mk}</span>`);

function knownChars(lines, types){
  const set = new Set();
  S.develop.characters.forEach(c => { if (c.name.trim()) set.add(c.name.trim().toUpperCase()); });
  if (lines) lines.forEach((l, i) => { if (types[i] === 'character'){ const n = cueName(l); if (n) set.add(n); } });
  return [...set].sort();
}
function knownLocs(lines, types){
  const set = new Set();
  S.develop.settings.forEach(s => { if (s.name.trim()) set.add(s.name.trim().toUpperCase()); });
  if (lines) lines.forEach((l, i) => { if (types[i] === 'scene'){ const p = parseHeading(l); if (p.loc) set.add(p.loc); } });

}
function locMatches(loc, name){ name = name.trim().toUpperCase(); return loc === name || loc.startsWith(name + ' ') || loc.startsWith(name + ' -') || name.startsWith(loc + ' '); }
function charMatches(cue, name){ name = name.trim().toUpperCase(); return cue === name || cue === name.split(/\s+/)[0] || name === cue.split(/\s+/)[0]; }

/* ---------- script checks ---------- */
function scriptChecks(P){
  const {lines, types, starts, total} = P;
  const out = [];
  const pg = i => Math.floor(starts[i] / LPP) + 1;
  const devChars = S.develop.characters.filter(c => c.name.trim());
  const cues = new Map();
  lines.forEach((l, i) => { if (types[i] === 'character'){ const n = cueName(l); if (n && !cues.has(n)) cues.set(n, i); } });
  const titleCase = n => n.toLowerCase().replace(/(^|[\s'-])\p{L}/gu, m => m.toUpperCase());
  const addChar = n => { const c = newChar('Supporting'); c.name = titleCase(n); S.develop.characters.push(c); };
  const unknownCues = [...cues].filter(([n]) => !devChars.some(c => charMatches(n, c.name)));
  if (unknownCues.length > 3) out.push({level:'tip', line:unknownCues[0][1], text:`${unknownCues.length} speaking characters aren't in your Develop characters: <b>${unknownCues.map(x => esc(x[0])).join(', ')}</b>.`, actions:[{label:'Add them all to characters', fn: () => { unknownCues.forEach(([n]) => addChar(n)); touch(); toast(unknownCues.length + ' characters added to Develop'); }}]});
  else for (const [n, i] of unknownCues) out.push({level:'tip', line:i, text:`<b>${esc(n)}</b> speaks (p.${pg(i)}) but isn't in your Develop characters.`, actions:[{label:'Add to characters', fn: () => { addChar(n); touch(); toast(titleCase(n) + ' added to Develop › Characters'); }}]});
  const hasScene = types.includes('scene');
  if (hasScene && total > LPP * 0.6){
    const body = lines.join('\n').toUpperCase();
    devChars.forEach(c => { const first = c.name.trim().split(/\s+/)[0].toUpperCase(); if (first.length > 1 && ![...cues.keys()].some(n => charMatches(n, c.name)) && !new RegExp('\\b' + first.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b').test(body)) out.push({level:'tip', text:`<b>${esc(c.name)}</b> is in your Develop characters but doesn't appear in the script yet.`}); });
  }
  const seenLoc = new Set(), newLocs = [], noTime = [];
  lines.forEach((l, i) => {
    if (types[i] !== 'scene') return;
    const p = parseHeading(l);
    if (p.loc && !seenLoc.has(p.loc)){ seenLoc.add(p.loc); if (!S.develop.settings.some(s => s.name.trim() && locMatches(p.loc, s.name))) newLocs.push([p, i]); }
    if (p.prefix && !p.time) noTime.push(i);
  });
  const addLoc = p => S.develop.settings.push({id:uid(), name:p.loc, ie: p.prefix.startsWith('EXT') ? 'EXT.' : p.prefix.includes('/') ? 'INT./EXT.' : 'INT.', desc:''});
  if (newLocs.length > 3) out.push({level:'tip', line:newLocs[0][1], text:`${newLocs.length} locations aren't in your Develop settings: <b>${newLocs.slice(0, 8).map(x => esc(x[0].loc)).join(', ')}</b>${newLocs.length > 8 ? ` and ${newLocs.length - 8} more` : ''}.`, actions:[{label:'Add them all to settings', fn: () => { newLocs.forEach(([p]) => addLoc(p)); touch(); toast(newLocs.length + ' settings added to Develop'); }}]});
  else newLocs.forEach(([p, i]) => out.push({level:'tip', line:i, text:`Location <b>${esc(p.loc)}</b> isn't in your Develop settings.`, actions:[{label:'Add to settings', fn: () => { addLoc(p); touch(); toast(p.loc + ' added to Develop › Settings'); }}]}));
  if (noTime.length) out.push({level:'tip', line:noTime[0], text:`${noTime.length === 1 ? 'A scene heading' : noTime.length + ' scene headings'} (first on p.${pg(noTime[0])}) ${noTime.length === 1 ? 'has' : 'have'} no time of day. Most headings end with one, e.g. <code>- DAY</code> or <code>- NIGHT</code>.`});
  // long action paragraphs & monologues
  let i = 0;
  while (i < lines.length){
    if (types[i] === 'action'){
      let j = i, L = 0; while (j < lines.length && types[j] === 'action'){ L += starts[j+1] - starts[j]; j++; }
      if (L > 4) out.push({level:'tip', line:i, text:`Action paragraph on p.${pg(i)} runs ${L} lines. Try to keep action to about four lines at most; a new paragraph often implies a new shot and keeps the read fast.`});
      i = j; continue;
    }
    if (types[i] === 'character'){
      let j = i + 1, L = 0; while (j < lines.length && (types[j] === 'dialogue' || types[j] === 'parenthetical')){ if (types[j] === 'dialogue') L += starts[j+1] - starts[j]; j++; }
      if (L > 8) out.push({level:'tip', line:i, text:`${esc(cueName(lines[i]))}'s speech on p.${pg(i)} runs ${L} lines. Long speeches can stall a scene. Could it be shorter, broken up, or shown instead of told?`});
      i = j; continue;
    }
    i++;
  }
  const nBlocks = types.filter(t => t === 'character').length;
  const nPar = types.filter(t => t === 'parenthetical').length;
  if (nBlocks >= 6 && nPar / nBlocks > 0.4) out.push({level:'tip', text:`${nPar} parentheticals across ${nBlocks} speeches is a lot. Use them sparingly, only when the delivery isn't clear from context. Let the actor (and the dialogue) do the work.`});
  const weSee = []; const cam = [];
  const CAM = /\b(CLOSE[- ]?UP|EXTREME CLOSE|ZOOMS?|PANS?|TRACKING SHOT|WIDE SHOT|MEDIUM SHOT|LONG SHOT|ANGLE ON|DOLLY|CRANE SHOT|CUTAWAY)\b/;
  lines.forEach((l, i) => { if (types[i] !== 'action') return; if (/\bwe (see|hear|watch|notice|follow|pan|zoom)\b/i.test(l)) weSee.push(i); if (CAM.test(l) || /\bthe camera\b/i.test(l)) cam.push(i); });
  if (weSee.length) out.push({level:'tip', line:weSee[0], text:`“We see / we hear” appears ${weSee.length} time${weSee.length > 1 ? 's' : ''} (first on p.${pg(weSee[0])}). Usually you can just describe what happens: not “We see Mia run”, but “Mia runs.”`});
  if (cam.length) out.push({level:'tip', line:cam[0], text:`Camera directions found (first on p.${pg(cam[0])}). A spec script usually leaves shots to the director. Suggest them through how you write the action instead.`});
  const firstEl = types.findIndex(t => !['blank','note','section','synopsis','boneyard'].includes(t));
  if (firstEl >= 0 && types[firstEl] !== 'scene' && !/^FADE IN/i.test(lines[firstEl].trim()) && total > 10) out.push({level:'tip', line:firstEl, text:'Your script doesn\'t open with a scene heading. Most scripts start with one (e.g. <code>EXT. BEACH - DAY</code>), sometimes after <code>FADE IN:</code>.'});
  const tp = targetPages(), pages = total / LPP;
  if (tp && pages > tp * 1.1) out.push({level:'warn', text:`Your script is about <b>${pages.toFixed(1)} pages</b>, which is over your target of ${tp}. Every page is roughly a minute on screen.`});
  if (tp && seenLoc.size > locThreshold(tp)) out.push({level:'tip', text:`${seenLoc.size} different locations in a ${tp}-page script could be tough to shoot. Could any scenes share a location?`});
  const nChars = cues.size;
  if (tp && nChars > charThreshold(tp)) out.push({level:'warn', text:`${nChars} speaking characters is a lot for ${tp} pages. Are they all necessary, or could any be merged?`});
  return out;
}

          h('div', {class:'small muted'}, new Date(d.savedAt).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'}) + ' · ≈ ' + pagesOf(d.text).toFixed(1) + ' pages')),
        h('button', {class:'btn sm', title:'Load this draft into the editor to keep working on it', onclick: () => guardThen(() => { close && close(); loadIntoEditor(d.text, d.id, `Now editing “${d.name}”. Save as a new draft when you want to keep a version.`); }, `Opening “${d.name}” will replace it in the editor.`)}, 'Open'),
        h('button', {class:'btn sm ghost', title:'Make a copy of this draft', onclick: () => { const c = {id:uid(), name: d.name + ' (copy)', savedAt: Date.now(), text: d.text}; S.drafts.push(c); touch(); draw(); runDerived(); }}, 'Duplicate'),
        h('button', {class:'btn sm ghost', title:'Rename', onclick: () => { const inp = h('input', {class:'inp', value:d.name}); modal('Rename draft', inp, [{label:'Cancel'}, {label:'Rename', primary:true, fn: () => { d.name = inp.value.trim() || d.name; touch(); draw(); }}]); setTimeout(() => inp.focus(), 30); }}, 'Rename'),
        h('button', {class:'btn sm ghost icon', title:'Delete draft', onclick: () => confirmBox('Delete draft?', `“${d.name}” will be deleted from this project.`, 'Delete', () => { S.drafts.splice(S.drafts.indexOf(d), 1); if (S.script.basedOn === d.id) S.script.basedOn = ''; touch(); draw(); runDerived(); })}, svgIcon(IC.trash)));
    }) : [h('div', {class:'empty'}, 'No drafts yet. Use “Save as draft” to keep a snapshot of your script.')]));
  };
  draw();
  close = modal('Script drafts', h('div', null,
    h('p', null, 'Snapshots of your script, saved inside this project (so they go into your backups too). ', h('b', null, 'Open'), ' loads one into the editor to keep working on it; ', h('b', null, 'Duplicate'), ' makes a copy to branch off from.'),
    h('div', {class:'row', style:'gap:8px'},
      h('button', {class:'btn sm primary', onclick: () => { close(); saveDraftPrompt(); }}, '+ Save current script as a draft'),
      h('button', {class:'btn sm', onclick: () => guardThen(() => { close(); loadIntoEditor('', '', 'Blank page ready. Your drafts are all still saved.'); }, 'Starting a blank page will clear the editor.')}, 'Start a blank page')),
    list));
}

  modal('How auto-formatting works', h('div', null,
    h('p', null, 'Just type. The page works out what each line is from the way you write it (the same plain-text approach used by Slugline, Highland and the Fountain format). Use the element menu in the toolbar if it ever guesses wrong.'),
    h('table', {class:'syntax'},
      row('Scene heading', 'Start a line with <code>INT.</code> <code>EXT.</code> <code>EST.</code> <code>INT./EXT.</code> or <code>I/E</code> after a blank line.', 'Force any line with a full stop: <code>.FLASHBACK</code>'),
      row('Character', 'A name in <b>ALL CAPS</b> on its own line (after a blank line), then press <span class="kbd">Enter</span>. If you keep typing on the same line instead, it stays as action.', '<code>MARY (V.O.)</code> · force mixed case with @: <code>@McCLANE</code>'),
      row('Dialogue', 'Just type on the line straight after the character name.', ''),
      row('Parenthetical', 'Inside dialogue, start a line with <code>(</code>', '<code>(whispering)</code>'),
      row('Transition', 'CAPS ending in <code>TO:</code> on its own line', '<code>CUT TO:</code> · or force with &gt;: <code>&gt;FADE OUT.</code>'),
      row('Centred', 'Wrap in &gt; &lt;', '<code>&gt;THE END&lt;</code>'),
      row('Action', 'Anything else. Force a line to be action with <code>!</code>', '<code>!BANG!</code>'),
      row('Dual dialogue', 'Add <code>^</code> after the <i>second</i> character\'s name', '<code>JOHN ^</code>'),
      row('Emphasis', '<code>*italic*</code> <code>**bold**</code> <code>_underline_</code>', '<span class="kbd">Ctrl</span>+<span class="kbd">I</span> / <span class="kbd">B</span> / <span class="kbd">U</span>'),
      row('Notes', '<code>[[like this]]</code>: never printed', ''),
      row('Sections', '<code># Act One</code>: your own signposts; never printed, listed in Scenes', ''),
      row('Synopsis', '<code>= A one-line summary</code>: never printed', ''),
      row('Boneyard', '<code>/* hide text */</code>: not printed or counted (great for cut material)', ''),
      row('Page break', '<code>===</code> on its own line', ''),
      row('Lyrics', 'Start a line with <code>~</code>', ''),
      row('Scene numbers', 'Add <code>#1#</code> at the end of a heading', '')),
    h('p', {style:'margin-top:14px'}, h('b', null, 'Smart Enter'), ' (on by default) adds the blank line for you after headings, action and speeches, so you can just keep typing. ', h('span', {class:'kbd'}, 'Shift'), '+', h('span', {class:'kbd'}, 'Enter'), ' gives a plain new line. ', h('span', {class:'kbd'}, 'Tab'), ' accepts a suggested character name, location or time of day.')));
}

/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
function currentScript(){ flushEditor && flushEditor(); return parseScript(S.script.text); }
function exportFountain(){
  const P = currentScript();
  const tp = [`Title: ${S.title || 'Untitled'}`, 'Credit: Written by', `Author: ${S.author || ''}`];
  if (S.contact) tp.push(`Contact: ${S.contact}`);
  tp.push(`Draft date: ${new Date().toLocaleDateString('en-GB')}`);
  download(`${slug(S.title)}_${stamp(new Date())}.fountain`, tp.join('\n') + '\n\n' + P.lines.join('\n') + '\n', 'text/plain');
}
function exportFDX(){
  const P = currentScript();
  const X = s => esc(s).replace(/'/g, '&apos;');
  const map = {scene:'Scene Heading', action:'Action', character:'Character', dialogue:'Dialogue', parenthetical:'Parenthetical', transition:'Transition', centered:'Action', lyric:'Dialogue'};
  let body = '';
  P.lines.forEach((l, i) => { const t = P.types[i]; if (!map[t]) return; const tx = cleanText(l, t); if (t === 'dialogue' && !tx) return; body += `    <Paragraph Type="${map[t]}"${t === 'centered' ? ' Alignment="Center"' : ''}><Text>${X(t === 'scene' || t === 'transition' ? tx.toUpperCase() : tx)}</Text></Paragraph>\n`; });
  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n<FinalDraft DocumentType="Script" Template="No" Version="5">\n  <Content>\n${body}  </Content>\n  <TitlePage>\n    <Content>\n      <Paragraph Alignment="Center"><Text>${X((S.title || 'Untitled').toUpperCase())}</Text></Paragraph>\n      <Paragraph Alignment="Center"><Text>Written by</Text></Paragraph>\n      <Paragraph Alignment="Center"><Text>${X(S.author || '')}</Text></Paragraph>\n    </Content>\n  </TitlePage>\n</FinalDraft>\n`;
  download(`${slug(S.title)}_${stamp(new Date())}.fdx`, xml, 'application/xml');
}
function emph(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/(^|\W)_(.+?)_(?=\W|$)/g, '$1<u>$2</u>'); }
function printScript(){
  const P = currentScript();
  const root = h('div', {id:'print'});
  root.append(h('div', {class:'tp'}, h('div', null, h('div', {class:'tt'}, S.title || 'Untitled'), h('div', {class:'cr'}, 'Written by'), h('div', {class:'cr'}, S.author || '')), h('div', {class:'ct'}, S.contact || '')));
  const L = P.lines, T = P.types;
  const para = (cls, txt) => h('p', {class:cls, html: emph(txt) || '&nbsp;'});
  let i = 0;
  const block = (start) => { // character + dialogue block
    const box = h('div', {class:'blk'}); let j = start;
    box.append(para('chr', cleanText(L[j], 'character').toUpperCase())); j++;
    while (j < L.length && (T[j] === 'dialogue' || T[j] === 'parenthetical')){ const tx = cleanText(L[j], T[j]); if (tx || T[j] === 'parenthetical') box.append(para(T[j] === 'dialogue' ? 'dlg' : 'par', tx)); j++; }
    return [box, j];
  };
  while (i < L.length){
    const t = T[i];
    if (t === 'character'){
      const [box, j] = block(i);
      // dual dialogue: next block's cue ends with ^
      let k = j; while (k < L.length && T[k] === 'blank') k++;
      if (k < L.length && T[k] === 'character' && /\^\s*$/.test(L[k])){ const [box2, j2] = block(k); root.append(h('div', {class:'dual'}, box, box2)); i = j2; continue; }
      root.append(box); i = j; continue;
    }
    if (t === 'scene') root.append(para('sc', cleanText(L[i], t)));
    else if (t === 'action') root.append(para('act', cleanText(L[i], t)));
    else if (t === 'transition') root.append(para('tr', cleanText(L[i], t)));
    else if (t === 'centered') root.append(para('cen', cleanText(L[i], t)));
    else if (t === 'lyric') root.append(para('ly', cleanText(L[i], t)));
    else if (t === 'pagebreak') root.append(h('div', {class:'pb'}));
    i++;
  }
  // collapse consecutive actions spacing: action lines directly following action get no top margin
  $$('p.act', root).forEach(p => { const prev = p.previousElementSibling; if (prev && prev.classList.contains('act')) p.style.marginTop = '0'; });
  $('#print')?.remove();
  $('#layer').append(root);
  const done = () => { root.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 50);
}
function importFountain(){
  const inp = h('input', {type:'file', accept:'.fountain,.txt,.spmd,text/plain', style:'display:none'});
  inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let text = String(rd.result).replace(/\r\n?/g, '\n');
      let title = '', author = '';
      const lines = text.split('\n');
      if (/^\s*[A-Za-z ]+:/.test(lines[0] || '')){
        let k = 0; while (k < lines.length && lines[k].trim() !== ''){ const m = lines[k].match(/^\s*([A-Za-z ]+):\s*(.*)$/); if (m){ const key = m[1].toLowerCase(); if (key === 'title') title = m[2].replace(/[_*]/g, ''); if (key === 'author' || key === 'authors') author = m[2]; } k++; }
        text = lines.slice(k + 1).join('\n');
      }
      confirmBox('Replace your script?', `This will replace the script in the Write tab with “${f.name}”. (Your Develop and Outline work is untouched. )`, 'Replace script', () => {
        S.script.text = text.replace(/^\n+/, ''); if (title && !S.title) S.title = title; if (author && !S.author) S.author = author;
        touch(); saveLocal(); renderAll(); toast('Script imported.');
      });
    };
    rd.readAsText(f);
  });
  document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
}

/* =====================================================================
   START
   ===================================================================== */
applyTheme();
renderAll();
if (!S.savedAt){ S.savedAt = Date.now(); }
saveLocal();
})();
</script>
