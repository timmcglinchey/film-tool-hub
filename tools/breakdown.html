<html lang="en">
<head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

:root{--fth-cat:#f5b14c;--fth-accent:#f5b14c;--fth-accent-ink:#f5b14c;--fth-accent-soft:rgba(245,177,76,0.14);--fth-accent-line:rgba(245,177,76,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#8e672c;--fth-accent-ink:#8e672c;--fth-accent-soft:rgba(245,177,76,0.16);--fth-accent-line:rgba(245,177,76,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Breakdown</title>
<style>
:root{
  --bg:#0f1013; --bg2:#0a0b0d; --panel:#16181d; --panel2:#1d2027; --field:#1f2229;
  --line:#272b33; --line2:#383e48;
  --fg:#f0ece5; --muted:#9aa0aa; --faint:#6b717b;
  --accent:#ffb547; --accent-ink:#1a1206; --accent-soft:rgba(255,181,71,.12);
  --shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f3f0ea; --bg2:#e4e0d8; --panel:#ffffff; --panel2:#f4f1ea; --field:#f7f4ee;
  --line:#e3ded4; --line2:#cfc8bb;
  --fg:#16181c; --muted:#565c66; --faint:#878c95;
  --accent:#a35f00; --accent-ink:#ffffff; --accent-soft:rgba(163,95,0,.09);
  --shadow:0 14px 30px -16px rgba(70,50,20,.28);
  color-scheme:light;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 10px;flex:none}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:4px}
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:0;font-stretch:72%;font-weight:800;font-size:25px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.proj{flex:1;min-width:160px;max-width:360px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--field)}
.proj::placeholder{color:var(--faint)}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px}
.btn.ghost{background:none}
.btn.danger{color:#ff8f7a}
.btn svg{width:15px;height:15px;flex:none}
.ib{width:30px;height:30px;padding:0;justify-content:center}

/* toolbar */
.tb{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 18px 10px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex:none}
.grp{display:flex;align-items:center;gap:6px}
.zv{font:600 12px var(--mono);min-width:44px;text-align:center}
.vsep{width:1px;height:22px;background:var(--line2)}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--accent);width:15px;height:15px}
.stat{font:500 11.5px var(--mono);color:var(--muted)}
.activeChip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:650;background:var(--field);border:1px solid var(--line2)}
.activeChip i{width:11px;height:11px;border-radius:3px;display:block}
.tb .sp{flex:1}

/* work area */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;padding:0 18px 16px}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr) 320px}}
#viewer{position:relative;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;min-height:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 24px 60px}
.page{position:relative;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .lyr{position:absolute;inset:0;pointer-events:none}
.page .hl i{position:absolute;mix-blend-mode:multiply;border-radius:2px}
.page .hl i.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{outline:3px solid #111;outline-offset:2px}}
.page .sel i{position:absolute;outline:1.5px dashed #222;background:rgba(0,0,0,.06);border-radius:2px}
.page .ml b{position:absolute;font:700 8.5px/1 var(--mono);padding:2px 4px 2px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.nolabels .page .ml{display:none}
.page .pn{position:absolute;right:-2px;bottom:-17px;font:500 10.5px var(--mono);color:var(--faint);pointer-events:none}
.armed .page{cursor:text}
.page .sh{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,170,40,.0)}

/* empty / drop */
.drop{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.drop .box{max-width:520px;text-align:center;border:1.5px dashed var(--line2);border-radius:18px;padding:38px 30px;background:var(--panel);cursor:pointer;transition:border-color .2s,background .2s}
.drop .box:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{margin:14px 0 6px;font-stretch:80%;font-weight:750;font-size:25px}
.drop p{margin:0 0 4px;color:var(--muted)}
.drop .bars{display:flex;flex-direction:column;gap:6px;align-items:center}
.drop .bars i{display:block;height:7px;border-radius:3px}
.resume{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:default}
.resume div{flex:1;min-width:180px;font-size:13px}
.resume small{display:block;color:var(--muted);font:500 11px var(--mono)}
.busy{position:absolute;inset:0;display:grid;place-items:center;font-weight:650;color:var(--muted)}

/* side panel */
#panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ptabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex:none}
.ptabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:650;color:var(--muted)}
.ptabs button:hover{color:var(--fg)}
.ptabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.ptabs .n{font:500 10.5px var(--mono);opacity:.7;margin-left:4px}
.pbody{flex:1;overflow:auto;padding:12px 12px 20px}
.ph{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 2px 9px;display:flex;align-items:center;gap:8px}
.ph .r{margin-left:auto;letter-spacing:.04em;text-transform:none;font-weight:500}
.phint{font-size:12px;color:var(--muted);margin:0 2px 10px}

.cats{display:grid;gap:4px}
.cat{display:grid;grid-template-columns:16px 1fr auto auto 24px;gap:9px;align-items:center;width:100%;text-align:left;padding:7px 6px 7px 9px;border-radius:9px;border:1px solid transparent;background:none}
.cat:hover{background:var(--panel2)}
.cat.on{background:var(--accent-soft);border-color:var(--accent)}
.cat .sw{width:16px;height:16px;border-radius:4px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cat .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ct{font:500 11px var(--mono);color:var(--muted)}
.cat kbd,kbd{font:500 10.5px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--field);color:var(--muted)}
.cat .ed{width:24px;height:24px;border-radius:6px;border:0;background:none;color:var(--faint);display:grid;place-items:center}
.cat .ed:hover{background:var(--field);color:var(--fg)}
.cat .ed svg{width:14px;height:14px}
.catedit{display:grid;gap:8px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);margin:2px 0 6px}
.catedit .row{display:flex;gap:8px;align-items:center}
.catedit label{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px;flex:1}
.fi{height:32px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);background:var(--field);width:100%;font-size:13px}
.fi.code{text-transform:uppercase;font-family:var(--mono)}
input[type=color]{width:42px;height:32px;padding:2px;border-radius:7px;border:1px solid var(--line2);background:var(--field)}
textarea.fi{height:auto;min-height:54px;padding:7px 9px;resize:vertical;line-height:1.4}
.addcat{margin-top:8px;width:100%;justify-content:center;border-style:dashed}
.auto{margin-top:16px;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.auto b{display:block;font-size:13.5px;margin-bottom:3px}
.auto p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.keys{margin-top:14px;font-size:12px;color:var(--muted);display:grid;gap:5px}

.search{position:sticky;top:-12px;z-index:2;background:var(--panel);padding:0 0 10px;margin-top:-2px}
.igroup{margin-bottom:14px}
.ihead{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px solid var(--c);margin-bottom:4px}
.ihead i{width:12px;height:12px;border-radius:3px;background:var(--c);display:block}
.ihead b{font-size:13.5px}
.ihead span{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.item{border-radius:8px}
.item>button{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;background:none;padding:6px 6px;border-radius:8px}
.item>button:hover{background:var(--panel2)}
.item .in{font-weight:600;font-size:13px}
.item .im{font:500 11px var(--mono);color:var(--muted);text-align:right}
.item .is{grid-column:1/-1;font:400 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .inote{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-style:italic}
.item.open{background:var(--panel2);margin:4px 0}

<script>
'use strict';
/* ═════════════ constants ═════════════ */
const DEFAULT_CATS = [
  ['cast', 'Cast', 'CAST', '#E53935'],
  ['extras', 'Extras / Background', 'EXTRA', '#43A047'],
  ['stunts', 'Stunts', 'STUNT', '#FB8C00'],
  ['sfx', 'Special Effects', 'SFX', '#1E88E5'],
  ['props', 'Props', 'PROP', '#8E24AA'],
  ['vehicles', 'Vehicles', 'VEH', '#EC407A'],
  ['animals', 'Animals', 'ANML', '#F48FB1'],
  ['wardrobe', 'Wardrobe', 'WARD', '#00897B'],
  ['makeup', 'Makeup & Hair', 'MU/H', '#FDD835'],
  ['sound', 'Sound & Music', 'SND', '#8D6E63'],
  ['setdress', 'Set Dressing', 'SET', '#78909C'],
  ['vfx', 'Visual Effects', 'VFX', '#26C6DA'],
  ['equip', 'Special Equipment', 'EQUIP', '#5C6BC0']
].map(([id, name, code, color]) => ({ id, name, code, color }));
const KEYS = '1234567890';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDFLIB = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';

/* ═════════════ state ═════════════ */
const S = {
  fileName: '', bytes: null, pdf: null,
  pages: [], words: [], lines: [], scenes: [], lineScene: null,
  cats: DEFAULT_CATS.map(c => ({ ...c })), tags: [], notes: {},
  active: null, zoom: 1, fit: 1, labels: true, tab: 'tag', editCat: null, openItem: null, q: ''
};
const undoS = [], redoS = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
let toastT;
function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const catById = id => S.cats.find(c => c.id === id);
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const inkOn = h => lum(h) > .42 ? '#111' : '#fff';
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };

function loadScript(src, test) {
  if (test()) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => test() ? res() : rej(new Error('load')); s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
}

/* ═════════════ text model ═════════════ */
const isCaps = s => /[A-Z]/.test(s) && !/[a-z]/.test(s);
const titleCase = s => s.toLowerCase().replace(/(^|[\s\-/(“"'])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
function cleanText(t) {
  return t.replace(/^[\s"'“”‘’(\[{,.;:!?—–\-…]+|[\s"'“”‘’)\]},.;:!?—–\-…]+$/g, '');
}
function defaultItem(t) {
  let s = cleanText(t).replace(/[’']s$/i, '');
  if (!s) s = t.trim();
  return isCaps(s) ? titleCase(s) : s.charAt(0).toUpperCase() + s.slice(1);
}

async function extract(pdf) {
  const pages = [], words = [], lines = [];
  for (let p = 0; p < pdf.numPages; p++) {
    const page = await pdf.getPage(p + 1);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const items = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const tr = it.transform, fs = Math.hypot(tr[2], tr[3]) || Math.hypot(tr[0], tr[1]) || 12;
      if (Math.abs(tr[1]) > 0.01 * fs) continue; // skip rotated text (watermarks etc.)
      items.push({ x: tr[4], y: tr[5], w: it.width || fs * 0.6 * it.str.length, fs, str: it.str });
    }
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const r = rows.find(r => Math.abs(r.y - it.y) < Math.max(r.fs, it.fs) * 0.45);
      if (r) { r.items.push(it); r.fs = Math.max(r.fs, it.fs); } else rows.push({ y: it.y, fs: it.fs, items: [it] });
    }
    rows.sort((a, b) => b.y - a.y);
    const pg = { w: vp.width, h: vp.height, tf: vp.transform.slice(), lines: [], H: page.view[3] - page.view[1], y0: page.view[1] };
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      const chars = []; let prevEnd = null;
      for (const it of r.items) {
        const cw = it.w / it.str.length;
        if (prevEnd !== null && it.x - prevEnd > cw * 0.3) chars.push({ c: ' ' });
        for (let k = 0; k < it.str.length; k++) chars.push({ c: it.str[k], x: it.x + k * cw, w: cw });
        prevEnd = it.x + it.w;
      }
      const a = words.length; let cur = null;
      for (const ch of chars) {
        if (!ch.c.trim()) { if (cur) { words.push(cur); cur = null; } continue; }
        if (!cur) cur = { p, x: ch.x, y: r.y, w: ch.w, h: r.fs, s: ch.c, l: lines.length };
        else { cur.s += ch.c; cur.w = ch.x + ch.w - cur.x; }
      }
      if (cur) words.push(cur);
      if (words.length === a) continue;
      const ln = { p, y: r.y, h: r.fs, a, b: words.length - 1, x0: words[a].x, text: words.slice(a).map(w => w.s).join(' ') };
      pg.lines.push(lines.length); lines.push(ln);
    }
    pages.push(pg);
  }
  return { pages, words, lines };
}

/* scene headings, scene numbers, eighths */
const HEAD_RE = /^(?:(\d+[A-Z]{0,2})\.?\s+)?((?:INT|EXT|EST|I\/E|INT\.?\s?\/\s?EXT|EXT\.?\s?\/\s?INT)[.\s].*?)(?:\s+(\d+[A-Z]{0,2})\.?)?$/;
function detectScenes() {
  const scenes = [], ls = new Int32Array(S.lines.length).fill(-1);
  let seq = 0;
  S.lines.forEach((ln, i) => {
    const m = ln.text.match(HEAD_RE);
    if (m && isCaps(m[2]) && m[2].length < 120) {
      seq++;
      const heading = m[2].replace(/\s+/g, ' ').trim();
      const ie = (heading.match(/^(INT\.?\s?\/\s?EXT|EXT\.?\s?\/\s?INT|I\/E|INT|EXT|EST)/) || [''])[0].replace(/\s/g, '').replace(/\.$/, '');
      let rest = heading.slice(ie.length).replace(/^[.\s]+/, '');
      let tod = '';
      const dm = rest.match(/\s[-–—]+\s*([^-–—]+)$/);
      if (dm) { tod = dm[1].trim(); rest = rest.slice(0, dm.index).trim(); }
      scenes.push({ n: m[1] || m[3] || String(seq), heading, ie, loc: rest, tod, line: i, p: ln.p });
    }
    ls[i] = scenes.length - 1;
  });
  // page extent + eighths
  scenes.forEach((sc, k) => {
    const end = k + 1 < scenes.length ? scenes[k + 1].line - 1 : S.lines.length - 1;
    sc.p1 = S.lines[end] ? S.lines[end].p : sc.p;
    let e = 0;
    for (let p = sc.p; p <= sc.p1; p++) {
      const pg = S.pages[p], top = pg.y0 + pg.H - 72, bottom = pg.y0 + 72, usable = Math.max(1, pg.H - 144);
      const t = p === sc.p ? Math.min(top, S.lines[sc.line].y + S.lines[sc.line].h) : top;
      const nx = scenes[k + 1];
      const b = nx && nx.p === p ? S.lines[nx.line].y + S.lines[nx.line].h : bottom;
      e += Math.max(0, t - b) / usable * 8;
    }
    sc.eighths = Math.max(1, Math.round(e));
  });
  S.scenes = scenes; S.lineScene = ls;
}
const fmtEighths = e => { const w = Math.floor(e / 8), r = e % 8; return (w ? w + (r ? ' ' : '') : '') + (r ? r + '/8' : '') || '0'; };
const sceneOfWord = i => S.scenes[S.lineScene[S.words[i].l]] || null;
const pageLabel = sc => sc.p === sc.p1 ? `p. ${sc.p + 1}` : `pp. ${sc.p + 1}–${sc.p1 + 1}`;

/* ═════════════ undo / persistence ═════════════ */
const snap = () => JSON.stringify({ cats: S.cats, tags: S.tags, notes: S.notes });
function commit() { undoS.push(snap()); if (undoS.length > 150) undoS.shift(); redoS.length = 0; }
function restore(js) { const o = JSON.parse(js); S.cats = o.cats; S.tags = o.tags; S.notes = o.notes; if (S.active && !catById(S.active)) S.active = null; changed(); }
function undo() { if (!undoS.length) return; redoS.push(snap()); restore(undoS.pop()); toast('Undone'); }
function redo() { if (!redoS.length) return; undoS.push(snap()); restore(redoS.pop()); toast('Redone'); }

const DB = { open() { return new Promise((res, rej) => { try { const r = indexedDB.open('script-breakdown', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k) { const d = await this.open(); return new Promise(res => { const q = d.transaction('s').objectStore('s').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async put(k, v) { const d = await this.open(); return new Promise(res => { const t = d.transaction('s', 'readwrite'); t.objectStore('s').put(v, k); t.oncomplete = res; t.onerror = res; }); },
  async del(k) { const d = await this.open(); return new Promise(res => { const t = d.transaction('s', 'readwrite'); t.objectStore('s').delete(k); t.oncomplete = res; t.onerror = res; }); } };
let saveT;
function autosave() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { if (!S.bytes) return; DB.put('last', { bytes: S.bytes, fileName: S.fileName, title: $('#proj').value, cats: S.cats, tags: S.tags, notes: S.notes, labels: S.labels, saved: Date.now() }).catch(() => {}); }, 700);
}

/* ═════════════ loading ═════════════ */
async function openPdf(bytes, fileName, saved) {
  showBusy('Reading script…');
  try {
    await loadScript(PDFJS, () => window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  } catch (e) { showEmpty(); toast('Couldn’t load the PDF reader — check your internet connection.', 5000); return; }
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise; }
  catch (e) { showEmpty(); toast('That PDF couldn’t be opened. Is it password-protected or damaged?', 5000); return; }
  const ex = await extract(pdf);
  Object.assign(S, { pdf, bytes, fileName, ...ex });
  detectScenes();
  if (saved) {
    S.cats = saved.cats || S.cats; S.tags = (saved.tags || []).filter(t => t.a >= 0 && t.b < S.words.length); S.notes = saved.notes || {};
    S.labels = saved.labels !== false; $('#proj').value = saved.title || '';
  } else {
    S.cats = DEFAULT_CATS.map(c => ({ ...c })); S.tags = []; S.notes = {};
    let t = ''; try { const md = await pdf.getMetadata(); t = md?.info?.Title || ''; } catch (e) {}
    $('#proj').value = (t && !/untitled|\.fdx|microsoft/i.test(t) ? t : fileName.replace(/\.pdf$/i, '')).trim();
  }
  undoS.length = 0; redoS.length = 0; S.active = S.active && catById(S.active) ? S.active : null;
  buildPages();
  ['#saveBtn', '#csvBtn', '#pdfBtn'].forEach(s => $(s).disabled = false);
  changed(true);
  if (S.words.length < 30) toast('This PDF has almost no selectable text — it may be a scan. Export a text PDF from your screenwriting app.', 7000);
  else if (!S.scenes.length) toast('No scene headings (INT./EXT.) were found, so items will list without scene numbers.', 6000);
  else if (!saved) toast(`Loaded ${S.pages.length} pages · ${S.scenes.length} scenes. Pick a category, then drag across words to tag.`, 4500);
}
async function openFile(f) {
  if (!f) return;
  if (/\.json$/i.test(f.name) || f.type === 'application/json') {
    let d; try { d = JSON.parse(await f.text()); } catch (e) { toast('That file isn’t a readable project.'); return; }
    if (d.app !== 'script-breakdown' || !d.pdf) { toast('That .json wasn’t saved from Script Breakdown.'); return; }
    const bin = atob(d.pdf), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    await openPdf(u, d.fileName || 'script.pdf', d); toast(`Opened ${d.title ? '“' + d.title + '”' : 'project'} · ${d.tags.length} tags`);
    return;
  }
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { toast('Please choose a screenplay PDF (or a saved .json project).'); return; }
  await openPdf(new Uint8Array(await f.arrayBuffer()), f.name);
}

/* ═════════════ viewer ═════════════ */
const viewer = $('#viewer'), pagesEl = $('#pages');
let io, renderGen = 0;
function showBusy(msg) { pagesEl.innerHTML = ''; viewer.querySelector('.drop')?.remove(); viewer.querySelector('.busy')?.remove(); const b = document.createElement('div'); b.className = 'busy'; b.textContent = msg; viewer.appendChild(b); }
async function showEmpty() {
  viewer.querySelector('.busy')?.remove(); pagesEl.innerHTML = '';
  let last = null; try { last = await DB.get('last'); } catch (e) {}
  const d = document.createElement('div'); d.className = 'drop';
  d.innerHTML = `<div class="box" data-pick tabindex="0" role="button">
    <div class="bars"><i style="width:120px;background:#E53935"></i><i style="width:170px;background:#8E24AA"></i><i style="width:90px;background:#1E88E5"></i><i style="width:140px;background:#00897B"></i></div>
    <h3>Drop a screenplay PDF</h3>

/* ═════════════ auto cast ═════════════ */
const NOT_CUE = /^(FADE|CUT|DISSOLVE|SMASH|MATCH|THE END|CONTINUED|\(CONTINUED\)|CONT'D|MORE|\(MORE\)|BACK TO|INTERCUT|END OF|TITLE|SUPER|INSERT|LATER|MONTAGE|FLASHBACK|OVER BLACK|BLACK|TO BE CONTINUED|FREEZE)/;
function autoCast() {
  if (!S.pdf) return;
  // estimate the action margin: most common left edge of long mixed-case lines
  const hist = new Map();
  S.lines.forEach(l => { if (/[a-z]/.test(l.text) && l.text.length > 35) { const k = Math.round(l.x0 / 6) * 6; hist.set(k, (hist.get(k) || 0) + 1); } });
  let actionX = null, bc = 0; hist.forEach((v, k) => { if (v > bc || (v === bc && k < actionX)) { bc = v; actionX = k; } });
  if (actionX == null) actionX = Math.min(...S.lines.map(l => l.x0));
  let cast = catById('cast');
  if (!cast) { cast = { ...DEFAULT_CATS[0] }; S.cats.unshift(cast); }
  const seen = new Set(), add = [];
  S.lines.forEach((ln, i) => {
    const off = ln.x0 - actionX;
    if (off < 100 || off > 270) return;
    const nx = S.lines[i + 1]; if (!nx || nx.p !== ln.p || nx.x0 >= ln.x0 - 4) return;
    const raw = ln.text.replace(/\(.*?\)/g, '').replace(/\^/g, '').trim();
    if (!raw || raw.length > 34 || !isCaps(raw) || NOT_CUE.test(raw) || HEAD_RE.test(ln.text) || /^\d/.test(raw) || /[:]$/.test(raw)) return;
    // words of the name = leading words up to the first one that opens a parenthetical
    let b = ln.a; while (b + 1 <= ln.b && !S.words[b + 1].s.startsWith('(')) b++;
    while (b > ln.a && /^\d+[A-Z]?$/.test(S.words[b].s)) b--;
    const name = titleCase(cleanText(S.words.slice(ln.a, b + 1).map(w => w.s).join(' ')));
    if (!name) return;
    const sk = S.lineScene[i] + '|' + name.toLowerCase();
    if (seen.has(sk)) return; seen.add(sk);
    if (S.tags.some(t => t.cat === cast.id && t.a <= b && t.b >= ln.a)) return;
    if (S.tags.some(t => t.cat === cast.id && S.lineScene[S.words[t.a].l] === S.lineScene[i] && t.item.toLowerCase() === name.toLowerCase())) return;
    add.push({ id: uid(), cat: cast.id, a: ln.a, b, text: S.words.slice(ln.a, b + 1).map(w => w.s).join(' '), item: name, auto: 1 });
  });
  if (!add.length) { toast('No new speaking characters found.'); return; }
  commit();
  S.tags.push(...add);
  changed();
  const names = new Set(add.map(t => t.item));
  toast(`Tagged ${names.size} character${names.size > 1 ? 's' : ''} across ${new Set(add.map(t => S.lineScene[S.words[t.a].l])).size} scenes. Ctrl+Z to undo.`, 4500);
}

const WIN = new Set([0x152, 0x153, 0x160, 0x161, 0x178, 0x17D, 0x17E, 0x192, 0x2C6, 0x2DC, 0x2013, 0x2014, 0x2018, 0x2019, 0x201A, 0x201C, 0x201D, 0x201E, 0x2020, 0x2021, 0x2022, 0x2026, 0x2030, 0x2039, 0x203A, 0x20AC, 0x2122]);
const safe = s => [...String(s ?? '')].map(ch => { const c = ch.codePointAt(0); if ((c >= 32 && c <= 126) || (c >= 160 && c <= 255) || WIN.has(c)) return ch; if (c === 9 || c === 10) return ' '; const n = ch.normalize('NFKD').replace(/[̀-ͯ]/g, ''); return n && [...n].every(x => x.charCodeAt(0) < 256) ? n : '?'; }).join('');

async function exportPdf(o) {
  await loadScript(PDFLIB, () => window.PDFLib);
  const { PDFDocument, StandardFonts, rgb, BlendMode } = PDFLib;
  const out = await PDFDocument.create();
  const title = $('#proj').value.trim() || S.fileName.replace(/\.pdf$/i, '');
  out.setTitle(safe(title + ' — Script breakdown')); out.setCreator('Script Breakdown (Film Tool Hub)');
  const F = await out.embedFont(StandardFonts.Helvetica), FB = await out.embedFont(StandardFonts.HelveticaBold), FI = await out.embedFont(StandardFonts.HelveticaOblique);
  const col = h => { const [r, g, b] = hexRgb(h); return rgb(r / 255, g / 255, b / 255); };
  const INK = rgb(.09, .1, .11), MUT = rgb(.42, .44, .48), RULE = rgb(.86, .85, .82), BAND = rgb(.955, .95, .94);
  const PW = 595.28, PH = 841.89, M = 46, CW = PW - 2 * M;
  let page, y, pageNo = 0;
  const reportPages = [];
  const wrap = (text, font, size, width) => {
    const out = []; for (const para of safe(text).split(/\n/)) { let line = ''; for (const w of para.split(/\s+/)) { const t = line ? line + ' ' + w : w; if (font.widthOfTextAtSize(t, size) > width && line) { out.push(line); line = w; } else line = t; } out.push(line); }
    return out;
  };
  const txt = (s, x, yy, size, font = F, color = INK) => page.drawText(safe(s), { x, y: yy, size, font, color });
  const fitTxt = (s, font, size, width) => { s = safe(s); if (font.widthOfTextAtSize(s, size) <= width) return s; while (s.length > 1 && font.widthOfTextAtSize(s + '…', size) > width) s = s.slice(0, -1); return s + '…'; };
  let section = '';
  const newPage = () => { page = out.addPage([PW, PH]); reportPages.push({ page, section }); pageNo++; y = PH - M - 20; };
  const need = h => { if (y - h < M + 14) newPage(); };
  const sectionStart = (name, sub) => { section = name; newPage(); txt(name, M, y, 20, FB); y -= 16; if (sub) { txt(sub, M, y, 9.5, F, MUT); y -= 8; } page.drawLine({ start: { x: M, y: y - 4 }, end: { x: PW - M, y: y - 4 }, thickness: .6, color: RULE }); y -= 22; };
  const bc = byCat(), gs = groups();

  /* summary */
  section = 'Summary'; newPage();
  txt('SCRIPT BREAKDOWN', M, y, 9, FB, MUT); y -= 24;
  for (const l of wrap(title, FB, 24, CW)) { txt(l, M, y, 24, FB); y -= 28; }
  txt(`${S.fileName}  ·  exported ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}`, M, y, 9.5, F, MUT); y -= 30;
  const totalE = S.scenes.reduce((s, x) => s + x.eighths, 0);
  const stats = [[String(S.pages.length), 'pages'], [String(S.scenes.length), 'scenes'], [String(gs.length), 'items'], [String(S.tags.length), 'mentions']];
  stats.forEach(([v, l], i) => { const x = M + i * (CW / 4); txt(v, x, y, 22, FB); txt(l, x, y - 14, 9, F, MUT); });
  y -= 46;
  txt('By category', M, y, 11, FB); y -= 8;
  page.drawLine({ start: { x: M, y }, end: { x: PW - M, y }, thickness: .6, color: RULE }); y -= 16;
  for (const { cat, items, mentions } of bc) {
    page.drawRectangle({ x: M, y: y - 2, width: 10, height: 10, color: col(cat.color) });
    txt(cat.name, M + 18, y, 10.5, FB); txt(`${items.length} item${items.length > 1 ? 's' : ''}`, M + 260, y, 10, F, MUT); txt(`${mentions} mention${mentions > 1 ? 's' : ''}`, M + 360, y, 10, F, MUT);
    y -= 19;
  }
  y -= 14;
  const secs = [o.lists && 'Category lists', o.scenes && 'Scene breakdowns', o.script && 'Highlighted script'].filter(Boolean);
  if (secs.length) { txt('In this document', M, y, 11, FB); y -= 16; secs.forEach((s, i) => { txt(`${i + 1}.  ${s}`, M, y, 10, F, INK); y -= 15; }); }
  if (S.scenes.length) { y -= 8; txt(`Script length: ${fmtEighths(totalE)} pages (scene lengths in eighths are estimated from the page layout).`, M, y, 8.5, FI, MUT); }

  /* category lists */
  if (o.lists) {
    sectionStart('Category lists', 'Every item, grouped by category. Each mention is listed so different versions of an item stay distinct.');
    for (const { cat, items, mentions } of bc) {
      need(60);
      page.drawRectangle({ x: M, y: y - 6, width: CW, height: 22, color: col(cat.color) });
      const ink = inkOn(cat.color) === '#fff' ? rgb(1, 1, 1) : INK;
      txt(cat.name.toUpperCase(), M + 9, y + 1, 11, FB, ink);
      const r = `${items.length} item${items.length > 1 ? 's' : ''} · ${mentions} mention${mentions > 1 ? 's' : ''}`;
      txt(r, PW - M - 9 - F.widthOfTextAtSize(r, 9), y + 1.5, 9, F, ink);
      y -= 30;
      for (const g of items) {
        const note = S.notes[g.key];
        const ml = g.tags.map(t => { const sc = sceneOfWord(t.a); return { w: `${sc ? 'Sc. ' + sc.n : 'No scene'} · p. ${S.words[t.a].p + 1}`, t: '“' + (cleanText(t.text) || t.text) + '”' }; });
        const noteLines = note ? wrap('Note: ' + note, FI, 8.5, CW - 14) : [];
        need(16 + noteLines.length * 11 + Math.min(ml.length, 3) * 11);
        txt(g.name, M + 4, y, 10.5, FB);
        const right = `${g.tags.length} mention${g.tags.length > 1 ? 's' : ''}${g.scenes.length ? '  ·  ' + scList(g.scenes) : ''}`;
        const rt = fitTxt(right, F, 8.5, CW - 14 - FB.widthOfTextAtSize(safe(g.name), 10.5) - 16);
        txt(rt, PW - M - 4 - F.widthOfTextAtSize(rt, 8.5), y + 1, 8.5, F, MUT);
        y -= 13;
        for (const l of noteLines) { txt(l, M + 14, y, 8.5, FI, INK); y -= 11; }
        for (const m of ml) { need(11); txt(m.w, M + 14, y, 8, F, MUT); txt(fitTxt(m.t, F, 8, CW - 110), M + 92, y, 8, F, INK); y -= 10.5; }
        y -= 4; page.drawLine({ start: { x: M + 4, y: y + 2 }, end: { x: PW - M - 4, y: y + 2 }, thickness: .4, color: RULE }); y -= 9;

    const blocks = S.scenes.map((sc, k) => ({ sc, k, tags: [] }));
    const orphan = [];
    for (const t of S.tags) { const k = S.lineScene[S.words[t.a].l]; (k >= 0 ? blocks[k].tags : orphan).push(t); }
    const all = orphan.length ? [{ sc: { n: '—', heading: 'Before the first scene heading', p: 0, p1: 0, eighths: 0, none: 1 }, tags: orphan }, ...blocks] : blocks;
    const LW = 108, VW = CW - LW - 20;
    for (const bl of all) {
      const rows = [];
      for (const c of S.cats) {
        const ts = bl.tags.filter(t => t.cat === c.id); if (!ts.length) continue;
        const cnt = new Map(); ts.sort((a, b) => a.a - b.a).forEach(t => cnt.set(t.item, (cnt.get(t.item) || 0) + 1));
        const val = [...cnt].map(([n, k]) => k > 1 ? `${n} (×${k})` : n).join(', ');

      }

      need(h);
      page.drawRectangle({ x: M, y: y - 7, width: CW, height: 22, color: BAND });
      const sc = bl.sc;
      txt(sc.none ? '—' : 'SC. ' + sc.n, M + 8, y, 10.5, FB);
      const meta = sc.none ? '' : `${pageLabel(sc)}  ·  ${fmtEighths(sc.eighths)} pg`;
      const mw = F.widthOfTextAtSize(meta, 8.5);
      txt(fitTxt(sc.heading, FB, 9.5, CW - 70 - mw - 16), M + 62, y + .5, 9.5, FB);
      if (meta) txt(meta, PW - M - 8 - mw, y + .5, 8.5, F, MUT);
      y -= 24;
      if (!rows.length) { txt('No elements tagged', M + 8, y, 8.5, FI, MUT); y -= 16; }
      for (const r of rows) {
        page.drawRectangle({ x: M + 8, y: y - 1.5, width: 8, height: 8, color: col(r.c.color) });
        txt(fitTxt(r.c.name, FB, 8.5, LW - 16), M + 21, y, 8.5, FB);
        r.lines.forEach((l, i) => txt(l, M + LW + 12, y - i * 11.5, 9, F, INK));

  }

  /* highlighted script */
  let scriptStart = null;
  if (o.script) {
    const src = await PDFDocument.load(S.bytes, { ignoreEncryption: true });
    const copied = await out.copyPages(src, S.pages.map((_, i) => i));

      out.addPage(pg); if (scriptStart === null) scriptStart = pageNo; pageNo++;
      const P = S.pages[p];
      const first = P.lines.length ? S.lines[P.lines[0]].a : 0, last = P.lines.length ? S.lines[P.lines[P.lines.length - 1]].b : -1;
      const byLine = new Map();
      for (const t of S.tags) {
        if (t.b < first || t.a > last) continue; const c = catById(t.cat); if (!c) continue;
        for (const [a, b] of segments(Math.max(t.a, first), Math.min(t.b, last))) {
          const w1 = S.words[a], w2 = S.words[b];
          const [sx1, sx2] = span(w1, w2);
          const opt = { x: sx1 - .8, y: w1.y - w1.h * .24, width: sx2 - sx1 + 1.6, height: w1.h * 1.04, color: col(c.color), opacity: .42 };
          if (BlendMode) opt.blendMode = BlendMode.Multiply;
          pg.drawRectangle(opt);
          const l = w1.l; if (!byLine.has(l)) byLine.set(l, []); const arr = byLine.get(l); if (!arr.includes(c)) arr.push(c);
        }
      }
      if (o.labels) byLine.forEach((cs, l) => {
        const ln = S.lines[l]; let x = (pg.getMediaBox ? pg.getMediaBox().x : 0) + 8;
        cs.forEach(c => { const code = safe(c.code), w = FB.widthOfTextAtSize(code, 5.6) + 5; pg.drawRectangle({ x, y: ln.y - 1.2, width: w, height: 7.6, color: col(c.color) }); pg.drawText(code, { x: x + 2.5, y: ln.y + .6, size: 5.6, font: FB, color: inkOn(c.color) === '#fff' ? rgb(1, 1, 1) : INK }); x += w + 2.5; });
      });
    });
  }

  /* footers on report pages */
  const total = out.getPageCount();
  reportPages.forEach(({ page: pg, section: sec }, i) => {
    pg.drawText(safe(`${title}  ·  ${sec}`), { x: M, y: 24, size: 7.5, font: F, color: MUT });
    const r = `Page ${i + 1} of ${total}`; pg.drawText(r, { x: PW - M - F.widthOfTextAtSize(r, 7.5), y: 24, size: 7.5, font: F, color: MUT });
  });
  const bytes = await out.save();
  download(slug(title) + '-breakdown.pdf', new Blob([bytes], { type: 'application/pdf' }));
}

/* ═════════════ boot ═════════════ */
setActive(null);
showEmpty();
</script>
