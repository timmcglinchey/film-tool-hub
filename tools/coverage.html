<!DOCTYPE html>
<html lang="en">
<head>
<!--fth-standalone-->
<!-- Film Tool Hub: this block is only used when this file is opened on its own (for example while working on it).
     Inside the hub it is removed and the hub supplies the same look from hub/kit.css. Keep it, but don't edit it here. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════ Film Tool Hub kit ═════════
   Shared look for every tool. The hub injects this at the top of each tool's <head>,
   sets data-theme="light|dark" on the tool's <html>, and sets --fth-cat to the tool's
   category colour. Tools use the --fth-* tokens and the .fth-* components. */
:root{
  --fth-bg:#0b0c0e; --fth-bg2:#101216; --fth-surface:#15181d; --fth-surface2:#1b1f26; --fth-surface3:#232831;
  --fth-line:#242931; --fth-line2:#333a45; --fth-line3:#46505e;
  --fth-text:#f0ece5; --fth-muted:#9aa0aa; --fth-faint:#666c77;
  --fth-good:#5cc98a; --fth-bad:#ff8f7a; --fth-warn:#f2bd5c;
  /* accent tokens (--fth-cat, --fth-accent, --fth-accent-ink, --fth-accent-soft, --fth-accent-line, --fth-on-accent)
     are written by the hub for each tool's category, as plain colours for both themes */
  --fth-cat:#ffb547; --fth-accent:#ffb547; --fth-accent-ink:#ffb547; --fth-accent-soft:rgba(255,181,71,.14); --fth-accent-line:rgba(255,181,71,.45); --fth-on-accent:#14110b;
  --fth-paper-backdrop:#07080a;
  --fth-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --fth-shadow-sm:none;
  --fth-radius:14px; --fth-radius-sm:9px;
  --fth-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fth-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fth-script:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --fth-bg:#f3f0ea; --fth-bg2:#f9f7f3; --fth-surface:#ffffff; --fth-surface2:#f1ede5; --fth-surface3:#e6e1d6;
  --fth-line:#e3ded4; --fth-line2:#d2ccc0; --fth-line3:#b4ad9f;
  --fth-text:#16181c; --fth-muted:#565c66; --fth-faint:#878c95;
  --fth-good:#22804a; --fth-bad:#c0392b; --fth-warn:#9a6200;
  --fth-paper-backdrop:#e4dfd5;
  --fth-shadow:0 14px 30px -16px rgba(70,50,20,.30);
  --fth-shadow-sm:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  color-scheme:light;
}

/* base */
html{background:var(--fth-bg)}
body{background:var(--fth-bg);color:var(--fth-text);font-family:var(--fth-display);-webkit-font-smoothing:antialiased}
::selection{background:var(--fth-accent-line)}
:focus-visible{outline:2px solid var(--fth-accent);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--fth-line2);border-radius:6px;border:2px solid var(--fth-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fth-line3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* tool header: category eyebrow, tool name, then actions on the right */
.fth-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;
  background:color-mix(in srgb,var(--fth-bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--fth-line)}
.fth-head::before{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,var(--fth-cat),transparent 38%);opacity:.75;pointer-events:none}
.fth-id{display:flex;flex-direction:column;gap:5px;min-width:0;flex:none}
.fth-eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--fth-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fth-accent-ink);white-space:nowrap}
.fth-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fth-cat);box-shadow:0 0 0 3px var(--fth-accent-soft);flex:none}
.fth-title{margin:0;font-weight:800;font-variation-settings:"wdth" 68;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.fth-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.fth-vsep{width:1px;height:22px;background:var(--fth-line2);margin:0 3px;flex:none}

/* buttons */
.fth-btn{height:34px;padding:0 13px;border-radius:var(--fth-radius-sm);border:1px solid var(--fth-line2);background:var(--fth-surface);color:var(--fth-text);
  font:600 13px/1 var(--fth-display);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background-color .15s,border-color .15s,color .15s}
.fth-btn:hover{background:var(--fth-surface2);border-color:var(--fth-line3)}
.fth-btn:disabled{opacity:.45;cursor:default}
.fth-btn.primary{background:var(--fth-accent);border-color:var(--fth-accent);color:var(--fth-on-accent)}
.fth-btn.primary:hover{filter:brightness(1.08)}
.fth-btn.ghost{background:transparent;border-color:transparent;color:var(--fth-muted)}
.fth-btn.ghost:hover{background:var(--fth-surface2);border-color:var(--fth-line2);color:var(--fth-text)}
.fth-btn.danger{color:var(--fth-bad)}
.fth-btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.fth-btn.icon{width:30px;height:30px;padding:0}

/* labels, fields */
.fth-label{font:500 10.5px/1.25 var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.fth-input{width:100%;min-width:0;background:var(--fth-bg2);border:1px solid var(--fth-line2);border-radius:8px;padding:7px 10px;color:var(--fth-text);font:14px/1.35 var(--fth-display);outline:none;transition:border-color .15s,box-shadow .15s}
.fth-input:hover{border-color:var(--fth-line3)}
.fth-input:focus{border-color:var(--fth-accent);box-shadow:0 0 0 3px var(--fth-accent-soft)}
select.fth-input{cursor:pointer}
textarea.fth-input{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--fth-accent)}

/* sections & surfaces */
.fth-card{background:linear-gradient(180deg,var(--fth-surface) 0%,var(--fth-bg2) 100%);border:1px solid var(--fth-line);border-radius:var(--fth-radius);box-shadow:var(--fth-shadow-sm)}
.fth-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font:700 15px/1.1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.03em}
.fth-sec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
.fth-sec .fth-num{font:600 11px var(--fth-mono);color:var(--fth-accent-ink);letter-spacing:.08em}
.fth-muted{color:var(--fth-muted)}
.fth-mono{font-family:var(--fth-mono)}

/* notes */
.fth-tip{background:var(--fth-accent-soft);border-left:2px solid var(--fth-accent);color:var(--fth-text);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45}
.fth-warn{background:color-mix(in srgb,var(--fth-warn) 10%,var(--fth-surface));border:1px solid color-mix(in srgb,var(--fth-warn) 40%,transparent);color:var(--fth-text);border-radius:10px;padding:10px 12px;font-size:13px}
.fth-warn b:first-child{color:var(--fth-warn)}
.fth-info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--fth-line3);color:var(--fth-muted);font:600 10px/1 var(--fth-mono);text-transform:none;letter-spacing:0;cursor:pointer;user-select:none;vertical-align:1px;margin-left:5px;transition:.15s}
.fth-info:hover{border-color:var(--fth-accent);color:var(--fth-accent-ink);background:var(--fth-accent-soft)}

/* toast */
.fth-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:200;background:var(--fth-text);color:var(--fth-bg);padding:10px 16px;border-radius:10px;font:500 13.5px var(--fth-display);box-shadow:var(--fth-shadow);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.fth-toast.show{opacity:1;transform:translate(-50%,0)}

/* paper: a printable page shown on screen stays paper-white in both themes */
.fth-paper-wrap{background:var(--fth-paper-backdrop)}
.fth-paper{background:#fff;color:#000;color-scheme:light;box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 40px -16px rgba(0,0,0,.55)}

@media print{
  html,body{background:#fff!important;color:#000}
  .fth-head{display:none!important}
  .fth-paper-wrap{background:#fff!important}
  .fth-paper{box-shadow:none!important}
}
@media (max-width:700px){.fth-head{padding:10px 14px}.fth-title{font-size:20px}.fth-vsep{display:none}}
@media (prefers-reduced-motion:reduce){.fth-btn,.fth-input,.fth-toast{transition:none}}

/* "Save to Documentation" buttons stay hidden until the hub switches them on (window.fthDocs.attach) */
[data-fth-doc][hidden]{display:none!important}

:root{--fth-cat:#f5b14c;--fth-accent:#f5b14c;--fth-accent-ink:#f5b14c;--fth-accent-soft:rgba(245,177,76,0.14);--fth-accent-line:rgba(245,177,76,0.45);--fth-on-accent:#14110b}:root[data-theme="light"]{--fth-accent:#8e672c;--fth-accent-ink:#8e672c;--fth-accent-soft:rgba(245,177,76,0.16);--fth-accent-line:rgba(245,177,76,0.6);--fth-on-accent:#ffffff}
</style>
<script>(function(){var d=document.documentElement;if(d.getAttribute('data-theme'))return;var t=null;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}d.setAttribute('data-theme',t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})();</script>
<!--/fth-standalone-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Coverage &amp; Feedback</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;font:14px/1.45 var(--fth-display)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:root{
  --b-cs:#4fb8a3;--b-pr:#e6a24c;--b-ch:#e9785b;--b-a2:#7d9ee0;--b-mid:#ad86e0;--b-th:#e2b04a;
  --k-note:var(--fth-accent);--k-strength:var(--fth-good);--k-issue:var(--fth-bad);--k-question:#7fb0ff;
  --lab:118px;
}
:root[data-theme="light"]{--b-cs:#2c8a78;--b-pr:#c27a1c;--b-ch:#c4502f;--b-a2:#4a6fb5;--b-mid:#8a5cc2;--b-th:#a87508;--k-question:#2f6fc0}

/* header */
.fth-head{flex:none}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--fth-surface);border:1px solid var(--fth-line2)}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;color:var(--fth-muted);font:600 12.5px/1 var(--fth-display);white-space:nowrap}
.seg button:hover{color:var(--fth-text)}
.seg button.on{background:var(--fth-accent);color:var(--fth-on-accent)}
.seg.sub button.on{background:var(--fth-surface3);color:var(--fth-text)}
.seg.sm button{height:24px;padding:0 9px;font-size:12px}
.views{display:flex;gap:2px}
.views button{border:0;background:none;height:32px;padding:0 12px;border-radius:8px;color:var(--fth-muted);font:600 13px var(--fth-display);position:relative}
.views button:hover{background:var(--fth-surface2);color:var(--fth-text)}
.views button.on{color:var(--fth-text);background:var(--fth-surface2)}
.views button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--fth-accent)}
.docname{font:500 11.5px var(--fth-mono);color:var(--fth-faint);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#app{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* ───────── workspace ───────── */
#v-script{flex-direction:column}
.strip{flex:none;border-bottom:1px solid var(--fth-line);background:var(--fth-bg2);padding:8px 14px 10px;position:relative;z-index:5}
.strip-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.strip-bar .fth-label{margin-right:4px}
.strip.collapsed .tl{display:none}
.strip.collapsed .strip-bar{margin-bottom:0}
.chip{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--fth-line2);background:transparent;color:var(--fth-muted);font:600 11.5px/1 var(--fth-display);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--fth-line3);color:var(--fth-text)}
.chip .sw{width:8px;height:8px;border-radius:2px;background:var(--c,var(--fth-line3));opacity:.35}
.chip.on{background:var(--fth-surface2);border-color:var(--fth-line3);color:var(--fth-text)}
.chip.on .sw{opacity:1}
.grow{flex:1}

.ws{flex:1;min-height:0;display:flex}
.panel{width:330px;flex:none;overflow:auto;background:var(--fth-bg);border-right:1px solid var(--fth-line);display:flex;flex-direction:column}
.panel.right{border-right:0;border-left:1px solid var(--fth-line);width:320px}
.panel.closed{display:none}
.phead{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--fth-bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 14px 10px;border-bottom:1px solid var(--fth-line);display:flex;flex-direction:column;gap:9px}
.phead-row{display:flex;align-items:center;gap:8px}
.phead h2{margin:0;font:700 13px/1 var(--fth-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.04em}
.pbody{padding:12px 14px 40px;display:flex;flex-direction:column;gap:10px}
.empty-note{color:var(--fth-faint);font-size:13px;padding:18px 4px;text-align:center;line-height:1.5}

.scroller{flex:1;min-width:0;overflow:auto;position:relative}
#pages{display:flex;flex-direction:column;align-items:safe center;gap:18px;padding:24px 56px 140px 56px;min-width:max-content}
#pages.with-gut{padding-left:212px}
.pg{position:relative;width:var(--pw,780px);flex:none;user-select:none;-webkit-user-select:none}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pg .ov{position:absolute;inset:0}
.pg .pgno{position:absolute;left:calc(100% + 8px);top:0;font:500 10.5px var(--fth-mono);color:var(--fth-faint);white-space:nowrap;text-align:left}
.pg .pgno b{display:block;color:var(--fth-muted);font-weight:600}
body.mode-feedback .pg .ov{cursor:crosshair}
body.placing .pg .ov{cursor:crosshair}
.zoombar{position:sticky;bottom:14px;margin:0 auto;width:max-content;display:flex;align-items:center;gap:2px;padding:4px;border-radius:10px;background:var(--fth-surface2);border:1px solid var(--fth-line2);box-shadow:var(--fth-shadow);z-index:6;float:none}
.zoombar button{border:0;background:none;height:26px;min-width:26px;border-radius:6px;color:var(--fth-muted);font:600 13px var(--fth-display)}
.zoombar button:hover{background:var(--fth-surface3);color:var(--fth-text)}
.zoombar span{font:500 11px var(--fth-mono);color:var(--fth-muted);min-width:48px;text-align:center}
.zoomdock{position:absolute;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:center;padding-bottom:14px;z-index:6}
.zoomdock .zoombar{pointer-events:auto;position:static}
.pagepill{font:500 11px var(--fth-mono);color:var(--fth-muted);padding:0 8px;border-left:1px solid var(--fth-line2);margin-left:4px}

/* drop zone */
.drop{margin:8vh auto;max-width:520px;padding:40px 30px;border:1.5px dashed var(--fth-line3);border-radius:18px;text-align:center;background:var(--fth-surface);color:var(--fth-muted)}
.drop h3{margin:0 0 8px;color:var(--fth-text);font:800 20px/1.1 var(--fth-display);font-variation-settings:"wdth" 72;text-transform:uppercase}
.drop p{margin:0 0 18px;font-size:13.5px}
.drop.over{border-color:var(--fth-accent);background:var(--fth-accent-soft)}
.loading{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;background:var(--fth-surface2);border:1px solid var(--fth-line2);padding:6px 12px;border-radius:999px;font:500 12px var(--fth-mono);color:var(--fth-muted)}

/* placing banner */
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:12px;background:var(--fth-surface2);border:1px solid var(--c);box-shadow:var(--fth-shadow);font-size:13px;max-width:calc(100% - 40px)}
.banner b{color:var(--c)}
.banner .dotc{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

/* overlays on the page */
.mk-line{position:absolute;left:3%;right:3%;border-top:1.5px dashed var(--c);pointer-events:none}
.mk-bar{position:absolute;left:3.6%;width:5px;margin-left:-2.5px;background:var(--c);border-radius:3px;pointer-events:none}
.mk-pill{position:absolute;left:2%;max-width:15%;overflow:hidden;text-overflow:ellipsis;height:20px;line-height:12px;background:var(--c);color:#fff;font:700 10px/1 var(--fth-display);padding:4px 7px 4px 6px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2;letter-spacing:.01em}
:root[data-theme="dark"] .mk-pill{color:#101216}
.mk-pill.end{opacity:.75;font-weight:600}
.cm-rect{position:absolute;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:3px;cursor:pointer}
.cm-pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50% 50% 50% 2px;background:var(--c);color:#fff;font:700 10.5px/20px var(--fth-display);text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:2}
:root[data-theme="dark"] .cm-pin{color:#101216}
.cm-rect .cm-pin{left:100%;top:0}
.cm-rect.hot,.cm-pin.hot{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.cm-rect.hot{background:color-mix(in srgb,var(--c) 26%,transparent)}
.flash{animation:flash 1s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 5px var(--fth-accent-line)}}
.preview{position:absolute;border:1.5px dashed var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);pointer-events:none;border-radius:3px}

/* ───────── beats panel ───────── */
.structs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtn{border:1px solid var(--fth-line2);background:var(--fth-surface);border-radius:10px;padding:8px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.sbtn:hover{border-color:var(--fth-line3)}
.sbtn b{font:700 12px/1.15 var(--fth-display)}
.sbtn small{font:500 10px var(--fth-mono);color:var(--fth-faint)}
.sbtn.on{border-color:var(--fth-accent);background:var(--fth-accent-soft)}
.sbtn.on small{color:var(--fth-accent-ink)}
.beat{border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-surface);padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px;border-left:3px solid var(--c)}
.beat.placed{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,var(--fth-surface)),var(--fth-surface) 60%)}
.beat.arming{box-shadow:0 0 0 2px var(--c)}
.beat-top{display:flex;align-items:flex-start;gap:8px}
.beat-name{flex:1;min-width:0}
.beat-name b{font:700 13px/1.2 var(--fth-display);display:block}
.beat-name small{font:500 10.5px var(--fth-mono);color:var(--fth-faint);display:block;margin-top:2px}
.beat-status{font:500 10.5px var(--fth-mono);color:var(--fth-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.beat-status a{color:var(--c);cursor:pointer;text-decoration:none;font-weight:600}
.beat-status a:hover{text-decoration:underline}
.diff{padding:1px 6px;border-radius:999px;background:var(--fth-surface3);color:var(--fth-muted)}
.diff.late{color:var(--fth-warn)}.diff.early{color:var(--k-question)}.diff.on{color:var(--fth-good)}
.beat textarea{min-height:34px;font-size:13px;padding:6px 9px}
.beat .fth-btn.sm{height:24px;padding:0 9px;font-size:11.5px}
.placebtn{border-color:color-mix(in srgb,var(--c) 55%,transparent)!important;color:var(--c)!important;background:transparent!important}
.placebtn:hover{background:color-mix(in srgb,var(--c) 12%,transparent)!important}
.placebtn.armed{background:var(--c)!important;color:var(--fth-bg)!important}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fth-muted);cursor:pointer;user-select:none}
.toggle input{margin:0}

/* summaries */
.sum{border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-surface);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
.sum.cur{border-color:var(--fth-accent-line);box-shadow:0 0 0 3px var(--fth-accent-soft)}
.sum-top{display:flex;align-items:center;gap:8px}
.sum-top button{border:0;background:none;padding:0;font:700 11px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted)}
.sum-top button:hover{color:var(--fth-accent-ink)}
.sum.cur .sum-top button{color:var(--fth-accent-ink)}
.sum-top .ph{font-size:11px;color:var(--fth-faint);font-family:var(--fth-mono)}
.scenes{font:500 10px/1.35 var(--fth-mono);color:var(--fth-faint);text-transform:uppercase;letter-spacing:.02em}
.sum textarea{min-height:34px;font-size:13px;padding:6px 9px}
.wc{font:500 10px var(--fth-mono);color:var(--fth-faint);text-align:right}
.wc.warn{color:var(--fth-warn)}

/* comments */
.kinds{display:flex;gap:5px;flex-wrap:wrap}
.kchip{height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--fth-line2);background:none;font:600 11px/1 var(--fth-display);color:var(--fth-muted);display:inline-flex;align-items:center;gap:5px}
.kchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.kchip.on{border-color:var(--c);color:var(--fth-text);background:color-mix(in srgb,var(--c) 12%,transparent)}
.cm{border:1px solid var(--fth-line);border-radius:11px;background:var(--fth-surface);padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-left:3px solid var(--c)}
.cm.hot{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.cm-top{display:flex;align-items:center;gap:7px}
.cm-num{width:20px;height:20px;border-radius:50% 50% 50% 2px;background:var(--c);color:#fff;font:700 10.5px/20px var(--fth-display);text-align:center;flex:none}
:root[data-theme="dark"] .cm-num{color:#101216}
.cm-loc{font:500 10.5px var(--fth-mono);color:var(--fth-muted);cursor:pointer}
.cm-loc:hover{color:var(--fth-accent-ink)}
.cm select{height:22px;border-radius:6px;border:1px solid var(--fth-line2);background:var(--fth-bg2);font-size:11.5px;padding:0 4px;margin-left:auto}
.cm textarea{min-height:52px;font-size:13px;padding:6px 9px}
.xbtn{border:0;background:none;width:22px;height:22px;border-radius:6px;color:var(--fth-faint);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.xbtn:hover{background:var(--fth-surface3);color:var(--fth-bad)}

/* ───────── timeline ───────── */
.tl{position:relative;--lab:118px}
.tl-row{display:flex;align-items:stretch;min-height:16px}
.tl-row+.tl-row{margin-top:4px}
.tl-lab{width:var(--lab);flex:none;font:600 10px/1.1 var(--fth-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fth-muted);display:flex;align-items:center;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-lab small{color:var(--fth-faint);font-weight:500;margin-left:4px}
.tl-track{flex:1;position:relative;min-width:0;border-radius:4px;background:color-mix(in srgb,var(--fth-surface) 70%,transparent);cursor:pointer}
.tl-it{position:absolute;cursor:pointer}
.tl-page{top:2px;bottom:2px;background:var(--fth-surface3);border-radius:2px;font:500 8.5px/1 var(--fth-mono);color:var(--fth-muted);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset -1px 0 0 var(--fth-bg2)}
.tl-page.cur{background:var(--fth-accent-line);color:var(--fth-text)}
.tl-page.part{background:repeating-linear-gradient(135deg,var(--fth-surface3) 0 3px,var(--fth-surface2) 3px 6px)}
.tl-sum{top:2px;bottom:2px;border-radius:3px;background:var(--fth-surface2);border:1px solid var(--fth-line);font:500 9.5px/1.25 var(--fth-display);color:var(--fth-text);padding:2px 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tl-sum.empty{color:var(--fth-faint);background:transparent;border-style:dashed}
.tl-sum.cur{border-color:var(--fth-accent)}
.tl-bar{height:12px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,transparent);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);font:600 8.5px/10px var(--fth-display);color:var(--fth-text);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bar.act{background:var(--c);color:#fff}
:root[data-theme="dark"] .tl-bar.act{color:#101216}
.tl-pt{width:11px;height:11px;margin-left:-5.5px;background:var(--c);border-radius:2px;transform:rotate(45deg) scale(.82)}
.tl-pt.act{border-radius:50%;transform:none;box-shadow:0 0 0 2px var(--fth-bg2)}
.tl-pt.ghost{background:transparent;border:1.5px solid var(--c)}
.tl-dot{width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);top:3px;box-shadow:0 0 0 2px var(--fth-bg2)}
.tl-cx{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--c)}
.tl-ptlab{position:absolute;font:600 9.5px/11px var(--fth-display);color:var(--c);white-space:nowrap;pointer-events:none}
.tl-win{position:absolute;top:0;bottom:0;border:1.5px solid var(--fth-accent);border-radius:4px;background:var(--fth-accent-soft);pointer-events:none;min-width:3px}
.tl-guides,.tl-conn,.tl-winlayer{position:absolute;top:0;bottom:0;left:var(--lab);right:0;pointer-events:none}
.tl-guide{position:absolute;top:0;bottom:0;border-left:1px dashed var(--fth-line3);opacity:.7}
.tl-guide span{position:absolute;top:-15px;left:3px;font:500 9px var(--fth-mono);color:var(--fth-faint)}
.tl-conn{overflow:visible;left:0;width:100%;height:100%;z-index:1}
.tl-empty{font-size:12px;color:var(--fth-faint);padding:4px 0}
.tl-axis{position:relative;height:18px;margin-left:var(--lab);font:500 9.5px var(--fth-mono);color:var(--fth-faint)}
.tl-axis span{position:absolute;transform:translateX(-50%);top:2px;white-space:nowrap}
.tl-axis span::before{content:"";position:absolute;left:50%;top:13px;height:5px;border-left:1px solid var(--fth-line3)}
.tl.big{--lab:150px}
.tl.big .tl-row+.tl-row{margin-top:8px}
.tl.big .tl-lab{font-size:10.5px}
.tl.big .tl-bar{height:20px;font-size:10.5px;line-height:18px;padding:0 6px}
.tl.big .tl-pt{width:14px;height:14px;margin-left:-7px}
.tl.big .tl-dot{width:12px;height:12px;margin-left:-6px}
.tl.big .tl-sum{font-size:10.5px;padding:4px 6px;-webkit-line-clamp:4}
.tl.big .tl-page{font-size:10px}
.tl.big .tl-ptlab{font-size:10.5px}

/* tooltip */
.tip{position:fixed;z-index:300;max-width:320px;padding:9px 11px;border-radius:10px;background:var(--fth-surface3);border:1px solid var(--fth-line3);color:var(--fth-text);font-size:12.5px;line-height:1.45;box-shadow:var(--fth-shadow);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip .m{font:500 10.5px var(--fth-mono);color:var(--fth-muted);display:block;margin-bottom:5px}
.tip .n{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--fth-line2)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;z-index:250;display:flex;align-items:center;gap:12px;background:var(--fth-text);color:var(--fth-bg);padding:9px 10px 9px 16px;border-radius:10px;font:500 13px var(--fth-display);box-shadow:var(--fth-shadow);transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--fth-bg);color:var(--fth-text);border-radius:7px;padding:4px 10px;font-weight:600;font-size:12.5px}
.toast button:empty{display:none}

/* menu */
.menu{position:fixed;z-index:120;width:300px;padding:14px;border-radius:12px;background:var(--fth-surface2);border:1px solid var(--fth-line2);box-shadow:var(--fth-shadow);display:flex;flex-direction:column;gap:12px;font-size:13px}
.menu h4{margin:0;font:700 12px var(--fth-display);text-transform:uppercase;letter-spacing:.05em}
.menu .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.menu p{margin:0;color:var(--fth-muted);font-size:12px}
.menu input[type=range]{flex:1}

/* ───────── timeline page ───────── */
#v-timeline{flex-direction:column}
.tbar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--fth-line);background:var(--fth-bg2)}
.tbody{flex:1;min-height:0;display:flex}
.tmain{flex:1;min-width:0;overflow:auto;padding:30px 28px 80px}
.tnotes{width:300px;flex:none;border-left:1px solid var(--fth-line);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--fth-bg)}
.tnotes textarea{flex:1;min-height:200px}
.tsec{margin:34px 0 10px;font:700 13px var(--fth-display);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:10px;align-items:center}
.tsec::after{content:"";flex:1;height:1px;background:var(--fth-line)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{text-align:left;font:500 10px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);padding:6px 8px;border-bottom:1px solid var(--fth-line2)}
table.cmp td{padding:7px 8px;border-bottom:1px solid var(--fth-line);vertical-align:top}
table.cmp td .sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
table.cmp td.n{font-family:var(--fth-mono);font-size:12px;white-space:nowrap}

/* vertical */
.vt{display:flex;gap:0;position:relative;min-width:max-content}
.vcol{position:relative;flex:none;border-left:1px solid var(--fth-line)}
.vcol:first-child{border-left:0}
.vhead{position:sticky;top:-30px;z-index:4;height:34px;display:flex;align-items:center;padding:0 10px;background:var(--fth-bg);border-bottom:1px solid var(--fth-line2);font:600 10px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);white-space:nowrap}
.vbody{position:relative}
.vband{position:absolute;left:0;right:0;border-top:1px solid var(--fth-line)}
.vband.alt{background:color-mix(in srgb,var(--fth-surface) 55%,transparent)}
.vband.cur{background:var(--fth-accent-soft)}
.vpg{position:absolute;left:8px;right:8px;font:600 11px var(--fth-mono);color:var(--fth-muted);padding-top:4px;cursor:pointer}
.vpg:hover{color:var(--fth-accent-ink)}
.vpart{position:absolute;left:8px;width:5px;background:var(--fth-surface3);border-radius:3px}
.vcard{position:absolute;left:10px;right:10px;padding:5px 8px;border-radius:8px;background:var(--fth-surface);border:1px solid var(--fth-line);font-size:12.5px;line-height:1.4;cursor:pointer;border-left:3px solid var(--c,var(--fth-line3))}
.vcard:hover{border-color:var(--c,var(--fth-line3))}
.vcard b{font-size:12px}
.vcard small{font:500 10px var(--fth-mono);color:var(--fth-faint);display:block}
.vcard.empty{color:var(--fth-faint);background:transparent;border-style:dashed}
.vlead{position:absolute;left:2px;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--c,var(--fth-line3))}
.vbar{position:absolute;left:10px;width:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 45%,transparent)}
.vlabel{position:absolute;left:22px;right:8px;font:600 11.5px/1.25 var(--fth-display);color:var(--c)}
.vlabel small{display:block;font:500 9.5px var(--fth-mono);color:var(--fth-faint)}
.vtick{position:absolute;left:6px;width:14px;height:2px;margin-top:-1px;background:var(--c)}

/* ───────── report ───────── */
#v-report{overflow:hidden}
.rnav{width:230px;flex:none;border-right:1px solid var(--fth-line);padding:20px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.rnav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--fth-muted);text-decoration:none;font-size:13px;cursor:pointer}
.rnav a:hover{background:var(--fth-surface);color:var(--fth-text)}
.rnav a.on{background:var(--fth-surface2);color:var(--fth-text)}
.rnav a .n{font:600 10.5px var(--fth-mono);color:var(--fth-faint);width:18px}
.rnav a .st{width:7px;height:7px;border-radius:50%;margin-left:auto;border:1.5px solid var(--fth-line3)}
.rnav a .st.done{background:var(--fth-good);border-color:var(--fth-good)}
.rnav a .st.part{background:var(--fth-warn);border-color:var(--fth-warn)}
.rmain{flex:1;min-width:0;overflow:auto;padding:10px 40px 120px;scroll-behavior:smooth}
.rinner{max-width:900px;margin:0 auto}
.rsec{padding-top:18px}
.rsec>.fth-sec{margin-top:18px}
.guide{font-style:italic;color:var(--fth-faint);font-size:13px;margin:-4px 0 12px;line-height:1.5}
.rcard{padding:16px 18px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld .meta{display:flex;justify-content:space-between;gap:8px}
.auto{font:500 9.5px var(--fth-mono);color:var(--fth-accent-ink);text-transform:uppercase;letter-spacing:.06em}
.rate{width:100%;border-collapse:separate;border-spacing:0}
.rate th{font:500 10px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);text-align:center;padding:0 4px 8px;font-weight:500}
.rate th:first-child{text-align:left}
.rate td{padding:4px;border-top:1px solid var(--fth-line)}
.rate td:first-child{font-weight:600;font-size:13.5px;padding-left:0}
.rbtn{width:100%;height:30px;border-radius:8px;border:1px solid var(--fth-line2);background:var(--fth-bg2);color:var(--fth-faint);font:600 12px var(--fth-display)}
.rbtn:hover{border-color:var(--fth-line3);color:var(--fth-text)}
.rbtn.on{color:var(--fth-on-accent);border-color:transparent}
.rbtn.on.r0{background:var(--fth-good)}.rbtn.on.r1{background:color-mix(in srgb,var(--fth-good) 55%,var(--fth-warn))}.rbtn.on.r2{background:var(--fth-warn)}.rbtn.on.r3{background:var(--fth-bad)}
.rtag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:600 10.5px var(--fth-display);text-transform:none;letter-spacing:0;color:var(--fth-on-accent)}
.rtag.r0{background:var(--fth-good)}.rtag.r1{background:color-mix(in srgb,var(--fth-good) 55%,var(--fth-warn))}.rtag.r2{background:var(--fth-warn)}.rtag.r3{background:var(--fth-bad)}
.rtag.none{background:none;border:1px dashed var(--fth-line3);color:var(--fth-faint)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;border:1px solid var(--fth-line2);background:var(--fth-bg2);font-size:13px;text-align:left}
.opt:hover{border-color:var(--fth-line3)}
.opt i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fth-line3);flex:none}
.opt.on{border-color:var(--fth-accent);background:var(--fth-accent-soft)}
.opt.on i{border-color:var(--fth-accent);background:radial-gradient(circle,var(--fth-accent) 45%,transparent 50%)}
.colh{font:500 10.5px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);margin-bottom:8px}
.el{margin-bottom:14px}
.el-h{display:flex;align-items:center;gap:10px;margin:0 0 3px;font:700 15px var(--fth-display)}
.ww{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:start}
.ww .h{font:500 10px var(--fth-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fth-muted);padding-top:2px}
.ww .h.good{color:var(--fth-good)}.ww .h.bad{color:var(--fth-bad)}
.ww .rl{font:500 10px var(--fth-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fth-faint);padding-top:9px}
.ww textarea{min-height:58px;font-size:13.5px}
.pref{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fth-muted);margin-top:4px;cursor:pointer}
.smap{margin:6px 0 14px;padding:14px 16px;border-radius:12px;border:1px solid var(--fth-line);background:var(--fth-bg2)}
.smap-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.smap-h b{font:700 12px var(--fth-display);text-transform:uppercase;letter-spacing:.04em}
.smap svg{width:100%;height:auto}
.notes-t{width:100%;border-collapse:collapse}
.notes-t th{font:500 10px var(--fth-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fth-muted);text-align:left;padding:0 6px 7px;font-weight:500}
.notes-t td{padding:5px 4px;vertical-align:top;border-top:1px solid var(--fth-line)}
.notes-t textarea{min-height:64px;font-size:13px}
.notes-t td.num{font:700 13px var(--fth-mono);color:var(--fth-muted);padding-top:12px;width:26px;text-align:center}
.pri{height:30px;border-radius:8px;font-weight:700;font-size:12px;padding:0 4px}
.pri.H{color:var(--fth-bad)}.pri.M{color:var(--fth-warn)}.pri.L{color:var(--fth-good)}
.mini{display:flex;flex-direction:column;gap:2px}
.mini button{border:0;background:none;width:22px;height:20px;border-radius:5px;color:var(--fth-faint);font-size:11px}
.mini button:hover{background:var(--fth-surface3);color:var(--fth-text)}
.addrow{margin-top:8px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--fth-line);cursor:pointer}
.check input{margin-top:3px}
.check .hint{display:block;font:500 10.5px var(--fth-mono);color:var(--fth-faint);margin-top:3px}
.check .hint.ok{color:var(--fth-good)}.check .hint.no{color:var(--fth-warn)}
.revtag{font:500 10.5px var(--fth-mono);color:var(--fth-faint);margin-left:auto}

/* print */
#print{display:none}
@media print{
  @page{margin:14mm}
  body{display:block;overflow:visible;height:auto;background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11pt/1.4 var(--fth-display)}
}
.pr h1{font:800 24pt/1 var(--fth-display);font-variation-settings:"wdth" 72;text-transform:uppercase;margin:0 0 4pt}
.pr .sub{color:#555;margin:0 0 14pt;font-size:10pt}
.pr h2{font:700 12.5pt var(--fth-display);text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin:18pt 0 8pt;break-after:avoid}
.pr h3{font:700 11pt var(--fth-display);margin:12pt 0 5pt;break-after:avoid}
.pr table{width:100%;border-collapse:collapse;margin:4pt 0 8pt;break-inside:auto}
.pr th,.pr td{border:0.75pt solid #999;padding:4pt 6pt;text-align:left;vertical-align:top;font-size:9.5pt}
.pr th{background:#eee;font-weight:700}
.pr tr{break-inside:avoid}
.pr .box{border:0.75pt solid #999;padding:6pt 8pt;min-height:18pt;white-space:pre-wrap;font-size:10pt}
.pr .tick{font-weight:700}
.pr .muted{color:#666}
.pr .svgwrap{border:0.75pt solid #ccc;padding:6pt;break-inside:avoid}
.pr .svgwrap svg{width:100%;height:auto}

<script>
'use strict';
/* =====================================================================
   SCRIPT COVERAGE & FEEDBACK — Film Tool Hub
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;
const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
function h(tag, a, ...kids){
  const el = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object'){ for (const sk in v){ if (v[sk] == null) continue; if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = c => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c.nodeType ? c : document.createTextNode(String(c))); };
  kids.forEach(add);
  return el;
}

/* =====================================================================
   STORY STRUCTURES (percent of script length)
   ===================================================================== */
const STRUCTS = {
  own: {name:'Scaffolded Structure', short:'Scaffolded', beats:[
    {id:'cs1', name:'Character & Setting', sub:'Opening', fam:'cs', s:0, e:12.5,
      desc:'Establish the norm: who your character is and the world they live in. Show the flaw in action, and let us see how this setting has allowed the Lie to fester. This is the "before" picture that the closing Character & Setting will mirror.'},
    {id:'p1', name:'1st Problem', fam:'pr', s:12.5, e:12.5,
      desc:'Something disrupts the norm: a problem or an opportunity (the inciting incident). It is the first real challenge to the Lie, an invitation to adopt the Truth instead, and it should matter to this character specifically because of their flaw.'},
    {id:'c1', name:'1st Choice', fam:'ch', s:25, e:25,
      desc:'The problem forces a decision. At the end of Act 1 your character makes a defining choice that commits them and crosses a path of no return, usually in line with the Lie. The conflict of the story begins with this choice: all layers of conflict (philosophical, emotional and external) are activated.'},
    {id:'a2a', name:'1st Half of Act 2', fam:'a2', s:25, e:50,
      desc:'Living with the consequences of the first choice. The character pursues their goal, still operating by what they believe. Complications build, and the Lie may even seem to be working, but its cost is quietly mounting.'},
    {id:'mid', name:'Midpoint', fam:'mid', s:50, e:50,
      desc:'The hinge of the whole story: a False Victory, Turning Point or Realisation. Something shifts the character\'s understanding: they glimpse the Truth, or seem to win by the Lie. Everything before this is setup; everything after is payoff.'},
    {id:'a2b', name:'2nd Half of Act 2', fam:'a2', s:50, e:75,
      desc:'The fallout of the midpoint. Pressure mounts and the gap between Lie and Truth becomes impossible to ignore. Events here often mirror the first half of Act 2, now seen in a new light.'},
    {id:'p2', name:'2nd Problem', fam:'pr', s:75, e:75,
      desc:'A second, greater problem that mirrors the first, often the moment where everything falls apart. The character is tested again, but this time the true cost of the Lie is unavoidable.'},
    {id:'c2', name:'2nd Choice', fam:'ch', s:87.5, e:87.5,
      desc:'The decisive choice, mirroring the first, and the moment the conflict of the story ends. This is where theme is proven through character decision: does the character finally embrace the Truth, or cling to the Lie?'},
    {id:'cs2', name:'Character & Setting', sub:'Closing', fam:'cs', s:87.5, e:100,
      desc:'The new norm. Return to the character and their world, mirroring the opening, so the audience can measure the change (or the lack of it). The final image expresses the philosophy your story communicates.'}
  ]},
  three: {name:'3-Act Structure', short:'3-Act', beats:[
    {id:'hook', name:'Hook', fam:'cs', s:0, e:5,
      desc:'The opening grabs attention and sets the tone, genre and world. It poses a question the audience wants answered and shows us who we are following before anything changes.'},
    {id:'inc', name:'Inciting Incident', fam:'pr', s:12, e:12,
      desc:'The event that knocks the protagonist\'s ordinary world off balance and sets the story in motion. It creates the problem or opportunity the rest of the story responds to.'},
    {id:'pp1', name:'Plot Point 1', fam:'ch', s:25, e:25,
      desc:'The protagonist commits. A decision or event pushes them through a door they can\'t go back through, turning the setup into the main action of Act 2.'},
    {id:'a2a', name:'1st Half of Act 2', fam:'a2', s:25, e:50,
      desc:'Rising action. The protagonist pursues the goal using their existing approach. Obstacles and complications escalate while subplots and relationships develop.'},
    {id:'mid', name:'Midpoint', fam:'mid', s:50, e:50,
      desc:'A major shift at the centre of the story: a reversal, revelation, or false victory or defeat that raises the stakes and changes how the protagonist pursues the goal.'},
    {id:'a2b', name:'2nd Half of Act 2', fam:'a2', s:50, e:75,
      desc:'Pressure intensifies. The consequences of the midpoint close in, the opposition grows stronger, and the protagonist\'s flaws or old approach start to cost them.'},
    {id:'pp2', name:'Plot Point 2', fam:'ch', s:75, e:75,
      desc:'A second major turn, often the lowest point, that spins the story into Act 3. The protagonist finds the final piece of information or resolve they need for the confrontation.'},
    {id:'climax', name:'Climax', fam:'pr', s:90, e:90,
      desc:'The final confrontation, where the central conflict comes to a head. The protagonist faces the main obstacle directly and the dramatic question is answered.'},
    {id:'res', name:'Resolution', fam:'cs', s:95, e:100,
      desc:'The aftermath. Loose ends are tied up and we see the new normal, showing how the protagonist and their world have changed (or haven\'t).'}
  ]},
  stc: {name:'Save the Cat', full:'Blake Snyder\'s Save the Cat Beat Sheet', short:'Save the Cat', beats:[
    {id:'open', name:'Opening Image', fam:'cs', s:0, e:1,
      desc:'A single image or scene that captures the hero\'s world and problem before the story begins: the "before" snapshot that the Final Image will answer.'},
    {id:'theme', name:'Theme Stated', fam:'th', s:5, e:5,
      desc:'Someone, usually not the hero, states or hints at what the story is really about. The hero doesn\'t understand it yet.'},
    {id:'setup', name:'Set-Up', fam:'cs', s:1, e:10,
      desc:'Introduce the hero, their world, what they want and what they\'re missing. Plant the people, problems and flaws that will pay off later.'},
    {id:'cat', name:'Catalyst', fam:'pr', s:10, e:10,
      desc:'The life-changing event: news, a meeting, a loss or an opportunity that knocks the hero out of their status quo.'},
    {id:'debate', name:'Debate', fam:'pr', s:10, e:20,
      desc:'The hero hesitates. Should they go? Can they? Doubt, fear or resistance before they commit to the journey.'},
    {id:'b2', name:'Break into Two', fam:'ch', s:20, e:20,
      desc:'The hero makes a proactive choice and steps into the upside-down world of Act 2, leaving the old world behind.'},
    {id:'bstory', name:'B Story', fam:'th', s:22, e:22,
      desc:'A new character or relationship (often a love interest, mentor or friend) that carries the theme and will help the hero learn the lesson.'},
    {id:'fun', name:'Fun and Games', fam:'a2', s:20, e:50,
      desc:'The promise of the premise: the scenes the poster sells. The hero explores the new world, with successes and setbacks.'},
    {id:'mid', name:'Midpoint', fam:'mid', s:50, e:50,
      desc:'A false victory or a false defeat. The stakes are raised, time may tighten, and the A and B stories often cross.'},
    {id:'bad', name:'Bad Guys Close In', fam:'a2', s:50, e:75,
      desc:'External forces regroup and internal doubts grow. Things get steadily harder as the hero\'s team or plan starts to fall apart.'},
    {id:'lost', name:'All Is Lost', fam:'ch', s:75, e:75,
      desc:'The lowest point, and the opposite of the Midpoint. Often carries a "whiff of death": something or someone is lost.'},
    {id:'dark', name:'Dark Night of the Soul', fam:'ch', s:75, e:80,
      desc:'The hero wallows in hopelessness and reflects on everything that has happened, before the realisation that leads to the solution.'},
    {id:'b3', name:'Break into Three', fam:'pr', s:80, e:80,
      desc:'Thanks to a fresh idea, often from the B Story, the hero finds the solution and chooses to fight back.'},
    {id:'finale', name:'Finale', fam:'pr', s:80, e:99,
      desc:'The hero applies the lesson learned, confronts the opposition and transforms their world. The old world is defeated and a new one is made.'},
    {id:'final', name:'Final Image', fam:'cs', s:99, e:100,
      desc:'A mirror of the Opening Image, showing how much the hero and their world have changed.'}
  ]}
};
const SORDER = ['own', 'three', 'stc'];
for (const id of SORDER) STRUCTS[id].beats.forEach(b => { b.pt = b.s === b.e; b.anchor = b.cx != null ? b.cx : b.s; b.c = `var(--b-${b.fam})`; });
const beatOf = (st, id) => STRUCTS[st].beats.find(b => b.id === id);
const beatTitle = b => b.sub ? `${b.name} (${b.sub.toLowerCase()})` : b.name;

const KINDS = {note:'Note', strength:'Strength', issue:'Issue', question:'Question'};
const kc = k => `var(--k-${k || 'note'})`;

const ELEMENTS = [
  ['premise', 'Premise / concept', 'Premise & concept', 'Is the central idea clear, original and suited to the format? Does it deliver on its promise?'],
  ['structure', 'Structure & pacing', 'Structure & pacing', 'Where does the first real turn happen? Do setups pay off? Does anything slow the story down? Does the ending land?'],
  ['character', 'Character', 'Character', 'Does each character want something? Can you tell them apart by what they say and do? Who is the protagonist and do they change (or test their belief)?'],
  ['dialogue', 'Dialogue', 'Dialogue', 'Is each voice distinct? Does dialogue carry subtext or only information? Does anything sound unnatural or repeat itself?'],
  ['theme', 'Theme', 'Theme', 'What is the script about beneath the plot? Is it consciously built into character, structure and image, or does it appear by accident?'],
  ['tone', 'Tone & genre execution', 'Tone & genre execution', 'Does it deliver what the genre promises? Is the tone consistent? Where does tension build or leak?'],
  ['visual', 'Visual storytelling', 'Visual storytelling & format', 'Are action lines filmable (what the camera sees)? Is the script correctly formatted and the right length for its runtime?'],
  ['production', 'Production feasibility', null, null]
];
const RATINGS = ['Excellent', 'Good', 'Fair', 'Poor'];
const FLAGS = ['Large cast', 'Many locations', 'Night shoots', 'Exteriors / weather', 'Vehicles', 'Children', 'Animals', 'Stunts', 'Weapons', 'SFX / VFX', 'Period / costume', 'Crowd scenes', 'Water', 'Music rights'];
const CHECKS = [
  ['cite', 'Every note cites a page, scene or quote'],
  ['strengths', 'Strengths are included, not just problems'],
  ['pref', 'Observation and personal preference are labelled separately'],
  ['aims', 'Notes are measured against the writer\'s stated aims'],
  ['options', 'Each major problem has two or three possible options'],
  ['neutral', 'Logline and synopsis are neutral, present tense and spoiler-complete'],
  ['proof', 'Spelling and grammar checked; tone is professional and constructive']
];

/* =====================================================================
   STATE
   ===================================================================== */
function blankCov(){
  return {
    details:{title:'', writer:'', draft:'', genre:'', format:'Short', length:'', pages:'', reader:'', date:new Date().toISOString().slice(0, 10), read:'first'},
    grid:{}, rec:{project:'', writer:'', next:''}, verdict:'', logline:'', synopsis:'',
    els:Object.fromEntries(ELEMENTS.filter(e => e[2]).map(e => [e[0], {wObs:'', wEv:'', nObs:'', nEv:'', pref:false}])),
    notes:[{id:uid(), pri:'H', page:'', diag:'', why:'', opts:''}],
    revision:[{id:uid(), note:'', addr:'', ev:'', worked:''}],
    production:'', flags:[], cost:'', reflection:'', checks:{}
  };
}
function blankState(){
  return {
    v:1, mode:'coverage', view:{coverage:'script', feedback:'script'},
    struct:'own', place:{own:{}, three:{}, stc:{}}, notes:{own:{}, three:{}, stc:{}},
    comments:[], summaries:{}, kindFilter:null,
    rows:{
      coverage:{pages:true, textbook:true, outline:true, summaries:false},
      feedback:{comments:true, pages:true, summaries:true, own:false, three:false, stc:false, outline:true}
    },
    ui:{left:'summaries', leftOpen:true, rightOpen:true, strip:true, guides:true, zoom:1, orient:'h', connect:true},
    titlePage:null, lastFill:null, tlNotes:'',
    cov:blankCov()
  };
}
function merge(d, t){
  if (Array.isArray(d)) return Array.isArray(t) ? t : d;
  if (d && typeof d === 'object'){ const o = {...d}; if (t && typeof t === 'object' && !Array.isArray(t)) for (const k in t) o[k] = k in d ? merge(d[k], t[k]) : t[k]; return o; }
  return t === undefined ? d : t;
}
let S = blankState();

/* storage: the hub provides fthStore; standalone falls back to its own IndexedDB */
const store = window.fthStore || (() => {
  let p = null;
  const db = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('fth-coverage-standalone', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = (m, fn) => db().then(d => new Promise((res, rej) => { const t = d.transaction('kv', m), q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error); }));
  return {get:k => tx('readonly', s => s.get(k)).catch(() => undefined), set:(k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}), del:k => tx('readwrite', s => s.delete(k)).catch(() => {})};
})();
let saveT, ready = false;
function save(){ if (!ready) return; clearTimeout(saveT); saveT = setTimeout(() => store.set('state', JSON.parse(JSON.stringify(S))), 500); }
window.addEventListener('pagehide', () => { if (ready){ clearTimeout(saveT); store.set('state', JSON.parse(JSON.stringify(S))); } });

/* =====================================================================
   PDF + PAGE GEOMETRY
   ===================================================================== */
let pdfDoc = null, pdfName = '';
const M = {n:0, pages:[], top:.09, bot:.91, autoTitle:false, autoFill:1, analysed:false};
const titleOn = () => S.titlePage == null ? M.autoTitle : S.titlePage;
const startPg = () => titleOn() && M.n > 1 ? 2 : 1;
const NP = () => Math.max(1, M.n - (startPg() - 1));
const lastFill = () => S.lastFill == null ? M.autoFill : S.lastFill;
const LEN = () => (NP() - 1) + lastFill();
const hasPdf = () => !!pdfDoc;
function posOf(pg, y){
  const i = pg - startPg(); if (i < 0) return 0;
  const f = clamp((y - M.top) / (M.bot - M.top), 0, 1);
  return Math.min(LEN(), i + f);
}
function ptOf(pos){
  const i = clamp(Math.floor(pos), 0, NP() - 1), f = clamp(pos - i, 0, 1);
  return {pg:i + startPg(), y:M.top + f * (M.bot - M.top)};
}
const pageNo = pos => clamp(Math.floor(pos - 1e-6) + 1, 1, NP());
const pLabel = pos => 'p. ' + pageNo(pos);
const pctOf = pos => pos / LEN() * 100;
const posPct = pct => pct / 100 * LEN();
function expLabel(b){
  if (!hasPdf()) return b.pt ? `${b.s}%` : `${b.s}–${b.e}%`;
  if (b.pt) return `p. ${pageNo(Math.max(posPct(b.s), 0.01))} · ${b.s}%`;
  const a = pageNo(Math.max(posPct(b.s), 0.01)), z = pageNo(posPct(b.e));
  return (a === z ? `p. ${a}` : `pp. ${a}–${z}`) + ` · ${b.s}–${b.e}%`;
}
function placedPos(pl){ return pl ? posOf(pl.p, pl.y) : null; }
function placedEnd(pl){ return pl && pl.p2 != null ? posOf(pl.p2, pl.y2) : null; }
function diffInfo(st, b){
  const pl = S.place[st][b.id]; if (!pl || !hasPdf()) return null;
  const d = placedPos(pl) - posPct(b.anchor), tol = Math.max(0.5, LEN() * 0.02);
  const n = Math.abs(d);
  const nn = n < 10 ? +n.toFixed(1) : Math.round(n);
  const txt = n < tol ? 'on target' : `${nn} page${nn === 1 ? '' : 's'} ${d > 0 ? 'late' : 'early'}`;
  return {d, txt, cls:n < tol ? 'on' : d > 0 ? 'late' : 'early'};
}
function rangeEnd(pl){ if (!pl || pl.p2 == null) return ''; const a = pageNo(placedPos(pl)), z = pageNo(placedEnd(pl)); return z !== a ? '–' + z : ''; }
const placedCount = st => STRUCTS[st].beats.filter(b => S.place[st][b.id]).length;

async function analyse(){
  const pages = [];
  for (let i = 1; i <= pdfDoc.numPages; i++){
    const pg = await pdfDoc.getPage(i), vp = pg.getViewport({scale:1});
    let tc; try { tc = await pg.getTextContent(); } catch (e) { tc = {items:[]}; }
    const lines = new Map();
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const [x, y] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
      const key = Math.round(y / vp.height * 300);
      if (!lines.has(key)) lines.set(key, []);
      lines.get(key).push({x, s:it.str});
    }
    let minY = 1, maxY = 0, count = 0; const scenes = [];

function addRange(byPage, a, b, make){

  for (let p = a.pg; p <= b.pg; p++){
    const y0 = p === a.pg ? a.y : M.top - 0.02, y1 = p === b.pg ? b.y : M.bot + 0.02;

const ROWDEF = {

function rowsFor(mode){

  if (R.comments) out.push({type:'comments'});
  if (R.pages) out.push({type:'pages'});

  for (const st of SORDER){
    if (R[st]) out.push({type:'struct', st, label:STRUCTS[st].short});
    if (R.outline && placedCount(st)) out.push({type:'outline', st, label:'Outline', sub:STRUCTS[st].short});
  }

function lanes(items, gap){
  const ends = [];
  items.sort((a, b) => a.x0 - b.x0).forEach(it => {
    let l = ends.findIndex(e => e <= it.x0 - gap);
    if (l < 0){ l = ends.length; ends.push(0); }
    ends[l] = it.x1; it.lane = l;
  });
  return Math.max(1, ends.length);
}

function drawConnectors(wrap, svg, rows, refs, on){

  rows.forEach((r, i) => {

      const t = refs.tb[r.st + ':' + b.id], a = refs.ac[r.st + ':' + b.id]; if (!t || !a) return;
      const tr = t.el.getBoundingClientRect(), ar = a.el.getBoundingClientRect();
      const x1 = ox + t.pct / 100 * tw, y1 = tr.bottom - wr.top - (t.el.classList.contains('tl-bar') ? 0 : 1);
      const x2 = ox + a.pct / 100 * tw, y2 = ar.top - wr.top + 1;

}

/* =====================================================================

function compareSVG(st, forPrint){
  const W = 1000, padL = 92, padR = 16, tw = W - padL - padR;
  const L = hasPdf() ? LEN() : 100, x = pct => padL + clamp(pct, 0, 100) / 100 * tw;
  const ink = forPrint ? '#000' : 'var(--fth-text)', mute = forPrint ? '#666' : 'var(--fth-muted)', line = forPrint ? '#bbb' : 'var(--fth-line2)';
  const col = b => forPrint ? ({cs:'#2c8a78', pr:'#c27a1c', ch:'#c4502f', a2:'#4a6fb5', mid:'#8a5cc2', th:'#a87508'}[b.fam]) : b.c;
  const beats = STRUCTS[st].beats;
  const tbItems = beats.map(b => ({b, x0:b.s, x1:b.pt ? b.s + 1.6 : b.e}));
  const nl = lanes(tbItems, 0.1), lh = 15, tbTop = 30, tbH = nl * lh + 6;
  const acTop = tbTop + tbH + 46;
  const acItems = beats.filter(b => S.place[st][b.id]).map(b => { const pl = S.place[st][b.id], a = pctOf(placedPos(pl)); return {b, pl, a, z:pl.p2 != null ? pctOf(placedEnd(pl)) : a, x0:a, x1:pl.p2 != null ? pctOf(placedEnd(pl)) : a + 1.6}; });
  const nl2 = lanes(acItems, 0.1), acH = nl2 * lh + 6, Ht = acTop + acH + 30;
  let s = `<svg viewBox="0 0 ${W} ${Ht}" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, system-ui, sans-serif">`;
  [0, 25, 50, 75, 100].forEach(p => { s += `<line x1="${x(p)}" x2="${x(p)}" y1="18" y2="${Ht - 18}" stroke="${line}" stroke-dasharray="${p % 50 ? '2 4' : '0'}" stroke-width="1"/><text x="${x(p)}" y="12" font-size="10" text-anchor="${p === 0 ? 'start' : p === 100 ? 'end' : 'middle'}" fill="${mute}">${p}%${hasPdf() ? ' · p.' + (p === 100 ? NP() : pageNo(Math.max(posPct(p), .01))) : ''}</text>`; });
  s += `<text x="0" y="${tbTop + 11}" font-size="10.5" font-weight="700" fill="${mute}" letter-spacing=".06em">TEXTBOOK</text>`;
  s += `<text x="0" y="${acTop + 11}" font-size="10.5" font-weight="700" fill="${mute}" letter-spacing=".06em">THIS SCRIPT</text>`;
  const ty = it => tbTop + 2 + it.lane * lh, ay = it => acTop + 2 + it.lane * lh;
  acItems.forEach(it => {
    const t = tbItems.find(q => q.b === it.b);
    s += `<line x1="${x(it.b.anchor)}" y1="${ty(t) + 10}" x2="${x(it.a)}" y2="${ay(it)}" stroke="${col(it.b)}" stroke-width="1.3" stroke-dasharray="3 3"/>`;
  });
  tbItems.forEach(it => {
    const b = it.b, c = col(b), y0 = ty(it);
    if (b.pt) s += `<rect x="${x(b.s) - 4.5}" y="${y0 + 1}" width="9" height="9" transform="rotate(45 ${x(b.s)} ${y0 + 5.5})" fill="${c}"/><text x="${x(b.s) + 9}" y="${y0 + 9.5}" font-size="9.5" fill="${c}" font-weight="600">${esc(b.name)}</text>`;
    else { s += `<rect x="${x(b.s)}" y="${y0}" width="${Math.max(2, x(b.e) - x(b.s) - 1)}" height="11" rx="2.5" fill="${c}" fill-opacity=".28" stroke="${c}" stroke-opacity=".8"/>`;
      if (x(b.e) - x(b.s) > 50) s += `<text x="${x(b.s) + 4}" y="${y0 + 8.6}" font-size="8.5" font-weight="600" fill="${ink}">${esc(beatTitle(b).replace(/ \((opening|closing)\)/, ''))}</text>`; }
  });
  acItems.forEach(it => {
    const b = it.b, c = col(b), y0 = ay(it);
    if (it.pl.p2 == null) s += `<circle cx="${x(it.a)}" cy="${y0 + 5.5}" r="5" fill="${c}"/><text x="${x(it.a) + 9}" y="${y0 + 9.5}" font-size="9.5" fill="${c}" font-weight="600">${esc(b.name)}</text>`;
    else { s += `<rect x="${x(it.a)}" y="${y0}" width="${Math.max(3, x(it.z) - x(it.a))}" height="11" rx="2.5" fill="${c}"/>`;
      if (x(it.z) - x(it.a) > 50) s += `<text x="${x(it.a) + 4}" y="${y0 + 8.6}" font-size="8.5" font-weight="700" fill="#fff">${esc(beatTitle(b).replace(/ \((opening|closing)\)/, ''))}</text>`;
      else s += `<text x="${x(it.z) + 6}" y="${y0 + 9.5}" font-size="9.5" fill="${c}" font-weight="600">${esc(b.name)}</text>`; }
  });
  if (!acItems.length) s += `<text x="${padL + 6}" y="${acTop + 11}" font-size="11" fill="${mute}" font-style="italic">No beats placed yet</text>`;
  return s + '</svg>';
}

    const c = C();
    o += `<h1>Script Coverage</h1><p class="sub">${esc(title)}${d.writer ? ' · by ' + esc(d.writer) : ''}</p>`;
    o += `<h2>1. Script Details</h2><table><tr><th>Title</th><td>${esc(d.title)}</td><th>Writer</th><td>${esc(d.writer)}</td></tr><tr><th>Draft / version</th><td>${esc(d.draft)}</td><th>Genre</th><td>${esc(d.genre)}</td></tr><tr><th>Format & length</th><td>${esc(d.format)}${d.length ? ' · ' + esc(d.length) : ''}</td><th>Page count</th><td>${esc(d.pages)}</td></tr><tr><th>Reader</th><td>${esc(d.reader)}</td><th>Date of reading</th><td>${esc(d.date)}</td></tr><tr><th>Type of read</th><td colspan="3">${d.read === 'revision' ? 'Revision read (compared to earlier draft)' : 'First read'}</td></tr></table>`;
    o += `<h2>2. Overview</h2><h3>Grid</h3><table><tr><th>Element</th>${RATINGS.map(r => `<th style="text-align:center">${r}</th>`).join('')}</tr>${ELEMENTS.map(([k, l]) => `<tr><td>${l}</td>${RATINGS.map((r, i) => `<td style="text-align:center" class="tick">${c.grid[k] === i ? '✔' : ''}</td>`).join('')}</tr>`).join('')}</table>`;
    const rl = {recommend:'Recommend', consider:'Consider', pass:'Pass', draft:'Another draft before further development', ready:'Ready to move to production planning', unsuitable:'Not suitable for this format'};
    o += `<h3>Recommendation</h3><table><tr><th>Project</th><th>Writer</th><th>Next step</th></tr><tr><td>${rl[c.rec.project] || '—'}</td><td>${rl[c.rec.writer] || '—'}</td><td>${rl[c.rec.next] || '—'}</td></tr></table>`;
    o += `<h3>Summary verdict</h3><div class="box">${P(c.verdict)}</div>`;
    o += `<h2>3. Logline</h2><div class="box">${P(c.logline)}</div><h2>4. Synopsis</h2><div class="box">${P(c.synopsis)}</div>`;
    o += '<h2>5. Comments</h2>';
    ELEMENTS.filter(e => e[2]).forEach(([k, , t]) => {
      const e = c.els[k], r = c.grid[k];
      o += `<h3>${t}${r !== '' && r != null ? ` <span class="muted" style="font-weight:500">· ${RATINGS[r]}</span>` : ''}</h3>`;
      if (k === 'structure' && placedCount(S.struct)) o += `<div class="svgwrap"><div class="muted" style="font-size:9pt;margin-bottom:3pt">Structure map: ${esc(STRUCTS[S.struct].full || STRUCTS[S.struct].name)}</div>${compareSVG(S.struct, true)}</div>`;
      o += `<table><tr><th style="width:18%"></th><th>What works</th><th>What needs work${e.pref ? ' <span class="muted">(preference)</span>' : ''}</th></tr><tr><th>Observation</th><td>${P(e.wObs)}</td><td>${P(e.nObs)}</td></tr><tr><th>Evidence (page / quote)</th><td>${P(e.wEv)}</td><td>${P(e.nEv)}</td></tr></table>`;
    });
    o += `<h2>6. Key Notes, Ranked by Priority</h2><table><tr><th>#</th><th>Priority</th><th>Page / scene</th><th>Diagnosis</th><th>Why it matters</th><th>Options</th></tr>${c.notes.map((n, i) => `<tr><td>${i + 1}</td><td>${{H:'High', M:'Medium', L:'Low'}[n.pri]}</td><td>${esc(n.page)}</td><td>${P(n.diag)}</td><td>${P(n.why)}</td><td>${P(n.opts)}</td></tr>`).join('')}</table>`;
    if (d.read === 'revision') o += `<h2>7. Revision Read</h2><table><tr><th>Earlier note</th><th>Addressed?</th><th>Evidence in new draft</th><th>Did it work? Any new issue?</th></tr>${c.revision.map(r => `<tr><td>${P(r.note)}</td><td>${{yes:'Yes', partly:'Partly', no:'No'}[r.addr] || ''}</td><td>${P(r.ev)}</td><td>${P(r.worked)}</td></tr>`).join('')}</table>`;
    const n0 = 8;
    o += `<h2>${n0}. Production Considerations</h2>${c.flags.length || c.cost ? `<p class="muted">${c.flags.length ? 'Flags: ' + esc(c.flags.join(', ')) : ''}${c.flags.length && c.cost ? ' · ' : ''}${c.cost ? 'Estimated cost level: ' + esc(c.cost) : ''}</p>` : ''}<div class="box">${P(c.production)}</div>`;
    o += `<h2>${n0 + 1}. Reader's Reflection</h2><div class="box">${P(c.reflection)}</div>`;
    o += `<h2>${n0 + 2}. Reader's Checklist</h2><table>${CHECKS.map(([k, l]) => `<tr><td style="width:24pt;text-align:center" class="tick">${c.checks[k] ? '☑' : '☐'}</td><td>${esc(l)}</td></tr>`).join('')}</table>`;
  } else {
    o += `<h1>${kind === 'timeline' ? 'Script Timeline' : 'Script Feedback'}</h1><p class="sub">${esc(title)}${hasPdf() ? ` · ${NP()} pages` : ''}${d.reader ? ' · notes by ' + esc(d.reader) : ''}</p>`;
    const sts = SORDER.filter(placedCount);
    sts.forEach(st => {
      o += `<h2>Outline · ${esc(STRUCTS[st].full || STRUCTS[st].name)}</h2><div class="svgwrap">${compareSVG(st, true)}</div>`;
      o += `<table><tr><th>Beat</th><th>Expected</th><th>In this script</th><th>Difference</th><th>Notes</th></tr>${STRUCTS[st].beats.map(b => { const pl = S.place[st][b.id], di = diffInfo(st, b); return `<tr><td>${esc(beatTitle(b))}</td><td>${esc(expLabel(b).split(' · ')[0])}</td><td>${pl ? pLabel(placedPos(pl)) + rangeEnd(pl) : '—'}</td><td>${di ? di.txt : ''}</td><td>${P(S.notes[st][b.id])}</td></tr>`; }).join('')}</table>`;
    });
    if (hasPdf() && Object.values(S.summaries).some(v => (v || '').trim())) o += `<h2>Page Summaries</h2><table><tr><th style="width:44pt">Page</th><th>Summary</th></tr>${Array.from({length:NP()}, (_, i) => `<tr><td>${i + 1}</td><td>${P(S.summaries[i])}</td></tr>`).join('')}</table>`;
    const cs = sortedComments();
    const kcol = {note:'#b07a10', strength:'#22804a', issue:'#c0392b', question:'#2f6fc0'};
    if (cs.length) o += `<h2>Comments</h2><table><tr><th>#</th><th>Page</th><th>Type</th><th>Comment</th></tr>${cs.map((c, i) => `<tr><td>${i + 1}</td><td>${pLabel(cPos(c))}</td><td><span class="kind" style="background:${kcol[c.kind]}">${KINDS[c.kind]}</span></td><td>${P(c.text)}</td></tr>`).join('')}</table>`;
    if (S.tlNotes.trim()) o += `<h2>Timeline notes</h2><div class="box">${P(S.tlNotes)}</div>`;
    if (!sts.length && !cs.length) o += '<p class="muted">Nothing to print yet: add comments, page summaries or plot beats first.</p>';
  }
  printEl.innerHTML = o + '</div>';
  setTimeout(() => { if (!fthPage(DOC_KIND[kind][0], title + ' - ' + DOC_KIND[kind][1])) window.print(); }, 60);
}

/* =====================================================================
   MODE / VIEW / SETTINGS / INIT
   ===================================================================== */
const VIEWS = {coverage:[['script', 'Script & Structure'], ['report', 'Coverage Report'], ['timeline', 'Timeline']], feedback:[['script', 'Script'], ['timeline', 'Timeline']]};
function curView(){ return S.view[S.mode]; }
function setMode(m){ if (placing) cancelPlacing(); S.mode = m; save(); renderAll(); }
function setView(v){ S.view[S.mode] = v; save(); renderViews(); }
function renderHeader(){
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('.fth-title').textContent = S.mode === 'coverage' ? 'Script Coverage' : 'Script Feedback';
  $('#docName').textContent = pdfName; $('#docName').title = pdfName;
}
function renderViews(){
  const v = curView();
  const tabs = $('#viewTabs'); tabs.innerHTML = '';
  VIEWS[S.mode].forEach(([k, l]) => tabs.append(h('button', {class:k === v ? 'on' : '', onclick:() => setView(k)}, l)));
  ['script', 'report', 'timeline'].forEach(k => $('#v-' + k).classList.toggle('on', k === v));
  if (v === 'report') renderReport();
  if (v === 'timeline') renderTimelinePage();
  if (v === 'script'){ renderStrip(); if (pdfDoc) requestAnimationFrame(() => { applyZoom(); const r = visibleRange(); if (r) updateWin(r); }); }
}
function renderPanelBtns(){
  const l = $('#openLeft'), r = $('#openRight');
  l.hidden = S.ui.leftOpen; r.hidden = S.mode !== 'feedback' || S.ui.rightOpen;
}
function renderAll(){
  document.body.classList.toggle('mode-feedback', S.mode === 'feedback');
  document.body.classList.toggle('mode-coverage', S.mode === 'coverage');
  if (!VIEWS[S.mode].some(([k]) => k === curView())) S.view[S.mode] = 'script';
  renderHeader(); renderLeft(); renderRight(); renderPanelBtns(); renderOverlays(); renderViews();
}
$$('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#uploadBtn').addEventListener('click', () => fileIn.click());
$('#projIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importProject(f); });
$('#dropBtn').addEventListener('click', () => fileIn.click());
$('#printBtn').addEventListener('click', () => doPrint(S.mode === 'coverage' ? 'coverage' : 'feedback'));
if (window.fthDocs) window.fthDocs.attach($('#docBtn'), ['coverage', 'feedback', 'timeline'].map(k => ({label: DOC_KIND[k][0], fn: () => doPrint(k)})));
$('#openLeft').addEventListener('click', () => togglePanel('left'));
$('#openRight').addEventListener('click', () => togglePanel('right'));
$('#zIn').addEventListener('click', () => { S.ui.zoom = clamp(+(S.ui.zoom + 0.1).toFixed(2), 0.5, 2.5); save(); applyZoom(); });
$('#zOut').addEventListener('click', () => { S.ui.zoom = clamp(+(S.ui.zoom - 0.1).toFixed(2), 0.5, 2.5); save(); applyZoom(); });
$('#zFit').addEventListener('click', () => { S.ui.zoom = 1; save(); applyZoom(); });
const dropEl = $('#drop');
['dragenter', 'dragover'].forEach(ev => scroller.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => scroller.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('over'); }));
scroller.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) openFile(f); });

let menuEl = null;
function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
$('#settingsBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (menuEl){ closeMenu(); return; }
  const r = e.currentTarget.getBoundingClientRect();
  const fillOut = h('span', {class:'fth-mono', style:{fontSize:'11px', width:'40px', textAlign:'right'}}, Math.round(lastFill() * 100) + '%');
  menuEl = h('div', {class:'menu', style:{top:(r.bottom + 6) + 'px', right:Math.max(8, innerWidth - r.right) + 'px'}, onclick:e => e.stopPropagation()},
    h('h4', null, 'Script settings'),
    hasPdf() ? [
      h('label', {class:'row toggle', style:{color:'var(--fth-text)'}}, h('span', null, 'First page is a title page', h('br'), h('small', {class:'fth-muted'}, M.autoTitle ? 'Detected automatically' : 'Not detected')), h('input', {type:'checkbox', checked:titleOn() ? 'checked' : null, onchange:e => { S.titlePage = e.target.checked; measure(); save(); afterGeometry(); }})),
      h('div', null, h('div', {class:'row'}, h('span', null, 'Length of the last page'), fillOut),
        h('div', {class:'row'}, h('input', {type:'range', min:5, max:100, step:5, value:Math.round(lastFill() * 100), oninput:e => { S.lastFill = +e.target.value / 100; fillOut.textContent = e.target.value + '%'; save(); afterGeometry(); }}),
          h('button', {class:'fth-btn sm ghost', onclick:() => { S.lastFill = null; save(); afterGeometry(); closeMenu(); }}, 'Auto')),
        h('p', null, `Measured from the text: ${Math.round(M.autoFill * 100)}%. The script runs ${(+LEN().toFixed(2))} pages, which sets where every textbook beat should fall.`))
    ] : h('p', null, 'Upload a script to adjust page settings.'),
    h('div', {style:{borderTop:'1px solid var(--fth-line2)', paddingTop:'10px', display:'flex', flexDirection:'column', gap:'8px'}},
      h('h4', null, 'Project file'),
      h('p', null, HUB ? 'Your work saves with the current Hub project. You can also export it as a file to share or back up.' : 'Export everything (script, notes, beats and report) as a .json file, and open it again later.'),
      h('div', {class:'row', style:{justifyContent:'flex-start', gap:'6px'}},
        h('button', {class:'fth-btn sm', onclick:() => { closeMenu(); exportProject(); }}, 'Export project (.json)'),
        h('button', {class:'fth-btn sm ghost', onclick:() => { closeMenu(); $('#projIn').click(); }}, 'Import project'))),
    h('div', {class:'row', style:{borderTop:'1px solid var(--fth-line2)', paddingTop:'10px'}}, h('span', null, 'Remove the script PDF'),
      h('button', {class:'fth-btn sm danger', disabled:!hasPdf() || null, onclick:() => { if (!confirm('Remove the script PDF? Your notes stay.')) return; store.del('pdf'); pdfDoc = null; pdfName = ''; M.n = 0; pageEls = []; pagesEl.innerHTML = ''; dropEl.hidden = false; $('#zoomDock').hidden = true; closeMenu(); renderAll(); }}, 'Remove')));
  document.body.append(menuEl);
});
document.addEventListener('click', closeMenu);
function afterGeometry(){ renderOverlays(); renderStrip(); renderLeft(); renderRight(); if (curView() !== 'script') renderViews(); }

(async function init(){
  const saved = await store.get('state');
  if (saved && typeof saved === 'object') S = merge(blankState(), saved);
  if (!window.fthStore && !saved){ S.mode = 'coverage'; }
  ready = true;
  renderAll();
  const pdf = await store.get('pdf');
  if (pdf && pdf.bytes) await loadPdf(pdf.bytes, pdf.name, false);
})();


</script>
</body>
</html>
