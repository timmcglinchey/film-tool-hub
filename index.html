<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film Tool Hub</title>
<script>(function(){var t;try{t=localStorage.getItem('filmtoolhub-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t='dark'}document.documentElement.setAttribute('data-theme',t);window.__fthTheme=t})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub/hub.css">
</head>
<body>

<header id="bar">
  <button class="brand" id="homeBtn" title="Back to all tools">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="fa" x="3" y="12" width="26" height="16" rx="2.5"/><path class="fa" d="M3.6 6.4 28 2l1 5.4L4.6 11.8z"/><path class="sb" d="M8.2 5.6l4 5.4M14.6 4.5l4 5.4M21 3.3l4 5.4" stroke-width="2.6"/><rect class="fb" x="7" y="17" width="12" height="2.4" rx="1.2"/><rect x="7" y="21.6" width="8" height="2.4" rx="1.2" fill="#ffb547"/></svg>
    <b>Film Tool <i>Hub</i></b>
  </button>
  <div class="sep"></div>
  <button class="projbtn" id="projBtn" aria-haspopup="menu" aria-expanded="false" title="Switch project"><span class="pl">Project</span><b id="projName">…</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>
  <div class="sep"></div>
  <nav id="tabs" aria-label="Open tools"></nav>
  <div id="barActions"></div>
  <button class="ibtn savebtn" id="saveBtn" title="Save this project (Ctrl/⌘+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span class="t" id="saveLbl">Save</span><i class="dot"></i></button>
  <button class="ibtn sharebtn" id="shareBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.6 6-5.6s6 2.4 6 5.6"/><path d="M18.5 8v6M15.5 11h6"/></svg><span class="t" id="shareLbl">Share</span></button>
  <button class="ibtn acct" id="acctBtn" hidden></button>
  <button class="ibtn" id="themeBtn" title="Switch light / dark theme for the hub and every tool" aria-label="Toggle light or dark theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    <span class="t" id="themeLbl">Dark</span>
  </button>
</header>

<main id="home">
  <div class="wrap">
    <section class="hero">
      <div>
        <div class="slate" aria-hidden="true"></div>
        <p class="eyebrow"><span>Pipelines</span><span>Technique</span><span>Writing</span><span>Planning</span><span>Shoot day</span></p>
        <h1>Film Tool<br><em>Hub</em></h1>
        <p class="lede">Every builder, planner and template in one place, from first draft to call sheet. Click a tool to open it here. Right-click to open it in a new tab.</p>
      </div>
      <div class="hero-side">
        <div class="counter" id="counter"></div>
        <div class="hero-actions">
          <button class="btn ghost" id="helpBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17.2" r=".4" fill="currentColor"/></svg>How it works</button>
          <button class="btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add tool</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="Search tools" autocomplete="off" aria-label="Search tools">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by stage"></div>
    </div>

    <div id="projStrip"></div>
    <div id="banner"></div>
    <div id="sections"></div>

    <footer class="foot">
      <a class="lnk" href="privacy.html">Privacy policy</a>
      <span id="storeNote"></span>
      <span class="sp"></span>
      <button class="lnk" id="restoreBtn" hidden></button>
      <button class="lnk" id="resetBtn" hidden>Discard all changes made in this browser</button>
    </footer>
  </div>
</main>

<div id="workspace" hidden><div id="lockBar" hidden></div></div>
<div id="reqCard" role="alertdialog" aria-live="assertive" hidden></div>
<div id="menu" role="menu" hidden></div>
<div id="pmenu" class="pmenu" role="menu" hidden></div>
<div id="amenu" class="pmenu amenu" role="menu" hidden></div>
<div id="drop" hidden><div>Drop an HTML file to add it, or drop it on a tool to update it</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept=".html,.htm,text/html" hidden>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>

<script src="hub/hub.js"></script>
</body>
</html>
